# Local development infrastructure for the DIALs platform.
# Services and apps run on the host (`pnpm dev`) and reach these on localhost.
# Host ports are offset where common local installs clash (Postgres, Valkey).
name: adili

x-healthcheck-defaults: &healthcheck-defaults
  interval: 5s
  timeout: 5s
  retries: 60
  start_period: 10s

# One-shot init jobs that exit once done. The label is how scripts/lib/compose.sh tells them
# from long-running services: infra-up runs them last, infra-health requires exit code 0.
x-init-job: &init-job
  restart: on-failure:5
  labels: { adili.init-job: 'true' }

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
    command: ['postgres', '-c', 'max_connections=300']
    ports: ['55432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      <<: *healthcheck-defaults
      test: ['CMD-SHELL', 'pg_isready -U postgres']

  valkey:
    image: valkey/valkey:9.0.6-alpine
    command: ['valkey-server', '--appendonly', 'yes']
    ports: ['56379:6379']
    volumes: [valkey-data:/data]
    healthcheck:
      <<: *healthcheck-defaults
      test: ['CMD', 'valkey-cli', 'ping']

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    hostname: rabbitmq
    # Official image starts as root, chowns /var/lib/rabbitmq, then drops to rabbitmq.
    # Do not set `user:` or mount only `mnesia/` - Ra cannot create its data dir.
    # The healthcheck execs as root, and the CLI creates the Erlang cookie in HOME
    # (/var/lib/rabbitmq) when the broker has not yet: root-owned, the broker cannot read it
    # and exits on its first start (eacces). It runs as rabbitmq, so the cookie is the broker's.
    environment:
      RABBITMQ_DEFAULT_USER: adili
      RABBITMQ_DEFAULT_PASS: adili_dev
    ports: ['55672:5672', '15672:15672']
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      <<: *healthcheck-defaults
      test: ['CMD', 'su-exec', 'rabbitmq', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']

  temporal-schema:
    image: temporalio/admin-tools:1.32.0
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      SQL_PASSWORD: temporal_dev
    volumes: [./temporal/setup-schema.sh:/scripts/setup-schema.sh:ro]
    entrypoint: ['/bin/sh', '/scripts/setup-schema.sh']
    <<: *init-job

  temporal:
    image: temporalio/server:1.32.0
    depends_on:
      temporal-schema: { condition: service_completed_successfully }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal_dev
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports: ['7233:7233']
    volumes: [./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro]
    healthcheck:
      <<: *healthcheck-defaults
      test: ['CMD', 'nc', '-z', 'localhost', '7233']

  temporal-namespace:
    image: temporalio/admin-tools:1.32.0
    depends_on:
      temporal: { condition: service_healthy }
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: adili
    volumes: [./temporal/create-namespace.sh:/scripts/create-namespace.sh:ro]
    entrypoint: ['/bin/sh', '/scripts/create-namespace.sh']
    <<: *init-job

  temporal-ui:
    image: temporalio/ui:2.54.1
    depends_on:
      temporal: { condition: service_healthy }
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_DEFAULT_NAMESPACE: adili
    ports: ['8233:8080']

  keycloak:
    # Keycloak plus the Adili login and email themes from apps/keycloak-theme.
    image: adili/keycloak:dev
    build:
      context: ../..
      dockerfile: infra/docker/keycloak.Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
    # Import is skip-if-exists, so infra:up stays idempotent. Recreate the
    # realm (infra:reset, or delete adili in the admin console) after edits.
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_dev
      # One issuer for browsers, host processes and containers.
      KC_HOSTNAME: http://localhost:8080
      KC_HEALTH_ENABLED: 'true'
      # Where the login theme sends staff and declarants to sign in (apps/keycloak-theme).
      ADILI_CONSOLE_URL: http://localhost:3020
      ADILI_PORTAL_URL: http://localhost:3010
      # Where the adili-otp authenticator sends sign-in codes: the notifications service on the host.
      ADILI_NOTIFICATIONS_URL: http://host.docker.internal:4010
      # Demo sign-in (#616): demo accounts sign in from a signed ticket with no password or code.
      # Off unless set (ADILI_DEMO_MODE=true pnpm infra:up); the Azure demo host turns it on.
      ADILI_DEMO_MODE: ${ADILI_DEMO_MODE:-false}
    # Podman resolves host.docker.internal itself; Docker on Linux needs the mapping.
    extra_hosts: ['host.docker.internal:host-gateway']
    ports: ['8080:8080']
    volumes:
      - ./keycloak/adili-realm.json:/opt/keycloak/data/import/adili-realm.json:ro
      # Development-only secrets for the file vault, never deployed (realm expressions such as
      # ${vault.keycloak-extension-secret}). Deployments mount their own.
      - ./keycloak/vault-dev:/opt/keycloak/vault:ro
    healthcheck:
      <<: *healthcheck-defaults
      start_period: 30s
      # The image has no curl; probe the management port with bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    # CORS: browsers PUT uploads straight to storage (ADR-002), from the portal and console only.
    # Volume slots: each bucket grows 7 volumes on its first write. Left at 0, -volume.max is
    # free disk / volume size, which on a small disk (e.g. a CI runner) leaves the clean bucket
    # none. Volumes are sparse, so a fixed count costs no disk up front.
    command:
      [
        'server',
        '-dir=/data',
        '-s3',
        '-s3.config=/etc/seaweedfs/s3.json',
        '-s3.allowedOrigins=http://localhost:3010,http://localhost:3020',
        '-master.volumeSizeLimitMB=1024',
        '-volume.max=64',
      ]
    environment:
      # SSE-S3 key for the documents service's clean-bucket copies. A dev-only secret: SeaweedFS
      # derives the key-encryption key from it (HKDF-SHA256). Production uses Ceph RGW with
      # keys from OpenBao (ADR-002).
      WEED_S3_SSE_KEY: adili-dev-sse-key
    ports: ['8333:8333', '9333:9333']
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      <<: *healthcheck-defaults
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && nc -z 127.0.0.1 8333',
        ]

  seaweedfs-buckets:
    image: chrislusf/seaweedfs:4.47
    depends_on:
      seaweedfs: { condition: service_healthy }
    volumes: [./seaweedfs/create-buckets.sh:/scripts/create-buckets.sh:ro]
    entrypoint: ['/bin/sh', '/scripts/create-buckets.sh']
    <<: *init-job

  openbao:
    image: openbao/openbao:2.7.0
    command: ['server', '-dev', '-dev-listen-address=0.0.0.0:8200']
    environment:
      BAO_DEV_ROOT_TOKEN_ID: adili-dev-root-token
    cap_add: [IPC_LOCK]
    ports: ['8200:8200']
    healthcheck:
      <<: *healthcheck-defaults
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8200/v1/sys/health']

  openbao-keys:
    image: openbao/openbao:2.7.0
    depends_on:
      openbao: { condition: service_healthy }
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: adili-dev-root-token
    volumes: [./openbao/create-transit-keys.sh:/scripts/create-transit-keys.sh:ro]
    entrypoint: ['/bin/sh', '/scripts/create-transit-keys.sh']
    <<: *init-job

  # Demo root CA and the documents signing keys and certificate (ADR-010). OpenBao runs in dev
  # mode (in memory), so every `infra:up` after a restart generates a fresh demo root.
  openbao-demo-ca:
    image: openbao/openbao:2.7.0
    depends_on:
      openbao: { condition: service_healthy }
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: adili-dev-root-token
    volumes: [./openbao/create-demo-ca.sh:/scripts/create-demo-ca.sh:ro]
    entrypoint: ['/bin/sh', '/scripts/create-demo-ca.sh']
    <<: *init-job

  clamav:
    image: clamav/clamav:1.5-debian
    ports: ['3310:3310']
    volumes: [clamav-data:/var/lib/clamav]
    healthcheck:
      <<: *healthcheck-defaults
      # First start downloads the signature database.
      start_period: 300s
      test: ['CMD', 'clamdcheck.sh']

  gotenberg:
    image: gotenberg/gotenberg:8.37
    ports: ['3300:3000']
    healthcheck:
      <<: *healthcheck-defaults
      test: ['CMD', 'curl', '-sf', 'http://127.0.0.1:3000/health']

  mailpit:
    image: axllent/mailpit:v1.31.2
    ports: ['1025:1025', '8025:8025']
    healthcheck:
      <<: *healthcheck-defaults
      test: ['CMD', '/mailpit', 'readyz']

  otel-collector:
    # Image is FROM scratch: no shell, so no in-container healthcheck.
    # The collector exposes a health_check extension on 13133 inside the network.
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ['--config=/etc/otelcol/collector.yaml']
    ports: ['4317:4317', '4318:4318']
    volumes: [./otel/collector.yaml:/etc/otelcol/collector.yaml:ro]

volumes:
  postgres-data:
  valkey-data:
  rabbitmq-data:
  seaweedfs-data:
  clamav-data:
