[SERVICE]
    Daemon          off
    Flush           1
    Log_Level       info
    Parsers_File    parsers.conf

[INPUT]
    Name            systemd
    Tag             adili.apps
    Systemd_Filter  _SYSTEMD_UNIT=adili-apps.service
    Read_From_Tail  On
    DB              /var/lib/fluent-bit/journal.db
    Mem_Buf_Limit   20MB

[FILTER]
    Name    lua
    Match   adili.apps
    script  /fluent-bit/etc/service.lua
    call    set_service

# One tag per service. The exporter stamps every line in a batch with the
# resource of the first line, so mixed services must not share a batch.
[FILTER]
    Name          rewrite_tag
    Match         adili.apps
    Rule          $service_name ^([A-Za-z0-9_-]+)$ svc.$1 false
    Emitter_Name  service_tag

[OUTPUT]
    Name                            opentelemetry
    Match                           svc.*
    Host                            signoz-ingester
    Port                            4318
    Logs_uri                        /v1/logs
    logs_body_key                   MESSAGE
    logs_body_key_attributes        On
    logs_severity_text_message_key  severity_text
    Tls                             Off
