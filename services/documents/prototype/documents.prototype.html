<!doctype html>
<!-- PROTOTYPE - throwaway. Question: what do the PDFs Adili issues look like (A4 pages, letterhead, verification footer with QR and code, signature appearance, classification marking, revoked / superseded / preview states)? Covers tickets #135 #143 #156 #194 #218, spec 10 access documents (#258 #260 #265 #269 #304) and the spec 09b open-data manifest (#297). Open by double-clicking. State is in memory. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dials - Documents (prototype)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../../packages/ui/prototype/kit.css" />
    <style>
      /* ---------- viewer chrome ---------- */
      .vwrap {
        min-height: 100%;
        background: #e6e4e0;
      }
      .vhead {
        position: sticky;
        top: 0;
        z-index: 20;
        background: var(--surface);
        box-shadow: 0 1px 0 var(--line);
      }
      .vbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        min-height: 56px;
      }
      .vtitle {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        flex: 1;
      }
      .vtitle h1 {
        font-size: 15px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .vsep {
        width: 1px;
        height: 22px;
        background: var(--line);
        margin: 0 4px;
      }
      .vgroup {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .zlab,
      .pgind {
        font-size: 13px;
        color: var(--ink-2);
        font-variant-numeric: tabular-nums;
        text-align: center;
        white-space: nowrap;
      }
      .zlab {
        min-width: 56px;
        height: 34px;
        border: 0;
        background: none;
        border-radius: var(--r-sm);
        cursor: pointer;
      }
      .zlab:hover {
        background: var(--sunken);
      }
      .pgind {
        min-width: 86px;
      }
      .vstrip {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        border-top: 1px solid var(--line);
        background: var(--bg);
        overflow-x: auto;
        scrollbar-width: none;
      }
      .vstrip .lab {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .vstrip .seg {
        flex: none;
      }
      .tog {
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 36px;
        padding: 0 12px;
        border: 0;
        border-radius: 10px;
        background: var(--sunken);
        font-size: 13.5px;
        font-weight: 500;
        color: var(--ink-2);
        cursor: pointer;
      }
      .tog .box {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        box-shadow: inset 0 0 0 1.5px var(--line-2);
        background: var(--surface);
        display: grid;
        place-items: center;
        color: #fff;
      }
      .tog.on .box {
        background: var(--ink);
        box-shadow: none;
      }
      .vbody {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: start;
      }
      .vcol {
        min-width: 0;
        overflow-x: auto;
      }
      .vnote {
        max-width: 794px;
        margin: 20px auto 0;
        padding: 0 24px;
      }
      .vnote .callout {
        align-items: center;
      }
      .vnote .callout .btn {
        margin-left: auto;
        flex: none;
      }
      .pages {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 20px 24px 120px;
      }
      .props {
        width: 300px;
        margin: 20px 16px 20px 0;
        position: sticky;
        top: 124px;
      }
      .props .card-head {
        padding: 14px 16px;
      }
      .pkv {
        display: grid;
        gap: 12px;
        padding: 14px 16px 16px;
        font-size: 13.5px;
      }
      .drawer-body .pkv {
        padding: 0;
      }
      .pkv .k {
        font-size: 12px;
        color: var(--muted);
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .pkv .v {
        margin-top: 2px;
        overflow-wrap: anywhere;
      }
      .pkv .hash {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 11.5px;
        line-height: 1.45;
        color: var(--ink-2);
      }
      .pkv .code {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 12.5px;
        font-weight: 600;
      }
      .copyline {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .copyline .icon-btn {
        width: 28px;
        height: 28px;
      }
      @container app (max-width: 1099px) {
        .props {
          display: none;
        }
      }
      @container app (max-width: 699px) {
        .vbar {
          flex-wrap: wrap;
          padding: 8px 10px;
          gap: 4px;
        }
        .vtitle {
          flex-basis: calc(100% - 50px);
        }
        .hide-m {
          display: none !important;
        }
        .vbar .vtools {
          width: 100%;
          justify-content: space-between;
        }
        .pages {
          padding: 12px 8px 120px;
          gap: 12px;
        }
        .vnote {
          padding: 0 10px;
          margin-top: 12px;
        }
        .vnote .callout {
          flex-wrap: wrap;
          align-items: flex-start;
        }
        .vnote .callout .vn-t {
          flex: 1 1 calc(100% - 40px);
          min-width: 0;
        }
        .vnote .callout .btn {
          margin-left: 29px;
        }
      }
      .vtools {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      /* ---------- index ---------- */
      .idx {
        max-width: 1180px;
        margin: 0 auto;
        padding: 32px 24px 120px;
      }
      .idx h1 {
        font-size: 26px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      .idx .sub {
        color: var(--muted);
        font-size: 14px;
        margin-top: 4px;
      }
      .grp {
        margin-top: 28px;
      }
      .grp h2 {
        font-size: 12.5px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        font-weight: 600;
        margin-bottom: 12px;
      }
      .dgrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 16px;
      }
      .dcard {
        background: var(--surface);
        border-radius: var(--r-lg);
        box-shadow: var(--shadow-card);
        overflow: hidden;
        text-decoration: none;
        color: inherit;
        display: flex;
        flex-direction: column;
        cursor: pointer;
        transition:
          box-shadow 0.15s,
          transform 0.15s;
      }
      .dcard:hover {
        box-shadow: var(--shadow-pop);
        transform: translateY(-1px);
      }
      .dcard:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      .thumb {
        height: 228px;
        background: #e6e4e0;
        display: flex;
        justify-content: center;
        padding-top: 18px;
        overflow: hidden;
        position: relative;
      }
      .thumb::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 40px;
        background: linear-gradient(rgba(230, 228, 224, 0), #e6e4e0);
      }
      .thumb .tz {
        zoom: 0.25;
        pointer-events: none;
      }
      .thumb .page {
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.16);
      }
      .dc-b {
        padding: 12px 14px 14px;
        display: grid;
        gap: 6px;
      }
      .dc-t {
        font-weight: 600;
        font-size: 14.5px;
        line-height: 1.3;
      }
      .dc-m {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        font-size: 12.5px;
        color: var(--muted);
      }
      .lvl {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 22px;
        padding: 0 8px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        background: var(--sunken);
        color: var(--ink-2);
      }
      .lvl.confidential {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .dc-tk {
        margin-left: auto;
      }
      @container app (max-width: 699px) {
        .dc-tk {
          display: none;
        }
        .idx {
          padding: 22px 14px 120px;
        }
        .dgrid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 10px;
        }
        .thumb {
          height: 170px;
          padding-top: 12px;
        }
        .thumb .tz {
          zoom: 0.19;
        }
      }

      /* ---------- A4 page ---------- */
      .page {
        width: 210mm;
        height: 297mm;
        flex: none;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        padding: 14mm 18mm 0;
        background: #fff;
        color: #1a1a1a;
        font-size: 9.6pt;
        line-height: 1.45;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.06),
          0 10px 30px -10px rgba(0, 0, 0, 0.22);
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        font-feature-settings: 'cv11', 'ss01';
      }
      .page p {
        margin: 0 0 3mm;
      }
      .page .pb {
        flex: 1;
        min-height: 0;
        position: relative;
        z-index: 1;
      }
      .page .nw {
        white-space: nowrap;
      }
      .page .mono,
      .page .code {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        letter-spacing: 0.01em;
      }
      .mk-top {
        position: absolute;
        top: 5.5mm;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 7.5pt;
        font-weight: 700;
        letter-spacing: 0.32em;
        color: #1a1a1a;
      }
      .confidential .mk-top,
      .confidential .pf-mark {
        color: #b3241a;
      }
      /* letterhead */
      .lh {
        display: flex;
        align-items: center;
        gap: 5mm;
        padding-bottom: 4mm;
        border-bottom: 0.45mm solid #1a1a1a;
        position: relative;
      }
      .lh::after {
        content: '';
        position: absolute;
        left: 0;
        bottom: -0.45mm;
        width: 24mm;
        height: 0.9mm;
        background: #e95a24;
      }
      .seal {
        width: 17mm;
        height: 17mm;
        flex: none;
        border-radius: 50%;
        border: 0.5mm solid #1a1a1a;
        display: grid;
        place-items: center;
        position: relative;
      }
      .seal::before {
        content: '';
        position: absolute;
        inset: 1.2mm;
        border-radius: 50%;
        border: 0.25mm dashed #9a9894;
      }
      .seal span {
        font-weight: 800;
        font-size: 8pt;
        letter-spacing: 0.03em;
      }
      .lh .rok {
        font-size: 6.8pt;
        letter-spacing: 0.22em;
        color: #6f6e6b;
        font-weight: 600;
        text-transform: uppercase;
      }
      .lh .org {
        font-size: 14pt;
        font-weight: 700;
        line-height: 1.2;
        margin: 0.6mm 0 0.8mm;
      }
      .lh .addr {
        font-size: 7.4pt;
        color: #4a4a48;
        line-height: 1.4;
      }
      .meta {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8mm;
        margin: 6mm 0 6mm;
      }
      .meta address {
        font-style: normal;
        line-height: 1.5;
      }
      .refs {
        display: grid;
        grid-template-columns: auto auto;
        gap: 0.8mm 4mm;
        margin: 0;
        align-content: start;
        font-size: 9pt;
      }
      .refs dt {
        color: #6f6e6b;
      }
      .refs dd {
        margin: 0;
        font-weight: 500;
      }
      .subj {
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        text-decoration: underline;
        text-underline-offset: 1.2mm;
        text-decoration-thickness: 0.3mm;
        margin: 0 0 4mm;
        font-size: 9.8pt;
        line-height: 1.45;
      }
      .page h2 {
        font-size: 11pt;
        font-weight: 700;
        margin: 5mm 0 2.5mm;
      }
      .page h3 {
        font-size: 9.8pt;
        font-weight: 700;
        margin: 4mm 0 2mm;
      }
      .doc-h {
        margin: 7mm 0 5mm;
      }
      .doc-h .t1 {
        font-size: 17pt;
        font-weight: 700;
        letter-spacing: -0.01em;
        line-height: 1.2;
      }
      .doc-sub {
        color: #4a4a48;
        font-size: 10pt;
        margin-top: 1mm;
      }
      .fine {
        font-size: 8.2pt;
        color: #4a4a48;
      }
      .muted2 {
        color: #6f6e6b;
      }
      /* fact tables (letters) */
      .facts {
        width: 100%;
        border-collapse: collapse;
        margin: 1mm 0 5mm;
      }
      .facts th,
      .facts td {
        text-align: left;
        vertical-align: top;
        padding: 2.4mm 0;
        border-top: 0.25mm solid #e2e0dc;
      }
      .facts tr:last-child th,
      .facts tr:last-child td {
        border-bottom: 0.25mm solid #e2e0dc;
      }
      .facts th {
        width: 38mm;
        padding-right: 4mm;
        font-weight: 600;
        color: #4a4a48;
      }
      .facts td p:last-child {
        margin: 0;
      }
      .big-date {
        font-size: 12pt;
        font-weight: 700;
      }
      .banner {
        display: flex;
        gap: 3mm;
        align-items: center;
        padding: 3mm 4mm;
        border-radius: 1.6mm;
        margin: 0 0 5mm;
        font-weight: 600;
      }
      .banner.warn {
        background: #fdf4e2;
        color: #6e4000;
      }
      .banner.danger {
        background: #fdeceb;
        color: #8a1c14;
      }
      .banner.ok {
        background: #e9f6ee;
        color: #0f5a2c;
      }
      .banner .s {
        font-weight: 400;
        display: block;
        font-size: 8.6pt;
      }
      .outcome {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 1mm 5mm;
        align-items: center;
        padding: 4mm 5mm;
        border-radius: 2mm;
        margin: 1mm 0 5mm;
        border: 0.3mm solid;
      }
      .outcome .ic {
        grid-row: span 2;
        width: 10mm;
        height: 10mm;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #fff;
      }
      .outcome .lbl {
        font-size: 7.6pt;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .outcome .v {
        font-size: 14pt;
        font-weight: 700;
        line-height: 1.2;
      }
      .outcome.ok {
        border-color: #b9dfc6;
        background: #f3faf5;
      }
      .outcome.ok .ic {
        background: #167a3e;
      }
      .outcome.danger {
        border-color: #f1c2be;
        background: #fdf5f4;
      }
      .outcome.danger .ic {
        background: #c9291e;
      }
      .outcome.warn {
        border-color: #ecd3a3;
        background: #fefaf1;
      }
      .outcome.warn .ic {
        background: #9a5a00;
      }
      /* clarification items */
      .items {
        list-style: none;
        padding: 0;
        margin: 2mm 0 0;
        display: grid;
        gap: 4mm;
      }
      .items li {
        display: grid;
        grid-template-columns: 7mm 1fr;
        gap: 0 2mm;
        padding: 3.5mm 4mm 3.5mm 3mm;
        border: 0.25mm solid #e2e0dc;
        border-radius: 1.6mm;
        break-inside: avoid;
      }
      .items .n {
        margin-top: 0.1mm;
        width: 6mm;
        height: 6mm;
        border-radius: 50%;
        background: #1a1a1a;
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 7.6pt;
        font-weight: 700;
      }
      .items .it {
        font-weight: 600;
      }
      .items .req {
        display: inline-block;
        margin: 1mm 0 1.5mm;
        padding: 0.4mm 2mm;
        border-radius: 1mm;
        background: #fdf0e9;
        color: #8a3a10;
        font-size: 8pt;
        font-weight: 600;
      }
      .items p {
        margin: 0;
      }
      .steps {
        margin: 0 0 4mm;
        padding-left: 5mm;
      }
      .steps li {
        margin-bottom: 1.2mm;
      }
      /* signature */
      .sign {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: end;
        gap: 6mm;
        margin-top: 7mm;
        break-inside: avoid;
      }
      .sign .nm {
        font-weight: 700;
        margin-top: 9mm;
      }
      .sigbox {
        display: flex;
        gap: 2.5mm;
        align-items: flex-start;
        width: 72mm;
        padding: 2.5mm 3mm;
        border: 0.3mm solid #9ccfaf;
        background: #f3faf5;
        border-radius: 1.4mm;
        font-size: 7.2pt;
        line-height: 1.4;
        color: #1f3d2a;
      }
      .sigbox svg {
        flex: none;
        color: #167a3e;
        margin-top: 0.3mm;
      }
      .sigbox b {
        font-size: 7.6pt;
      }
      .sigbox.pending {
        border: 0.3mm dashed #b8b6b1;
        background: #fafaf9;
        color: #6f6e6b;
      }
      .sigbox.pending svg {
        color: #9a9894;
      }
      /* continuation header, footer */
      .ch {
        display: flex;
        justify-content: space-between;
        gap: 6mm;
        font-size: 7.6pt;
        color: #6f6e6b;
        padding-bottom: 2mm;
        border-bottom: 0.25mm solid #e2e0dc;
        margin-bottom: 5mm;
      }
      .pf.nov {
        grid-template-columns: 1fr auto;
      }
      .pf {
        margin: 0 -18mm;
        padding: 3.5mm 18mm 6mm;
        border-top: 0.25mm solid #e2e0dc;
        display: grid;
        grid-template-columns: 17mm 1fr auto;
        gap: 4mm;
        align-items: center;
        font-size: 7pt;
        line-height: 1.45;
        color: #4a4a48;
        position: relative;
        z-index: 1;
        background: #fff;
      }
      .pf-qr svg {
        display: block;
        width: 17mm;
        height: 17mm;
      }
      .qr-ph {
        width: 17mm;
        height: 17mm;
        border: 0.3mm dashed #b8b6b1;
        border-radius: 1mm;
        display: grid;
        place-items: center;
        text-align: center;
        font-size: 6pt;
        color: #9a9894;
        line-height: 1.2;
      }
      .pf b {
        color: #1a1a1a;
      }
      .pf .code {
        font-weight: 700;
        color: #1a1a1a;
        font-size: 7.4pt;
      }
      .pf-m {
        color: #8a8985;
      }
      .pf-r {
        text-align: right;
        white-space: nowrap;
      }
      .pf-mark {
        font-weight: 700;
        letter-spacing: 0.24em;
        color: #1a1a1a;
        margin-bottom: 0.6mm;
      }
      /* status watermark overlay */
      .wm {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        z-index: 5;
      }
      .wm span {
        transform: rotate(-32deg);
        font-size: 60pt;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 2mm 10mm 4mm;
        border: 1.4mm solid;
        border-radius: 5mm;
        text-align: center;
        line-height: 1.05;
      }
      .wm small {
        display: block;
        font-size: 13pt;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-transform: none;
        margin-top: 1mm;
      }
      .wm.red span {
        color: rgba(201, 41, 30, 0.2);
        border-color: rgba(201, 41, 30, 0.2);
      }
      .wm.grey span {
        color: rgba(60, 60, 60, 0.13);
        border-color: rgba(60, 60, 60, 0.13);
      }
      /* Kiswahili slot */
      .sw {
        display: inline-block;
        vertical-align: middle;
        margin-left: 2mm;
        padding: 0 2mm;
        height: 4.2mm;
        line-height: 4mm;
        border: 0.25mm dashed #b07cd6;
        border-radius: 1mm;
        color: #7d4bb0;
        font-size: 6.4pt;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: none;
        text-decoration: none;
      }
      /* slip */
      .slip-ref {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 4mm;
        padding: 4.5mm 5mm;
        border: 0.35mm solid #1a1a1a;
        border-radius: 2mm;
      }
      .slip-ref .lbl,
      .vpanel .lbl {
        font-size: 7.4pt;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6f6e6b;
      }
      .slip-ref .big {
        font-size: 17pt;
        font-weight: 700;
        margin-top: 0.5mm;
      }

          <h2>2. National totals${sw()}</h2>
          <table class="rt"><thead><tr><th>Form M section</th><th class="num">Expected</th><th class="num">Declared</th><th class="num">Did not declare</th><th class="num" style="width:34mm">Rate</th></tr></thead>
          <tbody>${secs.map(([k, e, d]) => `<tr><td>${k}</td><td class="num">${num(e)}</td><td class="num">${num(d)}</td><td class="num">${num(e - d)}</td><td class="num">${rate(d, e)}${bar(d, e)}</td></tr>`).join('')}</tbody>
          <tfoot><tr><td>All sections</td><td class="num">${num(allE)}</td><td class="num">${num(allD)}</td><td class="num">${num(allE - allD)}</td><td class="num">${rate(allD, allE)}</td></tr></tfoot></table>
          <table class="rt"><thead><tr><th>Reporting status</th><th class="num">Commissions</th><th class="num">Share</th></tr></thead><tbody>
            <tr><td>Reported by 31 Jul 2026</td><td class="num">${onTime}</td><td class="num">${rate(onTime, NCR_ROWS.length)}</td></tr>
            <tr><td>Reported late</td><td class="num">${late}</td><td class="num">${rate(late, NCR_ROWS.length)}</td></tr>
            <tr><td>Not reported when this report was built</td><td class="num">${nr}</td><td class="num">${rate(nr, NCR_ROWS.length)}</td></tr>
          </tbody></table>`;
        const p3 = `<div class="narr"><h2 style="margin-top:0">3. Findings${sw()}</h2>
          <p>${rep.length} of ${NCR_ROWS.length} Responsible Commissions filed Form M for the year: ${onTime} by the 31 July 2026 deadline and ${late} late. ${nr} had not reported when this report was built, including the Public Service Commission and the Judicial Service Commission.</p>
          <p>Across reporting Commissions, ${rate(allD, allE)} of expected declarations were made. Final declarations had the lowest rate at ${rate(t[5], t[4])}, against ${rate(t[1], t[0])} for initial and ${rate(t[3], t[2])} for biennial declarations.</p>
          <ul><li>Three county public service boards reported biennial rates below 80%: Nairobi City (62.0%), Nyamira (64.0%) and Kirinyaga (76.0%).</li><li>Kiambu reported a final declaration rate of 68.2%.</li><li>Mombasa reported 3 final declarations with no officers expected to make one, and Machakos reported no figures for final declarations.</li></ul>
          <h2>4. Recommendations${sw()}</h2>
          <ul><li>Commissions that have not reported should file Form M within 30 days of this report.</li><li>Boards with biennial rates below 80% should apply the administrative mechanisms to officers who have not declared and report the action taken.</li><li>Commissions should reconcile exits in their rosters with final declarations, so that officers who leave service are asked to declare within 30 days.</li><li>Mombasa and Machakos should explain the inconsistencies in section 3 of their reports.</li></ul></div>
          ${draft ? '' : `<div class="sign" style="margin-top:10mm"><div><div class="fine">Approved for issue</div><div class="nm" style="margin-top:6mm">Mercy Wambui</div><div>EACC supervisor</div><div>Ethics and Anti-Corruption Commission</div></div>${sealBox(m)}</div>`}`;
        const st = (s) =>
          s === 1
            ? '<span class="st-l">On time</span>'
            : s === 2
              ? '<span class="st-l late" style="color:#b3241a">Late</span>'
              : '<span class="st-l nr">Not reported</span>';
        const cell = (d, e) =>
          e == null
            ? '<td class="num">-</td>'
            : `<td class="num"><span class="${e && d / e < 0.8 ? 'rate-low' : ''}">${rate(d, e)}</span><span class="sub">${num(d)} / ${num(e)}</span></td>`;
        const annex = (rows, start, title) =>
          `${title ? `<h2 style="margin-top:0">Annex. Results by Commission${sw()}</h2><p class="fine">Declared / expected officers per Form M section, as filed. Rates below 80% are in red.</p>` : ''}
          <table class="rt dense"><thead><tr><th style="width:6mm">No</th><th>Commission</th><th>Status</th><th>Received</th><th class="num">Initial</th><th class="num">Biennial</th><th class="num">Final</th></tr></thead><tbody>${rows
            .map(
              (r, i) =>
                `<tr><td>${start + i + 1}</td><td><b>${esc(r[1])}</b><span class="sub">${r[0]}</span></td><td>${st(r[2])}</td><td style="white-space:nowrap">${r[3] ? fmtDate(r[3]) : '-'}</td>${r[4] ? cell(r[4][1], r[4][0]) + cell(r[4][3], r[4][2]) + cell(r[4][5], r[4][4]) : '<td class="num">-</td><td class="num">-</td><td class="num">-</td>'}</tr>`,
            )
            .join('')}</tbody></table>`;
        return [
          p1,
          p2,
          p3,
          annex(NCR_ROWS.slice(0, 18), 0, true),
          annex(NCR_ROWS.slice(18, 35), 18, false),
          annex(NCR_ROWS.slice(35), 35, false),
        ];
      }

      /* ============================== state ============================== */
      const S = Kit.state({ zoom: 'fit', props: true, docs: {} });
      const stOf = (id) => {
        if (!S.docs[id])
          S.docs[id] = {
            status: 'valid',
            sw: false,
            v: DOCS[id].variants ? DOCS[id].variants[0][0] : null,
          };
        return S.docs[id];
      };
      const setDoc = (id, patch) => {
        S.docs[id] = Object.assign(
          { status: 'valid', sw: false, v: DOCS[id].variants ? DOCS[id].variants[0][0] : null },
          patch,
        );
      };
      const cur = () => (DOCS[S.screen] ? S.screen : null);
      const fileName = (id, m) =>
        `${m.preview ? 'preview-' : ''}${DOCS[id].template.split('.')[0]}-${m.ref.replace(/[^A-Z0-9-]/gi, '')}${m.version ? '-v' + m.version : ''}.pdf`;
      const STATUS = {
        valid: ['Valid', 'ok'],
        superseded: ['Superseded', 'warn'],
        revoked: ['Revoked', 'danger'],
        preview: ['Preview', ''],
        expired: ['Download window closed', 'warn'],
      };
      const lvlChip = (d) =>
        d.level === 'public'
          ? `<span class="lvl public">${icon('globe', 12, 2.2)}Public</span>`
          : `<span class="lvl ${d.level}">${icon(d.level === 'confidential' ? 'lock' : 'eyeOff', 12, 2.2)}${d.level === 'confidential' ? 'Confidential' : 'Restricted'}</span>`;

      /* ============================== screens ============================== */
      const GROUPS = [
        'Submission and review',
        'Determination and actions',
        'Form M and EACC',
        'Access requests',
        'Open data',
      ];
      function screenIndex() {
        const ids = Object.keys(DOCS);
        return `<div class="idx">
          <h1>Documents</h1>
          <p class="sub">${ids.length} documents · A4 PDF, digitally signed, checkable by QR</p>
          ${GROUPS.map((g) => {
            const list = ids.filter((id) => DOCS[id].group === g);
            return `<section class="grp" aria-label="${g}"><h2>${g}</h2><div class="dgrid">${list
              .map((id) => {
                const d = DOCS[id];
                const r = renderPages(id, {
                  status: 'valid',
                  sw: false,
                  v: d.variants ? d.variants[0][0] : null,
                });
                const first = r.html.split('</section>')[0] + '</section>';
                return `<a class="dcard" href="#${id}" data-act="go" data-arg="${id}" aria-label="${esc(d.title)}"><div class="thumb" aria-hidden="true"><div class="tz">${first}</div></div><div class="dc-b"><div class="dc-t">${esc(d.title)}</div><div class="dc-m">${lvlChip(d)}<span>${r.n} ${r.n === 1 ? 'page' : 'pages'}</span><span class="dc-tk">#${d.tickets.join(' #')}</span></div></div></a>`;
              })
              .join('')}</div></section>`;
          }).join('')}
        </div>`;
      }

      function noteFor(id, s, m) {
        const d = DOCS[id];
        if (s.status === 'superseded')
          return `<div class="callout callout-warn">${icon('refresh', 17)}<span class="vn-t">${id === 'slip' && s.v !== 'late' ? 'Superseded by version 2 on 26 Sep 2026.' : 'Superseded by a newer version on 26 Sep 2026.'} The signed PDF is unchanged; the viewer and verify page show the status.</span><button class="btn btn-secondary btn-sm" data-act="setStatus" data-arg="valid">${id === 'slip' && s.v !== 'late' ? 'View version 2' : 'View current'}</button></div>`;
        if (s.status === 'revoked')
          return `<div class="callout callout-danger">${icon('ban', 17)}<span class="vn-t">Revoked on ${m.revokedNote.split(' · ')[1]}: issued in error. The signed PDF is unchanged; the viewer and verify page show the status.</span></div>`;
        if (s.status === 'expired')
          return `<div class="callout callout-warn">${icon('timer', 17)}<span class="vn-t">Download window closed on ${fmtDate(m.p ? m.p.expires : m.issuedAt)}. Downloads now return 410; the signed PDF and the verify page are unchanged.</span></div>`;
        if (s.status === 'preview')
          return `<div class="callout callout-info">${icon('eye', 17)}<span class="vn-t">${id === 'form-m' || id === 'ncr' ? 'Draft.' : 'Preview.'} The ${id.startsWith('access') || id.startsWith('lea') || id === 'certified-copy' || id === 'open-data-manifest' ? '' : 'reference, '}verification code and signature are added when it is ${id === 'form-m' ? 'submitted' : id === 'ncr' || id === 'referral-package' ? 'approved' : id === 'open-data-manifest' ? 'published' : 'issued'}.</span></div>`;
        if (s.sw)
          return `<div class="callout callout-info">${icon('globe', 17)}<span class="vn-t">Kiswahili slots are empty in the template, so the document issues in English. Dashed boxes mark each slot.</span></div>`;
        if (d.gap)
          return `<div class="callout callout-warn">${icon('alert', 17)}<span class="vn-t">Not in the spec: ${d.gap.replace(/^Spec 08 defines/, 'spec 08 defines')}</span></div>`;
        return '';
      }

      function propsBody(id, s, m) {
        const d = DOCS[id];
        const [sl, sk] = STATUS[s.status];
        const rows = [
          ['Status', badge(sl, sk)],
          ['Template', `<span class="mono">${d.template}</span>`],
          [
            `Disclosure ${tip(d.level === 'confidential' ? 'Verify page shows validity only. Even the issuer or type could reveal an investigation.' : d.level === 'public' ? 'Verify page shows the full document. It holds no personal data.' : 'Verify page shows type, issuer, issue date and reference. No names, amounts or findings.')}`,
            d.level === 'confidential'
              ? 'Confidential'
              : d.level === 'public'
                ? 'Public'
                : 'Restricted',
          ],
          ['Verify page shows', d.payload],
          [
            'Verification code',
            m.preview
              ? '<span class="muted">Added on issue</span>'
              : `<span class="copyline"><span class="code">${m.code}</span><button class="btn btn-ghost icon-btn" data-act="copy" data-arg="${m.code}" aria-label="Copy verification code">${icon('copy', 14)}</button></span>`,
          ],
          [
            `Signature ${tip('PAdES B-B with the demo CA from OpenBao. Production uses a licensed Kenyan certification service provider.')}`,
            m.preview
              ? '<span class="muted">Applied on issue</span>'
              : `Adili Online (demo)<div class="muted small">${fmtDate(m.signedAt)}, ${hms(m.signedAt)} EAT · not modified</div>`,
          ],
          [
            'SHA-256',
            m.preview
              ? '<span class="muted">Computed on issue</span>'
              : `<span class="hash">${sha(m.ref + m.code)}</span>`,
          ],
          ['Who can download', d.access],
          ['Tickets', d.tickets.map((t) => `#${t}`).join(' ')],
        ];
        if (d.gap) rows.push(['Spec', `<span style="color:var(--warn)">${esc(d.gap)}</span>`]);
        return `<div class="pkv">${rows.map(([k, v]) => `<div><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}<a class="btn btn-secondary btn-sm" href="${VERIFY_APP}" target="_blank" rel="noopener">${icon('external', 15)} Verify page</a></div>`;
      }

      function screenDoc(id) {
        const d = DOCS[id];
        const s = stOf(id);
        const r = renderPages(id, s);
        const m = r.m;
        const [sl, sk] = STATUS[s.status];
        const seg = (list, curV, act) =>
          `<div class="seg" role="group">${list.map(([k, l]) => `<button class="${curV === k ? 'on' : ''}" data-act="${act}" data-arg="${k}" aria-pressed="${curV === k}">${l}</button>`).join('')}</div>`;
        const note = noteFor(id, s, m);
        return `<div class="vwrap">
          <div class="vhead">
            <div class="vbar">
              <button class="btn btn-ghost icon-btn" data-act="go" data-arg="index" aria-label="All documents" title="All documents">${icon('left', 19)}</button>
              <div class="vtitle"><h1>${esc(d.title)}</h1>${lvlChip(d)}<span class="hide-m">${badge(sl, sk)}</span></div>
              <div class="vtools">
                <div class="vgroup"><button class="btn btn-ghost icon-btn" data-act="zoom" data-arg="-1" aria-label="Zoom out">${icon('minus', 17)}</button><button class="zlab hide-m" id="zlab" data-act="zoom" data-arg="fit" title="Fit to width">100%</button><button class="btn btn-ghost icon-btn" data-act="zoom" data-arg="1" aria-label="Zoom in">${icon('plus', 17)}</button></div>
                <span class="vsep hide-m"></span>
                <div class="vgroup"><button class="btn btn-ghost icon-btn" data-act="page" data-arg="-1" aria-label="Previous page">${icon('arrowUp', 16)}</button><span class="pgind" id="pgind" aria-live="polite">Page 1 of ${r.n}</span><button class="btn btn-ghost icon-btn" data-act="page" data-arg="1" aria-label="Next page">${icon('arrowDown', 16)}</button></div>
                <span class="vsep hide-m"></span>
                <button class="btn btn-ghost icon-btn" data-act="props" aria-label="Document details" title="Document details" aria-pressed="${!!S.props}">${icon('info', 18)}</button>
                <button class="btn btn-ghost icon-btn" data-act="print" aria-label="Print" title="Print">${icon('printer', 18)}</button>
                <button class="btn btn-primary btn-sm" aria-label="Download PDF" data-act="download" data-arg="${fileName(id, m)}">${icon('download', 16)}<span class="hide-m">Download</span></button>
              </div>
            </div>
            <div class="vstrip" aria-label="Prototype states">
              <span class="lab">State</span>
              ${seg(
                [
                  ['valid', 'Valid'],
                  ['superseded', 'Superseded'],
                  ['revoked', 'Revoked'],
                  ['preview', id === 'form-m' || id === 'ncr' ? 'Draft' : 'Preview'],
                  ...(d.window ? [['expired', 'Window closed']] : []),
                ],
                s.status,
                'setStatus',
              )}
              ${d.variants ? seg(d.variants, s.v, 'setVariant') : ''}
              <button class="tog ${s.sw ? 'on' : ''}" data-act="toggleSw" aria-pressed="${s.sw}"><span class="box">${icon('check', 12, 3)}</span>Kiswahili slots</button>
            </div>
          </div>
          <div class="vbody">
            <div class="vcol">
              ${note ? `<div class="vnote">${note}</div>` : ''}
              <div class="pages" id="pages">${r.html}</div>
            </div>
            ${S.props ? `<aside class="props" aria-label="Document details"><div class="card"><div class="card-head"><h3>Details</h3></div>${propsBody(id, s, m)}</div></aside>` : ''}
          </div>
        </div>`;
      }

      /* ============================== viewer behaviour ============================== */
      const PAGE_W = 793.7;
      const ZOOMS = [0.5, 0.67, 0.75, 0.9, 1, 1.1, 1.25, 1.5, 2];
      function fitZoom() {
        const col = document.querySelector('.vcol');
        if (!col) return 1;
        const pad = col.clientWidth < 700 ? 16 : 48;
        return Math.max(0.3, Math.min(1, (col.clientWidth - pad) / PAGE_W));
      }
      const zoomNow = () => (S.zoom === 'fit' ? fitZoom() : S.zoom);
      function pageEls() {
        return [...document.querySelectorAll('#pages .page')];
      }
      function currentPage() {
        const view = document.getElementById('view');
        const head = document.querySelector('.vhead');
        const top = view.getBoundingClientRect().top + (head ? head.offsetHeight : 0) + 40;
        const els = pageEls();
        let idx = 0;
        els.forEach((el, i) => {
          if (el.getBoundingClientRect().top <= top) idx = i;
        });
        return idx;
      }
      function updatePg() {
        const ind = document.getElementById('pgind');
        const els = pageEls();
        if (!ind || !els.length) return;
        ind.textContent = `Page ${currentPage() + 1} of ${els.length}`;
      }
      function scrollToPage(i) {
        const els = pageEls();
        const el = els[Math.max(0, Math.min(els.length - 1, i))];
        if (!el) return;
        const view = document.getElementById('view');
        const head = document.querySelector('.vhead');
        const y =
          el.getBoundingClientRect().top -
          view.getBoundingClientRect().top +
          view.scrollTop -
          (head ? head.offsetHeight : 0) -
          16;
        view.scrollTo({ top: y, behavior: 'smooth' });
      }
      let bound = false;
      function afterRender() {
        const pages = document.getElementById('pages');
        if (pages) {
          const z = zoomNow();
          pages.style.zoom = z;
          const lab = document.getElementById('zlab');
          if (lab) lab.textContent = `${Math.round(z * 100)}%`;
          const vn = document.querySelector('.vnote');
          if (vn)
            vn.style.maxWidth = `${Math.round(PAGE_W * z) + (vn.parentElement.clientWidth < 700 ? 20 : 48)}px`;
          updatePg();
        }
        if (!bound) {
          bound = true;
          document.getElementById('view').addEventListener('scroll', updatePg, { passive: true });
          window.addEventListener('resize', () => {
            if (S.zoom === 'fit' && document.getElementById('pages')) Kit.render();
          });
        }
      }
      const wide = () => document.getElementById('app').clientWidth >= 1100;

      const actions = {
        setStatus: (k) => {
          stOf(cur()).status = k;
          Kit.render();
        },
        setVariant: (k) => {
          stOf(cur()).v = k;
          Kit.render();
        },
        toggleSw: () => {
          const s = stOf(cur());
          s.sw = !s.sw;
          Kit.render();
        },
        zoom: (a) => {
          if (a === 'fit') S.zoom = 'fit';
          else {
            const z = zoomNow();
            const next =
              +a > 0
                ? ZOOMS.find((x) => x > z + 0.01)
                : [...ZOOMS].reverse().find((x) => x < z - 0.01);
            S.zoom = next || z;
          }
          Kit.render();
        },
        page: (a) => scrollToPage(currentPage() + +a),
        props: () => {
          if (wide()) {
            S.props = !S.props;
            Kit.render();
          } else {
            S.modal = { kind: 'props' };
            Kit.render();
          }
        },
        print: () => window.print(),
        download: (f) => Kit.toast(`${f} would download (signed PDF, download recorded)`),
      };
      const modals = {
        props: () => {
          const id = cur();
          if (!id) return '';
          const s = stOf(id);
          const m = renderPages(id, s).m;
          return Kit.drawer({ title: 'Details', body: propsBody(id, s, m) });
        },
      };

      /* ============================== mount ============================== */
      const screens = { index: screenIndex };
      Object.keys(DOCS).forEach((id) => (screens[id] = () => screenDoc(id)));
      // Deep links to a variant (other prototypes link here), e.g. #access-decision-deny.
      const ALIASES = {
        'access-decision-grant': ['access-decision', { v: 'grant' }],
        'access-decision-deny': ['access-decision', { v: 'deny' }],
        'access-decision-cannot-identify': ['access-decision', { v: 'cannot' }],
        'access-package-lea': ['access-package', { v: 'lea' }],
        'certified-copy-in-person': ['certified-copy', { v: 'in-person' }],
        'lea-response-deny': ['lea-response', { v: 'deny' }],
        'open-data-manifest-snapshot': ['open-data-manifest', { v: 'snapshot' }],
      };
      Object.entries(ALIASES).forEach(([alias, [id, patch]]) => {
        screens[alias] = () => {
          setDoc(id, patch);
          S.screen = id;
          history.replaceState(null, '', '#' + id);
          return screenDoc(id);
        };
      });
      const J = (key, label, id, patch) => [
        key,
        label,
        () => {
          setDoc(id, patch || {});
          Kit.go(id);
        },
      ];
      Kit.mount({
        app: 'documents',
        start: 'index',
        home: 'index',
        screens,
        modals,
        actions,
        afterRender,
        jumps: [
          ['index', 'All documents (index)'],
          J('slip', '#135 Acknowledgement slip (v2, valid)', 'slip'),
          J('j-slip-v1', '#135 #143 Slip: v1 superseded by v2', 'slip', { status: 'superseded' }),
          J('j-slip-late', '#135 Slip: final declaration filed late', 'slip', { v: 'late' }),
          J('j-slip-revoked', '#135 Slip: revoked, issued in error', 'slip', { status: 'revoked' }),
          J('j-slip-sw', '#135 Slip: Kiswahili slots', 'slip', { sw: true }),
          J('clarification-letter', '#156 Clarification letter (2 pages)', 'clarification-letter'),
          J(
            'j-clr-preview',
            '#156 Clarification letter: composer preview',
            'clarification-letter',
            { status: 'preview' },
          ),
          J(
            'j-clr-revoked',
            '#156 Clarification letter: withdrawn, revoked',
            'clarification-letter',
            { status: 'revoked' },
          ),
          J('decision-compliant', '#194 Decision letter: compliant', 'decision-compliant'),
          J(
            'j-dec-noissues',
            '#194 Decision letter: no issues identified, on demand',
            'decision-compliant',
            { v: 'no-issues' },
          ),
          J(
            'decision-non-compliant',
            '#194 Decision letter: non-compliant',
            'decision-non-compliant',
          ),
          J(
            'decision-further-action',
            '#194 Decision letter: further action',
            'decision-further-action',
          ),
          J('notice', '#194 Notice to comply: clarification not answered', 'notice'),
          J('j-notice-decl', '#194 Notice to comply: declaration not filed', 'notice', {
            v: 'declaration',
          }),
          J('warning', '#194 Warning', 'warning'),
          J('stoppage', '#194 Salary stoppage', 'stoppage'),
          J('reinstatement', '#194 Salary reinstatement (not in spec)', 'reinstatement'),
          J('disciplinary', '#194 Disciplinary referral', 'disciplinary'),
          J(
            'referral-package',
            '#194 Referral package (Confidential, 2 pages)',
            'referral-package',
          ),
          J('j-rfl-preview', '#194 Referral package: supervisor preview', 'referral-package', {
            status: 'preview',
          }),
          J('form-m', '#218 Form M: submitted late (4 pages)', 'form-m'),
          J('j-fm-ontime', '#218 Form M: submitted on time', 'form-m', { v: 'ontime' }),
          J('j-fm-draft', '#218 Form M: draft', 'form-m', { status: 'preview' }),
          J('form-m-receipt', '#218 Form M receipt', 'form-m-receipt'),
          J('ncr', '#218 National consolidated report (6 pages)', 'ncr'),
          J('j-ncr-draft', '#218 NCR: draft, awaiting approval', 'ncr', { status: 'preview' }),
          J(
            'access-decision',
            '#260 Access decision: partially granted (2 pages)',
            'access-decision',
          ),
          J('j-acd-grant', '#260 Access decision: granted', 'access-decision', { v: 'grant' }),
          J(
            'j-acd-deny',
            '#260 Access decision: denied, Regulation 24 grounds',
            'access-decision',
            { v: 'deny' },
          ),
          J(
            'j-acd-cannot',
            '#254 Access decision: officer could not be identified',
            'access-decision',
            { v: 'cannot' },
