name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test build --filter='!@adili/mocks'
      - run: pnpm deps:check
      # The console's typecheck above regenerates api.gen.ts from the committed contract, so a
      # stale client shows up here too.
      - name: Internal contracts match the services
        run: |
          pnpm --filter @adili/directory contracts
          git diff --exit-code packages/schemas apps/console/src/server/directory/api.gen.ts

  integration:
    name: Integration (Postgres, RabbitMQ, Keycloak)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: adili_test
          POSTGRES_PASSWORD: adili_test_dev
          POSTGRES_DB: adili_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U adili_test" --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:4.3.6-alpine
        env:
          RABBITMQ_DEFAULT_USER: adili
          RABBITMQ_DEFAULT_PASS: adili_dev
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity" --health-interval 5s --health-timeout 10s --health-retries 30
      # Keycloak's realm sends email to host `mailpit`, as in infra/compose.
      mailpit:
        image: axllent/mailpit:v1.31.2
        ports: ['8025:8025']
        options: >-
          --health-cmd "/mailpit readyz" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://adili_test:adili_test_dev@localhost:5432/adili_test
      TEST_RABBITMQ_URL: amqp://adili:adili_dev@localhost:5672
      TEST_KEYCLOAK_ISSUER_URL: http://localhost:8080/realms/adili
      TEST_MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v5
      # Service containers cannot take a command, so Keycloak (same version as
      # infra/docker/keycloak.Dockerfile, without the login theme) runs here.
      - name: Start Keycloak with the realm import
        run: |
          docker run -d --name keycloak --network ${{ job.services.mailpit.network }} -p 8080:8080 \
            -e KC_HOSTNAME=http://localhost:8080 \
            -v "$PWD/infra/compose/keycloak/adili-realm.json:/opt/keycloak/data/import/adili-realm.json:ro" \
            quay.io/keycloak/keycloak:26.7.4 start-dev --import-realm
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for Keycloak
        run: |
          timeout 180 sh -c 'until curl -sf "$TEST_KEYCLOAK_ISSUER_URL/.well-known/openid-configuration" >/dev/null; do sleep 2; done' \
            || { docker logs keycloak; exit 1; }
      - run: pnpm test:integration

  python:
    name: Python mocks (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mocks
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: mocks
          POSTGRES_PASSWORD: mocks_dev
          POSTGRES_DB: mocks
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mocks" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Local dev defaults come from .env.example (as in the package scripts); the job
      # environment takes precedence, so DATABASE_URL points at the service container.
      DATABASE_URL: postgres://mocks:mocks_dev@localhost:5432/mocks
      UV_ENV_FILE: .env.example
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy .
      - run: uv run pytest
      - name: External contracts match the mocks
        run: uv run python manage.py export_contracts && git diff --exit-code ../packages/schemas

  images:
    name: Image ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: typescript
    strategy:
      fail-fast: false
      matrix:
        service:
          - directory
          - declarations
          - review
          - access
          - reporting
          - documents
          - verification-api
          - ai-gateway
          - integration-gateway
          - notifications
          - audit
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/service.Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
