name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_CACHE_DIR: .turbo

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      packaging: ${{ steps.plan.outputs.packaging }}
      keycloak: ${{ steps.plan.outputs.keycloak }}
      integration: ${{ steps.plan.outputs.integration }}
      python: ${{ steps.plan.outputs.python }}
    steps:
      - uses: actions/checkout@v5
        with:
          # History back to the base commit, for the diff and Turborepo's affected packages.
          fetch-depth: 0
      - id: plan
        # An explicit bash shell sets pipefail, so a failing plan fails the job instead of
        # leaving every output empty behind tee.
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-plan.mjs "$BASE" | tee -a "$GITHUB_OUTPUT"

  typescript:
    name: TypeScript (lint, typecheck, test, build, contracts)
    runs-on: ubuntu-latest
    needs: plan
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # One task per vCPU (2 on this runner): more starves the test suites, whose timeouts then
      # fire on tests that take milliseconds locally.
      - run: pnpm turbo run lint typecheck test build --filter='!@adili/mocks' --cache-dir=.turbo --concurrency=2
      - run: pnpm deps:check
      # Typecheck and build regenerate these (route trees, clients generated from the committed
      # contracts), so a stale committed copy shows up as a diff.
      - name: Generated files are committed
        run: git diff --exit-code -- '*.gen.ts'
      - name: Lint OpenAPI (internal + external)
        run: pnpm --filter @adili/schemas lint:openapi
      - name: Meta-validate form JSON Schemas
        run: pnpm --filter @adili/schemas lint:forms
      # Services with a `contracts` script export their OpenAPI; each export must equal the
      # committed packages/schemas/internal/<service>.yaml (directory, documents, declarations,
      # notifications, integration-gateway), and each client generated from a contract must equal
      # its committed copy.
      - name: Internal contracts match the services
        run: pnpm contracts:drift
      # What the image does after the build (infra/docker/service.Dockerfile), on this job's
      # install: a production install per service, whose code must load without dev packages.
      - name: Services package for production
        if: needs.plan.outputs.packaging != '[]'
        env:
          SERVICES: ${{ needs.plan.outputs.packaging }}
        run: |
          for service in $(echo "$SERVICES" | jq -r '.[]'); do
            echo "::group::$service"
            pnpm --filter "@adili/$service" deploy --prod --legacy "$RUNNER_TEMP/deploy/$service"
            node --experimental-import-meta-resolve scripts/check-deploy-imports.mjs \
              "$RUNNER_TEMP/deploy/$service"
            rm -rf "$RUNNER_TEMP/deploy/$service"
            echo '::endgroup::'
          done

  keycloak:
    name: Keycloak
    needs: plan
    if: needs.plan.outputs.keycloak == 'true' || needs.plan.outputs.integration == 'true'
    uses: ./.github/workflows/keycloak.yml

  integration:
    name: Integration (Postgres, Valkey, RabbitMQ, OpenBao, Temporal, Keycloak, Gotenberg)
    runs-on: ubuntu-latest
    needs: [plan, keycloak]
    if: needs.plan.outputs.integration == 'true'
    services:
      # As in infra/compose: `postgres` is the superuser and the init script (run below) creates
      # the non-superuser roles, so row-level security applies to the tests as to the services.
      # The health check uses TCP so it cannot pass on the image's socket-only init server.
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost" --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:9.0.6-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:4.3.6-alpine
        env:
          RABBITMQ_DEFAULT_USER: adili
          RABBITMQ_DEFAULT_PASS: adili_dev
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity" --health-interval 5s --health-timeout 10s --health-retries 30
      openbao:
        image: openbao/openbao:2.7.0
        env:
          BAO_DEV_ROOT_TOKEN_ID: adili-test-root-token
        ports: ['8200:8200']
        options: >-
          --cap-add IPC_LOCK --health-cmd "wget -q -O /dev/null http://127.0.0.1:8200/v1/sys/health" --health-interval 5s --health-timeout 5s --health-retries 20
      # Keycloak's realm sends email to host `mailpit`, as in infra/compose.
      mailpit:
        image: axllent/mailpit:v1.31.2
        # 1025: SMTP for the notifications service the stack suite starts on the runner.
        ports: ['8025:8025', '1025:1025']
        options: >-
          --health-cmd "/mailpit readyz" --health-interval 5s --health-timeout 5s --health-retries 20
      # Scans documents uploads (spec 02). The first start downloads the signature database,
      # which takes a few minutes.
      clamav:
        image: clamav/clamav:1.5-debian
        ports: ['3310:3310']
        options: >-
          --health-cmd clamdcheck.sh --health-interval 10s --health-timeout 5s --health-retries 60 --health-start-period 60s
      # Renders issued documents (spec 06).
      gotenberg:
        image: gotenberg/gotenberg:8.37
        ports: ['3300:3000']
        options: >-
          --health-cmd "curl -sf http://127.0.0.1:3000/health" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://adili_test:adili_test_dev@localhost:5432/adili_test
      TEST_VALKEY_URL: redis://localhost:6379
      TEST_RABBITMQ_URL: amqp://adili:adili_dev@localhost:5672
      TEST_OPENBAO_URL: http://localhost:8200
      TEST_OPENBAO_TOKEN: adili-test-root-token
      TEST_TEMPORAL_ADDRESS: localhost:7233
      TEST_TEMPORAL_NAMESPACE: adili
      TEST_KEYCLOAK_ISSUER_URL: http://localhost:8080/realms/adili
      TEST_MAILPIT_URL: http://localhost:8025
      TEST_S3_ENDPOINT: http://localhost:8333
      TEST_CLAMAV_HOST: localhost
      TEST_CLAMAV_PORT: 3310
      TEST_GOTENBERG_URL: http://localhost:3300
    steps:
      - uses: actions/checkout@v5
      # Service containers cannot mount the repo, so the compose init script is copied in.
      - name: Create the databases and roles
        run: |
          docker cp infra/compose/postgres/init-databases.sh ${{ job.services.postgres.id }}:/tmp/init-databases.sh
          docker exec -e POSTGRES_USER=postgres ${{ job.services.postgres.id }} /tmp/init-databases.sh
      # The demo CA and documents signing keys, as the compose init job creates them (spec 06).
      - name: Create the demo CA in OpenBao
        run: |
          docker cp infra/compose/openbao/create-demo-ca.sh ${{ job.services.openbao.id }}:/tmp/create-demo-ca.sh
          docker exec -e BAO_ADDR=http://127.0.0.1:8200 -e BAO_TOKEN=adili-test-root-token \
            ${{ job.services.openbao.id }} /bin/sh /tmp/create-demo-ca.sh
      # Keycloak with the Adili themes, built by the Keycloak workflow: the realm sends its
      # emails with the Adili email theme, which the identity contract suite asserts on.
      - uses: actions/download-artifact@v4
        with:
          name: keycloak-image
          path: ${{ runner.temp }}
      - name: Load the Keycloak image
        run: docker load --input "$RUNNER_TEMP/keycloak-image.tar"
      # Service containers cannot take a command, so Keycloak runs here (dev-file database).
      - name: Start Keycloak with the realm import
        run: |
          docker run -d --name keycloak --network ${{ job.services.mailpit.network }} -p 8080:8080 \
            --add-host host.docker.internal:host-gateway \
            -e KC_HOSTNAME=http://localhost:8080 -e KC_DB=dev-file \
            -e ADILI_NOTIFICATIONS_URL=http://host.docker.internal:4010 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin_dev \
            -v "$PWD/infra/compose/keycloak/adili-realm.json:/opt/keycloak/data/import/adili-realm.json:ro" \
            -v "$PWD/infra/compose/keycloak/vault-dev:/opt/keycloak/vault:ro" \
            adili/keycloak:dev start-dev --import-realm
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Temporal's single-binary dev server (service containers cannot pass it arguments).
      - name: Start Temporal
        run: |
          docker run -d --name temporal -p 7233:7233 temporalio/temporal:1.6.1 \
            server start-dev --ip 0.0.0.0 --namespace adili
          timeout 60 sh -c 'until docker exec temporal temporal operator namespace describe --namespace adili >/dev/null 2>&1; do sleep 1; done'
      # Object storage as in infra/compose (service containers cannot take a command): the S3
      # identity, SSE-S3 for the clean bucket, the volume slots and the ADR-002 buckets.
      - name: Start SeaweedFS
        run: |
          docker run -d --name seaweedfs -p 8333:8333 -p 9333:9333 -e WEED_S3_SSE_KEY=adili-ci-sse-key \
            -v "$PWD/infra/compose/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            -v "$PWD/infra/compose/seaweedfs/create-buckets.sh:/scripts/create-buckets.sh:ro" \
            chrislusf/seaweedfs:4.47 server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json \
            -master.volumeSizeLimitMB=1024 -volume.max=64
          timeout 120 sh -c 'until curl -sf http://localhost:9333/cluster/status >/dev/null && curl -s -o /dev/null http://localhost:8333; do sleep 2; done' \
            || { docker logs seaweedfs; exit 1; }
          timeout 120 sh -c 'until docker exec -e SEAWEEDFS_MASTER=localhost:9333 seaweedfs sh /scripts/create-buckets.sh \
            && echo s3.bucket.list | docker exec -i seaweedfs weed shell -master=localhost:9333 | grep -q audit-archive; do sleep 2; done'
      - name: Wait for Keycloak
        run: |
          # shellcheck disable=SC2016 # the inner shell expands the variable
          timeout 180 sh -c 'until curl -sf "$TEST_KEYCLOAK_ISSUER_URL/.well-known/openid-configuration" >/dev/null; do sleep 2; done' \
            || { docker logs keycloak; exit 1; }
      - run: pnpm test:integration
      # S22 and S23 (spec 03): sign-in with the adili-otp extension through the notifications
      # service, the SMS mock and Mailpit, as a user drives it.
      - uses: astral-sh/setup-uv@v6
        with:
          # The default globs walk the whole checkout, node_modules included (minutes here).
          cache-dependency-glob: mocks/uv.lock
      - name: Start the mocks
        working-directory: mocks
        env:
          DATABASE_URL: postgres://mocks:mocks_dev@localhost:5432/mocks
          UV_ENV_FILE: .env.example
        run: |
          uv sync --locked
          uv run python manage.py migrate -v0
          uv run python manage.py seed_demo
          # The venv's python, not `uv run`: a uv process left running holds uv's cache lock, and
          # setup-uv's post-job cache prune then times out. It reads the same defaults itself.
          (database_url="$DATABASE_URL"; set -a; . ./.env.example; DATABASE_URL="$database_url"; set +a
            nohup .venv/bin/python manage.py runserver 0.0.0.0:8000 --noreload > "$RUNNER_TEMP/mocks.log" 2>&1 &
            echo $! > "$RUNNER_TEMP/mocks.pid")
          timeout 60 sh -c 'until curl -sf http://localhost:8000/health >/dev/null; do sleep 1; done'
      - name: Start notifications
        working-directory: services/notifications
        env:
          PORT: '4010'
          DATABASE_URL: postgres://adili_notifications:adili_notifications_dev@localhost:5432/adili_notifications
          RABBITMQ_URL: amqp://adili:adili_dev@localhost:5672
          SMS_GATEWAY_URL: http://localhost:8000/sms
          LOG_LEVEL: info
        # The committed local defaults fill in the rest; the job's environment takes precedence.
        run: |
          node --env-file=.env.example --import @swc-node/register/esm-register src/db/migrate.ts
          nohup node --env-file=.env.example --import @swc-node/register/esm-register src/main.ts \
            > "$RUNNER_TEMP/notifications.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/notifications.pid"
          timeout 60 sh -c 'until curl -sf http://localhost:4010/health/live >/dev/null; do sleep 1; done' \
            || { cat "$RUNNER_TEMP/notifications.log"; exit 1; }
      - name: Sign-in stack tests (S22, S23)
        env:
          TEST_KEYCLOAK_URL: http://localhost:8080
          TEST_MOCKS_URL: http://localhost:8000
        run: pnpm --filter @adili/keycloak-extension test:stack
      - name: Stack logs
        if: failure()
        run: |
          docker logs keycloak 2>&1 | tail -200
          tail -200 "$RUNNER_TEMP/notifications.log" "$RUNNER_TEMP/mocks.log" || true
      - name: Stop the mocks and notifications
        if: always()
        run: |
          for name in mocks notifications; do
            [ -f "$RUNNER_TEMP/$name.pid" ] && kill "$(cat "$RUNNER_TEMP/$name.pid")" 2>/dev/null || true
          done

  python:
    name: Python mocks (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.python == 'true'
    defaults:
      run:
        working-directory: mocks
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: mocks
          POSTGRES_PASSWORD: mocks_dev
          POSTGRES_DB: mocks
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mocks" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Local dev defaults come from .env.example (as in the package scripts); the job
      # environment takes precedence, so DATABASE_URL points at the service container.
      DATABASE_URL: postgres://mocks:mocks_dev@localhost:5432/mocks
      UV_ENV_FILE: .env.example
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy .
      - run: uv run pytest
      - name: External contracts match the mocks
        run: uv run python manage.py export_contracts && git diff --exit-code ../packages/schemas

  # Every service builds from the same Dockerfile, so one image checks it end to end; the
  # TypeScript job packages each affected service the way the image does.
  image:
    name: Service image (${{ fromJson(needs.plan.outputs.packaging)[0] }})
    runs-on: ubuntu-latest
    needs: [plan, typescript]
    if: needs.plan.outputs.packaging != '[]'
    steps:
      - uses: actions/checkout@v5
      - env:
          SERVICE: ${{ fromJson(needs.plan.outputs.packaging)[0] }}
        run: docker build -f infra/docker/service.Dockerfile --build-arg SERVICE="$SERVICE" .

  ci-passed:
    name: CI passed
    if: always()
    needs: [plan, typescript, keycloak, integration, python, image]
    runs-on: ubuntu-latest
    steps:
      # Plan skips the jobs a change does not need; a skipped job passes only if Plan did.
      - name: Require every gate
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          set -eu
          for job in plan typescript keycloak integration python image; do
            result=$(echo "$NEEDS" | jq -r --arg job "$job" '.[$job].result')
            echo "$job: $result"
            case "$job:$result" in
              *:success) ;;
              plan:*|typescript:*) echo "Required job $job did not succeed" >&2; exit 1 ;;
              *:skipped) ;;
              *) echo "Required job $job did not succeed" >&2; exit 1 ;;
            esac
          done
