name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test build --filter='!@adili/mocks'
      - run: pnpm deps:check

  integration:
    name: Integration (Postgres, RabbitMQ)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: adili_test
          POSTGRES_PASSWORD: adili_test_dev
          POSTGRES_DB: adili_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U adili_test" --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:4.3.6-alpine
        env:
          RABBITMQ_DEFAULT_USER: adili
          RABBITMQ_DEFAULT_PASS: adili_dev
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity" --health-interval 5s --health-timeout 10s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://adili_test:adili_test_dev@localhost:5432/adili_test
      TEST_RABBITMQ_URL: amqp://adili:adili_dev@localhost:5672
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  python:
    name: Python mocks (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mocks
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: mocks
          POSTGRES_PASSWORD: mocks_dev
          POSTGRES_DB: mocks
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mocks" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Local dev defaults come from .env.example (as in the package scripts); the job
      # environment takes precedence, so DATABASE_URL points at the service container.
      DATABASE_URL: postgres://mocks:mocks_dev@localhost:5432/mocks
      UV_ENV_FILE: .env.example
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy .
      - run: uv run pytest
      - name: External contracts match the mocks
        run: uv run python manage.py export_contracts && git diff --exit-code ../packages/schemas

  images:
    name: Image ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: typescript
    strategy:
      fail-fast: false
      matrix:
        service:
          - directory
          - declarations
          - review
          - access
          - reporting
          - documents
          - verification-api
          - ai-gateway
          - integration-gateway
          - notifications
          - audit
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/service.Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
