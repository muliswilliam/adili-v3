name: Keycloak

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: keycloak-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Own workflow so this does not fight #380's ci.yml edits. Compose already
# builds and uses image adili/keycloak:dev from infra/docker/keycloak.Dockerfile.

jobs:
  realm:
    name: Realm as code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # The check is a plain node script. setup-node@v5 otherwise looks
          # for pnpm because package.json pins packageManager.
          package-manager-cache: false
      - run: node scripts/check-keycloak-realm.mjs

  image:
    name: Theme image
    runs-on: ubuntu-latest
    needs: realm
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/keycloak.Dockerfile
          push: false
          tags: adili/keycloak:dev
          cache-from: type=gha,scope=keycloak
          cache-to: type=gha,mode=max,scope=keycloak
