name: Keycloak

# Called by ci.yml, so the integration job there runs against this exact image (one build per
# run). Compose builds the same image as adili/keycloak:dev from infra/docker/keycloak.Dockerfile.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  realm:
    name: Realm as code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # The check is a plain node script. setup-node@v5 otherwise looks
          # for pnpm because package.json pins packageManager.
          package-manager-cache: false
      - run: node scripts/check-keycloak-realm.mjs

  image:
    name: Theme image
    runs-on: ubuntu-latest
    needs: realm
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/keycloak.Dockerfile
          tags: adili/keycloak:dev
          outputs: type=docker,dest=${{ runner.temp }}/keycloak-image.tar
          cache-from: type=gha,scope=keycloak
          cache-to: type=gha,mode=max,scope=keycloak
      # For the integration job in ci.yml (identity contract suite against real Keycloak).
      - uses: actions/upload-artifact@v4
        with:
          name: keycloak-image
          path: ${{ runner.temp }}/keycloak-image.tar
          retention-days: 1
