name: Azure demo

# Terraform creates the VM on a laptop (state is local). This workflow ships the
# repo onto that VM after CI on main succeeds.

on:
  pull_request:
    paths:
      - 'infra/azure/**'
      - 'infra/compose/docker-compose.azure.yml'
      - '.github/workflows/azure-demo.yml'
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: azure-demo
  cancel-in-progress: false

permissions:
  contents: read

env:
  AZURE_DEMO_HOST: adili-demo.southafricanorth.cloudapp.azure.com
  AZURE_DEMO_USER: adili

jobs:
  terraform:
    name: Terraform validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/azure
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  deploy:
    name: Deploy to Azure VM
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: SSH key
        env:
          SSH_KEY: ${{ secrets.AZURE_DEMO_SSH_KEY }}
        run: |
          test -n "$SSH_KEY" || { echo 'Set repo secret AZURE_DEMO_SSH_KEY' >&2; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          install -m 644 infra/azure/known_hosts ~/.ssh/known_hosts
      - name: Sync repo to /opt/adili
        # AI fixtures recorded on the VM (`pnpm demo:ai record`) survive the --delete.
        run: |
          rsync -az --delete --exclude-from=infra/azure/rsync-exclude \
            --filter='P services/ai-gateway/fixtures/demo/*.json' \
            ./ "${AZURE_DEMO_USER}@${AZURE_DEMO_HOST}:/opt/adili/"
      - name: AI provider settings
        # Over stdin into a file only adili reads; never on a command line or in the log. Either
        # an Anthropic API key, or a self-hosted LLM Gateway's token with its URL (repo variables).
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          ANTHROPIC_STRUCTURED_OUTPUT: ${{ vars.ANTHROPIC_STRUCTURED_OUTPUT }}
          ANTHROPIC_ATTACHMENTS: ${{ vars.ANTHROPIC_ATTACHMENTS }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$ANTHROPIC_AUTH_TOKEN" ]; then
            echo '::warning::Neither repo secret ANTHROPIC_API_KEY nor ANTHROPIC_AUTH_TOKEN is set. The demo AI stays on replay unless /etc/adili/secrets.env on the VM has one.'
            exit 0
          fi
          for name in ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN ANTHROPIC_BASE_URL \
            ANTHROPIC_STRUCTURED_OUTPUT ANTHROPIC_ATTACHMENTS AI_MODEL; do
            value=$(printenv "$name" || true)
            if [ -n "$value" ]; then printf '%s=%s\n' "$name" "$value"; fi
          done |
            ssh "${AZURE_DEMO_USER}@${AZURE_DEMO_HOST}" \
              'umask 077 && mkdir -p ~/.config/adili && cat > ~/.config/adili/secrets.env'
      - name: Run deploy.sh
        run: ssh "${AZURE_DEMO_USER}@${AZURE_DEMO_HOST}" '/opt/adili/infra/azure/deploy.sh'
      - name: Check HTTPS
        run: |
          fqdn="$AZURE_DEMO_HOST"
          for i in $(seq 1 36); do
            p=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 "https://$fqdn/" || echo down)
            c=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 "https://$fqdn:3020/" || echo down)
            k=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 \
              "https://$fqdn:8080/realms/adili/.well-known/openid-configuration" || echo down)
            echo "t=$i portal=$p console=$c keycloak=$k"
            if [ "$p" = 200 ] && [ "$c" = 200 ] && [ "$k" = 200 ]; then
              exit 0
            fi
            sleep 8
          done
          echo 'HTTPS checks did not return 200' >&2
          exit 1
      - name: Check security headers
        run: ./infra/azure/check-security-headers.sh "https://${AZURE_DEMO_HOST}"
      - name: Check the real backend
        # Every app with mocks off and the AI provider real (#615). A warning, not a failed
        # deploy: the AI provider is replay until a key is installed.
        continue-on-error: true
        run: |
          for _ in $(seq 1 12); do
            if ssh "${AZURE_DEMO_USER}@${AZURE_DEMO_HOST}" '/opt/adili/infra/azure/demo-command.sh check'; then
              exit 0
            fi
            sleep 10
          done
          echo '::warning::The hosted demo is not on the real backend; see the output above.'
          exit 1
