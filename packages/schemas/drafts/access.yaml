# Drafted operations of the access API (spec 10) not implemented yet. `pnpm --filter @adili/access
# contracts` merges them into packages/schemas/internal/access.yaml (marked `x-draft`), where they
# may reference the implemented components (e.g. `#/components/schemas/AccessRequest`, `Scope`,
# `Decision`, `RegisterEntry`, `ProblemDetails`). When an operation or component is implemented,
# delete it here: the export fails while both define it.
paths:
  /v1/me/access-history:
    get:
      tags: [declarant]
      operationId: getMyAccessHistory
      summary: Who accessed my declaration (register entries visible to the declarant)
      responses:
        '200':
          description: Entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegisterEntry'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/me/certified-copies:
    post:
      tags: [declarant]
      operationId: requestCertifiedCopy
      summary: Certified copy of one of my submitted versions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [declarationId, version]
              properties:
                declarationId:
                  type: string
                  format: uuid
                version:
                  type: integer
                  minimum: 1
      responses:
        '202':
          description: Issuance requested; poll the copy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertifiedCopy'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags: [declarant]
      operationId: listMyCertifiedCopies
      summary: My certified copies with download links
      responses:
        '200':
          description: Copies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CertifiedCopy'
  /v1/lea/requests:
    post:
      tags: [lea]
      operationId: submitLeaRequest
      summary: Law-enforcement officer submits a written request (no Form K); allocates the LEA reference
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaRequestInput'
      responses:
        '201':
          description: Received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaRequest'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [lea]
      operationId: listMyLeaRequests
      summary: The officer's requests
      responses:
        '200':
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaRequest'
  /v1/lea/requests/{leaRequestId}:
    parameters:
      - $ref: '#/components/parameters/LeaRequestId'
    get:
      tags: [lea]
      operationId: getLeaRequest
      summary: One request (officer who filed it, or the Commission's access officer)
      responses:
        '200':
          description: Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/lea/requests/{leaRequestId}/verify:
    parameters:
      - $ref: '#/components/parameters/LeaRequestId'
    post:
      tags: [officer]
      operationId: verifyLeaRequest
      summary: Access officer records the provenance and reason check and resolves the officer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rosterRecordId, note]
              properties:
                rosterRecordId:
                  type: [string, 'null']
                  format: uuid
                note:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/lea/requests/{leaRequestId}/decision:
    parameters:
      - $ref: '#/components/parameters/LeaRequestId'
    post:
      tags: [officer]
      operationId: decideLeaRequest
      summary: Grant (package, declarant notified after) or deny with reasons
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionInput'
      responses:
        '200':
          description: Decided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already decided
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/lea/requests/{leaRequestId}/package/download:
    parameters:
      - $ref: '#/components/parameters/LeaRequestId'
    get:
      tags: [lea]
      operationId: downloadLeaPackage
      summary: Short-lived link to the granted package (registered)
      responses:
        '200':
          description: Link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadLink'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Download window expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  parameters:
    LeaRequestId:
      name: leaRequestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
  responses:
    NotFound:
      description: Not found, or not visible to the caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Caller lacks the required role
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationProblem:
      description: Request failed validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    LeaRequestStatus:
      type: string
      enum: [received, verified, granted, denied, withdrawn]
    CertifiedCopy:
      type: object
      required:
        [id, declarationId, version, status, documentId, verificationId, downloadUrl, requestedAt]
      properties:
        id:
          type: string
          format: uuid
        declarationId:
          type: string
          format: uuid
        version:
          type: integer
        status:
          type: string
          enum: [pending, issued, failed]
        documentId:
          type: [string, 'null']
          format: uuid
        verificationId:
          type: [string, 'null']
        downloadUrl:
          type: [string, 'null']
          format: uri
        requestedAt:
          type: string
          format: date-time
    LeaRequestInput:
      type: object
      required: [commission, officerSought, reason, caseReference, scope]
      properties:
        commission:
          type: string
        officerSought:
          type: object
          required: [name]
          properties:
            name:
              type: string
            entity:
              type: string
            workStation:
              type: string
            personnelFileNumber:
              type: string
        reason:
          type: string
          minLength: 1
          maxLength: 4000
        caseReference:
          type: string
          maxLength: 100
        scope:
          $ref: '#/components/schemas/Scope'
    LeaRequest:
      type: object
      required:
        [
          id,
          reference,
          commission,
          agency,
          officer,
          officerSought,
          reason,
          caseReference,
          scope,
          status,
          receivedAt,
          deadlineAt,
          verification,
          decision,
          package,
          timeline,
        ]
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          description: 'LEA-<ISSUER>-<YEAR>-<seq>-<check>'
        commission:
          type: object
          required: [slug, name]
          properties:
            slug:
              type: string
            name:
              type: string
        agency:
          type: object
          required: [code, name]
          properties:
            code:
              type: string
            name:
              type: string
        officer:
          type: object
          required: [subject, name]
          properties:
            subject:
              type: string
            name:
              type: string
        officerSought:
          type: object
          additionalProperties: true
        reason:
          type: string
        caseReference:
          type: string
        scope:
          $ref: '#/components/schemas/Scope'
        status:
          $ref: '#/components/schemas/LeaRequestStatus'
        receivedAt:
          type: string
          format: date-time
        deadlineAt:
          type: string
          format: date-time
        verification:
          oneOf:
            - type: object
              required: [by, at, note]
              properties:
                by:
                  type: string
                at:
                  type: string
                  format: date-time
                note:
                  type: string
            - type: 'null'
        decision:
          oneOf:
            - $ref: '#/components/schemas/Decision'
            - type: 'null'
        package:
          oneOf:
            - $ref: '#/components/schemas/Package'
            - type: 'null'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/RegisterEntry'
    DownloadLink:
      type: object
      required: [downloadUrl, expiresAt, sha256]
      properties:
        downloadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
        sha256:
          type: string
