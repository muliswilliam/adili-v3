# Drafted operations of the ai-gateway API for specs not implemented yet: document extraction
# (spec 05b, `extract-document`), whose task is not registered yet.
# `pnpm --filter @adili/ai-gateway contracts` merges them into
# packages/schemas/internal/ai-gateway.yaml, where they may reference the implemented components
# (e.g. `#/components/schemas/TaskRequest`, `AiLabel`, `ProblemDetails`). When an operation or
# component is implemented, delete it here: the export fails while both define it. A task's
# input and output come from its Zod schemas once the task is registered.
paths: {}
components:
  schemas:
    ExtractDocumentInput:
      type: object
      required: [kind, documentKindHint, targetItemType, attachment, language]
      properties:
        kind:
          const: extract-document
        documentKindHint:
          type: string
          enum: [title-deed, logbook, payslip, bank-letter, share-certificate, other]
        targetItemType:
          type: string
          description: Second Schedule item type from declaration.v1 the fields must fit
        attachment:
          type: object
          required: [downloadUrl, contentType, sha256]
          properties:
            downloadUrl:
              type: string
              format: uri
              description: Short-lived internal URL from the documents service
            contentType:
              type: string
            sha256:
              type: string
        language:
          type: string
          enum: [en, sw]
    ExtractDocumentOutput:
      type: object
      required: [label, detectedKind, fields, warnings]
      properties:
        label:
          $ref: '#/components/schemas/AiLabel'
        detectedKind:
          type: string
        fields:
          type: array
          items:
            type: object
            required: [name, value, confidence, page]
            properties:
              name:
                type: string
                description: Field path within the target item type
              value:
                description: Typed per field; strings, numbers or dates
              confidence:
                type: number
                minimum: 0
                maximum: 1
              page:
                type: [integer, 'null']
        warnings:
          type: array
          items:
            type: string
