# Drafted parts of the notifications API for specs not implemented yet. `pnpm --filter
# @adili/notifications contracts` merges them into packages/schemas/internal/notifications.yaml.
# When something is implemented, delete it here: the export fails while both define it.
#
# Templates are code, not drafts: `TemplateId` lists what services/notifications/src/messages/
# templates.ts registers. The templates later specs send (07a clarifications, 08 decisions,
# notices, salary stoppage and reinstatement, 09 Form M, access requests and law-enforcement
# access) are planned below; a spec moves its ids into templates.ts and deletes them from
# `PlannedTemplateId`.
components:
  schemas:
    PlannedTemplateId:
      type: string
      description: Templates later specs register. Not accepted yet; each moves into `TemplateId` when implemented.
      enum:
        - clarification-issued-email
        - clarification-issued-sms
        - clarification-reminder-email
        - clarification-reminder-sms
        - decision-email
        - decision-sms
        - notice-email
        - notice-sms
        - salary-stopped-email
        - salary-stopped-sms
        - salary-reinstated-email
        - salary-reinstated-sms
        - form-m-draft-ready-email
        - form-m-reminder-email
        - form-m-chase-email
        - form-m-receipt-email
        - access-request-acknowledged-email
        - access-request-notified-email
        - access-request-notified-sms
        - access-decision-applicant-email
        - access-decision-declarant-email
        - access-package-ready-email
        - access-officer-reminder-email
        - lea-grant-notice-email
        - lea-decision-email
        - certified-copy-ready-email
