# Drafted operations of the documents API for specs not implemented yet: 06 (document issuance)
# and the specs that issue documents through it (07a, 08, 09). `pnpm --filter @adili/documents contracts`
# merges them into packages/schemas/internal/documents.yaml, where they may reference the
# implemented components (e.g. `#/components/schemas/ProblemDetails`). When an operation or
# component is implemented, delete it here: the export fails while both define it.
#
# Upload purposes are code, not drafts: later specs add theirs (declaration-attachment,
# clarification-attachment, action-response, access-representation) to UPLOAD_PURPOSES in
# services/documents/src/uploads/purposes.ts, which widens the UploadPurpose enum.
paths:
  /internal/v1/documents/issue:
    post:
      tags: [internal]
      operationId: issueDocument
      summary: Render, sign and register a document (services)
      description: |
        Gotenberg PDF from a versioned template with the verification code and QR in the footer,
        PAdES signature, SHA-256, Ed25519-signed verification record, object storage, event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueDocument'
      responses:
        '201':
          description: Issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedDocument'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '502':
          description: Renderer or signer unavailable; nothing registered
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/documents/{documentId}/supersede:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      tags: [internal]
      operationId: supersedeDocument
      summary: Mark a document superseded by a newer one
      description: |
        Sets `status` to superseded and `supersededBy` to the newer document. A document
        already superseded or revoked is refused with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supersededBy]
              properties:
                supersededBy:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Superseded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedDocument'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already superseded or revoked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/documents/{documentId}/revoke:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      tags: [internal]
      operationId: revokeDocument
      summary: Revoke an issued document (services)
      description: |
        Sets `status` to revoked with the reason, e.g. a clarification letter withdrawn as issued
        in error (spec 07a); the verify page then shows the document revoked. Service tokens with
        scope documents:internal, acting in X-Acting-Tenant for the issuing tenant. A document
        already revoked is refused with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  $ref: '#/components/schemas/RevocationReason'
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedDocument'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already revoked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [documents]
      operationId: getDocument
      summary: Metadata of an issued document (owner)
      description: |
        The subject person (`subjectPersonId`) only; anyone else gets 404.
      responses:
        '200':
          description: Metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedDocument'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/documents/{documentId}/download:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [documents]
      operationId: getDocumentDownload
      summary: Short-lived presigned download of an issued PDF (owner)
      description: |
        The subject person only; audited, and emits `document.downloaded.v1`. Refused with 410
        once the document's download window has ended.
      responses:
        '200':
          description: Download URL valid for five minutes
          content:
            application/json:
              schema:
                type: object
                required: [downloadUrl, expiresAt, sha256]
                properties:
                  downloadUrl:
                    type: string
                    format: uri
                  expiresAt:
                    type: string
                    format: date-time
                  sha256:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Download window has ended
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ValidationProblem:
      description: Request failed validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Not found, or not visible to the caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    DocumentType:
      type: string
      enum:
        - acknowledgement-slip
        - clarification-letter
        - decision-letter
        - notice-to-comply
        - warning
        - salary-stoppage
        - disciplinary-referral
        - referral-package
        - form-m
        - compliance-report-receipt
        - ncr
        - access-package
        - certified-copy
        - open-data-manifest
    DisclosureLevel:
      type: string
      enum: [public, restricted, confidential]
    DocumentStatus:
      type: string
      enum: [valid, superseded, revoked, expired]
    RevocationReason:
      type: string
      enum: [issued-in-error]
    IssueDocument:
      type: object
      required:
        [
          type,
          templateVersion,
          disclosureLevel,
          issuerTenant,
          subjectRef,
          subjectPersonId,
          payload,
          publicPayload,
        ]
      properties:
        type:
          $ref: '#/components/schemas/DocumentType'
        templateVersion:
          type: integer
          minimum: 1
        disclosureLevel:
          $ref: '#/components/schemas/DisclosureLevel'
        issuerTenant:
          type: string
        subjectRef:
          type: string
          description: Owning record, e.g. declaration-version:<uuid>
        subjectPersonId:
          type: [string, 'null']
          format: uuid
          description: Person allowed to download the document
        payload:
          type: object
          description: Fields the template renders; never stored beyond the PDF
          additionalProperties: true
        publicPayload:
          type: object
          description: Fields shown on the verify page for public and restricted levels
          additionalProperties: true
        watermark:
          oneOf:
            - $ref: '#/components/schemas/Watermark'
            - type: 'null'
          description: Rendered on every page (access packages)
        downloadWindowDays:
          type: [integer, 'null']
          minimum: 1
          maximum: 365
          description: Downloads refused after issuedAt + window (410); null means no window
    Watermark:
      type: object
      required: [recipientName, reference, date]
      properties:
        recipientName:
          type: string
        reference:
          type: string
          description: ARQ or LEA reference
        date:
          type: string
          format: date
    IssuedDocument:
      type: object
      required:
        - id
        - type
        - templateVersion
        - disclosureLevel
        - issuerTenant
        - subjectRef
        - verificationId
        - sha256
        - status
        - supersededBy
        - issuedAt
        - downloadExpiresAt
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/DocumentType'
        templateVersion:
          type: integer
        disclosureLevel:
          $ref: '#/components/schemas/DisclosureLevel'
        issuerTenant:
          type: string
        subjectRef:
          type: string
        verificationId:
          type: string
          description: e.g. ADL-7Q4K-M2XR-9HTC-2B7F-Q3ZD-9K
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        status:
          $ref: '#/components/schemas/DocumentStatus'
        supersededBy:
          type: [string, 'null']
          format: uuid
        issuedAt:
          type: string
          format: date-time
        downloadExpiresAt:
          type: [string, 'null']
          format: date-time
