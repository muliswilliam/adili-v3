# Drafted operations of the documents API for specs not implemented yet: 07a (revoking a
# clarification letter withdrawn as issued in error). `pnpm --filter @adili/documents contracts`
# merges them into packages/schemas/internal/documents.yaml, where they may reference the
# implemented components (e.g. `#/components/schemas/IssuedDocument`, `ProblemDetails`). When an
# operation or component is implemented, delete it here: the export fails while both define it.
paths:
  /internal/v1/documents/{documentId}/revoke:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/ActingTenant'
    post:
      tags: [internal]
      operationId: revokeDocument
      summary: Revoke an issued document (services)
      description: |
        Sets `status` to revoked with the reason, e.g. a clarification letter withdrawn as issued
        in error (spec 07a); the verify page then shows the document revoked. Service tokens with
        scope documents:internal, acting in X-Acting-Tenant for the issuing tenant. A document
        already revoked is refused with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  $ref: '#/components/schemas/RevocationReason'
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedDocument'
        '404':
          description: Not found, or not the acting tenant's document
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Already revoked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  parameters:
    ActingTenant:
      name: X-Acting-Tenant
      in: header
      required: true
      description: Tenant the calling service acts for; the resource must belong to it
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]{1,19}$'
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    RevocationReason:
      type: string
      enum: [issued-in-error]
