# Drafted operations of the integration-gateway API for specs not implemented yet: 07b (KRA,
# NTSA, BRS and ArdhiSasa cross-checks, stored verification results, coverage and pause), 08
# (payroll instructions) and 09 (ICMS referrals). `pnpm --filter @adili/integration-gateway
# contracts` merges them into packages/schemas/internal/integration-gateway.yaml, where they may
# reference the implemented components (e.g. `#/components/schemas/ProblemDetails`). When an
# operation or component is implemented, delete it here: the export fails while both define it.
paths:
  /internal/v1/kra/taxpayers:
    get:
      tags: [internal]
      operationId: lookupKraTaxpayer
      summary: KRA PIN(s), taxpayer and compliance for a national ID
      parameters:
        - $ref: '#/components/parameters/NationalIdQuery'
        - $ref: '#/components/parameters/CaseRef'
        - $ref: '#/components/parameters/LegalBasis'
      responses:
        '200':
          description: Result (found, not-found or unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KraResult'
        '400':
          $ref: '#/components/responses/MissingLegalBasis'
  /internal/v1/ntsa/owners/{nationalId}/vehicles:
    parameters:
      - $ref: '#/components/parameters/NationalIdPath'
      - $ref: '#/components/parameters/CaseRef'
      - $ref: '#/components/parameters/LegalBasis'
    get:
      tags: [internal]
      operationId: lookupNtsaVehicles
      summary: Vehicles registered to a national ID
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NtsaResult'
        '400':
          $ref: '#/components/responses/MissingLegalBasis'
  /internal/v1/brs/persons/{nationalId}/directorships:
    parameters:
      - $ref: '#/components/parameters/NationalIdPath'
      - $ref: '#/components/parameters/CaseRef'
      - $ref: '#/components/parameters/LegalBasis'
    get:
      tags: [internal]
      operationId: lookupBrsDirectorships
      summary: Directorships and shareholdings of a national ID
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrsResult'
        '400':
          $ref: '#/components/responses/MissingLegalBasis'
  /internal/v1/brs/companies/{registrationNumber}/supplies:
    parameters:
      - name: registrationNumber
        in: path
        required: true
        schema:
          type: string
      - name: employerCode
        in: query
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CaseRef'
      - $ref: '#/components/parameters/LegalBasis'
    get:
      tags: [internal]
      operationId: checkCompanySuppliesEmployer
      summary: Whether a company appears in an employer's supplier list (HR mock)
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierCheckResult'
        '400':
          $ref: '#/components/responses/MissingLegalBasis'
  /internal/v1/ardhisasa/owners/{nationalId}/parcels:
    parameters:
      - $ref: '#/components/parameters/NationalIdPath'
      - $ref: '#/components/parameters/CaseRef'
      - $ref: '#/components/parameters/LegalBasis'
    get:
      tags: [internal]
      operationId: lookupArdhisasaParcels
      summary: Land parcels registered to a national ID
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArdhisasaResult'
        '400':
          $ref: '#/components/responses/MissingLegalBasis'
  /internal/v1/verification-results/{resultId}:
    parameters:
      - name: resultId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [internal]
      operationId: getVerificationResult
      summary: A stored lookup result, decrypted for the requesting tenant's services (audited)
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredResult'
        '404':
          description: Not found or other tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/integrations/coverage:
    get:
      tags: [integrations]
      operationId: getIntegrationsCoverage
      summary: Per-system call volume, cache hit rate, breaker state, last success (platform-admin)
      responses:
        '200':
          description: Coverage
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SystemCoverage'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/integrations/{system}/pause:
    parameters:
      - $ref: '#/components/parameters/System'
    post:
      tags: [integrations]
      operationId: pauseIntegration
      summary: Force lookups to unavailable during a known outage (platform-admin)
      responses:
        '200':
          description: Paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemCoverage'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/integrations/{system}/resume:
    parameters:
      - $ref: '#/components/parameters/System'
    post:
      tags: [integrations]
      operationId: resumeIntegration
      summary: Resume lookups (platform-admin)
      responses:
        '200':
          description: Resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemCoverage'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/payroll/instructions:
    post:
      tags: [internal]
      operationId: submitPayrollInstruction
      summary: Send a stop or resume salary instruction to payroll (idempotent by instruction reference)
      parameters:
        - $ref: '#/components/parameters/CaseRef'
        - $ref: '#/components/parameters/LegalBasis'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayrollInstructionRequest'
      responses:
        '201':
          description: Acknowledged by payroll
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollInstruction'
        '200':
          description: Already submitted (replay)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollInstruction'
        '400':
          $ref: '#/components/responses/MissingLegalBasis'
        '503':
          description: Payroll unavailable; nothing recorded as sent
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/payroll/instructions/{instructionReference}:
    parameters:
      - name: instructionReference
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [internal]
      operationId: getPayrollInstruction
      summary: Stored instruction and acknowledgement
      responses:
        '200':
          description: Instruction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollInstruction'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/icms/referrals:
    post:
      tags: [internal]
      operationId: submitIcmsReferral
      summary: Register a referral with ICMS and return the case number (idempotent by referral reference)
      parameters:
        - $ref: '#/components/parameters/CaseRef'
        - $ref: '#/components/parameters/LegalBasis'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IcmsReferralRequest'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcmsReferral'
        '200':
          description: Already registered (replay)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcmsReferral'
        '400':
          $ref: '#/components/responses/MissingLegalBasis'
        '503':
          description: ICMS unavailable; nothing registered
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/icms/referrals/{referralReference}:
    parameters:
      - name: referralReference
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [internal]
      operationId: getIcmsReferral
      summary: Stored ICMS registration for a referral reference
      responses:
        '200':
          description: Registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcmsReferral'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  parameters:
    NationalIdPath:
      name: nationalId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9]{5,10}$'
    NationalIdQuery:
      name: nationalId
      in: query
      required: true
      schema:
        type: string
        pattern: '^[0-9]{5,10}$'
    CaseRef:
      name: X-Case-Ref
      in: header
      required: false
      description: Review case the lookup is for; recorded on the result and the audit event
      schema:
        type: string
    LegalBasis:
      name: X-Legal-Basis
      in: header
      required: true
      description: e.g. regs-r20-1-b, act-s35-5, adr-014-onboarding, declarant-request (lookups the declarant asked for while filing; DPA s.30(1)(a))
      schema:
        type: string
    System:
      name: system
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/System'
  responses:
    MissingLegalBasis:
      description: X-Legal-Basis header missing or unknown
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    System:
      type: string
      enum: [iprs, kra, ntsa, brs, ardhisasa, payroll, icms]
    LookupOutcome:
      type: string
      enum: [found, not-found, unavailable]
    UnavailableReason:
      type: string
      description: rate-limited when no slot of the system's rate limit freed up within the max queue wait
      enum: [timeout, breaker-open, paused, rate-limited, upstream-error]
    ResultEnvelope:
      type: object
      required: [resultId, system, outcome, reason, cached, checkedAt]
      properties:
        resultId:
          type: string
          format: uuid
        system:
          $ref: '#/components/schemas/System'
        outcome:
          $ref: '#/components/schemas/LookupOutcome'
        reason:
          oneOf:
            - $ref: '#/components/schemas/UnavailableReason'
            - type: 'null'
        cached:
          type: boolean
        checkedAt:
          type: string
          format: date-time
    KraResult:
      allOf:
        - $ref: '#/components/schemas/ResultEnvelope'
        - type: object
          required: [taxpayers]
          properties:
            taxpayers:
              type: array
              items:
                type: object
                required: [pin, registeredOn, compliance]
                properties:
                  pin:
                    type: string
                  registeredOn:
                    type: string
                    format: date
                  compliance:
                    type: object
                    required: [status, certificateNumber, validUntil, annualIncomeDeclaredCents]
                    properties:
                      status:
                        type: string
                        enum: [compliant, non-compliant, unknown]
                      certificateNumber:
                        type: [string, 'null']
                      validUntil:
                        type: [string, 'null']
                        format: date
                      annualIncomeDeclaredCents:
                        type: [integer, 'null']
    NtsaResult:
      allOf:
        - $ref: '#/components/schemas/ResultEnvelope'
        - type: object
          required: [vehicles]
          properties:
            vehicles:
              type: array
              items:
                type: object
                required: [registrationNumber, make, model, yearOfManufacture, registeredOn]
                properties:
                  registrationNumber:
                    type: string
                  make:
                    type: string
                  model:
                    type: string
                  yearOfManufacture:
                    type: integer
                  registeredOn:
                    type: string
                    format: date
    BrsResult:
      allOf:
        - $ref: '#/components/schemas/ResultEnvelope'
        - type: object
          required: [directorships]
          properties:
            directorships:
              type: array
              items:
                type: object
                required:
                  [companyRegistrationNumber, companyName, companyStatus, role, shares, appointedOn]
                properties:
                  companyRegistrationNumber:
                    type: string
                  companyName:
                    type: string
                  companyStatus:
                    type: string
                  role:
                    type: string
                  shares:
                    type: [number, 'null']
                  appointedOn:
                    type: string
                    format: date
    SupplierCheckResult:
      allOf:
        - $ref: '#/components/schemas/ResultEnvelope'
        - type: object
          required: [supplies]
          properties:
            supplies:
              type: [boolean, 'null']
              description: null when unavailable
    ArdhisasaResult:
      allOf:
        - $ref: '#/components/schemas/ResultEnvelope'
        - type: object
          required: [parcels]
          properties:
            parcels:
              type: array
              items:
                type: object
                required: [parcelNumber, county, areaHectares, tenure, registeredOn]
                properties:
                  parcelNumber:
                    type: string
                  county:
                    type: string
                  areaHectares:
                    type: number
                  tenure:
                    type: string
                  registeredOn:
                    type: string
                    format: date
    StoredResult:
      type: object
      required: [resultId, system, outcome, checkedAt, legalBasis, payload]
      properties:
        resultId:
          type: string
          format: uuid
        system:
          $ref: '#/components/schemas/System'
        outcome:
          $ref: '#/components/schemas/LookupOutcome'
        checkedAt:
          type: string
          format: date-time
        legalBasis:
          type: string
        payload:
          type: object
          description: The normalised records as returned by the lookup
          additionalProperties: true
    SystemCoverage:
      type: object
      required:
        [
          system,
          calls24h,
          cacheHitRate,
          breaker,
          lastSuccessAt,
          paused,
          rateLimitPerMinute,
          cacheTtlSeconds,
        ]
      properties:
        system:
          $ref: '#/components/schemas/System'
        calls24h:
          type: integer
        cacheHitRate:
          type: number
          minimum: 0
          maximum: 1
        breaker:
          type: string
          enum: [closed, open, half-open]
        lastSuccessAt:
          type: [string, 'null']
          format: date-time
        paused:
          type: boolean
        rateLimitPerMinute:
          type: integer
        cacheTtlSeconds:
          type: integer
    PayrollAction:
      type: string
      enum: [stop_salary, resume_salary]
    PayrollInstructionRequest:
      type: object
      required:
        [
          instructionReference,
          employerCode,
          personalNumber,
          nationalId,
          action,
          reason,
          effectiveDate,
        ]
      properties:
        instructionReference:
          type: string
          description: The ADM reference (stop) or ADM reference with -R suffix (resume)
        employerCode:
          type: string
        personalNumber:
          type: string
        nationalId:
          type: string
        action:
          $ref: '#/components/schemas/PayrollAction'
        reason:
          type: string
          maxLength: 500
        effectiveDate:
          type: string
          format: date
    PayrollInstruction:
      type: object
      required: [instructionReference, action, status, payrollReference, receivedAt, sentAt]
      properties:
        instructionReference:
          type: string
        action:
          $ref: '#/components/schemas/PayrollAction'
        status:
          type: string
          enum: [accepted, pending, failed]
        payrollReference:
          type: [string, 'null']
        receivedAt:
          type: [string, 'null']
          format: date-time
        sentAt:
          type: string
          format: date-time
    IcmsReferralRequest:
      type: object
      required: [referralReference, nationalId, fullName, referringCommission, grounds, details]
      properties:
        referralReference:
          type: string
          description: The RFL reference
        nationalId:
          type: string
        fullName:
          type: string
        referringCommission:
          type: string
          description: Issuer code
        grounds:
          type: string
        details:
          type: string
          maxLength: 8000
    IcmsReferral:
      type: object
      required: [referralReference, caseNumber, status, registeredAt, sentAt]
      properties:
        referralReference:
          type: string
        caseNumber:
          type: [string, 'null']
        status:
          type: string
          enum: [registered, pending, failed]
        registeredAt:
          type: [string, 'null']
          format: date-time
        sentAt:
          type: string
          format: date-time
