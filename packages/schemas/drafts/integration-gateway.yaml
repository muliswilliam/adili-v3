# Drafted operations of the integration-gateway API for specs not implemented yet: 08 (payroll
# instructions) and 09 (ICMS referrals).
# `pnpm --filter @adili/integration-gateway contracts` merges them into
# packages/schemas/internal/integration-gateway.yaml, where they may reference the implemented
# components (e.g. `#/components/schemas/ProblemDetails`). When an operation or component is
# implemented, delete it here: the export fails while both define it.
paths:
  /internal/v1/payroll/instructions:
    post:
      tags: [internal]
      operationId: submitPayrollInstruction
      summary: Send a stop or resume salary instruction to payroll (idempotent by instruction reference)
      parameters:
        - $ref: '#/components/parameters/CaseRef'
        - $ref: '#/components/parameters/LegalBasis'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayrollInstructionRequest'
      responses:
        '201':
          description: Acknowledged by payroll
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollInstruction'
        '200':
          description: Already submitted (replay)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollInstruction'
        '400':
          $ref: '#/components/responses/MissingLegalBasis'
        '503':
          description: Payroll unavailable; nothing recorded as sent
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/payroll/instructions/{instructionReference}:
    parameters:
      - name: instructionReference
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [internal]
      operationId: getPayrollInstruction
      summary: Stored instruction and acknowledgement
      responses:
        '200':
          description: Instruction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollInstruction'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/icms/referrals:
    post:
      tags: [internal]
      operationId: submitIcmsReferral
      summary: Register a referral with ICMS and return the case number (idempotent by referral reference)
      parameters:
        - $ref: '#/components/parameters/CaseRef'
        - $ref: '#/components/parameters/LegalBasis'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IcmsReferralRequest'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcmsReferral'
        '200':
          description: Already registered (replay)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcmsReferral'
        '400':
          $ref: '#/components/responses/MissingLegalBasis'
        '503':
          description: ICMS unavailable; nothing registered
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/icms/referrals/{referralReference}:
    parameters:
      - name: referralReference
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [internal]
      operationId: getIcmsReferral
      summary: Stored ICMS registration for a referral reference
      responses:
        '200':
          description: Registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcmsReferral'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  parameters:
    CaseRef:
      name: X-Case-Ref
      in: header
      required: false
      description: Review case the lookup is for; recorded on the result and the audit event
      schema:
        type: string
    LegalBasis:
      name: X-Legal-Basis
      in: header
      required: true
      description: e.g. regs-r20-1-b, act-s35-5, adr-014-onboarding, declarant-request
      schema:
        type: string
  responses:
    MissingLegalBasis:
      description: X-Legal-Basis header missing or unknown
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    PayrollAction:
      type: string
      enum: [stop_salary, resume_salary]
    PayrollInstructionRequest:
      type: object
      required:
        [
          instructionReference,
          employerCode,
          personalNumber,
          nationalId,
          action,
          reason,
          effectiveDate,
        ]
      properties:
        instructionReference:
          type: string
          description: The ADM reference (stop) or ADM reference with -R suffix (resume)
        employerCode:
          type: string
        personalNumber:
          type: string
        nationalId:
          type: string
        action:
          $ref: '#/components/schemas/PayrollAction'
        reason:
          type: string
          maxLength: 500
        effectiveDate:
          type: string
          format: date
    PayrollInstruction:
      type: object
      required: [instructionReference, action, status, payrollReference, receivedAt, sentAt]
      properties:
        instructionReference:
          type: string
        action:
          $ref: '#/components/schemas/PayrollAction'
        status:
          type: string
          enum: [accepted, pending, failed]
        payrollReference:
          type: [string, 'null']
        receivedAt:
          type: [string, 'null']
          format: date-time
        sentAt:
          type: string
          format: date-time
    IcmsReferralRequest:
      type: object
      required: [referralReference, nationalId, fullName, referringCommission, grounds, details]
      properties:
        referralReference:
          type: string
          description: The RFL reference
        nationalId:
          type: string
        fullName:
          type: string
        referringCommission:
          type: string
          description: Issuer code
        grounds:
          type: string
        details:
          type: string
          maxLength: 8000
    IcmsReferral:
      type: object
      required: [referralReference, caseNumber, status, registeredAt, sentAt]
      properties:
        referralReference:
          type: string
        caseNumber:
          type: [string, 'null']
        status:
          type: string
          enum: [registered, pending, failed]
        registeredAt:
          type: [string, 'null']
          format: date-time
        sentAt:
          type: string
          format: date-time
