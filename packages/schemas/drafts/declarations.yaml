# Drafted operations of the declarations API for specs not implemented yet: document
# extraction, the assistant and help. `pnpm --filter @adili/declarations contracts` merges them into
# packages/schemas/internal/declarations.yaml, where they may reference the implemented
# components (e.g. `#/components/schemas/Obligation`, `CommissionRef`, `ObligationType`,
# `ProblemDetails`). When an operation or component is implemented, delete it here: the export
# fails while both define it.
paths:
  /v1/declarations/{declarationId}/attachments/{attachmentId}/extract:
    parameters:
      - $ref: '#/components/parameters/DeclarationId'
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [suggestions]
      operationId: extractAttachment
      summary: Read a clean attachment into suggested fields through the ai-gateway (declarant); policy-gated
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentKindHint, targetItemType]
              properties:
                documentKindHint:
                  type: string
                  enum: [title-deed, logbook, payslip, bank-letter, share-certificate, other]
                targetItemType:
                  type: string
                language:
                  type: string
                  enum: [en, sw]
                  default: en
      responses:
        '202':
          description: Extraction requested; a suggestion set of source `document`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionSet'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Attachment not clean, or AI reading not enabled for this Commission (`not-enabled`)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/me/assistant/suggested-questions:
    get:
      tags: [assistant]
      operationId: getSuggestedQuestions
      summary: Curated and popular questions for a section in a language
      parameters:
        - name: sectionKey
          in: query
          schema:
            type: string
        - name: language
          in: query
          required: true
          schema:
            type: string
            enum: [en, sw]
      responses:
        '200':
          description: Questions
          content:
            application/json:
              schema:
                type: array
                maxItems: 8
                items:
                  type: string
  /v1/help/search/preview:
    get:
      tags: [help]
      operationId: previewHelpSearch
      summary: Help search as a Commission's declarants (or every declarant) would see it, for the staff who write the articles
      description: "A Commission's administrators and reporting officers, with `commission` their own Commission: the Act and Regulations, the platform's published articles and the Commission's, in force on `date`, ranked as `searchHelp` ranks them for its declarants. Platform admins, without `commission`: the law and the platform's articles, as every declarant gets them. A just-published article is found at once. Deterministic: no AI. 404 for: a platform admin passing `commission`; a Commission's staff omitting it or passing another Commission; anyone else, declarants included."
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 200
        - name: language
          in: query
          required: true
          schema:
            type: string
            enum: [en, sw]
        - name: commission
          in: query
          required: false
          description: The Commission whose declarants to search as; the platform's articles only when left out (platform admins)
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: date
          in: query
          required: false
          description: Read the law in force on this day (`YYYY-MM-DD`); today by default
          schema:
            type: string
            format: date
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 8
      responses:
        '200':
          description: Passages, best first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HelpPassage'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/help/corpus/{passageId}:
    get:
      tags: [help]
      operationId: getCorpusPassage
      summary: One wording of the statutory corpus with its text in English and Kiswahili
      description: 'platform-admin only. Read-only: statutory text changes only by import.'
      parameters:
        - name: passageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The wording
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusPassageText'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    CorpusPassageText:
      description: A corpus wording as `CorpusPassage` lists it, with its text
      allOf:
        - $ref: '#/components/schemas/CorpusPassage'
        - type: object
          required: [textEn, textSw]
          properties:
            textEn:
              type: string
            textSw:
              description: Null where the corpus has no Kiswahili text
              type: [string, 'null']
  parameters:
    DeclarationId:
      name: declarationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID, unique per logical request; reuse on retry
      schema:
        type: string
        format: uuid
  responses:
    NotFound:
      description: Not found, or not visible to the caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Caller lacks the required role
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationProblem:
      description: Request failed validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
