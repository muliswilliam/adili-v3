# Drafted operations of the declarations API for specs not implemented yet: 07a (internal reads
# for review), 08 (person obligation history) and 09 (Form M officer details), with suggestions,
# the assistant and help. `pnpm --filter @adili/declarations contracts` merges them into
# packages/schemas/internal/declarations.yaml, where they may reference the implemented
# components (e.g. `#/components/schemas/Obligation`, `CommissionRef`, `ObligationType`,
# `ProblemDetails`). When an operation or component is implemented, delete it here: the export
# fails while both define it.
paths:
  /internal/v1/declarations/disclosures:
    post:
      tags: [internal]
      operationId: internalRenderDisclosure
      summary: Render the scoped disclosure of a person's submitted declarations for a grant (audited)
      description: |
        Only the versions, household members and sections in the granted scope are decrypted and
        returned. The read is audited with the grant reference as legal basis and the recipient.
      parameters:
        - name: X-Acting-Subject
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisclosureRequest'
      responses:
        '200':
          description: Disclosure document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisclosureDocument'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
  /internal/v1/declarations/{declarationId}/versions/{version}/full-document:
    parameters:
      - $ref: '#/components/parameters/DeclarationId'
      - $ref: '#/components/parameters/VersionNumber'
      - name: X-Acting-Subject
        in: header
        required: true
        schema:
          type: string
    get:
      tags: [internal]
      operationId: internalGetFullDocumentForCertifiedCopy
      summary: The full immutable document of a version for the declarant's certified copy (audited as self-access)
      responses:
        '200':
          description: Document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalVersionDocument'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/declarations/{declarationId}/suggestions/lookups:
    parameters:
      - $ref: '#/components/parameters/DeclarationId'
    post:
      tags: [suggestions]
      operationId: requestRegistryLookups
      summary: Check registries for a household person with recorded consent (declarant); results arrive as suggestions
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [personKey, systems, consent]
              properties:
                personKey:
                  type: string
                systems:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [kra, ntsa, brs, ardhisasa]
                consent:
                  type: object
                  required: [requested, textVersion]
                  properties:
                    requested:
                      const: true
                    textVersion:
                      type: string
      responses:
        '202':
          description: Lookups started; one set per system
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SuggestionSet'
        '400':
          description: 'Consent missing or person has no national ID (`no-id`)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/declarations/{declarationId}/suggestions:
    parameters:
      - $ref: '#/components/parameters/DeclarationId'
    get:
      tags: [suggestions]
      operationId: listSuggestions
      summary: Suggestion sets and suggestions for the draft (declarant)
      parameters:
        - name: personKey
          in: query
          schema:
            type: string
        - name: sectionKey
          in: query
          schema:
            $ref: '#/components/schemas/SectionKey'
      responses:
        '200':
          description: Sets with suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SuggestionSet'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/declarations/{declarationId}/suggestions/{suggestionId}/accept:
    parameters:
      - $ref: '#/components/parameters/DeclarationId'
      - $ref: '#/components/parameters/SuggestionId'
    post:
      tags: [suggestions]
      operationId: acceptSuggestion
      summary: Create an item from the suggestion, or apply it to an existing item (declarant); uses the section save path
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields, applyToItemId]
              properties:
                fields:
                  type: object
                  description: Final fields after the declarant's edits
                  additionalProperties: true
                applyToItemId:
                  type: [string, 'null']
                  format: uuid
                overwrite:
                  type: boolean
                  default: false
                  description: When applying to an existing item, overwrite non-empty fields
      responses:
        '200':
          description: Item created or updated
          content:
            application/json:
              schema:
                type: object
                required: [suggestion, itemId, etag]
                properties:
                  suggestion:
                    $ref: '#/components/schemas/Suggestion'
                  itemId:
                    type: string
                    format: uuid
                  etag:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Suggestion not `new`, or section ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '412':
          description: If-Match failed
  /v1/declarations/{declarationId}/suggestions/{suggestionId}/dismiss:
    parameters:
      - $ref: '#/components/parameters/DeclarationId'
      - $ref: '#/components/parameters/SuggestionId'
    post:
      tags: [suggestions]
      operationId: dismissSuggestion
      summary: Dismiss a suggestion for this draft (declarant)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 200
      responses:
        '200':
          description: Dismissed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Suggestion'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Suggestion already accepted
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/declarations/{declarationId}/attachments/{attachmentId}/extract:
    parameters:
      - $ref: '#/components/parameters/DeclarationId'
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [suggestions]
      operationId: extractAttachment
      summary: Read a clean attachment into suggested fields through the ai-gateway (declarant); policy-gated
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentKindHint, targetItemType]
              properties:
                documentKindHint:
                  type: string
                  enum: [title-deed, logbook, payslip, bank-letter, share-certificate, other]
                targetItemType:
                  type: string
                language:
                  type: string
                  enum: [en, sw]
                  default: en
      responses:
        '202':
          description: Extraction requested; a suggestion set of source `document`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionSet'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Attachment not clean, or AI reading not enabled for this Commission (`not-enabled`)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/me/assistant/conversations:
    post:
      tags: [assistant]
      operationId: openAssistantConversation
      summary: Open or resume the conversation for a draft (or for the declarant without a draft)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [declarationId, language]
              properties:
                declarationId:
                  type: [string, 'null']
                  format: uuid
                language:
                  type: string
                  enum: [en, sw]
      responses:
        '200':
          description: Conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantConversation'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/me/assistant/conversations/{conversationId}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [assistant]
      operationId: askAssistant
      summary: 'Ask a question; the answer streams back as server-sent events (`delta`, `final`, `error`) and is stored on completion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, sectionKey]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 2000
                sectionKey:
                  type: [string, 'null']
      responses:
        '200':
          description: SSE stream ending with the stored message
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Per-person rate limit
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Assistant unavailable; use help search
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/me/assistant/conversations/{conversationId}/messages/{messageId}/feedback:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [assistant]
      operationId: rateAssistantMessage
      summary: Rate an answer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, reason]
              properties:
                rating:
                  type: string
                  enum: [helpful, not-helpful]
                reason:
                  type: [string, 'null']
                  enum: [inaccurate, missed-something, unclear, too-long, other, null]
                note:
                  type: [string, 'null']
                  maxLength: 500
      responses:
        '200':
          description: Recorded
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/me/assistant/suggested-questions:
    get:
      tags: [assistant]
      operationId: getSuggestedQuestions
      summary: Curated and popular questions for a section in a language
      parameters:
        - name: sectionKey
          in: query
          schema:
            type: string
        - name: language
          in: query
          required: true
          schema:
            type: string
            enum: [en, sw]
      responses:
        '200':
          description: Questions
          content:
            application/json:
              schema:
                type: array
                maxItems: 8
                items:
                  type: string
  /v1/declarations/{declarationId}/hints:
    parameters:
      - $ref: '#/components/parameters/DeclarationId'
    get:
      tags: [assistant]
      operationId: getCompletenessHints
      summary: Plain-language hints for the completeness residuals (AI-labelled; deterministic text always present)
      parameters:
        - name: language
          in: query
          required: true
          schema:
            type: string
            enum: [en, sw]
      responses:
        '200':
          description: Hints
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [ruleId, fieldPath, text, hint]
                  properties:
                    ruleId:
                      type: string
                    fieldPath:
                      type: string
                    text:
                      type: string
                      description: Deterministic residual text
                    hint:
                      type: [string, 'null']
                      description: AI-assisted hint when available
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/commissions/{slug}/help/themes:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [help]
      operationId: getQuestionThemes
      summary: Anonymised question theme counts and unanswered counts per month (commission-admin, reporting-officer)
      parameters:
        - name: month
          in: query
          schema:
            type: string
            pattern: '^[0-9]{4}-[0-9]{2}$'
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [month, theme, count, unanswered]
                  properties:
                    month:
                      type: string
                    theme:
                      type: string
                    count:
                      type: integer
                    unanswered:
                      type: integer
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]{1,19}$'
    DeclarationId:
      name: declarationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionNumber:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    SuggestionId:
      name: suggestionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActingTenant:
      name: X-Acting-Tenant
      in: header
      required: true
      description: Tenant the calling service acts for; the resource must belong to it
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]{1,19}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID, unique per logical request; reuse on retry
      schema:
        type: string
        format: uuid
  responses:
    NotFound:
      description: Not found, or not visible to the caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Caller lacks the required role
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationProblem:
      description: Request failed validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    DisclosureRequest:
      type: object
      required:
        [
          personId,
          tenant,
          grantReference,
          legalBasis,
          recipientSubject,
          years,
          includeSpouses,
          includeChildren,
          sections,
        ]
      properties:
        personId:
          type: string
          format: uuid
        tenant:
          type: string
        grantReference:
          type: string
          description: ARQ or LEA reference
        legalBasis:
          type: string
          enum: [act-s36-1, act-s36-2]
        recipientSubject:
          type: string
        years:
          type: array
          minItems: 1
          items:
            type: integer
        includeSpouses:
          type: boolean
        includeChildren:
          type: boolean
        sections:
          type: array
          minItems: 1
          items:
            type: string
            enum: [bio, income, assets, liabilities, other]
    DisclosureDocument:
      type: object
      required: [schemaVersion, grantReference, personName, commission, versions]
      properties:
        schemaVersion:
          const: disclosure.v1
        grantReference:
          type: string
        personName:
          type: string
        commission:
          $ref: '#/components/schemas/CommissionRef'
        versions:
          type: array
          items:
            type: object
            required: [reference, version, type, statementDate, submittedAt, content]
            properties:
              reference:
                $ref: '#/components/schemas/DeclarationReference'
              version:
                type: integer
              type:
                $ref: '#/components/schemas/ObligationType'
              statementDate:
                type: string
                format: date
              submittedAt:
                type: string
                format: date-time
              content:
                type: object
                description: Subset of the declaration.v1 document limited to the granted persons and sections
                additionalProperties: true
    SuggestionSource:
      type: string
      enum: [kra, ntsa, brs, ardhisasa, document]
    SuggestionSet:
      type: object
      required:
        [
          id,
          personKey,
          source,
          status,
          requestedAt,
          readyAt,
          verificationResultId,
          aiJobId,
          suggestions,
        ]
      properties:
        id:
          type: string
          format: uuid
        personKey:
          type: string
        source:
          $ref: '#/components/schemas/SuggestionSource'
        status:
          type: string
          enum: [pending, ready, unavailable, no-id, not-enabled, failed]
        requestedAt:
          type: string
          format: date-time
        readyAt:
          type: [string, 'null']
          format: date-time
        verificationResultId:
          type: [string, 'null']
          format: uuid
        aiJobId:
          type: [string, 'null']
          format: uuid
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/Suggestion'
    Suggestion:
      type: object
      required:
        [
          id,
          setId,
          personKey,
          sectionKey,
          itemType,
          fields,
          sourceRef,
          confidence,
          matchItemId,
          status,
          acceptedItemId,
        ]
      properties:
        id:
          type: string
          format: uuid
        setId:
          type: string
          format: uuid
        personKey:
          type: string
        sectionKey:
          $ref: '#/components/schemas/SectionKey'
        itemType:
          type: string
          description: Second Schedule item type from declaration.v1, or `bio-tax` for KRA PIN and compliance
        fields:
          type: object
          additionalProperties: true
        sourceRef:
          type: object
          description: Registration, title or company number, or document page and field
          additionalProperties: true
        confidence:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        matchItemId:
          type: [string, 'null']
          format: uuid
        status:
          type: string
          enum: [new, accepted, dismissed, superseded]
        acceptedItemId:
          type: [string, 'null']
          format: uuid
    AssistantConversation:
      type: object
      required: [id, declarationId, language, messages, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        declarationId:
          type: [string, 'null']
          format: uuid
        language:
          type: string
          enum: [en, sw]
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AssistantMessage'
        expiresAt:
          type: [string, 'null']
          format: date-time
    AssistantMessage:
      type: object
      required: [id, role, text, citations, sectionLink, declined, label, rating, at]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        text:
          type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/HelpPassage'
        sectionLink:
          oneOf:
            - type: object
              required: [sectionKey, fieldPath]
              properties:
                sectionKey:
                  type: string
                fieldPath:
                  type: [string, 'null']
            - type: 'null'
        declined:
          type: boolean
        label:
          type: [object, 'null']
          description: ai-gateway AiLabel for assistant turns
          additionalProperties: true
        rating:
          type: [string, 'null']
          enum: [helpful, not-helpful, null]
        at:
          type: string
          format: date-time
