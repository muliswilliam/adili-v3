# Drafted operations of the declarations API for specs not implemented yet: document
# extraction, the assistant and help. `pnpm --filter @adili/declarations contracts` merges them into
# packages/schemas/internal/declarations.yaml, where they may reference the implemented
# components (e.g. `#/components/schemas/Obligation`, `CommissionRef`, `ObligationType`,
# `ProblemDetails`). When an operation or component is implemented, delete it here: the export
# fails while both define it.
paths:
  /v1/declarations/{declarationId}/attachments/{attachmentId}/extract:
    parameters:
      - $ref: '#/components/parameters/DeclarationId'
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [suggestions]
      operationId: extractAttachment
      summary: Read a clean attachment into suggested fields through the ai-gateway (declarant); policy-gated
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentKindHint, targetItemType]
              properties:
                documentKindHint:
                  type: string
                  enum: [title-deed, logbook, payslip, bank-letter, share-certificate, other]
                targetItemType:
                  type: string
                language:
                  type: string
                  enum: [en, sw]
                  default: en
      responses:
        '202':
          description: Extraction requested; a suggestion set of source `document`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionSet'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Attachment not clean, or AI reading not enabled for this Commission (`not-enabled`)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/me/assistant/conversations/{conversationId}/messages/{messageId}/feedback:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [assistant]
      operationId: rateAssistantMessage
      summary: Rate an answer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, reason]
              properties:
                rating:
                  type: string
                  enum: [helpful, not-helpful]
                reason:
                  type: [string, 'null']
                  enum: [inaccurate, missed-something, unclear, too-long, other, null]
                note:
                  type: [string, 'null']
                  maxLength: 500
      responses:
        '200':
          description: Recorded
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/me/assistant/suggested-questions:
    get:
      tags: [assistant]
      operationId: getSuggestedQuestions
      summary: Curated and popular questions for a section in a language
      parameters:
        - name: sectionKey
          in: query
          schema:
            type: string
        - name: language
          in: query
          required: true
          schema:
            type: string
            enum: [en, sw]
      responses:
        '200':
          description: Questions
          content:
            application/json:
              schema:
                type: array
                maxItems: 8
                items:
                  type: string
  /v1/declarations/{declarationId}/hints:
    parameters:
      - $ref: '#/components/parameters/DeclarationId'
    get:
      tags: [assistant]
      operationId: getCompletenessHints
      summary: Plain-language hints for the completeness residuals (AI-labelled; deterministic text always present)
      parameters:
        - name: language
          in: query
          required: true
          schema:
            type: string
            enum: [en, sw]
      responses:
        '200':
          description: Hints
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [ruleId, fieldPath, text, hint]
                  properties:
                    ruleId:
                      type: string
                    fieldPath:
                      type: string
                    text:
                      type: string
                      description: Deterministic residual text
                    hint:
                      type: [string, 'null']
                      description: AI-assisted hint when available
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/commissions/{slug}/help/themes:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [help]
      operationId: getQuestionThemes
      summary: Anonymised question theme counts and unanswered counts per month (commission-admin, reporting-officer)
      parameters:
        - name: month
          in: query
          schema:
            type: string
            pattern: '^[0-9]{4}-[0-9]{2}$'
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [month, theme, count, unanswered]
                  properties:
                    month:
                      type: string
                    theme:
                      type: string
                    count:
                      type: integer
                    unanswered:
                      type: integer
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]{1,19}$'
    DeclarationId:
      name: declarationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID, unique per logical request; reuse on retry
      schema:
        type: string
        format: uuid
  responses:
    NotFound:
      description: Not found, or not visible to the caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Caller lacks the required role
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationProblem:
      description: Request failed validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
