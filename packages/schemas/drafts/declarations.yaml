# Drafted operations of the declarations API for specs not implemented yet: document
# extraction, the assistant and help. `pnpm --filter @adili/declarations contracts` merges them into
# packages/schemas/internal/declarations.yaml, where they may reference the implemented
# components (e.g. `#/components/schemas/Obligation`, `CommissionRef`, `ObligationType`,
# `ProblemDetails`). When an operation or component is implemented, delete it here: the export
# fails while both define it.
paths:
  /v1/declarations/{declarationId}/attachments/{attachmentId}/extract:
    parameters:
      - $ref: '#/components/parameters/DeclarationId'
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [suggestions]
      operationId: extractAttachment
      summary: Read a clean attachment into suggested fields through the ai-gateway (declarant); policy-gated
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentKindHint, targetItemType]
              properties:
                documentKindHint:
                  type: string
                  enum: [title-deed, logbook, payslip, bank-letter, share-certificate, other]
                targetItemType:
                  type: string
                language:
                  type: string
                  enum: [en, sw]
                  default: en
      responses:
        '202':
          description: Extraction requested; a suggestion set of source `document`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionSet'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Attachment not clean, or AI reading not enabled for this Commission (`not-enabled`)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/me/assistant/suggested-questions:
    get:
      tags: [assistant]
      operationId: getSuggestedQuestions
      summary: Curated and popular questions for a section in a language
      parameters:
        - name: sectionKey
          in: query
          schema:
            type: string
        - name: language
          in: query
          required: true
          schema:
            type: string
            enum: [en, sw]
      responses:
        '200':
          description: Questions
          content:
            application/json:
              schema:
                type: array
                maxItems: 8
                items:
                  type: string
  /v1/help/passages/{passageId}:
    get:
      tags: [help]
      operationId: getHelpPassage
      summary: One passage of the corpus or one help article in full, for the portal's help pages
      description: >-
        Declarants (by the person_id claim), with the visibility of `searchHelp`: the Act and
        Regulations, the platform's published articles and those of the declarant's own
        Commissions, in force on `date`. The text is in `language` where the passage has it, else
        in English (`language` of the response says which). Deterministic: no AI. Anything else,
        and other callers, 404.
      parameters:
        - name: passageId
          in: path
          required: true
          description: A `HelpPassage` id, as `searchHelp` and answer citations give it
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: language
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/HelpLanguage'
        - name: date
          in: query
          description: Read the law in force on this day (`YYYY-MM-DD`); today by default
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The passage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpPassageDetail'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    HelpPassageDetail:
      type: object
      description: A passage of the corpus or a help article, whole, as the help pages show it
      required:
        [id, source, citation, title, text, language, tags, commission, effectiveFrom, effectiveTo]
      properties:
        id:
          type: string
        source:
          type: string
          enum: [act, regs, am, help]
        citation:
          type: string
          examples: ['Act s.31(4)', 'Help: Joint assets']
        title:
          type: string
          description: In `language`
        text:
          type: string
          description: 'The whole passage or article body, in `language`; statutory text as published'
        language:
          description: The language of the title and text; `en` when the passage has no Swahili text
          $ref: '#/components/schemas/HelpLanguage'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/HelpTag'
          description: Section kinds, statement item types and topics it covers
        commission:
          description: The Commission whose article it is; null for the law and platform articles
          anyOf:
            - $ref: '#/components/schemas/CommissionRef'
            - type: 'null'
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          description: Exclusive; null while in force
          type: [string, 'null']
          format: date
  parameters:
    DeclarationId:
      name: declarationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID, unique per logical request; reuse on retry
      schema:
        type: string
        format: uuid
  responses:
    NotFound:
      description: Not found, or not visible to the caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Caller lacks the required role
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationProblem:
      description: Request failed validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
