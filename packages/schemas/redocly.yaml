# Style rules stay warnings so draft contracts can land. Structural
# problems (unresolved refs, invalid OpenAPI) still fail the job.
extends:
  - recommended

rules:
  operation-summary: warn
  no-empty-servers: warn
  info-license: off
  info-license-strict: off
  operation-4xx-response: warn
  operation-description: warn
  tag-description: warn
  security-defined: warn
