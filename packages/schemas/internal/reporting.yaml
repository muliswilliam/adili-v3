      security: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    Officer:
      type: object
      properties:
        subject:
          type: string
          description: Keycloak subject
        name:
          type: string
          description: Display name; the subject when the token had none
      required:
        - subject
        - name
      description: Who reviewed, confirmed, wrote, approved or pushed
    ReportStatus:
      type: string
      enum:
        - not-started
        - compiling
        - draft
        - reviewed
        - submitted
    ReportSource:
      type: string
      enum:
        - hosted
        - federated
      description: Compiled and confirmed on the platform, or submitted by a federated Commission
    ReportCounts:
      type: object
      properties:
        initial:
          type: object
          properties:
            expected:
              type: integer
              minimum: 0
            declared:
              type: integer
              minimum: 0
            notDeclared:
              type: integer
              minimum: 0
          required:
            - expected
            - declared
            - notDeclared
        biennial:
          type: object
          properties:
            expected:
              type: integer
              minimum: 0
            declared:
              type: integer
              minimum: 0
            notDeclared:
              type: integer
              minimum: 0
            noCycleInPeriod:
              type: boolean
          required:
            - expected
            - declared
            - notDeclared
            - noCycleInPeriod
        final:
          type: object
          properties:
            expected:
              type: integer
              minimum: 0
            declared:
