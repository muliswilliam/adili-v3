openapi: 3.1.0
info:
  title: reporting API - Form M, EACC intake, NCR, referrals intake (draft)
  version: '1'
  description: |
    Draft contract for spec 09. Compliance reports (Form M) compiled from event projections,
    reviewed and confirmed by Commission officers or submitted by federated Commissions;
    EACC intake, national consolidation and referral handoff to ICMS. The reporting service's
    Swagger document becomes the source of truth once implemented.
servers:
  - url: http://localhost:4005
security:
  - bearer: []
tags:
  - name: form-m
  - name: federated
  - name: eacc
  - name: ncr
  - name: open-data
  - name: referrals-intake
paths:
  /v1/commissions/{slug}/compliance-reports:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [form-m]
      operationId: listComplianceReports
      summary: Report periods for the Commission with status per financial year
      responses:
        '200':
          description: Periods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComplianceReportSummary'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/commissions/{slug}/compliance-reports/{fy}:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/FinancialYear'
    get:
      tags: [form-m]
      operationId: getComplianceReport
      summary: The report for a financial year (draft or submitted) with its document
      description: |
        Each read is audited (`audit.read.v1`, action `compliance-report.viewed`, under the
        Commission's tenant).
      x-audited-read:
        action: compliance-report.viewed
        resource: compliance-report
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceReport'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: 'Problem type `directory-unavailable`: the Commission could not be named; try again'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/compliance-reports/{fy}/compile:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/FinancialYear'
    post:
      tags: [form-m]
      operationId: compileComplianceReport
      summary: Compile a preview (from 1 April) or recompile a draft (supervisor)
      responses:
        '202':
          description: Compilation started
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Problem code `report-submitted`, or `preview-not-available` before 1 April after the year
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/compliance-reports/{fy}/remarks:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/FinancialYear'
    patch:
      tags: [form-m]
      operationId: updateReportRemarks
      summary: Edit remarks on non-filer rows (supervisor)
      description: |
        Remarks by obligation id, kept across recompiles. A blank remark returns the row to its
        default, the label of the latest action step taken.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [remarks]
              additionalProperties: false
              properties:
                remarks:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
                    required: [obligationId, remark]
                    additionalProperties: false
                    properties:
                      obligationId:
                        type: string
                        format: uuid
                      remark:
                        type: string
                        maxLength: 500
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceReport'
        '400':
          description: Validation failed, or an obligation the draft does not list (paths in errors)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Problem code `report-compiling` while a compile runs, or `report-submitted`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/compliance-reports/{fy}/manual:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/FinancialYear'
    patch:
      tags: [form-m]
      operationId: updateReportManualFields
      summary: Edit Part I contact details and Part B complaints (commission-admin)
      description: |
        Each field given replaces the draft's; null clears it; fields left out are kept. Kept
        across recompiles. Part I contact details the commission-admin has not entered carry over
        from the Commission's previous submitted report.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualFields'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceReport'
        '400':
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Problem code `report-compiling` while a compile runs, or `report-submitted`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/compliance-reports/{fy}/reviewed:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/FinancialYear'
    post:
      tags: [form-m]
      operationId: markReportReviewed
      summary: Supervisor marks the draft reviewed (records Part III compiled-by)
      description: |
        Part III "Compiled by" names the supervisor (their name from the token, the designation
        given) with today's date. A recompile returns the report to `draft` for review again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [designation]
              additionalProperties: false
              properties:
                designation:
                  type: string
                  minLength: 1
                  maxLength: 100
      responses:
        '200':
          description: Reviewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceReport'
        '400':
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Problem code `report-compiling` while a compile runs, or `report-submitted`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/compliance-reports/{fy}/confirm:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/FinancialYear'
    post:
      tags: [form-m]
      operationId: confirmComplianceReport
      summary: Commission-admin confirms and submits to EACC (step-up token required)
      description: |
        Needs a token from the step-up re-authentication (`acr` `step-up`, `auth_time` at most
        5 minutes old) and an Idempotency-Key. Part III "Confirmed by" names the commission-admin;
        the document must then be complete against form-m.v1. Allocates
        `RPT-<ISSUER>-<FY end>-<seq>-<check>`, freezes the document with its canonical SHA-256, marks
        the report `submitted` (`late` after 31 July) and records EACC's receipt. The Restricted
        Form M PDF and the signed receipt are issued through documents right after, and both
        officers are told: `formMDocumentId` and `receiptDocumentId` are null until then. The
        answer, kept for replays of the key, leaves `document` null: names live only in the
        encrypted report; read the report as filed with getComplianceReport.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                designation:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: The commission-admin's designation for Part III "Confirmed by"
      responses:
        '200':
          description: Submitted with its reference; the PDF and receipt follow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceReport'
        '400':
          description: Problem code `not-reviewed`, or `incomplete` with the paths in errors
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'Role or `step-up-required`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Problem code `report-submitted` (already submitted) or `report-compiling`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The Commission directory or the workflow engine could not be reached; nothing submitted
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/compliance-reports:
    post:
      tags: [federated]
      operationId: submitComplianceReport
      summary: Federated Commission submits a form-m.v1 document (reports:submit scope)
      description: |
        For a Commission running its own system: a client-credentials token with scope
        `reports:submit` whose `tenant` claim is the Commission, and an Idempotency-Key. The
        document is validated against form-m.v1 (`invalid-document`), must name the token's
        Commission in Part I `issuerCode` (`tenant-mismatch`) and keep the business rules
        (`inconsistent-document`): the period is the financial year it names, 1 July to 30 June,
        open for reports (from 1 April of its last half); per section declared plus not declared
        is expected and the non-filers listed are as many as not declared; access requests granted
        plus declined are at most received and the decline reasons add up to declined; Part III
        names who compiled and who confirmed, with dates. The report is then submitted as a hosted
        confirm submits it, with `source` `federated`: `RPT-<ISSUER>-<FY end>-<seq>-<check>`, the
        document frozen with its canonical SHA-256 (`meta.reference` and `meta.source` set by the
        platform), `late` after 31 July, EACC's receipt, and right after the Restricted Form M
        PDF, the signed receipt and the officers' emails (`formMDocumentId` and
        `receiptDocumentId` are null until then). A draft compiled on the platform for the year is
        superseded. The answer, kept for replays of the key, leaves `document` null.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A form-m.v1 document (see forms/form-m.v1.json)
              additionalProperties: true
      responses:
        '201':
          description: Submitted with its reference; the PDF and receipt follow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceReport'
        '400':
          description: Problem code `invalid-document` (schema) or `inconsistent-document` (business rules), paths in errors; or the Idempotency-Key is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Scope `reports:submit` missing, the token names no Commission, or problem code `tenant-mismatch` (the document names another Commission)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Problem code `report-submitted` - the Commission's report for this financial year is submitted already
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different document
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The Commission directory or the workflow engine could not be reached; nothing submitted
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/eacc/compliance-reports:
    get:
      tags: [eacc]
      operationId: getEaccIntake
      summary: Per-Commission report status, rates and outliers for a financial year (EACC roles)
      description: |
        eacc-analyst and eacc-supervisor (tenant `eacc`); anyone else 403. Every active
        Commission the directory lists (and any other that filed), by name: `not-reported`, or
        submitted on time or late (after 31 July) from EACC's receipt, with the report's
        reference, the ids of its Form M PDF and receipt once issued, declared / expected per
        section from the report's counts, outliers, and how often and when it was last chased.
        Outliers: `low-<section>-rate` when officers were expected and the declared rate is below
        the section's configured threshold (`INTAKE_MIN_<SECTION>_RATE`, 0.8 by default);
        `section-missing` when a section's counts are absent, or no officer in service is
        expected in a year with a biennial cycle. The totals cover the year whatever the filters;
        `nationalDeclaredRate` is declared over expected across the submitted reports' sections.
      parameters:
        - name: fy
          in: query
          required: true
          description: Financial year start year, e.g. 2027 for 1 July 2027 to 30 June 2028
          schema:
            type: integer
            minimum: 2025
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/IntakeStatus'
        - name: outliersOnly
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Intake
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Intake'
        '400':
          description: Query failed validation (a year reports do not exist for, an unknown status)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: The Commission directory could not be reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/eacc/compliance-reports/{reportId}:
    parameters:
      - name: reportId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [eacc]
      operationId: getSubmittedReport
      summary: A submitted report as filed, with its PDF and receipt ids (report viewer)
      description: |
        eacc-analyst and eacc-supervisor (tenant `eacc`) read every Commission's submitted
        report; a Commission's supervisor, commission-admin and reporting officer, and its own
        system (`reports:submit`), read their own. Anyone else, another Commission's report, a
        report not submitted and an unknown id are 404. The document is the frozen `form-m.v1`
        as filed; the PDF and receipt download through documents by `formMDocumentId` and
        `receiptDocumentId` (null until issued). Each read is audited (`audit.read.v1`, action
        `compliance-report.viewed`) under the tenant of the Commission whose report it is.
      x-audited-read:
        action: compliance-report.viewed
        resource: compliance-report
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceReport'
        '400':
          description: reportId is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: The Commission directory could not be reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/eacc/national-reports/{fy}:
    parameters:
      - $ref: '#/components/parameters/FinancialYear'
    get:
      tags: [ncr]
      operationId: getNationalReport
      summary: The national consolidated report for a financial year
      description: |
        eacc-analyst and eacc-supervisor (tenant `eacc`); anyone else 403. 404 until the year's
        report is first built. `aggregates` holds counts and rates only: `reporting` (Commissions
        reported on time, late, not reported), `national` (per section expected, declared, not
        declared and rate, the three together as `all`, clarifications, access requests) and
        `byCommission` (per Commission slug: name, status, report id and reference, and its
        numbers once reported). Narrative paragraphs cite figures in `aggregateRefs` by aggregate
        key in the ai-gateway scheme, as `PatternCandidate.aggregateKeys` does, not by dot path
        into `aggregates`. Reading the report is how a narrative draft answered 202 is polled: a
        `narrativeDraft` still `drafting` is looked up at the ai-gateway first and, once its job
        has ended, inserted (`inserted`) or discarded (`failed` with its reason). While the
        gateway cannot be reached the report is answered with the draft still `drafting`.
      responses:
        '200':
          description: NCR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NationalReport'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/eacc/national-reports/{fy}/build:
    parameters:
      - $ref: '#/components/parameters/FinancialYear'
    post:
      tags: [ncr]
      operationId: buildNationalReport
      summary: Build or rebuild aggregates from submitted reports (analyst); narrative preserved
      description: |
        eacc-analyst and eacc-supervisor; anyone else 403. Recomputes the aggregates from the
        Commissions' submitted reports as filed and every active Commission the directory lists;
        the narrative is kept. The first build makes the caller the author. Every build and
        narrative save raises `version` and adds the caller to the report's contributors, who
        cannot approve it. Emits `ncr.drafted.v1` (ids, year, version, status, reports included).
      responses:
        '200':
          description: Built
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NationalReport'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 'No Commission has reported for the year (`no-submitted-reports`), or already approved (`ncr-approved`)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The Commission directory could not be reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/eacc/national-reports/{fy}/narrative:
    parameters:
      - $ref: '#/components/parameters/FinancialYear'
    patch:
      tags: [ncr]
      operationId: updateNationalReportNarrative
      summary: Save narrative sections (analyst)
      description: |
        eacc-analyst and eacc-supervisor; anyone else 403. Every section's full text, paragraphs
        separated by a blank line; stored as `narrativeParagraphs`. A paragraph whose text is
        unchanged keeps its id and labels; an edited one keeps its id and loses `aiDraft`; the
        rest are new. The caller becomes a contributor. 404 before the first build.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Narrative'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NationalReport'
        '400':
          description: Body failed validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already approved (`ncr-approved`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/eacc/national-reports/{fy}/approve:
    parameters:
      - $ref: '#/components/parameters/FinancialYear'
    post:
      tags: [ncr]
      operationId: approveNationalReport
      summary: EACC supervisor (not the author) approves; allocates NCR and issues the PDF
      description: |
        eacc-supervisor only; eacc-analyst and anyone else 403. The author, or anyone who built
        the report or saved its narrative, gets 403 `separation-of-duties`. Allocates
        `NCR-EACC-<FY end>-<seq>-<check>`, freezes the report and emits `ncr.approved.v1` (ids, year,
        version, reference). The Restricted PDF follows (`documentId`, polled on the report), and
        the year's chase of non-reporting Commissions ends. A retry with the same Idempotency-Key
        replays the approval; another approval of an approved report is 409 `ncr-approved` and
        allocates nothing.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NationalReport'
        '400':
          description: Idempotency-Key missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'Role or `separation-of-duties`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already approved (`ncr-approved`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The workflow engine could not be reached; nothing was approved
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/eacc/national-reports/{fy}/candidates:
    parameters:
      - $ref: '#/components/parameters/FinancialYear'
    get:
      tags: [ncr]
      operationId: getNationalReportCandidates
      summary: Deterministic pattern candidates computed from this and prior years' aggregates (analyst)
      description: >-
        Computed from the year's aggregates as last built and those of the prior years built, at
        the configured thresholds (`CANDIDATE_*`), ordered by kind then subject (`national`
        first). Values by kind: `rate-change` {from, to, change, factor} of a non-filer rate year
        on year; `threshold-breach` {nonFilerRate, threshold}; `chronic-late-reporting` {years}
        of reports submitted late running; `clarification-ratio-outlier` {clarificationRatio,
        nationalRatio, factor}; `size-band-outlier` {nonFilerRate, peerNonFilerRate, peers,
        bandFrom, bandTo} against the other Commissions with as many officers expected;
        `non-reporting` {years} without a report running. EACC analysts and supervisors only.
      responses:
        '200':
          description: Candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatternCandidate'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/eacc/national-reports/{fy}/narrative/draft:
    parameters:
      - $ref: '#/components/parameters/FinancialYear'
    post:
      tags: [ncr]
      operationId: draftNationalReportNarrative
      summary: 'AI-draft the narrative (all or one section) from aggregates and candidates; inserted as AI-draft paragraphs the analyst edits'
      description: |
        eacc-analyst and eacc-supervisor; anyone else 403. The ai-gateway's
        `narrate-compliance-report` task gets the year's figures (national totals and rates, the
        per-Commission table, prior years) and pattern candidates only, data class `restricted`,
        and the request waits up to 20 s for it. Ready by then: its paragraphs are inserted with
        `aiDraft: true`, their `aggregateRefs` and `candidateIds` (200). Not ready: 202 with
        `narrativeDraft.status` `drafting`; poll `getNationalReport`, which inserts it once the job
        has ended. In each section drafted, the new paragraphs replace those still marked as AI
        drafts (where the first of them stood), and paragraphs the analyst edited or typed stay;
        `replaceAll` replaces the whole section. Editing a paragraph through
        `updateNationalReportNarrative` clears its `aiDraft`. The requester becomes a contributor
        (who cannot approve) and `ncr.narrative-drafted.v1` is emitted (report id, year, section,
        job id; no figures). A new request replaces a draft still being written, whose job is then
        never inserted; a draft that ends after the aggregates were rebuilt is discarded. A retry
        with the same Idempotency-Key reads the same job, and inserts it once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [section, replaceAll]
              properties:
                section:
                  type: string
                  enum: [overview, findings, recommendations, all]
                replaceAll:
                  type: boolean
                  description: Replace every paragraph of the section; default replaces only paragraphs still marked as AI draft
      responses:
        '200':
          description: Draft inserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NationalReport'
        '202':
          description: Still drafting; poll the report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NationalReport'
        '400':
          description: Body failed validation, or Idempotency-Key missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Nothing inserted. Problem code `ncr-approved` (the report no longer changes),
            `narrative-validation` (the draft cited a figure not in the input and was discarded),
            `ai-not-enabled` (the ai-gateway's gate does not let EACC's data be sent),
            `no-pattern-candidates` (findings, or all, with no candidate to narrate) or
            `aggregates-rebuilt` (the report was rebuilt while the draft was written)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: >-
            Problem code `narrative-draft-failed`: the ai-gateway refused the request or the job
            failed (`reason`: the job's reason, e.g. `provider`, `budget`, `timeout`); nothing
            inserted
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The ai-gateway could not be reached; nothing was asked of it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/eacc/open-data/releases:
    get:
      tags: [open-data]
      operationId: listOpenDataReleasesEacc
      summary: All releases including previews and withdrawn (EACC)
      description: >-
        eacc-analyst and eacc-supervisor (tenant `eacc`); anyone else 403. The latest financial
        year first, then by kind, the latest version first.
      responses:
        '200':
          description: Releases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenDataRelease'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [open-data]
      operationId: buildOpenDataSnapshot
      summary: Build a snapshot release for a financial year as a preview (EACC analyst or supervisor)
      description: >-
        eacc-analyst and eacc-supervisor (tenant `eacc`); anyone else 403. Builds the six tables
        from the year's national consolidated report (draft or approved) and the projection facts,
        suppresses every figure over fewer than 10 officers (with complementary suppression), and
        reconciles the national totals with the NCR's: a report submitted or changed since the
        NCR was built fails with 409 `reconciliation-failed` (`mismatches` lists the totals that
        differ) and builds nothing. The files (JSON and CSV per table, the release JSON) are
        written to object storage with their SHA-256, and the release is recorded as `preview`,
        the next version of the year's snapshots. Emits `open-data.release.built.v1` (release
        id, year, kind, version; no figures). A retry with the same Idempotency-Key replays the
        build.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fy]
              additionalProperties: false
              properties:
                fy:
                  type: integer
                  minimum: 2025
                  description: Financial year start year, e.g. 2027 for 1 July 2027 to 30 June 2028
      responses:
        '202':
          description: Built as a preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenDataRelease'
        '400':
          description: Body failed validation, or Idempotency-Key missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 'The year has no national consolidated report (`ncr-not-built`), or the release does not reconcile with it (`reconciliation-failed`)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Object storage could not be reached (`storage-unavailable`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/eacc/open-data/releases/{releaseId}/publish:
    parameters:
      - $ref: '#/components/parameters/ReleaseId'
    post:
      tags: [open-data]
      operationId: publishOpenDataRelease
      summary: Publish a preview release (EACC supervisor)
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenDataRelease'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Not in preview, or reconciliation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/eacc/open-data/releases/{releaseId}/withdraw:
    parameters:
      - $ref: '#/components/parameters/ReleaseId'
    post:
      tags: [open-data]
      operationId: withdrawOpenDataRelease
      summary: Withdraw a published release with a public reason (EACC supervisor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        '200':
          description: Withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenDataRelease'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Not published
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/open-data/preview:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [open-data]
      operationId: getCommissionOpenDataPreview
      summary: The Commission's own rows of the current preview or published release, suppression as released (commission-admin)
      description: >-
        The release shown is, of the most recent financial year with a preview or published
        release, the one built last; withdrawn releases are never shown. Only the Commission
        tables, filtered to the caller's Commission; national tables and other Commissions'
        rows are never returned. Anyone not of the Commission gets 404, its other staff 403.
      responses:
        '200':
          description: The release and the Commission's rows per table
          content:
            application/json:
              schema:
                type: object
                required: [release, tables]
                properties:
                  release:
                    $ref: '#/components/schemas/OpenDataRelease'
                  tables:
                    type: object
                    required: [filing-by-commission, compliance-by-commission, access-requests]
                    additionalProperties: false
                    properties:
                      filing-by-commission:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                      compliance-by-commission:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                      access-requests:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Object storage could not be reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /open-data/v1/releases:
    get:
      tags: [open-data]
      operationId: listOpenDataReleases
      summary: Published and withdrawn releases (public; cached; rate-limited)
      security: []
      responses:
        '200':
          description: Releases
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenDataRelease'
        '429':
          description: Rate limited
  /open-data/v1/releases/{fy}/{version}:
    parameters:
      - $ref: '#/components/parameters/FinancialYear'
      - name: version
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [open-data]
      operationId: getOpenDataRelease
      summary: A release with its tables' metadata, hashes and verification link (public)
      security: []
      responses:
        '200':
          description: Release
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenDataRelease'
        '404':
          description: Not found
  /open-data/v1/releases/{fy}/{version}/tables/{table}:
    parameters:
      - $ref: '#/components/parameters/FinancialYear'
      - name: version
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: table
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OpenDataTable'
    get:
      tags: [open-data]
      operationId: getOpenDataTable
      summary: A table as JSON rows or CSV (Accept header or `.csv` suffix); suppressed cells are null with a marker (public)
      security: []
      responses:
        '200':
          description: Table
          content:
            application/json:
              schema:
                type: object
                required: [table, columns, rows, suppression]
                properties:
                  table:
                    $ref: '#/components/schemas/OpenDataTable'
                  columns:
                    type: array
                    items:
                      type: string
                  rows:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  suppression:
                    type: object
                    required: [threshold, cellsSuppressed]
                    properties:
                      threshold:
                        type: integer
                      cellsSuppressed:
                        type: integer
            text/csv:
              schema:
                type: string
        '404':
          description: Not found
  /v1/eacc/ai-usage/{fy}:
    parameters:
      - $ref: '#/components/parameters/FinancialYear'
    get:
      tags: [eacc]
      operationId: getAiUsage
      summary: AI-assisted cases and reviewer ratings per Commission for a financial year (EACC)
      description: >-
        Spec 07c story 19: how much the AI reviewer copilot is used and how reviewers rate it, per
        Commission, without content. A case is AI-assisted in the year its copilot first had
        outputs to show (`review.copilot.updated.v1` `ready`); a rating counts in the year it was
        last given (`ai.feedback.recorded.v1`, the latest per rating). Counts only: no case,
        reviewer, output or note. Commissions with neither in the year are left out.
        eacc-analyst and eacc-supervisor (tenant `eacc`); anyone else 403.
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiUsageReport'
        '400':
          description: '`fy` is not a financial year'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/eacc/referrals:
    get:
      tags: [referrals-intake]
      operationId: listReferralIntake
      summary: Referrals sent by Commissions with ICMS status (EACC roles)
      description: >-
        EACC's intake of the referrals Commissions sent (`referral.sent.v1`), the latest sent
        first, with the Confidential evidence package's document id (downloaded from the documents
        service) and where the hand-off to ICMS stands. EACC analysts and supervisors only.
      parameters:
        - name: icmsStatus
          in: query
          schema:
            $ref: '#/components/schemas/IcmsStatus'
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReferralIntakeItem'
                  nextCursor:
                    type: [string, 'null']
        '400':
          description: Query failed validation, or a cursor this list did not give
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/eacc/referrals/{referralId}/push:
    parameters:
      - name: referralId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [referrals-intake]
      operationId: pushReferralToIcms
      summary: Push a referral to ICMS and store the case number (analyst)
      description: >-
        EACC analysts and supervisors. Pulls the referral's ICMS payload from review (national ID,
        full name, grounds, details) and registers it through the integration-gateway's ICMS
        adapter (`submitIcmsReferral`), idempotent by the `RFL` reference; ICMS is retried with
        backoff while unreachable. A case number is stored (`registered`) and
        `referral.icms-registered.v1` published; a registration ICMS only accepted is `pushed` and
        followed to its case number. A retry with the same Idempotency-Key replays the answer; a
        registered referral is answered as it is and never sent again.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Registered (or already registered), or pushed and awaiting the case number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralIntakeItem'
        '400':
          description: Idempotency-Key missing, or referralId is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: >-
            Problem code `icms-push-failed` with `error` (an `IcmsPushError`): the referral is left
            push-failed; push it again to retry
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: >-
            ICMS accepted the referral but the workflow following its case number could not be
            started; push it again shortly
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]{1,19}$'
    FinancialYear:
      name: fy
      in: path
      required: true
      description: Financial year start year, e.g. 2027 for 1 July 2027 to 30 June 2028
      schema:
        type: integer
        minimum: 2025
    ReleaseId:
      name: releaseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
  responses:
    NotFound:
      description: Not found, or not visible to the caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Caller lacks the required role or scope
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    AiUsageReport:
      type: object
      required: [fy, commissions]
      properties:
        fy:
          type: integer
          description: Financial year start year
        commissions:
          type: array
          description: Commissions with an AI-assisted case or a rating in the year, in slug order
          items:
            $ref: '#/components/schemas/AiUsageCommission'
    AiUsageCommission:
      type: object
      required: [tenant, aiAssistedCases, ratings]
      properties:
        tenant:
          type: string
          description: Commission slug
        aiAssistedCases:
          type: integer
          minimum: 0
          description: Cases whose copilot first had outputs to show in the year
        ratings:
          type: array
          description: Ratings last given in the year, per AI task, in task order
          items:
            $ref: '#/components/schemas/AiTaskRatings'
    AiTaskRatings:
      type: object
      required: [task, helpful, notHelpful, reasons]
      properties:
        task:
          type: string
          description: The ai-gateway task whose outputs were rated, e.g. `summarize-declaration`
        helpful:
          type: integer
          minimum: 0
        notHelpful:
          type: integer
          minimum: 0
        reasons:
          type: object
          description: Ratings by the reason the reviewer gave; a rating without one counts in none
          required: [inaccurate, missed-something, unclear, too-long, other]
          additionalProperties: false
          properties:
            inaccurate:
              type: integer
              minimum: 0
            missed-something:
              type: integer
              minimum: 0
            unclear:
              type: integer
              minimum: 0
            too-long:
              type: integer
              minimum: 0
            other:
              type: integer
              minimum: 0
    ReportStatus:
      type: string
      enum: [not-started, compiling, draft, reviewed, submitted]
    ReportSource:
      type: string
      enum: [hosted, federated]
    IntakeStatus:
      type: string
      enum: [not-reported, submitted-on-time, submitted-late]
    IcmsStatus:
      type: string
      enum: [not-pushed, pushed, registered, push-failed]
      description: >-
        not-pushed until EACC pushes it; pushed once ICMS accepted it without a case number yet;
        registered with the case number; push-failed when the push could not be completed (push
        again to retry)
    IcmsPushError:
      type: string
      enum:
        [
          review-unavailable,
          payload-not-found,
          payload-refused,
          icms-unavailable,
          icms-rejected,
          icms-failed,
          icms-registration-timeout,
        ]
      description: Why the last push failed
    ReferralGrounds:
      type: string
      enum: [undeclared-assets, unexplained-assets, two-missed-cycles, unanswered-clarification]
    Officer:
      type: object
      required: [subject, name]
      properties:
        subject:
          type: string
        name:
          type: string
    ComplianceReportSummary:
      type: object
      required: [fy, status, dueDate, reference, submittedAt, late, previewAvailable]
      properties:
        fy:
          type: integer
        status:
          $ref: '#/components/schemas/ReportStatus'
        dueDate:
          type: string
          format: date
        reference:
          type: [string, 'null']
        submittedAt:
          type: [string, 'null']
          format: date-time
        late:
          type: [boolean, 'null']
        previewAvailable:
          type: boolean
    ManualFields:
      type: object
      additionalProperties: false
      properties:
        contactDetails:
          type: [string, 'null']
          maxLength: 200
        physicalAddress:
          type: [string, 'null']
          maxLength: 200
        emailAddress:
          type: [string, 'null']
          format: email
        complaintsRegisterMaintained:
          type: [boolean, 'null']
        complaints:
          type: array
          items:
            type: object
            required: [name, designation, identifier, nature, status]
            additionalProperties: false
            properties:
              name:
                type: string
                maxLength: 200
              designation:
                type: string
                maxLength: 100
              identifier:
                type: string
                maxLength: 100
              nature:
                type: string
                maxLength: 300
              status:
                type: string
                maxLength: 100
    ComplianceReport:
      type: object
      required:
        - id
        - commission
        - fy
        - status
        - source
        - compiledAt
        - reviewedBy
        - confirmedBy
        - submittedAt
        - late
        - reference
        - dueDate
        - document
        - counts
        - formMDocumentId
        - receiptDocumentId
        - accessDataUnavailable
      properties:
        id:
          type: string
          format: uuid
        commission:
          type: object
          required: [slug, issuerCode, name]
          properties:
            slug:
              type: string
            issuerCode:
              type: string
            name:
              type: string
        fy:
          type: integer
        status:
          $ref: '#/components/schemas/ReportStatus'
        source:
          $ref: '#/components/schemas/ReportSource'
        compiledAt:
          type: [string, 'null']
          format: date-time
        reviewedBy:
          oneOf:
            - $ref: '#/components/schemas/Officer'
            - type: 'null'
        confirmedBy:
          oneOf:
            - $ref: '#/components/schemas/Officer'
            - type: 'null'
        submittedAt:
          type: [string, 'null']
          format: date-time
        late:
          type: [boolean, 'null']
        reference:
          type: [string, 'null']
          description: 'RPT-<ISSUER>-<FY end>-<seq>-<check>'
        dueDate:
          type: string
          format: date
        document:
          description: The form-m.v1 document (draft or frozen); null while compiling, and in the answers to confirmComplianceReport and submitComplianceReport
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        counts:
          type: object
          description: Headline counts per section for lists and intake
          additionalProperties: true
        formMDocumentId:
          type: [string, 'null']
          format: uuid
        receiptDocumentId:
          type: [string, 'null']
          format: uuid
        accessDataUnavailable:
          type: boolean
    Intake:
      type: object
      required: [fy, totals, commissions]
      properties:
        fy:
          type: integer
        totals:
          type: object
          required: [onTime, late, notReported, nationalDeclaredRate]
          properties:
            onTime:
              type: integer
            late:
              type: integer
            notReported:
              type: integer
            nationalDeclaredRate:
              type: [number, 'null']
        commissions:
          type: array
          items:
            type: object
            required:
              [
                commission,
                status,
                reportId,
                reference,
                submittedAt,
                rates,
                outliers,
                chases,
                formMDocumentId,
                receiptDocumentId,
              ]
            properties:
              commission:
                type: object
                required: [slug, name]
                properties:
                  slug:
                    type: string
                  name:
                    type: string
              status:
                $ref: '#/components/schemas/IntakeStatus'
              reportId:
                type: [string, 'null']
                format: uuid
              reference:
                type: [string, 'null']
              submittedAt:
                type: [string, 'null']
                format: date-time
              rates:
                type: object
                description: Per section (`initial`, `biennial`, `final`) expected, declared and rate (declared / expected to four decimals, null when none expected); empty when not reported
                additionalProperties:
                  type: object
                  required: [expected, declared, rate]
                  properties:
                    expected:
                      type: integer
                    declared:
                      type: integer
                    rate:
                      type: [number, 'null']
              outliers:
                type: array
                items:
                  type: string
                  enum: [low-initial-rate, low-biennial-rate, low-final-rate, section-missing]
              chases:
                type: object
                description: EACC's weekly chases from 1 August while not reported
                required: [count, lastAt]
                properties:
                  count:
                    type: integer
                  lastAt:
                    type: [string, 'null']
                    format: date-time
              formMDocumentId:
                type: [string, 'null']
                format: uuid
                description: The Restricted Form M PDF as filed, once issued
              receiptDocumentId:
                type: [string, 'null']
                format: uuid
                description: The signed acknowledgement receipt, once issued
    Narrative:
      type: object
      required: [overview, findings, recommendations]
      properties:
        overview:
          type: string
          maxLength: 20000
        findings:
          type: string
          maxLength: 40000
        recommendations:
          type: string
          maxLength: 20000
    PatternCandidate:
      type: object
      required: [id, kind, subject, values, aggregateKeys]
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            [
              rate-change,
              threshold-breach,
              chronic-late-reporting,
              clarification-ratio-outlier,
              size-band-outlier,
              non-reporting,
            ]
        subject:
          type: string
          description: Commission slug, entity type, or `national`
        values:
          type: object
          description: >-
            The figures the candidate rests on, by name: numbers, strings or null, no nested values,
            as `NarrateComplianceReportInput` takes them. A derived figure the narrative may state
            (a change, a count of years) is carried here.
          additionalProperties:
            type: [number, string, 'null']
        aggregateKeys:
          type: array
          description: >-
            Keys of the figures the candidate rests on, in the ai-gateway scheme
            (`NarrateComplianceReportInput`): `national.<name>`, `commission.<code>.<name>`, prefixed
            `fy<fy>.` for a prior year
          minItems: 1
          items:
            type: string
    NarrativeParagraph:
      type: object
      required: [id, section, position, text, aiDraft, aggregateRefs, candidateIds]
      properties:
        id:
          type: string
          format: uuid
        section:
          type: string
          enum: [overview, findings, recommendations]
        position:
          type: integer
        text:
          type: string
        aiDraft:
          type: boolean
          description: True until the analyst edits the paragraph
        aggregateRefs:
          type: array
          description: >-
            Aggregate keys the paragraph cites, in the scheme of `PatternCandidate.aggregateKeys`;
            empty for what an analyst types
          items:
            type: string
        candidateIds:
          type: array
          items:
            type: string
    NarrativeDraft:
      type: object
      required: [jobId, section, replaceAll, status, failureReason, requestedAt, finishedAt]
      properties:
        jobId:
          type: string
          format: uuid
          description: The ai-gateway job writing the draft
        section:
          type: string
          enum: [overview, findings, recommendations, all]
        replaceAll:
          type: boolean
        status:
          type: string
          enum: [drafting, inserted, failed]
          description: '`drafting` until the job ends; then its paragraphs are `inserted`, or the draft `failed` and nothing was inserted'
        failureReason:
          type: [string, 'null']
          description: >-
            Why a failed draft was discarded: the ai-gateway job's reason (`validation`, `policy`,
            `budget`, `provider`, ...), or `missing` (the gateway no longer has the job),
            `invalid-output`, `aggregates-rebuilt` or `ncr-approved`
        requestedAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time
    OpenDataTable:
      type: string
      enum:
        [
          filing-by-commission,
          compliance-by-commission,
          by-entity-type,
          by-cycle,
          access-requests,
          national-totals,
        ]
    OpenDataRelease:
      type: object
      required:
        [
          id,
          fy,
          kind,
          version,
          status,
          builtAt,
          publishedAt,
          withdrawnAt,
          withdrawnReason,
          manifestVerificationId,
          tables,
        ]
      properties:
        id:
          type: string
          format: uuid
        fy:
          type: integer
        kind:
          type: string
          enum: [annual, snapshot]
        version:
          type: integer
        status:
          type: string
          enum: [preview, published, withdrawn]
        builtAt:
          type: string
          format: date-time
        publishedAt:
          type: [string, 'null']
          format: date-time
        withdrawnAt:
          type: [string, 'null']
          format: date-time
        withdrawnReason:
          type: [string, 'null']
        manifestVerificationId:
          type: [string, 'null']
          description: Verification code of the Public manifest document
        tables:
          type: array
          items:
            type: object
            required: [table, rows, sha256Json, sha256Csv]
            properties:
              table:
                $ref: '#/components/schemas/OpenDataTable'
              rows:
                type: integer
              sha256Json:
                type: string
              sha256Csv:
                type: string
    NationalReport:
      type: object
      required:
        [
          id,
          fy,
          version,
          status,
          builtAt,
          reportsIncluded,
          aggregates,
          narrative,
          narrativeParagraphs,
          narrativeDraft,
          author,
          approver,
          approvedAt,
          reference,
          documentId,
        ]
      properties:
        id:
          type: string
          format: uuid
        fy:
          type: integer
        version:
          type: integer
          minimum: 1
          description: The report's revision; goes up with every build, narrative save and the approval
        status:
          type: string
          enum: [draft, approved]
        builtAt:
          type: [string, 'null']
          format: date-time
        reportsIncluded:
          type: integer
        aggregates:
          type: object
          additionalProperties: true
        narrative:
          $ref: '#/components/schemas/Narrative'
        narrativeParagraphs:
          type: array
          description: The paragraphs behind the narrative sections, per section in position order; AI drafts (spec 09b) labelled until edited
          items:
            $ref: '#/components/schemas/NarrativeParagraph'
        narrativeDraft:
          description: The latest AI narrative draft (spec 09b); null until one is asked for
          oneOf:
            - $ref: '#/components/schemas/NarrativeDraft'
            - type: 'null'
        author:
          oneOf:
            - $ref: '#/components/schemas/Officer'
            - type: 'null'
        approver:
          oneOf:
            - $ref: '#/components/schemas/Officer'
            - type: 'null'
        approvedAt:
          type: [string, 'null']
          format: date-time
        reference:
          type: [string, 'null']
          description: 'NCR-EACC-<FY end>-<seq>-<check>'
        documentId:
          type: [string, 'null']
          format: uuid
    ReferralIntakeItem:
      type: object
      required:
        [
          referralId,
          commission,
          reference,
          grounds,
          cycleYear,
          sentAt,
          packageDocumentId,
          icmsStatus,
          icmsCaseNumber,
          icmsRegisteredAt,
          pushedAt,
          pushedBy,
          error,
        ]
      properties:
        referralId:
          type: string
          format: uuid
        commission:
          type: object
          required: [slug, name]
          properties:
            slug:
              type: string
            name:
              type: string
        reference:
          type: string
          description: The RFL reference
        grounds:
          $ref: '#/components/schemas/ReferralGrounds'
        cycleYear:
          type: integer
          description: The declaration cycle the referral is about
        sentAt:
          type: string
          format: date-time
        packageDocumentId:
          type: string
          format: uuid
          description: The Confidential referral-package document (documents service)
        icmsStatus:
          $ref: '#/components/schemas/IcmsStatus'
        icmsCaseNumber:
          type: [string, 'null']
        icmsRegisteredAt:
          type: [string, 'null']
          format: date-time
        pushedAt:
          type: [string, 'null']
          format: date-time
        pushedBy:
          description: Who last pushed it
          oneOf:
            - $ref: '#/components/schemas/Officer'
            - type: 'null'
        error:
          oneOf:
            - $ref: '#/components/schemas/IcmsPushError'
            - type: 'null'
    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path:
                type: string
              message:
                type: string
