                      - rate
                      - noCycleInPeriod
                  - type: 'null'
              final:
                anyOf:
                  - type: object
                    properties:
                      expected:
                        type: integer
                        minimum: 0
                      declared:
                        type: integer
                        minimum: 0
                      notDeclared:
                        type: integer
                        minimum: 0
                      rate:
                        description: declared / expected; null when none expected
                        type:
                          - number
                          - 'null'
                    required:
                      - expected
                      - declared
                      - notDeclared
                      - rate
                  - type: 'null'
              clarifications:
                anyOf:
                  - type: integer
                    minimum: 0
                  - type: 'null'
              accessRequests:
                anyOf:
                  - type: object
                    properties:
                      received:
                        type: integer
                        minimum: 0
                      granted:
                        type: integer
                        minimum: 0
                      declined:
                        type: integer
                        minimum: 0
                    required:
                      - received
                      - granted
                      - declined
                  - type: 'null'
            required:
              - name
              - status
              - reportId
              - reference
              - submittedAt
              - initial
              - biennial
              - final
              - clarifications
              - accessRequests
          description: Per Commission slug; its numbers are null until it reports
      required:
        - fy
        - reporting
        - national
        - byCommission
      description: Counts and rates only, never an officer
    NationalReport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fy:
          type: integer
        version:
          type: integer
          minimum: 1
          description: The report's revision; goes up with every build, narrative save and the approval
        status:
          type: string
          enum:
            - draft
            - approved
        builtAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        reportsIncluded:
          type: integer
          minimum: 0
        aggregates:
          anyOf:
            - $ref: '#/components/schemas/NationalAggregates'
            - type: object
              properties: {}
              additionalProperties: false
          description: Empty until the first build
        narrative:
          $ref: '#/components/schemas/Narrative'
        narrativeParagraphs:
          type: array
          items:
            $ref: '#/components/schemas/NarrativeParagraph'
          description: The paragraphs behind the narrative sections, per section in position order; AI drafts (spec 09b) labelled until edited
        author:
          anyOf:
            - $ref: '#/components/schemas/Officer'
            - type: 'null'
        approver:
          anyOf:
            - $ref: '#/components/schemas/Officer'
            - type: 'null'
        approvedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        reference:
          description: '`NCR-EACC-<FY end>-<seq>-<check>`, allocated at approval'
          type:
            - string
            - 'null'
        documentId:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          description: The Restricted NCR PDF, once issued
      required:
        - id
        - fy
        - version
        - status
        - builtAt
        - reportsIncluded
        - aggregates
        - narrative
        - narrativeParagraphs
        - author
        - approver
        - approvedAt
        - reference
        - documentId
    ReferralGrounds:
      type: string
      enum:
        - undeclared-assets
        - unexplained-assets
        - two-missed-cycles
        - unanswered-clarification
    IcmsStatus:
      type: string
      enum:
        - not-pushed
        - pushed
        - registered
        - push-failed
      description: not-pushed until EACC pushes it; pushed once ICMS accepted it without a case number yet; registered with the case number; push-failed when the push could not be completed (push again to retry)
    IcmsPushError:
      type: string
      enum:
        - review-unavailable
        - payload-not-found
        - payload-refused
        - icms-unavailable
        - icms-rejected
        - icms-failed
        - icms-registration-timeout
      description: Why the last push failed
    ReferralIntakeItem:
      type: object
      properties:
        referralId:
          type: string
          format: uuid
        commission:
          type: object
          properties:
            slug:
              type: string
            name:
              type: string
          required:
            - slug
            - name
        reference:
          type: string
          description: The RFL reference
        grounds:
          $ref: '#/components/schemas/ReferralGrounds'
        cycleYear:
          type: integer
          description: The declaration cycle the referral is about
        sentAt:
          type: string
          format: date-time
        packageDocumentId:
          type: string
          format: uuid
          description: The Confidential referral-package document (documents service)
        icmsStatus:
          $ref: '#/components/schemas/IcmsStatus'
        icmsCaseNumber:
          type:
            - string
            - 'null'
        icmsRegisteredAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        pushedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        pushedBy:
          anyOf:
            - $ref: '#/components/schemas/Officer'
            - type: 'null'
          description: Who last pushed it
        error:
          anyOf:
            - $ref: '#/components/schemas/IcmsPushError'
            - type: 'null'
      required:
        - referralId
        - commission
        - reference
        - grounds
        - cycleYear
        - sentAt
        - packageDocumentId
        - icmsStatus
        - icmsCaseNumber
        - icmsRegisteredAt
        - pushedAt
        - pushedBy
        - error
    ReferralIntakePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReferralIntakeItem'
        nextCursor:
          description: Pass as `cursor` for the next page; null on the last
          type:
            - string
            - 'null'
      required:
        - items
        - nextCursor
    AiUsageReport:
      type: object
      properties:
        fy:
          type: integer
          description: Financial year start year
        commissions:
          type: array
          items:
            $ref: '#/components/schemas/AiUsageCommission'
          description: Commissions with an AI-assisted case or a rating in the year, in slug order
      required:
        - fy
        - commissions
    AiUsageCommission:
      type: object
      properties:
        tenant:
          type: string
          description: Commission slug
        aiAssistedCases:
          type: integer
          minimum: 0
          description: Cases whose copilot first had outputs to show in the year
        ratings:
          type: array
          items:
            $ref: '#/components/schemas/AiTaskRatings'
          description: Ratings last given in the year, per AI task, in task order
      required:
        - tenant
        - aiAssistedCases
        - ratings
    AiTaskRatings:
      type: object
      properties:
        task:
          type: string
          description: The ai-gateway task whose outputs were rated, e.g. `summarize-declaration`
        helpful:
          type: integer
          minimum: 0
        notHelpful:
          type: integer
          minimum: 0
        reasons:
          type: object
          properties:
            inaccurate:
              type: integer
              minimum: 0
            missed-something:
              type: integer
              minimum: 0
            unclear:
              type: integer
              minimum: 0
            too-long:
              type: integer
              minimum: 0
            other:
              type: integer
              minimum: 0
          required:
            - inaccurate
            - missed-something
            - unclear
            - too-long
            - other
          additionalProperties: false
          description: Ratings by the reason the reviewer gave; a rating without one counts in none
      required:
        - task
        - helpful
        - notHelpful
        - reasons
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
            - database-unavailable
            - rate-limit-exceeded
            - no-match
            - already-onboarded
            - no-roster
            - otp-invalid
            - otp-expired
            - resend-cooldown
            - otp-send-failed
            - wrong-step
            - session-expired
            - iprs-unavailable
            - identity-unavailable
            - email-in-use
            - identity-mismatch
            - step-up-required
            - incomplete
            - before-statement-date
            - amendment-window-closed
            - not-a-draft
            - not-submitted
            - obligation-cancelled
            - acknowledgement-issued
            - acknowledgement-in-progress
            - consent-required
            - no-id
            - not-new
            - no-applicant-record
            - request-decided
            - request-closed
            - officer-resolved
            - not-under-decision
            - not-pending-verification
            - lea-account-inactive
            - declarant-notified
            - representations-closed
            - download-window-closed
            - scope-exceeds-request
            - grounds-required
            - separation-of-duties
            - report-submitted
            - report-compiling
            - preview-not-available
            - not-reviewed
            - invalid-remarks
            - invalid-document
            - inconsistent-document
            - tenant-mismatch
            - ncr-approved
            - no-submitted-reports
            - icms-push-failed
          description: Machine-readable cause, from the platform registry; clients map it to copy and never show `title` or `detail`
        detail:
          type: string
        instance:
          type: string
        errors:
          description: Field-level errors; `path` is the dotted request field
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - path
              - message
      required:
        - type
        - title
        - status
    PatternCandidate:
      type: object
      required:
        - id
        - kind
        - subject
        - values
        - aggregateKeys
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - rate-change
            - threshold-breach
            - chronic-late-reporting
            - clarification-ratio-outlier
            - size-band-outlier
            - non-reporting
        subject:
          type: string
          description: Commission slug, entity type, or `national`
        values:
          type: object
          description: 'The figures the candidate rests on, by name: numbers, strings or null, no nested values, as `NarrateComplianceReportInput` takes them. A derived figure the narrative may state (a change, a count of years) is carried here.'
          additionalProperties:
            type:
              - number
              - string
              - 'null'
        aggregateKeys:
          type: array
          description: 'Keys of the figures the candidate rests on, in the ai-gateway scheme (`NarrateComplianceReportInput`): `national.<name>`, `commission.<code>.<name>`, prefixed `fy<fy>.` for a prior year'
          minItems: 1
          items:
            type: string
    NarrativeDraft:
      type: object
      required:
        - jobId
        - section
        - replaceAll
        - status
        - failureReason
        - requestedAt
        - finishedAt
      properties:
        jobId:
          type: string
          format: uuid
          description: The ai-gateway job writing the draft
        section:
          type: string
          enum:
            - overview
            - findings
            - recommendations
            - all
        replaceAll:
          type: boolean
        status:
          type: string
          enum:
            - drafting
            - inserted
            - failed
          description: '`drafting` until the job ends; then its paragraphs are `inserted`, or the draft `failed` and nothing was inserted'
        failureReason:
          type:
            - string
            - 'null'
          description: "Why a failed draft was discarded: the ai-gateway job's reason (`validation`, `policy`, `budget`, `provider`, ...), or `missing` (the gateway no longer has the job), `invalid-output`, `aggregates-rebuilt` or `ncr-approved`"
        requestedAt:
          type: string
          format: date-time
        finishedAt:
          type:
            - string
            - 'null'
          format: date-time
    OpenDataTable:
      type: string
      enum:
        - filing-by-commission
        - compliance-by-commission
        - by-entity-type
        - by-cycle
        - access-requests
        - national-totals
    OpenDataTableFile:
      type: object
      description: A release's table as stored (`getOpenDataTable` JSON)
      required:
        - table
        - columns
        - rows
        - suppression
        - notCollected
      properties:
        table:
          $ref: '#/components/schemas/OpenDataTable'
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        suppression:
          type: object
          required:
            - threshold
            - cellsSuppressed
          properties:
            threshold:
              type: integer
            cellsSuppressed:
              type: integer
              description: Figures hidden by suppression; figures not collected are not counted
        notCollected:
          type: array
          items:
            type: string
          description: Figures not collected yet (columns, or in `national-totals` measures) whose values are null for want of data, not suppression
    OpenDataReleaseDetail:
      type: object
      required:
        - release
        - builtBy
        - source
        - tables
      properties:
        release:
          $ref: '#/components/schemas/OpenDataRelease'
        builtBy:
          description: Who built it; null for the release workflow on NCR approval
          oneOf:
            - $ref: '#/components/schemas/Officer'
            - type: 'null'
        source:
          type: object
          required:
            - kind
            - nationalReportReference
          properties:
            kind:
              type: string
              enum:
                - national-report
                - live-projections
            nationalReportReference:
              type:
                - string
                - 'null'
              description: The NCR's reference (`NCR-EACC-...`) once approved; null for a draft NCR or the live projections
        tables:
          type: object
          required:
            - filing-by-commission
            - compliance-by-commission
            - by-entity-type
            - by-cycle
            - access-requests
            - national-totals
          additionalProperties: false
          properties:
            filing-by-commission:
              $ref: '#/components/schemas/OpenDataTableFile'
            compliance-by-commission:
              $ref: '#/components/schemas/OpenDataTableFile'
            by-entity-type:
              $ref: '#/components/schemas/OpenDataTableFile'
            by-cycle:
              $ref: '#/components/schemas/OpenDataTableFile'
            access-requests:
              $ref: '#/components/schemas/OpenDataTableFile'
            national-totals:
              $ref: '#/components/schemas/OpenDataTableFile'
    OpenDataRelease:
      type: object
      required:
        - id
        - fy
        - kind
        - version
        - status
        - builtAt
        - publishedAt
        - publishedBy
        - withdrawnAt
        - withdrawnBy
        - withdrawnReason
        - manifestDocumentId
        - manifestVerificationId
        - tables
      properties:
        id:
          type: string
          format: uuid
        fy:
          type: integer
        kind:
          type: string
          enum:
            - annual
            - snapshot
        version:
          type: integer
        status:
          type: string
          enum:
            - preview
            - published
            - withdrawn
        builtAt:
          type: string
          format: date-time
        publishedAt:
          type:
            - string
            - 'null'
          format: date-time
        publishedBy:
          description: The EACC supervisor who published it; for an annual release, who approved its NCR. Null while a preview
          oneOf:
            - $ref: '#/components/schemas/Officer'
            - type: 'null'
        withdrawnAt:
          type:
            - string
            - 'null'
          format: date-time
        withdrawnBy:
          description: The EACC supervisor who withdrew it; null unless withdrawn
          oneOf:
            - $ref: '#/components/schemas/Officer'
            - type: 'null'
        withdrawnReason:
          type:
            - string
            - 'null'
        manifestDocumentId:
          type:
            - string
            - 'null'
          format: uuid
          description: The Public manifest document (documents service); null while a preview
        manifestVerificationId:
          type:
            - string
            - 'null'
          description: Verification code of the Public manifest document
        tables:
          type: array
          items:
            type: object
            required:
              - table
              - rows
              - sha256Json
              - sha256Csv
            properties:
              table:
                $ref: '#/components/schemas/OpenDataTable'
              rows:
                type: integer
              sha256Json:
                type: string
              sha256Csv:
                type: string
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9]{1,19}$
    FinancialYear:
      name: fy
      in: path
      required: true
      description: Financial year start year, e.g. 2027 for 1 July 2027 to 30 June 2028
      schema:
        type: integer
        minimum: 2025
    ReleaseId:
      name: releaseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
  responses:
    NotFound:
      description: Not found, or not visible to the caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Caller lacks the required role or scope
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
security:
  - bearer: []
