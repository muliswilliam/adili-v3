# Generated by `pnpm --filter @adili/reporting contracts`: do not edit.
# Implemented operations come from the reporting service; operations marked `x-draft` come
# from packages/schemas/drafts/reporting.yaml until they are implemented.
openapi: 3.1.0
info:
  title: reporting API
  description: Form M compliance reports, national consolidation, read models and open-data aggregates.
  version: '1'
servers:
  - url: /
    description: The service that serves this document
paths:
  /v1/eacc/ai-usage/{fy}:
    get:
      tags:
        - eacc
      summary: AI-assisted cases and reviewer ratings per Commission for a financial year (EACC)
      description: 'Spec 07c story 19: how much the AI reviewer copilot is used and how reviewers rate it, per Commission, without content. A case is AI-assisted in the year its copilot first had outputs to show (`review.copilot.updated.v1` `ready`); a rating counts in the year it was last given (`ai.feedback.recorded.v1`, the latest per rating). Counts only: no case, reviewer, output or note. Commissions with neither in the year are left out. eacc-analyst and eacc-supervisor (tenant `eacc`); anyone else 403.'
      operationId: getAiUsage
      parameters:
        - name: fy
          required: true
          in: path
          description: Financial year start year, e.g. 2027 for 1 July 2027 to 30 June 2028
          schema:
            type: integer
            minimum: 2025
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiUsageReport'
        '400':
          description: fy is not a financial year
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Only EACC analysts and supervisors
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/compliance-reports:
    get:
      tags:
        - form-m
      summary: Report periods for the Commission with status per financial year
      description: The current and previous financial year, every year with a report, and every year the projections hold obligations or clarifications for, from 2025, the latest first. A year without a report is `not-started`.
      operationId: listComplianceReports
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
      responses:
        '200':
          description: Periods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComplianceReportSummary'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/compliance-reports/{fy}:
    get:
      tags:
        - form-m
      summary: The report for a financial year (draft or submitted) with its document
      description: Each read is audited (`audit.read.v1`, action `compliance-report.viewed`, under the Commission's tenant).
      operationId: getComplianceReport
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: fy
          required: true
          in: path
          description: Financial year start year, e.g. 2027 for 1 July 2027 to 30 June 2028
          schema:
            type: integer
            minimum: 2025
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceReport'
        '400':
          description: The financial year is not one reports exist for
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: 'Problem type `directory-unavailable`: the Commission could not be named; try again'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: compliance-report.viewed
        resource: compliance-report
  /v1/commissions/{slug}/compliance-reports/{fy}/compile:
    post:
      tags:
        - form-m
      summary: Compile a preview (from 1 April) or recompile a draft (supervisor)
      description: Marks the report `compiling` (creating it for a year that has none) and starts or signals the year's `ComplianceReportWorkflow`, which compiles from the projections as they are now. Remarks and manual fields are kept. Read the report with getComplianceReport until it leaves `compiling`.
      operationId: compileComplianceReport
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: fy
          required: true
          in: path
          description: Financial year start year, e.g. 2027 for 1 July 2027 to 30 June 2028
          schema:
            type: integer
            minimum: 2025
      responses:
        '202':
          description: Compilation started
        '400':
          description: The financial year is not one reports exist for
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Only a supervisor compiles
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Problem code `report-submitted`, or `preview-not-available` before 1 April after the year
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/compliance-reports/{fy}/remarks:
    patch:
      tags:
        - form-m
      summary: Edit remarks on non-filer rows (supervisor)
      description: Remarks by obligation id, kept across recompiles. A blank remark returns the row to its default, the label of the latest action step taken.
      operationId: updateReportRemarks
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: fy
          required: true
          in: path
          description: Financial year start year, e.g. 2027 for 1 July 2027 to 30 June 2028
          schema:
            type: integer
            minimum: 2025
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                remarks:
                  minItems: 1
                  maxItems: 1000
                  type: array
                  items:
                    type: object
                    properties:
                      obligationId:
                        type: string
                        format: uuid
                      remark:
                        type: string
                        maxLength: 500
                    required:
                      - obligationId
                      - remark
                    additionalProperties: false
              required:
                - remarks
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceReport'
        '400':
          description: Validation failed, or an obligation the draft does not list (paths in errors)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Only a supervisor edits remarks
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Problem code `report-compiling` while a compile runs, or `report-submitted`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/compliance-reports/{fy}/manual:
    patch:
      tags:
        - form-m
      summary: Edit Part I contact details and Part B complaints (commission-admin)
      description: Each field given replaces the draft's; null clears it; fields left out are kept. Kept across recompiles. Part I contact details the commission-admin has not entered carry over from the Commission's previous submitted report.
      operationId: updateReportManualFields
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: fy
          required: true
          in: path
          description: Financial year start year, e.g. 2027 for 1 July 2027 to 30 June 2028
          schema:
            type: integer
            minimum: 2025
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualFields'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceReport'
        '400':
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Only a commission-admin enters Part I and Part B
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Problem code `report-compiling` while a compile runs, or `report-submitted`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/compliance-reports/{fy}/reviewed:
    post:
      tags:
        - form-m
      summary: Supervisor marks the draft reviewed (records Part III compiled-by)
      description: Part III "Compiled by" names the supervisor (their name from the token, the designation given) with today's date. A recompile returns the report to `draft` for review again.
      operationId: markReportReviewed
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: fy
          required: true
          in: path
          description: Financial year start year, e.g. 2027 for 1 July 2027 to 30 June 2028
          schema:
            type: integer
            minimum: 2025
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                designation:
                  type: string
                  minLength: 1
                  maxLength: 100
              required:
                - designation
              additionalProperties: false
      responses:
        '200':
          description: Reviewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceReport'
        '400':
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Only a supervisor marks the draft reviewed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Problem code `report-compiling` while a compile runs, or `report-submitted`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/compliance-reports/{fy}/confirm:
    post:
      tags:
        - form-m
      summary: Commission-admin confirms and submits to EACC (step-up token required)
      description: 'Needs a token from the step-up re-authentication (`acr` `step-up`, `auth_time` at most 5 minutes old) and an Idempotency-Key. Part III "Confirmed by" names the commission-admin; the document must then be complete against form-m.v1. Allocates `RPT-<ISSUER>-<FY end>-<seq>-<check>`, freezes the document with its canonical SHA-256, marks the report `submitted` (`late` after 31 July) and records EACC''s receipt. The Restricted Form M PDF and the signed receipt are issued through documents right after, and both officers are told: `formMDocumentId` and `receiptDocumentId` are null until then. The answer, kept for replays of the key, leaves `document` null: names live only in the encrypted report; read the report as filed with getComplianceReport.'
      operationId: confirmComplianceReport
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: fy
          required: true
          in: path
          description: Financial year start year, e.g. 2027 for 1 July 2027 to 30 June 2028
          schema:
            type: integer
            minimum: 2025
        - name: Idempotency-Key
          in: header
          description: Client-generated UUID, unique per logical request; reuse on retry
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmReport'
      responses:
        '200':
          description: Submitted with its reference; the PDF and receipt follow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceReport'
        '400':
          description: Problem code `not-reviewed`, or `incomplete` with the paths in errors; or the Idempotency-Key is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Role, or problem code `step-up-required`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Problem code `report-compiling` while a compile runs, or `report-submitted`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The Commission directory or the workflow engine could not be reached; nothing submitted
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/compliance-reports:
    post:
      tags:
        - federated
      summary: Federated Commission submits a form-m.v1 document (reports:submit scope)
      description: "For a Commission running its own system: a client-credentials token with scope `reports:submit` whose `tenant` claim is the Commission, and an Idempotency-Key. The document is validated against form-m.v1 (`invalid-document`), must name the token's Commission in Part I `issuerCode` (`tenant-mismatch`) and keep the business rules (`inconsistent-document`): the period is the financial year it names, 1 July to 30 June, open for reports (from 1 April of its last half); per section declared plus not declared is expected and the non-filers listed are as many as not declared; access requests granted plus declined are at most received and the decline reasons count at least every decline (a denial citing several grounds counts under each); Part III names who compiled and who confirmed, with dates. The report is then submitted as a hosted confirm submits it, with `source` `federated`: `RPT-<ISSUER>-<FY end>-<seq>-<check>`, the document frozen with its canonical SHA-256 (`meta.reference` and `meta.source` set by the platform), `late` after 31 July, EACC's receipt, and right after the Restricted Form M PDF, the signed receipt and the officers' emails (`formMDocumentId` and `receiptDocumentId` are null until then). A draft compiled on the platform for the year is superseded. The answer, kept for replays of the key, leaves `document` null."
      operationId: submitComplianceReport
      parameters:
        - name: Idempotency-Key
          in: header
          description: Client-generated UUID, unique per logical request; reuse on retry
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormM'
      responses:
        '201':
          description: Submitted with its reference; the PDF and receipt follow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceReport'
        '400':
          description: Problem code `invalid-document` (schema) or `inconsistent-document` (business rules), paths in errors; or the Idempotency-Key is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            Scope `reports:submit` missing, the token names no Commission, or problem code `tenant-mismatch` (the document names another Commission)

            Requires one of the scopes: reports:submit
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: "Problem code `report-submitted`: the Commission's report for this financial year is submitted already"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The Commission directory or the workflow engine could not be reached; nothing submitted
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/eacc/compliance-reports:
    get:
      tags:
        - eacc
      summary: Per-Commission report status, rates and outliers for a financial year (EACC roles)
      description: "eacc-analyst and eacc-supervisor (tenant `eacc`); anyone else 403. Every active Commission the directory lists (and any other that filed), by name: `not-reported`, or submitted on time or late (after 31 July) from EACC's receipt, with the report's reference, the ids of its Form M PDF and receipt once issued, declared / expected per section from the report's counts, outliers, and how often and when it was last chased. Outliers: `low-<section>-rate` when officers were expected and the declared rate is below the section's configured threshold (`INTAKE_MIN_<SECTION>_RATE`, 0.8 by default); `section-missing` when a section's counts are absent, or no officer in service is expected in a year with a biennial cycle. The totals cover the year whatever the filters; `nationalDeclaredRate` is declared over expected across the submitted reports' sections."
      operationId: getEaccIntake
      parameters:
        - name: outliersOnly
          required: false
          in: query
          schema:
            type: boolean
        - name: status
          required: false
          in: query
          schema:
            $ref: '#/components/schemas/IntakeStatus'
        - name: fy
          required: true
          in: query
          description: Financial year start year, e.g. 2027 for 1 July 2027 to 30 June 2028
          schema:
            type: integer
            minimum: 2025
      responses:
        '200':
          description: Intake
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Intake'
        '400':
          description: Query failed validation (a year reports do not exist for, an unknown status)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Only EACC analysts and supervisors
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The Commission directory could not be reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/eacc/compliance-reports/{reportId}:
    get:
      tags:
        - eacc
      summary: A submitted report as filed, with its PDF and receipt ids (report viewer)
      description: eacc-analyst and eacc-supervisor (tenant `eacc`) read every Commission's submitted report; a Commission's supervisor, commission-admin and reporting officer, and its own system (`reports:submit`), read their own. Anyone else, another Commission's report, a report not submitted and an unknown id are 404. The document is the frozen `form-m.v1` as filed; the PDF and receipt download through documents by `formMDocumentId` and `receiptDocumentId` (null until issued). Each read is audited (`audit.read.v1`, action `compliance-report.viewed`) under the tenant of the Commission whose report it is.
      operationId: getSubmittedReport
      parameters:
        - name: reportId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmittedComplianceReport'
        '400':
          description: reportId is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, not submitted, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The Commission directory could not be reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: compliance-report.viewed
        resource: compliance-report
  /v1/eacc/national-reports/{fy}:
    get:
      tags:
        - ncr
      summary: The national consolidated report for a financial year
      description: "eacc-analyst and eacc-supervisor (tenant `eacc`); anyone else 403. 404 until the year's report is first built. `aggregates` holds counts and rates only: `reporting` (Commissions reported on time, late, not reported), `national` (per section expected, declared, not declared and rate, the three together as `all`, clarifications, access requests) and `byCommission` (per Commission slug: name, status, report id and reference, and its numbers once reported). Narrative paragraphs cite figures in `aggregateRefs` by aggregate key in the ai-gateway scheme, as `PatternCandidate.aggregateKeys` does, not by dot path into `aggregates`."
      operationId: getNationalReport
      parameters:
        - name: fy
          required: true
          in: path
          description: Financial year start year, e.g. 2027 for 1 July 2027 to 30 June 2028
          schema:
            type: integer
            minimum: 2025
      responses:
        '200':
          description: NCR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NationalReport'
        '400':
          description: fy is not a financial year
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Only EACC analysts and supervisors
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not built yet
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/eacc/national-reports/{fy}/build:
    post:
      tags:
        - ncr
      summary: Build or rebuild aggregates from submitted reports (analyst); narrative preserved
      description: eacc-analyst and eacc-supervisor; anyone else 403. Recomputes the aggregates from the Commissions' submitted reports as filed and every active Commission the directory lists; the narrative is kept. The first build makes the caller the author. Every build and narrative save raises `version` and adds the caller to the report's contributors, who cannot approve it. Emits `ncr.drafted.v1` (ids, year, version, status, reports included).
      operationId: buildNationalReport
      parameters:
        - name: fy
          required: true
          in: path
          description: Financial year start year, e.g. 2027 for 1 July 2027 to 30 June 2028
          schema:
            type: integer
            minimum: 2025
      responses:
        '200':
          description: Built
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NationalReport'
        '400':
          description: fy is not a financial year
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Only EACC analysts and supervisors
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Problem code `no-submitted-reports` or `ncr-approved`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The Commission directory could not be reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/eacc/national-reports/{fy}/narrative:
    patch:
      tags:
        - ncr
      summary: Save narrative sections (analyst)
      description: eacc-analyst and eacc-supervisor; anyone else 403. Every section's full text, paragraphs separated by a blank line; stored as `narrativeParagraphs`. A paragraph whose text is unchanged keeps its id and labels; an edited one keeps its id and loses `aiDraft`; the rest are new. The caller becomes a contributor. 404 before the first build.
      operationId: updateNationalReportNarrative
      parameters:
        - name: fy
          required: true
          in: path
          description: Financial year start year, e.g. 2027 for 1 July 2027 to 30 June 2028
          schema:
            type: integer
            minimum: 2025
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Narrative'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NationalReport'
        '400':
          description: Body failed validation, or fy is not a financial year
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Only EACC analysts and supervisors
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not built yet
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: 'Problem code `ncr-approved`: the report no longer changes'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/eacc/national-reports/{fy}/approve:
    post:
      tags:
        - ncr
      summary: EACC supervisor (not the author) approves; allocates NCR and issues the PDF
      description: eacc-supervisor only; eacc-analyst and anyone else 403. The author, or anyone who built the report or saved its narrative, gets 403 `separation-of-duties`. Allocates `NCR-EACC-<FY end>-<seq>-<check>`, freezes the report and emits `ncr.approved.v1` (ids, year, version, reference). The Restricted PDF follows (`documentId`, polled on the report), and the year's chase of non-reporting Commissions ends. A retry with the same Idempotency-Key replays the approval; another approval of an approved report is 409 `ncr-approved` and allocates nothing.
      operationId: approveNationalReport
      parameters:
        - name: fy
          required: true
          in: path
          description: Financial year start year, e.g. 2027 for 1 July 2027 to 30 June 2028
          schema:
            type: integer
            minimum: 2025
        - name: Idempotency-Key
          in: header
          description: Client-generated UUID, unique per logical request; reuse on retry
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Approved with its reference; the PDF follows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NationalReport'
        '400':
          description: Idempotency-Key missing, or fy is not a financial year
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Role, or problem code `separation-of-duties`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not built yet
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: 'Problem code `ncr-approved`: the report no longer changes'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The workflow engine could not be reached; nothing was approved
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/eacc/referrals:
    get:
      tags:
        - referrals-intake
      summary: Referrals sent by Commissions with ICMS status (EACC roles)
      description: EACC's intake of the referrals Commissions sent (`referral.sent.v1`), the latest sent first, with the Confidential evidence package's document id (downloaded from the documents service) and where the hand-off to ICMS stands. EACC analysts and supervisors only.
      operationId: listReferralIntake
      parameters:
        - name: icmsStatus
          required: false
          in: query
          schema:
            type: string
            enum:
              - not-pushed
              - pushed
              - registered
              - push-failed
        - name: cursor
          required: false
          in: query
          description: The previous page's `nextCursor`
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: limit
          required: false
          in: query
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralIntakePage'
        '400':
          description: Query failed validation, or a cursor this list did not give
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Only EACC analysts and supervisors
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/eacc/referrals/{referralId}/push:
    post:
      tags:
        - referrals-intake
      summary: Push a referral to ICMS and store the case number (analyst)
      description: EACC analysts and supervisors. Pulls the referral's ICMS payload from review (national ID, full name, grounds, details) and registers it through the integration-gateway's ICMS adapter (`submitIcmsReferral`), idempotent by the `RFL` reference; ICMS is retried with backoff while unreachable. A case number is stored (`registered`) and `referral.icms-registered.v1` published; a registration ICMS only accepted is `pushed` and followed to its case number. A retry with the same Idempotency-Key replays the answer; a registered referral is answered as it is and never sent again.
      operationId: pushReferralToIcms
      parameters:
        - name: referralId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Client-generated UUID, unique per logical request; reuse on retry
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Registered (or already registered), or pushed and awaiting the case number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralIntakeItem'
        '400':
          description: Idempotency-Key missing, or referralId is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Only EACC analysts and supervisors
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not in the intake
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: 'Problem code `icms-push-failed` with `error` (an `IcmsPushError`): the referral is left push-failed; push it again to retry'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: ICMS accepted the referral but the workflow following its case number could not be started; push it again shortly
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/eacc/national-reports/{fy}/candidates:
    parameters:
      - $ref: '#/components/parameters/FinancialYear'
    get:
      tags:
        - ncr
      summary: Deterministic pattern candidates computed from this and prior years' aggregates (analyst)
      operationId: getNationalReportCandidates
      x-draft: true
      responses:
        '200':
          description: Candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatternCandidate'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/eacc/national-reports/{fy}/narrative/draft:
    parameters:
      - $ref: '#/components/parameters/FinancialYear'
    post:
      tags:
        - ncr
      summary: AI-draft the narrative (all or one section) from aggregates and candidates; inserted as AI-draft paragraphs the analyst edits
      description: |
        eacc-analyst and eacc-supervisor; anyone else 403. The ai-gateway's
        `narrate-compliance-report` task gets the year's figures (national totals and rates, the
        per-Commission table, prior years) and pattern candidates only, data class `restricted`,
        and the request waits up to 20 s for it. Ready by then: its paragraphs are inserted with
        `aiDraft: true`, their `aggregateRefs` and `candidateIds` (200). Not ready: 202 with
        `narrativeDraft.status` `drafting`; poll `getNationalReport`, which inserts it once the job
        has ended. In each section drafted, the new paragraphs replace those still marked as AI
        drafts (where the first of them stood), and paragraphs the analyst edited or typed stay;
        `replaceAll` replaces the whole section. Editing a paragraph through
        `updateNationalReportNarrative` clears its `aiDraft`. The requester becomes a contributor
        (who cannot approve) and `ncr.narrative-drafted.v1` is emitted (report id, year, section,
        job id; no figures). A new request replaces a draft still being written, whose job is then
        never inserted; a draft that ends after the aggregates were rebuilt is discarded. A retry
        with the same Idempotency-Key reads the same job, and inserts it once.
      operationId: draftNationalReportNarrative
      x-draft: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - section
                - replaceAll
              properties:
                section:
                  type: string
                  enum:
                    - overview
                    - findings
                    - recommendations
                    - all
                replaceAll:
                  type: boolean
                  description: Replace every paragraph of the section; default replaces only paragraphs still marked as AI draft
      responses:
        '200':
          description: Draft inserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NationalReport'
        '202':
          description: Still drafting; poll the report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NationalReport'
        '400':
          description: Body failed validation, or Idempotency-Key missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Nothing inserted. Problem code `ncr-approved` (the report no longer changes), `narrative-validation` (the draft cited a figure not in the input and was discarded), `ai-not-enabled` (the ai-gateway's gate does not let EACC's data be sent), `no-pattern-candidates` (findings, or all, with no candidate to narrate) or `aggregates-rebuilt` (the report was rebuilt while the draft was written)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: "Problem code `narrative-draft-failed`: the ai-gateway refused the request or the job failed (`reason`: the job's reason, e.g. `provider`, `budget`, `timeout`); nothing inserted"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The ai-gateway could not be reached; nothing was asked of it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/eacc/open-data/releases:
    get:
      tags:
        - open-data
      summary: All releases including previews and withdrawn (EACC)
      operationId: listOpenDataReleasesEacc
      x-draft: true
      responses:
        '200':
          description: Releases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenDataRelease'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - open-data
      summary: Build a snapshot, or a corrected annual release, for a financial year as a preview (EACC analyst or supervisor)
      description: "eacc-analyst and eacc-supervisor (tenant `eacc`); anyone else 403. Builds the six tables from the year's national consolidated report's aggregates as last built (a report submitted since changes nothing until the NCR is rebuilt) and the projection facts, suppresses every figure over fewer than 10 officers (with complementary suppression), and reconciles the tables' national totals with the NCR's (409 `reconciliation-failed`, `mismatches` listing the totals that differ, is a fault of the table builder; nothing is built). Access requests are not collected yet: their figures are null and named in each table's `notCollected`. `kind` `snapshot` (the default) builds a snapshot of the NCR, draft or approved, or, before the year's NCR is built, a mid-year snapshot of the live projections: every Commission's counts as its Form M would compile now (filing obligations and clarifications of the year), its status its report's, reconciled with those projections' own national totals and suppressed alike (409 `fy-not-started` for a year that has not started). The release JSON names the source (`national-report` or `live-projections`). `kind` `annual` builds a corrected annual release from the approved NCR (409 `ncr-not-approved` before it is approved) while no annual release of the year is published (409 `annual-release-published`: withdraw it first); unlike the one built on approval it is not published by itself, but deliberately through `publishOpenDataRelease`. The files (JSON and CSV per table, the release JSON) are written to object storage with their SHA-256, and the release is recorded as `preview`, the next version of the year's releases of its kind. Emits `open-data.release.built.v1` (release id, year, kind, version; no figures). A retry with the same Idempotency-Key replays the build."
      operationId: buildOpenDataRelease
      x-draft: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fy
              additionalProperties: false
              properties:
                fy:
                  type: integer
                  minimum: 2025
                  description: Financial year start year, e.g. 2027 for 1 July 2027 to 30 June 2028
                kind:
                  type: string
                  enum:
                    - annual
                    - snapshot
                  default: snapshot
                  description: A mid-year snapshot, or a corrected annual release once the published one is withdrawn
      responses:
        '202':
          description: Built as a preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenDataRelease'
        '400':
          description: Body failed validation, or Idempotency-Key missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A snapshot of a year that has not started (`fy-not-started`); for an annual release, the year has no national consolidated report (`ncr-not-built`), it is not approved (`ncr-not-approved`) or an annual release of the year is published (`annual-release-published`); or the tables do not reconcile with their source (`reconciliation-failed`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Object storage could not be reached (`storage-unavailable`), or the directory for a snapshot of the live projections (`directory-unavailable`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/eacc/open-data/releases/{releaseId}:
    parameters:
      - $ref: '#/components/parameters/ReleaseId'
    get:
      tags:
        - open-data
      summary: A release of any status with its six tables as built, suppression applied, and its source (EACC)
      description: "Spec 09b S6 (#350): the preview EACC checks before a supervisor publishes it. eacc-analyst and eacc-supervisor (tenant `eacc`); anyone else 403. Any status, a preview included (the public API never serves a preview). `tables` are the release's table files as stored, the same JSON `getOpenDataTable` serves once published. `source` is what the tables were built from and reconciled with at build (`buildOpenDataRelease`): the national consolidated report (its reference once approved) or, for a snapshot of a year without one, the live projections. A release that exists has reconciled."
      operationId: getOpenDataReleaseEacc
      x-draft: true
      responses:
        '200':
          description: The release, who built it, its source and its tables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenDataReleaseDetail'
        '400':
          description: The release id is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Object storage could not be reached (`storage-unavailable`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/eacc/open-data/releases/{releaseId}/publish:
    parameters:
      - $ref: '#/components/parameters/ReleaseId'
    post:
      tags:
        - open-data
      summary: Publish a preview release (EACC supervisor)
      description: "eacc-supervisor (tenant `eacc`); anyone else, an eacc-analyst included, 403. Issues the release's manifest (year, kind, version, build time, the NCR reference it reconciles with, the publisher, the suppression threshold, and each table's rows, hidden cells and the SHA-256 of its JSON and CSV files, with the release JSON's) through documents as a Public verifiable document (`open-data-manifest`), then marks the release `published` by the caller. Emits `open-data.release.published.v1` (release id, year, kind, version; no figures). An annual release publishes itself the same way when its NCR is approved, `publishedBy` the approver. The release was reconciled with the NCR when it was built. A year has one published annual release at a time: an annual preview is published only once the year's published one is withdrawn (409 `annual-release-published`)."
      operationId: publishOpenDataRelease
      x-draft: true
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenDataRelease'
        '400':
          description: The release id is not a UUID, or the Idempotency-Key is not 1 to 255 characters (`idempotency-key-missing`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The release is published or withdrawn already (`release-not-preview`), or it is annual and another annual release of the year is published (`annual-release-published`); or a request with the same Idempotency-Key is still running (`idempotency-key-in-use`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: The documents service refused the manifest (`manifest-refused`); nothing is published
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Documents (`documents-unavailable`) or object storage (`storage-unavailable`) could not be reached; nothing is published
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/eacc/open-data/releases/{releaseId}/withdraw:
    parameters:
      - $ref: '#/components/parameters/ReleaseId'
    post:
      tags:
        - open-data
      summary: Withdraw a published release with a public reason (EACC supervisor)
      description: eacc-supervisor (tenant `eacc`); anyone else 403. Revokes the release's manifest through documents (reason `withdrawn`), so its verify page shows it revoked, then marks the release `withdrawn` with the reason (trimmed), by the caller; it stays in the history and its files are still served, with the reason. A corrected release is a new build (`buildOpenDataRelease`, `kind` as the withdrawn one's), the next version of the year's releases of its kind. Emits `open-data.release.withdrawn.v1` (release id, year, kind, version; not the reason).
      operationId: withdrawOpenDataRelease
      x-draft: true
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              additionalProperties: false
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  description: Shown with the withdrawn release in the public API
      responses:
        '200':
          description: Withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenDataRelease'
        '400':
          description: Body failed validation, the release id is not a UUID, or the Idempotency-Key is not 1 to 255 characters (`idempotency-key-missing`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The release is a preview or withdrawn already (`release-not-published`), or a request with the same Idempotency-Key is still running (`idempotency-key-in-use`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: The documents service refused to revoke the manifest (`manifest-revocation-refused`); nothing is withdrawn
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Documents could not be reached (`documents-unavailable`); nothing is withdrawn
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/open-data/preview:
