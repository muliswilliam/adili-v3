# Generated by `pnpm --filter @adili/documents contracts`: do not edit.
# Implemented operations come from the documents service; operations marked `x-draft` come
# from packages/schemas/drafts/documents.yaml until they are implemented.
openapi: 3.1.0
info:
  title: documents API
  description: Uploads, malware scanning, PDF issuance, signing, QR codes and verification records.
  version: '1'
servers:
  - url: /
    description: The service that serves this document
paths:
  /v1/uploads:
    post:
      tags:
        - uploads
      summary: Reserve an upload and get a presigned PUT to quarantine
      description: "The purpose's roles only (roster-import: reporting-officer; declaration-attachment: declarant). The PUT URL is valid for 15 minutes and accepts exactly the declared Content-Type and size."
      operationId: createUpload
      parameters:
        - name: Idempotency-Key
          in: header
          description: Client-generated UUID, unique per logical request; reuse on retry
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUpload'
      responses:
        '201':
          description: Upload reserved; PUT the bytes to uploadUrl before expiresAt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadReservation'
        '400':
          description: Request failed validation, or the type or size is not the purpose's
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Your roles do not allow uploads for this purpose
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/uploads/{id}:
    get:
      tags:
        - uploads
      summary: Upload state and metadata
      description: Uploads of the caller's tenant whose purpose the caller's roles cover, and declaration attachments only to the declarant who uploaded them; any other is 404.
      operationId: getUpload
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/uploads/{id}/complete:
    post:
      tags:
        - uploads
      summary: Verify, scan and move the uploaded object to the clean bucket
      description: 'Synchronous, bounded by a 60-second budget. Returns the final state: clean, infected or rejected (type, size, missing, timeout). The quarantine object is deleted in every case.'
      operationId: completeUpload
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Client-generated UUID, unique per logical request; reuse on retry
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Final state after scanning
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Problem type `upload-completed` (already clean, infected or rejected), `upload-expired`, or `upload-completing` (another request is completing it).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: 'Problem type `upload-check-unavailable`: storage or the scanner failed; nothing changed, retry.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/uploads/{id}:
    get:
      tags:
        - internal
      summary: Upload state and metadata, for services
      description: Service tokens with scope documents:internal, acting for the tenant in X-Acting-Tenant. Any state; with who uploaded it and whether it is linked. Hands out no bytes, so unlike the download it is no audited read.
      operationId: getInternalUpload
      parameters:
        - name: X-Acting-Tenant
          in: header
          description: Tenant the calling service acts for; the resource must belong to it
          required: true
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalUpload'
        '400':
          description: X-Acting-Tenant is missing or not a tenant key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Requires a service token with scope documents:internal
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not the acting tenant's upload
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/uploads/{id}/download:
    get:
      tags:
        - internal
      summary: Short-lived presigned GET on a clean object, for services
      description: Service tokens with scope documents:internal, acting for the tenant in X-Acting-Tenant. The URL is valid for 5 minutes.
      operationId: getUploadDownload
      parameters:
        - name: X-Acting-Tenant
          in: header
          description: Tenant the calling service acts for; the resource must belong to it
          required: true
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Download URL valid for a few minutes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadDownload'
        '400':
          description: X-Acting-Tenant is missing or not a tenant key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Requires a service token with scope documents:internal
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not the acting tenant's upload
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: 'Problem type `upload-not-clean`: the upload is not clean'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: upload.download.issued
        resource: upload
  /internal/v1/uploads/{id}/linked:
    post:
      tags:
        - internal
      summary: Record that the owning service linked a clean upload
      description: 'Service tokens with scope documents:internal, acting for the tenant in X-Acting-Tenant. The owning service calls it when it links a clean upload to its record (declarations: an attachment on an item), so the upload is not an orphan: a declaration attachment left unlinked for 30 days is deleted. Idempotent: the first link time is kept.'
      operationId: markUploadLinked
      parameters:
        - name: X-Acting-Tenant
          in: header
          description: Tenant the calling service acts for; the resource must belong to it
          required: true
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Link recorded
        '400':
          description: X-Acting-Tenant is missing or not a tenant key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Requires a service token with scope documents:internal
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not the acting tenant's upload
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: 'Problem type `upload-not-clean`: the upload is not clean'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/uploads/{id}/unlinked:
    post:
      tags:
        - internal
      summary: Record that the owning service took its link to an upload back
      description: 'Service tokens with scope documents:internal, acting for the tenant in X-Acting-Tenant. The owning service calls it when it removes the record an upload was linked to (declarations: an attachment unlinked, or a draft discarded); a declaration attachment left unlinked for 30 days is deleted. Idempotent: an upload that is not linked is left as it is.'
      operationId: markUploadUnlinked
      parameters:
        - name: X-Acting-Tenant
          in: header
          description: Tenant the calling service acts for; the resource must belong to it
          required: true
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Link taken back
        '400':
          description: X-Acting-Tenant is missing or not a tenant key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Requires a service token with scope documents:internal
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not the acting tenant's upload
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/documents/{documentId}:
    get:
      tags:
        - documents
      summary: Metadata of an issued document (owner)
      description: The person the document is about, or staff of the issuing Commission named among the document's additional downloaders; anyone else gets 404.
      operationId: getDocument
      parameters:
        - name: documentId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedDocument'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/documents/{documentId}/download:
    get:
      tags:
        - documents
      summary: Short-lived presigned download of an issued PDF (owner)
      description: The document's subject person (the `person_id` of their token), or an access officer of the issuing Commission named among the document's additional downloaders (their token's `sub`, tenant and role); anyone else gets 404. A document with a download window (an access package) is refused with 410 once it ends. Every download link handed out is audited under the issuing Commission and recorded as `document.downloaded.v1`, which the access register reads.
      operationId: getDocumentDownload
      parameters:
        - name: documentId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Download URL valid for five minutes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDownload'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '410':
          description: 'Problem type `download-window-closed`: the download window has ended'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: document.downloaded
        resource: issued-document
  /internal/v1/documents/issue:
    post:
      tags:
        - internal
      summary: Render, sign and register a document (services)
      description: "Service tokens with scope documents:internal, issuing for the tenant in X-Acting-Tenant. Renders the type's versioned template to PDF through Gotenberg with the verification code and QR in the footer of every page and the watermark, when given, across every page, PAdES-signs it with the documents signing certificate, stores its SHA-256 in an Ed25519-signed verification record, stores the PDF and emits `document.issued.v1`. The disclosure level and public payload are the template's. `downloadWindowDays` limits the subject person's downloads to that many days from issue. An access-package requires a watermark, a download window and a subject person; a certified-copy a subject person. One document per type and subject: issuing again returns it with 200."
      operationId: issueDocument
      parameters:
        - name: X-Acting-Tenant
          in: header
          description: Tenant the calling service acts for; the resource must belong to it
          required: true
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: Idempotency-Key
          in: header
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueDocument'
      responses:
        '200':
          description: Issued for this subject already; the document issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedDocument'
        '201':
          description: Issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedDocument'
        '400':
          description: Request failed validation, the payload is not the template's, or the request lacks what the type requires
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Requires a service token with scope documents:internal
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: 'Problem type `renderer-unavailable`, `signer-unavailable` or `storage-unavailable`: nothing was issued; retry'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/documents/{documentId}/supersede:
    post:
      tags:
        - internal
      summary: Mark a document superseded by a newer one (services)
      description: Service tokens with scope documents:internal, acting for the tenant in X-Acting-Tenant. Sets the status to superseded and supersededBy to the newer document, re-signs the verification record and emits `document.superseded.v1`.
      operationId: supersedeDocument
      parameters:
        - name: X-Acting-Tenant
          in: header
          description: Tenant the calling service acts for; the resource must belong to it
          required: true
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: documentId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupersedeDocument'
      responses:
        '200':
          description: Superseded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedDocument'
        '400':
          description: X-Acting-Tenant is missing or not a tenant key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Requires a service token with scope documents:internal
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not the acting tenant's document
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Problem type `document-not-valid` (superseded or revoked already) or `superseding-document-invalid` (the newer document is not a valid document of the same type)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: 'Problem type `signer-unavailable`: nothing changed; retry'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/ActingTenant'
    get:
      tags:
        - internal
      summary: Metadata of an issued document of the acting tenant (services)
      description: |
        Service tokens with scope documents:internal, acting in X-Acting-Tenant for the issuing
        tenant; a document another tenant issued is 404. The review service reads the SHA-256 of
        the letters it lists in a referral package's manifest (spec 08). Metadata only, no content
        or download link.
      operationId: internalGetDocument
      x-draft: true
      responses:
        '200':
          description: Metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalIssuedDocument'
        '404':
          description: Not found, or not the acting tenant's document
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/documents/{documentId}/revoke:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/ActingTenant'
    post:
      tags:
        - internal
      summary: Revoke an issued document (services)
      description: |
        Sets `status` to revoked with the reason, e.g. a clarification letter withdrawn as issued
        in error (spec 07a); the verify page then shows the document revoked. Service tokens with
        scope documents:internal, acting in X-Acting-Tenant for the issuing tenant. A document
        already revoked is refused with 409.
      operationId: revokeDocument
      x-draft: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  $ref: '#/components/schemas/RevocationReason'
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedDocument'
        '404':
          description: Not found, or not the acting tenant's document
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Already revoked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    UploadPurpose:
      type: string
      enum:
        - roster-import
        - declaration-attachment
        - access-representation
      description: Sets allowed content types and the size limit
    UploadState:
      type: string
      enum:
        - awaiting-upload
        - clean
        - infected
        - rejected
        - expired
        - deleted
    UploadRejection:
      type: string
      enum:
        - type
        - encoding
        - size
        - missing
        - timeout
      description: 'Why a rejected upload was refused: `type` the bytes are not the declared type; `encoding` a CSV that is not UTF-8 text (save it as CSV UTF-8); `size` over the limit or not the declared size; `missing` nothing was uploaded; `timeout` the checks did not finish'
    CreateUpload:
      type: object
      properties:
        purpose:
          $ref: '#/components/schemas/UploadPurpose'
        contentType:
          type: string
          minLength: 1
          maxLength: 255
          description: One of the purpose's types; the PUT to uploadUrl must send it as Content-Type
          examples:
            - text/csv
            - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        declaredSize:
          type: integer
          minimum: 1
          description: Bytes; within the purpose's limit. The PUT must send exactly this many bytes
        fileName:
          description: Display only; never used as an object key
          type: string
          minLength: 1
          maxLength: 255
      required:
        - purpose
        - contentType
        - declaredSize
    UploadReservation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
          description: Presigned PUT; send the raw bytes with the declared Content-Type and size before expiresAt
        expiresAt:
          type: string
          format: date-time
        maxSize:
          type: integer
      required:
        - id
        - uploadUrl
        - expiresAt
        - maxSize
    Upload:
      type: object
      properties:
        id:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/UploadPurpose'
        state:
          $ref: '#/components/schemas/UploadState'
        rejection:
          anyOf:
            - $ref: '#/components/schemas/UploadRejection'
            - type: 'null'
        contentType:
          type: string
          description: Declared type; detectedType is set after completion
        detectedType:
          type:
            - string
            - 'null'
        declaredSize:
          type: integer
        size:
          type:
            - integer
            - 'null'
        sha256:
          description: Hex digest, set when clean
          type:
            - string
            - 'null'
        fileName:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
        completedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
      required:
        - id
        - purpose
        - state
        - rejection
        - contentType
        - detectedType
        - declaredSize
        - size
        - sha256
        - fileName
        - createdAt
        - completedAt
    UploadDownload:
      type: object
      properties:
        id:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/UploadPurpose'
        state:
          type: string
          const: clean
        downloadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
        sha256:
          type: string
        size:
          type: integer
        fileName:
          description: As given at createUpload; display only
          type:
            - string
            - 'null'
        detectedType:
          type: string
          description: Sniffed content type, e.g. text/csv or the XLSX type
      required:
        - id
        - purpose
        - state
        - downloadUrl
        - expiresAt
        - sha256
        - size
        - fileName
        - detectedType
    DocumentType:
      type: string
      enum:
        - acknowledgement-slip
        - access-package
        - certified-copy
      description: Document types with a template; later specs add theirs
    DisclosureLevel:
      type: string
      enum:
        - public
        - restricted
        - confidential
      description: "What the public verify page shows: public (content), restricted (reference, type, Commission, date), confidential (validity only). Fixed by the document type's template"
    DocumentStatus:
      type: string
      enum:
        - valid
        - superseded
        - revoked
        - expired
    IssueDocument:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/DocumentType'
        templateVersion:
          type: integer
          minimum: 1
        subjectRef:
          type: string
          pattern: ^[a-z][a-z-]*:[0-9a-f-]{36}$
          description: The record the document is about; one document per type and subject. Issuing again returns it
          examples:
            - declaration-version:0192f0c4-8a51-7cc2-9d1e-3b3f2a7e4c10
        subjectPersonId:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          description: 'The only person who may download the document: the declarant, the applicant or the law-enforcement officer (their token carries it as `person_id`); null for none. Required for access-package and certified-copy'
        watermark:
          $ref: '#/components/schemas/Watermark'
        downloadWindowDays:
          description: 'Days from issue during which the subject person may download the document; afterwards a download is refused with 410 `download-window-closed`. None: no window. Required for access-package'
          type: integer
          minimum: 1
          maximum: 90
        additionalDownloaders:
          description: "Token subjects (`sub`) of the issuing Commission's staff who may download the document besides its subject person, with a token of that Commission, within the same window and audited the same way: the access officer who recorded an in-person self-access application, to print the certified copy they hand over. None: the subject person only"
          maxItems: 10
          type: array
          items:
            type: string
            minLength: 1
