                  - reference
                  - version
                  - type
                  - statementDate
                  - submittedAt
                  - content
                additionalProperties: false
          required:
            - schemaVersion
            - grantReference
            - personName
            - commission
            - versions
          additionalProperties: false
        legalBasis:
          type: string
          enum:
            - act-s36-1
            - act-s36-2
