              minItems: 1
              type: array
              items:
                type: integer
                minimum: 2000
                maximum: 2100
            includeSpouses:
              type: boolean
            includeChildren:
              type: boolean
            sections:
              minItems: 1
              type: array
              items:
                type: string
                enum:
                  - bio
                  - income
                  - assets
                  - liabilities
                  - other
          required:
            - years
            - includeSpouses
            - includeChildren
            - sections
          additionalProperties: false
      required:
