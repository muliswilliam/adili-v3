# Generated by `pnpm --filter @adili/documents contracts` from the documents service: do not edit.
openapi: 3.1.0
info:
  title: documents API
  description: Uploads, malware scanning, PDF issuance, signing, QR codes and verification records.
  version: '1'
servers:
  - url: /
    description: The service that serves this document
paths:
  /v1/uploads:
    post:
      tags:
        - uploads
      summary: Reserve an upload and get a presigned PUT to quarantine
      description: "The purpose's roles only (roster-import: reporting-officer). The PUT URL is valid for 15 minutes and accepts exactly the declared Content-Type and size."
      operationId: createUpload
      parameters:
        - name: Idempotency-Key
          in: header
          description: Client-generated UUID, unique per logical request; reuse on retry
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUpload'
      responses:
        '201':
          description: Upload reserved; PUT the bytes to uploadUrl before expiresAt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadReservation'
        '400':
          description: Request failed validation, or the type or size is not the purpose's
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Your roles do not allow uploads for this purpose
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/uploads/{id}:
    get:
      tags:
        - uploads
      summary: Upload state and metadata
      description: Uploads of the caller's tenant whose purpose the caller's roles cover; any other is 404.
      operationId: getUpload
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/uploads/{id}/complete:
    post:
      tags:
        - uploads
      summary: Verify, scan and move the uploaded object to the clean bucket
      description: 'Synchronous, bounded by a 60-second budget. Returns the final state: clean, infected or rejected (type, size, missing, timeout). The quarantine object is deleted in every case.'
      operationId: completeUpload
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Client-generated UUID, unique per logical request; reuse on retry
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Final state after scanning
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Problem type `upload-completed` (already clean, infected or rejected), `upload-expired`, or `upload-completing` (another request is completing it).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: 'Problem type `upload-check-unavailable`: storage or the scanner failed; nothing changed, retry.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/uploads/{id}/download:
    get:
      tags:
        - internal
      summary: Short-lived presigned GET on a clean object, for services
      description: Service tokens with scope documents:internal, acting for the tenant in X-Acting-Tenant. The URL is valid for 5 minutes.
      operationId: getUploadDownload
      parameters:
        - name: X-Acting-Tenant
          in: header
          description: Tenant the calling service acts for; the resource must belong to it
          required: true
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Download URL valid for a few minutes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadDownload'
        '400':
          description: X-Acting-Tenant is missing or not a tenant key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Requires a service token with scope documents:internal
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not the acting tenant's upload
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: 'Problem type `upload-not-clean`: the upload is not clean'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: upload.download.issued
        resource: upload
  /internal/v1/uploads/{id}/linked:
    post:
      tags:
        - internal
      summary: Record that the owning service linked a clean upload
      description: 'Service tokens with scope documents:internal, acting for the tenant in X-Acting-Tenant. The owning service calls it when it links a clean upload to its record (declarations: an attachment on an item), so the upload is not an orphan. Idempotent: the first link time is kept.'
      operationId: markUploadLinked
      parameters:
        - name: X-Acting-Tenant
          in: header
          description: Tenant the calling service acts for; the resource must belong to it
          required: true
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Link recorded
        '400':
          description: X-Acting-Tenant is missing or not a tenant key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Requires a service token with scope documents:internal
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not the acting tenant's upload
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: 'Problem type `upload-not-clean`: the upload is not clean'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/documents/{documentId}:
    get:
      tags:
        - documents
      summary: Metadata of an issued document (owner)
      description: The person the document is about only; anyone else gets 404.
      operationId: getDocument
      parameters:
        - name: documentId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedDocument'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/documents/{documentId}/download:
    get:
      tags:
        - documents
      summary: Short-lived presigned download of an issued PDF (owner)
      description: The person the document is about only; anyone else gets 404. Every download link handed out is audited under the issuing Commission.
      operationId: getDocumentDownload
      parameters:
        - name: documentId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Download URL valid for five minutes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDownload'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: document.downloaded
        resource: issued-document
  /internal/v1/documents/issue:
    post:
      tags:
        - internal
      summary: Render, sign and register a document (services)
      description: "Service tokens with scope documents:internal, issuing for the tenant in X-Acting-Tenant. Renders the type's versioned template to PDF through Gotenberg with the verification code and QR in the footer of every page, PAdES-signs it with the documents signing certificate, stores its SHA-256 in an Ed25519-signed verification record, stores the PDF and emits `document.issued.v1`. The disclosure level and public payload are the template's. One document per type and subject: issuing again returns it with 200."
      operationId: issueDocument
      parameters:
        - name: X-Acting-Tenant
          in: header
          description: Tenant the calling service acts for; the resource must belong to it
          required: true
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueDocument'
      responses:
        '200':
          description: Issued for this subject already; the document issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedDocument'
        '201':
          description: Issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedDocument'
        '400':
          description: Request failed validation, or the payload is not the template's
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Requires a service token with scope documents:internal
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: 'Problem type `renderer-unavailable`, `signer-unavailable` or `storage-unavailable`: nothing was issued; retry'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/documents/{documentId}/supersede:
    post:
      tags:
        - internal
      summary: Mark a document superseded by a newer one (services)
      description: Service tokens with scope documents:internal, acting for the tenant in X-Acting-Tenant. Sets the status to superseded and supersededBy to the newer document, re-signs the verification record and emits `document.superseded.v1`.
      operationId: supersedeDocument
      parameters:
        - name: X-Acting-Tenant
          in: header
          description: Tenant the calling service acts for; the resource must belong to it
          required: true
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: documentId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupersedeDocument'
      responses:
        '200':
          description: Superseded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedDocument'
        '400':
          description: X-Acting-Tenant is missing or not a tenant key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Requires a service token with scope documents:internal
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not the acting tenant's document
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Problem type `document-not-valid` (superseded or revoked already) or `superseding-document-invalid` (the newer document is not a valid document of the same type)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: 'Problem type `signer-unavailable`: nothing changed; retry'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    UploadPurpose:
      type: string
      enum:
        - roster-import
      description: Sets allowed content types and the size limit
    UploadState:
      type: string
      enum:
        - awaiting-upload
        - clean
        - infected
        - rejected
        - expired
    UploadRejection:
      type: string
      enum:
        - type
        - encoding
        - size
        - missing
        - timeout
      description: 'Why a rejected upload was refused: `type` the bytes are not the declared type; `encoding` a CSV that is not UTF-8 text (save it as CSV UTF-8); `size` over the limit or not the declared size; `missing` nothing was uploaded; `timeout` the checks did not finish'
    CreateUpload:
      type: object
      properties:
        purpose:
          $ref: '#/components/schemas/UploadPurpose'
        contentType:
          type: string
          minLength: 1
          maxLength: 255
          description: One of the purpose's types; the PUT to uploadUrl must send it as Content-Type
          examples:
            - text/csv
            - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        declaredSize:
          type: integer
          minimum: 1
          description: Bytes; within the purpose's limit. The PUT must send exactly this many bytes
        fileName:
          description: Display only; never used as an object key
          type: string
          minLength: 1
          maxLength: 255
      required:
        - purpose
        - contentType
        - declaredSize
    UploadReservation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
          description: Presigned PUT; send the raw bytes with the declared Content-Type and size before expiresAt
        expiresAt:
          type: string
          format: date-time
        maxSize:
          type: integer
      required:
        - id
        - uploadUrl
        - expiresAt
        - maxSize
    Upload:
      type: object
      properties:
        id:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/UploadPurpose'
        state:
          $ref: '#/components/schemas/UploadState'
        rejection:
          anyOf:
            - $ref: '#/components/schemas/UploadRejection'
            - type: 'null'
        contentType:
          type: string
          description: Declared type; detectedType is set after completion
        detectedType:
          type:
            - string
            - 'null'
        declaredSize:
          type: integer
        size:
          type:
            - integer
            - 'null'
        sha256:
          description: Hex digest, set when clean
          type:
            - string
            - 'null'
        fileName:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
        completedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
      required:
        - id
        - purpose
        - state
        - rejection
        - contentType
        - detectedType
        - declaredSize
        - size
        - sha256
        - fileName
        - createdAt
        - completedAt
    UploadDownload:
      type: object
      properties:
        id:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/UploadPurpose'
        state:
          type: string
          const: clean
        downloadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
        sha256:
          type: string
        size:
          type: integer
        fileName:
          description: As given at createUpload; display only
          type:
            - string
            - 'null'
        detectedType:
          type: string
          description: Sniffed content type, e.g. text/csv or the XLSX type
      required:
        - id
        - purpose
        - state
        - downloadUrl
        - expiresAt
        - sha256
        - size
        - fileName
        - detectedType
    DocumentType:
      type: string
      enum:
        - acknowledgement-slip
      description: Document types with a template; later specs add theirs
    DisclosureLevel:
      type: string
      enum:
        - public
        - restricted
        - confidential
      description: "What the public verify page shows: public (content), restricted (reference, type, Commission, date), confidential (validity only). Fixed by the document type's template"
    DocumentStatus:
      type: string
      enum:
        - valid
        - superseded
        - revoked
        - expired
    IssueDocument:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/DocumentType'
        templateVersion:
          type: integer
          minimum: 1
        subjectRef:
          type: string
          pattern: ^[a-z][a-z-]*:[0-9a-f-]{36}$
          description: The record the document is about; one document per type and subject. Issuing again returns it
          examples:
            - declaration-version:0192f0c4-8a51-7cc2-9d1e-3b3f2a7e4c10
        subjectPersonId:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          description: The person who may download the document (the declarant); null for none
        payload:
          $ref: '#/components/schemas/AcknowledgementSlipPayload'
      required:
        - type
        - templateVersion
        - subjectRef
        - subjectPersonId
        - payload
    SupersedeDocument:
      type: object
      properties:
        supersededBy:
          type: string
          format: uuid
          description: The newer document of the same type and tenant
      required:
        - supersededBy
    IssuedDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/DocumentType'
        templateVersion:
          type: integer
        disclosureLevel:
          $ref: '#/components/schemas/DisclosureLevel'
        issuerTenant:
          type: string
        subjectRef:
          type: string
        verificationId:
          type: string
          description: Printed under the QR code
          examples:
            - ADL-7Q4K-M2XR-9HTC-2B7F-Q3ZD-9KMV-8P
        verifyUrl:
          type: string
          format: uri
          description: "The QR code's payload: the document's verify page"
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        status:
          $ref: '#/components/schemas/DocumentStatus'
        supersededBy:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        issuedAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - templateVersion
        - disclosureLevel
        - issuerTenant
        - subjectRef
        - verificationId
        - verifyUrl
        - sha256
        - status
        - supersededBy
        - issuedAt
    DocumentDownload:
      type: object
      properties:
        downloadUrl:
          type: string
          format: uri
          description: Presigned GET of the signed PDF
        expiresAt:
          type: string
          format: date-time
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
      required:
        - downloadUrl
        - expiresAt
        - sha256
    AcknowledgementSlipPayload:
      type: object
      properties:
        declarantName:
          type: string
          minLength: 1
          maxLength: 200
        commissionName:
          type: string
          minLength: 1
          maxLength: 200
        issuerCode:
          type: string
          pattern: ^[A-Z0-9]{2,20}$
        declarationType:
          type: string
          enum:
            - initial
            - biennial
            - final
        statementDate:
          type: string
          format: date
        dueDate:
          anyOf:
            - type: string
              format: date
            - type: 'null'
        reference:
          type: string
          description: Declaration reference number (ADR-011), e.g. DCB-PSC-2027-0000001-1
        version:
          type: integer
          minimum: 1
        submittedAt:
          type: string
          format: date-time
        late:
          type: boolean
        statementCount:
          type: integer
          minimum: 0
        itemCount:
          type: integer
          minimum: 0
      required:
        - declarantName
        - commissionName
        - issuerCode
        - declarationType
        - statementDate
        - dueDate
        - reference
        - version
        - submittedAt
        - late
        - statementCount
        - itemCount
      description: "Payload of acknowledgement-slip v1: what the declarations service's acknowledgement payload endpoint returns for a submitted version"
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
            - rate-limit-exceeded
            - no-match
            - already-onboarded
            - no-roster
            - otp-invalid
            - otp-expired
            - resend-cooldown
            - otp-send-failed
            - wrong-step
            - session-expired
            - iprs-unavailable
            - identity-unavailable
            - email-in-use
            - step-up-required
            - incomplete
            - before-statement-date
            - amendment-window-closed
            - not-a-draft
            - not-submitted
            - obligation-cancelled
            - acknowledgement-issued
            - acknowledgement-in-progress
          description: Machine-readable cause, from the platform registry; clients map it to copy and never show `title` or `detail`
        detail:
          type: string
        instance:
          type: string
        errors:
          description: Field-level errors; `path` is the dotted request field
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - path
              - message
      required:
        - type
        - title
        - status
security:
  - bearer: []
