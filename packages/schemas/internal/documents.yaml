openapi: 3.1.0
info:
  title: documents API - uploads (draft)
  version: '1'
  description: |
    Draft contract for specs 02 (roster import), 05 (declaration attachments), 06 (document issuance) 07a (clarification letters) and 08 (decision, notice, warning, stoppage letters, referral packages). Presigned uploads to quarantine,
    ClamAV scan on completion, presigned download of clean objects for other services.
    The documents service's Swagger document becomes the source of truth once implemented.
servers:
  - url: http://localhost:4006
security:
  - bearer: []
tags:
  - name: uploads
  - name: documents
  - name: internal
paths:
  /v1/uploads:
    post:
      tags: [uploads]
      operationId: createUpload
      summary: Reserve an upload and get a presigned PUT to quarantine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUpload'
      responses:
        '201':
          description: Upload reserved; PUT the bytes to uploadUrl before expiresAt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadReservation'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/uploads/{id}:
    parameters:
      - $ref: '#/components/parameters/UploadId'
    get:
      tags: [uploads]
      operationId: getUpload
      summary: Upload state and metadata
      responses:
        '200':
          description: The upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/uploads/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/UploadId'
    post:
      tags: [uploads]
      operationId: completeUpload
      summary: Verify, scan and move the uploaded object to the clean bucket
      description: |
        Synchronous for purposes with small size limits (roster-import, 50 MB). Returns the
        final state: clean, infected or rejected (type, size, missing, timeout).
      responses:
        '200':
          description: Final state after scanning
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Upload already completed or expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/uploads/{id}/download:
    parameters:
      - $ref: '#/components/parameters/UploadId'
    get:
      tags: [internal]
      operationId: getUploadDownload
      summary: Short-lived presigned GET on a clean object, for services
      description: Not routed by the public entrypoint. Caller acts for the upload's tenant.
      responses:
        '200':
          description: Download URL valid for a few minutes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadDownload'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Upload is not clean
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/documents/issue:
    post:
      tags: [internal]
      operationId: issueDocument
      summary: Render, sign and register a document (services)
      description: |
        Gotenberg PDF from a versioned template with the verification code and QR in the footer,
        PAdES signature, SHA-256, Ed25519-signed verification record, object storage, event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueDocument'
      responses:
        '201':
          description: Issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedDocument'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '502':
          description: Renderer or signer unavailable; nothing registered
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/documents/{documentId}/supersede:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      tags: [internal]
      operationId: supersedeDocument
      summary: Mark a document superseded by a newer one
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supersededBy]
              properties:
                supersededBy:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Superseded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedDocument'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already superseded or revoked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [documents]
      operationId: getDocument
      summary: Metadata of an issued document (owner)
      responses:
        '200':
          description: Metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedDocument'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/documents/{documentId}/download:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [documents]
      operationId: getDocumentDownload
      summary: Short-lived presigned download of an issued PDF (owner; audited)
      responses:
        '200':
          description: Download URL valid for five minutes
          content:
            application/json:
              schema:
                type: object
                required: [downloadUrl, expiresAt, sha256]
                properties:
                  downloadUrl:
                    type: string
                    format: uri
                  expiresAt:
                    type: string
                    format: date-time
                  sha256:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UploadId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ValidationProblem:
      description: Request failed validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Caller lacks the required role
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Not found, or not visible to the caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    UploadPurpose:
      type: string
      description: Sets allowed content types and the size limit
      enum: [roster-import, declaration-attachment, clarification-attachment, action-response]
    UploadState:
      type: string
      enum: [awaiting-upload, clean, infected, rejected, expired]
    UploadRejection:
      type: string
      enum: [type, size, missing, timeout]
    CreateUpload:
      type: object
      required: [purpose, contentType, declaredSize]
      properties:
        purpose:
          $ref: '#/components/schemas/UploadPurpose'
        contentType:
          type: string
          examples:
            ['text/csv', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet']
        declaredSize:
          type: integer
          minimum: 1
          description: Bytes; must be within the purpose's limit
        fileName:
          type: string
          maxLength: 255
          description: Display only; never used as an object key
    UploadReservation:
      type: object
      required: [id, uploadUrl, expiresAt, maxSize]
      properties:
        id:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
          description: Presigned PUT; send the raw bytes with the declared content type
        expiresAt:
          type: string
          format: date-time
        maxSize:
          type: integer
    Upload:
      type: object
      required: [id, purpose, state, contentType, declaredSize, fileName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/UploadPurpose'
        state:
          $ref: '#/components/schemas/UploadState'
        rejection:
          oneOf:
            - $ref: '#/components/schemas/UploadRejection'
            - type: 'null'
        contentType:
          type: string
          description: Declared type; detectedType is set after completion
        detectedType:
          type: [string, 'null']
        declaredSize:
          type: integer
        size:
          type: [integer, 'null']
        sha256:
          type: [string, 'null']
          description: Hex digest, set when clean
        fileName:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
    UploadDownload:
      type: object
      required: [id, state, downloadUrl, expiresAt, sha256, size]
      properties:
        id:
          type: string
          format: uuid
        state:
          const: clean
        downloadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
        sha256:
          type: string
        size:
          type: integer
    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path:
                type: string
              message:
                type: string
    DocumentType:
      type: string
      enum:
        - acknowledgement-slip
        - clarification-letter
        - decision-letter
        - notice-to-comply
        - warning
        - salary-stoppage
        - disciplinary-referral
        - referral-package
    DisclosureLevel:
      type: string
      enum: [public, restricted, confidential]
    DocumentStatus:
      type: string
      enum: [valid, superseded, revoked, expired]
    IssueDocument:
      type: object
      required:
        [
          type,
          templateVersion,
          disclosureLevel,
          issuerTenant,
          subjectRef,
          subjectPersonId,
          payload,
          publicPayload,
        ]
      properties:
        type:
          $ref: '#/components/schemas/DocumentType'
        templateVersion:
          type: integer
          minimum: 1
        disclosureLevel:
          $ref: '#/components/schemas/DisclosureLevel'
        issuerTenant:
          type: string
        subjectRef:
          type: string
          description: Owning record, e.g. declaration-version:<uuid>
        subjectPersonId:
          type: [string, 'null']
          format: uuid
          description: Person allowed to download the document
        payload:
          type: object
          description: Fields the template renders; never stored beyond the PDF
          additionalProperties: true
        publicPayload:
          type: object
          description: Fields shown on the verify page for public and restricted levels
          additionalProperties: true
    IssuedDocument:
      type: object
      required:
        - id
        - type
        - templateVersion
        - disclosureLevel
        - issuerTenant
        - subjectRef
        - verificationId
        - sha256
        - status
        - supersededBy
        - issuedAt
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/DocumentType'
        templateVersion:
          type: integer
        disclosureLevel:
          $ref: '#/components/schemas/DisclosureLevel'
        issuerTenant:
          type: string
        subjectRef:
          type: string
        verificationId:
          type: string
          description: e.g. ADL-7Q4K-M2XR-9HTC-2B7F-Q3ZD-9K
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        status:
          $ref: '#/components/schemas/DocumentStatus'
        supersededBy:
          type: [string, 'null']
          format: uuid
        issuedAt:
          type: string
          format: date-time
