# Generated by `pnpm --filter @adili/documents contracts`: do not edit.
# Implemented operations come from the documents service; operations marked `x-draft` come
# from packages/schemas/drafts/documents.yaml until they are implemented.
openapi: 3.1.0
info:
  title: documents API
  description: Uploads, malware scanning, PDF issuance, signing, QR codes and verification records.
  version: '1'
servers:
  - url: /
    description: The service that serves this document
paths:
  /v1/uploads:
    post:
      tags:
        - uploads
      summary: Reserve an upload and get a presigned PUT to quarantine
      description: "The purpose's roles only (roster-import: reporting-officer). The PUT URL is valid for 15 minutes and accepts exactly the declared Content-Type and size."
      operationId: createUpload
      parameters:
        - name: Idempotency-Key
          in: header
          description: Client-generated UUID, unique per logical request; reuse on retry
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUpload'
      responses:
        '201':
          description: Upload reserved; PUT the bytes to uploadUrl before expiresAt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadReservation'
        '400':
          description: Request failed validation, or the type or size is not the purpose's
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Your roles do not allow uploads for this purpose
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/uploads/{id}:
    get:
      tags:
        - uploads
      summary: Upload state and metadata
      description: Uploads of the caller's tenant whose purpose the caller's roles cover; any other is 404.
      operationId: getUpload
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/uploads/{id}/complete:
    post:
      tags:
        - uploads
      summary: Verify, scan and move the uploaded object to the clean bucket
      description: 'Synchronous, bounded by a 60-second budget. Returns the final state: clean, infected or rejected (type, size, missing, timeout). The quarantine object is deleted in every case.'
      operationId: completeUpload
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Client-generated UUID, unique per logical request; reuse on retry
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Final state after scanning
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Problem type `upload-completed` (already clean, infected or rejected), `upload-expired`, or `upload-completing` (another request is completing it).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: 'Problem type `upload-check-unavailable`: storage or the scanner failed; nothing changed, retry.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/uploads/{id}/download:
    get:
      tags:
        - internal
      summary: Short-lived presigned GET on a clean object, for services
      description: Service tokens with scope documents:internal, acting for the tenant in X-Acting-Tenant. The URL is valid for 5 minutes.
      operationId: getUploadDownload
      parameters:
        - name: X-Acting-Tenant
          in: header
          description: Tenant the calling service acts for; the resource must belong to it
          required: true
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Download URL valid for a few minutes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadDownload'
        '400':
          description: X-Acting-Tenant is missing or not a tenant key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Requires a service token with scope documents:internal
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not the acting tenant's upload
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: 'Problem type `upload-not-clean`: the upload is not clean'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/documents/issue:
    post:
      tags:
        - internal
      summary: Render, sign and register a document (services)
      description: |
        Gotenberg PDF from a versioned template with the verification code and QR in the footer,
        PAdES signature, SHA-256, Ed25519-signed verification record, object storage, event.
      operationId: issueDocument
      x-draft: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueDocument'
      responses:
        '201':
          description: Issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedDocument'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '502':
          description: Renderer or signer unavailable; nothing registered
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/documents/{documentId}/supersede:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      tags:
        - internal
      summary: Mark a document superseded by a newer one
      description: |
        Sets `status` to superseded and `supersededBy` to the newer document. A document
        already superseded or revoked is refused with 409.
      operationId: supersedeDocument
      x-draft: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - supersededBy
              properties:
                supersededBy:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Superseded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedDocument'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already superseded or revoked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags:
        - documents
      summary: Metadata of an issued document (owner)
      description: |
        The subject person (`subjectPersonId`) only; anyone else gets 404.
      operationId: getDocument
      x-draft: true
      responses:
        '200':
          description: Metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedDocument'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/documents/{documentId}/download:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags:
        - documents
      summary: Short-lived presigned download of an issued PDF (owner)
      description: |
        The subject person only; audited, and emits `document.downloaded.v1`. Refused with 410
        once the document's download window has ended.
      operationId: getDocumentDownload
      x-draft: true
      responses:
        '200':
          description: Download URL valid for five minutes
          content:
            application/json:
              schema:
                type: object
                required:
                  - downloadUrl
                  - expiresAt
                  - sha256
                properties:
                  downloadUrl:
                    type: string
                    format: uri
                  expiresAt:
                    type: string
                    format: date-time
                  sha256:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Download window has ended
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    UploadPurpose:
      type: string
      enum:
        - roster-import
      description: Sets allowed content types and the size limit
    UploadState:
      type: string
      enum:
        - awaiting-upload
        - clean
        - infected
        - rejected
        - expired
    UploadRejection:
      type: string
      enum:
        - type
        - encoding
        - size
        - missing
        - timeout
      description: 'Why a rejected upload was refused: `type` the bytes are not the declared type; `encoding` a CSV that is not UTF-8 text (save it as CSV UTF-8); `size` over the limit or not the declared size; `missing` nothing was uploaded; `timeout` the checks did not finish'
    CreateUpload:
      type: object
      properties:
        purpose:
          $ref: '#/components/schemas/UploadPurpose'
        contentType:
          type: string
          minLength: 1
          maxLength: 255
          description: One of the purpose's types; the PUT to uploadUrl must send it as Content-Type
          examples:
            - text/csv
            - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        declaredSize:
          type: integer
          minimum: 1
          description: Bytes; within the purpose's limit. The PUT must send exactly this many bytes
        fileName:
          description: Display only; never used as an object key
          type: string
          minLength: 1
          maxLength: 255
      required:
        - purpose
        - contentType
        - declaredSize
    UploadReservation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
          description: Presigned PUT; send the raw bytes with the declared Content-Type and size before expiresAt
        expiresAt:
          type: string
          format: date-time
        maxSize:
          type: integer
      required:
        - id
        - uploadUrl
        - expiresAt
        - maxSize
    Upload:
      type: object
      properties:
        id:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/UploadPurpose'
        state:
          $ref: '#/components/schemas/UploadState'
        rejection:
          anyOf:
            - $ref: '#/components/schemas/UploadRejection'
            - type: 'null'
        contentType:
          type: string
          description: Declared type; detectedType is set after completion
        detectedType:
          type:
            - string
            - 'null'
        declaredSize:
          type: integer
        size:
          type:
            - integer
            - 'null'
        sha256:
          description: Hex digest, set when clean
          type:
            - string
            - 'null'
        fileName:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
        completedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
      required:
        - id
        - purpose
        - state
        - rejection
        - contentType
        - detectedType
        - declaredSize
        - size
        - sha256
        - fileName
        - createdAt
        - completedAt
    UploadDownload:
      type: object
      properties:
        id:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/UploadPurpose'
        state:
          type: string
          const: clean
        downloadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
        sha256:
          type: string
        size:
          type: integer
        fileName:
          description: As given at createUpload; display only
          type:
            - string
            - 'null'
        detectedType:
          type: string
          description: Sniffed content type, e.g. text/csv or the XLSX type
      required:
        - id
        - purpose
        - state
        - downloadUrl
        - expiresAt
        - sha256
        - size
        - fileName
        - detectedType
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          description: Field-level errors; `path` is the dotted request field
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - path
              - message
      required:
        - type
        - title
        - status
    DocumentType:
      type: string
      enum:
        - acknowledgement-slip
        - clarification-letter
        - decision-letter
        - notice-to-comply
        - warning
        - salary-stoppage
        - disciplinary-referral
        - referral-package
        - form-m
        - compliance-report-receipt
        - ncr
        - access-package
        - certified-copy
        - open-data-manifest
    DisclosureLevel:
      type: string
      enum:
        - public
        - restricted
        - confidential
    DocumentStatus:
      type: string
      enum:
        - valid
        - superseded
        - revoked
        - expired
    IssueDocument:
      type: object
      required:
        - type
        - templateVersion
        - disclosureLevel
        - issuerTenant
        - subjectRef
        - subjectPersonId
        - payload
        - publicPayload
      properties:
        type:
          $ref: '#/components/schemas/DocumentType'
        templateVersion:
          type: integer
          minimum: 1
        disclosureLevel:
          $ref: '#/components/schemas/DisclosureLevel'
        issuerTenant:
          type: string
        subjectRef:
          type: string
          description: Owning record, e.g. declaration-version:<uuid>
        subjectPersonId:
          type:
            - string
            - 'null'
          format: uuid
          description: Person allowed to download the document
        payload:
          type: object
          description: Fields the template renders; never stored beyond the PDF
          additionalProperties: true
        publicPayload:
          type: object
          description: Fields shown on the verify page for public and restricted levels
          additionalProperties: true
        watermark:
          oneOf:
            - $ref: '#/components/schemas/Watermark'
            - type: 'null'
          description: Rendered on every page (access packages)
        downloadWindowDays:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 365
          description: Downloads refused after issuedAt + window (410); null means no window
    Watermark:
      type: object
      required:
        - recipientName
        - reference
        - date
      properties:
        recipientName:
          type: string
        reference:
          type: string
          description: ARQ or LEA reference
        date:
          type: string
          format: date
    IssuedDocument:
      type: object
      required:
        - id
        - type
        - templateVersion
        - disclosureLevel
        - issuerTenant
        - subjectRef
        - verificationId
        - sha256
        - status
        - supersededBy
        - issuedAt
        - downloadExpiresAt
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/DocumentType'
        templateVersion:
          type: integer
        disclosureLevel:
          $ref: '#/components/schemas/DisclosureLevel'
        issuerTenant:
          type: string
        subjectRef:
          type: string
        verificationId:
          type: string
          description: e.g. ADL-7Q4K-M2XR-9HTC-2B7F-Q3ZD-9K
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        status:
          $ref: '#/components/schemas/DocumentStatus'
        supersededBy:
          type:
            - string
            - 'null'
          format: uuid
        issuedAt:
          type: string
          format: date-time
        downloadExpiresAt:
          type:
            - string
            - 'null'
          format: date-time
  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ValidationProblem:
      description: Request failed validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Not found, or not visible to the caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
security:
  - bearer: []
