          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OnboardingProblem'
        '502':
          description: 'Problem code `otp-send-failed`: the code could not be sent; nothing changed, try again'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OnboardingProblem'
      security: []
  /v1/onboarding/sessions/{sessionId}/contacts:
    post:
      tags:
        - onboarding
      summary: Supply an email or phone when the roster record has none
      description: Public, with the session secret; rate-limited per client IP. Only while the session waits for that contact (`*-contact-required`). The value is normalised (email lower-cased, phone to E.164) and its first code sent; once verified it is written to the roster record with source `declarant`.
      operationId: provideOnboardingContact
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: X-Onboarding-Secret
          in: header
          description: Session secret returned once at creation; held by the portal BFF in an httpOnly cookie
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvideOnboardingContact'
      responses:
        '200':
          description: Contact accepted and its code sent
          headers:
            RateLimit-Limit:
              description: Requests the caller's budget holds when full
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in the budget after this one
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the budget is full again
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingSession'
        '400':
          description: Body failed validation (e.g. not a valid email or phone number)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such session, or the secret is missing or wrong
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: 'Problem code `wrong-step`: the session is not waiting for this contact; re-read it'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OnboardingProblem'
        '410':
          description: 'Problem code `session-expired`: the session ended or ran out of time; the BFF clears its cookie'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OnboardingProblem'
        '429':
          description: 'Problem code `rate-limit-exceeded`: rate limit exceeded; retry after the seconds in `retryAfterSeconds` and Retry-After'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          headers:
            RateLimit-Limit:
              description: Requests the caller's budget holds when full
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in the budget after this one
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the budget is full again
              schema:
                type: integer
            Retry-After:
              description: Seconds until the next request would be allowed
              schema:
                type: integer
        '502':
          description: 'Problem code `otp-send-failed`: the code could not be sent; nothing changed, try again'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OnboardingProblem'
      security: []
  /v1/onboarding/sessions/{sessionId}/confirm:
    post:
      tags:
        - onboarding
      summary: Confirm roster details, run the IPRS check and create or link the account
      description: 'Public, with the session secret; rate-limited per client IP. From `phone-verified` only. An IPRS mismatch (or no IPRS record) is a 200 with outcome `identity-mismatch`: the session ends and the roster record is flagged for its reporting officer. A match creates the account and sends the set-password email (`account-created`), or links the record to the account the person already has from another Commission (`linked-existing-account`). Idempotent per Idempotency-Key: a retry gets the first answer back.'
      operationId: confirmOnboarding
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: X-Onboarding-Secret
          in: header
          description: Session secret returned once at creation; held by the portal BFF in an httpOnly cookie
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          description: Client-generated UUID, unique per logical request; reuse on retry
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Outcome of the confirmation, with the session as it now is
          headers:
            RateLimit-Limit:
              description: Requests the caller's budget holds when full
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in the budget after this one
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the budget is full again
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingConfirmResult'
        '404':
          description: No such session, or the secret is missing or wrong
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: 'The session is not at the confirm step (the BFF re-reads it), or problem code `email-in-use`: the verified email belongs to another account; nothing changed'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OnboardingProblem'
        '410':
          description: 'Problem code `session-expired`: the session ended or ran out of time; the BFF clears its cookie'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OnboardingProblem'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: 'Problem code `rate-limit-exceeded`: rate limit exceeded; retry after the seconds in `retryAfterSeconds` and Retry-After'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          headers:
            RateLimit-Limit:
              description: Requests the caller's budget holds when full
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in the budget after this one
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the budget is full again
              schema:
                type: integer
            Retry-After:
              description: Seconds until the next request would be allowed
              schema:
                type: integer
        '502':
          description: 'Problem code `identity-unavailable`: the account could not be created or linked; nothing changed'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OnboardingProblem'
        '503':
          description: 'Problem code `iprs-unavailable`: IPRS could not be checked; try again later, the session is unchanged'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OnboardingProblem'
      security: []
  /v1/onboarding/sessions/{sessionId}/resend-password-email:
    post:
      tags:
        - onboarding
      summary: Send the set-password email again
      description: 'Public, with the session secret; rate-limited per client IP. Only for a session confirmed with a new account (`account-created`), a minute after the last email, until 24 hours after confirm (the session `expiresAt`, then 410); the session then says when the next may be sent (`otp.resendAvailableAt`). Idempotent per Idempotency-Key: a retry sends no second email.'
      operationId: resendSetPasswordEmail
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: X-Onboarding-Secret
          in: header
          description: Session secret returned once at creation; held by the portal BFF in an httpOnly cookie
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          description: Client-generated UUID, unique per logical request; reuse on retry
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Email requested
          headers:
            RateLimit-Limit:
              description: Requests the caller's budget holds when full
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in the budget after this one
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the budget is full again
              schema:
                type: integer
        '404':
          description: No such session, or the secret is missing or wrong
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: The session is not confirmed with a new account (the BFF re-reads it)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OnboardingProblem'
        '410':
          description: 'Problem code `session-expired`: the session ended or ran out of time; the BFF clears its cookie'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OnboardingProblem'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Problem code `resend-cooldown` with `retryAfterSeconds`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OnboardingProblem'
        '502':
          description: 'Problem code `identity-unavailable`: the email could not be sent; try again'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OnboardingProblem'
      security: []
  /v1/commissions/{slug}/roster/onboarding-failures:
    get:
      tags:
        - roster
      summary: Failed onboarding attempts against the Commission in the last 24 hours
      description: "The Commission's reporting officer and commission admin; platform admin, EACC analyst and supervisor for every Commission. Counts only, no identifiers: many failures point to a stale roster or an attack (spec 03, story 30)."
      operationId: getOnboardingFailures
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            $ref: '#/components/schemas/Slug'
      responses:
        '200':
          description: Failed attempts by hour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingFailures'
        '403':
          description: 'Requires one of the roles: reporting-officer, commission-admin, platform-admin, eacc-analyst, eacc-supervisor'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: 'Not found: another Commission, or the Commission does not exist'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/me/declarant:
    get:
      tags:
        - me
      summary: The signed-in declarant's person, OFR, Commissions and verified contacts
      description: 'Declarants only, their own: the person is the one whose account is the token''s subject. The portal dashboard reads it, and takes 403 and 404 alike as "not a declarant".'
      operationId: getMyDeclarantProfile
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclarantProfile'
        '401':
          description: Missing, expired or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'Requires one of the roles: declarant'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: The account has the declarant role but no onboarded person
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/persons:
    get:
      tags:
        - persons
      summary: Look up account metadata by officer reference
      description: 'Helpdesk and platform admins, audited. Account metadata only: who the person is and which Commissions they are onboarded at, never the contents of their roster records. The officer reference is validated with its check character, so a mistyped one is 400 rather than 404.'
      operationId: findPersonByOfr
      parameters:
        - name: ofr
          required: true
          in: query
          description: Officer reference (ADR-011), permanent and person-level
          schema:
            type: string
            pattern: ^OFR-[0-9]{7}-[0-9A-Z]$
            examples:
              - OFR-0482913-L
      responses:
        '200':
          description: Account metadata without roster contents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonSummary'
        '400':
          description: 'Not an officer reference: wrong shape or check character'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            Only the helpdesk and platform admins look persons up

            Requires one of the roles: platform-admin, helpdesk
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No person has this officer reference
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: person.looked-up
        resource: person
  /internal/v1/persons/{personId}/contacts:
    get:
      tags:
        - internal
      summary: Verified contacts of a person (notifications)
      description: Service tokens with scope directory:person-contacts (the notifications service only), acting for the tenant a message is sent for; audited. The email and phone verified at the latest onboarding, null where none. 404 when the person is unknown or not onboarded at that tenant.
      operationId: internalGetPersonContacts
      parameters:
        - name: X-Acting-Tenant
          in: header
          description: Tenant the calling service acts for; the resource must belong to it
          required: true
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: personId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Contacts, null where none is verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonContacts'
        '400':
          description: personId is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Requires a service token with scope directory:person-contacts
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No person has this id, or not one onboarded at the acting tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: person.contacts.read
        resource: person
  /v1/onboarding/applicants:
    post:
      tags:
        - onboarding
      summary: Start onboarding as a public applicant (national ID with IPRS check, or passport pending manual verification)
      operationId: startApplicantOnboarding
      x-draft: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identityDocument
                - names
                - phone
              properties:
                identityDocument:
                  type: object
                  required:
                    - kind
                    - number
                  properties:
                    kind:
                      type: string
                      enum:
                        - national-id
                        - passport
                    number:
                      type: string
                    country:
                      type: string
                names:
                  type: object
                  required:
                    - surname
                    - firstName
                  properties:
                    surname:
                      type: string
                    firstName:
                      type: string
                    otherNames:
                      type: string
                phone:
                  type: string
                email:
                  type: string
                  format: email
      responses:
        '201':
          description: Session created; phone OTP sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingSessionCreated'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '409':
          description: The identity document does not match IPRS, or belongs to an existing account
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OnboardingProblem'
        '429':
          $ref: '#/components/responses/RateLimited'
      security: []
  /v1/law-enforcement/agencies:
    get:
      tags:
        - law-enforcement
      summary: Registered law-enforcement agencies (reference data)
      operationId: listAgencies
      x-draft: true
      responses:
        '200':
          description: Agencies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agency'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/law-enforcement/agencies/{code}/officers:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - law-enforcement
      summary: Provisioned officer accounts for an agency (platform-admin)
      operationId: listAgencyOfficers
      x-draft: true
      responses:
        '200':
          description: Officers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaOfficerAccount'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - law-enforcement
      summary: Provision a law-enforcement officer account (platform-admin); one activation email
      operationId: provisionAgencyOfficer
      x-draft: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - phone
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
      responses:
        '201':
          description: Provisioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaOfficerAccount'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email belongs to an account in another tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/law-enforcement/officers/{officerId}/revoke:
    parameters:
      - name: officerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - law-enforcement
      summary: Disable a law-enforcement officer account (platform-admin)
      operationId: revokeAgencyOfficer
      x-draft: true
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaOfficerAccount'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    Principal:
      type: object
      properties:
        subject:
          type: string
          description: Keycloak user or service-account ID (`sub`)
        tenant:
          description: Responsible Commission (or `eacc` / `platform`) the caller acts for
          type:
            - string
            - 'null'
        roles:
          type: array
          items:
            type: string
          description: Realm roles from the token
        scopes:
          type: array
          items:
            type: string
          description: OAuth scopes granted to the token (`scope`), e.g. `messages` for service clients
        clientId:
          description: OAuth client that obtained the token (`azp`)
          type:
            - string
            - 'null'
        name:
          description: 'Display name: the `name` claim, else `preferred_username`'
          type:
            - string
            - 'null'
        issuedAt:
          description: When the token was issued (`iat`), in seconds since the epoch
          type:
            - integer
            - 'null'
        personId:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          description: Person the declarant account is linked to (`person_id`); null for staff
        acr:
          description: Authentication context class of the token (`acr`), e.g. `step-up`
          type:
            - string
            - 'null'
        authTime:
          description: When the user last authenticated (`auth_time`), in seconds since the epoch
          type:
            - integer
            - 'null'
        tokenId:
          description: The token id (`jti`)
          type:
            - string
            - 'null'
      required:
        - subject
        - tenant
        - roles
        - scopes
        - clientId
        - name
        - issuedAt
        - personId
        - acr
        - authTime
        - tokenId
    Slug:
      type: string
      pattern: ^[a-z][a-z0-9]{1,19}$
      description: Tenant key. Lowercase letter followed by lowercase letters or digits, 2-20 chars. Upper-cased it is the issuer code in reference numbers. `platform` and `new` are reserved.
      not:
        enum:
          - platform
          - new
      examples:
        - psc
        - tsc
        - cpsb047
        - naeth
    CommissionType:
      type: string
      enum:
        - hosted
        - federated
    OfficerCategoryCode:
      type: string
      enum:
        - act-s32-2
        - act-s32-3
        - act-s32-4
        - act-s32-5
        - act-s32-6
        - act-s32-7
        - act-s32-8
        - act-s32-9
        - act-s32-10
        - act-s32-11
        - act-s32-12
        - act-s32-13
        - act-s32-14
        - regs-r5-a
        - regs-r5-b
        - regs-r5-c
        - regs-r5-d
        - regs-r5-e
        - regs-r5-f
      description: One paragraph of Act s.32 or Regs r.5
    OfficerCategory:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/OfficerCategoryCode'
        citation:
          type: string
          examples:
            - Act s.32(10)
        description:
          type: string
          examples:
            - Registered teachers
      required:
        - code
        - citation
        - description
    CreateCommission:
      type: object
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        name:
          type: string
          minLength: 3
          maxLength: 120
          examples:
            - Teachers Service Commission
        type:
          $ref: '#/components/schemas/CommissionType'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/OfficerCategoryCode'
          uniqueItems: true
      required:
        - slug
        - name
        - type
        - categories
      additionalProperties: false
    AssignReportingOfficer:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          format: email
          maxLength: 254
          type: string
        phone:
          type: string
          pattern: ^\+[1-9][0-9]{6,14}$
          description: E.164
          examples:
            - '+254712345678'
      required:
        - name
        - email
        - phone
      additionalProperties: false
    ReportingOfficerState:
      type: string
      enum:
        - invited
        - activated
        - replaced
      description: "`invited` once assigned; `activated` when the officer's account first makes an authenticated request to the directory (in practice the console's `/v1/me` after their first sign-in); `replaced` when another officer takes over."
    ReportingOfficer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        state:
          $ref: '#/components/schemas/ReportingOfficerState'
        invitedAt:
          type: string
          format: date-time
        activatedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          description: First authenticated request of the officer's account; null until then
      required:
        - id
        - name
        - email
        - phone
        - state
        - invitedAt
        - activatedAt
    RosterSummary:
      type: object
      properties:
        status:
          type: string
          enum:
            - none
            - imported
          description: '`imported` once an import of the roster has completed'
        expectedDeclarants:
          type: integer
          description: Roster records not exited
        onboardedDeclarants:
          type: integer
        flagged:
          type: integer
          description: Records not exited flagged as absent from the latest complete import
        lastImportAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          description: When the latest completed import (complete or partial) finished
        lastImportId:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        lastCompleteImportAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          description: When the latest completed import declared as the complete roster finished
      required:
        - status
        - expectedDeclarants
        - onboardedDeclarants
        - flagged
        - lastImportAt
        - lastImportId
        - lastCompleteImportAt
    Commission:
      type: object
      properties:
        id:
          type: string
          format: uuid
