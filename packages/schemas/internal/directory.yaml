        '404':
          $ref: '#/components/responses/NotFound'
  /internal/v1/commissions/{slug}/roster/records/{recordId}:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - name: recordId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - internal
      summary: One roster record (services)
      operationId: internalGetRosterRecord
      x-draft: true
      responses:
        '200':
          description: The record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalRosterRecord'
        '404':
          $ref: '#/components/responses/NotFound'
  /internal/v1/persons/{personId}/contacts:
    parameters:
      - name: personId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - internal
      summary: Verified contacts of a person (notifications)
      operationId: internalGetPersonContacts
      x-draft: true
      responses:
        '200':
          description: Contacts, null where none is verified
          content:
            application/json:
              schema:
                type: object
                required:
                  - personId
                  - email
                  - phone
                properties:
                  personId:
                    type: string
                    format: uuid
                  email:
                    type:
                      - string
                      - 'null'
                  phone:
                    type:
                      - string
                      - 'null'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    Principal:
      type: object
      properties:
        subject:
          type: string
          description: Keycloak user or service-account ID (`sub`)
        tenant:
          description: Responsible Commission (or `eacc` / `platform`) the caller acts for
          type:
            - string
            - 'null'
        roles:
          type: array
          items:
            type: string
          description: Realm roles from the token
        scopes:
          type: array
          items:
            type: string
          description: OAuth scopes granted to the token (`scope`), e.g. `messages` for service clients
        clientId:
          description: OAuth client that obtained the token (`azp`)
          type:
            - string
            - 'null'
      required:
        - subject
        - tenant
        - roles
        - scopes
        - clientId
    Slug:
      type: string
      pattern: ^[a-z][a-z0-9]{1,19}$
      description: Tenant key. Lowercase letter followed by lowercase letters or digits, 2-20 chars. Upper-cased it is the issuer code in reference numbers. `platform` and `new` are reserved.
      not:
        enum:
          - platform
          - new
      examples:
        - psc
        - tsc
        - cpsb047
        - naeth
    CommissionType:
      type: string
      enum:
        - hosted
        - federated
    OfficerCategoryCode:
      type: string
      enum:
        - act-s32-2
        - act-s32-3
        - act-s32-4
        - act-s32-5
        - act-s32-6
        - act-s32-7
        - act-s32-8
        - act-s32-9
        - act-s32-10
        - act-s32-11
        - act-s32-12
        - act-s32-13
        - act-s32-14
        - regs-r5-a
        - regs-r5-b
        - regs-r5-c
        - regs-r5-d
        - regs-r5-e
        - regs-r5-f
      description: One paragraph of Act s.32 or Regs r.5
    OfficerCategory:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/OfficerCategoryCode'
        citation:
          type: string
          examples:
            - Act s.32(10)
        description:
          type: string
          examples:
            - Registered teachers
      required:
        - code
        - citation
        - description
    CreateCommission:
      type: object
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        name:
          type: string
          minLength: 3
          maxLength: 120
          examples:
            - Teachers Service Commission
        type:
          $ref: '#/components/schemas/CommissionType'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/OfficerCategoryCode'
          uniqueItems: true
      required:
        - slug
        - name
        - type
        - categories
      additionalProperties: false
    AssignReportingOfficer:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          format: email
          maxLength: 254
          type: string
        phone:
          type: string
          pattern: ^\+[1-9][0-9]{6,14}$
          description: E.164
          examples:
            - '+254712345678'
      required:
        - name
        - email
        - phone
      additionalProperties: false
    ReportingOfficerState:
      type: string
      enum:
        - invited
        - activated
        - replaced
      description: "`invited` once assigned; `activated` when the officer's account first makes an authenticated request to the directory (in practice the console's `/v1/me` after their first sign-in); `replaced` when another officer takes over."
    ReportingOfficer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        state:
          $ref: '#/components/schemas/ReportingOfficerState'
        invitedAt:
          type: string
          format: date-time
        activatedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          description: First authenticated request of the officer's account; null until then
      required:
        - id
        - name
        - email
        - phone
        - state
        - invitedAt
        - activatedAt
    RosterSummary:
      type: object
      properties:
        status:
          type: string
          enum:
            - none
            - imported
        expectedDeclarants:
          type: integer
        onboardedDeclarants:
          type: integer
        flagged:
          type: integer
        lastImportAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        lastImportId:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
      required:
        - status
        - expectedDeclarants
        - onboardedDeclarants
        - flagged
        - lastImportAt
        - lastImportId
    Commission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          $ref: '#/components/schemas/Slug'
        issuerCode:
          type: string
          description: slug upper-cased
          examples:
            - TSC
        name:
          type: string
        type:
          $ref: '#/components/schemas/CommissionType'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/OfficerCategory'
        status:
          type: string
          enum:
            - active
        policyVersion:
          type: integer
          description: Current policy version; 1 after provisioning
        reportingOfficer:
          anyOf:
            - $ref: '#/components/schemas/ReportingOfficer'
            - type: 'null'
          description: Current assignment (`invited` or `activated`); null when none
        roster:
          $ref: '#/components/schemas/RosterSummary'
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - slug
        - issuerCode
        - name
        - type
        - categories
        - status
        - policyVersion
        - reportingOfficer
        - roster
        - createdAt
    CommissionPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Commission'
        nextCursor:
          description: Pass as `cursor` for the next page; null on the last page
          type:
            - string
            - 'null'
        total:
          type: integer
          description: Commissions matching the filters across all pages
      required:
        - items
        - nextCursor
        - total
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          description: Field-level errors; `path` is the dotted request field
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - path
              - message
      required:
        - type
        - title
        - status
    ImportChannel:
      type: string
      enum:
        - file
        - api
    ImportState:
      type: string
      enum:
        - pending
        - processing
        - completed
        - failed
    ImportFailureCode:
      type: string
      enum:
        - missing-columns
        - upload-not-clean
        - parse-error
        - storage-error
        - internal
    RosterRecordState:
      type: string
      enum:
        - not_onboarded
        - onboarded
        - exited
    RosterRowInput:
      type: object
      description: One roster row as accepted from the template or an API batch (pre-normalisation)
      required:
        - personnelFileNumber
        - fullName
        - nationalId
      properties:
        personnelFileNumber:
          type: string
          minLength: 1
          maxLength: 30
          pattern: ^[A-Za-z0-9/.\-]+$
        fullName:
          type: string
          minLength: 2
          maxLength: 200
        nationalId:
          type: string
          description: Digits after stripping spaces, 5 to 10
          pattern: ^[0-9 ]{5,12}$
        designation:
          type:
            - string
            - 'null'
          maxLength: 100
        jobGroup:
          type:
            - string
            - 'null'
          maxLength: 10
        reportingEntity:
          type:
            - string
            - 'null'
          maxLength: 200
        appointmentDate:
          type:
            - string
            - 'null'
          description: ISO date preferred; DD/MM/YYYY and DD-MM-YYYY accepted
        email:
          type:
            - string
            - 'null'
          format: email
          maxLength: 254
        phone:
          type:
            - string
            - 'null'
          description: Local (07…, 01…) or international; normalised to E.164
          maxLength: 20
    StartFileImport:
      type: object
      required:
        - channel
        - uploadId
        - declaredComplete
      properties:
        channel:
          const: file
        uploadId:
          type: string
          format: uuid
          description: A clean upload with purpose roster-import (documents service)
        declaredComplete:
          type: boolean
          description: True when the file is the complete roster; absent officers get flagged
    StartBatchImport:
      type: object
      required:
        - channel
        - rows
      properties:
        channel:
          const: api
        rows:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/RosterRowInput'
    ColumnMapping:
      type: object
      required:
        - matched
        - ignored
        - missing
      properties:
        matched:
          type: array
          items:
            type: object
            required:
              - source
              - field
            properties:
              source:
                type: string
              field:
                type: string
        ignored:
          type: array
          items:
            type: string
        missing:
          type: array
          description: Optional template columns not present
          items:
            type: string
    ImportCounts:
      type: object
      required:
        - accepted
        - created
        - updated
        - unchanged
        - rejected
        - flaggedAbsent
      properties:
        accepted:
          type: integer
        created:
          type: integer
        updated:
          type: integer
        unchanged:
          type: integer
        rejected:
          type: integer
        flaggedAbsent:
          type: integer
    RosterImport:
      type: object
      required:
        - id
        - channel
        - declaredComplete
        - state
        - fileName
        - format
        - totalRows
        - processedRows
        - counts
        - mapping
        - failure
        - startedBy
        - startedAt
        - completedAt
      properties:
        id:
          type: string
          format: uuid
        channel:
          $ref: '#/components/schemas/ImportChannel'
        declaredComplete:
          type: boolean
        state:
          $ref: '#/components/schemas/ImportState'
        fileName:
          type:
            - string
            - 'null'
        format:
          type:
            - string
            - 'null'
          enum:
            - csv
            - xlsx
            - json
            - null
        totalRows:
          type:
            - integer
            - 'null'
          description: Null until staging finishes
        processedRows:
          type: integer
        counts:
          oneOf:
            - $ref: '#/components/schemas/ImportCounts'
            - type: 'null'
        mapping:
          oneOf:
            - $ref: '#/components/schemas/ColumnMapping'
            - type: 'null'
        failure:
          oneOf:
            - type: object
              required:
                - code
                - detail
              properties:
                code:
                  $ref: '#/components/schemas/ImportFailureCode'
                detail:
                  type: string
            - type: 'null'
        startedBy:
          type: object
          required:
            - kind
            - id
          properties:
            kind:
              type: string
              enum:
                - user
                - client
            id:
              type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type:
            - string
            - 'null'
          format: date-time
    RowError:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
        code:
          type: string
          enum:
            - required
            - format
            - too-long
            - future-date
            - duplicate-in-file
            - identity-locked
        message:
          type: string
    RosterImportRow:
      type: object
      required:
        - rowNumber
        - status
        - raw
        - errors
        - outcome
        - recordId
      properties:
        rowNumber:
          type: integer
        status:
          type: string
          enum:
            - accepted
            - rejected
        raw:
          type: object
          additionalProperties:
            type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/RowError'
        outcome:
          type:
            - string
            - 'null'
          enum:
            - created
            - updated
            - unchanged
            - null
        recordId:
          type:
            - string
            - 'null'
          format: uuid
    ReportingEntityRef:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    RosterRecordListItem:
      type: object
      required:
        - id
        - personnelFileNumber
        - fullName
        - nationalIdMasked
        - designation
        - jobGroup
        - reportingEntity
        - state
        - absentFromLatestImport
      properties:
        id:
          type: string
          format: uuid
        personnelFileNumber:
          type: string
        fullName:
          type: string
        nationalIdMasked:
          type: string
          description: All but the last three digits replaced, e.g. •••••123
        designation:
          type:
            - string
            - 'null'
        jobGroup:
          type:
            - string
            - 'null'
        reportingEntity:
          oneOf:
            - $ref: '#/components/schemas/ReportingEntityRef'
            - type: 'null'
        state:
          $ref: '#/components/schemas/RosterRecordState'
        absentFromLatestImport:
          type: boolean
    RosterRecord:
      allOf:
        - $ref: '#/components/schemas/RosterRecordListItem'
        - type: object
          required:
            - nationalId
            - appointmentDate
            - email
            - phone
            - exitDate
            - source
            - flaggedByImportId
            - firstSeenImportId
            - lastSeenImportId
            - imports
            - createdAt
            - updatedAt
          properties:
            nationalId:
              type: string
              description: Full value; reads are audited
            appointmentDate:
              type:
                - string
                - 'null'
              format: date
            email:
              type:
                - string
                - 'null'
            phone:
              type:
                - string
                - 'null'
            exitDate:
              type:
                - string
                - 'null'
              format: date
            source:
              $ref: '#/components/schemas/ImportChannel'
            flaggedByImportId:
              type:
                - string
                - 'null'
              format: uuid
            firstSeenImportId:
              type:
                - string
                - 'null'
              format: uuid
            lastSeenImportId:
              type:
                - string
                - 'null'
              format: uuid
            imports:
              type: array
              description: Imports that touched this record, newest first
              items:
                type: object
                required:
                  - importId
                  - startedAt
                  - outcome
                properties:
                  importId:
                    type: string
                    format: uuid
                  startedAt:
                    type: string
                    format: date-time
                  outcome:
                    type: string
                    enum:
                      - created
                      - updated
                      - unchanged
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    ConfirmExits:
      type: object
      required:
        - records
      properties:
        records:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            required:
              - recordId
            properties:
              recordId:
                type: string
                format: uuid
              exitDate:
                type: string
                format: date
                description: Overrides the batch exitDate for this record
        exitDate:
          type: string
          format: date
          description: Default exit date for records without their own; required unless every record has one
    ExitsResult:
      type: object
      required:
        - batchId
        - count
      properties:
        batchId:
          type: string
          format: uuid
        count:
          type: integer
    RosterApiCredential:
      type: object
      required:
        - clientId
        - createdAt
        - createdBy
        - rotatedAt
        - revokedAt
        - lastUsedAt
      properties:
        clientId:
          type: string
          examples:
            - roster-psc
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        rotatedAt:
          type:
            - string
            - 'null'
          format: date-time
        revokedAt:
          type:
            - string
            - 'null'
          format: date-time
        lastUsedAt:
          type:
            - string
            - 'null'
          format: date-time
    RosterApiCredentialWithSecret:
      allOf:
        - $ref: '#/components/schemas/RosterApiCredential'
        - type: object
          required:
            - secret
            - tokenEndpoint
            - scope
          properties:
            secret:
              type: string
              description: Shown once; the platform does not store it
            tokenEndpoint:
              type: string
              format: uri
            scope:
              const: roster:write
    Ofr:
      type: string
      description: Officer reference (ADR-011), permanent and person-level
      pattern: ^OFR-[0-9]{7}-[0-9A-Z]$
      examples:
        - OFR-0482913-L
    OtpChannel:
      type: string
      enum:
        - email
        - phone
    OnboardingCommission:
      type: object
      required:
        - slug
        - issuerCode
        - name
        - hasRoster
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        issuerCode:
          type: string
        name:
          type: string
        hasRoster:
          type: boolean
    IdentifyDeclarant:
      type: object
      required:
        - commission
        - personnelFileNumber
        - nationalId
      properties:
        commission:
          $ref: '#/components/schemas/Slug'
        personnelFileNumber:
          type: string
          minLength: 1
          maxLength: 30
        nationalId:
          type: string
          description: Digits after stripping spaces, 5 to 10
          pattern: ^[0-9 ]{5,12}$
    OnboardingState:
      type: string
      enum:
        - identified
        - email-contact-required
        - email-pending
        - email-verified
        - phone-contact-required
        - phone-pending
        - phone-verified
        - confirmed
        - identity-mismatch
        - expired
    MaskedContact:
      type: object
      required:
        - masked
        - source
        - verified
      properties:
        masked:
          type: string
          description: e.g. j***@moe.go.ke or 07** *** 123
        source:
          type: string
          enum:
            - roster
            - declarant
        verified:
          type: boolean
    OnboardingSession:
      type: object
      required:
        - id
        - state
        - commission
        - contacts
        - details
        - otp
        - expiresAt
      properties:
        id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/OnboardingState'
        commission:
          $ref: '#/components/schemas/OnboardingCommission'
        contacts:
          type: object
          required:
            - email
            - phone
          properties:
            email:
              oneOf:
                - $ref: '#/components/schemas/MaskedContact'
                - type: 'null'
            phone:
              oneOf:
                - $ref: '#/components/schemas/MaskedContact'
                - type: 'null'
        details:
          description: Roster details shown at the confirm step; null before phone-verified
          oneOf:
            - type: object
              required:
                - fullName
                - personnelFileNumber
                - designation
                - reportingEntity
              properties:
                fullName:
                  type: string
                personnelFileNumber:
                  type: string
                designation:
                  type:
                    - string
                    - 'null'
                reportingEntity:
                  type:
                    - string
                    - 'null'
            - type: 'null'
        otp:
          type: object
          description: Resend availability for the channel currently pending
          required:
            - channel
            - resendAvailableAt
            - resendsLeft
            - attemptsLeft
          properties:
            channel:
              oneOf:
                - $ref: '#/components/schemas/OtpChannel'
                - type: 'null'
            resendAvailableAt:
              type:
                - string
                - 'null'
              format: date-time
            resendsLeft:
              type: integer
            attemptsLeft:
              type: integer
        outcome:
          description: Set when state is confirmed
          oneOf:
            - $ref: '#/components/schemas/OnboardingOutcome'
            - type: 'null'
        ofr:
          oneOf:
            - $ref: '#/components/schemas/Ofr'
            - type: 'null'
        expiresAt:
          type: string
          format: date-time
    Agency:
      type: object
      required:
        - code
        - name
        - legalBasis
      properties:
        code:
          type: string
          examples:
            - DCI
            - ODPP
            - ARA
            - FRC
        name:
          type: string
        legalBasis:
          type: string
    LeaOfficerAccount:
      type: object
      required:
        - id
        - agencyCode
        - name
        - email
        - state
        - invitedAt
        - activatedAt
        - revokedAt
      properties:
        id:
          type: string
          format: uuid
        agencyCode:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        state:
          type: string
          enum:
            - invited
            - activated
            - revoked
        invitedAt:
          type: string
          format: date-time
        activatedAt:
          type:
            - string
            - 'null'
          format: date-time
        revokedAt:
          type:
            - string
            - 'null'
          format: date-time
    OnboardingSessionCreated:
      allOf:
        - $ref: '#/components/schemas/OnboardingSession'
        - type: object
          required:
            - secret
          properties:
            secret:
              type: string
              description: Returned once; the BFF stores it in an httpOnly cookie and sends it back in X-Onboarding-Secret
    OnboardingOutcome:
      type: string
      enum:
        - account-created
        - linked-existing-account
        - identity-mismatch
    OnboardingConfirmResult:
      type: object
      required:
        - outcome
        - session
      properties:
        outcome:
          $ref: '#/components/schemas/OnboardingOutcome'
        session:
          $ref: '#/components/schemas/OnboardingSession'
    OnboardingProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required:
            - code
          properties:
            code:
              type: string
              enum:
                - no-match
                - already-onboarded
                - no-roster
                - otp-invalid
                - otp-expired
                - resend-cooldown
                - session-expired
                - iprs-unavailable
                - identity-unavailable
                - rate-limited
            attemptsLeft:
              type: integer
            retryAfterSeconds:
              type: integer
            links:
              type: object
              description: Present for already-onboarded
              properties:
                signIn:
                  type: string
                  format: uri
                recoverAccess:
                  type: string
                  format: uri
    DeclarantProfile:
      type: object
      required:
        - personId
        - ofr
        - fullName
        - contacts
        - commissions
      properties:
        personId:
          type: string
          format: uuid
        ofr:
          $ref: '#/components/schemas/Ofr'
        fullName:
          type: string
        contacts:
          type: object
          required:
            - email
            - phone
          properties:
            email:
              type:
                - string
                - 'null'
            phone:
              type:
                - string
                - 'null'
        commissions:
          type: array
          items:
            type: object
            required:
              - slug
              - name
              - personnelFileNumber
              - rosterRecordId
              - state
              - onboardedAt
            properties:
              slug:
                $ref: '#/components/schemas/Slug'
              name:
                type: string
              personnelFileNumber:
                type: string
              rosterRecordId:
                type: string
                format: uuid
              state:
                $ref: '#/components/schemas/RosterRecordState'
              onboardedAt:
                type:
                  - string
                  - 'null'
                format: date-time
    PersonSummary:
      type: object
      required:
        - personId
        - ofr
        - fullName
        - commissions
        - createdAt
      properties:
        personId:
          type: string
          format: uuid
        ofr:
          $ref: '#/components/schemas/Ofr'
        fullName:
          type: string
        commissions:
          type: array
          items:
            $ref: '#/components/schemas/Slug'
        createdAt:
          type: string
          format: date-time
    TenantPolicyVersion:
      type: object
      required:
        - id
        - version
        - effectiveFrom
        - obligationsStartDate
        - initialDueAfterAppointmentDays
        - biennial
        - finalDueAfterExitDays
        - reminderOffsetsDays
        - clarification
        - formMDue
        - createdBy
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        effectiveFrom:
          type: string
          format: date-time
        obligationsStartDate:
          type: string
          format: date
          description: Initial-declaration obligations are created only for appointments on or after this date
        initialDueAfterAppointmentDays:
          type: integer
        biennial:
          type: object
          required:
            - statementDate
            - dueDate
          properties:
            statementDate:
              type: string
              description: Month-day, e.g. 11-01
            dueDate:
              type: string
              description: Month-day, e.g. 12-31
        finalDueAfterExitDays:
          type: integer
        reminderOffsetsDays:
          type: array
          items:
            type: integer
        clarification:
          type: object
          required:
            - issueWindowMonths
            - replyWindowDays
          properties:
            issueWindowMonths:
              type: integer
            replyWindowDays:
              type: integer
        formMDue:
          type: string
          description: Month-day, e.g. 07-31
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
    TenantPolicyHistory:
      type: object
      required:
        - current
        - previous
      properties:
        current:
          $ref: '#/components/schemas/TenantPolicyVersion'
        previous:
          type: array
          items:
            $ref: '#/components/schemas/TenantPolicyVersion'
    InternalRosterRecord:
      allOf:
        - $ref: '#/components/schemas/RosterRecord'
        - type: object
          required:
            - tenant
            - personId
            - ofr
            - onboardedAt
          properties:
            tenant:
              $ref: '#/components/schemas/Slug'
            personId:
              type:
                - string
                - 'null'
              format: uuid
            ofr:
              oneOf:
                - $ref: '#/components/schemas/Ofr'
                - type: 'null'
            onboardedAt:
              type:
                - string
                - 'null'
              format: date-time
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Slug'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID, unique per logical request; reuse on retry
      schema:
        type: string
        format: uuid
    ImportId:
      name: importId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OnboardingSecret:
      name: X-Onboarding-Secret
      in: header
      required: true
      description: Session secret returned once at creation; held by the portal BFF in an httpOnly cookie
      schema:
        type: string
    OtpChannelParam:
      name: channel
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OtpChannel'
  responses:
    RateLimited:
      description: Problem code `rate-limited`; RateLimit-* headers present
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/OnboardingProblem'
    SessionEnded:
      description: Problem code `session-expired`; the cookie is cleared
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/OnboardingProblem'
    NotFound:
      description: Not found, or not visible to the caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationProblem:
      description: Request failed validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Caller lacks the required role
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
security:
  - bearer: []
