# Generated by `pnpm --filter @adili/directory contracts`: do not edit.
# Implemented operations come from the directory service; operations marked `x-draft` come
# from packages/schemas/drafts/directory.yaml until they are implemented.
openapi: 3.1.0
info:
  title: directory API
  description: Tenants, organisation hierarchy, people, employments, rosters, delegations, category rules and reference numbering.
  version: '1'
servers:
  - url: /
    description: The service that serves this document
paths:
  /v1/me:
    get:
      tags:
        - me
      summary: The signed-in user, tenant and roles, as seen by the platform
      description: Any authenticated caller. Reads the verified access token; the BFFs use it to decide what a user may open.
      operationId: getMe
      responses:
        '200':
          description: Verified identity from the access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'
        '401':
          description: Missing, expired or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions:
    get:
      tags:
        - commissions
      summary: List Responsible Commissions
      description: platform-admin, eacc-analyst and eacc-supervisor see every Commission. Other staff see only their own tenant's Commission.
      operationId: listCommissions
      parameters:
        - name: search
          required: false
          in: query
          description: Case-insensitive match on name or slug; blank means no search
          schema:
            type: string
            maxLength: 100
        - name: type
          required: false
          in: query
          schema:
            type: string
            enum:
              - hosted
              - federated
        - name: reportingOfficer
          required: false
          in: query
          description: Filter by current reporting officer state; `none` means no assignment yet
          schema:
            type: string
            enum:
              - none
              - invited
              - activated
        - name: cursor
          required: false
          in: query
          description: '`nextCursor` of the previous page; omit for the first page'
          schema:
            type: string
            maxLength: 500
        - name: limit
          required: false
          in: query
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Page of Commissions ordered by name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionPage'
        '400':
          description: Query failed validation, or the cursor is unknown
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'Requires one of the roles: platform-admin, eacc-analyst, eacc-supervisor, reporting-officer, reviewer, supervisor, commission-admin, access-officer, auditor, helpdesk'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      tags:
        - commissions
      summary: Create a Responsible Commission and provision its workspace
      description: platform-admin only. Idempotent per Idempotency-Key.
      operationId: createCommission
      parameters:
        - name: Idempotency-Key
          in: header
          description: Client-generated UUID, unique per logical request; reuse on retry
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommission'
      responses:
        '201':
          description: Commission created with policy version 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commission'
        '400':
          description: Request failed validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'Requires one of the roles: platform-admin'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: 'Problem type `commission-exists`: the tenant key or name is taken; `errors[].path` names `slug` and/or `name`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}:
    get:
      tags:
        - commissions
      summary: One Commission with its reporting officer and roster summary
      description: platform-admin, eacc-analyst and eacc-supervisor read any Commission; other staff only their own tenant's. Answers 404 for Commissions the caller may not see.
      operationId: getCommission
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            $ref: '#/components/schemas/Slug'
      responses:
        '200':
          description: The Commission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commission'
        '403':
          description: 'Requires one of the roles: platform-admin, eacc-analyst, eacc-supervisor, reporting-officer, reviewer, supervisor, commission-admin, access-officer, auditor, helpdesk'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/reporting-officer:
    put:
      tags:
        - commissions
      summary: Assign or replace the Commission's reporting officer
      description: 'platform-admin only. Creates (or reuses, same tenant) the Keycloak staff account with the name and phone as entered, grants the reporting-officer role (enabling the account if it was disabled) and, once the assignment is recorded, sends exactly one activation email. If a current (not replaced) assignment exists it is marked `replaced` with `replacedBy` set to the new assignment, and the previous account loses the reporting-officer role (and is disabled when it holds no other role). Assigning the current officer again corrects their name and phone in place: an activated officer stays activated and gets no email; an invited one gets their activation email again. Idempotent per Idempotency-Key.'
      operationId: assignReportingOfficer
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            $ref: '#/components/schemas/Slug'
        - name: Idempotency-Key
          in: header
          description: Client-generated UUID, unique per logical request; reuse on retry
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignReportingOfficer'
      responses:
        '200':
          description: Commission with the new assignment in state `invited`, or with the current one corrected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commission'
        '400':
          description: Request failed validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'Requires one of the roles: platform-admin'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Commission not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: "Problem type `email-belongs-to-other-tenant` with `errors[0].path = email`: the email belongs to an account in another tenant (or in none). Problem type `reporting-officer-busy`: another change to this Commission's reporting officer is still in progress; try again shortly. Either way nothing changed and the current officer keeps access."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: 'Problem type `identity-unavailable`: the identity provider failed, nothing was assigned and identity changes already made were undone, so the current officer keeps access. Problem type `invitation-not-sent`: the officer was assigned but the activation email was not sent; resend the invitation. Both are safe to retry with the same Idempotency-Key.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/reporting-officer/resend-invitation:
    post:
      tags:
        - commissions
      summary: Send the activation email again
      description: 'platform-admin only. Allowed while the current assignment is `invited`; Keycloak sends a new activation link valid for 72 hours. No Idempotency-Key: a repeated request only sends another email.'
      operationId: resendReportingOfficerInvitation
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            $ref: '#/components/schemas/Slug'
      responses:
        '202':
          description: Email requested
        '403':
          description: 'Requires one of the roles: platform-admin'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: 'Commission not found, or problem type `reporting-officer-not-assigned`: it has no reporting officer.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: "Problem type `reporting-officer-activated`: the officer has already activated, so there is nothing to resend. Problem type `reporting-officer-account-missing`: the officer's account no longer exists in the identity provider; replace the officer."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: 'Problem type `identity-unavailable`: the identity provider failed, no email was sent. Safe to retry.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/reference/officer-categories:
    get:
      tags:
        - reference
      summary: Statutory categories of public officers (Act s.32, Regs r.5)
      description: Any staff role. Reference data for the create form, in statutory order.
      operationId: listOfficerCategories
      responses:
        '200':
          description: Seeded list, stable order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OfficerCategory'
        '403':
          description: 'Requires one of the roles: platform-admin, eacc-analyst, eacc-supervisor, reporting-officer, reviewer, supervisor, commission-admin, access-officer, auditor, helpdesk'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/roster/template:
    get:
      tags:
        - roster
      summary: Roster template with column notes and a sample row
      operationId: getRosterTemplate
      x-draft: true
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum:
              - csv
              - xlsx
      responses:
        '200':
          description: The template file
          content:
            text/csv:
              schema:
                type: string
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/commissions/{slug}/roster/summary:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags:
        - roster
      summary: Expected, onboarded and flagged counts and the last import
      operationId: getRosterSummary
      x-draft: true
      responses:
        '200':
          description: The summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterSummary'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/commissions/{slug}/roster/imports:
    parameters:
      - $ref: '#/components/parameters/Slug'
    post:
      tags:
        - roster
      summary: Start an import from a clean upload or an inline batch
      description: |
        reporting-officer of the tenant (file or batch) or a roster:write client of the tenant
        (batch only). At most one import may be processing per tenant. Returns 202; poll the
        import resource for progress and the report. Idempotent per Idempotency-Key.
      operationId: startRosterImport
      x-draft: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/StartFileImport'
                - $ref: '#/components/schemas/StartBatchImport'
      responses:
        '202':
          description: Import accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterImport'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Another import is processing, or the upload is not clean
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Rate limit exceeded (RateLimit-* headers present)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    get:
      tags:
        - roster
      summary: Import history, newest first
      operationId: listRosterImports
      x-draft: true
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Page of imports
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - nextCursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RosterImport'
                  nextCursor:
                    type:
                      - string
                      - 'null'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/commissions/{slug}/roster/imports/{importId}:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/ImportId'
    get:
      tags:
        - roster
      summary: One import with progress, mapping and counts
      operationId: getRosterImport
      x-draft: true
      responses:
        '200':
          description: The import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterImport'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/commissions/{slug}/roster/imports/{importId}/rows:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/ImportId'
    get:
      tags:
        - roster
      summary: Staged rows of an import, filterable by status
      operationId: listRosterImportRows
      x-draft: true
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - accepted
              - rejected
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Page of rows in row-number order
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - nextCursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RosterImportRow'
                  nextCursor:
                    type:
                      - string
                      - 'null'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/commissions/{slug}/roster/imports/{importId}/report.csv:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/ImportId'
    get:
      tags:
        - roster
      summary: Rejected rows as CSV with reason columns appended
      operationId: getRosterImportReportCsv
      x-draft: true
      responses:
        '200':
          description: CSV stream
          content:
            text/csv:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/commissions/{slug}/roster/records:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags:
        - roster
      summary: Roster records with masked national IDs
      operationId: listRosterRecords
      x-draft: true
      parameters:
        - name: search
          in: query
          description: File number prefix, name fragment, or a full national ID
          schema:
            type: string
            maxLength: 200
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/RosterRecordState'
        - name: flagged
          in: query
          schema:
            type: boolean
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Page of records ordered by full name
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - nextCursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RosterRecordListItem'
                  nextCursor:
                    type:
                      - string
                      - 'null'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/commissions/{slug}/roster/records/{recordId}:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - name: recordId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - roster
      summary: One roster record in full, with its import history
      operationId: getRosterRecord
      x-draft: true
      responses:
        '200':
          description: The record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterRecord'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/commissions/{slug}/roster/exits:
    parameters:
      - $ref: '#/components/parameters/Slug'
    post:
      tags:
        - roster
      summary: Confirm exits for flagged (or any non-exited) records
      operationId: confirmRosterExits
      x-draft: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmExits'
      responses:
        '200':
          description: Records now exited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExitsResult'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/commissions/{slug}/roster/records/{fileNumber}/exit:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - name: fileNumber
        in: path
        required: true
        description: Personnel file number (HR systems address records by it)
        schema:
          type: string
          maxLength: 30
    post:
      tags:
        - roster
      summary: Record one officer's exit by personnel file number (HR systems)
      operationId: recordRosterExit
      x-draft: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - exitDate
              properties:
                exitDate:
                  type: string
                  format: date
      responses:
        '200':
          description: The exited record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterRecord'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already exited
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/roster/keep:
    parameters:
      - $ref: '#/components/parameters/Slug'
    post:
      tags:
        - roster
      summary: 'Clear the absent flag: these officers are still employed'
      operationId: keepRosterRecords
      x-draft: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - recordIds
              properties:
                recordIds:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Count of records updated
          content:
            application/json:
              schema:
                type: object
                required:
                  - count
                properties:
                  count:
                    type: integer
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/commissions/{slug}/roster/api-credential:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags:
        - roster
      summary: Metadata of the Commission's HR-system credential (never the secret)
      operationId: getRosterApiCredential
      x-draft: true
      responses:
        '200':
          description: Metadata, or null when none was created
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RosterApiCredential'
                  - type: 'null'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - roster
      summary: Create the credential; the secret is returned once
      operationId: createRosterApiCredential
      x-draft: true
      responses:
        '201':
          description: Credential with secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterApiCredentialWithSecret'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A credential already exists; rotate or revoke it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags:
        - roster
      summary: Revoke the credential; the HR system loses access immediately
      operationId: revokeRosterApiCredential
      x-draft: true
      responses:
        '204':
          description: Revoked
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/commissions/{slug}/roster/api-credential/rotate:
    parameters:
      - $ref: '#/components/parameters/Slug'
    post:
      tags:
        - roster
      summary: Issue a new secret; the previous one stops working immediately
      operationId: rotateRosterApiCredential
      x-draft: true
      responses:
        '200':
          description: Credential with the new secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterApiCredentialWithSecret'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/onboarding/commissions:
    get:
      tags:
        - onboarding
      summary: Active Responsible Commissions a declarant can choose from
      operationId: listOnboardingCommissions
      x-draft: true
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Commissions with roster availability
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OnboardingCommission'
        '400':
          $ref: '#/components/responses/ValidationProblem'
      security: []
  /v1/onboarding/sessions:
    post:
      tags:
        - onboarding
      summary: Match personnel file number and national ID against a Commission's roster
      description: |
        Public, rate-limited per IP and per IP + Commission. Every non-match cause returns the
        same `no-match` problem. On success the response carries the session and, once only,
        the session secret the BFF stores in an httpOnly cookie.
      operationId: identifyDeclarant
      x-draft: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifyDeclarant'
      responses:
        '201':
          description: Session created; first OTP sent or a contact is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingSessionCreated'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          description: Problem code `no-match`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OnboardingProblem'
        '409':
          description: Problem code `already-onboarded` or `no-roster`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OnboardingProblem'
        '429':
          $ref: '#/components/responses/RateLimited'
      security: []
  /v1/onboarding/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/OnboardingSecret'
    get:
      tags:
        - onboarding
      summary: Current step, masked contacts and roster details to confirm
      operationId: getOnboardingSession
      x-draft: true
      responses:
        '200':
          description: The session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingSession'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/SessionEnded'
      security: []
  /v1/onboarding/sessions/{sessionId}/contacts:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/OnboardingSecret'
    post:
      tags:
        - onboarding
      summary: Supply an email or phone when the roster record has none
      operationId: provideOnboardingContact
      x-draft: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - channel
                - value
              properties:
                channel:
                  $ref: '#/components/schemas/OtpChannel'
                value:
                  type: string
                  maxLength: 254
      responses:
        '200':
          description: Contact accepted and OTP sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingSession'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Session is not waiting for this contact
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OnboardingProblem'
        '410':
          $ref: '#/components/responses/SessionEnded'
      security: []
  /v1/onboarding/sessions/{sessionId}/otp/{channel}/verify:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/OnboardingSecret'
      - $ref: '#/components/parameters/OtpChannelParam'
    post:
      tags:
        - onboarding
      summary: Verify the 6-digit code for a channel
      operationId: verifyOnboardingOtp
      x-draft: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  pattern: ^[0-9]{6}$
      responses:
        '200':
          description: Verified; session advanced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingSession'
        '400':
          description: Problem code `otp-invalid` (with `attemptsLeft`) or `otp-expired`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OnboardingProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Session is not waiting for this channel
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OnboardingProblem'
        '410':
          $ref: '#/components/responses/SessionEnded'
      security: []
  /v1/onboarding/sessions/{sessionId}/otp/{channel}/resend:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/OnboardingSecret'
      - $ref: '#/components/parameters/OtpChannelParam'
    post:
      tags:
        - onboarding
      summary: Send a new code (60-second cooldown, at most 3 per channel)
      operationId: resendOnboardingOtp
      x-draft: true
      responses:
        '202':
          description: New code sent
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Session is not waiting for this channel
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OnboardingProblem'
        '410':
          $ref: '#/components/responses/SessionEnded'
        '429':
          description: Problem code `resend-cooldown` with `retryAfterSeconds`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OnboardingProblem'
      security: []
  /v1/onboarding/sessions/{sessionId}/confirm:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/OnboardingSecret'
    post:
      tags:
        - onboarding
      summary: Confirm roster details, run the IPRS check and create or link the account
      operationId: confirmOnboarding
      x-draft: true
      responses:
        '200':
          description: Outcome of the confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingConfirmResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Session is not at the confirm step
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OnboardingProblem'
        '410':
          $ref: '#/components/responses/SessionEnded'
        '502':
          description: 'Problem code `identity-unavailable`: account could not be created; nothing changed'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OnboardingProblem'
        '503':
          description: 'Problem code `iprs-unavailable`: try again later; session unchanged'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OnboardingProblem'
      security: []
  /v1/onboarding/sessions/{sessionId}/resend-password-email:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/OnboardingSecret'
    post:
      tags:
        - onboarding
      summary: Send the Keycloak set-password email again
      operationId: resendSetPasswordEmail
      x-draft: true
      responses:
        '202':
          description: Email requested
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Session is not in the confirmed state with a new account
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OnboardingProblem'
        '429':
          description: Problem code `resend-cooldown`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OnboardingProblem'
      security: []
  /v1/onboarding/applicants:
    post:
      tags:
        - onboarding
      summary: Start onboarding as a public applicant (national ID with IPRS check, or passport pending manual verification)
      operationId: startApplicantOnboarding
      x-draft: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identityDocument
                - names
                - phone
              properties:
                identityDocument:
                  type: object
                  required:
                    - kind
                    - number
                  properties:
                    kind:
                      type: string
                      enum:
                        - national-id
                        - passport
                    number:
                      type: string
                    country:
                      type: string
                names:
                  type: object
                  required:
                    - surname
                    - firstName
                  properties:
                    surname:
                      type: string
                    firstName:
                      type: string
                    otherNames:
                      type: string
                phone:
                  type: string
                email:
                  type: string
                  format: email
      responses:
        '201':
          description: Session created; phone OTP sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingSessionCreated'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '409':
          description: Problem code `identity-mismatch` (IPRS) or `already-registered`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OnboardingProblem'
        '429':
          $ref: '#/components/responses/RateLimited'
      security: []
  /v1/law-enforcement/agencies:
    get:
      tags:
