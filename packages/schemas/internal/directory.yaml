  /v1/law-enforcement/officers/{officerId}/revoke:
    parameters:
      - name: officerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - law-enforcement
      summary: Disable a law-enforcement officer account (platform-admin)
      operationId: revokeAgencyOfficer
      x-draft: true
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaOfficerAccount'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/me/declarant:
    get:
      tags:
        - onboarding
      summary: The signed-in declarant's person, OFR, Commissions and verified contacts
      operationId: getMyDeclarantProfile
