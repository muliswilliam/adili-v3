openapi: 3.1.0
info:
  title: directory API - Commission provisioning (draft)
  version: '1'
  description: |
    Draft contract for specs 01 (Commissions) and 02 (roster). The directory service's Swagger document becomes the
    source of truth once implemented and is exported to packages/schemas/internal;
    this file is what the backend converges to and what the console builds against.
servers:
  - url: http://localhost:4001
security:
  - bearer: []
tags:
  - name: commissions
  - name: reference
  - name: roster
paths:
  /v1/commissions:
    post:
      tags: [commissions]
      operationId: createCommission
      summary: Create a Responsible Commission and provision its workspace
      description: platform-admin only. Idempotent per Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommission'
      responses:
        '201':
          description: Commission created with policy version 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commission'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Tenant key or name already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    get:
      tags: [commissions]
      operationId: listCommissions
      summary: List Responsible Commissions
      description: |
        platform-admin, eacc-analyst and eacc-supervisor see every Commission.
        Other staff see only their own tenant's Commission.
      parameters:
        - name: search
          in: query
          description: Case-insensitive match on name or slug
          schema:
            type: string
            maxLength: 100
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/CommissionType'
        - name: reportingOfficer
          in: query
          description: Filter by current reporting officer state; `none` means no assignment yet
          schema:
            type: string
            enum: [none, invited, activated]
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Page of Commissions ordered by name
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Commission'
                  nextCursor:
                    type: [string, 'null']
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/commissions/{slug}:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [commissions]
      operationId: getCommission
      summary: One Commission with its reporting officer and roster summary
      responses:
        '200':
          description: The Commission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commission'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/reporting-officer:
    parameters:
      - $ref: '#/components/parameters/Slug'
    put:
      tags: [commissions]
      operationId: assignReportingOfficer
      summary: Assign or replace the Commission's reporting officer
      description: |
        platform-admin only. Creates (or reuses, same tenant) the Keycloak staff account,
        grants the reporting-officer role and sends exactly one activation email.
        If an active assignment exists it is marked replaced and the previous account is
        disabled. Idempotent per Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignReportingOfficer'
      responses:
        '200':
          description: Commission with the new assignment in state `invited`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commission'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Commission not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: The email belongs to an account in another tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/reporting-officer/resend-invitation:
    parameters:
      - $ref: '#/components/parameters/Slug'
    post:
      tags: [commissions]
      operationId: resendReportingOfficerInvitation
      summary: Send the activation email again
      description: platform-admin only. Allowed while the assignment is `invited`.
      responses:
        '202':
          description: Email requested
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Commission not found or no assignment
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Assignment is not in state `invited`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/reference/officer-categories:
    get:
      tags: [reference]
      operationId: listOfficerCategories
      summary: Statutory categories of public officers (Act s.32, Regs r.5)
      responses:
        '200':
          description: Seeded list, stable order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OfficerCategory'
  /v1/roster/template:
    get:
      tags: [roster]
      operationId: getRosterTemplate
      summary: Roster template with column notes and a sample row
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [csv, xlsx]
      responses:
        '200':
          description: The template file
          content:
            text/csv:
              schema:
                type: string
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/commissions/{slug}/roster/summary:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [roster]
      operationId: getRosterSummary
      summary: Expected, onboarded and flagged counts and the last import
      responses:
        '200':
          description: The summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterSummary'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/commissions/{slug}/roster/imports:
    parameters:
      - $ref: '#/components/parameters/Slug'
    post:
      tags: [roster]
      operationId: startRosterImport
      summary: Start an import from a clean upload or an inline batch
      description: |
        reporting-officer of the tenant (file or batch) or a roster:write client of the tenant
        (batch only). At most one import may be processing per tenant. Returns 202; poll the
        import resource for progress and the report. Idempotent per Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/StartFileImport'
                - $ref: '#/components/schemas/StartBatchImport'
      responses:
        '202':
          description: Import accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterImport'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Another import is processing, or the upload is not clean
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Rate limit exceeded (RateLimit-* headers present)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    get:
      tags: [roster]
      operationId: listRosterImports
      summary: Import history, newest first
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Page of imports
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RosterImport'
                  nextCursor:
                    type: [string, 'null']
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/commissions/{slug}/roster/imports/{importId}:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/ImportId'
    get:
      tags: [roster]
      operationId: getRosterImport
      summary: One import with progress, mapping and counts
      responses:
        '200':
          description: The import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterImport'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/commissions/{slug}/roster/imports/{importId}/rows:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/ImportId'
    get:
      tags: [roster]
      operationId: listRosterImportRows
      summary: Staged rows of an import, filterable by status
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [accepted, rejected]
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Page of rows in row-number order
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RosterImportRow'
                  nextCursor:
                    type: [string, 'null']
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/commissions/{slug}/roster/imports/{importId}/report.csv:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/ImportId'
    get:
      tags: [roster]
      operationId: getRosterImportReportCsv
      summary: Rejected rows as CSV with reason columns appended
      responses:
        '200':
          description: CSV stream
          content:
            text/csv:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/commissions/{slug}/roster/records:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [roster]
      operationId: listRosterRecords
      summary: Roster records with masked national IDs
      parameters:
        - name: search
          in: query
          description: File number prefix, name fragment, or a full national ID
          schema:
            type: string
            maxLength: 200
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/RosterRecordState'
        - name: flagged
          in: query
          schema:
            type: boolean
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Page of records ordered by full name
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RosterRecordListItem'
                  nextCursor:
                    type: [string, 'null']
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/commissions/{slug}/roster/records/{recordId}:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - name: recordId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [roster]
      operationId: getRosterRecord
      summary: One roster record in full, with its import history
      responses:
        '200':
          description: The record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterRecord'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/commissions/{slug}/roster/exits:
    parameters:
      - $ref: '#/components/parameters/Slug'
    post:
      tags: [roster]
      operationId: confirmRosterExits
      summary: Confirm exits for flagged (or any non-exited) records
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmExits'
      responses:
        '200':
          description: Records now exited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExitsResult'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/commissions/{slug}/roster/records/{fileNumber}/exit:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - name: fileNumber
        in: path
        required: true
        description: Personnel file number (HR systems address records by it)
        schema:
          type: string
          maxLength: 30
    post:
      tags: [roster]
      operationId: recordRosterExit
      summary: Record one officer's exit by personnel file number (HR systems)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exitDate]
              properties:
                exitDate:
                  type: string
                  format: date
      responses:
        '200':
          description: The exited record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterRecord'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already exited
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/roster/keep:
    parameters:
      - $ref: '#/components/parameters/Slug'
    post:
      tags: [roster]
      operationId: keepRosterRecords
      summary: 'Clear the absent flag: these officers are still employed'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recordIds]
              properties:
                recordIds:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Count of records updated
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count:
                    type: integer
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/commissions/{slug}/roster/api-credential:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [roster]
      operationId: getRosterApiCredential
      summary: Metadata of the Commission's HR-system credential (never the secret)
      responses:
        '200':
          description: Metadata, or null when none was created
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RosterApiCredential'
                  - type: 'null'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [roster]
      operationId: createRosterApiCredential
      summary: Create the credential; the secret is returned once
      responses:
        '201':
          description: Credential with secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterApiCredentialWithSecret'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A credential already exists; rotate or revoke it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags: [roster]
      operationId: revokeRosterApiCredential
      summary: Revoke the credential; the HR system loses access immediately
      responses:
        '204':
          description: Revoked
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/commissions/{slug}/roster/api-credential/rotate:
    parameters:
      - $ref: '#/components/parameters/Slug'
    post:
      tags: [roster]
      operationId: rotateRosterApiCredential
      summary: Issue a new secret; the previous one stops working immediately
      responses:
        '200':
          description: Credential with the new secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterApiCredentialWithSecret'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Slug'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID, unique per logical request; reuse on retry
      schema:
        type: string
        format: uuid
    ImportId:
      name: importId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    NotFound:
      description: Not found, or not visible to the caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationProblem:
      description: Request failed validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Caller lacks the required role
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    Slug:
      type: string
      description: |
        Tenant key. Lowercase letter followed by lowercase letters or digits, 2-20 chars.
        Upper-cased it is the issuer code in reference numbers. `platform` is reserved.
      pattern: '^[a-z][a-z0-9]{1,19}$'
      examples: [psc, tsc, cpsb047, naeth]
    CommissionType:
      type: string
      enum: [hosted, federated]
    OfficerCategoryCode:
      type: string
      description: One paragraph of Act s.32 or Regs r.5
      enum:
        - act-s32-2
        - act-s32-3
        - act-s32-4
        - act-s32-5
        - act-s32-6
        - act-s32-7
        - act-s32-8
        - act-s32-9
        - act-s32-10
        - act-s32-11
        - act-s32-12
        - act-s32-13
        - act-s32-14
        - regs-r5-a
        - regs-r5-b
        - regs-r5-c
        - regs-r5-d
        - regs-r5-e
        - regs-r5-f
    OfficerCategory:
      type: object
      required: [code, citation, description]
      properties:
        code:
          $ref: '#/components/schemas/OfficerCategoryCode'
        citation:
          type: string
          examples: ['Act s.32(10)']
        description:
          type: string
          examples: ['Registered teachers']
    CreateCommission:
      type: object
      required: [slug, name, type, categories]
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        name:
          type: string
          minLength: 3
          maxLength: 120
          examples: ['Teachers Service Commission']
        type:
          $ref: '#/components/schemas/CommissionType'
        categories:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/OfficerCategoryCode'
    AssignReportingOfficer:
      type: object
      required: [name, email, phone]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          description: E.164
          pattern: '^\+[1-9][0-9]{6,14}$'
          examples: ['+254712345678']
    ReportingOfficerState:
      type: string
      enum: [invited, activated, replaced]
    ReportingOfficer:
      type: object
      required: [id, name, email, phone, state, invitedAt, activatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        state:
          $ref: '#/components/schemas/ReportingOfficerState'
        invitedAt:
          type: string
          format: date-time
        activatedAt:
          type: [string, 'null']
          format: date-time
    Commission:
      type: object
      required:
        - id
        - slug
        - issuerCode
        - name
        - type
        - categories
        - status
        - policyVersion
        - reportingOfficer
        - roster
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        slug:
          $ref: '#/components/schemas/Slug'
        issuerCode:
          type: string
          description: slug upper-cased
          examples: [TSC]
        name:
          type: string
        type:
          $ref: '#/components/schemas/CommissionType'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/OfficerCategory'
        status:
          type: string
          enum: [active]
        policyVersion:
          type: integer
          description: Current policy version; 1 after provisioning
        reportingOfficer:
          oneOf:
            - $ref: '#/components/schemas/ReportingOfficer'
            - type: 'null'
          description: Current assignment (`invited` or `activated`); null when none
        roster:
          $ref: '#/components/schemas/RosterSummary'
        createdAt:
          type: string
          format: date-time
    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path:
                type: string
              message:
                type: string
    ImportChannel:
      type: string
      enum: [file, api]
    ImportState:
      type: string
      enum: [pending, processing, completed, failed]
    ImportFailureCode:
      type: string
      enum: [missing-columns, upload-not-clean, parse-error, storage-error, internal]
    RosterRecordState:
      type: string
      enum: [not_onboarded, onboarded, exited]
    RosterRowInput:
      type: object
      description: One roster row as accepted from the template or an API batch (pre-normalisation)
      required: [personnelFileNumber, fullName, nationalId]
      properties:
        personnelFileNumber:
          type: string
          minLength: 1
          maxLength: 30
          pattern: '^[A-Za-z0-9/.\-]+$'
        fullName:
          type: string
          minLength: 2
          maxLength: 200
        nationalId:
          type: string
          description: Digits after stripping spaces, 5 to 10
          pattern: '^[0-9 ]{5,12}$'
        designation:
          type: [string, 'null']
          maxLength: 100
        jobGroup:
          type: [string, 'null']
          maxLength: 10
        reportingEntity:
          type: [string, 'null']
          maxLength: 200
        appointmentDate:
          type: [string, 'null']
          description: ISO date preferred; DD/MM/YYYY and DD-MM-YYYY accepted
        email:
          type: [string, 'null']
          format: email
          maxLength: 254
        phone:
          type: [string, 'null']
          description: Local (07…, 01…) or international; normalised to E.164
          maxLength: 20
    StartFileImport:
      type: object
      required: [channel, uploadId, declaredComplete]
      properties:
        channel:
          const: file
        uploadId:
          type: string
          format: uuid
          description: A clean upload with purpose roster-import (documents service)
        declaredComplete:
          type: boolean
          description: True when the file is the complete roster; absent officers get flagged
    StartBatchImport:
      type: object
      required: [channel, rows]
      properties:
        channel:
          const: api
        rows:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/RosterRowInput'
    ColumnMapping:
      type: object
      required: [matched, ignored, missing]
      properties:
        matched:
          type: array
          items:
            type: object
            required: [source, field]
            properties:
              source:
                type: string
              field:
                type: string
        ignored:
          type: array
          items:
            type: string
        missing:
          type: array
          description: Optional template columns not present
          items:
            type: string
    ImportCounts:
      type: object
      required: [accepted, created, updated, unchanged, rejected, flaggedAbsent]
      properties:
        accepted:
          type: integer
        created:
          type: integer
        updated:
          type: integer
        unchanged:
          type: integer
        rejected:
          type: integer
        flaggedAbsent:
          type: integer
    RosterImport:
      type: object
      required:
        - id
        - channel
        - declaredComplete
        - state
        - fileName
        - format
        - totalRows
        - processedRows
        - counts
        - mapping
        - failure
        - startedBy
        - startedAt
        - completedAt
      properties:
        id:
          type: string
          format: uuid
        channel:
          $ref: '#/components/schemas/ImportChannel'
        declaredComplete:
          type: boolean
        state:
          $ref: '#/components/schemas/ImportState'
        fileName:
          type: [string, 'null']
        format:
          type: [string, 'null']
          enum: [csv, xlsx, json, null]
        totalRows:
          type: [integer, 'null']
          description: Null until staging finishes
        processedRows:
          type: integer
        counts:
          oneOf:
            - $ref: '#/components/schemas/ImportCounts'
            - type: 'null'
        mapping:
          oneOf:
            - $ref: '#/components/schemas/ColumnMapping'
            - type: 'null'
        failure:
          oneOf:
            - type: object
              required: [code, detail]
              properties:
                code:
                  $ref: '#/components/schemas/ImportFailureCode'
                detail:
                  type: string
            - type: 'null'
        startedBy:
          type: object
          required: [kind, id]
          properties:
            kind:
              type: string
              enum: [user, client]
            id:
              type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
    RowError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
          enum: [required, format, too-long, future-date, duplicate-in-file, identity-locked]
        message:
          type: string
    RosterImportRow:
      type: object
      required: [rowNumber, status, raw, errors, outcome, recordId]
      properties:
        rowNumber:
          type: integer
        status:
          type: string
          enum: [accepted, rejected]
        raw:
          type: object
          additionalProperties:
            type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/RowError'
        outcome:
          type: [string, 'null']
          enum: [created, updated, unchanged, null]
        recordId:
          type: [string, 'null']
          format: uuid
    ReportingEntityRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    RosterRecordListItem:
      type: object
      required:
        - id
        - personnelFileNumber
        - fullName
        - nationalIdMasked
        - designation
        - jobGroup
        - reportingEntity
        - state
        - absentFromLatestImport
      properties:
        id:
          type: string
          format: uuid
        personnelFileNumber:
          type: string
        fullName:
          type: string
        nationalIdMasked:
          type: string
          description: All but the last three digits replaced, e.g. •••••123
        designation:
          type: [string, 'null']
        jobGroup:
          type: [string, 'null']
        reportingEntity:
          oneOf:
            - $ref: '#/components/schemas/ReportingEntityRef'
            - type: 'null'
        state:
          $ref: '#/components/schemas/RosterRecordState'
        absentFromLatestImport:
          type: boolean
    RosterRecord:
      allOf:
        - $ref: '#/components/schemas/RosterRecordListItem'
        - type: object
          required:
            - nationalId
            - appointmentDate
            - email
            - phone
            - exitDate
            - source
            - flaggedByImportId
            - firstSeenImportId
            - lastSeenImportId
            - imports
            - createdAt
            - updatedAt
          properties:
            nationalId:
              type: string
              description: Full value; reads are audited
            appointmentDate:
              type: [string, 'null']
              format: date
            email:
              type: [string, 'null']
            phone:
              type: [string, 'null']
            exitDate:
              type: [string, 'null']
              format: date
            source:
              $ref: '#/components/schemas/ImportChannel'
            flaggedByImportId:
              type: [string, 'null']
              format: uuid
            firstSeenImportId:
              type: [string, 'null']
              format: uuid
            lastSeenImportId:
              type: [string, 'null']
              format: uuid
            imports:
              type: array
              description: Imports that touched this record, newest first
              items:
                type: object
                required: [importId, startedAt, outcome]
                properties:
                  importId:
                    type: string
                    format: uuid
                  startedAt:
                    type: string
                    format: date-time
                  outcome:
                    type: string
                    enum: [created, updated, unchanged]
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    ConfirmExits:
      type: object
      required: [records]
      properties:
        records:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            required: [recordId]
            properties:
              recordId:
                type: string
                format: uuid
              exitDate:
                type: string
                format: date
                description: Overrides the batch exitDate for this record
        exitDate:
          type: string
          format: date
          description: Default exit date for records without their own; required unless every record has one
    ExitsResult:
      type: object
      required: [batchId, count]
      properties:
        batchId:
          type: string
          format: uuid
        count:
          type: integer
    RosterSummary:
      type: object
      required:
        [status, expectedDeclarants, onboardedDeclarants, flagged, lastImportAt, lastImportId]
      properties:
        status:
          type: string
          enum: [none, imported]
        expectedDeclarants:
          type: integer
        onboardedDeclarants:
          type: integer
        flagged:
          type: integer
        lastImportAt:
          type: [string, 'null']
          format: date-time
        lastImportId:
          type: [string, 'null']
          format: uuid
    RosterApiCredential:
      type: object
      required: [clientId, createdAt, createdBy, rotatedAt, revokedAt, lastUsedAt]
      properties:
        clientId:
          type: string
          examples: [roster-psc]
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        rotatedAt:
          type: [string, 'null']
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
        lastUsedAt:
          type: [string, 'null']
          format: date-time
    RosterApiCredentialWithSecret:
      allOf:
        - $ref: '#/components/schemas/RosterApiCredential'
        - type: object
          required: [secret, tokenEndpoint, scope]
          properties:
            secret:
              type: string
              description: Shown once; the platform does not store it
            tokenEndpoint:
              type: string
              format: uri
            scope:
              const: roster:write
