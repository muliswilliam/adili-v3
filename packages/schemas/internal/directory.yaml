              format: date-time
            - type: 'null'
          description: When access was revoked; a revoked credential obtains no tokens
        lastUsedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          description: Latest request made with one of its tokens (at most once a minute); null if never
      required:
        - clientId
        - createdAt
        - createdBy
        - rotatedAt
        - revokedAt
        - lastUsedAt
    RosterApiCredentialWithSecret:
      type: object
      properties:
        clientId:
          type: string
          description: OAuth client id the HR system authenticates with
          examples:
            - roster-psc-3f9a2c1d
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: object
          properties:
            id:
              type: string
              description: Creator's account (`sub`)
            name:
              description: Their display name when they created it; null when the token had none
              examples:
                - Fatuma Wanjiru
              type:
                - string
                - 'null'
          required:
            - id
            - name
          description: The reporting officer who created the credential
        rotatedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          description: Latest secret rotation; null if never rotated
        revokedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          description: When access was revoked; a revoked credential obtains no tokens
        lastUsedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
