# Generated by `pnpm --filter @adili/ai-gateway contracts` from the ai-gateway service: do not edit.
openapi: 3.1.0
info:
  title: ai-gateway API
  description: AI task API with provider adapters, data-classification gate, prompt versions and budgets.
  version: '1'
servers:
  - url: /
    description: The service that serves this document
paths:
  /internal/v1/tasks/{task}:
    post:
      tags:
        - internal
      summary: Create a job for a task (services); returns immediately, or waits up to `waitSeconds` for the result
      description: 'The Idempotency-Key names the job: a retry with the same key returns the first job. An equal request with a live or succeeded job returns that job (the cache). Completion is announced by ai.job.* events; a job already finished is returned with 200.'
      operationId: runTask
      parameters:
        - name: X-Acting-Tenant
          in: header
          description: Tenant the calling service acts for; the resource must belong to it
          required: true
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: task
          required: true
          in: path
          schema:
            $ref: '#/components/schemas/TaskName'
        - name: Idempotency-Key
          in: header
          description: Client-generated UUID, unique per logical request; reuse on retry
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '200':
          description: The job has finished (within the wait window, or before)
          headers:
            Idempotent-Replayed:
              description: '`true` when the key named an existing job, which is returned as it is now'
              schema:
                type: string
                enum:
                  - 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '202':
          description: Queued or running; completion announced by ai.job.* events
          headers:
            Idempotent-Replayed:
              description: '`true` when the key named an existing job, which is returned as it is now'
              schema:
                type: string
                enum:
                  - 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: 'Request failed validation (`answer-declarant-question` takes data class `synthetic` only), an input the task streams (`task-streamed`: `answer`-mode `answer-declarant-question`, sent to its stream endpoint), Idempotency-Key missing or not a UUID, or X-Acting-Tenant missing'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Requires a service token with scope ai:internal
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Unknown task
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Tenant's per-minute limit reached (code `rate-limit-exceeded`); no job was created. `retryAfterSeconds` and Retry-After say when to try again
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          headers:
            Retry-After:
              description: Seconds until the next request would be allowed
              schema:
                type: integer
      security:
        - bearer: []
  /internal/v1/tasks/answer-declarant-question/stream:
    post:
      tags:
        - internal
      summary: 'Stream an answer (server-sent events: text deltas, then the job with its validated output)'
      description: "Runs an `answer`-mode input of `answer-declarant-question` as a job, in the request. Events: `delta` {text}, the answer's prose as the model writes it, provisional until the end; then either `final` {job}, the succeeded job, whose output replaces the deltas (an answer that failed its checks arrives as `declined: true` with no blocks), or `error` {reason}, the job failed. A caller that disconnects fails the job with reason `cancelled`. A `: ping` comment is sent every 15 s. The Idempotency-Key names the job like the task endpoint's: a finished key returns its `final` (or `error`) only; an equal request with a succeeded job is served from it as one `delta` and its `final`."
      operationId: streamAnswerDeclarantQuestion
      parameters:
        - name: X-Acting-Tenant
          in: header
          description: Tenant the calling service acts for; the resource must belong to it
          required: true
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: Idempotency-Key
          in: header
          description: Client-generated UUID, unique per logical request; reuse on retry
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '200':
          description: 'SSE stream: `delta` {text}, then `final` {job: Job} or `error` {reason: JobReason}'
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: Request failed validation (data class `synthetic` only), a `hints` input (`task-not-streamed`, run it as a job), Idempotency-Key missing or not a UUID, or X-Acting-Tenant missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'The classification gate refused it (`task-blocked`, `reason: policy`); the blocked job is recorded'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: The Idempotency-Key, or an equal request, is streaming now (`job-in-progress`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: "Tenant's per-minute limit reached (code `rate-limit-exceeded`, no job), or its monthly budget spent (`task-blocked`, `reason: budget`)"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: No provider reachable for the route (`task-blocked`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - bearer: []
  /internal/v1/jobs/{jobId}:
    get:
      tags:
        - internal
      summary: Job state and validated output (caller service only, for the tenant it acts for)
      operationId: getJob
      parameters:
        - name: X-Acting-Tenant
          in: header
          description: Tenant the calling service acts for; the resource must belong to it
          required: true
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: jobId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: The id is not a UUID, or X-Acting-Tenant is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Requires a service token with scope ai:internal
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, another caller's job, or another tenant's
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - bearer: []
  /internal/v1/jobs/{jobId}/feedback:
    put:
      tags:
        - internal
      summary: Record or update a reviewer's rating of a job's output (caller service only)
      description: 'One rating per reviewer per block of the output (`block`; null for the output as a whole): a second rating by the same reviewer of the same block replaces the first. Each rating announces ai.feedback.recorded.v1 (no note, no reviewer).'
      operationId: recordFeedback
      parameters:
        - name: X-Acting-Tenant
          in: header
          description: Tenant the calling service acts for; the resource must belong to it
          required: true
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: jobId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackInput'
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
        '400':
          description: Request failed validation, or X-Acting-Tenant is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Requires a service token with scope ai:internal
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No succeeded job with this id of the caller, for the tenant it acts for
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - bearer: []
  /v1/ai/policies:
    get:
      tags:
        - policy
      summary: Classification gate per tenant with explicit rules, and the default for every other pair
      operationId: listGatePolicies
      responses:
        '200':
          description: Policies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatePolicyList'
        '403':
          description: Caller is not a platform admin
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - bearer: []
  /v1/ai/policies/{tenant}:
    put:
      tags:
        - policy
      summary: Allow or block provider classes per data class, all or none (audited with the approval reference)
      description: 'The rules apply in one transaction: every rule is stored, or none is. Each rule gets its own audit record and `ai.policy.changed.v1` event, all with the approval reference.'
      operationId: setGatePolicy
      parameters:
        - name: tenant
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatePolicyInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPolicy'
        '400':
          description: Request failed validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Caller is not a platform admin
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - bearer: []
  /v1/ai/routing:
    get:
      tags:
        - policy
      summary: Effective routing table (task to provider, model and parameters), with tenant overrides
      operationId: getRouting
      responses:
        '200':
          description: Routing
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Route'
        '403':
          description: Caller is not a platform admin
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - bearer: []
  /v1/ai/routing/{task}:
    put:
      tags:
        - policy
      summary: Route a task's calls for every tenant without its own route (audited)
      description: The next job of the task follows it. Audited with the approval reference and announced by `ai.policy.changed.v1` (action `ai.route.changed`).
      operationId: setDefaultRoute
      parameters:
        - name: task
          required: true
          in: path
          schema:
            type: string
            enum:
              - summarize-declaration
              - explain-flags
              - draft-clarification
              - narrate-compliance-report
              - answer-declarant-question
              - extract-document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '400':
          description: Request failed validation, or the provider is not one this gateway reaches
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Caller is not a platform admin
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - bearer: []
    delete:
      tags:
        - policy
      summary: Remove a task's default route, back to the configured provider and model (audited)
      operationId: removeDefaultRoute
      parameters:
        - name: approvalRef
          required: true
          in: query
          description: The decision the change rests on, e.g. an EACC approval number
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: task
          required: true
          in: path
          schema:
            type: string
            enum:
              - summarize-declaration
              - explain-flags
              - draft-clarification
              - narrate-compliance-report
              - answer-declarant-question
              - extract-document
      responses:
        '204':
          description: Removed
        '400':
          description: Request failed validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Caller is not a platform admin
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: The task has no default route
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - bearer: []
  /v1/ai/tenants/{tenant}/routing/{task}:
    put:
      tags:
        - policy
      summary: Route a task's calls for one tenant, over the default route (audited)
      description: The next job of the task for the tenant follows it. Audited with the approval reference and announced by `ai.policy.changed.v1` (action `ai.route.changed`).
      operationId: setTenantRoute
      parameters:
        - name: tenant
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: task
          required: true
          in: path
          schema:
            type: string
            enum:
              - summarize-declaration
              - explain-flags
              - draft-clarification
              - narrate-compliance-report
              - answer-declarant-question
              - extract-document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '400':
          description: Request failed validation, the task is one only EACC calls (it has only a default route), or the provider is not one this gateway reaches
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Caller is not a platform admin
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - bearer: []
    delete:
      tags:
        - policy
      summary: Remove a tenant's route of a task, back to the default route (audited)
      operationId: removeTenantRoute
      parameters:
        - name: tenant
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: approvalRef
          required: true
          in: query
          description: The decision the change rests on, e.g. an EACC approval number
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: task
          required: true
          in: path
          schema:
            type: string
            enum:
              - summarize-declaration
              - explain-flags
              - draft-clarification
              - narrate-compliance-report
              - answer-declarant-question
              - extract-document
      responses:
        '204':
          description: Removed
        '400':
          description: Request failed validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Caller is not a platform admin
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: The tenant has no route of its own for the task
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - bearer: []
  /v1/ai/usage:
    get:
      tags:
        - policy
      summary: This month's budget and usage of every tenant with a budget or a job this month, and the default budget of the others
      operationId: listTenantUsage
      responses:
        '200':
          description: Usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageList'
        '403':
          description: Caller is not a platform admin
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - bearer: []
  /v1/ai/tenants/{tenant}/usage:
    get:
      tags:
        - policy
      summary: Budget, tokens and cost this month, blocked and failed counts
      operationId: getTenantUsage
      parameters:
        - name: tenant
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
      responses:
        '200':
          description: Usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantUsage'
        '400':
          description: Request failed validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Caller is not a platform admin
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - bearer: []
    put:
      tags:
        - policy
      summary: Set the monthly token budget and per-minute limit (audited)
      operationId: setTenantBudget
      parameters:
        - name: tenant
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantUsage'
        '400':
          description: Request failed validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Caller is not a platform admin
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - bearer: []
  /internal/v1/tenants/{tenant}/status:
    get:
      tags:
        - internal
      summary: Whether AI assistance is enabled for a tenant and with which provider class (review proxies it for the Commission status line)
      description: "Derived from the tenant's routes and its classification gate (explicit rules, else the default): the provider classes the tenant's Commission tasks are routed to, and the data classes every one of them may process. EACC-only tasks such as narrate-compliance-report are excluded."
      operationId: getTenantAiStatus
      parameters:
        - name: X-Acting-Tenant
          in: header
          description: Tenant the calling service acts for; the resource must belong to it
          required: true
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: tenant
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantAiStatus'
        '400':
          description: Request failed validation, or X-Acting-Tenant is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Requires a service token with scope ai:internal
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: The tenant is not the one the caller acts for
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - bearer: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    TaskName:
      type: string
      enum:
        - summarize-declaration
        - explain-flags
        - draft-clarification
        - narrate-compliance-report
        - answer-declarant-question
        - extract-document
    DataClass:
      type: string
      enum:
        - synthetic
        - restricted
        - highly-confidential
    ProviderClass:
      type: string
      enum:
        - external
        - self-hosted
    JobStatus:
      type: string
      enum:
        - queued
        - running
        - succeeded
        - failed
        - blocked
    JobReason:
      type: string
      enum:
        - policy
        - budget
        - validation
        - refused
        - provider
        - provider-unavailable
        - timeout
        - cancelled
      description: Set when failed or blocked
    TaskRequest:
      type: object
      properties:
        dataClass:
          $ref: '#/components/schemas/DataClass'
        subjectRef:
          type: string
          minLength: 1
          maxLength: 200
          description: Owning record, e.g. review-case:<uuid>; appears in audit and events
        promptVersion:
          default: null
          description: Pin a prompt version; null uses the current one
          anyOf:
            - type: integer
              exclusiveMinimum: 0
            - type: 'null'
        waitSeconds:
          default: 0
          type: integer
          minimum: 0
          maximum: 30
        input:
          anyOf:
            - $ref: '#/components/schemas/SummarizeDeclarationInput'
            - $ref: '#/components/schemas/ExplainFlagsInput'
            - $ref: '#/components/schemas/DraftClarificationInput'
            - $ref: '#/components/schemas/NarrateComplianceReportInput'
            - $ref: '#/components/schemas/AnswerDeclarantQuestionInput'
            - $ref: '#/components/schemas/ExtractDocumentInput'
          description: The task's input; its `kind` is the task name
      required:
        - dataClass
        - subjectRef
        - input
    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
        task:
          $ref: '#/components/schemas/TaskName'
        tenant:
          type: string
        subjectRef:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        reason:
          anyOf:
            - $ref: '#/components/schemas/JobReason'
            - type: 'null'
        promptVersion:
          type: integer
        provider:
          type:
            - string
            - 'null'
        model:
          type:
            - string
            - 'null'
        inputHash:
          type: string
        outputHash:
          type:
            - string
            - 'null'
        usage:
          type: object
          properties:
            tokensIn:
              type: integer
            tokensOut:
              type: integer
            costMicros:
              type: integer
              description: Estimated cost in micro US dollars (USD 1 = 1,000,000) at provider list price
            latencyMs:
              type: integer
          required:
            - tokensIn
            - tokensOut
            - costMicros
            - latencyMs
        output:
          anyOf:
            - $ref: '#/components/schemas/SummarizeDeclarationOutput'
            - $ref: '#/components/schemas/ExplainFlagsOutput'
            - $ref: '#/components/schemas/DraftClarificationOutput'
            - $ref: '#/components/schemas/NarrateComplianceReportOutput'
            - $ref: '#/components/schemas/AnswerDeclarantQuestionOutput'
            - $ref: '#/components/schemas/ExtractDocumentOutput'
            - type: 'null'
          description: The task's output; null until the job succeeded, or once purged
        createdAt:
          type: string
          format: date-time
        finishedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
      required:
        - id
        - task
        - tenant
        - subjectRef
        - status
        - reason
        - promptVersion
        - provider
        - model
        - inputHash
        - outputHash
        - usage
        - output
        - createdAt
        - finishedAt
    AiLabel:
      type: object
      properties:
        aiAssisted:
          type: boolean
          const: true
        task:
          $ref: '#/components/schemas/TaskName'
        promptVersion:
          type: integer
        provider:
          type: string
        model:
          type: string
        generatedAt:
          type: string
          format: date-time
        disclaimer:
          type: string
