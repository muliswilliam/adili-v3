    NarrateComplianceReportInput:
      type: object
      properties:
        kind:
          type: string
          const: narrate-compliance-report
        fy:
          type: integer
          description: Financial year, by the calendar year it ends in
        totals:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type:
              - number
              - 'null'
          description: National counts
        rates:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type:
              - number
              - 'null'
          description: National rates, as fractions (0.164 is 16.4%)
        commissionTable:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                pattern: ^[a-z][a-z0-9-]*$
                description: Commission slug; names the row in aggregate keys
              commissionName:
                type: string
                description: 'A public body, not a person: outside the name fields minimisation tokenises'
              figures:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  type:
                    - number
                    - 'null'
            required:
              - code
              - commissionName
              - figures
          description: 'One row per Commission: code, name and its figures, rates as fractions'
        priorYears:
          type: array
          items:
            type: object
            properties:
              fy:
                type: integer
                description: Financial year, by the calendar year it ends in
              totals:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  type:
                    - number
                    - 'null'
                description: National counts
              rates:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  type:
                    - number
                    - 'null'
                description: National rates, as fractions (0.164 is 16.4%)
              commissionTable:
                type: array
                items:
                  type: object
                  properties:
                    code:
                      type: string
                      pattern: ^[a-z][a-z0-9-]*$
                      description: Commission slug; names the row in aggregate keys
                    commissionName:
                      type: string
                      description: 'A public body, not a person: outside the name fields minimisation tokenises'
                    figures:
                      type: object
                      propertyNames:
                        type: string
                      additionalProperties:
                        type:
                          - number
                          - 'null'
                  required:
                    - code
                    - commissionName
                    - figures
                description: 'One row per Commission: code, name and its figures, rates as fractions'
            required:
              - fy
              - totals
              - rates
              - commissionTable
        candidates:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              kind:
                type: string
                enum:
                  - rate-change
                  - threshold-breach
                  - chronic-late-reporting
                  - clarification-ratio-outlier
                  - size-band-outlier
                  - non-reporting
              subject:
                type: string
                description: Commission slug, entity type, or `national`
              values:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  type:
                    - number
                    - string
                    - 'null'
              aggregateKeys:
                minItems: 1
                type: array
                items:
                  type: string
            required:
              - id
              - kind
              - subject
              - values
              - aggregateKeys
        section:
          type: string
          enum:
            - overview
            - findings
            - recommendations
            - all
          description: '`findings` and `all` need at least one candidate: a finding narrates a computed pattern, so with none no draft could pass validation'
        language:
          type: string
          enum:
            - en
      required:
        - kind
        - fy
        - totals
        - rates
        - commissionTable
        - priorYears
        - candidates
        - section
        - language
      description: 'Aggregate keys name each figure: `national.<name>` for totals and rates, `commission.<code>.<name>` for a Commission row, and the same prefixed `fy<fy>.` for a prior year (`fy2025.national.filed`). Aggregates only, no person: callers send data class `restricted`'
    NarrateComplianceReportOutput:
      type: object
      properties:
        label:
          $ref: '#/components/schemas/AiLabel'
        paragraphs:
          maxItems: 21
          type: array
          items:
            type: object
            properties:
              section:
                type: string
                enum:
                  - overview
                  - findings
                  - recommendations
              text:
                type: string
                maxLength: 2000
              aggregateRefs:
                minItems: 1
                type: array
                items:
                  type: string
              candidateIds:
                type: array
                items:
                  type: string
            required:
              - section
              - text
              - aggregateRefs
              - candidateIds
          description: The job fails with reason `validation` unless every number in the text is in the input (separators stripped; a percentage is a rate ×100 rounded half up to the places written, at most two; years only as input FYs), every aggregate ref and candidate id is in the input, every finding narrates a candidate, and the paragraphs cover exactly the sections asked for (overview at most 3, findings 12, recommendations 6)
      required:
        - label
        - paragraphs
    AnswerDeclarantQuestionInput:
      type: object
      properties:
        kind:
          type: string
          const: answer-declarant-question
        mode:
          type: string
          enum:
            - answer
            - hints
          description: '`answer` streams an answer to the question (stream endpoint only); `hints` writes one hint per residual (job endpoint only)'
        language:
          type: string
          enum:
            - en
            - sw
        question:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 2000
            - type: 'null'
          description: The declarant's question; null in hints mode
        context:
          type: object
          properties:
            declarationType:
              anyOf:
                - type: string
                  enum:
                    - initial
                    - biennial
                    - final
                - type: 'null'
              description: The type of the declaration being filled (declarations.yaml)
            statementDate:
              anyOf:
                - type: string
                  format: date
                - type: 'null'
            householdCounts:
              type: object
              properties:
                spouses:
                  type: integer
                  minimum: 0
                children:
                  type: integer
                  minimum: 0
              required:
                - spouses
                - children
            sectionKey:
              anyOf:
                - type: string
                  pattern: ^(bio|household|other|statement:(officer|spouse:[0-9a-f-]{36}|child:[0-9a-f-]{36}))$
                  description: bio, household, other, or statement:<personKey> (declarations.yaml)
                - type: 'null'
              description: The section the declarant is on
            residuals:
              maxItems: 20
              type: array
              items:
                type: object
                properties:
                  sectionKey:
                    type: string
                    pattern: ^(bio|household|other|statement:(officer|spouse:[0-9a-f-]{36}|child:[0-9a-f-]{36}))$
                    description: bio, household, other, or statement:<personKey> (declarations.yaml)
                  ruleId:
                    type: string
                    maxLength: 100
                    pattern: ^[a-z][A-Za-z0-9]*(-[a-z0-9]+)*$
                    description: The completeness rule or schema keyword that reports it, e.g. nil-or-items-required, minLength
                  fieldPath:
                    type: string
                    maxLength: 200
                    pattern: ^(\/([a-z][A-Za-z0-9]*|0|[1-9][0-9]*))*$
                    description: 'JSON pointer within the section, field names and indexes: /assets/1/value'
                required:
                  - sectionKey
                  - ruleId
                  - fieldPath
              description: 'What the completeness check still reports: where, and by which rule'
          required:
            - declarationType
            - statementDate
            - householdCounts
            - sectionKey
            - residuals
          description: Never contains amounts, names, identifiers or descriptions
        passages:
          maxItems: 20
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 100
              citation:
                type: string
                maxLength: 200
              text:
                type: string
                maxLength: 10000
            required:
              - id
              - citation
              - text
          description: Retrieved corpus passages; an answer may cite only these
        history:
          maxItems: 10
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum:
                  - user
                  - assistant
              text:
                type: string
                maxLength: 4000
            required:
              - role
              - text
          description: Earlier turns, oldest first, to resolve follow-up questions
      required:
        - kind
        - mode
        - language
        - question
        - context
        - passages
        - history
    AnswerDeclarantQuestionOutput:
      type: object
      properties:
        label:
          $ref: '#/components/schemas/AiLabel'
        declined:
          type: boolean
          description: The passages do not answer the question; also set when a streamed answer fails its checks, which then has no blocks
        blocks:
          maxItems: 20
          type: array
          items:
            type: object
            properties:
              text:
                type: string
                maxLength: 1500
              passageIds:
                type: array
                items:
                  type: string
                description: Passages the block rests on, all from the input; at least one in answer mode
              sectionLink:
                anyOf:
                  - type: object
                    properties:
                      sectionKey:
                        type: string
                        pattern: ^(bio|household|other|statement:(officer|spouse:[0-9a-f-]{36}|child:[0-9a-f-]{36}))$
                        description: bio, household, other, or statement:<personKey> (declarations.yaml)
                      fieldPath:
                        anyOf:
                          - type: string
                            maxLength: 200
                            description: JSON pointer within the section
                          - type: 'null'
                    required:
                      - sectionKey
                      - fieldPath
                  - type: 'null'
                description: Where in the declaration the block is about; in hints mode, its residual
            required:
              - text
              - passageIds
              - sectionLink
        followUps:
          maxItems: 3
          type: array
          items:
            type: string
            maxLength: 200
      required:
        - label
        - declined
        - blocks
        - followUps
    ExtractDocumentInput:
      type: object
      properties:
        kind:
          type: string
          const: extract-document
        documentKindHint:
          type: string
          enum:
            - title-deed
            - logbook
            - payslip
            - bank-letter
            - share-certificate
            - other
        target:
          oneOf:
            - type: object
              properties:
                section:
                  type: string
                  const: assets
                itemType:
                  type: string
                  enum:
                    - land
                    - building
                    - vehicle
                    - securities
                    - shareholding
                    - bank-account
                    - cash
                    - receivable
                    - other
              required:
                - section
                - itemType
            - type: object
              properties:
                section:
                  type: string
                  const: income
                itemType:
                  type: string
                  enum:
                    - salary-emoluments
                    - allowances
                    - business
                    - rent
                    - dividends-interest
                    - pension
                    - farming
                    - consultancy
                    - other
              required:
