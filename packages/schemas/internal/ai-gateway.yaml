        - changedByName
        - changedAt
      description: An explicit rule of a tenant's gate, with who decided it and on which approval
    TenantPolicy:
      type: object
      properties:
        tenant:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/GateRule'
          description: Explicit rules, allowing or blocking, in DataClass then ProviderClass order. A pair without one follows `GatePolicyList.defaults`
      required:
        - tenant
        - rules
    GatePolicyList:
      type: object
      properties:
        defaults:
          type: array
          items:
            $ref: '#/components/schemas/GateRuleInput'
          description: "The gate of every (data class, provider class) pair a tenant has no rule for: self-hosted providers may see every data class, external providers none, so a new tenant sends nothing outside the platform until a platform admin records an approved rule (the demo tenant's synthetic rule is seeded that way)"
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantPolicy'
          description: Tenants with at least one explicit rule, by tenant
      required:
        - defaults
        - tenants
    RouteParams:
      type: object
      properties:
        maxOutputTokens:
          type: integer
          exclusiveMinimum: 0
        effort:
          type: string
          enum:
            - low
            - medium
            - high
        timeoutMs:
          description: Longest one provider call may take
          type: integer
          exclusiveMinimum: 0
      additionalProperties: false
      description: Call parameters; an unset one falls back to the task's own
    Route:
      type: object
      properties:
        tenant:
          description: null is the default route
          type:
            - string
            - 'null'
        task:
          $ref: '#/components/schemas/TaskName'
        provider:
          type: string
        providerClass:
          anyOf:
            - $ref: '#/components/schemas/ProviderClass'
            - type: 'null'
          description: The provider's class, which the gate decides on; null when this gateway cannot reach the provider (its jobs fail `provider-unavailable`)
        model:
          type: string
        params:
          $ref: '#/components/schemas/RouteParams'
        configured:
          type: boolean
          description: True for a task with no default route, which follows the gateway's configured provider and model; false for a route set through this API
      required:
        - tenant
        - task
        - provider
        - providerClass
        - model
        - params
        - configured
    RouteInput:
      type: object
      properties:
        provider:
          type: string
          minLength: 1
          maxLength: 100
          description: A provider this gateway is configured to reach (`Route.provider` names them)
        model:
          type: string
          minLength: 1
          maxLength: 200
        params:
          default: {}
          $ref: '#/components/schemas/RouteParams'
        approvalRef:
          type: string
          minLength: 1
          maxLength: 200
          description: The decision the change rests on, e.g. an EACC approval number
      required:
        - provider
        - model
        - approvalRef
      additionalProperties: false
      description: "A task's route: provider, model and call parameters"
    BudgetInput:
      type: object
      properties:
        monthlyTokens:
          type: integer
          minimum: 0
          description: Tokens (in and out) per calendar month, Africa/Nairobi
        perMinute:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Jobs created per minute
      required:
        - monthlyTokens
        - perMinute
      additionalProperties: false
    TenantUsage:
      type: object
      properties:
        tenant:
          type: string
        month:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}$
          description: Calendar month, Africa/Nairobi
        monthlyTokens:
          type: integer
        perMinute:
          type: integer
        tokensUsed:
          type: integer
        costMicros:
          type: integer
          description: Estimated cost in micro US dollars (USD 1 = 1,000,000) at provider list price
        jobs:
          type: integer
        blocked:
          type: integer
        failed:
          type: integer
      required:
        - tenant
        - month
        - monthlyTokens
        - perMinute
        - tokensUsed
        - costMicros
        - jobs
        - blocked
        - failed
    UsageList:
      type: object
      properties:
        month:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}$
          description: Calendar month, Africa/Nairobi
        defaults:
          $ref: '#/components/schemas/BudgetInput'
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantUsage'
          description: Tenants with a budget of their own or a job this month, by tenant
      required:
        - month
        - defaults
        - tenants
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
            - database-unavailable
            - rate-limit-exceeded
            - no-match
            - already-onboarded
            - no-roster
            - otp-invalid
            - otp-expired
            - resend-cooldown
            - otp-send-failed
            - wrong-step
            - session-expired
            - iprs-unavailable
            - identity-unavailable
            - email-in-use
            - identity-mismatch
            - step-up-required
            - incomplete
            - before-statement-date
            - amendment-window-closed
            - not-a-draft
            - not-submitted
            - obligation-cancelled
            - acknowledgement-issued
            - acknowledgement-in-progress
            - consent-required
            - no-id
            - not-new
            - no-applicant-record
            - request-decided
            - request-closed
            - officer-resolved
            - not-under-decision
            - not-pending-verification
            - lea-account-inactive
            - declarant-notified
            - representations-closed
            - download-window-closed
            - scope-exceeds-request
            - grounds-required
          description: Machine-readable cause, from the platform registry; clients map it to copy and never show `title` or `detail`
        detail:
          type: string
        instance:
          type: string
        errors:
          description: Field-level errors; `path` is the dotted request field
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - path
              - message
      required:
        - type
        - title
        - status
security:
  - bearer: []
