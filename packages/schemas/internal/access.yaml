                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            The Commission supervisor reads applications; only its access officer acts

            Requires one of the roles: access-officer, supervisor, eacc-analyst, eacc-supervisor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not the caller's Commission (another Commission's, EACC's or anyone else's)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The directory cannot be reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: access.self-access.declarants.listed
        resource: roster-record
  /v1/commissions/{slug}/access/self-access/declarants/{rosterRecordId}/versions:
    get:
      tags:
        - officer
      summary: The declarant's submitted versions a certified copy can be of
      description: Latest submitted first, with the reference, type, statement date and whether a later version replaced it; no content. Empty for a record not onboarded.
      operationId: listSelfAccessDeclarantVersions
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: rosterRecordId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclarantVersions'
        '400':
          description: rosterRecordId is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            The Commission supervisor reads applications; only its access officer acts

            Requires one of the roles: access-officer, supervisor, eacc-analyst, eacc-supervisor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not the caller's Commission (another Commission's, EACC's or anyone else's), or no such roster record of the Commission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The directory or declarations cannot be reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: access.self-access.versions.listed
        resource: roster-record
  /v1/commissions/{slug}/access/self-access:
    post:
      tags:
        - officer
      summary: Record a written self-access application and issue its certified copy
      description: The declarant's identity check, and for a representative their name, ID number (stored encrypted), written authority and ID as the officer's clean uploads of purpose `access-representation`. The certified copy (Restricted, the declarant its subject) is ordered at once and due 14 days from receipt; once issued it is registered `self-access` naming the representative (`access.certified-copy.issued.v1`) and shows in the declarant's access history. Follow `certifiedCopy.status` until `issued`; the recording officer (`recordedByCaller`) is named on the copy and downloads it from documents (`getDocumentDownload` with `certifiedCopy.documentId`, audited there) to print it, then marks it collected or dispatched.
      operationId: recordSelfAccessApplication
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: Idempotency-Key
          in: header
          description: Client-generated UUID, unique per logical request; reuse on retry
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelfAccessApplicationInput'
      responses:
        '201':
          description: Recorded; the certified copy is being issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfAccessApplicationDetail'
        '400':
          description: The body failed validation; `rosterRecordId` is not an onboarded roster record of the Commission, `version` not a submitted version of its declarant, or a representative upload not a clean `access-representation` upload of the caller; `errors` name the field
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            The Commission supervisor reads applications; only its access officer acts

            Requires one of the roles: access-officer, supervisor, eacc-analyst, eacc-supervisor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not the caller's Commission (another Commission's, EACC's or anyone else's)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The directory, declarations, documents, the key service or the workflow engine cannot be reached; nothing was recorded
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    get:
      tags:
        - officer
      summary: The Commission's written self-access applications with their deadlines
      description: 'Those still to collect or dispatch first, earliest deadline first; then the delivered ones, latest deadline first. `late`: the certified copy was not issued by the deadline (14 days from receipt).'
      operationId: listSelfAccessApplications
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: status
          required: false
          in: query
          description: Only applications in this status
          schema:
            type: string
            enum:
              - recorded
              - issued
              - delivered
        - name: cursor
          required: false
          in: query
          description: '`nextCursor` of the previous page; omit for the first page'
          schema:
            type: string
            maxLength: 500
        - name: limit
          required: false
          in: query
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfAccessPage'
        '400':
          description: Query failed validation, or an unknown cursor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'Requires one of the roles: access-officer, supervisor, eacc-analyst, eacc-supervisor'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not the caller's Commission (another Commission's, EACC's or anyone else's)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/access/self-access/{applicationId}:
    get:
      tags:
        - officer
      summary: A written self-access application, with the representative's ID number
      description: "The Commission's access officer and supervisor read it; another Commission's application, and EACC, get 404. `recordedByCaller`: the caller recorded it, so may download the issued certified copy to hand it over."
      operationId: getSelfAccessApplication
      parameters:
        - name: applicationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfAccessApplicationDetail'
        '400':
          description: applicationId is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'Requires one of the roles: access-officer, supervisor, eacc-analyst, eacc-supervisor'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such application at the caller's Commission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The key service cannot be reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: access.self-access.viewed
        resource: self-access-application
  /v1/access/self-access/{applicationId}/delivered:
    post:
      tags:
        - officer
      summary: Mark the issued certified copy collected or dispatched
      description: As the application was marked (`deliveryMethod`); the application becomes `delivered`. Only once the certified copy is issued, and once.
      operationId: markSelfAccessDelivered
      parameters:
        - name: applicationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Marked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfAccessApplicationDetail'
        '400':
          description: applicationId is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            The Commission supervisor reads applications; only its access officer acts

            Requires one of the roles: access-officer, supervisor, eacc-analyst, eacc-supervisor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such application at the caller's Commission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: The certified copy is not issued yet, or is marked already
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The key service cannot be reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    AccessRequestStatus:
      type: string
      enum:
        - submitted
        - pending-applicant-verification
        - officer-unresolved
        - awaiting-representations
        - under-decision
        - granted
        - partially-granted
        - denied
        - cannot-identify
        - withdrawn
    Outcome:
      type: string
      enum:
        - grant
        - partial-grant
        - deny
    Ground:
      type: string
      enum:
        - public-interest
        - prejudice-proceeding
        - frivolous-vexatious
        - not-objectives
      description: Regulation 24
    Section:
      type: string
      enum:
        - bio
        - income
        - assets
        - liabilities
        - other
    Scope:
      type: object
      properties:
        years:
          minItems: 1
          maxItems: 50
          type: array
          items:
            type: integer
            minimum: 2025
        includeSpouses:
          type: boolean
        includeChildren:
          type: boolean
        sections:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/Section'
        includeClarifications:
          type: boolean
          description: 'The clarifications the declarant gave on the disclosed declarations (Act s.36(1), Regulation 22(1)): Form K only, always false for a law enforcement request'
      required:
        - years
        - includeSpouses
        - includeChildren
        - sections
        - includeClarifications
      additionalProperties: false
    Decision:
      type: object
      properties:
        outcome:
          $ref: '#/components/schemas/Outcome'
        grantedScope:
          anyOf:
            - $ref: '#/components/schemas/Scope'
            - type: 'null'
        grounds:
          type: array
          items:
            $ref: '#/components/schemas/Ground'
        reasons:
          type: string
        decidedBy:
          type: object
          properties:
            subject:
              type: string
            name:
              type: string
          required:
            - subject
            - name
        decidedAt:
          type: string
          format: date-time
      required:
        - outcome
        - grantedScope
        - grounds
        - reasons
        - decidedBy
        - decidedAt
    DecisionInput:
      type: object
      properties:
        outcome:
          $ref: '#/components/schemas/Outcome'
        grantedScope:
          description: 'Required for partial-grant: narrower than the requested scope, never wider. A grant is of the requested scope (omit it, or send the requested scope); a denial has none'
          anyOf:
            - $ref: '#/components/schemas/Scope'
            - type: 'null'
        grounds:
          description: 'Regulation 24 grounds: required for partial-grant and deny, none for grant'
          maxItems: 4
          type: array
          items:
            $ref: '#/components/schemas/Ground'
        reasons:
          type: string
          minLength: 1
          maxLength: 4000
      required:
        - outcome
        - reasons
      additionalProperties: false
    Package:
      type: object
      properties:
        documentId:
          type: string
          format: uuid
        verificationId:
          type: string
        issuedAt:
          type: string
          format: date-time
        downloadExpiresAt:
          type: string
          format: date-time
        downloads:
          type: integer
          minimum: 0
      required:
        - documentId
        - verificationId
        - issuedAt
        - downloadExpiresAt
        - downloads
    FormK:
      type: object
      propertyNames:
        type: string
      additionalProperties: {}
      description: A form-k.v1 document (packages/schemas/forms/form-k.v1.json)
    AccessRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          description: ARQ-<ISSUER>-<YEAR>-<seq>-<check>
        commission:
          type: object
          properties:
            slug:
              type: string
            name:
              type: string
          required:
            - slug
            - name
        status:
          $ref: '#/components/schemas/AccessRequestStatus'
        formK:
          description: The form-k.v1 document as submitted
          $ref: '#/components/schemas/FormK'
        submittedAt:
          type: string
          format: date-time
        decisionDeadlineAt:
          type: string
          format: date-time
        decision:
          anyOf:
            - $ref: '#/components/schemas/Decision'
            - type: 'null'
        package:
          anyOf:
            - $ref: '#/components/schemas/Package'
            - type: 'null'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/RegisterEntry'
      required:
        - id
        - reference
        - commission
        - status
        - formK
        - submittedAt
        - decisionDeadlineAt
        - decision
        - package
        - timeline
    RegisterEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - received
            - verified
            - identified
            - notified
            - representations
            - decided
            - package-issued
            - downloaded
            - expired
            - withdrawn
            - cannot-identify
            - self-access
        at:
          type: string
          format: date-time
        actor:
          type:
            - string
            - 'null'
        summary:
          type: string
        reference:
          type: string
        inWriting:
          type: boolean
      required:
        - id
        - kind
        - at
        - actor
        - summary
        - reference
        - inWriting
    Representations:
      type: object
      properties:
        stance:
          type: string
          enum:
            - object
            - consent
            - context
        text:
          type: string
        attachments:
          type: array
          items:
            type: object
            properties:
              uploadId:
                type: string
                format: uuid
              fileName:
                type: string
            required:
              - uploadId
              - fileName
        submittedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        receivedInWriting:
          type: boolean
          description: Received in writing and entered by the access officer on the declarant's behalf (a declarant served a written notice); false when the declarant made them online
        recordedBy:
          description: The access officer who entered representations received in writing, by name (Commission staff only); null when made online, and always null for the declarant
          type:
            - string
            - 'null'
      required:
        - stance
        - text
        - attachments
        - submittedAt
        - updatedAt
        - receivedInWriting
        - recordedBy
    OfficerRequestView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          description: ARQ-<ISSUER>-<YEAR>-<seq>-<check>
        commission:
          type: object
          properties:
            slug:
              type: string
            name:
              type: string
          required:
            - slug
            - name
        status:
          $ref: '#/components/schemas/AccessRequestStatus'
        formK:
          description: The form-k.v1 document as submitted
          $ref: '#/components/schemas/FormK'
        submittedAt:
          type: string
          format: date-time
        decisionDeadlineAt:
          type: string
          format: date-time
        decision:
          anyOf:
            - $ref: '#/components/schemas/Decision'
            - type: 'null'
        package:
          anyOf:
            - $ref: '#/components/schemas/Package'
            - type: 'null'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/RegisterEntry'
        applicantIdentityStatus:
          type: string
          enum:
            - verified
            - pending-verification
        resolvedRosterRecordId:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        resolvedName:
          type:
            - string
            - 'null'
        resolvedFileNumber:
          type:
            - string
            - 'null'
        representations:
          anyOf:
            - $ref: '#/components/schemas/Representations'
            - type: 'null'
        windowEndsAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        representationWindowDays:
          anyOf:
            - type: integer
              exclusiveMinimum: 0
            - type: 'null'
          description: Days the declarant would have for representations if notified now (the Commission's policy in force), for the access officer identifying the officer; null once notified (see `windowEndsAt`), or when the policy cannot be read
        declarantOnboarded:
          description: 'Whether the officer resolved to has a declarant account (notified online); false: notified in writing, and invited to onboard (spec 10 decision 2); null until resolved'
          type:
            - boolean
            - 'null'
        declarantInvitedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          description: When the officer with no account was invited to onboard; null when not invited
        notice:
          anyOf:
            - $ref: '#/components/schemas/Notice'
            - type: 'null'
          description: How and when the declarant was notified; null before
      required:
        - id
        - reference
        - commission
        - status
        - formK
        - submittedAt
        - decisionDeadlineAt
        - decision
        - package
        - timeline
        - applicantIdentityStatus
        - resolvedRosterRecordId
        - resolvedName
        - resolvedFileNumber
        - representations
        - windowEndsAt
        - representationWindowDays
        - declarantOnboarded
        - declarantInvitedAt
        - notice
    VerifyApplicantIdentity:
      type: object
      properties:
        verified:
          type: boolean
        note:
          type: string
          minLength: 1
          maxLength: 1000
      required:
        - verified
        - note
      additionalProperties: false
    QueueItem:
      type: object
      properties:
        kind:
          type: string
          enum:
            - form-k
            - lea
        id:
          type: string
          format: uuid
        reference:
          type: string
        applicantOrAgency:
          type: string
        officerSought:
          type: string
        resolvedName:
          type:
            - string
            - 'null'
        resolvedFileNumber:
          type:
            - string
            - 'null'
        status:
          type: string
          enum:
            - submitted
            - pending-applicant-verification
            - officer-unresolved
            - awaiting-representations
            - under-decision
            - granted
            - partially-granted
            - denied
            - cannot-identify
            - withdrawn
            - received
            - verified
          description: An `AccessRequestStatus` for Form K, a `LeaRequestStatus` for law enforcement requests
        submittedAt:
          type: string
          format: date-time
        deadlineAt:
          type: string
          format: date-time
        windowEndsAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        late:
          type: boolean
        closedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
      required:
        - kind
        - id
        - reference
        - applicantOrAgency
        - officerSought
        - resolvedName
        - resolvedFileNumber
        - status
        - submittedAt
        - deadlineAt
        - windowEndsAt
        - late
        - closedAt
    QueuePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/QueueItem'
        nextCursor:
          description: Pass as `cursor` for the next page; null on the last page
          type:
            - string
            - 'null'
      required:
        - items
        - nextCursor
    ResolveOfficer:
      type: object
      properties:
        rosterRecordId:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          description: 'The roster record of the Commission the officer named in Part II is (an onboarded one: the declarant is notified); null records that they cannot be identified, which closes the request'
      required:
        - rosterRecordId
      additionalProperties: false
    RosterCandidate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        personnelFileNumber:
          type: string
        fullName:
          type: string
        designation:
          type:
            - string
            - 'null'
        reportingEntity:
          description: Its name
          type:
            - string
            - 'null'
        state:
          type: string
          description: 'The roster record state: not_onboarded, onboarded, exited'
        onboarded:
          type: boolean
      required:
        - id
        - personnelFileNumber
        - fullName
        - designation
        - reportingEntity
        - state
        - onboarded
    RosterCandidates:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RosterCandidate'
          description: By full name, at most 20
      required:
        - items
    AttachmentDownload:
      type: object
      properties:
        downloadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
          description: A few minutes ahead
      required:
        - downloadUrl
        - expiresAt
    RepresentationsInput:
      type: object
      properties:
        stance:
          type: string
          enum:
            - object
            - consent
            - context
          description: '`object` to the disclosure, `consent` to it (the request goes under decision at once), or add `context`'
        text:
          type: string
          maxLength: 8000
          description: The declarant's representations; may be empty only with `consent`
        attachments:
          maxItems: 10
          type: array
          items:
            type: string
            format: uuid
          description: Clean uploads of purpose `access-representation` by the caller (the declarant; the access officer for representations received in writing), or ones attached already
      required:
        - stance
        - text
        - attachments
      additionalProperties: false
    FormKDeclarantNotice:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        reference:
          type: string
        kind:
          type: string
          const: form-k
        commission:
          type: object
          properties:
            slug:
              type: string
            name:
              type: string
          required:
            - slug
            - name
        status:
          $ref: '#/components/schemas/AccessRequestStatus'
        applicantName:
          type: string
        purposeInGeneralTerms:
          type: string
        scope:
          $ref: '#/components/schemas/Scope'
        notifiedAt:
          type: string
          format: date-time
        noticeChannel:
          type: string
          enum:
            - online
            - written
          description: 'How the declarant was told: `online` at their account, or `written`: a notice served on paper while they had no account (spec 10 decision 2), `notifiedAt` the start of the day it was served'
        windowEndsAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        canRespond:
          type: boolean
        representations:
          anyOf:
            - $ref: '#/components/schemas/Representations'
            - type: 'null'
        decision:
          anyOf:
            - $ref: '#/components/schemas/Decision'
            - type: 'null'
      required:
        - requestId
        - reference
        - kind
        - commission
        - status
        - applicantName
        - purposeInGeneralTerms
        - scope
        - notifiedAt
        - noticeChannel
        - windowEndsAt
        - canRespond
        - representations
        - decision
    LeaDeclarantNotice:
      type: object
      properties:
