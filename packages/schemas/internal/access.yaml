# Generated by `pnpm --filter @adili/access contracts` from the access service: do not edit.
openapi: 3.1.0
info:
  title: access API
  description: Form K and law enforcement access requests, representations, decisions and grants.
  version: '1'
servers:
  - url: /
    description: The service that serves this document
paths:
  /v1/access/commissions:
    get:
      tags:
        - applicant
      summary: Commissions an applicant or a law enforcement officer can address, with the declaration years available
      description: 'Every active Responsible Commission in the directory, by name. `years` are the statement-date years the scope of a Form K or a law enforcement request can ask of it: from the year it joined Adili (its earliest obligations-start date, not before 2025) to the current year in Nairobi; empty while it holds no declarations yet. Platform reference data: no personal data.'
      operationId: listAccessCommissions
      responses:
        '200':
          description: Commissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessCommission'
        '403':
          description: |-
            Neither an applicant nor a law enforcement officer

            Requires one of the roles: applicant, law-enforcement
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: 'Problem type `directory-unavailable`: the directory cannot be reached'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/access/requests:
    post:
      tags:
        - applicant
      summary: Submit Form K (applicant); allocates the ARQ reference and acknowledges
      description: The request is `submitted`, or `pending-applicant-verification` while the applicant's identity is pending in the directory (a passport holder no access officer has verified yet). The acknowledgement (email and SMS, with the reference) follows from the `access.request.received.v1` event.
      operationId: submitAccessRequest
      parameters:
        - name: Idempotency-Key
          in: header
          description: Client-generated UUID, unique per logical request; reuse on retry
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormK'
      responses:
        '201':
          description: Received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
        '400':
          description: Not a valid form-k.v1 document (`errors` name the paths), or no such Responsible Commission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            Problem code `no-applicant-record`: the account has no applicant person record

            Requires one of the roles: applicant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The directory or the key service cannot be reached; nothing was stored
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    get:
      tags:
        - applicant
      summary: The applicant's requests, latest first
      description: Their own only. Each timeline leaves out the declarant's representations and names no actor but the applicant.
      operationId: listMyAccessRequests
      responses:
        '200':
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessRequest'
        '403':
          description: |-
            Not an applicant, or problem code `no-applicant-record`

            Requires one of the roles: applicant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The key service cannot be reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/access/requests/{requestId}:
    get:
      tags:
        - applicant
      summary: One request with decision and package status (applicant)
      description: Their own only; anyone else's request is 404. The timeline leaves out the declarant's representations and names no actor but the applicant. A grant's package is downloaded from documents with `package.documentId`.
      operationId: getMyAccessRequest
      parameters:
        - name: requestId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
        '400':
          description: requestId is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            Not an applicant, or problem code `no-applicant-record`

            Requires one of the roles: applicant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such request of the applicant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The key service cannot be reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/access/requests/{requestId}/withdraw:
    post:
      tags:
        - applicant
      summary: Withdraw before a decision
      description: Any status before a decision becomes `withdrawn`, recorded in the access register (`access.request.withdrawn.v1`).
      operationId: withdrawAccessRequest
      parameters:
        - name: requestId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
        '400':
          description: requestId is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            Not an applicant, or problem code `no-applicant-record`

            Requires one of the roles: applicant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such request of the applicant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Problem code `request-decided` (a decision is final) or `request-closed` (withdrawn already, or the officer could not be identified)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/access/requests:
    get:
      tags:
        - officer
      summary: Queue of access requests with deadlines (access officer; supervisor reads)
      description: 'Form K requests (30-day deadline) and law enforcement requests (14-day deadline) together, or one `kind`. Open requests first, earliest decision deadline first; then decided and closed ones, latest deadline first. `late`: past the deadline and neither decided nor closed (for a law enforcement request, the breach flag). Filters combine (`status`, `kind`, `late`, `search`).'
      operationId: listCommissionAccessRequests
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: status
          required: false
          in: query
          description: 'Only requests in these statuses, comma-separated, of either kind (e.g. the open ones: `submitted,pending-applicant-verification,officer-unresolved,awaiting-representations,under-decision,received,verified`)'
          schema:
            type: string
        - name: kind
          required: false
          in: query
          description: Only Form K or only LEA requests
          schema:
            type: string
            enum:
              - form-k
              - lea
        - name: late
          required: false
          in: query
          description: Only requests past their decision deadline and neither decided nor closed (`true`), or only the others (`false`)
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: search
          required: false
          in: query
          description: The reference or the identified officer's personnel file number (their beginning), or part of the applicant's or the officer's name (case-insensitive)
          schema:
            type: string
            maxLength: 200
        - name: cursor
          required: false
          in: query
          description: '`nextCursor` of the previous page; omit for the first page'
          schema:
            type: string
            maxLength: 500
        - name: limit
          required: false
          in: query
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuePage'
        '400':
          description: Query failed validation, or an unknown cursor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'Requires one of the roles: access-officer, supervisor, eacc-analyst, eacc-supervisor'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not the caller's Commission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/access/requests/{requestId}/officer:
    get:
      tags:
        - officer
      summary: Full request for the access officer (Form K, representations, register; audited)
      description: The Commission's access officer and supervisor read it; another Commission's request, and EACC, get 404. The timeline is the request's whole access register, actors named.
      operationId: getAccessRequestForOfficer
      parameters:
        - name: requestId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficerRequestView'
        '400':
          description: requestId is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'Requires one of the roles: access-officer, supervisor, eacc-analyst, eacc-supervisor'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such request at the caller's Commission (another Commission's, EACC's or anyone else's view)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The key service cannot be reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: access.request.viewed
        resource: access-request
  /v1/access/requests/{requestId}/representations/attachments/{uploadId}/download:
    get:
      tags:
        - officer
      summary: Short-lived download link for a file attached to the declarant's representations (audited)
      description: The access officer and the supervisor of the Commission read the representations, attachments included.
      operationId: getRepresentationAttachmentDownload
      parameters:
        - name: requestId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: uploadId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentDownload'
        '400':
          description: requestId or uploadId is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'Requires one of the roles: access-officer, supervisor, eacc-analyst, eacc-supervisor'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such request at the caller's Commission (another Commission's, EACC's or anyone else's view); or the upload is not attached to its representations
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The documents service cannot be reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: access.representations.attachment.downloaded
        resource: access-request
  /v1/access/requests/{requestId}/roster-candidates:
    get:
      tags:
        - officer
      summary: Search the Commission's roster for the officer a request names (access officer; audited)
      description: "By personnel file number (its beginning) or part of the name, at most 20 records by full name. Any can be chosen: an `onboarded` record's declarant is notified online; the officer of one not onboarded is invited to onboard and served a written notice (spec 10 decision 2)."
      operationId: listRosterCandidates
      parameters:
        - name: requestId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: q
          required: true
          in: query
          description: A personnel file number or its beginning, or part of a name (both case-insensitive)
          schema:
            type: string
            minLength: 2
            maxLength: 200
      responses:
        '200':
          description: Records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterCandidates'
        '400':
          description: requestId is not a UUID, or no search of at least 2 characters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            The Commission supervisor reads requests; only its access officer acts

            Requires one of the roles: access-officer, supervisor, eacc-analyst, eacc-supervisor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such request at the caller's Commission (another Commission's, EACC's or anyone else's view)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The directory cannot be reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: access.roster-candidates.listed
        resource: roster-record
  /v1/access/requests/{requestId}/resolve:
    post:
      tags:
        - officer
      summary: Identify the officer on the roster, or record that they cannot be identified
      description: 'A roster record: the declarant is notified next (`awaiting-representations`, with the window for representations). A record whose officer has not onboarded (`declarantOnboarded: false`): they are invited to onboard, and the request waits for the access officer to record the written notice served on them (`recordWrittenNotice`), or for them to onboard. `rosterRecordId: null`: the request closes as `cannot-identify` (`access.request.cannot-identify.v1`, Form M decline reason `other`) and the applicant is told.'
      operationId: resolveRequestedOfficer
      parameters:
        - name: requestId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveOfficer'
      responses:
        '200':
          description: Resolved; the declarant notification follows, or the request is closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficerRequestView'
        '400':
          description: requestId is not a UUID, the body failed validation, or `rosterRecordId` is not a roster record of the Commission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            The Commission supervisor reads requests; only its access officer acts

            Requires one of the roles: access-officer, supervisor, eacc-analyst, eacc-supervisor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such request at the caller's Commission (another Commission's, EACC's or anyone else's view)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Problem code `officer-resolved` (once only), `request-closed` or `request-decided`; or the applicant's identity is still to be verified
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The directory cannot be reached; nothing was recorded
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/access/requests/{requestId}/written-notice:
    post:
      tags:
        - officer
      summary: Record the written notice served on a declarant with no account (r.22(2))
      description: "Spec 10 decision 2: the officer identified has not onboarded, so the access officer serves the notice in writing and records the day (not in the future, not before the officer was identified). The request becomes `awaiting-representations`, notified from the start of that day (`notice.channel` `written`, `access.request.notified.v1`), and the window for representations ends at the end of the seventh day after it. The declarant's representations received in writing are entered with `enterRepresentationsReceivedInWriting`."
      operationId: recordWrittenNotice
      parameters:
        - name: requestId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WrittenNotice'
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficerRequestView'
        '400':
          description: 'requestId is not a UUID, or the body failed validation: `notifiedOn` in the future or before the officer was identified'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            The Commission supervisor reads requests; only its access officer acts

            Requires one of the roles: access-officer, supervisor, eacc-analyst, eacc-supervisor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such request at the caller's Commission (another Commission's, EACC's or anyone else's view)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Problem code `declarant-notified` (notified already, online or in writing), `request-closed` or `request-decided`; or the officer is not identified yet, or has an account (notified online)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/access/requests/{requestId}/representations:
    put:
      tags:
        - officer
      summary: Enter the declarant's representations received in writing, on their behalf
      description: "Spec 10 decision 2: on a request notified in writing, while the window is open, the access officer enters what the declarant answered on paper: stance, text, and the letter's scans (the officer's clean uploads of purpose `access-representation`). They show as received in writing (`representations.receivedInWriting`), with the officer who entered them (`access.request.representations.v1`); `consent` sends the request `under-decision` at once. Entering them again replaces them, as the declarant's own do."
      operationId: enterRepresentationsReceivedInWriting
      parameters:
        - name: requestId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepresentationsInput'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficerRequestView'
        '400':
          description: requestId is not a UUID, the body failed validation, or an attachment is not a clean `access-representation` upload of the caller (`attachments.<n>`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            The Commission supervisor reads requests; only its access officer acts

            Requires one of the roles: access-officer, supervisor, eacc-analyst, eacc-supervisor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such request at the caller's Commission (another Commission's, EACC's or anyone else's view)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Problem code `representations-closed` (the window is closed, or not open yet), `request-closed` or `request-decided`; or the declarant was notified online (they make their own)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The documents service cannot be reached; nothing was saved
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/access/requests/{requestId}/decision:
    post:
      tags:
        - officer
      summary: Grant, partially grant or deny (final; Regulation 24 grounds required for partial and deny)
      description: Only once the request is `under-decision`. A grant is of the requested scope and cites no grounds; a partial grant narrows the scope and cites grounds; a denial cites grounds. The request becomes `granted`, `partially-granted` or `denied` (`access.request.decided.v1` with outcome and grounds). The applicant and the declarant are told next; for a grant the applicant's package (`package.documentId`, downloadable by the applicant from documents until `package.downloadExpiresAt`) follows.
      operationId: decideAccessRequest
      parameters:
        - name: requestId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Client-generated UUID, unique per logical request; reuse on retry
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionInput'
      responses:
        '200':
          description: Decided; notifications and package follow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficerRequestView'
        '400':
          description: requestId is not a UUID or the body failed validation; problem code `grounds-required` (partial grant or denial without grounds) or `scope-exceeds-request` (`grantedScope` wider than the request); `errors` name the field
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            The Commission supervisor reads requests; only its access officer acts

            Requires one of the roles: access-officer, supervisor, eacc-analyst, eacc-supervisor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such request at the caller's Commission (another Commission's, EACC's or anyone else's view)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Problem code `request-decided` (a decision is final), `request-closed`, or `not-under-decision` (the window for representations is still open, or the officer is unresolved)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/access/requests/{requestId}/verify-applicant:
    post:
      tags:
        - officer
      summary: Record manual verification of a passport applicant
      description: "The access officer of the request's Commission checked the particulars a passport applicant entered. Verified: the directory records the applicant's identity as verified, and the request goes from `pending-applicant-verification` to `submitted` (`access.request.verified.v1`). Not verified: the check is recorded and the request stays held."
      operationId: verifyApplicantIdentity
      parameters:
        - name: requestId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
