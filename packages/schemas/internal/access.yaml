# Generated by `pnpm --filter @adili/access contracts` from the access service: do not edit.
openapi: 3.1.0
info:
  title: access API
  description: Form K and law enforcement access requests, representations, decisions and grants.
  version: '1'
servers:
  - url: /
    description: The service that serves this document
paths:
  /v1/access/commissions:
    get:
      tags:
        - applicant
      summary: Commissions an applicant can address, with the declaration years available
      description: "Every active Responsible Commission in the directory, by name. `years` are the statement-date years a Form K's scope can ask of it: from the year it joined Adili (its earliest obligations-start date, not before 2025) to the current year in Nairobi; empty while it holds no declarations yet. Platform reference data: no personal data."
      operationId: listAccessCommissions
      responses:
        '200':
          description: Commissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessCommission'
        '403':
          description: |-
            Not an applicant

            Requires one of the roles: applicant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: 'Problem type `directory-unavailable`: the directory cannot be reached'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/access/requests:
    post:
      tags:
        - applicant
      summary: Submit Form K (applicant); allocates the ARQ reference and acknowledges
      description: The request is `submitted`, or `pending-applicant-verification` while the applicant's identity is pending in the directory (a passport holder no access officer has verified yet). The acknowledgement (email and SMS, with the reference) follows from the `access.request.received.v1` event.
      operationId: submitAccessRequest
      parameters:
        - name: Idempotency-Key
          in: header
          description: Client-generated UUID, unique per logical request; reuse on retry
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormK'
      responses:
        '201':
          description: Received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
        '400':
          description: Not a valid form-k.v1 document (`errors` name the paths), or no such Responsible Commission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            Problem code `no-applicant-record`: the account has no applicant person record

            Requires one of the roles: applicant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The directory or the key service cannot be reached; nothing was stored
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    get:
      tags:
        - applicant
      summary: The applicant's requests, latest first
      description: Their own only. Each timeline leaves out the declarant's representations and names no actor but the applicant.
      operationId: listMyAccessRequests
      responses:
        '200':
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessRequest'
        '403':
          description: |-
            Not an applicant, or problem code `no-applicant-record`

            Requires one of the roles: applicant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The key service cannot be reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/access/requests/{requestId}:
    get:
      tags:
        - applicant
      summary: One request with decision and package status (applicant)
      operationId: getMyAccessRequest
      parameters:
        - name: requestId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
        '400':
          description: requestId is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            Not an applicant, or problem code `no-applicant-record`

            Requires one of the roles: applicant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such request of the applicant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The key service cannot be reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/access/requests/{requestId}/withdraw:
    post:
      tags:
        - applicant
      summary: Withdraw before a decision
      description: Any status before a decision becomes `withdrawn`, recorded in the access register (`access.request.withdrawn.v1`).
      operationId: withdrawAccessRequest
      parameters:
        - name: requestId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
        '400':
          description: requestId is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            Not an applicant, or problem code `no-applicant-record`

            Requires one of the roles: applicant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such request of the applicant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Problem code `request-decided` (a decision is final) or `request-closed` (withdrawn already, or the officer could not be identified)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/access/requests:
    get:
      tags:
        - officer
      summary: Queue of access requests with deadlines (access officer; supervisor reads)
      description: 'Form K requests (30-day deadline) and law enforcement requests (14-day deadline) together, or one `kind`; earliest decision deadline first. `late`: past the deadline and neither decided nor closed (for a law enforcement request, the breach flag).'
      operationId: listCommissionAccessRequests
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: status
          required: false
          in: query
          description: 'Only requests in these statuses, comma-separated, of either kind (e.g. the open ones: `submitted,pending-applicant-verification,officer-unresolved,awaiting-representations,under-decision,received,verified`)'
          schema:
            type: string
        - name: kind
          required: false
          in: query
          description: Only Form K or only LEA requests
          schema:
            type: string
            enum:
              - form-k
              - lea
        - name: cursor
          required: false
          in: query
          description: '`nextCursor` of the previous page; omit for the first page'
          schema:
            type: string
            maxLength: 500
        - name: limit
          required: false
          in: query
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuePage'
        '400':
          description: Query failed validation, or an unknown cursor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'Requires one of the roles: access-officer, supervisor, eacc-analyst, eacc-supervisor'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not the caller's Commission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/access/requests/{requestId}/officer:
    get:
      tags:
        - officer
      summary: Full request for the access officer (Form K, representations, register)
      operationId: getAccessRequestForOfficer
      parameters:
        - name: requestId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficerRequestView'
        '400':
          description: requestId is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'Requires one of the roles: access-officer, supervisor, eacc-analyst, eacc-supervisor'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such request at the caller's Commission (another Commission's, EACC's or anyone else's view)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The key service cannot be reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/access/requests/{requestId}/roster-candidates:
    get:
      tags:
        - officer
      summary: Search the Commission's roster for the officer a request names (access officer)
      description: 'By personnel file number (its beginning) or part of the name, at most 20 records by full name. Only an `onboarded` record can be chosen: its declarant is notified.'
      operationId: listRosterCandidates
      parameters:
        - name: requestId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: q
          required: true
          in: query
          description: A personnel file number or its beginning, or part of a name (both case-insensitive)
          schema:
            type: string
            minLength: 2
            maxLength: 200
      responses:
        '200':
          description: Records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterCandidates'
        '400':
          description: requestId is not a UUID, or no search of at least 2 characters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            The Commission supervisor reads requests; only its access officer acts

            Requires one of the roles: access-officer, supervisor, eacc-analyst, eacc-supervisor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such request at the caller's Commission (another Commission's, EACC's or anyone else's view)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The directory cannot be reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/access/requests/{requestId}/resolve:
    post:
      tags:
        - officer
      summary: Identify the officer on the roster, or record that they cannot be identified
      description: 'A roster record: the declarant is notified next (`awaiting-representations`, with the window for representations). `rosterRecordId: null`: the request closes as `cannot-identify` (`access.request.cannot-identify.v1`, Form M decline reason `other`) and the applicant is told.'
      operationId: resolveRequestedOfficer
      parameters:
        - name: requestId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveOfficer'
      responses:
        '200':
          description: Resolved; the declarant notification follows, or the request is closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficerRequestView'
        '400':
          description: requestId is not a UUID, the body failed validation, or `rosterRecordId` is not an onboarded roster record of the Commission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            The Commission supervisor reads requests; only its access officer acts

            Requires one of the roles: access-officer, supervisor, eacc-analyst, eacc-supervisor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such request at the caller's Commission (another Commission's, EACC's or anyone else's view)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Problem code `officer-resolved` (once only), `request-closed` or `request-decided`; or the applicant's identity is still to be verified
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The directory cannot be reached; nothing was recorded
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/access/requests/{requestId}/decision:
    post:
      tags:
        - officer
      summary: Grant, partially grant or deny (final; Regulation 24 grounds required for partial and deny)
      description: Only once the request is `under-decision`. A grant is of the requested scope and cites no grounds; a partial grant narrows the scope and cites grounds; a denial cites grounds. The request becomes `granted`, `partially-granted` or `denied` (`access.request.decided.v1` with outcome and grounds). The applicant and the declarant are told next; for a grant the applicant's package (`package.documentId`, downloadable by the applicant from documents until `package.downloadExpiresAt`) follows.
      operationId: decideAccessRequest
      parameters:
        - name: requestId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Client-generated UUID, unique per logical request; reuse on retry
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionInput'
      responses:
        '200':
          description: Decided; notifications and package follow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficerRequestView'
        '400':
          description: requestId is not a UUID or the body failed validation; problem code `grounds-required` (partial grant or denial without grounds) or `scope-exceeds-request` (`grantedScope` wider than the request); `errors` name the field
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            The Commission supervisor reads requests; only its access officer acts

            Requires one of the roles: access-officer, supervisor, eacc-analyst, eacc-supervisor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such request at the caller's Commission (another Commission's, EACC's or anyone else's view)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Problem code `request-decided` (a decision is final), `request-closed`, or `not-under-decision` (the window for representations is still open, or the officer is unresolved)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/access/requests/{requestId}/verify-applicant:
    post:
      tags:
        - officer
      summary: Record manual verification of a passport applicant
      description: "The access officer of the request's Commission checked the particulars a passport applicant entered. Verified: the directory records the applicant's identity as verified, and the request goes from `pending-applicant-verification` to `submitted` (`access.request.verified.v1`). Not verified: the check is recorded and the request stays held."
      operationId: verifyApplicantIdentity
      parameters:
        - name: requestId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyApplicantIdentity'
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficerRequestView'
        '400':
          description: requestId is not a UUID, or the body failed validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            The Commission supervisor reads requests; only its access officer acts

            Requires one of the roles: access-officer, supervisor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such request at the Commission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: "Problem code `not-pending-verification`: the request is not waiting for the applicant's identity"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The directory cannot be reached; nothing was recorded
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/lea/requests:
    post:
      tags:
        - lea
      summary: Law enforcement officer submits a written request (no Form K); allocates the LEA reference
      description: From a provisioned, active officer account (role `law-enforcement`, tenant `lea`, the token's `person_id` an officer of an agency in the directory). The request is `received` (`lea.request.received.v1`) with its fourteen-day deadline; the declarant is not told (only after a grant, r.23(2)).
      operationId: submitLeaRequest
      parameters:
        - name: Idempotency-Key
          in: header
          description: Client-generated UUID, unique per logical request; reuse on retry
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaRequestInput'
      responses:
        '201':
          description: Received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaRequest'
        '400':
          description: The body failed validation (`errors` name the fields), or no such Responsible Commission (`commission`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            Not a law enforcement officer account, or not an active one of an agency in the directory

            Requires one of the roles: law-enforcement
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The directory or Temporal cannot be reached; nothing was stored
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    get:
      tags:
        - lea
      summary: The officer's requests, latest first
      description: Their own only, across Commissions. Each timeline names no actor but the officer.
      operationId: listMyLeaRequests
      responses:
        '200':
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaRequest'
        '403':
          description: |-
            Not a law enforcement officer account

            Requires one of the roles: law-enforcement
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/lea/requests/{leaRequestId}:
    get:
      tags:
        - lea
      summary: One request (the officer who filed it, or the Commission's access officer)
      description: The officer who filed it sees it with only their own name on the timeline; the Commission's access officer and supervisor see it whole. The package (`package.documentId`) is downloaded by the filing officer from documents until `package.downloadExpiresAt`.
      operationId: getLeaRequest
      parameters:
        - name: leaRequestId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaRequest'
        '400':
          description: leaRequestId is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            A law enforcement account without an officer record

            Requires one of the roles: law-enforcement, access-officer, supervisor, eacc-analyst, eacc-supervisor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such request of the caller's (another officer's, another Commission's, EACC's or anyone else's view)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/lea/requests/{leaRequestId}/verify:
    post:
      tags:
        - lea
        - officer
      summary: Access officer records the provenance and reason check and identifies the officer
      description: "r.23(1): the access officer confirms the request comes from the agency account it shows (checked again against the directory) and states its reason, and identifies the officer sought on the Commission's roster. The request becomes `verified` (`lea.request.verified.v1`)."
      operationId: verifyLeaRequest
      parameters:
        - name: leaRequestId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyLeaRequest'
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaRequest'
        '400':
          description: leaRequestId is not a UUID, the body failed validation, or `rosterRecordId` is not an onboarded roster record of the Commission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            The Commission supervisor reads requests; only its access officer acts

            Requires one of the roles: access-officer, supervisor, eacc-analyst, eacc-supervisor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such request of the caller's (another officer's, another Commission's, EACC's or anyone else's view)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Problem code `officer-resolved` (verified already), `request-decided` or `request-closed`; or the account the request came from is no longer an active officer account of its agency
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The directory cannot be reached; nothing was recorded
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/lea/requests/{leaRequestId}/decision:
    post:
      tags:
        - lea
        - officer
      summary: Grant (package, declarant notified after) or deny with reasons (final)
      description: "As for Form K: a grant is of the requested scope and cites no grounds; a partial grant narrows it and cites Regulation 24 grounds; a denial cites grounds. A grant or partial grant needs the request `verified`; a denial may be decided before. The request becomes `granted` (in full or in part: see `decision.outcome`) or `denied` (`lea.request.decided.v1`). The agency's officer is told next; after a grant the declarant is told (r.23(2)) and the officer's package (`act-s36-2`) follows."
      operationId: decideLeaRequest
      parameters:
        - name: leaRequestId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Client-generated UUID, unique per logical request; reuse on retry
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionInput'
      responses:
        '200':
          description: Decided; notices and package follow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaRequest'
        '400':
          description: leaRequestId is not a UUID or the body failed validation; problem code `grounds-required` or `scope-exceeds-request`; `errors` name the field
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            The Commission supervisor reads requests; only its access officer acts

            Requires one of the roles: access-officer, supervisor, eacc-analyst, eacc-supervisor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such request of the caller's (another officer's, another Commission's, EACC's or anyone else's view)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Problem code `request-decided` (a decision is final), `request-closed`, or `not-under-decision` (a grant before the request is verified)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/me/access-notices:
    get:
      tags:
        - declarant
      summary: Requests the declarant has been notified about, with windows and outcomes
      description: 'Their own only, latest notified first: Form K requests from notification on; law enforcement requests (kind `lea`, with `agency` and `caseReference`, no representations) only once granted and the declarant told (r.23(2)).'
      operationId: listMyAccessNotices
      responses:
        '200':
          description: Notices
          content:
            application/json:
              schema:
                type: array
