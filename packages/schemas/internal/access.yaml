# Generated by `pnpm --filter @adili/access contracts`: do not edit.
# Implemented operations come from the access service; operations marked `x-draft` come
# from packages/schemas/drafts/access.yaml until they are implemented.
openapi: 3.1.0
info:
  title: access API
  description: Form K and law enforcement access requests, representations, decisions and grants.
  version: '1'
servers:
  - url: /
    description: The service that serves this document
paths:
  /v1/access/requests:
    post:
      tags:
        - applicant
      summary: Submit Form K (applicant); allocates the ARQ reference and acknowledges
      description: The request is `submitted`, or `pending-applicant-verification` while the applicant's identity is pending in the directory (a passport holder no access officer has verified yet). The acknowledgement (email and SMS, with the reference) follows from the `access.request.received.v1` event.
      operationId: submitAccessRequest
      parameters:
        - name: Idempotency-Key
          in: header
          description: Client-generated UUID, unique per logical request; reuse on retry
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormK'
      responses:
        '201':
          description: Received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
        '400':
          description: Not a valid form-k.v1 document (`errors` name the paths), or no such Responsible Commission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            Problem code `no-applicant-record`: the account has no applicant person record

            Requires one of the roles: applicant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The directory or the key service cannot be reached; nothing was stored
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    get:
      tags:
        - applicant
      summary: The applicant's requests, latest first
      description: Their own only. Each timeline leaves out the declarant's representations and names no actor but the applicant.
      operationId: listMyAccessRequests
      responses:
        '200':
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessRequest'
        '403':
          description: |-
            Not an applicant, or problem code `no-applicant-record`

            Requires one of the roles: applicant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The key service cannot be reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/access/requests/{requestId}:
    get:
      tags:
        - applicant
      summary: One request with decision and package status (applicant)
      operationId: getMyAccessRequest
      parameters:
        - name: requestId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
        '400':
          description: requestId is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            Not an applicant, or problem code `no-applicant-record`

            Requires one of the roles: applicant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such request of the applicant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The key service cannot be reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/access/requests/{requestId}/withdraw:
    post:
      tags:
        - applicant
      summary: Withdraw before a decision
      description: Any status before a decision becomes `withdrawn`, recorded in the access register (`access.request.withdrawn.v1`).
      operationId: withdrawAccessRequest
      parameters:
        - name: requestId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
        '400':
          description: requestId is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            Not an applicant, or problem code `no-applicant-record`

            Requires one of the roles: applicant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such request of the applicant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Problem code `request-decided` (a decision is final) or `request-closed` (withdrawn already, or the officer could not be identified)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/access/requests:
    get:
      tags:
        - officer
      summary: Queue of access requests with deadlines (access officer; supervisor reads)
      description: 'Earliest decision deadline first. `late`: past the deadline and neither decided nor closed. Law enforcement requests join the queue with their own workspace (`kind=lea` is empty until then).'
      operationId: listCommissionAccessRequests
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: status
          required: false
          in: query
          description: 'Only requests in these statuses, comma-separated (e.g. the open ones: `submitted,pending-applicant-verification,officer-unresolved,awaiting-representations,under-decision`)'
          schema:
            type: string
        - name: kind
          required: false
          in: query
          description: Only Form K or only LEA requests
          schema:
            type: string
            enum:
              - form-k
              - lea
        - name: cursor
          required: false
          in: query
          description: '`nextCursor` of the previous page; omit for the first page'
          schema:
            type: string
            maxLength: 500
        - name: limit
          required: false
          in: query
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuePage'
        '400':
          description: Query failed validation, or an unknown cursor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'Requires one of the roles: access-officer, supervisor, eacc-analyst, eacc-supervisor'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not the caller's Commission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/access/requests/{requestId}/officer:
    get:
      tags:
        - officer
      summary: Full request for the access officer (Form K, representations, register)
      operationId: getAccessRequestForOfficer
      parameters:
        - name: requestId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficerRequestView'
        '400':
          description: requestId is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'Requires one of the roles: access-officer, supervisor, eacc-analyst, eacc-supervisor'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such request at the caller's Commission (another Commission's, EACC's or anyone else's view)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The key service cannot be reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/access/requests/{requestId}/roster-candidates:
    get:
      tags:
        - officer
      summary: Search the Commission's roster for the officer a request names (access officer)
      description: 'By personnel file number (its beginning) or part of the name, at most 20 records by full name. Only an `onboarded` record can be chosen: its declarant is notified.'
      operationId: listRosterCandidates
      parameters:
        - name: requestId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: q
          required: true
          in: query
          description: A personnel file number or its beginning, or part of a name (both case-insensitive)
          schema:
            type: string
            minLength: 2
            maxLength: 200
      responses:
        '200':
          description: Records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterCandidates'
        '400':
          description: requestId is not a UUID, or no search of at least 2 characters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            The Commission supervisor reads requests; only its access officer acts

            Requires one of the roles: access-officer, supervisor, eacc-analyst, eacc-supervisor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such request at the caller's Commission (another Commission's, EACC's or anyone else's view)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The directory cannot be reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/access/requests/{requestId}/resolve:
    post:
      tags:
        - officer
      summary: Identify the officer on the roster, or record that they cannot be identified
      description: 'A roster record: the declarant is notified next (`awaiting-representations`, with the window for representations). `rosterRecordId: null`: the request closes as `cannot-identify` (`access.request.cannot-identify.v1`, Form M decline reason `other`) and the applicant is told.'
      operationId: resolveRequestedOfficer
      parameters:
        - name: requestId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveOfficer'
      responses:
        '200':
          description: Resolved; the declarant notification follows, or the request is closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficerRequestView'
        '400':
          description: requestId is not a UUID, the body failed validation, or `rosterRecordId` is not an onboarded roster record of the Commission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            The Commission supervisor reads requests; only its access officer acts

            Requires one of the roles: access-officer, supervisor, eacc-analyst, eacc-supervisor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such request at the caller's Commission (another Commission's, EACC's or anyone else's view)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Problem code `officer-resolved` (once only), `request-closed` or `request-decided`; or the applicant's identity is still to be verified
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The directory cannot be reached; nothing was recorded
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/access/requests/{requestId}/verify-applicant:
    post:
      tags:
        - officer
      summary: Record manual verification of a passport applicant
      description: "The access officer of the request's Commission checked the particulars a passport applicant entered. Verified: the directory records the applicant's identity as verified, and the request goes from `pending-applicant-verification` to `submitted` (`access.request.verified.v1`). Not verified: the check is recorded and the request stays held."
      operationId: verifyApplicantIdentity
      parameters:
        - name: requestId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyApplicantIdentity'
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficerRequestView'
        '400':
          description: requestId is not a UUID, or the body failed validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            The Commission supervisor reads requests; only its access officer acts

            Requires one of the roles: access-officer, supervisor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such request at the Commission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: "Problem code `not-pending-verification`: the request is not waiting for the applicant's identity"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The directory cannot be reached; nothing was recorded
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/me/access-notices:
    get:
      tags:
        - declarant
      summary: Requests the declarant has been notified about, with windows and outcomes
      description: Their own only, from notification on; latest notified first.
      operationId: listMyAccessNotices
      responses:
        '200':
          description: Notices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeclarantNotice'
        '403':
          description: 'Requires one of the roles: declarant'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not a declarant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The key service cannot be reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/me/access-notices/{requestId}/representations:
    put:
      tags:
        - declarant
      summary: Create or update representations within the window
      description: One submission per request, changed as often as needed until the window closes (`access.request.representations.v1` each time). `consent` puts the request under decision at once and closes the window.
      operationId: submitRepresentations
      parameters:
        - name: requestId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepresentationsInput'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclarantNotice'
        '400':
          description: requestId is not a UUID, the body failed validation, or an attachment is not a clean `access-representation` upload of the declarant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'Requires one of the roles: declarant'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such request about the declarant that they were notified of
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: 'Problem code `representations-closed`: the window has closed (or the declarant consented, or the request closed)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Documents or the key service cannot be reached; nothing was saved
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/access/commissions:
    get:
      tags:
        - applicant
      summary: Commissions an applicant can address, with the declaration years available
      operationId: listAccessCommissions
      x-draft: true
      responses:
        '200':
          description: Commissions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - slug
                    - name
                    - years
                  properties:
                    slug:
                      type: string
                    name:
                      type: string
                    years:
                      type: array
                      items:
                        type: integer
  /v1/access/requests/{requestId}/package/download:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags:
        - applicant
      summary: Short-lived link to the granted package (registered as a download)
      operationId: downloadAccessPackage
      x-draft: true
      responses:
        '200':
          description: Link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadLink'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Download window expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/me/access-history:
    get:
      tags:
        - declarant
      summary: Who accessed my declaration (register entries visible to the declarant)
      operationId: getMyAccessHistory
      x-draft: true
      responses:
        '200':
          description: Entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegisterEntry'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/me/certified-copies:
    post:
      tags:
        - declarant
      summary: Certified copy of one of my submitted versions
      operationId: requestCertifiedCopy
      x-draft: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - declarationId
                - version
              properties:
                declarationId:
                  type: string
                  format: uuid
                version:
                  type: integer
                  minimum: 1
      responses:
        '202':
          description: Issuance requested; poll the copy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertifiedCopy'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags:
        - declarant
      summary: My certified copies with download links
      operationId: listMyCertifiedCopies
      x-draft: true
      responses:
        '200':
          description: Copies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CertifiedCopy'
  /v1/access/requests/{requestId}/decision:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags:
        - officer
      summary: Grant, partially grant or deny (final; Regulation 24 grounds required for partial and deny)
      operationId: decideAccessRequest
      x-draft: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionInput'
      responses:
        '200':
          description: Decided; notifications and package follow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficerRequestView'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already decided or not yet under decision
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/lea/requests:
    post:
      tags:
        - lea
      summary: Law-enforcement officer submits a written request (no Form K); allocates the LEA reference
      operationId: submitLeaRequest
      x-draft: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaRequestInput'
      responses:
        '201':
          description: Received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaRequest'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags:
        - lea
      summary: The officer's requests
      operationId: listMyLeaRequests
      x-draft: true
      responses:
        '200':
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaRequest'
  /v1/lea/requests/{leaRequestId}:
    parameters:
      - $ref: '#/components/parameters/LeaRequestId'
    get:
      tags:
        - lea
      summary: One request (officer who filed it, or the Commission's access officer)
      operationId: getLeaRequest
      x-draft: true
      responses:
        '200':
          description: Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/lea/requests/{leaRequestId}/verify:
    parameters:
      - $ref: '#/components/parameters/LeaRequestId'
    post:
      tags:
        - officer
      summary: Access officer records the provenance and reason check and resolves the officer
      operationId: verifyLeaRequest
      x-draft: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rosterRecordId
                - note
              properties:
                rosterRecordId:
                  type:
                    - string
                    - 'null'
                  format: uuid
                note:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/lea/requests/{leaRequestId}/decision:
    parameters:
      - $ref: '#/components/parameters/LeaRequestId'
    post:
      tags:
        - officer
      summary: Grant (package, declarant notified after) or deny with reasons
      operationId: decideLeaRequest
      x-draft: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionInput'
      responses:
        '200':
          description: Decided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already decided
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/lea/requests/{leaRequestId}/package/download:
    parameters:
      - $ref: '#/components/parameters/LeaRequestId'
    get:
      tags:
        - lea
      summary: Short-lived link to the granted package (registered)
      operationId: downloadLeaPackage
      x-draft: true
      responses:
        '200':
          description: Link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadLink'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Download window expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    AccessRequestStatus:
      type: string
      enum:
        - submitted
        - pending-applicant-verification
        - officer-unresolved
        - awaiting-representations
        - under-decision
        - granted
        - partially-granted
        - denied
        - cannot-identify
        - withdrawn
    Outcome:
      type: string
      enum:
        - grant
        - partial-grant
        - deny
    Ground:
      type: string
      enum:
        - public-interest
        - prejudice-proceeding
        - frivolous-vexatious
        - not-objectives
      description: Regulation 24
    Section:
      type: string
      enum:
        - bio
        - income
        - assets
        - liabilities
        - other
    Scope:
      type: object
      properties:
        years:
          minItems: 1
          maxItems: 50
          type: array
          items:
            type: integer
            minimum: 2025
        includeSpouses:
          type: boolean
        includeChildren:
          type: boolean
        sections:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/Section'
        includeClarifications:
          type: boolean
      required:
        - years
        - includeSpouses
        - includeChildren
        - sections
        - includeClarifications
    Decision:
      type: object
      properties:
        outcome:
          $ref: '#/components/schemas/Outcome'
        grantedScope:
          anyOf:
            - $ref: '#/components/schemas/Scope'
            - type: 'null'
        grounds:
          type: array
          items:
            $ref: '#/components/schemas/Ground'
        reasons:
          type: string
        decidedBy:
          type: object
          properties:
            subject:
              type: string
            name:
              type: string
          required:
            - subject
            - name
        decidedAt:
          type: string
          format: date-time
      required:
        - outcome
        - grantedScope
        - grounds
        - reasons
        - decidedBy
        - decidedAt
    Package:
      type: object
      properties:
        documentId:
          type: string
          format: uuid
        verificationId:
          type: string
        issuedAt:
          type: string
          format: date-time
        downloadExpiresAt:
          type: string
          format: date-time
        downloads:
          type: integer
          minimum: 0
      required:
        - documentId
        - verificationId
        - issuedAt
        - downloadExpiresAt
        - downloads
    FormK:
      type: object
      propertyNames:
        type: string
      additionalProperties: {}
      description: A form-k.v1 document (packages/schemas/forms/form-k.v1.json)
    AccessRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          description: ARQ-<ISSUER>-<YEAR>-<seq>-<check>
        commission:
          type: object
          properties:
            slug:
              type: string
            name:
              type: string
          required:
            - slug
            - name
        status:
          $ref: '#/components/schemas/AccessRequestStatus'
        formK:
          description: The form-k.v1 document as submitted
          $ref: '#/components/schemas/FormK'
        submittedAt:
          type: string
          format: date-time
        decisionDeadlineAt:
          type: string
          format: date-time
        decision:
          anyOf:
            - $ref: '#/components/schemas/Decision'
            - type: 'null'
        package:
          anyOf:
            - $ref: '#/components/schemas/Package'
            - type: 'null'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/RegisterEntry'
      required:
        - id
        - reference
        - commission
        - status
        - formK
        - submittedAt
        - decisionDeadlineAt
        - decision
        - package
        - timeline
    RegisterEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - received
            - verified
            - notified
            - representations
            - decided
            - package-issued
            - downloaded
            - expired
            - withdrawn
            - cannot-identify
            - self-access
        at:
          type: string
          format: date-time
        actor:
          type:
            - string
            - 'null'
        summary:
          type: string
        reference:
          type: string
      required:
        - id
        - kind
        - at
        - actor
        - summary
        - reference
    Representations:
      type: object
      properties:
        stance:
          type: string
          enum:
            - object
            - consent
            - context
        text:
          type: string
        attachments:
          type: array
          items:
            type: object
            properties:
              uploadId:
                type: string
                format: uuid
              fileName:
                type: string
            required:
              - uploadId
              - fileName
        submittedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - stance
        - text
        - attachments
        - submittedAt
        - updatedAt
    OfficerRequestView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          description: ARQ-<ISSUER>-<YEAR>-<seq>-<check>
        commission:
          type: object
          properties:
            slug:
              type: string
            name:
              type: string
          required:
            - slug
            - name
        status:
          $ref: '#/components/schemas/AccessRequestStatus'
        formK:
          description: The form-k.v1 document as submitted
          $ref: '#/components/schemas/FormK'
        submittedAt:
          type: string
          format: date-time
        decisionDeadlineAt:
          type: string
          format: date-time
        decision:
          anyOf:
            - $ref: '#/components/schemas/Decision'
            - type: 'null'
        package:
          anyOf:
            - $ref: '#/components/schemas/Package'
            - type: 'null'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/RegisterEntry'
        applicantIdentityStatus:
          type: string
          enum:
            - verified
            - pending-verification
        resolvedRosterRecordId:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        representations:
          anyOf:
            - $ref: '#/components/schemas/Representations'
            - type: 'null'
        windowEndsAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
      required:
        - id
        - reference
        - commission
        - status
        - formK
        - submittedAt
        - decisionDeadlineAt
        - decision
        - package
        - timeline
        - applicantIdentityStatus
        - resolvedRosterRecordId
        - representations
        - windowEndsAt
    VerifyApplicantIdentity:
      type: object
      properties:
        verified:
          type: boolean
        note:
          type: string
          minLength: 1
          maxLength: 1000
      required:
        - verified
        - note
      additionalProperties: false
    QueueItem:
      type: object
      properties:
        kind:
          type: string
          enum:
            - form-k
            - lea
        id:
          type: string
          format: uuid
        reference:
          type: string
        applicantOrAgency:
          type: string
        officerSought:
          type: string
        resolvedName:
          type:
            - string
            - 'null'
        status:
          $ref: '#/components/schemas/AccessRequestStatus'
        submittedAt:
          type: string
          format: date-time
        deadlineAt:
          type: string
          format: date-time
        windowEndsAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        late:
          type: boolean
      required:
        - kind
        - id
        - reference
        - applicantOrAgency
        - officerSought
        - resolvedName
        - status
        - submittedAt
        - deadlineAt
        - windowEndsAt
        - late
    QueuePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/QueueItem'
        nextCursor:
          description: Pass as `cursor` for the next page; null on the last page
          type:
            - string
            - 'null'
      required:
        - items
        - nextCursor
    ResolveOfficer:
      type: object
      properties:
        rosterRecordId:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          description: 'The roster record of the Commission the officer named in Part II is (an onboarded one: the declarant is notified); null records that they cannot be identified, which closes the request'
      required:
        - rosterRecordId
      additionalProperties: false
    RosterCandidate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        personnelFileNumber:
          type: string
        fullName:
          type: string
        designation:
          type:
            - string
            - 'null'
        reportingEntity:
          description: Its name
          type:
            - string
            - 'null'
        state:
          type: string
          description: 'The roster record state: not_onboarded, onboarded, exited'
        onboarded:
          type: boolean
      required:
        - id
        - personnelFileNumber
        - fullName
        - designation
        - reportingEntity
        - state
        - onboarded
    RosterCandidates:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RosterCandidate'
          description: By full name, at most 20
      required:
        - items
    RepresentationsInput:
      type: object
      properties:
        stance:
          type: string
          enum:
            - object
            - consent
            - context
          description: '`object` to the disclosure, `consent` to it (the request goes under decision at once), or add `context`'
        text:
          type: string
          maxLength: 8000
          description: The declarant's representations; may be empty only with `consent`
        attachments:
          maxItems: 10
          type: array
          items:
            type: string
            format: uuid
          description: Clean uploads of purpose `access-representation` by the declarant
      required:
        - stance
        - text
        - attachments
      additionalProperties: false
    DeclarantNotice:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        reference:
          type: string
        kind:
          type: string
          enum:
            - form-k
            - lea
        commission:
          type: object
          properties:
            slug:
              type: string
            name:
              type: string
          required:
            - slug
            - name
        status:
          $ref: '#/components/schemas/AccessRequestStatus'
        applicantName:
          type: string
        purposeInGeneralTerms:
          type: string
        scope:
          $ref: '#/components/schemas/Scope'
        notifiedAt:
          type: string
          format: date-time
        windowEndsAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        canRespond:
          type: boolean
        representations:
          anyOf:
            - $ref: '#/components/schemas/Representations'
            - type: 'null'
        decision:
          anyOf:
            - $ref: '#/components/schemas/Decision'
            - type: 'null'
      required:
        - requestId
        - reference
        - kind
        - commission
        - status
        - applicantName
        - purposeInGeneralTerms
        - scope
        - notifiedAt
        - windowEndsAt
        - canRespond
        - representations
        - decision
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
            - database-unavailable
            - rate-limit-exceeded
            - no-match
            - already-onboarded
            - no-roster
            - otp-invalid
            - otp-expired
            - resend-cooldown
            - otp-send-failed
            - wrong-step
            - session-expired
            - iprs-unavailable
            - identity-unavailable
            - email-in-use
            - identity-mismatch
            - step-up-required
            - incomplete
            - before-statement-date
            - amendment-window-closed
            - not-a-draft
            - not-submitted
            - obligation-cancelled
            - acknowledgement-issued
            - acknowledgement-in-progress
            - no-applicant-record
            - request-decided
            - request-closed
            - officer-resolved
            - not-under-decision
            - not-pending-verification
            - representations-closed
            - download-expired
            - scope-exceeds-request
            - grounds-required
          description: Machine-readable cause, from the platform registry; clients map it to copy and never show `title` or `detail`
        detail:
          type: string
        instance:
          type: string
        errors:
          description: Field-level errors; `path` is the dotted request field
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - path
              - message
      required:
        - type
        - title
        - status
    LeaRequestStatus:
      type: string
      enum:
        - received
        - verified
        - granted
        - denied
        - withdrawn
    DecisionInput:
      type: object
      required:
        - outcome
        - reasons
      properties:
        outcome:
          $ref: '#/components/schemas/Outcome'
        grantedScope:
          oneOf:
            - $ref: '#/components/schemas/Scope'
            - type: 'null'
          description: Required for partial-grant; must be a subset of the requested scope
        grounds:
          type: array
          items:
            $ref: '#/components/schemas/Ground'
          description: Required for partial-grant and deny
        reasons:
          type: string
          minLength: 1
          maxLength: 4000
    CertifiedCopy:
      type: object
      required:
        - id
        - declarationId
        - version
        - status
        - documentId
        - verificationId
        - downloadUrl
        - requestedAt
      properties:
        id:
          type: string
          format: uuid
        declarationId:
          type: string
          format: uuid
        version:
          type: integer
        status:
          type: string
          enum:
            - pending
            - issued
            - failed
        documentId:
          type:
            - string
            - 'null'
          format: uuid
        verificationId:
          type:
            - string
            - 'null'
        downloadUrl:
          type:
            - string
            - 'null'
          format: uri
        requestedAt:
          type: string
          format: date-time
    LeaRequestInput:
      type: object
      required:
        - commission
        - officerSought
        - reason
        - caseReference
        - scope
      properties:
        commission:
          type: string
        officerSought:
          type: object
          required:
            - name
          properties:
            name:
              type: string
            entity:
              type: string
            workStation:
              type: string
            personnelFileNumber:
              type: string
        reason:
          type: string
          minLength: 1
          maxLength: 4000
        caseReference:
          type: string
          maxLength: 100
        scope:
          $ref: '#/components/schemas/Scope'
    LeaRequest:
      type: object
      required:
        - id
        - reference
        - commission
        - agency
        - officer
        - officerSought
        - reason
        - caseReference
        - scope
        - status
        - receivedAt
        - deadlineAt
        - verification
        - decision
        - package
        - timeline
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          description: LEA-<ISSUER>-<YEAR>-<seq>-<check>
        commission:
          type: object
          required:
            - slug
            - name
          properties:
            slug:
              type: string
            name:
              type: string
        agency:
          type: object
          required:
            - code
            - name
          properties:
            code:
              type: string
            name:
              type: string
        officer:
          type: object
          required:
            - subject
            - name
          properties:
            subject:
              type: string
            name:
              type: string
        officerSought:
          type: object
          additionalProperties: true
        reason:
          type: string
        caseReference:
          type: string
        scope:
          $ref: '#/components/schemas/Scope'
        status:
          $ref: '#/components/schemas/LeaRequestStatus'
        receivedAt:
          type: string
          format: date-time
        deadlineAt:
          type: string
          format: date-time
        verification:
          oneOf:
            - type: object
              required:
                - by
                - at
                - note
              properties:
                by:
                  type: string
                at:
                  type: string
                  format: date-time
                note:
                  type: string
            - type: 'null'
        decision:
          oneOf:
            - $ref: '#/components/schemas/Decision'
            - type: 'null'
        package:
          oneOf:
            - $ref: '#/components/schemas/Package'
            - type: 'null'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/RegisterEntry'
    DownloadLink:
      type: object
      required:
        - downloadUrl
        - expiresAt
        - sha256
      properties:
        downloadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
        sha256:
          type: string
  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LeaRequestId:
      name: leaRequestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
  responses:
    NotFound:
      description: Not found, or not visible to the caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Caller lacks the required role
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationProblem:
      description: Request failed validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
security:
  - bearer: []
