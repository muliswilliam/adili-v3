  /v1/commissions/{slug}/access/self-access:
    post:
      tags:
        - officer
      summary: Record a written self-access application and issue its certified copy
      description: The declarant's identity check, and for a representative their name, ID number (stored encrypted), written authority and ID as the officer's clean uploads of purpose `access-representation`. The certified copy (Restricted, the declarant its subject) is ordered at once and due 14 days from receipt; once issued it is registered `self-access` naming the representative (`access.certified-copy.issued.v1`) and shows in the declarant's access history. Follow `certifiedCopy.status` until `issued`, then mark it collected or dispatched.
      operationId: recordSelfAccessApplication
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: Idempotency-Key
          in: header
          description: Client-generated UUID, unique per logical request; reuse on retry
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelfAccessApplicationInput'
      responses:
        '201':
          description: Recorded; the certified copy is being issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfAccessApplicationDetail'
        '400':
          description: The body failed validation; `rosterRecordId` is not an onboarded roster record of the Commission, `version` not a submitted version of its declarant, or a representative upload not a clean `access-representation` upload of the caller; `errors` name the field
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            The Commission supervisor reads applications; only its access officer acts

            Requires one of the roles: access-officer, supervisor, eacc-analyst, eacc-supervisor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not the caller's Commission (another Commission's, EACC's or anyone else's)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The directory, declarations, documents, the key service or the workflow engine cannot be reached; nothing was recorded
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    get:
      tags:
        - officer
      summary: The Commission's written self-access applications with their deadlines
      description: 'Earliest deadline first. `late`: the certified copy was not issued by the deadline (14 days from receipt).'
      operationId: listSelfAccessApplications
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: status
          required: false
          in: query
          description: Only applications in this status
          schema:
            type: string
            enum:
              - recorded
              - issued
              - delivered
        - name: cursor
          required: false
          in: query
          description: '`nextCursor` of the previous page; omit for the first page'
          schema:
            type: string
            maxLength: 500
        - name: limit
          required: false
          in: query
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfAccessPage'
        '400':
          description: Query failed validation, or an unknown cursor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'Requires one of the roles: access-officer, supervisor, eacc-analyst, eacc-supervisor'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not the caller's Commission (another Commission's, EACC's or anyone else's)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/access/self-access/{applicationId}:
    get:
      tags:
        - officer
      summary: A written self-access application, with the representative's ID number
      operationId: getSelfAccessApplication
      parameters:
        - name: applicationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfAccessApplicationDetail'
        '400':
          description: applicationId is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'Requires one of the roles: access-officer, supervisor, eacc-analyst, eacc-supervisor'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such application at the caller's Commission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The key service cannot be reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/access/self-access/{applicationId}/delivered:
    post:
      tags:
        - officer
      summary: Mark the issued certified copy collected or dispatched
      description: As the application was marked (`deliveryMethod`); the application becomes `delivered`. Only once the certified copy is issued, and once.
      operationId: markSelfAccessDelivered
      parameters:
        - name: applicationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Marked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfAccessApplicationDetail'
        '400':
          description: applicationId is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            The Commission supervisor reads applications; only its access officer acts

            Requires one of the roles: access-officer, supervisor, eacc-analyst, eacc-supervisor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such application at the caller's Commission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: The certified copy is not issued yet, or is marked already
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The key service cannot be reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    AccessRequestStatus:
      type: string
      enum:
        - submitted
        - pending-applicant-verification
        - officer-unresolved
        - awaiting-representations
        - under-decision
        - granted
        - partially-granted
        - denied
        - cannot-identify
        - withdrawn
    Outcome:
      type: string
      enum:
        - grant
        - partial-grant
        - deny
    Ground:
      type: string
      enum:
        - public-interest
        - prejudice-proceeding
        - frivolous-vexatious
        - not-objectives
      description: Regulation 24
    Section:
      type: string
      enum:
        - bio
        - income
        - assets
        - liabilities
        - other
    Scope:
      type: object
      properties:
        years:
          minItems: 1
          maxItems: 50
          type: array
          items:
            type: integer
            minimum: 2025
        includeSpouses:
          type: boolean
        includeChildren:
          type: boolean
        sections:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/Section'
        includeClarifications:
          type: boolean
      required:
        - years
        - includeSpouses
        - includeChildren
        - sections
        - includeClarifications
    Decision:
      type: object
      properties:
        outcome:
          $ref: '#/components/schemas/Outcome'
        grantedScope:
          anyOf:
            - $ref: '#/components/schemas/Scope'
            - type: 'null'
        grounds:
          type: array
          items:
            $ref: '#/components/schemas/Ground'
        reasons:
          type: string
        decidedBy:
          type: object
          properties:
            subject:
              type: string
            name:
              type: string
          required:
            - subject
            - name
        decidedAt:
          type: string
          format: date-time
      required:
        - outcome
        - grantedScope
        - grounds
        - reasons
        - decidedBy
        - decidedAt
    DecisionInput:
      type: object
      properties:
        outcome:
          $ref: '#/components/schemas/Outcome'
        grantedScope:
          description: 'Required for partial-grant: narrower than the requested scope, never wider. A grant is of the requested scope (omit it, or send the requested scope); a denial has none'
          anyOf:
            - $ref: '#/components/schemas/Scope'
            - type: 'null'
        grounds:
          description: 'Regulation 24 grounds: required for partial-grant and deny, none for grant'
          maxItems: 4
          type: array
          items:
            $ref: '#/components/schemas/Ground'
        reasons:
          type: string
          minLength: 1
          maxLength: 4000
      required:
        - outcome
        - reasons
      additionalProperties: false
    Package:
      type: object
      properties:
        documentId:
          type: string
          format: uuid
        verificationId:
          type: string
        issuedAt:
          type: string
          format: date-time
        downloadExpiresAt:
          type: string
          format: date-time
        downloads:
          type: integer
          minimum: 0
      required:
        - documentId
        - verificationId
        - issuedAt
        - downloadExpiresAt
        - downloads
    FormK:
      type: object
      propertyNames:
        type: string
      additionalProperties: {}
      description: A form-k.v1 document (packages/schemas/forms/form-k.v1.json)
    AccessRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          description: ARQ-<ISSUER>-<YEAR>-<seq>-<check>
        commission:
          type: object
          properties:
            slug:
              type: string
            name:
              type: string
          required:
            - slug
            - name
        status:
          $ref: '#/components/schemas/AccessRequestStatus'
        formK:
          description: The form-k.v1 document as submitted
          $ref: '#/components/schemas/FormK'
        submittedAt:
          type: string
          format: date-time
        decisionDeadlineAt:
          type: string
          format: date-time
        decision:
          anyOf:
            - $ref: '#/components/schemas/Decision'
            - type: 'null'
        package:
          anyOf:
            - $ref: '#/components/schemas/Package'
            - type: 'null'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/RegisterEntry'
      required:
        - id
        - reference
        - commission
        - status
        - formK
        - submittedAt
        - decisionDeadlineAt
        - decision
        - package
        - timeline
    RegisterEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - received
