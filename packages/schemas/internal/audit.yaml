# Generated by `pnpm --filter @adili/audit contracts` from the audit service: do not edit.
openapi: 3.1.0
info:
  title: audit API
  description: Tamper-evident, hash-chained audit trail with signed anchors and audit queries.
  version: '1'
servers:
  - url: /
    description: The service that serves this document
paths:
  /v1/audit/events:
    get:
      tags:
        - audit
      summary: Search the audit trail, newest first
      description: "Every tenant's events (auditor only): reads of sensitive data, writes (each domain event), public verify lookups and sign-in facts, filtered by tenant, actor, the person the data is about, resource, action and time. The search is itself audited."
      operationId: listAuditEvents
      parameters:
        - name: tenant
          required: false
          in: query
          description: Only the chain of this tenant
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: actor
          required: false
          in: query
          description: Actor id (token `sub`, service or network), exact
          schema:
            type: string
            maxLength: 200
        - name: subjectPersonId
          required: false
          in: query
          description: The person the data is about
          schema:
            type: string
            format: uuid
        - name: resourceType
          required: false
          in: query
          schema:
            type: string
            maxLength: 100
        - name: resourceId
          required: false
          in: query
          schema:
            type: string
            maxLength: 200
        - name: action
          required: false
          in: query
          description: Exact action, or a prefix ending in `.` (`declaration.`)
          schema:
            type: string
            maxLength: 200
        - name: kind
          required: false
          in: query
          schema:
            type: string
            enum:
              - read
              - write
              - verification
              - auth
        - name: from
          required: false
          in: query
          description: Occurred at or after
          schema:
            type: string
            format: date-time
        - name: to
          required: false
          in: query
          description: Occurred before
          schema:
            type: string
            format: date-time
        - name: cursor
          required: false
          in: query
          description: '`nextCursor` of the previous page; omit for the first page'
          schema:
            type: string
            maxLength: 500
        - name: limit
          required: false
          in: query
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: A page of events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        '400':
          description: Query failed validation, or the cursor is unknown
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'Requires one of the roles: auditor'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: audit.events.searched
        resource: audit-event
  /v1/audit/events/{eventId}:
    get:
      tags:
        - audit
      summary: One audit event with its data and place in its chain
      description: Auditor only. The read is itself audited.
      operationId: getAuditEvent
      parameters:
        - name: eventId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEvent'
        '403':
          description: 'Requires one of the roles: auditor'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such event
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: audit.event.viewed
        resource: audit-event
  /v1/audit/chains:
    get:
      tags:
        - audit
      summary: The hash chains per tenant per day, with their anchors
      description: Auditor only, newest day first. A day's chain is anchored (signed Merkle root archived in object storage) once the day has ended and the daily anchoring ran.
      operationId: listAuditChains
      parameters:
        - name: tenant
          required: false
          in: query
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: from
          required: false
          in: query
          description: First chain day
          schema:
            type: string
            format: date
        - name: to
          required: false
          in: query
          description: Last chain day
          schema:
            type: string
            format: date
        - name: limit
          required: false
          in: query
          schema:
            default: 100
            type: integer
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: The chains
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditChainPage'
        '400':
          description: Query failed validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'Requires one of the roles: auditor'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: audit.chains.listed
        resource: audit-chain
  /v1/audit/chains/{tenant}/{chainDay}/verification:
    get:
      tags:
        - audit
      summary: Recompute a chain and compare it with its anchor
      description: "Auditor only. Every event in order, each linked to the one before, each hash recomputed from the event and its place, each filtered field read again from the event, the head and, once anchored, the anchor's Merkle root and its signature: any difference is reported as tampering. A day without events is intact and empty."
      operationId: verifyAuditChain
      parameters:
        - name: tenant
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: chainDay
          required: true
          in: path
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditChainVerification'
        '400':
          description: Tenant or day malformed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'Requires one of the roles: auditor'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: audit.chain.verified
        resource: audit-chain
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    AuditEventSummary:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          description: The event type filed, e.g. `audit.read.v1`
        kind:
          type: string
          enum:
            - read
            - write
            - verification
            - auth
          description: '`read`: a read of sensitive data; `write`: a change, recorded by its domain event; `verification`: a public verify lookup; `auth`: a sign-in fact (the demo role switch)'
        action:
          type: string
          description: e.g. `declaration.submitted`, `review.case.viewed`
        occurredAt:
          type: string
          format: date-time
        recordedAt:
          type: string
          format: date-time
        tenant:
          type: string
          description: 'The tenant whose chain holds the event: the data it is about, else `platform`'
        actor:
          type: object
          properties:
            type:
              type: string
              enum:
                - user
                - service
                - system
                - anonymous
            id:
              type: string
              description: Token `sub` of a user or service account, the producing service (`adili/<service>`) for a write, or the coarse network of an anonymous verify lookup
            clientId:
              type:
                - string
                - 'null'
            tenant:
              type:
                - string
                - 'null'
            roles:
              type: array
              items:
                type: string
            onBehalfOf:
              type:
                - string
                - 'null'
          required:
            - type
            - id
            - clientId
            - tenant
            - roles
            - onBehalfOf
        resource:
          type: object
          properties:
            type:
              type: string
            id:
              description: Comma-separated when a batch read served several
              type:
                - string
                - 'null'
            subjectPersonId:
              type:
                - string
                - 'null'
          required:
            - type
            - id
            - subjectPersonId
        outcome:
          type: string
          enum:
            - success
            - denied
            - error
        legalBasis:
          anyOf:
            - type: object
              properties:
                basis:
                  type: string
                reference:
                  type:
                    - string
                    - 'null'
              required:
                - basis
                - reference
            - type: 'null'
          description: Why the data was read (ADR-008 `legal_basis`), when the read named it
        recipient:
          type:
            - string
            - 'null'
        source:
          type: string
          description: Producing service, e.g. `adili/declarations`
      required:
        - eventId
        - eventType
        - kind
        - action
        - occurredAt
        - recordedAt
        - tenant
        - actor
        - resource
        - outcome
        - legalBasis
        - recipient
        - source
      description: One event of the audit trail
    AuditEventPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEventSummary'
        nextCursor:
          description: Null on the last page
          type:
            - string
            - 'null'
      required:
        - items
        - nextCursor
    AuditEvent:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          description: The event type filed, e.g. `audit.read.v1`
        kind:
          type: string
          enum:
            - read
            - write
            - verification
            - auth
          description: '`read`: a read of sensitive data; `write`: a change, recorded by its domain event; `verification`: a public verify lookup; `auth`: a sign-in fact (the demo role switch)'
        action:
          type: string
          description: e.g. `declaration.submitted`, `review.case.viewed`
        occurredAt:
          type: string
          format: date-time
        recordedAt:
          type: string
          format: date-time
        tenant:
          type: string
          description: 'The tenant whose chain holds the event: the data it is about, else `platform`'
        actor:
          type: object
          properties:
            type:
              type: string
              enum:
                - user
                - service
                - system
                - anonymous
            id:
              type: string
              description: Token `sub` of a user or service account, the producing service (`adili/<service>`) for a write, or the coarse network of an anonymous verify lookup
            clientId:
              type:
                - string
                - 'null'
            tenant:
              type:
                - string
                - 'null'
            roles:
              type: array
              items:
                type: string
            onBehalfOf:
              type:
                - string
                - 'null'
          required:
            - type
            - id
            - clientId
            - tenant
            - roles
            - onBehalfOf
        resource:
          type: object
          properties:
            type:
              type: string
            id:
              description: Comma-separated when a batch read served several
              type:
                - string
                - 'null'
            subjectPersonId:
              type:
                - string
                - 'null'
          required:
            - type
            - id
            - subjectPersonId
        outcome:
          type: string
          enum:
            - success
            - denied
            - error
        legalBasis:
          anyOf:
            - type: object
              properties:
                basis:
                  type: string
                reference:
                  type:
                    - string
                    - 'null'
              required:
                - basis
                - reference
            - type: 'null'
          description: Why the data was read (ADR-008 `legal_basis`), when the read named it
        recipient:
          type:
            - string
            - 'null'
        source:
          type: string
          description: Producing service, e.g. `adili/declarations`
        request:
          anyOf:
            - type: object
              properties:
                method:
                  type: string
                route:
                  type:
                    - string
                    - 'null'
              required:
                - method
                - route
            - type: 'null'
          description: The route an audited read was served on
        traceparent:
          type:
            - string
            - 'null'
        data:
          type: object
          propertyNames:
            type: string
          additionalProperties: {}
          description: "The event's data as published: identifiers and non-sensitive facts only"
        chain:
          type: object
          properties:
            chainDay:
              type: string
              format: date
            seq:
              type: integer
              minimum: 1
            hashVersion:
              type: integer
            prevHash:
              type: string
            hash:
              type: string
          required:
            - chainDay
            - seq
            - hashVersion
            - prevHash
            - hash
      required:
        - eventId
        - eventType
        - kind
        - action
        - occurredAt
        - recordedAt
        - tenant
        - actor
        - resource
        - outcome
        - legalBasis
        - recipient
        - source
        - request
        - traceparent
        - data
        - chain
    AuditChainPage:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              tenant:
                type: string
              chainDay:
                type: string
                format: date
              events:
                type: integer
                minimum: 0
              headHash:
                type: string
              anchor:
                anyOf:
                  - type: object
                    properties:
                      merkleRoot:
                        type: string
                      anchoredAt:
                        type: string
                        format: date-time
                      objectKey:
                        type: string
                    required:
                      - merkleRoot
                      - anchoredAt
                      - objectKey
                  - type: 'null'
                description: Null until the day has ended and the anchoring ran
            required:
              - tenant
              - chainDay
              - events
              - headHash
              - anchor
      required:
        - items
    AuditChainVerification:
      type: object
      properties:
        tenant:
          type: string
        chainDay:
          type: string
          format: date
        events:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
            - intact
            - tampered
        problems:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                  - missing-event
                  - broken-link
                  - hash-mismatch
                  - record-mismatch
                  - head-mismatch
                  - anchor-mismatch
              seq:
                description: The event at fault; null for the head or anchor
                type:
                  - integer
                  - 'null'
            required:
              - kind
              - seq
        anchor:
          type: object
          properties:
            status:
              type: string
              enum:
                - none
                - matches
                - mismatch
            anchoredAt:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
          required:
            - status
            - anchoredAt
        merkleRoot:
          type:
            - string
            - 'null'
      required:
        - tenant
        - chainDay
        - events
        - status
        - problems
        - anchor
        - merkleRoot
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
            - database-unavailable
            - rate-limit-exceeded
            - no-match
            - already-onboarded
            - no-roster
            - otp-invalid
            - otp-expired
            - resend-cooldown
            - otp-send-failed
            - wrong-step
            - session-expired
            - iprs-unavailable
            - identity-unavailable
            - email-in-use
            - identity-mismatch
            - step-up-required
            - incomplete
            - before-statement-date
            - amendment-window-closed
            - not-a-draft
            - not-submitted
            - obligation-cancelled
            - acknowledgement-issued
            - acknowledgement-in-progress
            - consent-required
            - no-id
            - not-new
            - no-applicant-record
            - request-decided
            - request-closed
            - officer-resolved
            - not-under-decision
            - not-pending-verification
            - lea-account-inactive
            - declarant-notified
            - representations-closed
            - download-window-closed
            - scope-exceeds-request
            - grounds-required
            - separation-of-duties
            - report-submitted
            - report-compiling
            - preview-not-available
            - report-preview
            - not-reviewed
            - invalid-remarks
            - invalid-document
            - inconsistent-document
            - tenant-mismatch
            - ncr-approved
            - no-submitted-reports
            - icms-push-failed
            - ai-not-enabled
            - narrative-validation
            - no-pattern-candidates
            - aggregates-rebuilt
            - narrative-draft-failed
            - ncr-not-built
            - ncr-not-approved
            - fy-not-started
            - release-building
            - reconciliation-failed
            - release-not-preview
            - release-not-published
            - annual-release-published
            - manifest-refused
            - manifest-revocation-refused
          description: Machine-readable cause, from the platform registry; clients map it to copy and never show `title` or `detail`
        detail:
          type: string
        instance:
          type: string
        errors:
          description: Field-level errors; `path` is the dotted request field
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - path
              - message
      required:
        - type
        - title
        - status
security:
  - bearer: []
