# Generated by `pnpm --filter @adili/integration-gateway contracts`: do not edit.
# Implemented operations come from the integration-gateway service; operations marked `x-draft` come
# from packages/schemas/drafts/integration-gateway.yaml until they are implemented.
openapi: 3.1.0
info:
  title: integration-gateway API
  description: Adapters to IPRS, KRA, NTSA, BRS, ArdhiSasa, HR, payroll and ICMS with retries and circuit breakers.
  version: '1'
servers:
  - url: /
    description: The service that serves this document
paths:
  /internal/v1/iprs/person-lookups:
    post:
      tags:
        - internal
      summary: Person as held by IPRS, cached for 24 hours (hits and misses)
      description: A read, posted so the national ID travels in the body rather than the URL (URLs end up in access logs, traces and problem details). Safe to repeat. Requires a service token with scope `iprs`.
      operationId: lookupIprsPerson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupIprsPerson'
      responses:
        '200':
          description: Person found
          headers:
            X-Cache:
              description: '`hit` when the answer came from the cache, `miss` when IPRS was asked'
              schema:
                type: string
                enum:
                  - hit
                  - miss
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IprsPerson'
        '400':
          description: National ID missing or malformed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'Requires one of the scopes: iprs'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: 'Problem type `not-found`: IPRS has no person with this national ID'
          headers:
            X-Cache:
              description: '`hit` when the answer came from the cache, `miss` when IPRS was asked'
              schema:
                type: string
                enum:
                  - hit
                  - miss
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: 'Problem type `upstream-unavailable`: circuit open or timeout'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - bearer: []
  /internal/v1/kra/taxpayer-lookups:
    post:
      tags:
        - internal
      summary: KRA PINs of a national ID, each with its compliance and declared annual income
      description: 'A read, posted so the national ID travels in the body rather than the URL (URLs end up in access logs, traces and problem details). Safe to repeat. Every lookup, answered or not, is recorded with its legal basis and case reference, the answer encrypted under the acting tenant, and emits registry.lookup.performed.v1. Answers (found and not found) are cached for 24 hours. A registry that gives no answer is outcome unavailable with a reason, never an error. not-found: KRA has no PIN for the national ID. Requires a service token with scope `registry` acting for the Commission.'
      operationId: lookupKraTaxpayer
      parameters:
        - name: X-Acting-Tenant
          in: header
          description: Tenant the calling service acts for; the resource must belong to it
          required: true
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: X-Legal-Basis
          in: header
          description: Why the registry is consulted, recorded on the result and the audit event. regs-r20-1-b, act-s35-5, adr-014-onboarding or declarant-request
          required: true
          schema:
            type: string
            enum:
              - regs-r20-1-b
              - act-s35-5
              - adr-014-onboarding
              - declarant-request
        - name: X-Case-Ref
          in: header
          description: Review case the lookup is for; recorded on the result and the audit event
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,99}$
        - name: X-Subject-Person
          in: header
          description: Platform person the lookup is about (the case declarant); recorded on the result, so reads of it are audited as reads of their data
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistryLookup'
      responses:
        '200':
          description: The lookup result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KraResult'
        '400':
          description: X-Legal-Basis or X-Case-Ref missing, X-Legal-Basis unknown, or X-Case-Ref or X-Subject-Person malformed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Requires a service token with scope registry
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: 'Problem type `lookup-not-recorded`: the lookup could not be recorded (audit), so no answer is given; retry'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - bearer: []
