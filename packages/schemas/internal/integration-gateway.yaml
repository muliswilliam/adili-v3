  /internal/v1/registry-rate-limits:
    get:
      tags:
        - internal
      summary: Configured calls per minute of every system with an adapter (services)
      description: Service tokens with scope `registry`; no X-Acting-Tenant (configuration, no tenant data). A lookup answered from the cache spends none of it; every call to the registry spends one, so a KRA lookup spends 1 + one per PIN.
      operationId: getRegistryRateLimits
      responses:
        '200':
          description: Rate limits per system
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryRateLimits'
        '403':
          description: 'Requires one of the scopes: registry'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - bearer: []
  /internal/v1/verification-results/{resultId}:
    get:
      tags:
        - internal
      summary: A stored lookup result, decrypted for the services of its tenant (audited)
      description: The normalised records of a found lookup (payload), with its system, outcome, legal basis and case reference. Each read is audited (audit.read.v1) under the tenant, naming the person the lookup was about (X-Subject-Person at lookup) and whom the service read for (X-Acting-Subject). Requires a service token with scope `registry` acting for the tenant the lookup acted for.
      operationId: getVerificationResult
      parameters:
        - name: X-Acting-Tenant
          in: header
          description: Tenant the calling service acts for; the resource must belong to it
          required: true
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: resultId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: X-Acting-Subject
          in: header
          description: The staff subject the service reads for (a reviewer opening the Registry tab), or the service's own system subject for workflow reads; recorded as the audit event's on-behalf-of, grants nothing (ADR-013 §8.6)
          required: false
          schema:
            type: string
            maxLength: 255
      responses:
        '200':
          description: The stored result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredResult'
        '400':
          description: X-Acting-Tenant is missing or not a tenant key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Requires a service token with scope registry
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such result, or another tenant's
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: 'Problem type `upstream-unavailable`: the key service could not decrypt the payload now'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - bearer: []
      x-audited-read:
        action: verification-result.read
        resource: verification-result
  /v1/integrations/coverage:
    get:
      tags:
        - integrations
      summary: Per-system call volume, cache hit rate, breaker state and last success
      description: 'Every system with an adapter (IPRS, KRA, NTSA, BRS, ArdhiSasa): lookups and failed calls in the last 24 hours, cache hit rate, breaker state, last success, paused (by whom and since when), and the configured rate limit, cache lifetime, timeout and breaker rule. Platform administrators only.'
      operationId: getIntegrationsCoverage
      responses:
        '200':
          description: Coverage per system
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coverage'
        '403':
          description: 'Requires one of the roles: platform-admin'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - bearer: []
  /v1/integrations/{system}/pause:
    post:
      tags:
        - integrations
      summary: Force lookups to unavailable during a known outage (platform-admin)
      description: From now on the system's lookups answer `unavailable` with reason `paused` without calling it; answers still in the cache are served. Records who paused it and when, and `integrations.system.paused.v1`. Pausing a paused system changes nothing. Platform administrators only.
      operationId: pauseIntegration
      parameters:
        - name: system
          required: true
          in: path
          schema:
            $ref: '#/components/schemas/System'
        - name: Idempotency-Key
          in: header
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemCoverage'
        '403':
          description: 'Requires one of the roles: platform-admin'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No adapter for the system (payroll and ICMS have no coverage to pause)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: 'Problem type `pause-flag-unavailable`: the change is recorded but the pause flag could not be written; retry to apply it'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - bearer: []
  /v1/integrations/{system}/resume:
    post:
      tags:
        - integrations
      summary: Resume lookups (platform-admin)
      description: Lookups call the system again, within its rate limit and behind its breaker. Records `integrations.system.resumed.v1`. Resuming a system that is not paused changes nothing. Platform administrators only.
      operationId: resumeIntegration
      parameters:
        - name: system
          required: true
          in: path
          schema:
            $ref: '#/components/schemas/System'
        - name: Idempotency-Key
          in: header
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemCoverage'
        '403':
          description: 'Requires one of the roles: platform-admin'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No adapter for the system (payroll and ICMS have no coverage to pause)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: 'Problem type `pause-flag-unavailable`: the change is recorded but the pause flag could not be written; retry to apply it'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - bearer: []
  /internal/v1/payroll/instructions:
    post:
      tags:
        - internal
      summary: Send a stop or resume salary instruction to payroll (idempotent by instruction reference)
      operationId: submitPayrollInstruction
      x-draft: true
      parameters:
        - $ref: '#/components/parameters/CaseRef'
        - $ref: '#/components/parameters/LegalBasis'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayrollInstructionRequest'
      responses:
        '200':
          description: Already submitted (replay)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollInstruction'
        '201':
          description: Acknowledged by payroll
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollInstruction'
        '400':
          $ref: '#/components/responses/MissingLegalBasis'
        '503':
          description: Payroll unavailable; nothing recorded as sent
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/payroll/instructions/{instructionReference}:
    parameters:
      - name: instructionReference
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - internal
      summary: Stored instruction and acknowledgement
      operationId: getPayrollInstruction
      x-draft: true
      responses:
        '200':
          description: Instruction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollInstruction'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/icms/referrals:
    post:
      tags:
        - internal
      summary: Register a referral with ICMS and return the case number (idempotent by referral reference)
      operationId: submitIcmsReferral
      x-draft: true
      parameters:
        - $ref: '#/components/parameters/CaseRef'
        - $ref: '#/components/parameters/LegalBasis'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IcmsReferralRequest'
      responses:
        '200':
          description: Already registered (replay)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcmsReferral'
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcmsReferral'
        '400':
          $ref: '#/components/responses/MissingLegalBasis'
        '503':
          description: ICMS unavailable; nothing registered
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/icms/referrals/{referralReference}:
    parameters:
      - name: referralReference
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - internal
      summary: Stored ICMS registration for a referral reference
      operationId: getIcmsReferral
      x-draft: true
      responses:
        '200':
          description: Registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcmsReferral'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    LookupIprsPerson:
      type: object
      properties:
        nationalId:
          type: string
          pattern: ^[0-9]{5,10}$
      required:
        - nationalId
      additionalProperties: false
    IprsPerson:
      type: object
      properties:
        nationalId:
          type: string
        firstName:
          type: string
        middleName:
          type:
            - string
            - 'null'
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
        sex:
          type: string
          enum:
            - F
            - M
      required:
        - nationalId
        - firstName
        - middleName
        - lastName
        - dateOfBirth
        - sex
      description: A person as IPRS holds them
    System:
      type: string
      enum:
        - iprs
        - kra
        - ntsa
        - brs
        - ardhisasa
        - hr-suppliers
        - payroll
        - icms
    LookupOutcome:
      type: string
      enum:
        - found
        - not-found
        - unavailable
    UnavailableReason:
      type: string
      enum:
        - timeout
        - breaker-open
        - paused
        - rate-limited
        - upstream-error
      description: rate-limited when no slot of the system rate limit freed up within the max queue wait, or the registry refused the call for its own
    RegistryLookup:
      type: object
      properties:
        nationalId:
          type: string
          pattern: ^[0-9]{5,10}$
      required:
        - nationalId
      additionalProperties: false
      description: Whom to look up
    ResultEnvelope:
      type: object
      properties:
        resultId:
          type: string
          format: uuid
        system:
          $ref: '#/components/schemas/System'
        outcome:
          $ref: '#/components/schemas/LookupOutcome'
        reason:
          anyOf:
            - $ref: '#/components/schemas/UnavailableReason'
            - type: 'null'
        cached:
          type: boolean
        checkedAt:
          type: string
          format: date-time
      required:
        - resultId
        - system
        - outcome
        - reason
        - cached
        - checkedAt
    KraResult:
      type: object
      properties:
        resultId:
          type: string
          format: uuid
        system:
          $ref: '#/components/schemas/System'
        outcome:
          $ref: '#/components/schemas/LookupOutcome'
        reason:
          anyOf:
            - $ref: '#/components/schemas/UnavailableReason'
            - type: 'null'
        cached:
          type: boolean
        checkedAt:
          type: string
          format: date-time
        taxpayers:
          type: array
          items:
            type: object
            properties:
              pin:
                type: string
              registeredOn:
                type: string
                format: date
              compliance:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - compliant
                      - non-compliant
                      - unknown
                  certificateNumber:
                    type:
                      - string
                      - 'null'
                  validUntil:
                    anyOf:
                      - type: string
                        format: date
                      - type: 'null'
                  annualIncomeDeclaredCents:
                    type:
                      - integer
                      - 'null'
                required:
                  - status
                  - certificateNumber
                  - validUntil
                  - annualIncomeDeclaredCents
            required:
              - pin
              - registeredOn
              - compliance
      required:
        - resultId
        - system
        - outcome
        - reason
        - cached
        - checkedAt
        - taxpayers
      description: 'KRA PINs with their compliance. not-found: no PIN for the national ID. taxpayers is empty unless found.'
    NtsaResult:
      type: object
      properties:
        resultId:
          type: string
          format: uuid
        system:
          $ref: '#/components/schemas/System'
        outcome:
          $ref: '#/components/schemas/LookupOutcome'
        reason:
          anyOf:
            - $ref: '#/components/schemas/UnavailableReason'
            - type: 'null'
        cached:
          type: boolean
        checkedAt:
          type: string
          format: date-time
        vehicles:
          type: array
          items:
            type: object
            properties:
              registrationNumber:
                type: string
              make:
                type: string
              model:
                type: string
              yearOfManufacture:
                type: integer
              registeredOn:
                type: string
                format: date
            required:
              - registrationNumber
              - make
              - model
              - yearOfManufacture
              - registeredOn
      required:
        - resultId
        - system
        - outcome
        - reason
        - cached
        - checkedAt
        - vehicles
      description: Vehicles registered to the national ID; empty unless found.
    BrsResult:
      type: object
      properties:
        resultId:
          type: string
          format: uuid
        system:
          $ref: '#/components/schemas/System'
        outcome:
          $ref: '#/components/schemas/LookupOutcome'
        reason:
          anyOf:
            - $ref: '#/components/schemas/UnavailableReason'
            - type: 'null'
        cached:
          type: boolean
        checkedAt:
          type: string
          format: date-time
        directorships:
          type: array
          items:
            type: object
            properties:
              companyRegistrationNumber:
                type: string
              companyName:
                type: string
              companyStatus:
                type: string
              role:
                type: string
              shares:
                type:
                  - integer
                  - 'null'
              appointedOn:
                type: string
                format: date
            required:
              - companyRegistrationNumber
              - companyName
              - companyStatus
              - role
              - shares
              - appointedOn
      required:
        - resultId
        - system
        - outcome
        - reason
        - cached
        - checkedAt
        - directorships
      description: Directorships and shareholdings of the national ID; empty unless found.
    ArdhisasaResult:
      type: object
      properties:
        resultId:
          type: string
          format: uuid
        system:
          $ref: '#/components/schemas/System'
        outcome:
          $ref: '#/components/schemas/LookupOutcome'
        reason:
          anyOf:
            - $ref: '#/components/schemas/UnavailableReason'
            - type: 'null'
        cached:
          type: boolean
        checkedAt:
          type: string
          format: date-time
        parcels:
          type: array
          items:
            type: object
            properties:
              parcelNumber:
                type: string
              county:
                type: string
              areaHectares:
                type: number
              tenure:
                type: string
              registeredOn:
                type: string
                format: date
            required:
              - parcelNumber
              - county
              - areaHectares
              - tenure
              - registeredOn
      required:
        - resultId
        - system
        - outcome
        - reason
        - cached
        - checkedAt
        - parcels
      description: Land parcels registered to the national ID; empty unless found.
    SupplierCheckResult:
      type: object
      properties:
        resultId:
          type: string
          format: uuid
        system:
          $ref: '#/components/schemas/System'
        outcome:
          $ref: '#/components/schemas/LookupOutcome'
        reason:
          anyOf:
            - $ref: '#/components/schemas/UnavailableReason'
            - type: 'null'
        cached:
          type: boolean
        checkedAt:
          type: string
          format: date-time
        supplies:
          type:
            - boolean
            - 'null'
      required:
        - resultId
        - system
        - outcome
        - reason
        - cached
        - checkedAt
        - supplies
      description: Whether the company is on the employer's supplier list (HR). null when unavailable.
    StoredResult:
      type: object
      properties:
        resultId:
          type: string
          format: uuid
        system:
          $ref: '#/components/schemas/System'
        outcome:
          $ref: '#/components/schemas/LookupOutcome'
        checkedAt:
          type: string
          format: date-time
        legalBasis:
          type: string
        caseRef:
          type:
            - string
            - 'null'
        payload:
          anyOf:
            - type: object
              propertyNames:
                type: string
              additionalProperties: {}
            - type: 'null'
          description: 'The normalised records the lookup answered (e.g. { vehicles: [...] }); null unless the outcome is found'
      required:
        - resultId
        - system
        - outcome
        - checkedAt
        - legalBasis
        - caseRef
        - payload
      description: A stored lookup result, decrypted for a service of its tenant
    SystemCoverage:
      type: object
      properties:
        system:
          $ref: '#/components/schemas/System'
        calls24h:
          type: integer
          minimum: 0
        cacheHitRate:
          type: number
          minimum: 0
          maximum: 1
          description: Share of the last 24 hours of answers (found or not found) served from the cache; 0 without answers
        failures24h:
          type: integer
          minimum: 0
        breaker:
          type: string
          enum:
            - closed
            - open
            - half-open
          description: The circuit as the answering instance sees it; open past its cool-down reads half-open
        lastSuccessAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        paused:
          type: boolean
        pausedBy:
          description: Display name of the platform administrator who paused it; null unless paused
          type:
            - string
            - 'null'
        pausedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          description: When it was paused; null unless paused
        rateLimitPerMinute:
          type: integer
          exclusiveMinimum: 0
        cacheTtlSeconds:
          type: integer
          exclusiveMinimum: 0
        timeoutMs:
          type: integer
          exclusiveMinimum: 0
        breakerFailureThreshold:
          type: integer
          exclusiveMinimum: 0
        breakerCooldownSeconds:
          type: number
          exclusiveMinimum: 0
      required:
        - system
        - calls24h
        - cacheHitRate
        - failures24h
        - breaker
        - lastSuccessAt
        - paused
        - pausedBy
        - pausedAt
        - rateLimitPerMinute
        - cacheTtlSeconds
        - timeoutMs
        - breakerFailureThreshold
        - breakerCooldownSeconds
      description: How one registry integration is behaving
    Coverage:
      type: array
      items:
        $ref: '#/components/schemas/SystemCoverage'
      description: Every system with an adapter, in a fixed order
    RegistryRateLimits:
      type: array
      items:
        type: object
        properties:
          system:
            $ref: '#/components/schemas/System'
          ratePerMinute:
            type: integer
            exclusiveMinimum: 0
        required:
          - system
          - ratePerMinute
      description: The configured rate limit of every system with an adapter
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
            - database-unavailable
            - rate-limit-exceeded
            - no-match
            - already-onboarded
            - no-roster
            - otp-invalid
            - otp-expired
            - resend-cooldown
            - otp-send-failed
            - wrong-step
            - session-expired
            - iprs-unavailable
            - identity-unavailable
            - email-in-use
            - identity-mismatch
            - step-up-required
            - incomplete
            - before-statement-date
            - amendment-window-closed
            - not-a-draft
            - not-submitted
            - obligation-cancelled
            - acknowledgement-issued
            - acknowledgement-in-progress
            - consent-required
            - no-id
            - not-new
            - no-applicant-record
            - request-decided
            - request-closed
            - officer-resolved
            - not-under-decision
            - not-pending-verification
            - lea-account-inactive
            - declarant-notified
            - representations-closed
            - download-window-closed
            - scope-exceeds-request
            - grounds-required
          description: Machine-readable cause, from the platform registry; clients map it to copy and never show `title` or `detail`
        detail:
          type: string
        instance:
          type: string
        errors:
          description: Field-level errors; `path` is the dotted request field
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - path
              - message
      required:
        - type
        - title
        - status
    PayrollAction:
      type: string
      enum:
        - stop_salary
        - resume_salary
    PayrollInstructionRequest:
      type: object
      required:
        - instructionReference
        - employerCode
        - personalNumber
        - nationalId
        - action
        - reason
        - effectiveDate
      properties:
        instructionReference:
          type: string
          description: The ADM reference (stop) or ADM reference with -R suffix (resume)
        employerCode:
          type: string
        personalNumber:
          type: string
        nationalId:
          type: string
        action:
          $ref: '#/components/schemas/PayrollAction'
        reason:
          type: string
          maxLength: 500
        effectiveDate:
          type: string
          format: date
    PayrollInstruction:
      type: object
      required:
        - instructionReference
        - action
        - status
        - payrollReference
        - receivedAt
        - sentAt
      properties:
        instructionReference:
          type: string
        action:
          $ref: '#/components/schemas/PayrollAction'
        status:
          type: string
          enum:
            - accepted
            - pending
            - failed
        payrollReference:
          type:
            - string
            - 'null'
        receivedAt:
          type:
            - string
            - 'null'
          format: date-time
        sentAt:
          type: string
          format: date-time
    IcmsReferralRequest:
      type: object
      required:
        - referralReference
        - nationalId
        - fullName
        - referringCommission
        - grounds
        - details
      properties:
        referralReference:
          type: string
          description: The RFL reference
        nationalId:
          type: string
        fullName:
          type: string
        referringCommission:
          type: string
          description: Issuer code
        grounds:
          type: string
        details:
          type: string
          maxLength: 8000
    IcmsReferral:
      type: object
      required:
        - referralReference
        - caseNumber
        - status
        - registeredAt
        - sentAt
      properties:
        referralReference:
          type: string
        caseNumber:
          type:
            - string
            - 'null'
        status:
          type: string
          enum:
            - registered
            - pending
            - failed
        registeredAt:
          type:
            - string
            - 'null'
          format: date-time
        sentAt:
          type: string
          format: date-time
  parameters:
    CaseRef:
      name: X-Case-Ref
      in: header
      required: false
      description: Review case the lookup is for; recorded on the result and the audit event
      schema:
        type: string
    LegalBasis:
      name: X-Legal-Basis
      in: header
      required: true
      description: e.g. regs-r20-1-b, act-s35-5, adr-014-onboarding, declarant-request
      schema:
        type: string
  responses:
    MissingLegalBasis:
      description: X-Legal-Basis header missing or unknown
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
security:
  - bearer: []
