openapi: 3.1.0
info:
  title: integration-gateway API - registry lookups (draft)
  version: '1'
  description: |
    Draft contract for specs 03 (IPRS identity lookup) and 07b (KRA, NTSA, BRS, ArdhiSasa
    cross-checks, coverage and pause). Cached, circuit-broken, rate-limited lookups with a
    verification-results row per call carrying the legal basis. Internal paths are not routed by the public
    entrypoint. The integration-gateway's Swagger document becomes the source of truth
    once implemented.
servers:
  - url: http://localhost:4009
security:
  - bearer: []
tags:
  - name: internal
  - name: integrations
paths:
  /internal/v1/iprs/persons/{nationalId}:
    parameters:
      - name: nationalId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[0-9]{5,10}$'
    get:
      tags: [internal]
      operationId: lookupIprsPerson
      summary: Person as held by IPRS, cached for 24 hours (hits and misses)
      responses:
        '200':
          description: Person found
          headers:
            X-Cache:
              schema:
                type: string
                enum: [hit, miss]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IprsPerson'
        '404':
          description: No IPRS record for this national ID
          headers:
            X-Cache:
              schema:
                type: string
                enum: [hit, miss]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Caller lacks the iprs scope
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: 'Problem code `upstream-unavailable`: circuit open or timeout'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/kra/taxpayers:
    get:
      tags: [internal]
      operationId: lookupKraTaxpayer
      summary: KRA PIN(s), taxpayer and compliance for a national ID
      parameters:
        - $ref: '#/components/parameters/NationalIdQuery'
        - $ref: '#/components/parameters/CaseRef'
        - $ref: '#/components/parameters/LegalBasis'
      responses:
        '200':
          description: Result (found, not-found or unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KraResult'
        '400':
          $ref: '#/components/responses/MissingLegalBasis'
  /internal/v1/ntsa/owners/{nationalId}/vehicles:
    parameters:
      - $ref: '#/components/parameters/NationalIdPath'
      - $ref: '#/components/parameters/CaseRef'
      - $ref: '#/components/parameters/LegalBasis'
    get:
      tags: [internal]
      operationId: lookupNtsaVehicles
      summary: Vehicles registered to a national ID
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NtsaResult'
        '400':
          $ref: '#/components/responses/MissingLegalBasis'
  /internal/v1/brs/persons/{nationalId}/directorships:
    parameters:
      - $ref: '#/components/parameters/NationalIdPath'
      - $ref: '#/components/parameters/CaseRef'
      - $ref: '#/components/parameters/LegalBasis'
    get:
      tags: [internal]
      operationId: lookupBrsDirectorships
      summary: Directorships and shareholdings of a national ID
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrsResult'
        '400':
          $ref: '#/components/responses/MissingLegalBasis'
  /internal/v1/brs/companies/{registrationNumber}/supplies:
    parameters:
      - name: registrationNumber
        in: path
        required: true
        schema:
          type: string
      - name: employerCode
        in: query
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CaseRef'
      - $ref: '#/components/parameters/LegalBasis'
    get:
      tags: [internal]
      operationId: checkCompanySuppliesEmployer
      summary: Whether a company appears in an employer's supplier list (HR mock)
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierCheckResult'
        '400':
          $ref: '#/components/responses/MissingLegalBasis'
  /internal/v1/ardhisasa/owners/{nationalId}/parcels:
    parameters:
      - $ref: '#/components/parameters/NationalIdPath'
      - $ref: '#/components/parameters/CaseRef'
      - $ref: '#/components/parameters/LegalBasis'
    get:
      tags: [internal]
      operationId: lookupArdhisasaParcels
      summary: Land parcels registered to a national ID
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArdhisasaResult'
        '400':
          $ref: '#/components/responses/MissingLegalBasis'
  /internal/v1/verification-results/{resultId}:
    parameters:
      - name: resultId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [internal]
      operationId: getVerificationResult
      summary: A stored lookup result, decrypted for the requesting tenant's services (audited)
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredResult'
        '404':
          description: Not found or other tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/integrations/coverage:
    get:
      tags: [integrations]
      operationId: getIntegrationsCoverage
      summary: Per-system call volume, cache hit rate, breaker state, last success (platform-admin)
      responses:
        '200':
          description: Coverage
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SystemCoverage'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/integrations/{system}/pause:
    parameters:
      - $ref: '#/components/parameters/System'
    post:
      tags: [integrations]
      operationId: pauseIntegration
      summary: Force lookups to unavailable during a known outage (platform-admin)
      responses:
        '200':
          description: Paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemCoverage'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/integrations/{system}/resume:
    parameters:
      - $ref: '#/components/parameters/System'
    post:
      tags: [integrations]
      operationId: resumeIntegration
      summary: Resume lookups (platform-admin)
      responses:
        '200':
          description: Resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemCoverage'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  parameters:
    NationalIdPath:
      name: nationalId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9]{5,10}$'
    NationalIdQuery:
      name: nationalId
      in: query
      required: true
      schema:
        type: string
        pattern: '^[0-9]{5,10}$'
    CaseRef:
      name: X-Case-Ref
      in: header
      required: false
      description: Review case the lookup is for; recorded on the result and the audit event
      schema:
        type: string
    LegalBasis:
      name: X-Legal-Basis
      in: header
      required: true
      description: e.g. regs-r20-1-b, act-s35-5, adr-014-onboarding
      schema:
        type: string
    System:
      name: system
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/System'
  responses:
    MissingLegalBasis:
      description: X-Legal-Basis header missing or unknown
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    IprsPerson:
      type: object
      required: [nationalId, firstName, middleName, lastName, dateOfBirth, sex]
      properties:
        nationalId:
          type: string
        firstName:
          type: string
        middleName:
          type: [string, 'null']
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
        sex:
          type: string
          enum: [F, M]
    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
    System:
      type: string
      enum: [iprs, kra, ntsa, brs, ardhisasa]
    LookupOutcome:
      type: string
      enum: [found, not-found, unavailable]
    UnavailableReason:
      type: string
      enum: [timeout, breaker-open, paused, upstream-error]
    ResultEnvelope:
      type: object
      required: [resultId, system, outcome, reason, cached, checkedAt]
      properties:
        resultId:
          type: string
          format: uuid
        system:
          $ref: '#/components/schemas/System'
        outcome:
          $ref: '#/components/schemas/LookupOutcome'
        reason:
          oneOf:
            - $ref: '#/components/schemas/UnavailableReason'
            - type: 'null'
        cached:
          type: boolean
        checkedAt:
          type: string
          format: date-time
    KraResult:
      allOf:
        - $ref: '#/components/schemas/ResultEnvelope'
        - type: object
          required: [taxpayers]
          properties:
            taxpayers:
              type: array
              items:
                type: object
                required: [pin, registeredOn, compliance]
                properties:
                  pin:
                    type: string
                  registeredOn:
                    type: string
                    format: date
                  compliance:
                    type: object
                    required: [status, certificateNumber, validUntil, annualIncomeDeclaredCents]
                    properties:
                      status:
                        type: string
                        enum: [compliant, non-compliant, unknown]
                      certificateNumber:
                        type: [string, 'null']
                      validUntil:
                        type: [string, 'null']
                        format: date
                      annualIncomeDeclaredCents:
                        type: [integer, 'null']
    NtsaResult:
      allOf:
        - $ref: '#/components/schemas/ResultEnvelope'
        - type: object
          required: [vehicles]
          properties:
            vehicles:
              type: array
              items:
                type: object
                required: [registrationNumber, make, model, yearOfManufacture, registeredOn]
                properties:
                  registrationNumber:
                    type: string
                  make:
                    type: string
                  model:
                    type: string
                  yearOfManufacture:
                    type: integer
                  registeredOn:
                    type: string
                    format: date
    BrsResult:
      allOf:
        - $ref: '#/components/schemas/ResultEnvelope'
        - type: object
          required: [directorships]
          properties:
            directorships:
              type: array
              items:
                type: object
                required:
                  [companyRegistrationNumber, companyName, companyStatus, role, shares, appointedOn]
                properties:
                  companyRegistrationNumber:
                    type: string
                  companyName:
                    type: string
                  companyStatus:
                    type: string
                  role:
                    type: string
                  shares:
                    type: [number, 'null']
                  appointedOn:
                    type: string
                    format: date
    SupplierCheckResult:
      allOf:
        - $ref: '#/components/schemas/ResultEnvelope'
        - type: object
          required: [supplies]
          properties:
            supplies:
              type: [boolean, 'null']
              description: null when unavailable
    ArdhisasaResult:
      allOf:
        - $ref: '#/components/schemas/ResultEnvelope'
        - type: object
          required: [parcels]
          properties:
            parcels:
              type: array
              items:
                type: object
                required: [parcelNumber, county, areaHectares, tenure, registeredOn]
                properties:
                  parcelNumber:
                    type: string
                  county:
                    type: string
                  areaHectares:
                    type: number
                  tenure:
                    type: string
                  registeredOn:
                    type: string
                    format: date
    StoredResult:
      type: object
      required: [resultId, system, outcome, checkedAt, legalBasis, payload]
      properties:
        resultId:
          type: string
          format: uuid
        system:
          $ref: '#/components/schemas/System'
        outcome:
          $ref: '#/components/schemas/LookupOutcome'
        checkedAt:
          type: string
          format: date-time
        legalBasis:
          type: string
        payload:
          type: object
          description: The normalised records as returned by the lookup
          additionalProperties: true
    SystemCoverage:
      type: object
      required:
        [
          system,
          calls24h,
          cacheHitRate,
          breaker,
          lastSuccessAt,
          paused,
          rateLimitPerMinute,
          cacheTtlSeconds,
        ]
      properties:
        system:
          $ref: '#/components/schemas/System'
        calls24h:
          type: integer
        cacheHitRate:
          type: number
          minimum: 0
          maximum: 1
        breaker:
          type: string
          enum: [closed, open, half-open]
        lastSuccessAt:
          type: [string, 'null']
          format: date-time
        paused:
          type: boolean
        rateLimitPerMinute:
          type: integer
        cacheTtlSeconds:
          type: integer
