        - sectionKey
        - itemId
        - uploadId
    DeclarationAttachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sectionKey:
          $ref: '#/components/schemas/SectionKey'
        itemId:
          type: string
          format: uuid
        uploadId:
          type: string
          format: uuid
        fileName:
          type: string
        sha256:
          type: string
          description: Hex SHA-256 of the clean object
        size:
          type: integer
          description: Bytes
