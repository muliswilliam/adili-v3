# Generated by `pnpm --filter @adili/declarations contracts`: do not edit.
# Implemented operations come from the declarations service; operations marked `x-draft` come
# from packages/schemas/drafts/declarations.yaml until they are implemented.
openapi: 3.1.0
info:
  title: declarations API
  description: Filing obligations, drafts, declarations, versions, household and financial statements.
  version: '1'
servers:
  - url: /
    description: The service that serves this document
paths:
  /v1/me/obligations:
    get:
      tags:
        - obligations
      summary: The signed-in declarant's obligations across Commissions
      description: Authorised by the person_id claim. Staff tokens without it get 404.
      operationId: getMyObligations
      responses:
        '200':
          description: Obligations grouped by Commission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyObligations'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/obligations/summary:
    get:
      tags:
        - obligations
      summary: Per-Commission counts for EACC and platform administrators
      description: Every Commission's counts for a cycle (the current one by default), with not-onboarded declarants due or overdue, the last roster import, and totals. No declarant data.
      operationId: getNationalObligationsSummary
      parameters:
        - name: cycle
          required: false
          in: query
          description: A biennial cycle key, e.g. `biennial:2027`; the current cycle when omitted
          schema:
            examples:
              - biennial:2027
            type: string
            pattern: ^biennial:(\d{4})$
      responses:
        '200':
          description: Counts per Commission and totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NationalSummary'
        '400':
          description: Query failed validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            Only EACC roles and platform admins

            Requires one of the roles: eacc-analyst, eacc-supervisor, platform-admin
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/obligations/{id}:
    get:
      tags:
        - obligations
      summary: One obligation with its reminder history
      description: The declarant's own (`declarant` null); staff of the obligation's Commission and platform admins (with `declarant`, whom it is for). Anyone else gets 404. Staff and platform admin reads are audited under the obligation's Commission; a declarant reading their own is not.
      operationId: getObligation
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The obligation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObligationDetail'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: obligation.viewed
        resource: filing-obligation
  /v1/commissions/{slug}/obligations/summary:
    get:
      tags:
        - obligations
      summary: Counts by type and status, and not-onboarded among due and overdue
      description: "A cycle's counts (the current cycle by default: the latest opened, or the next while none has): its biennials, open initial and final obligations, and those filed in the cycle's two years. Staff of the Commission, platform admins and EACC roles; staff of another Commission get 404."
      operationId: getCommissionObligationsSummary
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: cycle
          required: false
          in: query
          description: A biennial cycle key, e.g. `biennial:2027`; the current cycle when omitted
          schema:
            examples:
              - biennial:2027
            type: string
            pattern: ^biennial:(\d{4})$
      responses:
        '200':
          description: The summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionSummary'
        '400':
          description: Query failed validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            Not a Commission's staff, an EACC role or a platform admin

            Requires one of the roles: reporting-officer, reviewer, supervisor, commission-admin, eacc-analyst, eacc-supervisor, platform-admin
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/declarations/progress:
    get:
      tags:
        - obligations
      summary: Declarants not started, in progress, submitted and late, per reporting entity
      description: "A cycle's obligations (the current cycle by default, scoped as the obligations summary) counted per reporting entity: `submitted` when filed, `late` when overdue, otherwise `inProgress` with a live draft and `notStarted` without one. Counts only, no declarant or draft content. The Commission's reporting officers and commission admins; anyone else gets 404."
      operationId: getCommissionDeclarationProgress
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: cycle
          required: false
          in: query
          description: A biennial cycle key, e.g. `biennial:2027`; the current cycle when omitted
          schema:
            examples:
              - biennial:2027
            type: string
            pattern: ^biennial:(\d{4})$
      responses:
        '200':
          description: Counts per reporting entity and totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclarationProgress'
        '400':
          description: Query failed validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/obligations:
    get:
      tags:
        - obligations
      summary: Declarants and their obligations for a Commission
      description: Staff of the tenant and platform-admin. EACC roles get 403 (summaries only); staff of another Commission 404.
      operationId: listCommissionObligations
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: type
          required: false
          in: query
          schema:
            type: string
            enum:
              - initial
              - biennial
              - final
        - name: status
          required: false
          in: query
          description: Only obligations with this status; cancelled ones only when asked for
          schema:
            type: string
            enum:
              - upcoming
              - due
              - overdue
              - filed
              - cancelled
        - name: onboarded
          required: false
          in: query
          description: Only declarants who have onboarded, or only those who have not
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: cycle
          required: false
          in: query
          description: Only obligations with this cycle key
          schema:
            examples:
              - biennial:2027
              - initial:2027-03-10
            type: string
            minLength: 1
            maxLength: 40
        - name: search
          required: false
          in: query
          description: A personnel file number or its beginning, or part of a name (both case-insensitive); blank means no search
          schema:
            type: string
            maxLength: 100
        - name: cursor
          required: false
          in: query
          description: '`nextCursor` of the previous page; omit for the first page'
          schema:
            type: string
            maxLength: 500
        - name: limit
          required: false
          in: query
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Page ordered by due date, overdue first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObligationPage'
        '400':
          description: Query failed validation, or the cursor is unknown
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            Not a Commission's staff or a platform admin (EACC sees counts only)

            Requires one of the roles: reporting-officer, reviewer, supervisor, commission-admin, platform-admin
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: obligations.listed
        resource: filing-obligation
  /v1/obligations/{id}/declaration:
    post:
      tags:
        - declarations
      summary: Start (or return the existing) draft declaration for the declarant's obligation
      description: Type, statement date and income period are derived from the obligation; bio is pre-filled from the roster record. Declarant only.
      operationId: startDeclaration
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Existing draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Declaration'
        '201':
          description: Draft created with pre-filled bio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Declaration'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Obligation is filed or cancelled (`obligation-closed`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The roster record could not be read (`directory-unavailable`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/declarations/{declarationId}:
    get:
      tags:
        - declarations
      summary: Draft header and section completeness (no contents)
      operationId: getDeclaration
      parameters:
        - name: declarationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The draft
          headers:
            ETag:
              schema:
                type: string
              description: The draft version; send it as If-Match on section saves
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Declaration'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags:
        - declarations
      summary: Discard the draft
      description: 'Deletes the sections and attachments (records `declaration.attachment-unlinked.v1` for each, then `declaration.draft-discarded.v1`). The obligation is untouched: starting again makes a fresh draft.'
      operationId: discardDeclaration
      parameters:
        - name: declarationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Discarded
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Not a draft (`declaration-not-draft`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/me/declarations:
    get:
      tags:
        - declarations
      summary: "The signed-in declarant's declarations: drafts, submitted and being amended"
      description: Live declarations across Commissions, last updated first, with the share of live sections complete and, once submitted, the reference, the version in force (submitted at, late, acknowledgement slip) and whether Amend is open today (until the due date, Africa/Nairobi), so the list renders without a call per row. Authorised by the person_id claim; staff tokens without it get 404.
      operationId: getMyDeclarations
      responses:
        '200':
          description: Declarations, last updated first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeclarationListItem'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/declarations/{declarationId}/summary:
    get:
      tags:
        - declarations
      summary: The assembled declaration validated against declaration.v1, with what blocks submission
      description: Assembled from the live sections (archived statements left out), paragraph 9 material changes composed from the items. `canSubmit` is false in this slice.
      operationId: getDeclarationSummary
      parameters:
        - name: declarationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclarationSummary'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: declaration.summary.read
        resource: declaration
  /v1/declarations/{declarationId}/sections/{sectionKey}:
    get:
      tags:
        - declarations
      summary: One section's contents (decrypted for the owning declarant)
      operationId: getDeclarationSection
      parameters:
        - name: declarationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: sectionKey
          required: true
          in: path
          schema:
            $ref: '#/components/schemas/SectionKey'
      responses:
        '200':
          description: Section contents
          headers:
            ETag:
              schema:
                type: string
              description: The draft version; send it as If-Match on section saves
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionEnvelope'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: declaration.section.read
        resource: declaration-section
    put:
      tags:
        - declarations
      summary: Save a section (autosave); requires If-Match with the current draft version
      description: "The whole section is sent. Missing fields are saved and reported as completeness issues; a malformed body is refused. Locked bio fields may be left out. Each item's `source` is the service's (set by `acceptSuggestion`): kept as stored whatever is sent, none on an item that had none, and without `verificationResultId` once the item changes where the registry spoke."
      operationId: saveDeclarationSection
      parameters:
        - name: declarationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: sectionKey
          required: true
          in: path
          schema:
            $ref: '#/components/schemas/SectionKey'
        - name: If-Match
          in: header
          description: The draft version read (its ETag)
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectionContents'
      responses:
        '200':
          description: Saved; new version in ETag
          headers:
            ETag:
              schema:
                type: string
              description: The draft version; send it as If-Match on section saves
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionSaveResult'
        '400':
          description: Validation failed, or a locked field was changed (`identity-locked-field`), or a nil flag conflicts with items (`nil-conflicts-with-items`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Not a draft (`declaration-not-draft`), or the statement is archived (`section-archived`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '412':
          description: If-Match does not match the current draft version (`draft-version-mismatch`); reload
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '428':
          description: If-Match header missing (`if-match-required`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/declarations/{declarationId}/attachments:
    post:
      tags:
        - declarations
      summary: Link a clean upload (purpose declaration-attachment) to an item
      description: The upload must be the Commission's, clean, and uploaded with purpose declaration-attachment. Its name, SHA-256 and size are kept, and a reference is added to the item inside the encrypted statement. Records `declaration.attachment-linked.v1`.
      operationId: linkDeclarationAttachment
      parameters:
        - name: declarationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentLink'
      responses:
        '201':
          description: Linked; new draft version in ETag
          headers:
            ETag:
              schema:
                type: string
              description: The new draft version; send it as If-Match on the next section save
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclarationAttachment'
        '400':
          description: Request failed validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller, or the statement has no such item
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Upload is unknown or another Commission's (`upload-not-found`), not clean (`upload-not-clean`), has the wrong purpose (`upload-wrong-purpose`) or is attached already (`upload-already-linked`); or not a draft (`declaration-not-draft`), or the statement is archived (`section-archived`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The upload could not be checked (`documents-unavailable`); retry
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/declarations/{declarationId}/attachments/{attachmentId}:
    delete:
      tags:
        - declarations
      summary: Remove an attachment from its item
      description: Removes the attachment and the item's reference to it. The file is left to the documents orphan sweep. Records `declaration.attachment-unlinked.v1`.
      operationId: unlinkDeclarationAttachment
      parameters:
        - name: declarationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: attachmentId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Unlinked; new draft version in ETag
          headers:
            ETag:
              schema:
                type: string
              description: The new draft version; send it as If-Match on the next section save
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Not a draft (`declaration-not-draft`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/declarations/{declarationId}/submit:
    post:
      tags:
        - submission
      summary: Submit the declaration (the legal act)
      description: 'Requires a token with the step-up ACR and auth_time within 5 minutes, and an Idempotency-Key (a retry with the same key gets the same answer). One transaction: validate, allocate the reference (first version), write the immutable version and items, mark submitted, file the obligation (late after its due date), record `declaration.submitted.v1` and `obligation.status-changed.v1`. The acknowledgement slip is issued asynchronously afterwards.'
      operationId: submitDeclaration
      parameters:
        - name: declarationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Client-generated UUID, unique per logical request; reuse on retry
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Submitted; acknowledgement pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResult'
        '400':
          description: Problem code `incomplete` with `blocking`, or the Idempotency-Key header missing (`idempotency-key-missing`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SubmitProblem'
        '403':
          description: Problem code `step-up-required` with `stepUpUrl`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SubmitProblem'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Problem code `not-a-draft`, `before-statement-date`, `amendment-window-closed` or `obligation-cancelled`; or a request with the same Idempotency-Key still running (`idempotency-key-in-use`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SubmitProblem'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/declarations/{declarationId}/amend:
    post:
      tags:
        - submission
      summary: Reopen a submitted declaration for amendment (until the due date)
      description: Until the obligation's due date (the due date itself included; Africa/Nairobi by the service's clock). The version in force is copied into editable sections, the declaration is `amending` with `amendingFromVersion`, and `declaration.amendment-started.v1` is recorded. The version stays in force until the amendment is submitted as the next version. An amendment already in progress is answered as it is.
      operationId: amendDeclaration
      parameters:
        - name: declarationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Amending, with sections copied from the version in force
          headers:
            ETag:
              schema:
                type: string
              description: The draft version; send it as If-Match on section saves
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Declaration'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Problem code `not-submitted` (never submitted), `amendment-window-closed` (after the due date) or `obligation-cancelled`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SubmitProblem'
  /v1/declarations/{declarationId}/amend/discard:
    post:
      tags:
        - submission
      summary: Discard the amendment in progress; the version in force stays
      description: The declaration is `submitted` again, its sections as the version in force has them (what the amendment changed, attachments included, is taken back); `declaration.amendment-discarded.v1` is recorded. No version changes. A submitted declaration with no amendment in progress is answered as it is.
      operationId: discardAmendment
      parameters:
        - name: declarationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Submitted again
          headers:
            ETag:
              schema:
                type: string
              description: The draft version; send it as If-Match on section saves
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Declaration'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: 'Problem code `not-submitted`: a draft, discarded with discardDeclaration'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SubmitProblem'
        '503':
          description: An attachment the amendment unlinked could not be checked with documents (`documents-unavailable`); retry
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/declarations/{declarationId}/versions:
    get:
      tags:
        - submission
      summary: Submitted versions, newest first
      description: Every version with its reference, submission time, lateness, hash, supersession and acknowledgement slip; empty before the first submission.
      operationId: listDeclarationVersions
      parameters:
        - name: declarationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Versions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeclarationVersion'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/declarations/{declarationId}/versions/{version}:
    get:
      tags:
        - submission
      summary: One immutable version with its document (decrypted for the declarant)
      description: The version as listed, with the `declaration.v1` document exactly as submitted (the canonical JSON `canonicalSha256` is the hash of), decrypted for the declarant. Only the declarant reads it, their own record, which is not audited (ADR-008).
      operationId: getDeclarationVersion
      parameters:
        - name: declarationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: version
          required: true
          in: path
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclarationVersionDetail'
        '400':
          description: version is not a positive integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: declaration.version.read
        resource: declaration-version
  /v1/declarations/{declarationId}/versions/{version}/acknowledgement:
    get:
      tags:
        - submission
      summary: Acknowledgement slip status and download link for a version
      description: 'The declarant only. `pending` while the documents service prepares the slip (seconds after submission), `issued` with the document and its verification code once set on the version, `failed` when it has not come within a minute of the submission or of the last reissue (the stored acknowledgement stays pending): it may be asked for again. The slip downloads from the documents service (`getDocumentDownload` with `documentId`).'
      operationId: getAcknowledgement
      parameters:
        - name: declarationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: version
          required: true
          in: path
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acknowledgement'
        '400':
          description: version is not a positive integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/declarations/{declarationId}/versions/{version}/acknowledgement/reissue:
    post:
      tags:
        - submission
      summary: Ask for the slip again when issuance failed
      description: 'The declarant only. Accepted (202) once the slip has not come within a minute of the submission, or of the last reissue: the acknowledgement is `failed` (still `pending` as stored); records `declaration.acknowledgement-requested.v1`, the documents service issues the slip (or announces the one it issued), and the acknowledgement is `pending` again for a minute. 409 `acknowledgement-issued` once issued; 409 `acknowledgement-in-progress` within a minute of the submission; 429 `resend-cooldown` with `retryAfterSeconds` within a minute of the last reissue.'
      operationId: reissueAcknowledgement
      parameters:
        - name: declarationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: version
          required: true
          in: path
          schema:
            type: integer
            minimum: 1
        - name: Idempotency-Key
          in: header
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Reissue requested
        '400':
          description: version is not a positive integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Problem code `acknowledgement-issued` (the slip is issued) or `acknowledgement-in-progress` (within a minute of the submission)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: 'Problem code `resend-cooldown` with `retryAfterSeconds`: within a minute of the last reissue'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/declarations/{declarationId}/versions/{version}/acknowledgement-payload:
