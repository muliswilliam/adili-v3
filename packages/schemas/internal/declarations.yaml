  /v1/declarations/{declarationId}/suggestions/lookups:
    post:
      tags:
        - suggestions
      summary: Check registries for a household person with recorded consent (declarant); results arrive as suggestions
      description: 'The declarant is looked up by the national ID on their person record, as verified at onboarding; a spouse or child by the one in Household. Records the consent (who, when, text version, registries) and answers one `pending` set per registry: the integration-gateway is asked for each with legal basis `declarant-request` and the declaration as case reference, retried with backoff while a registry does not answer, then `unavailable`. Poll `listSuggestions` until no set is `pending`. Records `declaration.lookup-requested.v1` (the audit record of the consent: who, text version, person, registries), and `declaration.suggestions-ready.v1` per registry that answers. A registry checked again supersedes its earlier `new` suggestions for the person, keeping accepted and dismissed ones; what it suggests again that the declarant has dismissed, or accepted and still declares with that identifier (same item type and identifier: registration, parcel, company or KRA PIN; for the income hint, the same section) arrives `superseded`, not `new`.'
      operationId: requestRegistryLookups
      parameters:
        - name: declarationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Client-generated UUID, unique per logical request; reuse on retry
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistryLookupRequest'
      responses:
        '202':
          description: Lookups started; one set per system
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SuggestionSet'
        '400':
          description: The declarant did not request the check (`consent-required`), the spouse or child has no national ID in Household (`no-id`), the request failed validation (an unknown registry, or a person not in the household), or the Idempotency-Key header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Not a draft (`declaration-not-draft`), or a request with the same Idempotency-Key still running
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/declarations/{declarationId}/suggestions:
    get:
      tags:
        - suggestions
      summary: Suggestion sets and suggestions for the draft (declarant)
      description: 'Oldest request first. Narrowed to a person, or to the suggestions of a section: a set with suggestions, none in the section, is left out; one with none yet is kept so a pending lookup can be polled.'
      operationId: listSuggestions
      parameters:
        - name: declarationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: personKey
          required: false
          in: query
          description: Only the sets of this person
          schema:
            type: string
        - name: sectionKey
          required: false
          in: query
          description: Only the suggestions for this section (and sets with none yet)
          schema:
            type: string
            pattern: ^(bio|household|other|statement:(officer|spouse:[0-9a-f-]{36}|child:[0-9a-f-]{36}))$
      responses:
        '200':
          description: Sets with suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SuggestionSet'
        '400':
          description: Query failed validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: declaration.suggestions.read
        resource: declaration
  /v1/declarations/{declarationId}/suggestions/{suggestionId}/accept:
    post:
      tags:
        - suggestions
      summary: Add the suggestion as an item, or apply it to an existing item (declarant); through the section save
      description: "A read-modify-write of the suggestion's section on the declarant's behalf, as a section save with `If-Match`: a new item carries the suggestion as its `source` (declaration.v1 `ItemSource`), naming the registry's `verificationResultId` only when the item ends up holding what the registry gave (the description aside), so not for one the declarant edited or whose own differing values were kept; applied to an item (`applyToItemId`), only the fields the item leaves empty are filled unless `overwrite`, and the item takes the `source` if it has none, or with `overwrite`. Values are never filled. Where each type lands: `vehicle`, `land`, `shareholding` an asset of the person's statement; `income-hint` a salary income with no amount; `directorship` a registrable interest in `other`; a spouse's `bio-tax` their KRA PIN in `household` (the declarant's own has no field, 400). The suggestion becomes `accepted` with the item; the save records `declaration.section-saved.v1` and `declaration.suggestion-accepted.v1`."
      operationId: acceptSuggestion
      parameters:
        - name: declarationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: suggestionId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          description: The draft version read (its ETag)
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptSuggestionRequest'
      responses:
        '200':
          description: Item added or filled; new draft version in ETag
          headers:
            ETag:
              schema:
                type: string
              description: The draft version; send it as If-Match on section saves
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionAcceptance'
        '400':
          description: "Validation failed: the fields do not fit the item, `applyToItemId` is not an item of the suggestion's type in its section or (without `overwrite`) holds another registration, parcel or company, or the suggestion has no place in the declaration (the declarant's own KRA PIN)"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: The suggestion is not `new` (`not-new`), the draft changed since If-Match (`draft-version-mismatch`; read the section and try again), not a draft (`declaration-not-draft`), or the statement is archived (`section-archived`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '428':
          description: If-Match header missing (`if-match-required`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: declaration.suggestion.read
        resource: declaration-suggestion
  /v1/declarations/{declarationId}/suggestions/{suggestionId}/dismiss:
    post:
      tags:
        - suggestions
      summary: Set a suggestion aside, with an optional reason (declarant)
      description: The suggestion becomes `dismissed`, with the reason if given; the draft is untouched. Dismissing it again changes nothing. Records `declaration.suggestion-dismissed.v1` (identifiers only). A later check of the registry does not offer it as new again.
      operationId: dismissSuggestion
      parameters:
        - name: declarationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: suggestionId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DismissSuggestionRequest'
      responses:
        '200':
          description: Dismissed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Suggestion'
        '400':
          description: Validation failed (a reason over 200 characters)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: 'Not `new` and not dismissed already: accepted, or replaced by a later check (`not-new`); or not a draft (`declaration-not-draft`)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: declaration.suggestion.read
        resource: declaration-suggestion
  /v1/declarations/{declarationId}/attachments/{attachmentId}/extract:
    parameters:
      - $ref: '#/components/parameters/DeclarationId'
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - suggestions
      summary: Read a clean attachment into suggested fields through the ai-gateway (declarant); policy-gated
      operationId: extractAttachment
      x-draft: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - documentKindHint
                - targetItemType
              properties:
                documentKindHint:
                  type: string
                  enum:
                    - title-deed
                    - logbook
                    - payslip
                    - bank-letter
                    - share-certificate
                    - other
                targetItemType:
                  type: string
                language:
                  type: string
                  enum:
                    - en
                    - sw
                  default: en
      responses:
        '202':
          description: Extraction requested; a suggestion set of source `document`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionSet'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Attachment not clean, or AI reading not enabled for this Commission (`not-enabled`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/me/assistant/suggested-questions:
    get:
      tags:
        - assistant
      summary: Curated and popular questions for a section in a language
      operationId: getSuggestedQuestions
      x-draft: true
      parameters:
        - name: sectionKey
          in: query
          schema:
            type: string
        - name: language
          in: query
          required: true
          schema:
            type: string
            enum:
              - en
              - sw
      responses:
        '200':
          description: Questions
          content:
            application/json:
              schema:
                type: array
                maxItems: 8
                items:
                  type: string
  /v1/help/search/preview:
    get:
      tags:
        - help
      summary: Help search as a Commission's declarants (or every declarant) would see it, for the staff who write the articles
      description: "A Commission's administrators and reporting officers, with `commission` their own Commission: the Act and Regulations, the platform's published articles and the Commission's, in force on `date`, ranked as `searchHelp` ranks them for its declarants. Platform admins, without `commission`: the law and the platform's articles, as every declarant gets them. A just-published article is found at once. Deterministic: no AI. Anyone else, or another Commission, gets 404."
      operationId: previewHelpSearch
      x-draft: true
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 200
        - name: language
          in: query
          required: true
          schema:
            type: string
            enum:
              - en
              - sw
        - name: commission
          in: query
          required: false
          description: The Commission whose declarants to search as; the platform's articles only when left out (platform admins)
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: date
          in: query
          required: false
          description: Read the law in force on this day (`YYYY-MM-DD`); today by default
          schema:
            type: string
            format: date
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 8
      responses:
        '200':
          description: Passages, best first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HelpPassage'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/help/corpus/{passageId}:
    get:
      tags:
        - help
      summary: One wording of the statutory corpus with its text in English and Kiswahili
      description: 'platform-admin only. Read-only: statutory text changes only by import.'
      operationId: getCorpusPassage
      x-draft: true
      parameters:
        - name: passageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The wording
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusPassageText'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    ObligationType:
      type: string
      enum:
        - initial
        - biennial
        - final
    ObligationStatus:
      type: string
      enum:
        - upcoming
        - due
        - overdue
        - filed
        - cancelled
    CancelReason:
      type: string
      enum:
        - exited-before-statement-date
        - exit-reversed
        - superseded
        - before-obligations-start-date
    ReminderOutcome:
      type: string
      enum:
        - sent
        - skipped-not-onboarded
        - skipped-no-contact
        - skipped-past-due-at-creation
        - skipped-missed
        - failed
    ReminderChannel:
      type: string
      enum:
        - sms
        - email
    CommissionRef:
      type: object
      properties:
        slug:
          type: string
        issuerCode:
          type: string
        name:
          type: string
      required:
        - slug
        - issuerCode
        - name
    Obligation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        commission:
          $ref: '#/components/schemas/CommissionRef'
        type:
          $ref: '#/components/schemas/ObligationType'
        cycleKey:
          type: string
          description: Unique per declarant among live obligations
          examples:
            - biennial:2027
            - initial:2027-03-10
            - final:2027-09-15
        statementDate:
          type: string
          format: date
          description: The date the declaration is made as at
        dueDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/ObligationStatus'
        cancelReason:
          anyOf:
            - $ref: '#/components/schemas/CancelReason'
            - type: 'null'
          description: Set when cancelled
        remindersSent:
          type: integer
          description: Reminders sent so far
        policyVersion:
          type: integer
          description: The Commission's policy version the obligation was created under
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - commission
        - type
        - cycleKey
        - statementDate
        - dueDate
        - status
        - cancelReason
        - remindersSent
        - policyVersion
        - createdAt
    Reminder:
      type: object
      properties:
        offsetDays:
          type: integer
          description: Days before the due date
        scheduledAt:
          type: string
          format: date-time
        sentAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          description: Null unless sent
        channels:
          type: array
          items:
            $ref: '#/components/schemas/ReminderChannel'
          description: The channels it went by
        outcome:
          $ref: '#/components/schemas/ReminderOutcome'
      required:
        - offsetDays
        - scheduledAt
        - sentAt
        - channels
        - outcome
    DeclarantRef:
      type: object
      properties:
        rosterRecordId:
          type: string
          format: uuid
        personnelFileNumber:
          type: string
        fullName:
          type: string
        onboarded:
          type: boolean
        ofr:
          type:
            - string
            - 'null'
      required:
        - rosterRecordId
        - personnelFileNumber
        - fullName
        - onboarded
        - ofr
    ObligationDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        commission:
          $ref: '#/components/schemas/CommissionRef'
        type:
          $ref: '#/components/schemas/ObligationType'
        cycleKey:
          type: string
          description: Unique per declarant among live obligations
          examples:
            - biennial:2027
            - initial:2027-03-10
            - final:2027-09-15
        statementDate:
          type: string
          format: date
          description: The date the declaration is made as at
        dueDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/ObligationStatus'
        cancelReason:
          anyOf:
            - $ref: '#/components/schemas/CancelReason'
            - type: 'null'
          description: Set when cancelled
        remindersSent:
          type: integer
          description: Reminders sent so far
        policyVersion:
          type: integer
          description: The Commission's policy version the obligation was created under
        createdAt:
          type: string
          format: date-time
        reminders:
          type: array
          items:
            $ref: '#/components/schemas/Reminder'
          description: Reminder history, by scheduled time
        declarant:
          anyOf:
            - $ref: '#/components/schemas/DeclarantRef'
            - type: 'null'
          description: Present for staff callers; null for the declarant's own view
      required:
        - id
        - commission
        - type
        - cycleKey
        - statementDate
        - dueDate
        - status
        - cancelReason
        - remindersSent
        - policyVersion
        - createdAt
        - reminders
        - declarant
    MyObligations:
      type: object
      properties:
        groups:
          type: array
          items:
            type: object
            properties:
              commission:
                $ref: '#/components/schemas/CommissionRef'
              obligations:
                type: array
                items:
                  $ref: '#/components/schemas/Obligation'
                description: Overdue first, then by due date; cancelled ones left out
            required:
              - commission
              - obligations
          description: One group per Commission, by name
      required:
        - groups
    ObligationListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        commission:
          $ref: '#/components/schemas/CommissionRef'
        type:
          $ref: '#/components/schemas/ObligationType'
        cycleKey:
          type: string
          description: Unique per declarant among live obligations
          examples:
            - biennial:2027
            - initial:2027-03-10
            - final:2027-09-15
        statementDate:
          type: string
          format: date
          description: The date the declaration is made as at
        dueDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/ObligationStatus'
        cancelReason:
          anyOf:
            - $ref: '#/components/schemas/CancelReason'
            - type: 'null'
          description: Set when cancelled
        remindersSent:
          type: integer
          description: Reminders sent so far
        policyVersion:
          type: integer
          description: The Commission's policy version the obligation was created under
        createdAt:
          type: string
          format: date-time
        declarant:
          $ref: '#/components/schemas/DeclarantRef'
        lastReminder:
          anyOf:
            - $ref: '#/components/schemas/Reminder'
            - type: 'null'
          description: The obligation's latest reminder (by scheduled time); null before any
      required:
        - id
        - commission
        - type
        - cycleKey
        - statementDate
        - dueDate
        - status
        - cancelReason
        - remindersSent
        - policyVersion
        - createdAt
        - declarant
        - lastReminder
    ObligationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ObligationListItem'
        nextCursor:
          description: Pass as `cursor` for the next page; null on the last
          type:
            - string
            - 'null'
      required:
        - items
        - nextCursor
    StatusCounts:
      type: object
      properties:
        upcoming:
          type: integer
        due:
          type: integer
        overdue:
          type: integer
        filed:
          type: integer
        filedLate:
          type: integer
          description: Of those filed, the ones filed after their due date
      required:
        - upcoming
        - due
        - overdue
        - filed
        - filedLate
    SummaryCycle:
      type: object
      properties:
        key:
          type: string
          examples:
            - biennial:2027
        statementDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        opensOn:
          type: string
          format: date
          description: "The day the cycle's biennial obligations are created: the statement date less the calendar's opening lead"
        opened:
          type: boolean
          description: 'Whether the cycle has opened: its opening day has come (Africa/Nairobi), or its biennials were already created'
      required:
        - key
        - statementDate
        - dueDate
        - opensOn
        - opened
    CommissionSummary:
      type: object
      properties:
        commission:
          $ref: '#/components/schemas/CommissionRef'
        cycle:
          description: 'The cycle counted: the one asked for, or the current one (the latest opened, or the first while none has)'
          $ref: '#/components/schemas/SummaryCycle'
        cycles:
          type: array
          items:
            $ref: '#/components/schemas/SummaryCycle'
          description: Every cycle of the calendar under the Commission's policy, oldest first
        total:
          $ref: '#/components/schemas/StatusCounts'
        byType:
          type: object
          properties:
            initial:
              $ref: '#/components/schemas/StatusCounts'
            biennial:
              $ref: '#/components/schemas/StatusCounts'
            final:
              $ref: '#/components/schemas/StatusCounts'
          required:
            - initial
            - biennial
            - final
        notOnboarded:
          type: object
          properties:
            due:
              type: integer
            overdue:
              type: integer
          required:
            - due
            - overdue
          description: Declarants with a due or overdue obligation who have not onboarded, each counted once under their worst status
      required:
        - commission
        - cycle
        - cycles
        - total
        - byType
        - notOnboarded
    NationalSummary:
      type: object
      properties:
        cycle:
          description: 'The cycle counted, under the statutory dates: the one asked for, or the current one'
          $ref: '#/components/schemas/SummaryCycle'
        commissions:
          type: array
          items:
            type: object
            properties:
              commission:
                $ref: '#/components/schemas/CommissionRef'
              total:
                $ref: '#/components/schemas/StatusCounts'
              notOnboarded:
                type: integer
                description: Declarants with a due or overdue obligation who have not onboarded
              lastRosterImportAt:
                anyOf:
                  - type: string
                    format: date-time
                  - type: 'null'
                description: When the Commission's latest roster import completed; null before any
            required:
              - commission
              - total
              - notOnboarded
              - lastRosterImportAt
          description: Every Commission the service has had a roster event for, by name
        totals:
          $ref: '#/components/schemas/StatusCounts'
      required:
        - cycle
        - commissions
        - totals
    ProgressCounts:
      type: object
      properties:
        notStarted:
          type: integer
          description: Upcoming or due, with no live draft
        inProgress:
          type: integer
          description: Upcoming or due, with a live draft
        submitted:
          type: integer
          description: Filed
        late:
          type: integer
          description: Overdue and not filed, with or without a draft
      required:
        - notStarted
        - inProgress
        - submitted
        - late
    ReportingEntityRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: As the roster names it
      required:
        - id
        - name
    DeclarationProgress:
      type: object
      properties:
        commission:
          $ref: '#/components/schemas/CommissionRef'
        cycle:
          description: 'The cycle counted: the one asked for, or the current one (the latest opened, or the first while none has)'
          $ref: '#/components/schemas/SummaryCycle'
        cycles:
          type: array
          items:
            $ref: '#/components/schemas/SummaryCycle'
          description: Every cycle of the calendar under the Commission's policy, oldest first
        reportingEntities:
          type: array
          items:
            type: object
            properties:
              reportingEntity:
                anyOf:
                  - $ref: '#/components/schemas/ReportingEntityRef'
                  - type: 'null'
                description: Null for declarants whose roster record names none
              counts:
                $ref: '#/components/schemas/ProgressCounts'
            required:
              - reportingEntity
              - counts
          description: One entry per reporting entity with an obligation counted, by name, those with none last
        total:
          $ref: '#/components/schemas/ProgressCounts'
      required:
        - commission
        - cycle
        - cycles
        - reportingEntities
        - total
    DeclarationReference:
      type: string
      pattern: ^DC[IBF]-[A-Z][A-Z0-9]{1,19}-[0-9]{4}-[0-9]{7}-[0-9A-Z]$
      description: 'ADR-011: DC{I|B|F}-<ISSUER>-<YEAR>-<7 digits>-<check>, allocated at the first submission and kept by later versions'
      examples:
        - DCB-TSC-2027-0012345-K
    SectionKey:
      type: string
      pattern: ^(bio|household|other|statement:(officer|spouse:[0-9a-f-]{36}|child:[0-9a-f-]{36}))$
      description: bio, household, other, or statement:<personKey>
    Completeness:
      type: string
      enum:
        - not-started
        - incomplete
        - complete
        - archived
    DeclarationStatus:
      type: string
      enum:
        - draft
        - amending
        - submitted
        - discarded
    Declaration:
      type: object
      properties:
        id:
          type: string
          format: uuid
        obligationId:
          type: string
          format: uuid
        commission:
          $ref: '#/components/schemas/CommissionRef'
        type:
          $ref: '#/components/schemas/ObligationType'
        statementDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
          description: "The obligation's due date: filed after it is late, and amendments close on it"
        incomePeriod:
          type: object
          properties:
            from:
              type: string
              format: date
              description: 'Exclusive: the income period is (from, to]'
            to:
              type: string
              format: date
            fromSource:
              type: string
              enum:
                - declared
                - assumed
              description: '`declared`: from is the statement date of a declaration on Adili; `assumed`: there is none, so it was derived from the type'
          required:
            - from
            - to
            - fromSource
        status:
          $ref: '#/components/schemas/DeclarationStatus'
        schemaVersion:
          type: string
          const: declaration.v1
        draftVersion:
          type: integer
          description: Also the ETag; send it as If-Match on section saves
        sections:
          type: array
          items:
            type: object
            properties:
              key:
                $ref: '#/components/schemas/SectionKey'
              completeness:
                $ref: '#/components/schemas/Completeness'
              updatedAt:
                anyOf:
                  - type: string
                    format: date-time
                  - type: 'null'
                description: Null until the declarant first saves the section
              personName:
                description: Whose financial statement it is, for statement sections
                type:
                  - string
                  - 'null'
              counts:
                description: Items by category, e.g. income, assets, liabilities
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  type: integer
            required:
              - key
              - completeness
              - updatedAt
              - personName
          description: Sections in First Schedule order; archived statements listed with completeness archived
        lastSection:
          anyOf:
            - $ref: '#/components/schemas/SectionKey'
            - type: 'null'
        reference:
          anyOf:
            - $ref: '#/components/schemas/DeclarationReference'
            - type: 'null'
          description: Allocated at the first submission; null before
        currentVersion:
          anyOf:
            - type: integer
              minimum: 1
            - type: 'null'
          description: The submitted version in force; null before the first submission
        amendingFromVersion:
          anyOf:
            - type: integer
              minimum: 1
            - type: 'null'
          description: The version an amendment in progress started from; null unless amending
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - obligationId
        - commission
        - type
        - statementDate
        - dueDate
        - incomePeriod
        - status
        - schemaVersion
        - draftVersion
        - sections
        - lastSection
        - reference
        - currentVersion
        - amendingFromVersion
        - createdAt
        - updatedAt
    SectionContents:
      type: object
      propertyNames:
        type: string
      additionalProperties: {}
      description: 'The section body; shape per key follows forms/declaration.v1.json: bio → officer, household → { spouses, children }, statement:* → Statement, other → otherInformation'
    CompletenessIssue:
      type: object
      properties:
        sectionKey:
          $ref: '#/components/schemas/SectionKey'
        path:
          type: string
          description: JSON pointer within the section contents
        code:
          type: string
        message:
          type: string
      required:
        - sectionKey
        - path
        - code
        - message
    NotIncluded:
      type: array
      items:
        type: object
        properties:
          personKey:
            type: string
            pattern: ^child:[0-9a-f-]{36}$
          reason:
            type: string
            enum:
              - over-18-at-statement-date
        required:
          - personKey
          - reason
      description: 'Household only: children listed who get no financial statement, with the reason (eighteen or older on the statement date)'
    SectionEnvelope:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/SectionKey'
        completeness:
          $ref: '#/components/schemas/Completeness'
        contents:
          $ref: '#/components/schemas/SectionContents'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/CompletenessIssue'
        notIncluded:
          $ref: '#/components/schemas/NotIncluded'
        prefilledFields:
          type: array
          items:
            type: string
          description: "Bio only: the editable fields pre-filled from the Commission's roster (job group, appointment date, work station, marital status) that still hold the roster's value, as JSON pointers into `contents`, e.g. `/employment/jobGroup`. A save that changes or clears one drops it for good. Fields the roster locks are not listed."
          examples:
            - - /employment/jobGroup
              - /maritalStatus
        draftVersion:
          type: integer
      required:
        - key
        - completeness
        - contents
        - issues
        - draftVersion
    SectionSaveResult:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/SectionKey'
        completeness:
          $ref: '#/components/schemas/Completeness'
        draftVersion:
          type: integer
        issues:
          type: array
          items:
            $ref: '#/components/schemas/CompletenessIssue'
        notIncluded:
          $ref: '#/components/schemas/NotIncluded'
        prefilledFields:
          type: array
          items:
            type: string
          description: "Bio only: the editable fields pre-filled from the Commission's roster (job group, appointment date, work station, marital status) that still hold the roster's value, as JSON pointers into `contents`, e.g. `/employment/jobGroup`. A save that changes or clears one drops it for good. Fields the roster locks are not listed."
          examples:
            - - /employment/jobGroup
              - /maritalStatus
        sectionsChanged:
          type: array
          items:
            type: object
            properties:
