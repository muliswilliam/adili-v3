openapi: 3.1.0
info:
  title: declarations API - filing obligations (draft)
  version: '1'
  description: |
    Draft contract for specs 04 (obligations, read-only) and 05 (declaration drafts). The declarations service's Swagger
    document becomes the source of truth once implemented.
servers:
  - url: http://localhost:4002
security:
  - bearer: []
tags:
  - name: obligations
  - name: declarations
paths:
  /v1/me/obligations:
    get:
      tags: [obligations]
      operationId: getMyObligations
      summary: The signed-in declarant's obligations across Commissions
      description: Authorised by the person_id claim. Staff tokens without it get 404.
      responses:
        '200':
          description: Obligations grouped by Commission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyObligations'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/obligations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [obligations]
      operationId: getObligation
      summary: One obligation with its reminder history
      responses:
        '200':
          description: The obligation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObligationDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/obligations/summary:
    get:
      tags: [obligations]
      operationId: getNationalObligationsSummary
      summary: Per-Commission counts for EACC and platform administrators
      parameters:
        - name: cycle
          in: query
          schema:
            type: string
            examples: ['biennial:2027']
      responses:
        '200':
          description: Counts per Commission and totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NationalSummary'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/commissions/{slug}/obligations/summary:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [obligations]
      operationId: getCommissionObligationsSummary
      summary: Counts by type and status, and not-onboarded among due and overdue
      parameters:
        - name: cycle
          in: query
          schema:
            type: string
      responses:
        '200':
          description: The summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionSummary'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/commissions/{slug}/obligations:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [obligations]
      operationId: listCommissionObligations
      summary: Officers and their obligations for a Commission
      description: Staff of the tenant and platform-admin. EACC roles get 403 (summaries only).
      parameters:
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/ObligationType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ObligationStatus'
        - name: onboarded
          in: query
          schema:
            type: boolean
        - name: cycle
          in: query
          schema:
            type: string
        - name: search
          in: query
          description: Personnel file number prefix or name fragment
          schema:
            type: string
            maxLength: 100
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Page ordered by due date, overdue first
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ObligationListItem'
                  nextCursor:
                    type: [string, 'null']
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/obligations/{id}/declaration:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [declarations]
      operationId: startDeclaration
      summary: Start (or return the existing) draft declaration for the declarant's obligation
      description: Type, statement date and income period are derived from the obligation. Declarant only.
      responses:
        '200':
          description: Existing draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Declaration'
        '201':
          description: Draft created with pre-filled bio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Declaration'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Obligation is filed or cancelled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/me/declarations:
    get:
      tags: [declarations]
      operationId: getMyDeclarations
      summary: The declarant's declarations (drafts now; submitted later)
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeclarationListItem'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/declarations/{declarationId}:
    parameters:
      - $ref: '#/components/parameters/DeclarationId'
    get:
      tags: [declarations]
      operationId: getDeclaration
      summary: Draft header and section completeness (no contents)
      responses:
        '200':
          description: The draft
          headers:
            ETag:
              schema:
                type: string
              description: Draft version for If-Match on section saves
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Declaration'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [declarations]
      operationId: discardDeclaration
      summary: Discard the draft
      responses:
        '204':
          description: Discarded
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Not a draft
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/declarations/{declarationId}/sections/{sectionKey}:
    parameters:
      - $ref: '#/components/parameters/DeclarationId'
      - $ref: '#/components/parameters/SectionKey'
    get:
      tags: [declarations]
      operationId: getDeclarationSection
      summary: One section's contents (decrypted for the owning declarant)
      responses:
        '200':
          description: Section contents
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [declarations]
      operationId: saveDeclarationSection
      summary: Save a section (autosave); requires If-Match with the current draft version
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectionContents'
      responses:
        '200':
          description: Saved; new version in ETag
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionSaveResult'
        '400':
          description: 'Validation failed, or a locked field was changed (code `identity-locked-field`), or nil flag conflicts with items (code `nil-conflicts-with-items`)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          description: If-Match does not match the current draft version; reload
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/declarations/{declarationId}/attachments:
    parameters:
      - $ref: '#/components/parameters/DeclarationId'
    post:
      tags: [declarations]
      operationId: linkDeclarationAttachment
      summary: Link a clean upload (purpose declaration-attachment) to an item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sectionKey, itemId, uploadId]
              properties:
                sectionKey:
                  $ref: '#/components/schemas/SectionKey'
                itemId:
                  type: string
                  format: uuid
                uploadId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclarationAttachment'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Upload is not clean, has the wrong purpose, or belongs to another tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/declarations/{declarationId}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/DeclarationId'
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [declarations]
      operationId: unlinkDeclarationAttachment
      summary: Remove an attachment from its item
      responses:
        '204':
          description: Unlinked
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/declarations/{declarationId}/summary:
    parameters:
      - $ref: '#/components/parameters/DeclarationId'
    get:
      tags: [declarations]
      operationId: getDeclarationSummary
      summary: The assembled declaration validated against declaration.v1, with completeness
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclarationSummary'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]{1,19}$'
    DeclarationId:
      name: declarationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SectionKey:
      name: sectionKey
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SectionKey'
  responses:
    NotFound:
      description: Not found, or not visible to the caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Caller lacks the required role
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ObligationType:
      type: string
      enum: [initial, biennial, final]
    ObligationStatus:
      type: string
      enum: [upcoming, due, overdue, filed, cancelled]
    CancelReason:
      type: string
      enum: [exited-before-statement-date, exit-reversed, superseded]
    ReminderOutcome:
      type: string
      enum:
        - sent
        - skipped-not-onboarded
        - skipped-no-contact
        - skipped-past-due-at-creation
        - failed
    CommissionRef:
      type: object
      required: [slug, issuerCode, name]
      properties:
        slug:
          type: string
        issuerCode:
          type: string
        name:
          type: string
    Obligation:
      type: object
      required:
        - id
        - commission
        - type
        - cycleKey
        - statementDate
        - dueDate
        - status
        - cancelReason
        - remindersSent
        - policyVersion
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        commission:
          $ref: '#/components/schemas/CommissionRef'
        type:
          $ref: '#/components/schemas/ObligationType'
        cycleKey:
          type: string
          examples: ['biennial:2027', 'initial:2027-03-10', 'final:2027-09-15']
        statementDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/ObligationStatus'
        cancelReason:
          oneOf:
            - $ref: '#/components/schemas/CancelReason'
            - type: 'null'
        remindersSent:
          type: integer
        policyVersion:
          type: integer
        createdAt:
          type: string
          format: date-time
    Reminder:
      type: object
      required: [offsetDays, scheduledAt, sentAt, channels, outcome]
      properties:
        offsetDays:
          type: integer
        scheduledAt:
          type: string
          format: date-time
        sentAt:
          type: [string, 'null']
          format: date-time
        channels:
          type: array
          items:
            type: string
            enum: [sms, email]
        outcome:
          $ref: '#/components/schemas/ReminderOutcome'
    ObligationDetail:
      allOf:
        - $ref: '#/components/schemas/Obligation'
        - type: object
          required: [reminders, officer]
          properties:
            reminders:
              type: array
              items:
                $ref: '#/components/schemas/Reminder'
            officer:
              description: Present for staff callers; null for the declarant's own view
              oneOf:
                - $ref: '#/components/schemas/OfficerRef'
                - type: 'null'
    OfficerRef:
      type: object
      required: [rosterRecordId, personnelFileNumber, fullName, onboarded, ofr]
      properties:
        rosterRecordId:
          type: string
          format: uuid
        personnelFileNumber:
          type: string
        fullName:
          type: string
        onboarded:
          type: boolean
        ofr:
          type: [string, 'null']
    MyObligations:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            type: object
            required: [commission, obligations]
            properties:
              commission:
                $ref: '#/components/schemas/CommissionRef'
              obligations:
                type: array
                items:
                  $ref: '#/components/schemas/Obligation'
    ObligationListItem:
      allOf:
        - $ref: '#/components/schemas/Obligation'
        - type: object
          required: [officer]
          properties:
            officer:
              $ref: '#/components/schemas/OfficerRef'
    StatusCounts:
      type: object
      required: [upcoming, due, overdue, filed]
      properties:
        upcoming:
          type: integer
        due:
          type: integer
        overdue:
          type: integer
        filed:
          type: integer
    CommissionSummary:
      type: object
      required: [commission, cycle, total, byType, notOnboarded]
      properties:
        commission:
          $ref: '#/components/schemas/CommissionRef'
        cycle:
          type: object
          required: [key, statementDate, dueDate]
          properties:
            key:
              type: string
            statementDate:
              type: string
              format: date
            dueDate:
              type: string
              format: date
        total:
          $ref: '#/components/schemas/StatusCounts'
        byType:
          type: object
          required: [initial, biennial, final]
          properties:
            initial:
              $ref: '#/components/schemas/StatusCounts'
            biennial:
              $ref: '#/components/schemas/StatusCounts'
            final:
              $ref: '#/components/schemas/StatusCounts'
        notOnboarded:
          type: object
          description: Officers with a due or overdue obligation who have not onboarded
          required: [due, overdue]
          properties:
            due:
              type: integer
            overdue:
              type: integer
    NationalSummary:
      type: object
      required: [cycle, commissions, totals]
      properties:
        cycle:
          type: string
        commissions:
          type: array
          items:
            type: object
            required: [commission, total, notOnboarded, lastRosterImportAt]
            properties:
              commission:
                $ref: '#/components/schemas/CommissionRef'
              total:
                $ref: '#/components/schemas/StatusCounts'
              notOnboarded:
                type: integer
              lastRosterImportAt:
                type: [string, 'null']
                format: date-time
        totals:
          $ref: '#/components/schemas/StatusCounts'
    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
    SectionKey:
      type: string
      description: bio, household, other, or statement:<personKey>
      pattern: '^(bio|household|other|statement:(officer|spouse:[0-9a-f-]{36}|child:[0-9a-f-]{36}))$'
    Completeness:
      type: string
      enum: [not-started, incomplete, complete, archived]
    DeclarationStatus:
      type: string
      enum: [draft, discarded]
    Declaration:
      type: object
      required:
        - id
        - obligationId
        - commission
        - type
        - statementDate
        - incomePeriod
        - status
        - schemaVersion
        - draftVersion
        - sections
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        obligationId:
          type: string
          format: uuid
        commission:
          $ref: '#/components/schemas/CommissionRef'
        type:
          $ref: '#/components/schemas/ObligationType'
        statementDate:
          type: string
          format: date
        incomePeriod:
          type: object
          required: [from, to, fromSource]
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
            fromSource:
              type: string
              enum: [declared, assumed]
        status:
          $ref: '#/components/schemas/DeclarationStatus'
        schemaVersion:
          const: declaration.v1
        draftVersion:
          type: integer
        sections:
          type: array
          description: Live sections in First Schedule order; archived statements listed with completeness archived
          items:
            type: object
            required: [key, completeness, updatedAt, personName]
            properties:
              key:
                $ref: '#/components/schemas/SectionKey'
              completeness:
                $ref: '#/components/schemas/Completeness'
              updatedAt:
                type: [string, 'null']
                format: date-time
              personName:
                type: [string, 'null']
                description: For statement sections
              counts:
                type: object
                additionalProperties:
                  type: integer
        lastSection:
          oneOf:
            - $ref: '#/components/schemas/SectionKey'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DeclarationListItem:
      type: object
      required:
        [id, obligationId, commission, type, statementDate, status, completenessPercent, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        obligationId:
          type: string
          format: uuid
        commission:
          $ref: '#/components/schemas/CommissionRef'
        type:
          $ref: '#/components/schemas/ObligationType'
        statementDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/DeclarationStatus'
        completenessPercent:
          type: integer
          minimum: 0
          maximum: 100
        updatedAt:
          type: string
          format: date-time
    SectionContents:
      type: object
      description: 'The section body; shape per key follows forms/declaration.v1.json: bio → officer, household → { spouses, children }, statement:* → Statement, other → otherInformation'
      additionalProperties: true
    SectionEnvelope:
      type: object
      required: [key, completeness, contents, draftVersion]
      properties:
        key:
          $ref: '#/components/schemas/SectionKey'
        completeness:
          $ref: '#/components/schemas/Completeness'
        contents:
          $ref: '#/components/schemas/SectionContents'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/CompletenessIssue'
        draftVersion:
          type: integer
    SectionSaveResult:
      type: object
      required: [key, completeness, draftVersion, issues, sectionsChanged]
      properties:
        key:
          $ref: '#/components/schemas/SectionKey'
        completeness:
          $ref: '#/components/schemas/Completeness'
        draftVersion:
          type: integer
        issues:
          type: array
          items:
            $ref: '#/components/schemas/CompletenessIssue'
        sectionsChanged:
          type: array
          description: Statement sections created or archived by a household save
          items:
            type: object
            required: [key, action]
            properties:
              key:
                $ref: '#/components/schemas/SectionKey'
              action:
                type: string
                enum: [created, archived, restored]
    CompletenessIssue:
      type: object
      required: [sectionKey, path, code, message]
      properties:
        sectionKey:
          $ref: '#/components/schemas/SectionKey'
        path:
          type: string
          description: JSON pointer within the section contents
        code:
          type: string
        message:
          type: string
    DeclarationAttachment:
      type: object
      required: [id, sectionKey, itemId, uploadId, fileName, sha256, size, linkedAt]
      properties:
        id:
          type: string
          format: uuid
        sectionKey:
          $ref: '#/components/schemas/SectionKey'
        itemId:
          type: string
          format: uuid
        uploadId:
          type: string
          format: uuid
        fileName:
          type: string
        sha256:
          type: string
        size:
          type: integer
        linkedAt:
          type: string
          format: date-time
    DeclarationSummary:
      type: object
      required:
        [declaration, document, valid, blocking, canSubmit, cannotSubmitReason, attestationText]
      properties:
        declaration:
          $ref: '#/components/schemas/Declaration'
        document:
          type: object
          description: The assembled declaration.v1 document (decrypted for the owner)
          additionalProperties: true
        valid:
          type: boolean
          description: Validates against declaration.v1
        blocking:
          type: array
          items:
            $ref: '#/components/schemas/CompletenessIssue'
        canSubmit:
          type: boolean
          description: Always false in slice 05
        cannotSubmitReason:
          type: [string, 'null']
          enum: [submission-not-available, before-statement-date, incomplete, null]
        attestationText:
          type: string
