          description: Statement sections created, archived or restored by a household save; an archived statement is kept until the draft is discarded
      required:
        - key
        - completeness
        - draftVersion
        - issues
        - sectionsChanged
    AttachmentLink:
      type: object
      properties:
        sectionKey:
          description: The statement section holding the item
          $ref: '#/components/schemas/SectionKey'
        itemId:
          type: string
          format: uuid
        uploadId:
          type: string
          format: uuid
          description: A clean upload of the Commission with purpose declaration-attachment
      required:
        - sectionKey
        - itemId
        - uploadId
    DeclarationAttachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sectionKey:
          $ref: '#/components/schemas/SectionKey'
        itemId:
          type: string
          format: uuid
        uploadId:
          type: string
          format: uuid
        fileName:
          type: string
        sha256:
          type: string
          description: Hex SHA-256 of the clean object
        size:
          type: integer
          description: Bytes
        linkedAt:
          type: string
          format: date-time
      required:
        - id
        - sectionKey
        - itemId
        - uploadId
        - fileName
        - sha256
        - size
        - linkedAt
    DeclarationSummary:
      type: object
      properties:
        declaration:
          $ref: '#/components/schemas/Declaration'
        document:
          type: object
          propertyNames:
            type: string
          additionalProperties: {}
          description: 'The declaration.v1 document assembled from the live sections (decrypted for the declarant): archived statements left out, paragraph 9 material changes composed from the flagged items and the marital-status change'
        valid:
          type: boolean
          description: The document validates against declaration.v1 and every live section has been saved at least once
        blocking:
          type: array
          items:
            $ref: '#/components/schemas/CompletenessIssue'
          description: 'What to complete before submitting, by section and field: the schema issues and the rules it cannot state, each once'
        canSubmit:
          type: boolean
          description: Always false in slice 05
        cannotSubmitReason:
          type: string
          enum:
            - submission-not-available
            - before-statement-date
          description: '`before-statement-date`: the statement date (Nairobi) has not come; `submission-not-available`: submission opens in the next release'
        attestationText:
          type: string
          description: The solemn declaration the declarant makes
      required:
        - declaration
        - document
        - valid
        - blocking
        - canSubmit
        - cannotSubmitReason
        - attestationText
    DeclarationListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        obligationId:
          type: string
          format: uuid
        commission:
          $ref: '#/components/schemas/CommissionRef'
        type:
          $ref: '#/components/schemas/ObligationType'
        statementDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/DeclarationStatus'
        completenessPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: Complete sections out of the live ones (archived statements left out), rounded down
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - obligationId
        - commission
        - type
        - statementDate
        - status
        - completenessPercent
        - updatedAt
