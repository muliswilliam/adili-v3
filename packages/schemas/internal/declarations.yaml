                    - too-long
                    - other
                    - null
                note:
                  type:
                    - string
                    - 'null'
                  maxLength: 500
      responses:
        '200':
          description: Recorded
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/me/assistant/suggested-questions:
    get:
      tags:
        - assistant
      summary: Curated and popular questions for a section in a language
      operationId: getSuggestedQuestions
      x-draft: true
      parameters:
        - name: sectionKey
          in: query
          schema:
            type: string
        - name: language
          in: query
          required: true
          schema:
            type: string
            enum:
              - en
              - sw
      responses:
        '200':
          description: Questions
          content:
            application/json:
              schema:
                type: array
                maxItems: 8
                items:
                  type: string
  /v1/declarations/{declarationId}/hints:
    parameters:
      - $ref: '#/components/parameters/DeclarationId'
    get:
      tags:
        - assistant
      summary: Plain-language hints for the completeness residuals (AI-labelled; deterministic text always present)
      operationId: getCompletenessHints
      x-draft: true
      parameters:
        - name: language
          in: query
          required: true
          schema:
            type: string
            enum:
              - en
              - sw
      responses:
        '200':
          description: Hints
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - ruleId
                    - fieldPath
                    - text
                    - hint
                  properties:
                    ruleId:
                      type: string
                    fieldPath:
                      type: string
                    text:
                      type: string
                      description: Deterministic residual text
                    hint:
                      type:
                        - string
                        - 'null'
                      description: AI-assisted hint when available
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/commissions/{slug}/help/themes:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags:
        - help
      summary: Anonymised question theme counts and unanswered counts per month (commission-admin, reporting-officer)
      operationId: getQuestionThemes
      x-draft: true
      parameters:
        - name: month
          in: query
          schema:
            type: string
            pattern: ^[0-9]{4}-[0-9]{2}$
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - month
                    - theme
                    - count
                    - unanswered
                  properties:
                    month:
                      type: string
                    theme:
                      type: string
                    count:
                      type: integer
                    unanswered:
                      type: integer
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    ObligationType:
      type: string
      enum:
        - initial
        - biennial
        - final
    ObligationStatus:
      type: string
      enum:
        - upcoming
        - due
        - overdue
        - filed
        - cancelled
    CancelReason:
      type: string
      enum:
        - exited-before-statement-date
        - exit-reversed
        - superseded
        - before-obligations-start-date
    ReminderOutcome:
      type: string
      enum:
        - sent
        - skipped-not-onboarded
        - skipped-no-contact
        - skipped-past-due-at-creation
        - skipped-missed
        - failed
    ReminderChannel:
      type: string
      enum:
        - sms
        - email
    CommissionRef:
      type: object
      properties:
        slug:
          type: string
        issuerCode:
          type: string
        name:
          type: string
      required:
        - slug
        - issuerCode
        - name
    Obligation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        commission:
          $ref: '#/components/schemas/CommissionRef'
        type:
          $ref: '#/components/schemas/ObligationType'
        cycleKey:
          type: string
          description: Unique per declarant among live obligations
          examples:
            - biennial:2027
            - initial:2027-03-10
            - final:2027-09-15
        statementDate:
          type: string
          format: date
          description: The date the declaration is made as at
        dueDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/ObligationStatus'
        cancelReason:
          anyOf:
            - $ref: '#/components/schemas/CancelReason'
            - type: 'null'
          description: Set when cancelled
        remindersSent:
          type: integer
          description: Reminders sent so far
        policyVersion:
          type: integer
          description: The Commission's policy version the obligation was created under
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - commission
        - type
        - cycleKey
        - statementDate
        - dueDate
        - status
        - cancelReason
        - remindersSent
        - policyVersion
        - createdAt
    Reminder:
      type: object
      properties:
        offsetDays:
          type: integer
          description: Days before the due date
        scheduledAt:
          type: string
          format: date-time
        sentAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          description: Null unless sent
        channels:
          type: array
          items:
            $ref: '#/components/schemas/ReminderChannel'
          description: The channels it went by
        outcome:
          $ref: '#/components/schemas/ReminderOutcome'
      required:
        - offsetDays
        - scheduledAt
        - sentAt
        - channels
        - outcome
    DeclarantRef:
      type: object
      properties:
        rosterRecordId:
          type: string
          format: uuid
        personnelFileNumber:
          type: string
        fullName:
          type: string
        onboarded:
          type: boolean
        ofr:
          type:
            - string
            - 'null'
      required:
        - rosterRecordId
        - personnelFileNumber
        - fullName
        - onboarded
        - ofr
    ObligationDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        commission:
          $ref: '#/components/schemas/CommissionRef'
        type:
          $ref: '#/components/schemas/ObligationType'
        cycleKey:
          type: string
          description: Unique per declarant among live obligations
          examples:
            - biennial:2027
            - initial:2027-03-10
            - final:2027-09-15
        statementDate:
          type: string
          format: date
          description: The date the declaration is made as at
        dueDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/ObligationStatus'
        cancelReason:
          anyOf:
            - $ref: '#/components/schemas/CancelReason'
            - type: 'null'
          description: Set when cancelled
        remindersSent:
          type: integer
          description: Reminders sent so far
        policyVersion:
          type: integer
          description: The Commission's policy version the obligation was created under
        createdAt:
          type: string
          format: date-time
        reminders:
          type: array
          items:
            $ref: '#/components/schemas/Reminder'
          description: Reminder history, by scheduled time
        declarant:
          anyOf:
            - $ref: '#/components/schemas/DeclarantRef'
            - type: 'null'
          description: Present for staff callers; null for the declarant's own view
      required:
        - id
        - commission
        - type
        - cycleKey
        - statementDate
        - dueDate
        - status
        - cancelReason
        - remindersSent
        - policyVersion
        - createdAt
        - reminders
        - declarant
    MyObligations:
      type: object
      properties:
        groups:
          type: array
          items:
            type: object
            properties:
              commission:
                $ref: '#/components/schemas/CommissionRef'
              obligations:
                type: array
                items:
                  $ref: '#/components/schemas/Obligation'
                description: Overdue first, then by due date; cancelled ones left out
            required:
              - commission
              - obligations
          description: One group per Commission, by name
      required:
        - groups
    ObligationListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        commission:
          $ref: '#/components/schemas/CommissionRef'
        type:
          $ref: '#/components/schemas/ObligationType'
        cycleKey:
          type: string
          description: Unique per declarant among live obligations
          examples:
            - biennial:2027
            - initial:2027-03-10
            - final:2027-09-15
        statementDate:
          type: string
          format: date
          description: The date the declaration is made as at
        dueDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/ObligationStatus'
        cancelReason:
          anyOf:
            - $ref: '#/components/schemas/CancelReason'
            - type: 'null'
          description: Set when cancelled
        remindersSent:
          type: integer
          description: Reminders sent so far
        policyVersion:
          type: integer
          description: The Commission's policy version the obligation was created under
        createdAt:
          type: string
          format: date-time
        declarant:
          $ref: '#/components/schemas/DeclarantRef'
        lastReminder:
          anyOf:
            - $ref: '#/components/schemas/Reminder'
            - type: 'null'
          description: The obligation's latest reminder (by scheduled time); null before any
      required:
        - id
        - commission
        - type
        - cycleKey
        - statementDate
        - dueDate
        - status
        - cancelReason
        - remindersSent
        - policyVersion
        - createdAt
        - declarant
        - lastReminder
    ObligationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ObligationListItem'
        nextCursor:
          description: Pass as `cursor` for the next page; null on the last
          type:
            - string
            - 'null'
      required:
        - items
        - nextCursor
    StatusCounts:
      type: object
      properties:
        upcoming:
          type: integer
        due:
          type: integer
        overdue:
          type: integer
        filed:
          type: integer
      required:
        - upcoming
        - due
        - overdue
        - filed
    SummaryCycle:
      type: object
      properties:
        key:
          type: string
          examples:
            - biennial:2027
        statementDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        opensOn:
          type: string
          format: date
          description: "The day the cycle's biennial obligations are created: the statement date less the calendar's opening lead"
        opened:
          type: boolean
          description: 'Whether the cycle has opened: its opening day has come (Africa/Nairobi), or its biennials were already created'
      required:
        - key
        - statementDate
        - dueDate
        - opensOn
        - opened
    CommissionSummary:
      type: object
      properties:
        commission:
          $ref: '#/components/schemas/CommissionRef'
        cycle:
          description: 'The cycle counted: the one asked for, or the current one (the latest opened, or the first while none has)'
          $ref: '#/components/schemas/SummaryCycle'
        cycles:
          type: array
          items:
            $ref: '#/components/schemas/SummaryCycle'
          description: Every cycle of the calendar under the Commission's policy, oldest first
        total:
          $ref: '#/components/schemas/StatusCounts'
        byType:
          type: object
          properties:
            initial:
              $ref: '#/components/schemas/StatusCounts'
            biennial:
              $ref: '#/components/schemas/StatusCounts'
            final:
              $ref: '#/components/schemas/StatusCounts'
          required:
            - initial
            - biennial
            - final
        notOnboarded:
          type: object
          properties:
            due:
              type: integer
            overdue:
              type: integer
          required:
            - due
            - overdue
          description: Declarants with a due or overdue obligation who have not onboarded, each counted once under their worst status
      required:
        - commission
        - cycle
        - cycles
        - total
        - byType
        - notOnboarded
    NationalSummary:
      type: object
      properties:
        cycle:
          description: 'The cycle counted, under the statutory dates: the one asked for, or the current one'
          $ref: '#/components/schemas/SummaryCycle'
        commissions:
          type: array
          items:
            type: object
            properties:
              commission:
                $ref: '#/components/schemas/CommissionRef'
              total:
                $ref: '#/components/schemas/StatusCounts'
              notOnboarded:
                type: integer
                description: Declarants with a due or overdue obligation who have not onboarded
              lastRosterImportAt:
                anyOf:
                  - type: string
                    format: date-time
                  - type: 'null'
                description: When the Commission's latest roster import completed; null before any
            required:
              - commission
              - total
              - notOnboarded
              - lastRosterImportAt
          description: Every Commission the service has had a roster event for, by name
        totals:
          $ref: '#/components/schemas/StatusCounts'
      required:
        - cycle
        - commissions
        - totals
    ProgressCounts:
      type: object
      properties:
        notStarted:
          type: integer
          description: Upcoming or due, with no live draft
        inProgress:
          type: integer
          description: Upcoming or due, with a live draft
        submitted:
          type: integer
          description: Filed
        late:
          type: integer
          description: Overdue and not filed, with or without a draft
      required:
        - notStarted
        - inProgress
        - submitted
        - late
    ReportingEntityRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: As the roster names it
      required:
        - id
        - name
    DeclarationProgress:
      type: object
      properties:
        commission:
          $ref: '#/components/schemas/CommissionRef'
        cycle:
          description: 'The cycle counted: the one asked for, or the current one (the latest opened, or the first while none has)'
          $ref: '#/components/schemas/SummaryCycle'
        cycles:
          type: array
          items:
            $ref: '#/components/schemas/SummaryCycle'
          description: Every cycle of the calendar under the Commission's policy, oldest first
        reportingEntities:
          type: array
          items:
            type: object
            properties:
              reportingEntity:
                anyOf:
                  - $ref: '#/components/schemas/ReportingEntityRef'
                  - type: 'null'
                description: Null for declarants whose roster record names none
              counts:
                $ref: '#/components/schemas/ProgressCounts'
            required:
              - reportingEntity
              - counts
          description: One entry per reporting entity with an obligation counted, by name, those with none last
        total:
          $ref: '#/components/schemas/ProgressCounts'
      required:
        - commission
        - cycle
        - cycles
        - reportingEntities
        - total
    SectionKey:
      type: string
      pattern: ^(bio|household|other|statement:(officer|spouse:[0-9a-f-]{36}|child:[0-9a-f-]{36}))$
      description: bio, household, other, or statement:<personKey>
    Completeness:
      type: string
      enum:
        - not-started
        - incomplete
        - complete
        - archived
    DeclarationStatus:
      type: string
      enum:
        - draft
        - amending
        - submitted
        - discarded
    Declaration:
      type: object
      properties:
        id:
          type: string
          format: uuid
        obligationId:
          type: string
          format: uuid
        commission:
          $ref: '#/components/schemas/CommissionRef'
        type:
          $ref: '#/components/schemas/ObligationType'
        statementDate:
          type: string
          format: date
        incomePeriod:
          type: object
          properties:
            from:
              type: string
              format: date
              description: 'Exclusive: the income period is (from, to]'
            to:
              type: string
              format: date
            fromSource:
              type: string
              enum:
                - declared
                - assumed
              description: '`declared`: from is the statement date of a declaration on Adili; `assumed`: there is none, so it was derived from the type'
          required:
            - from
            - to
            - fromSource
        status:
          $ref: '#/components/schemas/DeclarationStatus'
        schemaVersion:
          type: string
          const: declaration.v1
        draftVersion:
          type: integer
          description: Also the ETag; send it as If-Match on section saves
        sections:
          type: array
          items:
            type: object
            properties:
              key:
                $ref: '#/components/schemas/SectionKey'
              completeness:
                $ref: '#/components/schemas/Completeness'
              updatedAt:
                anyOf:
                  - type: string
                    format: date-time
                  - type: 'null'
                description: Null until the declarant first saves the section
              personName:
                description: Whose financial statement it is, for statement sections
                type:
                  - string
                  - 'null'
              counts:
                description: Items by category, e.g. income, assets, liabilities
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  type: integer
            required:
              - key
              - completeness
              - updatedAt
              - personName
          description: Sections in First Schedule order; archived statements listed with completeness archived
        lastSection:
          anyOf:
            - $ref: '#/components/schemas/SectionKey'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - obligationId
        - commission
        - type
        - statementDate
        - incomePeriod
        - status
        - schemaVersion
        - draftVersion
        - sections
        - lastSection
        - createdAt
        - updatedAt
    SectionContents:
      type: object
      propertyNames:
        type: string
      additionalProperties: {}
      description: 'The section body; shape per key follows forms/declaration.v1.json: bio → officer, household → { spouses, children }, statement:* → Statement, other → otherInformation'
    CompletenessIssue:
      type: object
      properties:
        sectionKey:
          $ref: '#/components/schemas/SectionKey'
        path:
          type: string
          description: JSON pointer within the section contents
        code:
          type: string
        message:
          type: string
      required:
        - sectionKey
        - path
        - code
        - message
    NotIncluded:
      type: array
      items:
        type: object
        properties:
