          in: query
          schema:
            type: string
            pattern: ^[0-9]{4}-[0-9]{2}$
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - month
                    - theme
                    - count
                    - unanswered
                  properties:
                    month:
                      type: string
                    theme:
                      type: string
                    count:
                      type: integer
                    unanswered:
                      type: integer
        '404':
          $ref: '#/components/responses/NotFound'
  /internal/v1/obligations/details:
    post:
      tags:
        - internal
      summary: The officers behind a Commission's obligations, in a batch (spec 09 Form M non-filers)
      description: 'Service tokens with scope declarations:internal, acting for the Commission in X-Acting-Tenant (ADR-013 §8.6). At most 1,000 obligation ids; an obligation the Commission does not hold is left out. A read: it changes nothing, so it takes no Idempotency-Key and is safe to retry.'
      operationId: internalObligationDetails
      x-draft: true
      parameters:
        - name: X-Acting-Tenant
          in: header
          required: true
          description: Tenant the calling service acts for; the resource must belong to it
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - obligationIds
              properties:
                obligationIds:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: The officers, one per known obligation
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - obligationId
                        - name
                        - designation
                        - fileNumber
                        - appointmentDate
                        - exitDate
                      properties:
                        obligationId:
                          type: string
                          format: uuid
                        name:
                          type: string
                        designation:
                          type: string
                        fileNumber:
                          type: string
                          description: Personnel file number, or another staff, ID or passport number
                        appointmentDate:
                          type:
                            - string
                            - 'null'
                          format: date
                        exitDate:
                          type:
                            - string
                            - 'null'
                          format: date
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    ObligationType:
      type: string
      enum:
        - initial
        - biennial
        - final
    ObligationStatus:
      type: string
      enum:
        - upcoming
        - due
        - overdue
        - filed
        - cancelled
    CancelReason:
      type: string
      enum:
        - exited-before-statement-date
        - exit-reversed
        - superseded
        - before-obligations-start-date
    ReminderOutcome:
      type: string
      enum:
        - sent
        - skipped-not-onboarded
        - skipped-no-contact
        - skipped-past-due-at-creation
        - skipped-missed
        - failed
    ReminderChannel:
      type: string
      enum:
        - sms
        - email
    CommissionRef:
      type: object
      properties:
        slug:
          type: string
        issuerCode:
          type: string
        name:
          type: string
      required:
        - slug
        - issuerCode
        - name
    Obligation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        commission:
          $ref: '#/components/schemas/CommissionRef'
        type:
          $ref: '#/components/schemas/ObligationType'
        cycleKey:
          type: string
          description: Unique per declarant among live obligations
          examples:
            - biennial:2027
            - initial:2027-03-10
            - final:2027-09-15
        statementDate:
          type: string
          format: date
          description: The date the declaration is made as at
        dueDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/ObligationStatus'
        cancelReason:
          anyOf:
            - $ref: '#/components/schemas/CancelReason'
            - type: 'null'
          description: Set when cancelled
        remindersSent:
          type: integer
          description: Reminders sent so far
        policyVersion:
          type: integer
          description: The Commission's policy version the obligation was created under
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - commission
        - type
        - cycleKey
        - statementDate
        - dueDate
        - status
        - cancelReason
        - remindersSent
        - policyVersion
        - createdAt
    Reminder:
      type: object
      properties:
        offsetDays:
          type: integer
          description: Days before the due date
        scheduledAt:
          type: string
          format: date-time
        sentAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          description: Null unless sent
        channels:
          type: array
          items:
            $ref: '#/components/schemas/ReminderChannel'
          description: The channels it went by
        outcome:
          $ref: '#/components/schemas/ReminderOutcome'
      required:
        - offsetDays
        - scheduledAt
        - sentAt
        - channels
        - outcome
    DeclarantRef:
      type: object
      properties:
        rosterRecordId:
          type: string
          format: uuid
        personnelFileNumber:
          type: string
        fullName:
          type: string
        onboarded:
          type: boolean
        ofr:
          type:
            - string
            - 'null'
      required:
        - rosterRecordId
        - personnelFileNumber
        - fullName
        - onboarded
        - ofr
    ObligationDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        commission:
          $ref: '#/components/schemas/CommissionRef'
        type:
          $ref: '#/components/schemas/ObligationType'
        cycleKey:
          type: string
          description: Unique per declarant among live obligations
          examples:
            - biennial:2027
            - initial:2027-03-10
            - final:2027-09-15
        statementDate:
          type: string
          format: date
          description: The date the declaration is made as at
        dueDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/ObligationStatus'
        cancelReason:
          anyOf:
            - $ref: '#/components/schemas/CancelReason'
            - type: 'null'
          description: Set when cancelled
        remindersSent:
          type: integer
          description: Reminders sent so far
        policyVersion:
          type: integer
          description: The Commission's policy version the obligation was created under
        createdAt:
          type: string
          format: date-time
        reminders:
          type: array
          items:
            $ref: '#/components/schemas/Reminder'
          description: Reminder history, by scheduled time
        declarant:
          anyOf:
            - $ref: '#/components/schemas/DeclarantRef'
            - type: 'null'
          description: Present for staff callers; null for the declarant's own view
      required:
        - id
        - commission
        - type
        - cycleKey
        - statementDate
        - dueDate
        - status
        - cancelReason
        - remindersSent
        - policyVersion
        - createdAt
        - reminders
        - declarant
    MyObligations:
      type: object
      properties:
        groups:
          type: array
          items:
            type: object
            properties:
              commission:
                $ref: '#/components/schemas/CommissionRef'
              obligations:
                type: array
                items:
                  $ref: '#/components/schemas/Obligation'
                description: Overdue first, then by due date; cancelled ones left out
            required:
              - commission
              - obligations
          description: One group per Commission, by name
      required:
        - groups
    ObligationListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        commission:
          $ref: '#/components/schemas/CommissionRef'
        type:
          $ref: '#/components/schemas/ObligationType'
        cycleKey:
          type: string
          description: Unique per declarant among live obligations
          examples:
            - biennial:2027
            - initial:2027-03-10
            - final:2027-09-15
        statementDate:
          type: string
          format: date
          description: The date the declaration is made as at
        dueDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/ObligationStatus'
        cancelReason:
          anyOf:
            - $ref: '#/components/schemas/CancelReason'
            - type: 'null'
          description: Set when cancelled
        remindersSent:
          type: integer
          description: Reminders sent so far
        policyVersion:
          type: integer
          description: The Commission's policy version the obligation was created under
        createdAt:
          type: string
          format: date-time
        declarant:
          $ref: '#/components/schemas/DeclarantRef'
        lastReminder:
          anyOf:
            - $ref: '#/components/schemas/Reminder'
            - type: 'null'
          description: The obligation's latest reminder (by scheduled time); null before any
      required:
        - id
        - commission
        - type
        - cycleKey
        - statementDate
        - dueDate
        - status
        - cancelReason
        - remindersSent
        - policyVersion
        - createdAt
        - declarant
        - lastReminder
    ObligationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ObligationListItem'
        nextCursor:
          description: Pass as `cursor` for the next page; null on the last
          type:
            - string
            - 'null'
      required:
        - items
        - nextCursor
    StatusCounts:
      type: object
      properties:
        upcoming:
          type: integer
        due:
          type: integer
        overdue:
          type: integer
        filed:
          type: integer
        filedLate:
          type: integer
          description: Of those filed, the ones filed after their due date
      required:
        - upcoming
        - due
        - overdue
        - filed
        - filedLate
    SummaryCycle:
      type: object
      properties:
        key:
          type: string
          examples:
            - biennial:2027
        statementDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        opensOn:
          type: string
          format: date
          description: "The day the cycle's biennial obligations are created: the statement date less the calendar's opening lead"
        opened:
          type: boolean
          description: 'Whether the cycle has opened: its opening day has come (Africa/Nairobi), or its biennials were already created'
      required:
        - key
        - statementDate
        - dueDate
        - opensOn
        - opened
    CommissionSummary:
      type: object
      properties:
        commission:
          $ref: '#/components/schemas/CommissionRef'
        cycle:
          description: 'The cycle counted: the one asked for, or the current one (the latest opened, or the first while none has)'
          $ref: '#/components/schemas/SummaryCycle'
        cycles:
          type: array
          items:
            $ref: '#/components/schemas/SummaryCycle'
          description: Every cycle of the calendar under the Commission's policy, oldest first
        total:
          $ref: '#/components/schemas/StatusCounts'
        byType:
          type: object
          properties:
            initial:
              $ref: '#/components/schemas/StatusCounts'
            biennial:
              $ref: '#/components/schemas/StatusCounts'
            final:
              $ref: '#/components/schemas/StatusCounts'
          required:
            - initial
            - biennial
            - final
        notOnboarded:
          type: object
          properties:
            due:
              type: integer
            overdue:
              type: integer
          required:
            - due
            - overdue
          description: Declarants with a due or overdue obligation who have not onboarded, each counted once under their worst status
      required:
        - commission
        - cycle
        - cycles
        - total
        - byType
        - notOnboarded
    NationalSummary:
      type: object
      properties:
        cycle:
          description: 'The cycle counted, under the statutory dates: the one asked for, or the current one'
          $ref: '#/components/schemas/SummaryCycle'
        commissions:
          type: array
          items:
            type: object
            properties:
              commission:
                $ref: '#/components/schemas/CommissionRef'
              total:
                $ref: '#/components/schemas/StatusCounts'
              notOnboarded:
                type: integer
                description: Declarants with a due or overdue obligation who have not onboarded
              lastRosterImportAt:
                anyOf:
                  - type: string
                    format: date-time
                  - type: 'null'
                description: When the Commission's latest roster import completed; null before any
            required:
              - commission
              - total
              - notOnboarded
              - lastRosterImportAt
          description: Every Commission the service has had a roster event for, by name
        totals:
          $ref: '#/components/schemas/StatusCounts'
      required:
        - cycle
        - commissions
        - totals
    ProgressCounts:
      type: object
      properties:
        notStarted:
          type: integer
          description: Upcoming or due, with no live draft
        inProgress:
          type: integer
          description: Upcoming or due, with a live draft
        submitted:
          type: integer
          description: Filed
        late:
          type: integer
          description: Overdue and not filed, with or without a draft
      required:
        - notStarted
        - inProgress
        - submitted
        - late
    ReportingEntityRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: As the roster names it
      required:
        - id
        - name
    DeclarationProgress:
      type: object
      properties:
        commission:
          $ref: '#/components/schemas/CommissionRef'
        cycle:
          description: 'The cycle counted: the one asked for, or the current one (the latest opened, or the first while none has)'
          $ref: '#/components/schemas/SummaryCycle'
        cycles:
          type: array
          items:
            $ref: '#/components/schemas/SummaryCycle'
          description: Every cycle of the calendar under the Commission's policy, oldest first
        reportingEntities:
          type: array
          items:
            type: object
            properties:
              reportingEntity:
                anyOf:
                  - $ref: '#/components/schemas/ReportingEntityRef'
                  - type: 'null'
                description: Null for declarants whose roster record names none
              counts:
                $ref: '#/components/schemas/ProgressCounts'
            required:
              - reportingEntity
              - counts
          description: One entry per reporting entity with an obligation counted, by name, those with none last
        total:
          $ref: '#/components/schemas/ProgressCounts'
      required:
        - commission
        - cycle
        - cycles
        - reportingEntities
        - total
    DeclarationReference:
      type: string
      pattern: ^DC[IBF]-[A-Z][A-Z0-9]{1,19}-[0-9]{4}-[0-9]{7}-[0-9A-Z]$
      description: 'ADR-011: DC{I|B|F}-<ISSUER>-<YEAR>-<7 digits>-<check>, allocated at the first submission and kept by later versions'
      examples:
        - DCB-TSC-2027-0012345-K
    SectionKey:
      type: string
      pattern: ^(bio|household|other|statement:(officer|spouse:[0-9a-f-]{36}|child:[0-9a-f-]{36}))$
      description: bio, household, other, or statement:<personKey>
    Completeness:
      type: string
      enum:
        - not-started
        - incomplete
        - complete
        - archived
    DeclarationStatus:
      type: string
      enum:
        - draft
        - amending
        - submitted
        - discarded
    Declaration:
      type: object
      properties:
        id:
          type: string
          format: uuid
        obligationId:
          type: string
          format: uuid
        commission:
          $ref: '#/components/schemas/CommissionRef'
        type:
          $ref: '#/components/schemas/ObligationType'
        statementDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
          description: "The obligation's due date: filed after it is late, and amendments close on it"
        incomePeriod:
          type: object
          properties:
            from:
              type: string
              format: date
              description: 'Exclusive: the income period is (from, to]'
            to:
              type: string
              format: date
            fromSource:
              type: string
              enum:
                - declared
                - assumed
              description: '`declared`: from is the statement date of a declaration on Adili; `assumed`: there is none, so it was derived from the type'
          required:
            - from
            - to
            - fromSource
        status:
          $ref: '#/components/schemas/DeclarationStatus'
        schemaVersion:
          type: string
          const: declaration.v1
        draftVersion:
          type: integer
          description: Also the ETag; send it as If-Match on section saves
        sections:
          type: array
          items:
            type: object
            properties:
              key:
                $ref: '#/components/schemas/SectionKey'
              completeness:
                $ref: '#/components/schemas/Completeness'
              updatedAt:
                anyOf:
                  - type: string
                    format: date-time
                  - type: 'null'
                description: Null until the declarant first saves the section
              personName:
                description: Whose financial statement it is, for statement sections
                type:
                  - string
                  - 'null'
              counts:
                description: Items by category, e.g. income, assets, liabilities
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  type: integer
            required:
              - key
              - completeness
              - updatedAt
              - personName
          description: Sections in First Schedule order; archived statements listed with completeness archived
        lastSection:
          anyOf:
            - $ref: '#/components/schemas/SectionKey'
            - type: 'null'
        reference:
          anyOf:
            - $ref: '#/components/schemas/DeclarationReference'
            - type: 'null'
          description: Allocated at the first submission; null before
        currentVersion:
          anyOf:
            - type: integer
              minimum: 1
            - type: 'null'
          description: The submitted version in force; null before the first submission
        amendingFromVersion:
          anyOf:
            - type: integer
              minimum: 1
            - type: 'null'
          description: The version an amendment in progress started from; null unless amending
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - obligationId
        - commission
        - type
        - statementDate
        - dueDate
        - incomePeriod
        - status
        - schemaVersion
        - draftVersion
        - sections
        - lastSection
        - reference
        - currentVersion
        - amendingFromVersion
        - createdAt
        - updatedAt
    SectionContents:
      type: object
      propertyNames:
        type: string
      additionalProperties: {}
      description: 'The section body; shape per key follows forms/declaration.v1.json: bio → officer, household → { spouses, children }, statement:* → Statement, other → otherInformation'
    CompletenessIssue:
      type: object
      properties:
        sectionKey:
          $ref: '#/components/schemas/SectionKey'
        path:
          type: string
          description: JSON pointer within the section contents
        code:
          type: string
        message:
          type: string
      required:
        - sectionKey
        - path
        - code
        - message
    NotIncluded:
      type: array
      items:
        type: object
        properties:
          personKey:
            type: string
            pattern: ^child:[0-9a-f-]{36}$
          reason:
            type: string
            enum:
              - over-18-at-statement-date
        required:
          - personKey
          - reason
      description: 'Household only: children listed who get no financial statement, with the reason (eighteen or older on the statement date)'
    SectionEnvelope:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/SectionKey'
        completeness:
          $ref: '#/components/schemas/Completeness'
        contents:
          $ref: '#/components/schemas/SectionContents'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/CompletenessIssue'
        notIncluded:
          $ref: '#/components/schemas/NotIncluded'
        draftVersion:
          type: integer
      required:
        - key
        - completeness
        - contents
        - issues
        - draftVersion
    SectionSaveResult:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/SectionKey'
        completeness:
          $ref: '#/components/schemas/Completeness'
        draftVersion:
          type: integer
        issues:
          type: array
          items:
            $ref: '#/components/schemas/CompletenessIssue'
        notIncluded:
          $ref: '#/components/schemas/NotIncluded'
        sectionsChanged:
          type: array
          items:
            type: object
            properties:
              key:
                $ref: '#/components/schemas/SectionKey'
              action:
                type: string
                enum:
                  - created
                  - archived
                  - restored
            required:
              - key
              - action
          description: Statement sections created, archived or restored by a household save; an archived statement is kept until the draft is discarded
      required:
        - key
        - completeness
        - draftVersion
        - issues
        - sectionsChanged
    AttachmentLink:
      type: object
      properties:
        sectionKey:
          description: The statement section holding the item
          $ref: '#/components/schemas/SectionKey'
        itemId:
          type: string
          format: uuid
        uploadId:
          type: string
          format: uuid
          description: A clean upload of the Commission with purpose declaration-attachment
      required:
        - sectionKey
        - itemId
        - uploadId
    DeclarationAttachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sectionKey:
          $ref: '#/components/schemas/SectionKey'
        itemId:
          type: string
          format: uuid
        uploadId:
          type: string
          format: uuid
        fileName:
          type: string
        sha256:
          type: string
          description: Hex SHA-256 of the clean object
        size:
          type: integer
          description: Bytes
        linkedAt:
          type: string
          format: date-time
      required:
        - id
        - sectionKey
        - itemId
        - uploadId
        - fileName
        - sha256
        - size
        - linkedAt
    DeclarationSummary:
      type: object
      properties:
        declaration:
          $ref: '#/components/schemas/Declaration'
        document:
          type: object
          propertyNames:
            type: string
          additionalProperties: {}
          description: 'The declaration.v1 document assembled from the live sections (decrypted for the declarant): archived statements left out, paragraph 9 material changes composed from the flagged items and the marital-status change'
        valid:
          type: boolean
          description: The document validates against declaration.v1 and every live section has been saved at least once
        blocking:
          type: array
          items:
            $ref: '#/components/schemas/CompletenessIssue'
          description: 'What to complete before submitting, by section and field: the schema issues and the rules it cannot state, each once'
        canSubmit:
          type: boolean
          description: 'Whether submitting now would pass every check but the step-up: a valid document, a draft or amendment in progress, and an obligation open for it'
        cannotSubmitReason:
          anyOf:
            - type: string
              enum:
                - not-a-draft
                - obligation-cancelled
                - before-statement-date
                - amendment-window-closed
                - incomplete
            - type: 'null'
          description: 'Null when canSubmit; else the first reason in this order: `not-a-draft` (already submitted), `obligation-cancelled`, `before-statement-date` (the statement date, Africa/Nairobi, has not come), `amendment-window-closed` (an amendment after the due date), `incomplete` (see blocking)'
        late:
          type: boolean
          description: 'Submitting now would be recorded as filed late: today (Africa/Nairobi) is after the due date'
        attestationText:
          type: string
          description: The solemn declaration the declarant makes
      required:
        - declaration
        - document
        - valid
        - blocking
        - canSubmit
        - cannotSubmitReason
        - late
        - attestationText
    DeclarationListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        obligationId:
          type: string
          format: uuid
        commission:
          $ref: '#/components/schemas/CommissionRef'
        type:
          $ref: '#/components/schemas/ObligationType'
        statementDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/DeclarationStatus'
        completenessPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: Complete sections out of the live ones (archived statements left out), rounded down
        dueDate:
          type: string
          format: date
          description: "The obligation's due date: filed after it is late, and amendments close on it"
        reference:
          anyOf:
            - $ref: '#/components/schemas/DeclarationReference'
            - type: 'null'
          description: Allocated at the first submission; null before
        currentVersion:
          anyOf:
            - type: integer
              minimum: 1
            - type: 'null'
          description: The submitted version in force; null before the first submission
        amendingFromVersion:
          anyOf:
            - type: integer
              minimum: 1
            - type: 'null'
          description: The version an amendment in progress started from; null unless amending
        submittedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          description: When the version in force was submitted; null before
        late:
          description: The version in force was filed after the due date; null before
          type:
            - boolean
            - 'null'
        amendable:
          type: boolean
          description: 'Amend is open now: submitted (no amendment in progress) and today, Africa/Nairobi by the service clock, is on or before the due date. False otherwise; when submitted and false, amendments are closed'
        acknowledgement:
          anyOf:
            - type: object
              properties:
                status:
                  $ref: '#/components/schemas/AcknowledgementStatus'
                documentId:
                  anyOf:
                    - type: string
                      format: uuid
                    - type: 'null'
                  description: The issued slip, for its download; null until issued
                verifiedCount:
                  type: integer
                  description: Lookups of the slip on the verify app
              required:
                - status
                - documentId
                - verifiedCount
            - type: 'null'
          description: The version in force's acknowledgement slip (as getAcknowledgement answers it); null before the first submission
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - obligationId
        - commission
        - type
        - statementDate
        - status
        - completenessPercent
        - dueDate
        - reference
        - currentVersion
        - amendingFromVersion
        - submittedAt
        - late
        - amendable
        - acknowledgement
        - updatedAt
    AcknowledgementStatus:
      type: string
      enum:
        - pending
        - issued
        - failed
    Acknowledgement:
      type: object
      properties:
        status:
          description: '`pending` until the documents service has issued the slip, `failed` when issuance gave up'
          $ref: '#/components/schemas/AcknowledgementStatus'
        documentId:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          description: The issued slip; null until issued
        verificationId:
          description: Verification code printed under the QR; null until issued
          type:
            - string
            - 'null'
        verifyUrl:
          anyOf:
            - type: string
              format: uri
            - type: 'null'
          description: Where the verify page answers for the slip, the QR code's payload (`<verify origin>/v/<code>`); null until issued
        issuedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        verifiedCount:
          type: integer
          description: Lookups of the slip on the verify app
        downloadUrl:
          anyOf:
            - type: string
              format: uri
            - type: 'null'
          description: "Null: the slip downloads from the documents service (`getDocumentDownload` with `documentId`), the owner's short-lived link, audited there"
      required:
        - status
        - documentId
        - verificationId
        - verifyUrl
        - issuedAt
        - verifiedCount
        - downloadUrl
    DeclarationVersion:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
        reference:
          $ref: '#/components/schemas/DeclarationReference'
        submittedAt:
          type: string
          format: date-time
        late:
          type: boolean
          description: Submitted after the obligation's due date
        canonicalSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Hex SHA-256 of the document's RFC 8785 canonical JSON
        supersededAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          description: When a later version replaced it; null while in force
        acknowledgement:
          $ref: '#/components/schemas/Acknowledgement'
      required:
        - version
        - reference
        - submittedAt
        - late
        - canonicalSha256
        - supersededAt
        - acknowledgement
    DeclarationVersionDetail:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
        reference:
          $ref: '#/components/schemas/DeclarationReference'
        submittedAt:
          type: string
          format: date-time
        late:
          type: boolean
          description: Submitted after the obligation's due date
        canonicalSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Hex SHA-256 of the document's RFC 8785 canonical JSON
        supersededAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          description: When a later version replaced it; null while in force
        acknowledgement:
          $ref: '#/components/schemas/Acknowledgement'
        document:
          type: object
          propertyNames:
            type: string
          additionalProperties: {}
          description: The immutable declaration.v1 document as submitted (decrypted for the declarant), its attestation carrying the reference and the time it was declared
      required:
        - version
        - reference
        - submittedAt
        - late
        - canonicalSha256
        - supersededAt
        - acknowledgement
        - document
    SubmissionResult:
      type: object
      properties:
        declaration:
          $ref: '#/components/schemas/Declaration'
        version:
          $ref: '#/components/schemas/DeclarationVersion'
        obligationStatus:
          $ref: '#/components/schemas/ObligationStatus'
      required:
        - declaration
        - version
        - obligationStatus
    SubmitProblem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          description: Absent only for problems of the Idempotency-Key header
          type: string
          enum:
            - step-up-required
            - incomplete
            - before-statement-date
            - amendment-window-closed
            - not-a-draft
            - not-submitted
            - obligation-cancelled
        detail:
          type: string
        instance:
          type: string
        errors:
          description: Field-level errors; `path` is the dotted request field
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - path
              - message
        stepUpUrl:
          description: 'Present for step-up-required: starts a step-up returning to the summary'
          type: string
          format: uri
        blocking:
          description: 'Present for incomplete: what to complete, as the summary lists it'
          type: array
          items:
            $ref: '#/components/schemas/CompletenessIssue'
      required:
        - type
        - title
        - status
    AcknowledgementSlip:
      type: object
      properties:
        declarantName:
          type: string
          minLength: 1
          maxLength: 200
          description: As declared in the version (first, other and surname)
        commissionName:
          type: string
          minLength: 1
          maxLength: 200
        issuerCode:
          type: string
          pattern: ^[A-Z0-9]{2,20}$
          description: The Commission's issuer code, as in the reference number
        declarationType:
          $ref: '#/components/schemas/ObligationType'
        statementDate:
          type: string
          format: date
        dueDate:
          anyOf:
            - type: string
              format: date
            - type: 'null'
          description: The filing obligation's due date; null when it has none
        reference:
          $ref: '#/components/schemas/DeclarationReference'
        version:
          type: integer
          minimum: 1
        submittedAt:
          type: string
          format: date-time
        late:
          type: boolean
          description: Submitted after the obligation's due date
        statementCount:
          type: integer
          minimum: 0
          description: 'Statements in the version: the declarant, spouses and children'
        itemCount:
          type: integer
          minimum: 0
          description: Income, assets and liabilities across its statements
      required:
        - declarantName
        - commissionName
        - issuerCode
        - declarationType
        - statementDate
        - dueDate
        - reference
        - version
        - submittedAt
        - late
        - statementCount
        - itemCount
      description: The fields the acknowledgement slip prints, and nothing more
    AcknowledgementPayload:
      type: object
      properties:
        declarantPersonId:
          type: string
          format: uuid
          description: 'The declarant: the documents service issues the slip for them, the only person who may download it'
        slip:
          $ref: '#/components/schemas/AcknowledgementSlip'
      required:
        - declarantPersonId
        - slip
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
            - database-unavailable
            - rate-limit-exceeded
            - no-match
            - already-onboarded
            - no-roster
            - otp-invalid
            - otp-expired
            - resend-cooldown
            - otp-send-failed
            - wrong-step
            - session-expired
            - iprs-unavailable
            - identity-unavailable
            - email-in-use
            - step-up-required
            - incomplete
            - before-statement-date
            - amendment-window-closed
            - not-a-draft
            - not-submitted
            - obligation-cancelled
            - acknowledgement-issued
            - acknowledgement-in-progress
          description: Machine-readable cause, from the platform registry; clients map it to copy and never show `title` or `detail`
        detail:
          type: string
        instance:
          type: string
        errors:
          description: Field-level errors; `path` is the dotted request field
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - path
              - message
      required:
        - type
        - title
        - status
    DisclosureRequest:
      type: object
      required:
        - personId
        - tenant
        - grantReference
        - legalBasis
        - recipientSubject
        - years
        - includeSpouses
        - includeChildren
        - sections
      properties:
        personId:
          type: string
          format: uuid
        tenant:
          type: string
        grantReference:
          type: string
          description: ARQ or LEA reference
        legalBasis:
          type: string
          enum:
            - act-s36-1
            - act-s36-2
        recipientSubject:
          type: string
        years:
          type: array
          minItems: 1
          items:
            type: integer
        includeSpouses:
          type: boolean
        includeChildren:
          type: boolean
        sections:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - bio
              - income
              - assets
              - liabilities
              - other
    DisclosureDocument:
      type: object
      required:
        - schemaVersion
        - grantReference
        - personName
        - commission
        - versions
      properties:
        schemaVersion:
          const: disclosure.v1
        grantReference:
          type: string
        personName:
          type: string
        commission:
          $ref: '#/components/schemas/CommissionRef'
        versions:
          type: array
          items:
            type: object
            required:
              - reference
              - version
              - type
              - statementDate
              - submittedAt
              - content
            properties:
              reference:
                $ref: '#/components/schemas/DeclarationReference'
              version:
                type: integer
              type:
                $ref: '#/components/schemas/ObligationType'
              statementDate:
                type: string
                format: date
              submittedAt:
                type: string
                format: date-time
              content:
                type: object
                description: Subset of the declaration.v1 document limited to the granted persons and sections
                additionalProperties: true
    SuggestionSource:
      type: string
      enum:
        - kra
        - ntsa
        - brs
        - ardhisasa
        - document
    SuggestionSet:
      type: object
      required:
        - id
        - personKey
        - source
        - status
        - requestedAt
        - readyAt
        - verificationResultId
        - aiJobId
        - suggestions
      properties:
        id:
          type: string
          format: uuid
        personKey:
          type: string
        source:
          $ref: '#/components/schemas/SuggestionSource'
        status:
          type: string
          enum:
            - pending
            - ready
            - unavailable
            - no-id
            - not-enabled
            - failed
        requestedAt:
          type: string
          format: date-time
        readyAt:
          type:
            - string
            - 'null'
          format: date-time
        verificationResultId:
          type:
            - string
            - 'null'
          format: uuid
        aiJobId:
          type:
            - string
            - 'null'
          format: uuid
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/Suggestion'
    Suggestion:
      type: object
      required:
        - id
        - setId
        - personKey
        - sectionKey
        - itemType
        - fields
        - sourceRef
        - confidence
        - matchItemId
        - status
        - acceptedItemId
      properties:
        id:
          type: string
          format: uuid
        setId:
          type: string
          format: uuid
        personKey:
          type: string
        sectionKey:
          $ref: '#/components/schemas/SectionKey'
        itemType:
          type: string
          description: Second Schedule item type from declaration.v1, or `bio-tax` for KRA PIN and compliance
        fields:
          type: object
          additionalProperties: true
        sourceRef:
          type: object
          description: Registration, title or company number, or document page and field
          additionalProperties: true
        confidence:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 1
        matchItemId:
          type:
            - string
            - 'null'
          format: uuid
        status:
          type: string
          enum:
            - new
            - accepted
            - dismissed
            - superseded
        acceptedItemId:
          type:
            - string
            - 'null'
          format: uuid
    AssistantConversation:
      type: object
      required:
        - id
        - declarationId
        - language
        - messages
        - expiresAt
      properties:
        id:
          type: string
          format: uuid
        declarationId:
          type:
            - string
            - 'null'
          format: uuid
        language:
          type: string
          enum:
            - en
            - sw
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AssistantMessage'
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
    AssistantMessage:
      type: object
      required:
        - id
        - role
        - text
        - citations
        - sectionLink
        - declined
        - label
        - rating
        - at
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - user
            - assistant
        text:
          type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/HelpPassage'
        sectionLink:
          oneOf:
            - type: object
              required:
                - sectionKey
                - fieldPath
              properties:
                sectionKey:
                  type: string
                fieldPath:
                  type:
                    - string
                    - 'null'
            - type: 'null'
        declined:
          type: boolean
        label:
          type:
            - object
            - 'null'
          description: ai-gateway AiLabel for assistant turns
          additionalProperties: true
        rating:
          type:
            - string
            - 'null'
          enum:
            - helpful
            - not-helpful
            - null
        at:
          type: string
          format: date-time
    HelpPassage:
      type: object
      required:
        - id
        - source
        - citation
        - title
        - snippet
        - language
      properties:
        id:
          type: string
        source:
          type: string
          enum:
            - act
            - regs
            - am
            - help
        citation:
          type: string
          examples:
            - Act s.31(4)
            - Regs r.21
            - AM 24
        title:
          type: string
        snippet:
          type: string
        language:
          type: string
          enum:
            - en
            - sw
    HelpArticleInput:
      type: object
      required:
        - title
        - bodyEn
        - bodySw
        - tags
        - effectiveFrom
        - effectiveTo
        - published
      properties:
        title:
          type: string
          maxLength: 200
        bodyEn:
          type: string
          maxLength: 20000
        bodySw:
          type:
            - string
            - 'null'
          maxLength: 20000
        tags:
          type: array
          items:
            type: string
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type:
            - string
            - 'null'
          format: date
        published:
          type: boolean
    HelpArticle:
      allOf:
        - $ref: '#/components/schemas/HelpArticleInput'
        - type: object
          required:
            - id
            - tenant
            - version
            - updatedAt
          properties:
            id:
              type: string
              format: uuid
            tenant:
              type:
                - string
                - 'null'
            version:
              type: integer
            updatedAt:
              type: string
              format: date-time
    InternalVersionDocument:
      type: object
      required:
        - declarationId
        - versionId
        - version
        - reference
        - type
        - statementDate
        - submittedAt
        - late
        - dueDate
        - declarantName
        - personnelFileNumber
        - document
        - attachments
      properties:
        declarationId:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        version:
          type: integer
        reference:
          $ref: '#/components/schemas/DeclarationReference'
        type:
          $ref: '#/components/schemas/ObligationType'
        statementDate:
          type: string
          format: date
        submittedAt:
          type: string
          format: date-time
        late:
          type: boolean
        dueDate:
          type: string
          format: date
        declarantName:
          type: string
        personnelFileNumber:
          type: string
        document:
          type: object
          description: The immutable declaration.v1 document, decrypted
          additionalProperties: true
        attachments:
          type: array
          items:
            type: object
            required:
              - uploadId
              - itemId
              - personKey
              - fileName
              - sha256
            properties:
              uploadId:
                type: string
                format: uuid
              itemId:
                type: string
                format: uuid
              personKey:
                type: string
              fileName:
                type: string
              sha256:
                type: string
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9]{1,19}$
    DeclarationId:
      name: declarationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionNumber:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    SuggestionId:
      name: suggestionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID, unique per logical request; reuse on retry
      schema:
        type: string
        format: uuid
  responses:
    NotFound:
      description: Not found, or not visible to the caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Caller lacks the required role
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationProblem:
      description: Request failed validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
security:
  - bearer: []
