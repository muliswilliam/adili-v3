                - fieldPath
              description: 'Where in the draft the answer is about: a section of it, and a field'
            - type: 'null'
        declined:
          type: boolean
          description: The Act, Regulations and help articles retrieved do not support an answer
        reportingOfficer:
          anyOf:
            - $ref: '#/components/schemas/ReportingOfficerContact'
            - type: 'null'
          description: On a declined answer, whom to ask instead; null when the Commission has none on record
        label:
          anyOf:
            - $ref: '#/components/schemas/AssistantAiLabel'
            - type: 'null'
          description: How an answer from the AI is labelled (ai-gateway AiLabel); null for a question, and for a decline made without asking the AI
        rating:
          anyOf:
            - type: string
              enum:
                - helpful
                - not-helpful
            - type: 'null'
        at:
          type: string
          format: date-time
      required:
