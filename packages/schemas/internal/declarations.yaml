        citations:
          type: array
          items:
            $ref: '#/components/schemas/HelpPassage'
          description: The passages the answer rests on, all retrieved for it; empty for a question or a decline
        sectionLink:
          anyOf:
            - type: object
              properties:
                sectionKey:
                  type: string
                  pattern: ^(bio|household|other|statement:(officer|spouse:[0-9a-f-]{36}|child:[0-9a-f-]{36}))$
