        bodyEn:
          type: string
          minLength: 1
          maxLength: 20000
        bodySw:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 20000
            - type: 'null'
        tags:
          maxItems: 20
          type: array
          items:
            $ref: '#/components/schemas/HelpTag'
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          anyOf:
            - type: string
              format: date
            - type: 'null'
          description: Exclusive; null while in force
        published:
          type: boolean
      required:
        - title
        - bodyEn
        - bodySw
        - tags
        - effectiveFrom
        - effectiveTo
        - published
    HelpArticle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant:
          description: The Commission's slug; null for the platform
          type:
            - string
            - 'null'
        title:
          type: string
        bodyEn:
          type: string
        bodySw:
          type:
            - string
            - 'null'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/HelpTag'
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          anyOf:
            - type: string
              format: date
            - type: 'null'
        published:
          type: boolean
        version:
          type: integer
          description: Counts saves
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - tenant
        - title
        - bodyEn
        - bodySw
        - tags
        - effectiveFrom
        - effectiveTo
        - published
        - version
        - updatedAt
    CorpusPassage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
          enum:
            - act
            - regs
            - am
        citation:
          type: string
        title:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/HelpTag'
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          anyOf:
            - type: string
              format: date
            - type: 'null'
          description: Exclusive; null while current
        version:
          type: string
          description: The corpus version that last wrote the passage
      required:
        - id
        - source
        - citation
        - title
        - tags
        - effectiveFrom
        - effectiveTo
        - version
    CorpusImportResult:
      type: object
      properties:
        version:
          type: string
          description: A hash of the corpus files
        skipped:
          type: boolean
          description: The version was imported already; nothing changed
        inserted:
          type: integer
        updated:
          type: integer
        removed:
          type: integer
        unchanged:
          type: integer
      required:
        - version
        - skipped
        - inserted
        - updated
        - removed
        - unchanged
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
            - rate-limit-exceeded
            - no-match
            - already-onboarded
            - no-roster
            - otp-invalid
            - otp-expired
            - resend-cooldown
            - otp-send-failed
            - wrong-step
            - session-expired
            - iprs-unavailable
            - identity-unavailable
            - email-in-use
          description: Machine-readable cause, from the platform registry; clients map it to copy and never show `title` or `detail`
        detail:
          type: string
        instance:
          type: string
        errors:
          description: Field-level errors; `path` is the dotted request field
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - path
              - message
      required:
        - type
        - title
        - status
    DisclosureRequest:
      type: object
      required:
        - personId
        - tenant
        - grantReference
        - legalBasis
        - recipientSubject
        - years
        - includeSpouses
        - includeChildren
        - sections
      properties:
        personId:
          type: string
          format: uuid
        tenant:
          type: string
        grantReference:
          type: string
          description: ARQ or LEA reference
        legalBasis:
          type: string
          enum:
            - act-s36-1
            - act-s36-2
        recipientSubject:
          type: string
        years:
          type: array
          minItems: 1
          items:
            type: integer
        includeSpouses:
          type: boolean
        includeChildren:
          type: boolean
        sections:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - bio
              - income
              - assets
              - liabilities
              - other
    DisclosureDocument:
      type: object
      required:
        - schemaVersion
        - grantReference
        - personName
        - commission
        - versions
      properties:
        schemaVersion:
          const: disclosure.v1
        grantReference:
          type: string
        personName:
          type: string
        commission:
          $ref: '#/components/schemas/CommissionRef'
        versions:
          type: array
          items:
            type: object
            required:
              - reference
              - version
              - type
              - statementDate
              - submittedAt
              - content
            properties:
              reference:
                $ref: '#/components/schemas/DeclarationReference'
              version:
                type: integer
              type:
                $ref: '#/components/schemas/ObligationType'
              statementDate:
                type: string
                format: date
              submittedAt:
                type: string
                format: date-time
              content:
                type: object
                description: Subset of the declaration.v1 document limited to the granted persons and sections
                additionalProperties: true
    SuggestionSource:
      type: string
      enum:
        - kra
        - ntsa
        - brs
        - ardhisasa
        - document
    SuggestionSet:
      type: object
      required:
        - id
        - personKey
        - source
        - status
        - requestedAt
        - readyAt
        - verificationResultId
        - aiJobId
        - suggestions
      properties:
        id:
          type: string
          format: uuid
        personKey:
          type: string
        source:
          $ref: '#/components/schemas/SuggestionSource'
        status:
          type: string
          enum:
            - pending
            - ready
            - unavailable
            - no-id
            - not-enabled
            - failed
        requestedAt:
          type: string
          format: date-time
        readyAt:
          type:
            - string
            - 'null'
          format: date-time
        verificationResultId:
          type:
            - string
            - 'null'
          format: uuid
        aiJobId:
          type:
            - string
            - 'null'
          format: uuid
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/Suggestion'
    Suggestion:
      type: object
      required:
        - id
        - setId
        - personKey
        - sectionKey
        - itemType
        - fields
        - sourceRef
        - confidence
        - matchItemId
        - status
        - acceptedItemId
      properties:
        id:
          type: string
          format: uuid
        setId:
          type: string
          format: uuid
        personKey:
          type: string
        sectionKey:
          $ref: '#/components/schemas/SectionKey'
        itemType:
          type: string
          description: Second Schedule item type from declaration.v1, or `bio-tax` for KRA PIN and compliance
        fields:
          type: object
          additionalProperties: true
        sourceRef:
          type: object
          description: Registration, title or company number, or document page and field
          additionalProperties: true
        confidence:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 1
        matchItemId:
          type:
            - string
            - 'null'
          format: uuid
        status:
          type: string
          enum:
            - new
            - accepted
            - dismissed
            - superseded
        acceptedItemId:
          type:
            - string
            - 'null'
          format: uuid
    AssistantConversation:
      type: object
      required:
        - id
        - declarationId
        - language
        - messages
        - expiresAt
      properties:
        id:
          type: string
          format: uuid
        declarationId:
          type:
            - string
            - 'null'
          format: uuid
        language:
          type: string
          enum:
            - en
            - sw
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AssistantMessage'
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
    AssistantMessage:
      type: object
      required:
        - id
        - role
        - text
        - citations
        - sectionLink
        - declined
        - label
        - rating
        - at
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - user
            - assistant
        text:
          type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/HelpPassage'
        sectionLink:
          oneOf:
            - type: object
              required:
                - sectionKey
                - fieldPath
              properties:
                sectionKey:
                  type: string
                fieldPath:
                  type:
                    - string
                    - 'null'
            - type: 'null'
        declined:
          type: boolean
        label:
          type:
            - object
            - 'null'
          description: ai-gateway AiLabel for assistant turns
          additionalProperties: true
        rating:
          type:
            - string
            - 'null'
          enum:
            - helpful
            - not-helpful
            - null
        at:
          type: string
          format: date-time
    DeclarationReference:
      type: string
      description: 'ADR-011: DC{I|B|F}-<ISSUER>-<YEAR>-<7 digits>-<check>'
      pattern: ^DC[IBF]-[A-Z0-9]{2,20}-[0-9]{4}-[0-9]{7}-[0-9A-Z]$
      examples:
        - DCB-TSC-2027-0012345-K
    AcknowledgementStatus:
      type: string
      enum:
        - pending
        - issued
        - failed
    SubmitProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required:
            - code
          properties:
            code:
              type: string
              enum:
                - step-up-required
                - incomplete
                - before-statement-date
                - amendment-window-closed
                - not-a-draft
                - not-submitted
                - obligation-cancelled
            stepUpUrl:
              type: string
              format: uri
              description: Present for step-up-required
            blocking:
              type: array
              items:
                $ref: '#/components/schemas/CompletenessIssue'
    DeclarationVersion:
      type: object
      required:
        - version
        - reference
        - submittedAt
        - late
        - canonicalSha256
        - supersededAt
        - acknowledgement
      properties:
        version:
          type: integer
          minimum: 1
        reference:
          $ref: '#/components/schemas/DeclarationReference'
        submittedAt:
          type: string
          format: date-time
        late:
          type: boolean
        canonicalSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        supersededAt:
          type:
            - string
            - 'null'
          format: date-time
        acknowledgement:
          $ref: '#/components/schemas/Acknowledgement'
    DeclarationVersionDetail:
      allOf:
        - $ref: '#/components/schemas/DeclarationVersion'
        - type: object
          required:
            - document
          properties:
            document:
              type: object
              description: The immutable declaration.v1 document (decrypted for the owner)
              additionalProperties: true
    Acknowledgement:
      type: object
      required:
        - status
        - documentId
        - verificationId
        - issuedAt
        - verifiedCount
        - downloadUrl
      properties:
        status:
          $ref: '#/components/schemas/AcknowledgementStatus'
        documentId:
          type:
            - string
            - 'null'
          format: uuid
        verificationId:
          type:
            - string
            - 'null'
          description: Verification code printed under the QR
        issuedAt:
          type:
            - string
            - 'null'
          format: date-time
        verifiedCount:
          type: integer
        downloadUrl:
          type:
            - string
            - 'null'
          format: uri
          description: Short-lived presigned URL; fetched fresh on each call
    SubmissionResult:
      type: object
      required:
        - declaration
        - version
        - obligationStatus
      properties:
        declaration:
          $ref: '#/components/schemas/Declaration'
        version:
          $ref: '#/components/schemas/DeclarationVersion'
        obligationStatus:
          $ref: '#/components/schemas/ObligationStatus'
    AcknowledgementPayload:
      type: object
      required:
        - declarantName
        - commission
        - type
        - statementDate
        - reference
        - version
        - submittedAt
        - late
        - counts
      properties:
        declarantName:
          type: string
        commission:
          $ref: '#/components/schemas/CommissionRef'
        type:
          $ref: '#/components/schemas/ObligationType'
        statementDate:
          type: string
          format: date
        reference:
          $ref: '#/components/schemas/DeclarationReference'
        version:
          type: integer
        submittedAt:
          type: string
          format: date-time
        late:
          type: boolean
        counts:
          type: object
          required:
            - statements
            - income
            - assets
            - liabilities
            - attachments
          properties:
            statements:
              type: integer
            income:
              type: integer
            assets:
              type: integer
            liabilities:
              type: integer
            attachments:
              type: integer
    InternalVersionDocument:
      type: object
      required:
        - declarationId
        - versionId
        - version
        - reference
        - type
        - statementDate
        - submittedAt
        - late
        - dueDate
        - declarantName
        - personnelFileNumber
        - document
        - attachments
      properties:
        declarationId:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        version:
          type: integer
        reference:
          $ref: '#/components/schemas/DeclarationReference'
        type:
          $ref: '#/components/schemas/ObligationType'
        statementDate:
          type: string
          format: date
        submittedAt:
          type: string
          format: date-time
        late:
          type: boolean
        dueDate:
          type: string
          format: date
        declarantName:
          type: string
        personnelFileNumber:
          type: string
        document:
          type: object
          description: The immutable declaration.v1 document, decrypted
          additionalProperties: true
        attachments:
          type: array
          items:
            type: object
            required:
              - uploadId
              - itemId
              - personKey
              - fileName
              - sha256
            properties:
              uploadId:
                type: string
                format: uuid
              itemId:
                type: string
                format: uuid
              personKey:
                type: string
              fileName:
                type: string
              sha256:
                type: string
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9]{1,19}$
    DeclarationId:
      name: declarationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SectionKey:
      name: sectionKey
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SectionKey'
    VersionNumber:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    SuggestionId:
      name: suggestionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID, unique per logical request; reuse on retry
      schema:
        type: string
        format: uuid
  responses:
    NotFound:
      description: Not found, or not visible to the caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Caller lacks the required role
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationProblem:
      description: Request failed validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
security:
  - bearer: []
