# Generated by `pnpm --filter @adili/declarations contracts`: do not edit.
# Implemented operations come from the declarations service; operations marked `x-draft` come
# from packages/schemas/drafts/declarations.yaml until they are implemented.
openapi: 3.1.0
info:
  title: declarations API
  description: Filing obligations, drafts, declarations, versions, household and financial statements.
  version: '1'
servers:
  - url: /
    description: The service that serves this document
paths:
  /v1/me/obligations:
    get:
      tags:
        - obligations
      summary: The signed-in declarant's obligations across Commissions
      description: Authorised by the person_id claim. Staff tokens without it get 404.
      operationId: getMyObligations
      responses:
        '200':
          description: Obligations grouped by Commission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyObligations'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/obligations/summary:
    get:
      tags:
        - obligations
      summary: Per-Commission counts for EACC and platform administrators
      description: Every Commission's counts for a cycle (the current one by default), with not-onboarded declarants due or overdue, the last roster import, and totals. No declarant data.
      operationId: getNationalObligationsSummary
      parameters:
        - name: cycle
          required: false
          in: query
          description: A biennial cycle key, e.g. `biennial:2027`; the current cycle when omitted
          schema:
            examples:
              - biennial:2027
            type: string
            pattern: ^biennial:(\d{4})$
      responses:
        '200':
          description: Counts per Commission and totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NationalSummary'
        '400':
          description: Query failed validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            Only EACC roles and platform admins

            Requires one of the roles: eacc-analyst, eacc-supervisor, platform-admin
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/obligations/{id}:
    get:
      tags:
        - obligations
      summary: One obligation with its reminder history
      description: The declarant's own (`declarant` null); staff of the obligation's Commission and platform admins (with `declarant`, whom it is for). Anyone else gets 404. Staff and platform admin reads are audited under the obligation's Commission; a declarant reading their own is not.
      operationId: getObligation
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The obligation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObligationDetail'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: obligation.viewed
        resource: filing-obligation
  /v1/commissions/{slug}/obligations/summary:
    get:
      tags:
        - obligations
      summary: Counts by type and status, and not-onboarded among due and overdue
      description: "A cycle's counts (the current cycle by default: the latest opened, or the next while none has): its biennials, open initial and final obligations, and those filed in the cycle's two years. Staff of the Commission, platform admins and EACC roles; staff of another Commission get 404."
      operationId: getCommissionObligationsSummary
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: cycle
          required: false
          in: query
          description: A biennial cycle key, e.g. `biennial:2027`; the current cycle when omitted
          schema:
            examples:
              - biennial:2027
            type: string
            pattern: ^biennial:(\d{4})$
      responses:
        '200':
          description: The summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionSummary'
        '400':
          description: Query failed validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            Not a Commission's staff, an EACC role or a platform admin

            Requires one of the roles: reporting-officer, reviewer, supervisor, commission-admin, eacc-analyst, eacc-supervisor, platform-admin
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/declarations/progress:
    get:
      tags:
        - obligations
      summary: Declarants not started, in progress, submitted and late, per reporting entity
      description: "A cycle's obligations (the current cycle by default, scoped as the obligations summary) counted per reporting entity: `submitted` when filed, `late` when overdue, otherwise `inProgress` with a live draft and `notStarted` without one. Counts only, no declarant or draft content. The Commission's reporting officers and commission admins; anyone else gets 404."
      operationId: getCommissionDeclarationProgress
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: cycle
          required: false
          in: query
          description: A biennial cycle key, e.g. `biennial:2027`; the current cycle when omitted
          schema:
            examples:
              - biennial:2027
            type: string
            pattern: ^biennial:(\d{4})$
      responses:
        '200':
          description: Counts per reporting entity and totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclarationProgress'
        '400':
          description: Query failed validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/obligations:
    get:
      tags:
        - obligations
      summary: Declarants and their obligations for a Commission
      description: Staff of the tenant and platform-admin. EACC roles get 403 (summaries only); staff of another Commission 404.
      operationId: listCommissionObligations
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: type
          required: false
          in: query
          schema:
            type: string
            enum:
              - initial
              - biennial
              - final
        - name: status
          required: false
          in: query
          description: Only obligations with this status; cancelled ones only when asked for
          schema:
            type: string
            enum:
              - upcoming
              - due
              - overdue
              - filed
              - cancelled
        - name: onboarded
          required: false
          in: query
          description: Only declarants who have onboarded, or only those who have not
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: cycle
          required: false
          in: query
          description: Only obligations with this cycle key
          schema:
            examples:
              - biennial:2027
              - initial:2027-03-10
            type: string
            minLength: 1
            maxLength: 40
        - name: search
          required: false
          in: query
          description: A personnel file number or its beginning, or part of a name (both case-insensitive); blank means no search
          schema:
            type: string
            maxLength: 100
        - name: cursor
          required: false
          in: query
          description: '`nextCursor` of the previous page; omit for the first page'
          schema:
            type: string
            maxLength: 500
        - name: limit
          required: false
          in: query
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Page ordered by due date, overdue first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObligationPage'
        '400':
          description: Query failed validation, or the cursor is unknown
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            Not a Commission's staff or a platform admin (EACC sees counts only)

            Requires one of the roles: reporting-officer, reviewer, supervisor, commission-admin, platform-admin
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: obligations.listed
        resource: filing-obligation
  /v1/obligations/{id}/declaration:
    post:
      tags:
        - declarations
      summary: Start (or return the existing) draft declaration for the declarant's obligation
      description: Type, statement date and income period are derived from the obligation; bio is pre-filled from the roster record. Declarant only.
      operationId: startDeclaration
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Existing draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Declaration'
        '201':
          description: Draft created with pre-filled bio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Declaration'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Obligation is filed or cancelled (`obligation-closed`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The roster record could not be read (`directory-unavailable`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/declarations/{declarationId}:
    get:
      tags:
        - declarations
      summary: Draft header and section completeness (no contents)
      operationId: getDeclaration
      parameters:
        - name: declarationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The draft
          headers:
            ETag:
              schema:
                type: string
              description: The draft version; send it as If-Match on the next section save
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Declaration'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags:
        - declarations
      summary: Discard the draft
      description: 'Deletes the sections and attachments (records `declaration.attachment-unlinked.v1` for each, then `declaration.draft-discarded.v1`). The obligation is untouched: starting again makes a fresh draft.'
      operationId: discardDeclaration
      parameters:
        - name: declarationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Discarded
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Not a draft (`declaration-not-draft`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/me/declarations:
    get:
      tags:
        - declarations
      summary: The signed-in declarant's declarations (drafts now; submitted later)
      description: Live declarations across Commissions, last updated first, with the share of live sections complete. Authorised by the person_id claim; staff tokens without it get 404.
      operationId: getMyDeclarations
      responses:
        '200':
          description: Declarations, last updated first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeclarationListItem'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/declarations/{declarationId}/summary:
    get:
      tags:
        - declarations
      summary: The assembled declaration validated against declaration.v1, with what blocks submission
      description: Assembled from the live sections (archived statements left out), paragraph 9 material changes composed from the items. `canSubmit` is false in this slice.
      operationId: getDeclarationSummary
      parameters:
        - name: declarationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclarationSummary'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: declaration.summary.read
        resource: declaration
  /v1/declarations/{declarationId}/sections/{sectionKey}:
    get:
      tags:
        - declarations
      summary: One section's contents (decrypted for the owning declarant)
      operationId: getDeclarationSection
      parameters:
        - name: declarationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: sectionKey
          required: true
          in: path
          schema:
            $ref: '#/components/schemas/SectionKey'
      responses:
        '200':
          description: Section contents
          headers:
            ETag:
              schema:
                type: string
              description: The draft version; send it as If-Match on the next section save
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionEnvelope'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: declaration.section.read
        resource: declaration-section
    put:
      tags:
        - declarations
      summary: Save a section (autosave); requires If-Match with the current draft version
      description: The whole section is sent. Missing fields are saved and reported as completeness issues; a malformed body is refused. Locked bio fields may be left out.
      operationId: saveDeclarationSection
      parameters:
        - name: declarationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: sectionKey
          required: true
          in: path
          schema:
            $ref: '#/components/schemas/SectionKey'
        - name: If-Match
          in: header
          description: The draft version read (its ETag)
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectionContents'
      responses:
        '200':
          description: Saved; new version in ETag
          headers:
            ETag:
              schema:
                type: string
              description: The draft version; send it as If-Match on the next section save
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionSaveResult'
        '400':
          description: Validation failed, or a locked field was changed (`identity-locked-field`), or a nil flag conflicts with items (`nil-conflicts-with-items`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Not a draft (`declaration-not-draft`), or the statement is archived (`section-archived`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '412':
          description: If-Match does not match the current draft version (`draft-version-mismatch`); reload
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '428':
          description: If-Match header missing (`if-match-required`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/declarations/{declarationId}/attachments:
    post:
      tags:
        - declarations
      summary: Link a clean upload (purpose declaration-attachment) to an item
      description: The upload must be the Commission's, clean, and uploaded with purpose declaration-attachment. Its name, SHA-256 and size are kept, and a reference is added to the item inside the encrypted statement. Records `declaration.attachment-linked.v1`.
      operationId: linkDeclarationAttachment
      parameters:
        - name: declarationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentLink'
      responses:
        '201':
          description: Linked; new draft version in ETag
          headers:
            ETag:
              schema:
                type: string
              description: The draft version; send it as If-Match on the next section save
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclarationAttachment'
        '400':
          description: Request failed validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller, or the statement has no such item
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Upload is unknown or another Commission's (`upload-not-found`), not clean (`upload-not-clean`), has the wrong purpose (`upload-wrong-purpose`) or is attached already (`upload-already-linked`); or not a draft (`declaration-not-draft`), or the statement is archived (`section-archived`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The upload could not be checked (`documents-unavailable`); retry
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/declarations/{declarationId}/attachments/{attachmentId}:
    delete:
      tags:
        - declarations
      summary: Remove an attachment from its item
      description: Removes the attachment and the item's reference to it. The file is left to the documents orphan sweep. Records `declaration.attachment-unlinked.v1`.
      operationId: unlinkDeclarationAttachment
      parameters:
        - name: declarationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: attachmentId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Unlinked; new draft version in ETag
          headers:
            ETag:
              schema:
                type: string
              description: The draft version; send it as If-Match on the next section save
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Not a draft (`declaration-not-draft`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/help/search:
    get:
      tags:
        - help
      summary: Full-text search over the legal corpus and help articles in force
      description: "Declarants (by the person_id claim): the Act and Regulations, the platform's published articles and those of the declarant's own Commissions, in force on `date`. Passages tagged with the section or item type the declarant is on rank higher. Deterministic: no AI. Other callers get 404."
      operationId: searchHelp
      parameters:
        - name: q
          required: true
          in: query
          description: The question, in the declarant's words
          schema:
            type: string
            minLength: 2
            maxLength: 200
        - name: language
          required: true
          in: query
          description: 'The language of the question: `sw` also searches Swahili article bodies and expands Swahili words into the English of the law'
          schema:
            type: string
            enum:
              - en
              - sw
        - name: sectionKey
          required: false
          in: query
          description: The section the declarant is on; passages tagged with it rank higher
          schema:
            type: string
            pattern: ^(bio|household|other|statement:(officer|spouse:[0-9a-f-]{36}|child:[0-9a-f-]{36}))$
        - name: itemType
          required: false
          in: query
          description: The statement item type the declarant is on; boosted like the section
          schema:
            type: string
            enum:
              - land
              - building
              - vehicle
              - securities
              - shareholding
              - bank-account
              - cash
              - receivable
              - mortgage
              - loan
              - guarantee
              - salary-emoluments
              - allowances
              - business
              - rent
              - dividends-interest
              - pension
              - farming
              - consultancy
        - name: date
          required: false
          in: query
          description: Read the law in force on this day (`YYYY-MM-DD`); today by default
          schema:
            type: string
            format: date
        - name: limit
          required: false
          in: query
          schema:
            default: 8
            type: integer
            minimum: 1
            maximum: 20
      responses:
        '200':
          description: Passages, best first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HelpPassage'
        '400':
          description: Query failed validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/help/articles:
    get:
      tags:
        - help
      summary: The Commission's help articles, published or not
      description: The Commission's administrators and reporting officers. Anyone else gets 404.
      operationId: listHelpArticles
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
      responses:
        '200':
          description: Articles, last updated first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HelpArticle'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      tags:
        - help
      summary: Create a Commission help article
      description: The Commission's administrators. Its reporting officers get 403; anyone else 404. A published article reaches the Commission's declarants' help search and records `help.article.published.v1`.
      operationId: createHelpArticle
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HelpArticleInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpArticle'
        '400':
          description: Request failed validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: A reporting officer, who reads articles but does not edit them
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/help/articles/{articleId}:
    put:
      tags:
        - help
      summary: Update, publish or unpublish a Commission help article
      description: The Commission's administrators; as create. Publishing an unpublished article records `help.article.published.v1`.
      operationId: updateHelpArticle
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: articleId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HelpArticleInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpArticle'
        '400':
          description: Request failed validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: A reporting officer, who reads articles but does not edit them
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags:
        - help
      summary: Delete a Commission help article
      description: The Commission's administrators; as create.
      operationId: deleteHelpArticle
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
