    get:
      tags: [referrals]
      operationId: getReferral
      summary: One referral with its package manifest
      description: >-
        The Commission's reviewers and supervisors. Carries `evidence`, what the package includes
        by reference, so a supervisor previews it before approving; `package.manifest`, with the
        SHA-256 of every item, once the package is assembled.
      responses:
        '200':
          description: Referral
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Referral'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/review/referrals/{referralId}/approve:
    parameters:
      - $ref: '#/components/parameters/ReferralId'
    post:
      tags: [referrals]
      operationId: approveReferral
      summary: Approve (supervisor, separation rule); allocates RFL, assembles the package, sends to EACC
      description: >-
        A supervisor who neither proposed it nor held any of its cases. Allocates
        `RFL-<ISSUER>-<YEAR>-<seq>-<check>` (year of approval) and answers `approved`; the evidence
        is then pulled, the manifest stored, the Confidential `referral-package` issued and the
        referral `sent` (`referral.sent.v1`) in the background. The declarant is not notified.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Approved; the package is assembled and the referral sent in the background
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Referral'
        '403':
          description: 'Problem code `separation-of-duties` (proposer or reviewer of record) or `supervisor-required` (role)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Not proposed: problem code `not-proposed`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          $ref: '#/components/responses/DirectoryUnavailable'
  /v1/review/referrals/{referralId}/decline:
    parameters:
