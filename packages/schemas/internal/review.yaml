  /v1/commissions/{slug}/closures:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [closures]
      operationId: getBulkClosureSummary
      summary: Eligible system proposals, sampled and approved counts for a cycle and filters
      parameters:
        - name: cycleYear
          in: query
          required: true
          schema:
            type: integer
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/DeclarationType'
        - name: reportingEntityId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClosureSummary'
        '400':
          description: 'Query failed validation; problem code `filter-unsupported` for `reportingEntityId`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [closures]
      operationId: approveBulkClosures
      summary: Approve system-proposed closures matching the filters, in chunks (supervisor)
      description: >-
        Chunks of 100 per transaction, each allocating its CMP numbers in sequence, moving the
        cases to `determined` and notifying the declarants by person; no letter is rendered
        (`getDeterminationLetter` issues it on first request). Closures of cases the caller once
        held are skipped and counted. Sent again with the same Idempotency-Key after a failure,
        the approval resumes and reports every closure approved under the key.
      parameters:
        - name: cycleYear
          in: query
          required: true
          schema:
            type: integer
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/DeclarationType'
        - name: reportingEntityId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkApprovalResult'
        '400':
          description: 'Query failed validation; problem code `filter-unsupported` for `reportingEntityId`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DirectoryUnavailable'
  /v1/commissions/{slug}/actions:
