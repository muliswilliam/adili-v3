          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/review/cases/{caseId}/copilot/drafts:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [copilot]
      operationId: draftClarificationWithAi
      summary: Draft clarification items from selected flags and items (assignee); nothing is issued
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopilotDraftInput'
      responses:
        '200':
          description: Draft ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopilotDraft'
        '202':
          description: Still drafting; poll the draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopilotDraft'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: AI not enabled for this Commission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/review/copilot/drafts/{draftId}:
    parameters:
      - name: draftId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [copilot]
      operationId: getCopilotDraft
      summary: Poll a pending draft (assignee)
      responses:
        '200':
          description: Draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopilotDraft'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/review/copilot/outputs/{jobId}/feedback:
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [copilot]
      operationId: rateCopilotOutput
      summary: Rate an AI output as helpful or not (reviewer, supervisor); one rating per reviewer per output
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopilotFeedbackInput'
      responses:
        '200':
          description: Recorded
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/commissions/{slug}/ai-status:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [copilot]
      operationId: getCommissionAiStatus
      summary: Whether AI assistance is enabled for the Commission (commission-admin, supervisor)
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                required: [enabled, providerClass, dataClasses]
                properties:
                  enabled:
                    type: boolean
                  providerClass:
                    type: [string, 'null']
                    enum: [external, self-hosted, null]
                  dataClasses:
                    type: array
                    items:
                      type: string
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]{1,19}$'
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClarificationId:
      name: clarificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    DeterminationId:
      name: determinationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LadderId:
      name: ladderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActionId:
      name: actionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReferralId:
      name: referralId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    NotFound:
      description: Not found, or not visible to the caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Caller lacks the required role or is not the assignee
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationProblem:
      description: Request failed validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    DeclarationsUnavailable:
      description: >-
        Problem type `declarations-unavailable` (title "Upstream service unavailable"): the
        declaration could not be read from the declarations service
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    DirectoryUnavailable:
      description: >-
        Problem type `directory-unavailable` (title "Upstream service unavailable"): the Commission
        directory could not be reached; nothing changed, try again
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    DeclarationType:
      type: string
      enum: [initial, biennial, final]
    CaseStatus:
      type: string
      enum:
        [
          unassigned,
          assigned,
          awaiting-clarification,
          clarified,
          ready-for-determination,
          sample-review,
          further-action,
          determined,
        ]
    PriorityBand:
      type: string
      enum: [low, medium, high]
    Severity:
      type: string
      enum: [info, low, medium, high]
    RuleId:
      type: string
      enum:
        - completeness-residual
        - no-previous-version
        - value-change-25
        - acquisition-unflagged
        - disposal-unflagged
        - change-flag-mismatch
        - income-vs-asset-growth
        - nil-after-populated
        - late-filing
        - foreign-holdings
        - joint-share-inconsistent
        - registry-parcel-undeclared
        - declared-parcel-not-found
        - registry-vehicle-undeclared
        - declared-vehicle-not-found
        - registry-directorship-undeclared
        - declared-company-not-found
        - directorship-employer-supplier
        - kra-pin-missing
        - kra-non-compliant
        - kra-income-mismatch
    ClarificationStatus:
      type: string
      enum: [draft, issued, responded, resolved, overdue, withdrawn]
    Requirement:
      type: string
      description: Act s.35(4)
      enum: [provide-omitted, explain-discrepancy, correct]
    Assignee:
      type: object
      required: [subject, name]
      properties:
        subject:
          type: string
        name:
          type: string
    CaseListItem:
      type: object
      required:
        - id
        - reference
        - declarantName
        - personnelFileNumber
        - type
        - cycleYear
        - receivedAt
        - windowEndsAt
        - late
        - band
        - status
        - assignee
        - openFlags
        - clarification
        - currentVersion
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        declarantName:
          type: string
        personnelFileNumber:
          type: string
        type:
          $ref: '#/components/schemas/DeclarationType'
        cycleYear:
          type: integer
        receivedAt:
          type: string
          format: date-time
        windowEndsAt:
          type: string
          format: date-time
        late:
          type: boolean
        band:
          $ref: '#/components/schemas/PriorityBand'
        status:
          $ref: '#/components/schemas/CaseStatus'
        assignee:
          oneOf:
            - $ref: '#/components/schemas/Assignee'
            - type: 'null'
        openFlags:
          type: integer
        clarification:
          type: object
          required: [open, status, dueAt]
          properties:
            open:
              type: integer
            status:
              oneOf:
                - $ref: '#/components/schemas/ClarificationStatus'
                - type: 'null'
            dueAt:
              type: [string, 'null']
              format: date-time
        currentVersion:
          type: integer
    QueueSummary:
      type: object
      required: [byStatus, byBand, overdueClarifications]
      properties:
        byStatus:
          type: object
          additionalProperties:
            type: integer
        byBand:
          type: object
          additionalProperties:
            type: integer
        overdueClarifications:
          type: integer
    CopilotStatus:
      type: string
      enum: [not-enabled, pending, ready, failed, stale]
    CopilotView:
      type: object
      required:
        [status, forVersionId, generatedAt, failureReason, summary, explanations, jobs, feedback]
      properties:
        status:
          $ref: '#/components/schemas/CopilotStatus'
        forVersionId:
          type: [string, 'null']
          format: uuid
        generatedAt:
          type: [string, 'null']
          format: date-time
        failureReason:
          type: [string, 'null']
        summary:
          type: [object, 'null']
          description: ai-gateway SummarizeDeclarationOutput (label, overview, changesSincePrevious, sections, worthAttention)
          additionalProperties: true
        explanations:
          type: [object, 'null']
          description: ai-gateway ExplainFlagsOutput (label, explanations)
          additionalProperties: true
        jobs:
          type: object
          required: [summarize, explain]
          properties:
            summarize:
              type: [string, 'null']
              format: uuid
            explain:
              type: [string, 'null']
              format: uuid
        feedback:
          type: array
          description: The caller's own ratings
          items:
            type: object
            required: [jobId, rating]
            properties:
              jobId:
                type: string
                format: uuid
              rating:
                type: string
                enum: [helpful, not-helpful]
    CopilotDraftInput:
      type: object
      required: [flagIds, itemRefs, language]
      properties:
        flagIds:
          type: array
          items:
            type: string
            format: uuid
        itemRefs:
          type: array
          items:
            type: object
            required: [personKey, itemId, sectionKey, requirement]
            properties:
              personKey:
                type: [string, 'null']
              itemId:
                type: [string, 'null']
                format: uuid
              sectionKey:
                type: [string, 'null']
              requirement:
                oneOf:
                  - $ref: '#/components/schemas/Requirement'
                  - type: 'null'
        language:
          type: string
          enum: [en, sw]
    CopilotDraft:
      type: object
      required: [id, status, jobId, label, opening, items, failureReason]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, ready, failed]
        jobId:
          type: [string, 'null']
          format: uuid
        label:
          type: [object, 'null']
          description: ai-gateway AiLabel
          additionalProperties: true
        opening:
          type: [string, 'null']
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClarificationItemInput'
        failureReason:
          type: [string, 'null']
    CopilotFeedbackInput:
      type: object
      required: [rating, reason, note]
      properties:
        rating:
          type: string
          enum: [helpful, not-helpful]
        reason:
          type: [string, 'null']
          enum: [inaccurate, missed-something, unclear, too-long, other, null]
        note:
          type: [string, 'null']
          maxLength: 1000
    Flag:
      type: object
      required:
        [
          id,
          versionId,
          ruleId,
          severity,
          title,
          indicator,
          evidence,
          itemRefs,
          reviewed,
          recomputed,
        ]
      properties:
        id:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        ruleId:
          $ref: '#/components/schemas/RuleId'
        severity:
          $ref: '#/components/schemas/Severity'
        title:
          type: string
        indicator:
          type: string
          description: Plain-language indicator text; never a finding
        evidence:
          type: object
          description: Clear facts only (percentages, counts, dates, references); no amounts or descriptions
          additionalProperties: true
        itemRefs:
          type: array
          items:
            type: object
            required: [personKey, itemId]
            properties:
              personKey:
                type: string
              itemId:
                type: [string, 'null']
                format: uuid
              sectionKey:
                type: [string, 'null']
        closedReason:
          type: [string, 'null']
          enum: [superseded-by-recheck, null]
        reviewed:
          oneOf:
            - type: object
              required: [at, by, note]
              properties:
                at:
                  type: string
                  format: date-time
                by:
                  $ref: '#/components/schemas/Assignee'
                note:
                  type: string
            - type: 'null'
        recomputed:
          type: boolean
    Note:
      type: object
      required: [id, author, text, at]
      properties:
        id:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/Assignee'
        text:
          type: string
        at:
          type: string
          format: date-time
