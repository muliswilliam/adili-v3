openapi: 3.1.0
info:
  title: review API - cases, flags and clarifications (draft)
  version: '1'
  description: |
    Draft contract for specs 07a (queue, cases, clarifications), 07b (registry cross-checks) and 08
    (determinations, approvals, enforcement ladder, referrals). Review cases are created by the processing workflow from
    submitted declarations; the service stores flags and case data only and reads declaration
    content from the declarations service on demand. The review service's Swagger document
    becomes the source of truth once implemented.
servers:
  - url: http://localhost:4003
security:
  - bearer: []
tags:
  - name: queue
  - name: cases
  - name: clarifications
  - name: determinations
  - name: approvals
  - name: closures
  - name: actions
  - name: referrals
  - name: declarant
  - name: copilot
  - name: internal
paths:
  /v1/commissions/{slug}/review/queue:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [queue]
      operationId: listReviewQueue
      summary: Cases of the Commission ordered by score then age
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CaseStatus'
        - name: band
          in: query
          schema:
            $ref: '#/components/schemas/PriorityBand'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/DeclarationType'
        - name: cycle
          in: query
          schema:
            type: integer
        - name: assignee
          in: query
          description: mine, unassigned, any, or a subject id
          schema:
            type: string
        - name: late
          in: query
          schema:
            type: boolean
        - name: openClarification
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          description: Reference prefix, personnel file number prefix or name fragment
          schema:
            type: string
            maxLength: 100
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CaseListItem'
                  nextCursor:
                    type: [string, 'null']
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/commissions/{slug}/review/queue/summary:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [queue]
      operationId: getReviewQueueSummary
      summary: Counts by status and priority band
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueSummary'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/review/cases/{caseId}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      tags: [cases]
      operationId: getReviewCase
      summary: Case with flags, clarifications, notes, timeline and the declaration pulled on demand
      description: Every call is recorded as a read of the declaration (audit) and emits review.case.viewed.v1.
      responses:
        '200':
          description: Case detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: >-
            Problem type `declarations-unavailable`: the declaration could not be read. The problem
            carries the rest of the case detail (document null, versions empty) so the client can still
            show the case; no view is recorded.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ProblemDetails'
                  - $ref: '#/components/schemas/CaseDetail'
  /v1/review/cases/{caseId}/compare:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      tags: [cases]
      operationId: compareCaseVersions
      summary: Item matching and deltas between the current and previous submitted version
      responses:
        '200':
          description: Comparison
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionComparison'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: No previous version to compare with
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          $ref: '#/components/responses/DeclarationsUnavailable'
  /v1/review/cases/{caseId}/attachments/{uploadId}/download:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - name: uploadId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [cases]
      operationId: getCaseAttachmentDownload
      summary: Short-lived download link for an attachment of the declaration under review (audited)
      responses:
        '200':
          description: Link
          content:
            application/json:
              schema:
                type: object
                required: [downloadUrl, expiresAt]
                properties:
                  downloadUrl:
                    type: string
                    format: uri
                  expiresAt:
                    type: string
                    format: date-time
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: 'Problem type `declarations-unavailable` or `documents-unavailable`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/review/cases/{caseId}/claim:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [cases]
      operationId: claimCase
      summary: Assign an unassigned case to the caller
      responses:
        '200':
          description: Assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseListItem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Problem type `case-already-assigned`: another officer holds the case'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/review/cases/{caseId}/release:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [cases]
      operationId: releaseCase
      summary: Return the caller's case to the queue
      responses:
        '200':
          description: Unassigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseListItem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/review/cases/{caseId}/assignment:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    put:
      tags: [cases]
      operationId: reassignCase
      summary: Supervisor reassigns or unassigns a case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignee]
              properties:
                assignee:
                  type: [string, 'null']
                  description: Subject of a reviewer or supervisor of the tenant; null unassigns
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseListItem'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/review/cases/{caseId}/notes:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [cases]
      operationId: addCaseNote
      summary: Add an internal note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        '201':
          description: Note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/review/cases/{caseId}/flags/{flagId}/reviewed:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - name: flagId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [cases]
      operationId: markFlagReviewed
      summary: Record that a flag was considered, with a note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        '200':
          description: Flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flag'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Problem type `flag-already-reviewed`: the flag was marked reviewed before'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/review/cases/{caseId}/clarifications:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [clarifications]
      operationId: createClarificationDraft
      summary: Create a clarification draft (assignee only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClarificationInput'
      responses:
        '201':
          description: Draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clarification'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/review/clarifications/{clarificationId}:
    parameters:
      - $ref: '#/components/parameters/ClarificationId'
    get:
      tags: [clarifications]
      operationId: getClarification
      summary: Clarification with items, letter and response
      responses:
        '200':
          description: Clarification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clarification'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [clarifications]
      operationId: updateClarificationDraft
      summary: Update a draft's items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClarificationInput'
      responses:
        '200':
          description: Draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clarification'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Not a draft
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/review/clarifications/{clarificationId}/issue:
    parameters:
      - $ref: '#/components/parameters/ClarificationId'
    post:
      tags: [clarifications]
      operationId: issueClarification
      summary: Allocate the CLR reference, issue the letter, notify the declarant, start the 30-day clock
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clarification'
        '400':
          description: No items
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Problem code `clarification-window-closed` or `not-a-draft`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          $ref: '#/components/responses/DirectoryUnavailable'
  /v1/review/clarifications/{clarificationId}/resolve:
    parameters:
      - $ref: '#/components/parameters/ClarificationId'
    post:
      tags: [clarifications]
      operationId: resolveClarification
      summary: Mark the clarification resolved with a note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clarification'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Problem code `clarification-not-responded`: only a responded clarification is resolved.
            One still issued or overdue is withdrawn if issued in error; overdue escalates (spec 08)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/review/clarifications/{clarificationId}/follow-up:
    parameters:
      - $ref: '#/components/parameters/ClarificationId'
    post:
      tags: [clarifications]
      operationId: createFollowUpClarification
      summary: Create a new draft pre-filled with the unresolved items
      responses:
        '201':
          description: Draft with followUpOf set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clarification'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Problem code `not-followable`: a draft or a withdrawn clarification'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/review/clarifications/{clarificationId}/withdraw:
    parameters:
      - $ref: '#/components/parameters/ClarificationId'
    post:
      tags: [clarifications]
      operationId: withdrawClarification
      summary: Withdraw an issued clarification (letter revoked as issued in error)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        '200':
          description: Withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clarification'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Problem code `clarification-not-open`: not issued, overdue or responded'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The documents service could not revoke the letter; nothing changed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/me/clarifications:
    get:
      tags: [declarant]
      operationId: getMyClarifications
      summary: The declarant's clarifications across Commissions
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeclarantClarification'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/me/clarifications/{clarificationId}:
    parameters:
      - $ref: '#/components/parameters/ClarificationId'
    get:
      tags: [declarant]
      operationId: getMyClarification
      summary: One clarification with items, letter link and response
      responses:
        '200':
          description: Clarification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclarantClarification'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/me/clarifications/{clarificationId}/response:
    parameters:
      - $ref: '#/components/parameters/ClarificationId'
    post:
      tags: [declarant]
      operationId: respondToClarification
      summary: Submit the response once (accepted after the due date, marked late)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClarificationResponseInput'
      responses:
        '201':
          description: Responded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclarantClarification'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Problem code `already-responded`, `clarification-closed` (withdrawn or resolved),
            `attachment-not-clean` or `attachment-not-accepted` (not an upload of the Commission
            with purpose clarification-attachment)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The documents service could not check the attachments; nothing changed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/review/clarifications/{clarificationId}/letter-payload:
    parameters:
      - $ref: '#/components/parameters/ClarificationId'
    get:
      tags: [internal]
      operationId: internalGetClarificationLetterPayload
      summary: Fields the clarification letter template needs (documents service)
      responses:
        '200':
          description: Payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClarificationLetterPayload'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/DeclarationsUnavailable'
        '503':
          $ref: '#/components/responses/DirectoryUnavailable'
  /v1/review/cases/{caseId}/registry:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      tags: [cases]
      operationId: getCaseRegistryChecks
      summary: Per-person, per-system registry status with records pulled from the gateway and paired with declared items
      responses:
        '200':
          description: Registry view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryView'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/review/cases/{caseId}/recheck:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [cases]
      operationId: recheckCaseRegistries
      summary: Re-run registry lookups and matching for the case (assignee or supervisor)
      responses:
        '202':
          description: Re-check started
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Re-checked within the last 10 minutes
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/review/cases/{caseId}/determinations:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [determinations]
      operationId: proposeDetermination
      summary: Propose a compliance determination (assignee)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeterminationInput'
      responses:
        '201':
          description: Proposed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Determination'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A determination is already proposed or approved
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/review/determinations/{determinationId}:
    parameters:
      - $ref: '#/components/parameters/DeterminationId'
    get:
      tags: [determinations]
      operationId: getDetermination
      summary: One determination
      responses:
        '200':
          description: Determination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Determination'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/review/determinations/{determinationId}/approve:
    parameters:
      - $ref: '#/components/parameters/DeterminationId'
    post:
      tags: [determinations]
      operationId: approveDetermination
      summary: Approve (supervisor who is neither proposer nor reviewer of record); allocates CMP and issues the letter
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Determination'
        '403':
          description: 'Problem code `separation-of-duties` or role'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Not proposed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/review/determinations/{determinationId}/return:
    parameters:
      - $ref: '#/components/parameters/DeterminationId'
    post:
      tags: [determinations]
      operationId: returnDetermination
      summary: Return to the proposer with a reason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonInput'
      responses:
        '200':
          description: Returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Determination'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/review/determinations/{determinationId}/withdraw:
    parameters:
      - $ref: '#/components/parameters/DeterminationId'
    post:
      tags: [determinations]
      operationId: withdrawDetermination
      summary: Proposer withdraws while proposed
      responses:
        '200':
          description: Withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Determination'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/review/determinations/{determinationId}/letter:
    parameters:
      - $ref: '#/components/parameters/DeterminationId'
    get:
      tags: [determinations]
      operationId: getDeterminationLetter
      summary: Decision letter download; issued on first request for bulk closures
      responses:
        '200':
          description: Download link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LetterDownload'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Not approved
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/approvals:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [approvals]
      operationId: listApprovals
      summary: Proposed determinations, actions and referrals awaiting approval (supervisor)
      parameters:
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/ApprovalKind'
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor, counts]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApprovalItem'
                  nextCursor:
                    type: [string, 'null']
                  counts:
                    type: object
                    additionalProperties:
                      type: integer
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/review/approvals/{kind}/{subjectId}/reassign:
    parameters:
      - name: kind
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ApprovalKind'
      - name: subjectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [approvals]
      operationId: reassignApproval
      summary: Point an approval at another supervisor (informational; the separation rule still applies)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toSupervisor]
              properties:
                toSupervisor:
                  type: string
      responses:
        '200':
          description: Reassigned
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/commissions/{slug}/closures:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [closures]
      operationId: getBulkClosureSummary
