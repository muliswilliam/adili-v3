            type: string
            format: uuid
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClosureSummary'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [closures]
      operationId: approveBulkClosures
      summary: Approve system-proposed closures matching the filters, in chunks (supervisor)
      parameters:
        - name: cycleYear
          in: query
          required: true
          schema:
            type: integer
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/DeclarationType'
        - name: reportingEntityId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
