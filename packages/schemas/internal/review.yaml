        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '409':
          description: 'Problem code `already-responded`, `notice-closed`, `attachment-not-clean` or `attachment-not-accepted`'
          content:
