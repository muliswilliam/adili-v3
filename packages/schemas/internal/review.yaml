      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                required: [enabled, providerClass, dataClasses]
                properties:
                  enabled:
                    type: boolean
                  providerClass:
                    type: [string, 'null']
                    enum: [external, self-hosted, null]
                  dataClasses:
                    type: array
                    items:
                      type: string
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]{1,19}$'
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClarificationId:
      name: clarificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    DeterminationId:
      name: determinationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LadderId:
      name: ladderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActionId:
      name: actionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReferralId:
      name: referralId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    NotFound:
      description: Not found, or not visible to the caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Caller lacks the required role or is not the assignee
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationProblem:
      description: Request failed validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    DeclarationsUnavailable:
      description: >-
        Problem type `declarations-unavailable` (title "Upstream service unavailable"): the
        declaration could not be read from the declarations service
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    DirectoryUnavailable:
      description: >-
        Problem type `directory-unavailable` (title "Upstream service unavailable"): the Commission
        directory could not be reached; nothing changed, try again
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    DeclarationType:
      type: string
      enum: [initial, biennial, final]
    CaseStatus:
      type: string
      enum:
        [
          unassigned,
          assigned,
          awaiting-clarification,
          clarified,
          ready-for-determination,
          sample-review,
          further-action,
          determined,
        ]
    PriorityBand:
      type: string
      enum: [low, medium, high]
    Severity:
      type: string
      enum: [info, low, medium, high]
    RuleId:
      type: string
      enum:
        - completeness-residual
        - no-previous-version
        - value-change-25
        - acquisition-unflagged
        - disposal-unflagged
        - change-flag-mismatch
        - income-vs-asset-growth
        - nil-after-populated
        - late-filing
        - foreign-holdings
        - joint-share-inconsistent
        - registry-parcel-undeclared
        - declared-parcel-not-found
        - registry-vehicle-undeclared
        - declared-vehicle-not-found
        - registry-directorship-undeclared
        - declared-company-not-found
        - directorship-employer-supplier
        - kra-pin-missing
        - kra-non-compliant
        - kra-income-mismatch
    ClarificationStatus:
      type: string
      enum: [draft, issued, responded, resolved, overdue, withdrawn]
    Requirement:
      type: string
      description: Act s.35(4)
      enum: [provide-omitted, explain-discrepancy, correct]
    Assignee:
      type: object
      required: [subject, name]
      properties:
        subject:
          type: string
        name:
          type: string
    CaseListItem:
      type: object
      required:
        - id
        - reference
        - declarantName
        - personnelFileNumber
        - type
        - cycleYear
        - receivedAt
        - windowEndsAt
        - late
        - band
        - status
        - assignee
        - openFlags
        - clarification
        - currentVersion
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        declarantName:
          type: string
        personnelFileNumber:
          type: string
        type:
          $ref: '#/components/schemas/DeclarationType'
        cycleYear:
          type: integer
        receivedAt:
          type: string
          format: date-time
        windowEndsAt:
          type: string
          format: date-time
        late:
          type: boolean
        band:
          $ref: '#/components/schemas/PriorityBand'
        status:
          $ref: '#/components/schemas/CaseStatus'
        assignee:
          oneOf:
            - $ref: '#/components/schemas/Assignee'
            - type: 'null'
        openFlags:
          type: integer
        clarification:
          type: object
          required: [open, status, dueAt]
          properties:
            open:
              type: integer
            status:
              oneOf:
                - $ref: '#/components/schemas/ClarificationStatus'
                - type: 'null'
            dueAt:
              type: [string, 'null']
              format: date-time
        currentVersion:
          type: integer
    QueueSummary:
      type: object
      required: [byStatus, byBand, overdueClarifications]
      properties:
        byStatus:
          type: object
          additionalProperties:
            type: integer
        byBand:
          type: object
          additionalProperties:
            type: integer
        overdueClarifications:
          type: integer
    CopilotStatus:
      type: string
      enum: [not-enabled, pending, ready, failed, stale]
    CopilotView:
      type: object
      required:
        [status, forVersionId, generatedAt, failureReason, summary, explanations, jobs, feedback]
      properties:
        status:
          $ref: '#/components/schemas/CopilotStatus'
        forVersionId:
          type: [string, 'null']
          format: uuid
        generatedAt:
          type: [string, 'null']
          format: date-time
        failureReason:
          type: [string, 'null']
        summary:
          type: [object, 'null']
          description: ai-gateway SummarizeDeclarationOutput (label, overview, changesSincePrevious, sections, worthAttention)
          additionalProperties: true
        explanations:
          type: [object, 'null']
          description: ai-gateway ExplainFlagsOutput (label, explanations)
          additionalProperties: true
        jobs:
          type: object
          required: [summarize, explain]
          properties:
            summarize:
              type: [string, 'null']
              format: uuid
            explain:
              type: [string, 'null']
              format: uuid
        feedback:
          type: array
          description: The caller's own ratings
          items:
            type: object
            required: [jobId, rating]
            properties:
              jobId:
                type: string
                format: uuid
              rating:
                type: string
                enum: [helpful, not-helpful]
    CopilotDraftInput:
      type: object
      required: [flagIds, itemRefs, language]
      properties:
        flagIds:
          type: array
          items:
            type: string
            format: uuid
        itemRefs:
          type: array
          items:
            type: object
            required: [personKey, itemId, sectionKey, requirement]
            properties:
              personKey:
                type: [string, 'null']
              itemId:
                type: [string, 'null']
                format: uuid
              sectionKey:
                type: [string, 'null']
              requirement:
                oneOf:
                  - $ref: '#/components/schemas/Requirement'
                  - type: 'null'
        language:
          type: string
          enum: [en, sw]
    CopilotDraft:
      type: object
      required: [id, status, jobId, label, opening, items, failureReason]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, ready, failed]
        jobId:
          type: [string, 'null']
          format: uuid
        label:
          type: [object, 'null']
          description: ai-gateway AiLabel
          additionalProperties: true
        opening:
          type: [string, 'null']
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClarificationItemInput'
        failureReason:
          type: [string, 'null']
    CopilotFeedbackInput:
      type: object
      required: [rating, reason, note]
      properties:
        rating:
          type: string
          enum: [helpful, not-helpful]
        reason:
          type: [string, 'null']
          enum: [inaccurate, missed-something, unclear, too-long, other, null]
        note:
          type: [string, 'null']
          maxLength: 1000
    Flag:
      type: object
      required:
        [
          id,
          versionId,
          ruleId,
          severity,
          title,
          indicator,
          evidence,
          itemRefs,
          reviewed,
          recomputed,
        ]
      properties:
        id:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        ruleId:
          $ref: '#/components/schemas/RuleId'
        severity:
          $ref: '#/components/schemas/Severity'
        title:
          type: string
        indicator:
          type: string
          description: Plain-language indicator text; never a finding
        evidence:
          type: object
          description: Clear facts only (percentages, counts, dates, references); no amounts or descriptions
          additionalProperties: true
        itemRefs:
          type: array
          items:
            type: object
            required: [personKey, itemId]
            properties:
              personKey:
                type: string
              itemId:
                type: [string, 'null']
                format: uuid
              sectionKey:
                type: [string, 'null']
        closedReason:
          type: [string, 'null']
          enum: [superseded-by-recheck, null]
        reviewed:
          oneOf:
            - type: object
              required: [at, by, note]
              properties:
                at:
                  type: string
                  format: date-time
                by:
                  $ref: '#/components/schemas/Assignee'
                note:
                  type: string
            - type: 'null'
        recomputed:
          type: boolean
    Note:
      type: object
      required: [id, author, text, at]
      properties:
        id:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/Assignee'
        text:
          type: string
        at:
          type: string
          format: date-time
    TimelineEntry:
      type: object
      required: [id, kind, actor, at, summary, ref]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        actor:
          oneOf:
            - $ref: '#/components/schemas/Assignee'
            - type: 'null'
        at:
          type: string
          format: date-time
        summary:
          type: string
        ref:
          type: [string, 'null']
    CaseDetail:
      type: object
      required: [case, flags, clarifications, notes, timeline, document, versions, reviewerHistory]
      properties:
        case:
          $ref: '#/components/schemas/CaseListItem'
        flags:
          type: array
          items:
            $ref: '#/components/schemas/Flag'
        clarifications:
          type: array
          items:
            $ref: '#/components/schemas/Clarification'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/Note'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEntry'
        document:
          description: The current version's declaration.v1 document, pulled from the declarations service (null when unavailable)
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        versions:
          type: array
          description: Every version the case has processed, from the review service's own records; only the current one's document is pulled
          items:
            type: object
            required: [versionId, version, submittedAt, late, amendment]
            properties:
              versionId:
                type: string
                format: uuid
              amendment:
                type: boolean
                description: The version amended an earlier one of the same declaration
              version:
                type: integer
              submittedAt:
                type: string
                format: date-time
              late:
                type: boolean
        reviewerHistory:
          type: array
          items:
            $ref: '#/components/schemas/Assignee'
        determinations:
          type: array
          description: Every determination of the case, oldest first; the current one is last
          items:
            $ref: '#/components/schemas/Determination'
    VersionComparison:
      type: object
      required: [previousVersion, currentVersion, statements]
      properties:
        previousVersion:
          type: integer
        currentVersion:
          type: integer
        statements:
          type: array
          items:
            type: object
            required: [personKey, personName, matched, onlyPrevious, onlyCurrent]
            properties:
              personKey:
                type: string
              personName:
                type: string
              matched:
                type: array
                items:
                  type: object
                  required:
                    [
                      category,
                      type,
                      description,
                      previousCents,
                      currentCents,
                      deltaCents,
                      deltaPercent,
                      flaggedByDeclarant,
                    ]
                  properties:
                    category:
                      type: string
                    type:
                      type: string
                    description:
                      type: string
                    previousCents:
                      type: integer
                    currentCents:
                      type: integer
                    deltaCents:
                      type: integer
                    deltaPercent:
                      type: [number, 'null']
                    flaggedByDeclarant:
                      type: boolean
              onlyPrevious:
                type: array
                items:
                  type: object
                  additionalProperties: true
              onlyCurrent:
                type: array
                items:
                  type: object
                  additionalProperties: true
    ClarificationItemInput:
      type: object
      required: [requirement, text]
      properties:
        sectionKey:
          type: [string, 'null']
        personKey:
          type: [string, 'null']
        itemId:
          type: [string, 'null']
          format: uuid
        requirement:
          $ref: '#/components/schemas/Requirement'
        text:
          type: string
          minLength: 1
          maxLength: 1000
    ClarificationInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 0
          maxItems: 50
          items:
            $ref: '#/components/schemas/ClarificationItemInput'
    ClarificationResponseInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [index, text, attachments]
            properties:
              index:
                type: integer
                minimum: 0
                description: Position of the clarification item being answered, once each
              text:
                type: string
                minLength: 1
                maxLength: 2000
              attachments:
                type: array
                maxItems: 10
                items:
                  type: string
                  format: uuid
                  description: Clean upload ids with purpose clarification-attachment
    Clarification:
      type: object
      required:
        - id
        - caseId
        - reference
        - status
        - items
        - issuedAt
        - dueAt
        - respondedAt
        - responseLate
        - resolvedAt
        - resolutionNote
        - letter
        - followUpOf
        - response
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        reference:
          type: [string, 'null']
          description: 'CLR-<ISSUER>-<YEAR>-<seq>-<check>; null while draft'
        status:
          $ref: '#/components/schemas/ClarificationStatus'
        items:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/ClarificationItemInput'
              - type: object
                properties:
                  label:
                    type: string
                    description: Human label of the target (e.g. "Assets · Plot KSM/123 · Grace Otieno")
        issuedAt:
          type: [string, 'null']
          format: date-time
        dueAt:
          type: [string, 'null']
          format: date-time
        respondedAt:
          type: [string, 'null']
          format: date-time
        responseLate:
          type: boolean
        resolvedAt:
          type: [string, 'null']
          format: date-time
        resolutionNote:
          type: [string, 'null']
        letter:
          oneOf:
            - type: object
              required: [documentId, verificationId, status]
              properties:
                documentId:
                  type: string
                  format: uuid
                verificationId:
                  type: string
                status:
                  type: string
                  enum: [pending, issued, revoked]
            - type: 'null'
        followUpOf:
          type: [string, 'null']
          format: uuid
        response:
          oneOf:
            - type: object
              required: [items, submittedAt]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [index, text, attachments]
                    properties:
                      index:
                        type: integer
                      text:
                        type: string
                      attachments:
                        type: array
                        items:
                          type: object
                          required: [uploadId, fileName, sha256]
                          properties:
                            uploadId:
                              type: string
                              format: uuid
                            fileName:
                              type: string
                            sha256:
                              type: string
                submittedAt:
                  type: string
                  format: date-time
            - type: 'null'
    DeclarantClarification:
      allOf:
        - $ref: '#/components/schemas/Clarification'
        - type: object
          required: [commission, declarationReference, letterDownloadUrl]
          properties:
            commission:
              type: object
              required: [slug, name]
              properties:
                slug:
                  type: string
                name:
                  type: string
            declarationReference:
              type: string
            letterDownloadUrl:
              type: [string, 'null']
              format: uri
    ClarificationLetterPayload:
      type: object
      required:
        [
          declarantName,
          commission,
          declarationReference,
          clarificationReference,
          items,
          issuedAt,
          dueAt,
          portalUrl,
        ]
      properties:
        declarantName:
          type: string
        commission:
          type: object
          required: [name, issuerCode]
          properties:
            name:
              type: string
            issuerCode:
              type: string
        declarationReference:
          type: string
        clarificationReference:
          type: string
        items:
          type: array
          items:
            type: object
            required: [label, requirementLabel, text]
            properties:
              label:
                type: string
              requirementLabel:
                type: string
              text:
                type: string
        issuedAt:
          type: string
          format: date-time
        dueAt:
          type: string
          format: date-time
        portalUrl:
          type: string
          format: uri
    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
    RegistrySystem:
      type: string
      enum: [kra, ntsa, brs, ardhisasa]
    RegistryCheckStatus:
      type: string
      enum: [matched, mismatched, unavailable, not-checked, no-id]
    RegistryView:
      type: object
      required: [checkedAt, persons]
      properties:
        checkedAt:
          type: [string, 'null']
          format: date-time
        persons:
          type: array
          items:
            type: object
            required: [personKey, personName, hasNationalId, systems]
            properties:
              personKey:
                type: string
              personName:
                type: string
              hasNationalId:
                type: boolean
              systems:
                type: array
                items:
                  type: object
                  required: [system, status, reason, checkedAt, resultId, rows, flags]
                  properties:
                    system:
                      $ref: '#/components/schemas/RegistrySystem'
                    status:
                      $ref: '#/components/schemas/RegistryCheckStatus'
                    reason:
                      type: [string, 'null']
                    checkedAt:
                      type: [string, 'null']
                      format: date-time
                    resultId:
                      type: [string, 'null']
                      format: uuid
                    rows:
                      type: array
                      description: Registry record paired with the declared item it matched, if any
                      items:
                        type: object
                        required: [registryRecord, declaredItemId, relation]
                        properties:
                          registryRecord:
                            type: object
                            additionalProperties: true
                          declaredItemId:
                            type: [string, 'null']
                            format: uuid
                          relation:
                            type: string
                            enum: [matched, not-declared, not-in-registry]
                    flags:
                      type: array
                      items:
                        $ref: '#/components/schemas/Flag'
    DeterminationOutcome:
      type: string
      enum: [compliant, compliant-no-issues, non-compliant, further-action]
    ProposalStatus:
      type: string
      enum: [proposed, approved, returned, withdrawn]
    ProposerKind:
      type: string
      enum: [system, user]
    ReasonInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    DeterminationInput:
      type: object
      required: [outcome, reasons]
      properties:
        outcome:
          type: string
          enum: [compliant, non-compliant, further-action]
        reasons:
          type: string
          minLength: 1
          maxLength: 4000
        furtherActionNote:
          type: [string, 'null']
          maxLength: 2000
    Determination:
      type: object
      required:
        [
          id,
          caseId,
          outcome,
          reasons,
          proposerKind,
          proposer,
          proposedAt,
          status,
          approver,
          approvedAt,
          returnReason,
          reference,
          letterAvailable,
        ]
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        outcome:
          $ref: '#/components/schemas/DeterminationOutcome'
        reasons:
          type: string
        proposerKind:
          $ref: '#/components/schemas/ProposerKind'
        proposer:
          oneOf:
            - $ref: '#/components/schemas/Assignee'
            - type: 'null'
        proposedAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ProposalStatus'
        approver:
          oneOf:
            - $ref: '#/components/schemas/Assignee'
            - type: 'null'
        approvedAt:
          type: [string, 'null']
          format: date-time
        returnReason:
          type: [string, 'null']
        returnedBy:
          description: The supervisor who returned it; null unless returned
          oneOf:
            - $ref: '#/components/schemas/Assignee'
            - type: 'null'
        returnedAt:
          type: [string, 'null']
          format: date-time
        furtherActionNote:
          type: [string, 'null']
        reference:
          type: [string, 'null']
          description: 'CMP-<ISSUER>-<YEAR>-<seq>-<check>, allocated at approval'
        letterAvailable:
          type: boolean
    LetterDownload:
      type: object
      required: [documentId, verificationId, downloadUrl]
      properties:
        documentId:
          type: string
          format: uuid
        verificationId:
          type: string
        downloadUrl:
          type: [string, 'null']
          format: uri
          description: >-
            The declarant's portal download of their own letter (the documents owner rule); null
            for staff, who download the document by id from the documents service
    ApprovalKind:
      type: string
      enum: [determination, action, referral]
    ApprovalItem:
      type: object
      required:
        [
          kind,
          subjectId,
          proposedAt,
          proposerKind,
          proposer,
          summary,
          canApprove,
          cannotApproveReason,
          reassignedTo,
        ]
      properties:
        kind:
          $ref: '#/components/schemas/ApprovalKind'
        subjectId:
          type: string
          format: uuid
        proposedAt:
          type: string
          format: date-time
        proposerKind:
          $ref: '#/components/schemas/ProposerKind'
        proposer:
          oneOf:
            - $ref: '#/components/schemas/Assignee'
            - type: 'null'
        summary:
          type: object
          description: Kind-specific summary (outcome and reasons excerpt; step and subject; grounds)
          additionalProperties: true
        canApprove:
          type: boolean
        cannotApproveReason:
          type: [string, 'null']
          enum: [proposer, reviewer-of-record, role, null]
        reassignedTo:
          oneOf:
            - $ref: '#/components/schemas/Assignee'
            - type: 'null'
    ClosureSummary:
      type: object
      required:
        [cycleYear, eligibleProposed, sampled, approved, sampleRate, windowClosedAt, lastSweptAt]
      properties:
        cycleYear:
          type: integer
        eligibleProposed:
          type: integer
          description: System `compliant-no-issues` proposals waiting for approval
        sampled:
          type: integer
          description: Cases the sweep diverted to review instead of proposing their closure
        approved:
          type: integer
        sampleRate:
          type: number
          description: Fraction of eligible cases diverted to review, e.g. 0.02 for 2%
        windowClosedAt:
          type: [string, 'null']
          format: date-time
          description: When the last low-band case of the cycle and filters leaves its clarification window
        lastSweptAt:
          type: [string, 'null']
          format: date-time
          description: When the closure sweep last ran for the cycle; null before the first sweep
    BulkApprovalResult:
      type: object
      required: [approved, skipped, firstReference, lastReference, chunks]
      properties:
        approved:
          type: integer
        skipped:
          type: integer
          description: Waiting closures of cases the caller once held, left for another supervisor
        firstReference:
          type: [string, 'null']
        lastReference:
          type: [string, 'null']
        chunks:
          type: integer
    ActionStep:
      type: string
      enum: [notice-to-comply, warning, salary-stoppage, disciplinary-referral]
    ActionStatus:
      type: string
      enum:
        [
          proposed,
          approved,
          approved-pending-payroll,
          declined,
          issued,
          responded,
          complied,
          reinstated,
          cancelled,
        ]
    PayrollAck:
      type: object
      required: [instructionReference, action, status, payrollReference, receivedAt]
      properties:
        instructionReference:
          type: string
        action:
          type: string
          enum: [stop_salary, resume_salary]
        status:
          type: string
        payrollReference:
          type: [string, 'null']
        receivedAt:
          type: [string, 'null']
          format: date-time
    AdministrativeAction:
      type: object
      required:
        [
          id,
          ladderId,
          step,
          status,
          proposerKind,
          proposer,
          proposedAt,
          approver,
          approvedAt,
          declinedBy,
          declinedAt,
          declineNote,
          issuedAt,
          windowEndsAt,
          reference,
          letter,
          response,
          payrollStop,
          payrollResume,
        ]
      properties:
        id:
          type: string
          format: uuid
        ladderId:
          type: string
          format: uuid
        step:
          $ref: '#/components/schemas/ActionStep'
        status:
          $ref: '#/components/schemas/ActionStatus'
        proposerKind:
          $ref: '#/components/schemas/ProposerKind'
        proposer:
          description: The proposing officer; null for the system's drafts
          oneOf:
            - $ref: '#/components/schemas/Assignee'
            - type: 'null'
        proposedAt:
          type: string
          format: date-time
        approver:
          oneOf:
            - $ref: '#/components/schemas/Assignee'
            - type: 'null'
        approvedAt:
          type: [string, 'null']
          format: date-time
        declinedBy:
          oneOf:
            - $ref: '#/components/schemas/Assignee'
            - type: 'null'
        declinedAt:
          type: [string, 'null']
          format: date-time
        declineNote:
          type: [string, 'null']
        issuedAt:
          type: [string, 'null']
          format: date-time
          description: When the letter was requested; the window runs from here
        windowEndsAt:
          type: [string, 'null']
          format: date-time
        reference:
          type: [string, 'null']
          description: 'ADM-<ISSUER>-<YEAR>-<seq>-<check>'
        letter:
          oneOf:
            - type: object
              required: [documentId, verificationId]
              properties:
                documentId:
                  type: string
                  format: uuid
                verificationId:
                  type: string
            - type: 'null'
        response:
          oneOf:
            - type: object
              required: [text, attachments, submittedAt]
              properties:
                text:
                  type: string
                attachments:
                  type: array
                  items:
                    type: object
                    required: [uploadId, fileName]
                    properties:
                      uploadId:
                        type: string
                        format: uuid
                      fileName:
                        type: string
                submittedAt:
                  type: string
                  format: date-time
            - type: 'null'
        payrollStop:
          oneOf:
            - $ref: '#/components/schemas/PayrollAck'
            - type: 'null'
        payrollResume:
          oneOf:
            - $ref: '#/components/schemas/PayrollAck'
            - type: 'null'
    Ladder:
      type: object
      required:
        [
          id,
          subjectKind,
          subjectId,
          subjectReference,
          declarantName,
          personnelFileNumber,
          status,
          closingCause,
          currentStep,
          steps,
          startedAt,
          endedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        subjectKind:
          type: string
          enum: [obligation, clarification]
        subjectId:
          type: string
          format: uuid
        subjectReference:
          type: string
        declarantName:
          type: string
        personnelFileNumber:
          type: string
        status:
          type: string
          enum: [active, complied, declined, ended]
        closingCause:
          description: >-
            What closed the ladder: compliance (`filed`, `clarification-responded`,
            `clarification-resolved`) or the subject gone (`obligation-cancelled`,
            `clarification-withdrawn`); null while active or declined
          type: [string, 'null']
          enum:
            [
              filed,
              clarification-responded,
              clarification-resolved,
              obligation-cancelled,
              clarification-withdrawn,
              null,
            ]
        currentStep:
          oneOf:
            - $ref: '#/components/schemas/ActionStep'
            - type: 'null'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/AdministrativeAction'
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: [string, 'null']
          format: date-time
    ReferralGrounds:
      type: string
      enum: [undeclared-assets, unexplained-assets, two-missed-cycles, unanswered-clarification]
    ReferralStatus:
      type: string
      enum: [proposed, approved, declined, sent]
    ReferralInput:
      type: object
      required: [grounds, narrative, flagIds, clarificationIds]
      properties:
        grounds:
          type: string
          enum: [undeclared-assets, unexplained-assets]
        narrative:
          type: string
          minLength: 1
          maxLength: 8000
        flagIds:
          type: array
          items:
            type: string
            format: uuid
        clarificationIds:
          type: array
          items:
            type: string
            format: uuid
    Referral:
      type: object
      required:
        [
          id,
          caseId,
          cycleYear,
          grounds,
          proposerKind,
          proposer,
          proposedAt,
          status,
          approver,
          approvedAt,
          declinedBy,
          declinedAt,
          declineNote,
          reference,
          sources,
          narrative,
          package,
          sentAt,
          declarantName,
          personnelFileNumber,
        ]
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: [string, 'null']
          format: uuid
          description: The case it was proposed from (or whose clarification went unanswered)
        cycleYear:
          type: integer
          description: The cycle it is about (the case's, or the later missed biennial cycle's)
        grounds:
          $ref: '#/components/schemas/ReferralGrounds'
        proposerKind:
          $ref: '#/components/schemas/ProposerKind'
        proposer:
          oneOf:
            - $ref: '#/components/schemas/Assignee'
            - type: 'null'
        proposedAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ReferralStatus'
        approver:
          oneOf:
            - $ref: '#/components/schemas/Assignee'
            - type: 'null'
        approvedAt:
          type: [string, 'null']
          format: date-time
        declinedBy:
          oneOf:
            - $ref: '#/components/schemas/Assignee'
            - type: 'null'
        declinedAt:
          type: [string, 'null']
          format: date-time
        declineNote:
          type: [string, 'null']
        reference:
          type: [string, 'null']
          description: 'RFL-<ISSUER>-<YEAR>-<seq>-<check>'
        sources:
          type: object
          required: [caseIds, flagIds, clarificationIds, obligationIds, actionIds]
          properties:
            caseIds:
              type: array
              items:
                type: string
                format: uuid
            flagIds:
              type: array
              items:
                type: string
                format: uuid
            clarificationIds:
              type: array
              items:
                type: string
                format: uuid
            obligationIds:
              type: array
              items:
                type: string
                format: uuid
            actionIds:
              type: array
              items:
                type: string
                format: uuid
        narrative:
          type: string
        package:
          oneOf:
            - type: object
              required: [documentId, verificationId, manifest]
              properties:
                documentId:
                  type: string
                  format: uuid
                verificationId:
                  type: string
                manifest:
                  type: array
                  items:
                    $ref: '#/components/schemas/ReferralManifestItem'
            - type: 'null'
        sentAt:
          type: [string, 'null']
          format: date-time
        declarantName:
          type: string
        personnelFileNumber:
          type: string
        evidence:
          type: array
          description: >-
            `getReferral` only: what the package includes, by reference (attachments are listed in
            the manifest once it is assembled)
          items:
            type: object
            required: [kind, reference]
            properties:
              kind:
                $ref: '#/components/schemas/ReferralManifestKind'
              reference:
                type: string
    ReferralManifestKind:
      type: string
      enum:
        [
          declaration-version,
          declaration-attachment,
          flag,
          clarification,
          clarification-attachment,
          obligation,
          letter,
        ]
    ReferralManifestItem:
      type: object
      required: [kind, reference, sha256, documentId]
      properties:
        kind:
          $ref: '#/components/schemas/ReferralManifestKind'
        reference:
          type: string
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            SHA-256 of the item as the package includes it: canonical JSON (sorted keys) for
            versions' documents, flags, clarifications and obligations; the file's own hash for
            uploads and letters
        documentId:
          type: [string, 'null']
          format: uuid
          description: The upload (attachments) or issued document (letters); null for records
    ReferralPackagePayload:
      type: object
      required:
        [
          reference,
          grounds,
          groundsLabel,
          cycleYear,
          commission,
          declarant,
          narrative,
          proposedBy,
          proposedAt,
          approvedBy,
          approvedAt,
          manifest,
          versions,
          flags,
          clarifications,
          obligations,
          letters,
        ]
      properties:
        reference:
          type: string
        grounds:
          $ref: '#/components/schemas/ReferralGrounds'
        groundsLabel:
          type: string
        cycleYear:
          type: integer
        commission:
          type: object
          required: [name, issuerCode]
          properties:
            name:
              type: string
            issuerCode:
              type: string
        declarant:
          type: object
          required: [name, personnelFileNumber]
          properties:
            name:
              type: string
            personnelFileNumber:
              type: string
        narrative:
          type: string
        proposedBy:
          type: string
        proposedAt:
          type: string
          format: date-time
        approvedBy:
          type: string
        approvedAt:
          type: string
          format: date-time
        manifest:
          type: array
          items:
            $ref: '#/components/schemas/ReferralManifestItem'
        versions:
          type: array
          items:
            type: object
            required: [reference, version, type, statementDate, submittedAt, late, document]
            properties:
              reference:
                type: string
              version:
                type: integer
              type:
                $ref: '#/components/schemas/DeclarationType'
              statementDate:
                type: string
                format: date
              submittedAt:
                type: string
                format: date-time
              late:
                type: boolean
              document:
                type: object
                description: The declaration.v1 document as submitted
                additionalProperties: true
        flags:
          type: array
          items:
            type: object
            additionalProperties: true
        clarifications:
          type: array
          items:
            type: object
            additionalProperties: true
        obligations:
          type: array
          items:
            type: object
            required: [cycleKey, type, status, dueDate, filedAt]
            properties:
              cycleKey:
                type: string
              type:
                type: string
              status:
                type: string
              dueDate:
                type: string
                format: date
              filedAt:
                type: [string, 'null']
                format: date-time
        letters:
          type: array
          items:
            type: object
            required: [reference, documentId]
            properties:
              reference:
                type: string
              documentId:
                type: string
                format: uuid
    ApprovalReassignment:
      type: object
      required: [kind, subjectId, reassignedTo]
      properties:
        kind:
          $ref: '#/components/schemas/ApprovalKind'
        subjectId:
          type: string
          format: uuid
        reassignedTo:
          $ref: '#/components/schemas/Assignee'
    DeterminationLetterPayload:
      type: object
      required:
        [
          declarantName,
          commission,
          declarationReference,
          determinationReference,
          outcome,
          outcomeLabel,
          reasons,
          decidedAt,
          portalUrl,
        ]
      properties:
        declarantName:
          type: string
        commission:
          type: object
          required: [name, issuerCode]
          properties:
            name:
              type: string
            issuerCode:
              type: string
        declarationReference:
          type: string
        determinationReference:
          type: string
        outcome:
          $ref: '#/components/schemas/DeterminationOutcome'
        outcomeLabel:
          type: string
        reasons:
          type: string
        decidedAt:
          type: string
          format: date-time
        portalUrl:
          type: string
          format: uri
    ActionLetterPayload:
      type: object
      required:
        [
          declarantName,
          personnelFileNumber,
          commission,
          reference,
          step,
          stepLabel,
          subjectKind,
          subjectReference,
          whatToDo,
          issuedAt,
          actBy,
          salaryStoppedFrom,
          respondUrl,
        ]
      properties:
        declarantName:
          type: string
        personnelFileNumber:
          type: string
        commission:
          type: object
          required: [name, issuerCode]
          properties:
            name:
              type: string
            issuerCode:
              type: string
        reference:
          type: string
          description: 'ADM-<ISSUER>-<YEAR>-<seq>-<check>'
        step:
          $ref: '#/components/schemas/ActionStep'
        stepLabel:
          type: string
        subjectKind:
          type: string
          enum: [obligation, clarification]
        subjectReference:
          type: string
          description: "The obligation's cycle key (`biennial:2027`) or the clarification's CLR reference"
        whatToDo:
          type: string
          enum: [file-declaration, respond-to-clarification]
        issuedAt:
          type: string
          format: date-time
        actBy:
          type: [string, 'null']
          format: date-time
          description: By when to act; null for the disciplinary referral, which sets no deadline
        salaryStoppedFrom:
          type: [string, 'null']
          format: date
          description: The salary stoppage's effective date (payroll stops the salary from this day); null for other steps
        respondUrl:
          type: string
          format: uri
    DeclarantDecision:
      type: object
      required:
        [
          determinationId,
          declarationReference,
          commission,
          outcome,
          decidedAt,
          reference,
          letterAvailable,
        ]
      properties:
        determinationId:
          type: string
          format: uuid
        declarationReference:
          type: string
        commission:
          type: object
          required: [slug, name]
          properties:
            slug:
              type: string
            name:
              type: string
        outcome:
          $ref: '#/components/schemas/DeterminationOutcome'
        decidedAt:
          type: string
          format: date-time
        reference:
          type: string
        letterAvailable:
          type: boolean
    DeclarantNotice:
      type: object
      required:
        [
          actionId,
          commission,
          step,
          status,
          issuedAt,
          actBy,
          whatToDo,
          reference,
          letterDownloadUrl,
          response,
          salaryStoppedAt,
          salaryReinstatedAt,
        ]
      properties:
        actionId:
          type: string
          format: uuid
        commission:
          type: object
          required: [slug, name]
          properties:
            slug:
              type: string
            name:
              type: string
        step:
          $ref: '#/components/schemas/ActionStep'
        status:
          $ref: '#/components/schemas/ActionStatus'
        issuedAt:
          type: string
          format: date-time
        actBy:
          type: [string, 'null']
          format: date-time
        whatToDo:
          type: string
          enum: [file-declaration, respond-to-clarification]
        reference:
          type: string
        letterDownloadUrl:
          type: [string, 'null']
          format: uri
        response:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        salaryStoppedAt:
          type: [string, 'null']
          format: date-time
        salaryReinstatedAt:
          type: [string, 'null']
          format: date-time
