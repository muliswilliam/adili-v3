  /v1/review/cases/{caseId}/referrals:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [referrals]
      operationId: proposeReferral
      summary: Propose a referral to EACC from a case (assignee)
      description: >-
        The case's assignee (reviewer or supervisor), on grounds of undeclared or unexplained assets
        (Regs r.20(1)(c)), selecting at least one registry or comparison flag of the case and any
        issued clarifications of it. The issued steps of the clarifications' ladders are added to
        the sources. The declarant is not told.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferralInput'
      responses:
        '201':
          description: Proposed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Referral'
        '400':
          description: >-
            Body failed validation, or a flag is not a registry or comparison flag of the case, or a
            clarification is not an issued one of the case
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
