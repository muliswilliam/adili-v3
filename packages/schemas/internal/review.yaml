          type: [string, 'null']
          format: date-time
        responseLate:
          type: boolean
        resolvedAt:
          type: [string, 'null']
          format: date-time
        resolutionNote:
          type: [string, 'null']
        letter:
          oneOf:
            - type: object
              required: [documentId, verificationId, status]
              properties:
                documentId:
                  type: string
                  format: uuid
                verificationId:
                  type: string
                status:
                  type: string
                  enum: [pending, issued, revoked]
            - type: 'null'
