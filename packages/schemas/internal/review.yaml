    DeclarantNotice:
      type: object
      properties:
        actionId:
          type: string
          format: uuid
        ladderId:
          type: string
          format: uuid
          description: 'The ladder the step belongs to: the notices of one subject share it'
        subject:
          type: object
          properties:
            kind:
              type: string
              enum:
                - obligation
                - clarification
            reference:
              type: string
              description: The obligation's cycle key (`biennial:2027`) or the clarification's CLR reference
            dueAt:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
              description: When the clarification's response was due; null for an obligation (its due date is the declarations service's)
          required:
            - kind
            - reference
            - dueAt
          description: What the declarant failed to do, as the letter names it
        windowDays:
          anyOf:
            - type: integer
              minimum: 1
            - type: 'null'
          description: Days the step gives the declarant to act, from issue to `actBy`; null for a step without a deadline
        commission:
          type: object
          properties:
            slug:
              type: string
            name:
              type: string
          required:
            - slug
            - name
        step:
          $ref: '#/components/schemas/ActionStep'
        status:
          $ref: '#/components/schemas/ActionStatus'
        issuedAt:
          type: string
          format: date-time
        actBy:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        whatToDo:
          type: string
          enum:
            - file-declaration
            - respond-to-clarification
        reference:
          type: string
        letterDownloadUrl:
          anyOf:
            - type: string
              format: uri
            - type: 'null'
        response:
          anyOf:
            - type: object
              properties:
                text:
                  type: string
                attachments:
                  type: array
                  items:
                    type: object
                    properties:
                      uploadId:
                        type: string
                        format: uuid
                      fileName:
                        type: string
                    required:
                      - uploadId
                      - fileName
                submittedAt:
                  type: string
                  format: date-time
              required:
                - text
                - attachments
                - submittedAt
            - type: 'null'
        salaryStoppedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        salaryReinstatedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
      required:
        - actionId
        - ladderId
        - subject
        - windowDays
        - commission
        - step
        - status
        - issuedAt
        - actBy
        - whatToDo
        - reference
        - letterDownloadUrl
        - response
        - salaryStoppedAt
        - salaryReinstatedAt
