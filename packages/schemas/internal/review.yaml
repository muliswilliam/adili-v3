                    type:
                      type: string
                    description:
                      type: string
                    previousCents:
                      type: integer
                    currentCents:
                      type: integer
                    deltaCents:
                      type: integer
                    deltaPercent:
                      type: [number, 'null']
                    flaggedByDeclarant:
                      type: boolean
              onlyPrevious:
                type: array
                items:
                  type: object
                  additionalProperties: true
              onlyCurrent:
                type: array
                items:
                  type: object
                  additionalProperties: true
