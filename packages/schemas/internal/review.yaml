    Clarification:
      type: object
      required:
        - id
        - caseId
        - reference
        - status
        - items
        - issuedAt
        - dueAt
        - respondedAt
        - responseLate
        - resolvedAt
        - resolutionNote
        - letter
        - followUpOf
        - response
      properties:
        id:
          type: string
          format: uuid
