      description: Reviewers and supervisors of the case's Commission. Anyone else, including another Commission's staff, gets 404. Once per flag.
      operationId: markFlagReviewed
      parameters:
        - name: caseId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: flagId
