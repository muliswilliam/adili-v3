      description: "The case's assignee or a supervisor of its Commission; another reviewer gets 403 `not-the-assignee`, anyone else 404. Starts the registry check of the case's current version and records review.case.rechecked.v1; review.registry.checked.v1 follows once the check is stored. Flags it no longer raises are closed `superseded-by-recheck` (reviewed ones keep their note). Once per case every 10 minutes: 429 `recheck-cooldown` with `retryAfterSeconds`."
      operationId: recheckCaseRegistries
      parameters:
        - name: caseId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Re-check started
        '403':
          description: 'Problem type `not-the-assignee`: neither the assignee nor a supervisor'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: 'Problem type `case-closed`: the case is determined'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: 'Problem type `recheck-cooldown`: re-checked within the last 10 minutes'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/review/cases/{caseId}/copilot:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      tags:
        - copilot
      summary: AI-assisted summary and flag explanations for the case (reviewer, supervisor; audited read)
      operationId: getCaseCopilot
      x-draft: true
      responses:
        '200':
          description: Copilot view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopilotView'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/review/cases/{caseId}/copilot/refresh:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags:
        - copilot
      summary: Re-request the summary and explanations (assignee or supervisor)
      operationId: refreshCaseCopilot
      x-draft: true
      responses:
        '202':
          description: Requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopilotView'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already pending, or AI not enabled for this Commission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/review/cases/{caseId}/copilot/drafts:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags:
        - copilot
      summary: Draft clarification items from selected flags and items (assignee); nothing is issued
      operationId: draftClarificationWithAi
      x-draft: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopilotDraftInput'
      responses:
        '200':
          description: Draft ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopilotDraft'
        '202':
          description: Still drafting; poll the draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopilotDraft'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: AI not enabled for this Commission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/review/copilot/drafts/{draftId}:
    parameters:
      - name: draftId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - copilot
      summary: Poll a pending draft (assignee)
      operationId: getCopilotDraft
      x-draft: true
      responses:
        '200':
          description: Draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopilotDraft'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/review/copilot/outputs/{jobId}/feedback:
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags:
        - copilot
      summary: Rate an AI output as helpful or not (reviewer, supervisor); one rating per reviewer per output
      operationId: rateCopilotOutput
      x-draft: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopilotFeedbackInput'
      responses:
        '200':
          description: Recorded
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/commissions/{slug}/ai-status:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags:
        - copilot
      summary: Whether AI assistance is enabled for the Commission (commission-admin, supervisor)
      operationId: getCommissionAiStatus
      x-draft: true
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                required:
                  - enabled
                  - providerClass
                  - dataClasses
                properties:
                  enabled:
                    type: boolean
                  providerClass:
                    type:
                      - string
                      - 'null'
                    enum:
                      - external
                      - self-hosted
                      - null
                  dataClasses:
                    type: array
                    items:
                      type: string
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    DeclarationType:
      type: string
      enum:
        - initial
        - biennial
        - final
    CaseStatus:
      type: string
      enum:
        - unassigned
        - assigned
        - awaiting-clarification
        - clarified
        - ready-for-determination
        - sample-review
        - further-action
        - determined
    PriorityBand:
      type: string
      enum:
        - low
        - medium
        - high
    Severity:
      type: string
      enum:
        - info
        - low
        - medium
        - high
    RuleId:
      type: string
      enum:
        - completeness-residual
        - no-previous-version
        - value-change-25
        - acquisition-unflagged
        - disposal-unflagged
        - change-flag-mismatch
        - income-vs-asset-growth
        - nil-after-populated
        - late-filing
        - foreign-holdings
        - joint-share-inconsistent
        - registry-parcel-undeclared
        - declared-parcel-not-found
        - registry-vehicle-undeclared
        - declared-vehicle-not-found
        - registry-directorship-undeclared
        - declared-company-not-found
        - directorship-employer-supplier
        - kra-pin-missing
        - kra-non-compliant
        - kra-income-mismatch
    ClarificationStatus:
      type: string
      enum:
        - draft
        - issued
        - responded
        - resolved
        - overdue
        - withdrawn
    Requirement:
      type: string
      enum:
        - provide-omitted
        - explain-discrepancy
        - correct
      description: Act s.35(4)
    Assignee:
      type: object
      properties:
        subject:
          type: string
        name:
          type: string
      required:
        - subject
        - name
    CaseListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        declarantName:
          type: string
        personnelFileNumber:
          type: string
        type:
          $ref: '#/components/schemas/DeclarationType'
        cycleYear:
          type: integer
        receivedAt:
          type: string
          format: date-time
        windowEndsAt:
          type: string
          format: date-time
        late:
          type: boolean
        band:
          $ref: '#/components/schemas/PriorityBand'
        status:
          $ref: '#/components/schemas/CaseStatus'
        assignee:
          anyOf:
            - $ref: '#/components/schemas/Assignee'
            - type: 'null'
        openFlags:
          type: integer
        registryUnavailable:
          type: boolean
          description: A registry could not be checked for someone on the case at its latest registry check (the queue's icon)
        clarification:
          type: object
          properties:
            open:
              type: integer
              description: Clarifications the declarant still has to answer
            status:
              anyOf:
                - $ref: '#/components/schemas/ClarificationStatus'
                - type: 'null'
              description: The status of the latest clarification issued; null when none was
            dueAt:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
          required:
            - open
            - status
            - dueAt
        currentVersion:
          type: integer
      required:
        - id
        - reference
        - declarantName
        - personnelFileNumber
        - type
        - cycleYear
        - receivedAt
        - windowEndsAt
        - late
        - band
        - status
        - assignee
        - openFlags
        - registryUnavailable
        - clarification
        - currentVersion
    QueueSummary:
      type: object
      properties:
        byStatus:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: integer
        byBand:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: integer
        byStatusAndBand:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: object
            properties:
              low:
                type: integer
              medium:
                type: integer
              high:
                type: integer
            required:
              - low
              - medium
              - high
          description: Every status with its cases per band (the queue's tiles break their counts down)
        mine:
          type: object
          properties:
            low:
              type: integer
            medium:
              type: integer
            high:
              type: integer
          required:
            - low
            - medium
            - high
          description: Cases the caller holds that are not determined, per band
        overdueClarifications:
          type: integer
      required:
        - byStatus
        - byBand
        - byStatusAndBand
        - mine
        - overdueClarifications
    Flag:
      type: object
      properties:
        id:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        ruleId:
          $ref: '#/components/schemas/RuleId'
        severity:
          $ref: '#/components/schemas/Severity'
        title:
          type: string
        indicator:
          type: string
          description: Plain-language indicator text; never a finding
        evidence:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            anyOf:
              - type: string
              - type: number
              - type: boolean
              - type: 'null'
              - type: array
                items:
                  type: string
          description: Clear facts only (percentages, counts, dates, references); no amounts or descriptions
        itemRefs:
          type: array
          items:
            type: object
            properties:
              personKey:
                type: string
              itemId:
                anyOf:
                  - type: string
                    format: uuid
                  - type: 'null'
                description: The item concerned, or null when the flag is about a whole category or statement
              sectionKey:
                type:
                  - string
                  - 'null'
            required:
              - personKey
              - itemId
              - sectionKey
        closedReason:
          anyOf:
            - type: string
              enum:
                - superseded-by-recheck
            - type: 'null'
          description: 'Why the flag no longer counts toward the score and the open flags: a registry re-check no longer raised it. A reviewed flag keeps its note. Null while it counts.'
        reviewed:
          anyOf:
            - type: object
              properties:
                at:
                  type: string
                  format: date-time
                by:
                  $ref: '#/components/schemas/Assignee'
                note:
                  type: string
              required:
                - at
                - by
                - note
            - type: 'null'
        recomputed:
          type: boolean
      required:
        - id
        - versionId
        - ruleId
        - severity
        - title
        - indicator
        - evidence
        - itemRefs
        - closedReason
        - reviewed
        - recomputed
    Note:
      type: object
      properties:
        id:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/Assignee'
        text:
          type: string
        at:
          type: string
          format: date-time
      required:
        - id
        - author
        - text
        - at
    TimelineEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        actor:
          anyOf:
            - $ref: '#/components/schemas/Assignee'
            - type: 'null'
        at:
          type: string
          format: date-time
        summary:
          type: string
        ref:
          type:
            - string
            - 'null'
      required:
        - id
        - kind
        - actor
        - at
        - summary
        - ref
    CaseDetail:
      type: object
      properties:
        case:
          $ref: '#/components/schemas/CaseListItem'
        flags:
          type: array
          items:
            $ref: '#/components/schemas/Flag'
        clarifications:
          type: array
          items:
            $ref: '#/components/schemas/Clarification'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/Note'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEntry'
        document:
          anyOf:
            - type: object
              propertyNames:
                type: string
              additionalProperties: {}
            - type: 'null'
          description: The current version's declaration.v1 document, pulled from the declarations service (null when unavailable)
        versions:
          type: array
          items:
            type: object
            properties:
              versionId:
                type: string
                format: uuid
              version:
                type: integer
              submittedAt:
                type: string
                format: date-time
              late:
                type: boolean
              amendment:
                type: boolean
                description: The version amended an earlier one of the same declaration
            required:
              - versionId
              - version
              - submittedAt
              - late
              - amendment
          description: Every version the case has processed, from the review service's own records; only the current one's document is pulled
        reviewerHistory:
          type: array
          items:
            $ref: '#/components/schemas/Assignee'
        determinations:
          type: array
          items:
            $ref: '#/components/schemas/Determination'
          description: Every determination of the case, oldest first; the current one is last
        registry:
          $ref: '#/components/schemas/RegistrySummary'
      required:
        - case
        - flags
        - clarifications
        - notes
        - timeline
        - document
        - versions
        - reviewerHistory
        - determinations
        - registry
    VersionComparison:
      type: object
      properties:
        previousVersion:
          type: integer
        currentVersion:
          type: integer
        statements:
          type: array
          items:
            type: object
            properties:
              personKey:
                type: string
              personName:
                type: string
              matched:
                type: array
                items:
                  type: object
                  properties:
                    category:
                      type: string
                      enum:
                        - income
                        - assets
                        - liabilities
                    type:
                      type: string
                    description:
                      type: string
                    previousCents:
                      type: integer
                    currentCents:
                      type: integer
                    deltaCents:
                      type: integer
                    deltaPercent:
                      description: Whole percent of the previous value, signed; null when the previous value was nothing
                      type:
                        - integer
                        - 'null'
                    flaggedByDeclarant:
                      type: boolean
                      description: Whether the declarant marked the current item as changed
                  required:
                    - category
                    - type
                    - description
                    - previousCents
                    - currentCents
                    - deltaCents
                    - deltaPercent
                    - flaggedByDeclarant
              onlyPrevious:
                type: array
                items:
                  type: object
                  properties:
                    itemId:
                      type: string
                      format: uuid
                    category:
                      type: string
                      enum:
                        - income
                        - assets
                        - liabilities
                    type:
                      type: string
                    description:
                      type: string
                    valueCents:
                      type: integer
                    flaggedByDeclarant:
                      type: boolean
                  required:
                    - itemId
                    - category
                    - type
                    - description
                    - valueCents
                    - flaggedByDeclarant
              onlyCurrent:
                type: array
                items:
                  type: object
                  properties:
                    itemId:
                      type: string
                      format: uuid
                    category:
                      type: string
                      enum:
                        - income
                        - assets
                        - liabilities
                    type:
                      type: string
                    description:
                      type: string
                    valueCents:
                      type: integer
                    flaggedByDeclarant:
                      type: boolean
                  required:
                    - itemId
                    - category
                    - type
                    - description
                    - valueCents
                    - flaggedByDeclarant
            required:
              - personKey
              - personName
              - matched
              - onlyPrevious
              - onlyCurrent
      required:
        - previousVersion
        - currentVersion
        - statements
