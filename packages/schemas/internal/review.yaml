    ReferralManifestKind:
      type: string
      enum:
        - declaration-version
        - declaration-attachment
        - flag
        - clarification
        - clarification-attachment
        - obligation
        - letter
    ReferralManifestItem:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/ReferralManifestKind'
        reference:
          type: string
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: "SHA-256 of the item as the package includes it: canonical JSON (sorted keys) for versions' documents, flags, clarifications and obligations; the file's own hash for uploads and letters"
        documentId:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          description: The upload (attachments) or issued document (letters); null for records
      required:
        - kind
        - reference
        - sha256
        - documentId
    ReferralIcmsPayload:
      type: object
      properties:
        reference:
          type: string
          description: RFL-<ISSUER>-<YEAR>-<seq>-<check>
        grounds:
          $ref: '#/components/schemas/ReferralGrounds'
        groundsLabel:
          type: string
        commission:
          type: object
          properties:
            name:
              type: string
            issuerCode:
              type: string
          required:
            - name
            - issuerCode
        declarant:
          type: object
          properties:
            name:
              type: string
            nationalId:
              type: string
              description: From the directory's roster record of the referral's case
          required:
            - name
            - nationalId
        narrative:
          type: string
      required:
        - reference
        - grounds
        - groundsLabel
        - commission
        - declarant
        - narrative
      description: "What ICMS needs of a sent referral (spec 09 BE-5): its reference, grounds, Commission and narrative, and the declarant's name and national ID. Personal data: the caller passes it to ICMS and keeps it nowhere."
    ReferralPackagePayload:
      type: object
      properties:
        declarantPersonId:
          type: string
          format: uuid
          description: 'The officer referred, who must never download the package: the documents service keeps it from them (an EACC officer is referred by EACC as their Commission). Not printed'
        reference:
          type: string
        grounds:
          $ref: '#/components/schemas/ReferralGrounds'
        groundsLabel:
          type: string
        cycleYear:
          type: integer
        commission:
          type: object
          properties:
            name:
              type: string
            issuerCode:
              type: string
          required:
            - name
            - issuerCode
        declarant:
          type: object
          properties:
            name:
              type: string
            personnelFileNumber:
              type: string
          required:
            - name
            - personnelFileNumber
        narrative:
          type: string
        proposedBy:
          type: string
        proposedAt:
          type: string
          format: date-time
        approvedBy:
          type: string
        approvedAt:
          type: string
          format: date-time
        manifest:
          type: array
          items:
            $ref: '#/components/schemas/ReferralManifestItem'
        versions:
          type: array
          items:
            type: object
            properties:
              reference:
                type: string
              version:
                type: integer
              type:
                $ref: '#/components/schemas/DeclarationType'
              statementDate:
                type: string
                format: date
              submittedAt:
                type: string
                format: date-time
              late:
                type: boolean
              document:
                type: object
                propertyNames:
                  type: string
                additionalProperties: {}
                description: The declaration.v1 document as submitted
            required:
              - reference
              - version
              - type
              - statementDate
              - submittedAt
              - late
              - document
        flags:
          type: array
          items:
            type: object
            propertyNames:
              type: string
            additionalProperties: {}
        clarifications:
          type: array
          items:
            type: object
            propertyNames:
              type: string
            additionalProperties: {}
        obligations:
          type: array
          items:
            type: object
            properties:
              cycleKey:
                type: string
              type:
                type: string
              status:
                type: string
              dueDate:
                type: string
                format: date
              filedAt:
                anyOf:
                  - type: string
                    format: date-time
                  - type: 'null'
            required:
              - cycleKey
              - type
              - status
              - dueDate
              - filedAt
        letters:
          type: array
          items:
            type: object
            properties:
              reference:
                type: string
              documentId:
                type: string
                format: uuid
            required:
              - reference
              - documentId
      required:
        - declarantPersonId
        - reference
        - grounds
        - groundsLabel
        - cycleYear
        - commission
        - declarant
        - narrative
        - proposedBy
        - proposedAt
        - approvedBy
        - approvedAt
        - manifest
        - versions
        - flags
        - clarifications
        - obligations
        - letters
