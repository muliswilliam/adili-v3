# Generated by `pnpm --filter @adili/review contracts` from the review service: do not edit.
openapi: 3.1.0
info:
  title: review API
  description: Review cases, risk flags, clarifications, determinations, administrative actions and referrals.
  version: '1'
servers:
  - url: /
    description: The service that serves this document
paths:
  /v1/commissions/{slug}/review/queue:
    get:
      tags:
        - queue
      summary: Cases of the Commission ordered by score then age
      description: "Reviewers and supervisors of the Commission. Anyone else, including another Commission's staff, gets 404. Filters only: search text is personal data, so it is never in a URL; send it to `searchReviewQueue`. A `search` parameter is refused with 400."
      operationId: listReviewQueue
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
        - name: status
          required: false
          in: query
          schema:
            type: string
            enum:
              - unassigned
              - assigned
              - awaiting-clarification
              - clarified
              - ready-for-determination
              - sample-review
              - further-action
              - determined
        - name: band
          required: false
          in: query
          schema:
            type: string
            enum:
              - low
              - medium
              - high
        - name: type
          required: false
          in: query
          schema:
            type: string
            enum:
              - initial
              - biennial
              - final
        - name: cycle
          required: false
          in: query
          description: The statement date's year
          schema:
            type: integer
            minimum: 2000
            maximum: 2999
        - name: assignee
          required: false
          in: query
          description: '`mine`, `unassigned`, `any` (the default), or a subject id'
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: cursor
          required: false
          in: query
          description: '`nextCursor` of the previous page; omit for the first page'
          schema:
            type: string
            maxLength: 500
        - name: late
          required: false
          in: query
          description: Only cases filed late, or only those filed on time
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: openClarification
          required: false
          in: query
          description: Only cases with an open clarification, or only those without
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: registryUnavailable
          required: false
          in: query
          description: Only cases where a registry could not be checked at the latest registry check, or only the others
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: limit
          required: false
          in: query
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - nextCursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CaseListItem'
                  nextCursor:
                    type:
                      - string
                      - 'null'
        '400':
          description: Query failed validation (a `search` included), or the cursor is unknown
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/review/queue/search:
    post:
      tags:
        - queue
      summary: Cases of the Commission matching a search, ordered by score then age
      description: As `listReviewQueue`, with the filters and the search text in the body, so the text (a name, say) stays out of URLs and so out of access logs and traces. Reads nothing but the queue. Reviewers and supervisors of the Commission; anyone else gets 404.
      operationId: searchReviewQueue
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - unassigned
                    - assigned
                    - awaiting-clarification
                    - clarified
                    - ready-for-determination
                    - sample-review
                    - further-action
                    - determined
                band:
                  type: string
                  enum:
                    - low
                    - medium
                    - high
                type:
                  type: string
                  enum:
                    - initial
                    - biennial
                    - final
                cycle:
                  description: The statement date's year
                  type: integer
                  minimum: 2000
                  maximum: 2999
                assignee:
                  description: '`mine`, `unassigned`, `any` (the default), or a subject id'
                  type: string
                  minLength: 1
                  maxLength: 200
                cursor:
                  description: '`nextCursor` of the previous page; omit for the first page'
                  type: string
                  maxLength: 500
                late:
                  description: Only cases filed late, or only those filed on time
                  type: boolean
                openClarification:
                  description: Only cases with an open clarification, or only those without
                  type: boolean
                registryUnavailable:
                  description: Only cases where a registry could not be checked at the latest registry check, or only the others
                  type: boolean
                search:
                  description: A reference or personnel file number or their beginning, or part of a name (case-insensitive)
                  type: string
                  maxLength: 100
                limit:
                  default: 50
                  type: integer
                  minimum: 1
                  maximum: 100
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - nextCursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CaseListItem'
                  nextCursor:
                    type:
                      - string
                      - 'null'
        '400':
          description: Body failed validation, or the cursor is unknown
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/review/queue/summary:
    get:
      tags:
        - queue
      summary: Counts by status and priority band
      operationId: getReviewQueueSummary
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueSummary'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/commissions/{slug}/review/queue/reviewers:
    get:
      tags:
        - queue
      summary: Reviewers and supervisors a case can be given to, with the cases they hold
      description: Supervisors of the Commission (a reviewer gets 403 `supervisor-required`; anyone else 404). The Commission's enabled reviewer and supervisor accounts as the directory has them, by name, each with the cases of the Commission they hold that are not determined. For the reassign dialog and the queue's assignee filter.
      operationId: listCommissionReviewers
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,19}$
      responses:
        '200':
          description: Reviewers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewerList'
        '403':
          description: Problem type `supervisor-required`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: Directory unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/review/cases/{caseId}/compare:
    get:
      tags:
        - cases
      summary: Item matching and deltas between the current and previous submitted version
      description: Reviewers and supervisors of the case's Commission; anyone else gets 404. Both versions are read from declarations for every call, audited there as the caller's reads for the case.
      operationId: compareCaseVersions
      parameters:
        - name: caseId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Comparison
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionComparison'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: No previous version to compare with
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: Declarations service unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/review/cases/{caseId}:
    get:
      tags:
        - cases
      summary: Case with flags, clarifications, notes, timeline and the declaration pulled on demand
      description: Reviewers and supervisors of the case's Commission. Anyone else, including another Commission's staff, gets 404. Every call reads the declaration from the declarations service, which audits it with the viewer and the case, and records review.case.viewed.v1; its audit.read.v1 names the declarant (the person the data is about) and the case as its legal basis (`review-case`).
      operationId: getReviewCase
      parameters:
        - name: caseId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Case detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetail'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: 'Declarations unavailable: the problem carries the case detail with a null document'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: review.case.viewed
        resource: review-case
  /v1/review/cases/{caseId}/attachments/{uploadId}/download:
    get:
      tags:
        - cases
      summary: Short-lived download link for an attachment of the declaration under review (audited)
      description: Reviewers and supervisors of the case's Commission. Anyone else, including another Commission's staff, gets 404. The upload must be an attachment of the version under review.
      operationId: getCaseAttachmentDownload
      parameters:
        - name: caseId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: uploadId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Link
          content:
            application/json:
              schema:
                type: object
                required:
                  - downloadUrl
                  - expiresAt
                properties:
                  downloadUrl:
                    type: string
                    format: uri
                  expiresAt:
                    type: string
                    format: date-time
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: Declarations or documents unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: review.case.attachment.downloaded
        resource: review-case
  /v1/review/cases/{caseId}/claim:
    post:
      tags:
        - cases
      summary: Assign an unassigned case to the caller
      description: Reviewers and supervisors of the case's Commission. Anyone else, including another Commission's staff, gets 404.
      operationId: claimCase
      parameters:
        - name: caseId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseListItem'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: 'Problem type `case-already-assigned`: another officer holds it'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/review/cases/{caseId}/release:
    post:
      tags:
        - cases
      summary: Return the caller's case to the queue
      description: Reviewers and supervisors of the case's Commission. Anyone else, including another Commission's staff, gets 404. Only the officer holding the case releases it; others get 403.
      operationId: releaseCase
      parameters:
        - name: caseId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Unassigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseListItem'
        '403':
          description: The caller does not hold the case
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/review/cases/{caseId}/assignment:
    put:
      tags:
        - cases
      summary: Supervisor reassigns or unassigns a case
      description: Reviewers and supervisors of the case's Commission. Anyone else, including another Commission's staff, gets 404. Supervisors only; a reviewer gets 403.
      operationId: reassignCase
      parameters:
        - name: caseId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignee:
                  anyOf:
                    - type: string
                      minLength: 1
                      maxLength: 200
                    - type: 'null'
                  description: Subject of a reviewer or supervisor of the Commission; null unassigns
              required:
                - assignee
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseListItem'
        '400':
          description: Body failed validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The caller is not a supervisor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/review/cases/{caseId}/notes:
    post:
      tags:
        - cases
      summary: Add an internal note
      description: Reviewers and supervisors of the case's Commission. Anyone else, including another Commission's staff, gets 404. The declarant never sees notes.
      operationId: addCaseNote
      parameters:
        - name: caseId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 2000
              required:
                - text
      responses:
        '201':
          description: Note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          description: Body failed validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/review/cases/{caseId}/flags/{flagId}/reviewed:
    post:
      tags:
        - cases
      summary: Record that a flag was considered, with a note
      description: Reviewers and supervisors of the case's Commission. Anyone else, including another Commission's staff, gets 404. Once per flag.
      operationId: markFlagReviewed
      parameters:
        - name: caseId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: flagId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  minLength: 1
                  maxLength: 1000
              required:
                - note
      responses:
        '200':
          description: Flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flag'
        '400':
          description: Body failed validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Problem type `flag-already-reviewed`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/review/cases/{caseId}/clarifications:
    post:
      tags:
        - clarifications
      summary: Create a clarification draft (assignee only)
      operationId: createClarificationDraft
      parameters:
        - name: caseId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClarificationInput'
      responses:
        '201':
          description: Draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clarification'
        '400':
          description: 'Body failed validation, or problem type `ai-draft-not-on-case`: an `aiJobId` or `openingAiJobId` the clarification does not already name that names no ready Draft with AI the caller asked for on the case (one whose 24 hours are over still counts: only its text is purged)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Caller is not the assignee of the case
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/review/clarifications/{clarificationId}:
    get:
      tags:
        - clarifications
      summary: Clarification with items, letter and response
      operationId: getClarification
      parameters:
        - name: clarificationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Clarification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clarification'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    put:
      tags:
        - clarifications
      summary: Update a draft's items and opening paragraph
      operationId: updateClarificationDraft
      parameters:
        - name: clarificationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClarificationInput'
      responses:
        '200':
          description: Draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clarification'
        '400':
          description: 'Body failed validation, or problem type `ai-draft-not-on-case`: an `aiJobId` or `openingAiJobId` the clarification does not already name that names no ready Draft with AI the caller asked for on the case (one whose 24 hours are over still counts: only its text is purged)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Caller is not the assignee of the case
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or not visible to the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Problem code `not-a-draft`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/review/clarifications/{clarificationId}/letter/download:
    get:
      tags:
        - clarifications
      summary: Short-lived download link for an issued clarification's letter (audited)
      description: The Commission's reviewers and supervisors, as for the clarification. The documents service hands the link out for the Commission (internalGetDocumentDownload); the read is audited naming the declarant. 404 while the letter is still being produced.
      operationId: getClarificationLetterDownload
      parameters:
        - name: clarificationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Link valid for five minutes
          content:
            application/json:
              schema:
                type: object
                required:
                  - downloadUrl
                  - expiresAt
                properties:
                  downloadUrl:
                    type: string
                    format: uri
                  expiresAt:
                    type: string
                    format: date-time
        '404':
          description: Not found, or not visible to the caller, or its letter is not issued yet
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: Documents unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-audited-read:
        action: review.clarification.letter.downloaded
        resource: clarification
  /v1/review/clarifications/{clarificationId}/issue:
    post:
      tags:
        - clarifications
      summary: Allocate the CLR reference, issue the letter, notify the declarant, start the 30-day clock
      operationId: issueClarification
      parameters:
        - name: clarificationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
