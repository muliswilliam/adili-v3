# Generated by `pnpm --filter @adili/notifications contracts`: do not edit.
# Implemented operations come from the notifications service; operations marked `x-draft` come
# from packages/schemas/drafts/notifications.yaml until they are implemented.
openapi: 3.1.0
info:
  title: notifications API
  description: Email, SMS and in-app notifications, reminders and signed outbound webhooks.
  version: '1'
servers:
  - url: /
    description: The service that serves this document
paths:
  /internal/v1/messages:
    post:
      tags:
        - internal
      summary: Render a template and send it by email or SMS
      description: 'Synchronous with a 5-second budget. A provider failure is not an error: the message is created with status `failed` and the reason in `error`.'
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessage'
      responses:
        '201':
          description: Message handed to the provider (or failed, see status)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Unknown template, or a recipient or params the template rejects
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'Requires one of the scopes: messages'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - bearer: []
  /internal/v1/messages/{id}:
    get:
      tags:
        - internal
      summary: Delivery status of a message
      description: Only the service that sent the message sees it.
      operationId: getMessage
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: The id is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'Requires one of the scopes: messages'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No message with this id, or another caller sent it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - bearer: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    Channel:
      type: string
      enum:
        - email
        - sms
    TemplateId:
      type: string
      enum:
        - onboarding-otp-email
        - onboarding-otp-sms
        - login-otp-sms
        - login-otp-email
      description: Registered templates; each declares its params
    Recipient:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              const: address
            to:
              type: string
              minLength: 1
              maxLength: 254
              description: Email address or E.164 phone number, matching the channel
          required:
            - kind
            - to
        - type: object
          properties:
            kind:
              type: string
              const: person
            personId:
              type: string
              format: uuid
              description: 'Contacts resolved through the directory. Not supported yet: rejected with 400 until the directory serves contacts'
          required:
            - kind
            - personId
    SendMessage:
      type: object
      properties:
        channel:
          $ref: '#/components/schemas/Channel'
        recipient:
          $ref: '#/components/schemas/Recipient'
        template:
          $ref: '#/components/schemas/TemplateId'
        params:
          type: object
          propertyNames:
            type: string
          additionalProperties: {}
          description: Validated against the template's parameter schema
        locale:
          default: en
          type: string
          enum:
            - en
            - sw
        tenant:
          description: Tenant key for audit and per-tenant branding; optional for platform messages
          type: string
          minLength: 1
          maxLength: 64
      required:
        - channel
        - recipient
        - template
        - params
    MessageStatus:
      type: string
      enum:
        - sent
        - failed
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        channel:
          $ref: '#/components/schemas/Channel'
        template:
          $ref: '#/components/schemas/TemplateId'
        status:
          $ref: '#/components/schemas/MessageStatus'
        error:
          description: 'Reason when failed: timeout, rejected-recipient or provider-error'
          type:
            - string
            - 'null'
        providerMessageId:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - channel
        - template
        - status
        - error
        - providerMessageId
        - createdAt
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
            - rate-limit-exceeded
            - no-match
            - already-onboarded
            - no-roster
            - otp-invalid
            - otp-expired
            - resend-cooldown
            - otp-send-failed
            - wrong-step
            - session-expired
            - iprs-unavailable
            - identity-unavailable
            - email-in-use
            - identity-mismatch
            - already-registered
          description: Machine-readable cause, from the platform registry; clients map it to copy and never show `title` or `detail`
        detail:
          type: string
        instance:
          type: string
        errors:
          description: Field-level errors; `path` is the dotted request field
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - path
              - message
      required:
        - type
        - title
        - status
    PlannedTemplateId:
      type: string
      description: Templates later specs register. Not accepted yet; each moves into `TemplateId` when implemented.
      enum:
        - obligation-reminder-sms
        - obligation-reminder-email
        - acknowledgement-email
        - acknowledgement-sms
        - clarification-issued-email
        - clarification-issued-sms
        - clarification-reminder-email
        - clarification-reminder-sms
        - decision-email
        - decision-sms
        - notice-email
        - notice-sms
        - salary-stopped-email
        - salary-stopped-sms
        - salary-reinstated-email
        - salary-reinstated-sms
        - form-m-draft-ready-email
        - form-m-reminder-email
        - form-m-chase-email
        - form-m-receipt-email
        - access-request-acknowledged-email
        - access-request-notified-email
        - access-request-notified-sms
        - access-decision-applicant-email
        - access-decision-declarant-email
        - access-package-ready-email
        - access-officer-reminder-email
        - lea-grant-notice-email
        - lea-decision-email
        - certified-copy-ready-email
security:
  - bearer: []
