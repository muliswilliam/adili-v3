# Generated by `pnpm --filter @adili/notifications contracts` from the notifications service: do not edit.
openapi: 3.1.0
info:
  title: notifications API
  description: Email, SMS and in-app notifications, reminders and signed outbound webhooks.
  version: '1'
servers:
  - url: /
    description: The service that serves this document
paths:
  /internal/v1/messages:
    post:
      tags:
        - internal
      summary: Render a template and send it by email or SMS
      description: Synchronous with a 5-second budget. A provider failure is status failed.
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessage'
      responses:
        '201':
          description: Message handed to the provider (or failed, see status)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Unknown template, invalid recipient or params
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Caller lacks the messages scope
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - bearer: []
  /internal/v1/messages/{id}:
    get:
      tags:
        - internal
      summary: Delivery status of a message
      operationId: getMessage
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '403':
          description: Caller lacks the messages scope
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found, or sent by another caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - bearer: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    Channel:
      type: string
      enum:
        - email
        - sms
    TemplateId:
      type: string
      enum:
        - onboarding-otp-email
        - onboarding-otp-sms
        - login-otp-sms
        - login-otp-email
        - obligation-reminder-sms
        - obligation-reminder-email
      description: Registered templates; each declares its channel and params
    Recipient:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              const: address
            to:
              type: string
              minLength: 1
              maxLength: 254
              description: Email address or E.164 phone number, matching the channel
          required:
            - kind
            - to
        - type: object
          properties:
            kind:
              type: string
              const: person
            personId:
              type: string
              format: uuid
              description: The person's verified contacts are resolved through the directory (cached for 10 minutes) and the one for the channel is used. None for the channel is status failed with error no-contact; a directory that cannot answer is failed with error contact-lookup-failed (worth retrying).
          required:
            - kind
            - personId
    SendMessage:
      type: object
      properties:
        channel:
          $ref: '#/components/schemas/Channel'
        recipient:
          $ref: '#/components/schemas/Recipient'
        template:
          $ref: '#/components/schemas/TemplateId'
        params:
          type: object
          propertyNames:
            type: string
          additionalProperties: {}
          description: Validated against the template's parameter schema. `obligation-reminder-sms` and `obligation-reminder-email` take exactly `type` (initial, biennial, final), `commissionName` (1 to 120 characters), `statementDate` and `dueDate` (`YYYY-MM-DD`, due on or after statement), `daysLeft` (integer 0 to 366) and `portalUrl` (http or https URL).
        locale:
          default: en
          type: string
          enum:
            - en
            - sw
        tenant:
          description: Tenant key for audit and per-tenant branding; optional for platform messages
          type: string
          minLength: 1
          maxLength: 64
      required:
        - channel
        - recipient
        - template
        - params
    MessageStatus:
      type: string
      enum:
        - sent
        - failed
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        channel:
          $ref: '#/components/schemas/Channel'
        template:
          type: string
          description: The `TemplateId` it was rendered from, as recorded when sent
        status:
          $ref: '#/components/schemas/MessageStatus'
        error:
          description: 'Reason when failed: timeout, rejected-recipient, provider-error, no-contact or contact-lookup-failed'
          type:
            - string
            - 'null'
        providerMessageId:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - channel
        - template
        - status
        - error
        - providerMessageId
        - createdAt
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
            - rate-limit-exceeded
            - no-match
            - already-onboarded
            - no-roster
            - otp-invalid
            - otp-expired
            - resend-cooldown
            - otp-send-failed
            - wrong-step
            - session-expired
            - iprs-unavailable
            - identity-unavailable
            - email-in-use
            - identity-mismatch
            - already-registered
          description: Machine-readable cause, from the platform registry; clients map it to copy and never show `title` or `detail`
        detail:
          type: string
        instance:
          type: string
        errors:
          description: Field-level errors; `path` is the dotted request field
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - path
              - message
      required:
        - type
        - title
        - status
security:
  - bearer: []
