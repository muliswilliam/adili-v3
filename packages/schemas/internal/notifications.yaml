# Generated by `pnpm --filter @adili/notifications contracts` from the notifications service: do not edit.
openapi: 3.1.0
info:
  title: notifications API
  description: Email, SMS and in-app notifications, reminders and signed outbound webhooks.
  version: '1'
servers:
  - url: /
    description: The service that serves this document
paths:
  /internal/v1/messages:
    post:
      tags:
        - internal
      summary: Render a template and send it by email or SMS
      description: 'Synchronous with a 5-second budget. A provider failure is not an error: the message is created with status `failed` and the reason in `error`. With an `Idempotency-Key` (optional; keys are per caller, kept 24 hours) a retry gets the first answer back instead of a second message, unless that answer failed before anything could reach the recipient (`contact-lookup-failed`, `provider-error`): then the key is freed and the retry sends again. A `timeout` is final: the provider may have delivered it, so it is replayed rather than risk a second message.'
      operationId: sendMessage
      parameters:
        - name: Idempotency-Key
          in: header
          description: Optional. Client-generated UUID, unique per logical request; reuse on retry and the stored answer is replayed instead of acting twice
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessage'
      responses:
        '201':
          description: Message handed to the provider (or failed, see status)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Unknown template, or a recipient or params the template rejects
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Caller lacks the messages scope
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - bearer: []
  /internal/v1/messages/{id}:
    get:
      tags:
        - internal
      summary: Delivery status of a message
      description: Only the service that sent the message sees it.
      operationId: getMessage
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: The id is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Caller lacks the messages scope
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No message with this id, or another caller sent it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - bearer: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    Channel:
      type: string
      enum:
        - email
        - sms
    TemplateId:
      type: string
      enum:
        - onboarding-otp-email
        - onboarding-otp-sms
        - login-otp-sms
        - login-otp-email
        - onboarding-invitation-email
        - onboarding-invitation-sms
        - obligation-reminder-sms
        - obligation-reminder-email
        - acknowledgement-email
        - acknowledgement-sms
        - clarification-issued-email
        - clarification-issued-sms
        - clarification-reminder-email
        - clarification-reminder-sms
        - decision-email
        - decision-sms
        - notice-email
        - notice-sms
        - salary-stopped-email
        - salary-stopped-sms
        - salary-reinstated-email
        - salary-reinstated-sms
        - access-acknowledgement-email
        - access-acknowledgement-sms
        - access-request-notified-email
        - access-request-notified-sms
        - access-decision-applicant-email
        - access-decision-applicant-sms
        - access-decision-declarant-email
        - access-decision-declarant-sms
        - access-package-ready-email
        - access-package-ready-sms
        - access-nil-letter-ready-email
        - access-nil-letter-ready-sms
        - access-officer-reminder-email
        - access-officer-reminder-sms
        - lea-grant-notice-email
        - lea-grant-notice-sms
        - lea-decision-email
        - lea-decision-sms
        - lea-withdrawn-email
        - lea-withdrawn-sms
        - certified-copy-ready-email
        - certified-copy-ready-sms
        - form-m-draft-ready-email
        - form-m-reminder-email
        - form-m-receipt-email
        - form-m-chase-email
      description: Registered templates; each declares its channel and params
    Recipient:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              const: address
            to:
              type: string
              minLength: 1
              maxLength: 254
              description: Email address or E.164 phone number, matching the channel
          required:
            - kind
            - to
        - type: object
          properties:
            kind:
              type: string
              const: person
            personId:
              type: string
              format: uuid
              description: The person's verified contacts are resolved through the directory at the message's `tenant` (required for a person; cached for 10 minutes) and the one for the channel is used. None for the channel, or a person not onboarded at that tenant, is status failed with error no-contact; a directory that cannot answer is failed with error contact-lookup-failed (worth retrying).
          required:
            - kind
            - personId
    SendMessage:
      type: object
      properties:
        channel:
          $ref: '#/components/schemas/Channel'
        recipient:
          $ref: '#/components/schemas/Recipient'
        template:
          $ref: '#/components/schemas/TemplateId'
        params:
          type: object
          propertyNames:
            type: string
          additionalProperties: {}
          description: "Validated against the template's parameter schema. `obligation-reminder-sms` and `obligation-reminder-email` take exactly `type` (initial, biennial, final), `commissionName` (1 to 120 characters), `statementDate` and `dueDate` (`YYYY-MM-DD`, due on or after statement), `daysLeft` (integer 0 to 366) and `portalUrl` (an https URL; http is accepted in development and test only, never in production). `onboarding-invitation-email` and `onboarding-invitation-sms` (a roster officer with no account, invited to set it up) take exactly `commissionName` and `getStartedUrl` (http or https URL), and name no request. `acknowledgement-email` and `acknowledgement-sms` take exactly `reference` (a DCI, DCB or DCF declaration reference with a valid check character), `type` (the one the reference names), `version` (integer 1 to 99; above 1 the copy names the version, an amendment), `commissionName`, `statementDate`, `verificationCode` (`ADL-` and hyphenated groups of 0-9 and A-Z, at most 40 characters) and `portalUrl`; the email links to the portal and attaches nothing, the SMS carries only the reference and verification code. `clarification-issued-email` and `clarification-issued-sms` take exactly `reference` (a CLR clarification reference with a valid check character), `commissionName`, `dueDate` (`YYYY-MM-DD`, the last day to respond) and `portalUrl` (the page where the declarant reads the letter and responds); `clarification-reminder-email` and `clarification-reminder-sms` take the same and `daysLeft` (integer 0 to 366). The emails link to the portal and attach no letter. The spec 08 templates, each an `-email` and an `-sms`, take a `commission` (the Commission's name, 1 to 120 characters) and a `portalUrl` (the decision or notice page), and attach no letter: `decision` `reference` (a CMP determination reference with a valid check character) and `outcome` (Compliant, Compliant: no issues identified, Non-compliant, Further action); `notice` `reference` (ADM), `step` (Notice to comply, Warning) and `actBy` (`YYYY-MM-DD`); `salary-stopped` `reference` (ADM), `stoppedFrom` and `actBy` (`YYYY-MM-DD`); `salary-reinstated` `reference` (the stoppage's ADM) and `reinstatedOn` (`YYYY-MM-DD`). The access templates (spec 10), each an `-email` and an `-sms`, take a `signInUrl` (http or https URL: the portal, or the console for officers) and a `commissionName`, and name the request only: `access-acknowledgement` (to the applicant, Form K received) `reference` (ARQ), `decideBy` (`YYYY-MM-DD`) and `identityStatus` (verified, pending-verification: a passport applicant's particulars are still to be checked); `access-request-notified` (to the declarant) `reference` (ARQ) and `respondBy` (`YYYY-MM-DD`); `access-decision-applicant` `reference` (ARQ) and `outcome` (granted, partially-granted, denied, cannot-identify); `access-decision-declarant` `reference` (ARQ) and `outcome` (granted, partially-granted, denied); `access-package-ready` `reference` (ARQ or LEA) and `downloadUntil` (`YYYY-MM-DD`); `access-nil-letter-ready` (instead of the package, when the Commission holds no declaration within the granted scope: the signed letter saying so is ready) the same; `access-officer-reminder` `reference` (ARQ or LEA), `task` (verify-applicant, identify-officer, record-notice, decide), `dueDate` (`YYYY-MM-DD`) and `daysLeft` (0 to 366); `lea-grant-notice` (to the declarant) `reference` (LEA), `agencyName` and `grantedOn` (`YYYY-MM-DD`); `lea-decision` `reference` (LEA) and `outcome` (granted, denied); `certified-copy-ready` `reference` (a declaration reference), `version` (1 to 99) and `verificationCode`. The Form M templates (spec 09) are emails to a Commission's staff at their address and take a `financialYear` (`2027/2028`): `form-m-draft-ready-email` and `dueDate` (`YYYY-MM-DD`, 31 July after the year); `form-m-reminder-email` and `dueDate` and `daysLeft` (0 to 366); `form-m-receipt-email` and `reference` (an RPT compliance report reference), `submittedOn` (`YYYY-MM-DD`) and `late` (yes, no); `form-m-chase-email` (EACC's weekly chase of a report not received) and `dueDate` and `round` (1 to 100). They attach nothing."
        locale:
          default: en
          type: string
          enum:
            - en
            - sw
        tenant:
          description: Tenant key for audit and per-tenant branding. Required for a person recipient (whose contacts are read at that tenant); optional for platform messages to an address
          type: string
          pattern: ^[a-z][a-z0-9]{1,19}$
      required:
        - channel
        - recipient
        - template
        - params
    MessageStatus:
      type: string
      enum:
        - sent
        - failed
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        channel:
          $ref: '#/components/schemas/Channel'
        template:
          type: string
          description: The `TemplateId` it was rendered from, as recorded when sent
        status:
          $ref: '#/components/schemas/MessageStatus'
        error:
          description: 'Reason when failed: timeout, rejected-recipient, provider-error, no-contact or contact-lookup-failed'
          type:
            - string
            - 'null'
        providerMessageId:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - channel
        - template
        - status
        - error
        - providerMessageId
        - createdAt
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
            - database-unavailable
            - rate-limit-exceeded
            - no-match
            - already-onboarded
            - no-roster
            - otp-invalid
            - otp-expired
            - resend-cooldown
            - otp-send-failed
            - wrong-step
            - session-expired
            - iprs-unavailable
            - identity-unavailable
            - email-in-use
            - identity-mismatch
            - step-up-required
            - incomplete
            - before-statement-date
            - amendment-window-closed
            - not-a-draft
            - not-submitted
            - obligation-cancelled
            - acknowledgement-issued
            - acknowledgement-in-progress
            - no-applicant-record
            - request-decided
            - request-closed
            - officer-resolved
            - not-under-decision
            - not-pending-verification
            - lea-account-inactive
            - declarant-notified
            - representations-closed
            - download-window-closed
            - scope-exceeds-request
            - grounds-required
          description: Machine-readable cause, from the platform registry; clients map it to copy and never show `title` or `detail`
        detail:
          type: string
        instance:
          type: string
        errors:
          description: Field-level errors; `path` is the dotted request field
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - path
              - message
      required:
        - type
        - title
        - status
security:
  - bearer: []
