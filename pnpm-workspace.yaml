packages:
  - apps/*
  - services/*
  - packages/*
  - mocks
allowBuilds:
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  protobufjs: true
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.4'
  - '@turbo/darwin-arm64@2.11.4'
  - '@turbo/linux-64@2.11.4'
  - '@turbo/linux-arm64@2.11.4'
  - '@turbo/windows-64@2.11.4'
  - '@turbo/windows-arm64@2.11.4'
  - nestjs-pino@5.2.1
  - turbo@2.11.4
  - '@aws-sdk/client-s3@3.1140.0'
  - vite@8.3.1
# Peer suffixes name only the peers' versions, not their own peer resolutions. Without it an
# optional transitive peer (debug's supports-color, under @nestjs/common) flips between
# installs and splits @nestjs/core in two, so guards in shared packages see another Reflector.
# Shared Nest packages also take the framework as peerDependencies.
dedupePeers: true
# source-map-js 1.2.1 (GHSA-68fv-2mgg-jv7q, high) is what Tailwind, Vite and the Temporal
# worker resolve. 1.2.2 is the patched release.
overrides:
  source-map-js: '>=1.2.2'
# Node's watch mode (dev scripts) posts dependency reports from worker threads to the Worker's
# 'message' listeners (nodejs/node#62368); the SDK took them for patch activation callbacks and
# crashed the process. The patch ignores messages the SDK did not send. Drop it once upstream does.
patchedDependencies:
  '@temporalio/worker@1.24.0': patches/@temporalio__worker@1.24.0.patch
