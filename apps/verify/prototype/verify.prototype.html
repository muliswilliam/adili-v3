<!doctype html>
<!-- PROTOTYPE - throwaway. Question: how does anyone (no account) check an Adili Online document from its QR code or printed verification code, see every result state, and check a PDF's hash in the browser without uploading it, while learning nothing private (ADR-010)? Covers tickets #145, #137. Open by double-clicking. State is in memory. -->
<html lang="en">

      .status-head h1 {

      .status-head p {

      }

      .st-danger .status-head {

      .st-neutral .status-head {

      }
      .st-neutral .mark {

      }
      .status-body {
        padding: 4px 20px 20px;
      }
      @container app (min-width: 600px) {

        }
      }
      .dl > div {
        align-items: center;
      }
      .dl dd {
        display: flex;
        justify-content: flex-end;

        flex-wrap: wrap;
      }
      .refchip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 30px;
        padding: 0 8px 0 10px;
        border-radius: 8px;
        border: 0;

        cursor: pointer;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;

      }
      @container app (max-width: 479px) {
        .status .dl > div {
          flex-direction: column;
          align-items: flex-start;
          gap: 4px;
        }
        .status .dl dd {
          justify-content: flex-start;

        }

          left: 0;

        }

        }
      }
      .refchip {
        white-space: nowrap;
      }
      .refchip:hover {
        background: #ebe9e6;
      }
      .refchip svg {

      }
      .refpop {
        position: absolute;
        right: 0;
        top: calc(100% + 6px);

      .refpop table {

      }
      .refpop td.k {
        color: var(--muted);
        white-space: nowrap;
      }
      .vbadge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 9px;
        border-radius: 999px;
        font-size: 12.5px;
        font-weight: 500;
        background: var(--sunken);
        color: var(--ink-2);
      }
      .vbadge.cur {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .vbadge.old {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .hashdrop {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 26px 18px;
        border-radius: var(--r-lg);
        border: 1.5px dashed var(--line-2);
        background: var(--surface);
        text-align: center;
        position: relative;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .hashdrop:hover,
      .hashdrop.over {
        border-color: var(--ink);
        background: var(--brand-softer);
      }
      .hashdrop:focus-within {
        outline: 3px solid rgba(26, 26, 26, 0.15);
        outline-offset: 2px;
      }
      .hashdrop input {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
      }
      .hashdrop .ico {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: var(--sunken);
        color: var(--ink-2);
      }
      .never {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--ok);
        font-weight: 500;
      }

        border-radius: var(--r-lg);
        padding: 16px;
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .hres.ok {
        background: var(--ok-soft);
        color: #0f5a2d;
      }
      .hres.bad {
        background: var(--danger-soft);
        color: #8a1c14;
      }
      .hres.warn {
        background: var(--warn-soft);
        color: #6b4000;
      }
      .hres h3 {

      }
      .hres p {

      }
      .digest {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;

        word-break: break-all;
        line-height: 1.6;
        color: var(--ink-2);
      }
      .digest b {
        color: var(--ink);
        font-weight: 600;
      }
      .fileline {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: var(--r);
        background: var(--surface);
        box-shadow: var(--shadow-input);
        font-size: 14px;
      }
      .proto-box {
        margin-top: 28px;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1.5px dashed #c9c7c3;
        font-size: 13px;
        color: var(--muted);
      }
      .proto-box b {
        color: var(--ink-2);
      }
      .proto-box .codes {
        display: grid;
        gap: 4px;
        margin-top: 8px;
      }
      .proto-box button {
        border: 0;
        background: none;
        padding: 3px 0;
        text-align: left;
        cursor: pointer;
        font: inherit;
        color: var(--ink-2);
      }
      .proto-box button .mono {
        color: var(--ink);
      }
      .proto-box button:hover .mono {
        text-decoration: underline;
      }
      .lvl {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      .lvl th,
      .lvl td {
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      .lvl th {
        font-size: 12.5px;
        color: var(--muted);
        font-weight: 500;
      }
      .lvl tr:last-child td {
        border-bottom: 0;
      }
      .prim {
        display: grid;
        gap: 16px;
      }
      .prim h3 {
        font-size: 15px;
        font-weight: 600;
      }
      .prim .demo {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 10px;
      }
    </style>
    <script src="../../../packages/ui/prototype/kit.js"></script>
  </head>
  <body>
    <script>
      const { icon, esc, logo, qr, fmtDate } = Kit;

      /* ---------- demo data: the verification-api projection (public-safe fields only) ---------- */
      const V2 = 'ADL-7Q4K-M2XR-9HTC-W3NB-5FJD-8P'; // John Kennedy's current slip (version 2)
      const V1 = 'ADL-3MZC-8K1V-QD4T-7HWA-2RNE-6J'; // his first slip, superseded by V2
      const REV = 'ADL-9TXB-4KMC-1VRD-6QPE-3HZW-5A';
      const EXP = 'ADL-6FHW-2NQD-8KXT-5BMR-1CVE-7G';
      const CONF = 'ADL-4RDM-7XHQ-2WCP-9KTB-6NJF-3E';
      const DOCS = {
        [V2]: {
          status: 'valid',
          level: 'restricted',
          type: 'Acknowledgement slip',
          issuer: 'Teachers Service Commission',
          issuerCode: 'TSC',
          ref: 'DCI-TSC-2026-0012345-8',
          version: 2,
          issuedAt: '2026-09-26T10:43:00',
          sha256: null,
        },
        [V1]: {
          status: 'superseded',
          level: 'restricted',
          type: 'Acknowledgement slip',
          issuer: 'Teachers Service Commission',
          issuerCode: 'TSC',
          ref: 'DCI-TSC-2026-0012345-8',
          version: 1,
          issuedAt: '2026-09-21T16:05:00',
          supersededBy: V2,
          sha256: '5d41402abc4b2a76b9719d911017c592aa6f1d4c7e0b43e8f0b7b3c9e2d1a6f4',
        },
        [REV]: {
          status: 'revoked',
          level: 'restricted',
          type: 'Acknowledgement slip',
          issuer: 'Public Service Commission',
          issuerCode: 'PSC',
          ref: 'DCI-PSC-2026-0000481-3',
          version: 1,
          issuedAt: '2026-09-14T09:12:00',
          reason: 'Issued in error',
          sha256: '9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08',
        },
        [EXP]: {
          status: 'expired',
          level: 'restricted',
          type: 'Compliance certificate',
          issuer: 'Public Service Commission',
          issuerCode: 'PSC',
          ref: 'CRT-PSC-2025-0000217-D',
          version: 1,
          issuedAt: '2025-03-03T11:20:00',
          expiredOn: '2026-01-01',
          sha256: 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855',
        },
        [CONF]: {
          status: 'valid',
          level: 'confidential',
          sha256: '2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae',
        },
      };
      const TYPES = {
        DCI: 'Initial declaration',
        DCB: 'Biennial declaration',
        DCF: 'Final declaration',
        CRT: 'Compliance certificate',
      };
      const ISSUERS = { TSC: 'Teachers Service Commission', PSC: 'Public Service Commission' };

      const S = Kit.state({
        code: '',
        codeErr: null,
        checking: false,
        id: V2,
        source: 'typed',
        sim: null, // sim: 'rate' | 'down' (prototype switches)
        rlEnds: 0,
        hash: { state: 'idle', name: '', size: 0, digest: '', showTech: false },
        checks: 0,
      });

      /* ---------- id helpers (mirror apps/verify/src/lib/verification-id.ts) ---------- */
      const PATTERN = /^ADL(?:-[0-9A-HJKMNP-TV-Z]{1,4}){2,8}$/;
      const bodyOf = (v) => {
        let r = String(v)
          .toUpperCase()
          .replace(/[^0-9A-Z]/g, '');
        if (r.startsWith('ADL')) r = r.slice(3);
        return r.replace(/[IL]/g, '1').replace(/O/g, '0').slice(0, 26);
      };
      const grouped = (r) => (r.match(/.{1,4}/g) || []).join('-');
      const fullId = (typed) => 'ADL-' + grouped(bodyOf(typed));
      const hex = (buf) =>
        [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
      const fmtSize = (n) =>
        n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
      const fmtDT = (d) => {
        const x = new Date(d);
        return `${fmtDate(x)}, ${String(x.getHours()).padStart(2, '0')}:${String(x.getMinutes()).padStart(2, '0')}`;
      };
      const digestHtml = (h) => (h || '').match(/.{1,8}/g)?.join(' ') || '';
      const rlLeft = () => Math.max(0, Math.ceil((S.rlEnds - Date.now()) / 1000));

      /* ---------- primitives (#137) ---------- */
      const QrCode = (value, size = 112, seed = 7) =>
        qr(seed, size).replace(
          'aria-label="QR code"',
          `aria-label="QR code. Verification code ${esc(value)}"`,
        );
      function ReferenceChip(ref, key = 'ref') {
        const [type, issuer, year, seq, check] = ref.split('-');
        const open = S.menu === key;
        return `<span class="menu-wrap"><button class="refchip" data-act="menu" data-arg="${key}" aria-expanded="${open}" aria-label="Reference number ${ref}. Show what each part means">${ref}${icon('info', 14)}</button>${
          open
            ? `<div class="refpop" role="dialog" aria-label="Parts of the reference number">
    <div style="font-weight:600;font-size:13.5px;margin-bottom:6px">What the reference number means</div>
    <table><tr><td class="p">${type}</td><td class="k">Type</td><td>${TYPES[type] || type}</td></tr>
    <tr><td class="p">${issuer}</td><td class="k">Issuer</td><td>${ISSUERS[issuer] || issuer}</td></tr>
    <tr><td class="p">${year}</td><td class="k">Year</td><td>Year of the statement date</td></tr>
    <tr><td class="p">${seq}</td><td class="k">Sequence</td><td>Number within that Commission and year</td></tr>
    <tr><td class="p">${check}</td><td class="k">Check</td><td>Catches typing mistakes</td></tr></table></div>`
            : ''
        }</span>`;
      }
      const VersionBadge = (n, state) =>
        `<span class="vbadge ${state === 'current' ? 'cur' : state === 'superseded' ? 'old' : ''}">Version ${n}${state === 'current' ? ' · current' : state === 'superseded' ? ' · superseded' : ''}</span>`;
      function HashDropZone(doc) {
        const H = S.hash;
        const zone = `<label class="hashdrop ${H.over ? 'over' : ''}" data-hashdrop>
      <input type="file" accept="application/pdf,.pdf" data-act-change="hashFile" aria-describedby="never-up"/>
      <span class="ico">${icon('file', 20)}</span>
      <span style="font-weight:600">Drop the PDF you were given</span>
      <span class="small muted">or <span class="link">choose a file</span> from your device</span>
    </label>`;
        const never = `<div class="never" id="never-up">${icon('lock', 14)} The file is checked on your device and never uploaded.</div>`;
        const tech = () =>
          `<button class="link small" data-act="toggleTech" aria-expanded="${H.showTech}">${H.showTech ? 'Hide' : 'Show'} technical details</button>${H.showTech ? `<div class="digest" style="margin-top:10px;display:grid;gap:8px"><div><b>Your file (SHA-256)</b><br/>${digestHtml(H.digest)}</div><div><b>Issued document (SHA-256)</b><br/>${digestHtml(doc.sha256)}</div><div class="muted" style="font-family:Inter,sans-serif;font-size:12.5px;word-break:normal">Calculated in this browser. Nothing was sent.</div></div>` : ''}`;
        const file = H.name
          ? `<div class="fileline">${icon('file', 16)}<span class="truncate" style="flex:1;min-width:0">${esc(H.name)}</span><span class="muted small">${fmtSize(H.size)}</span></div>`
          : '';
        let body;
        if (H.state === 'hashing')
          body = `${file}<div class="row" role="status" aria-live="polite" style="padding:6px 2px"><span class="spinner dark"></span><span>Checking the file on your device</span></div>`;
        else if (H.state === 'identical')
          body = `${file}<div class="hres ok" role="status" aria-live="polite">${icon('check', 20, 2.4)}<div style="flex:1;min-width:0"><h3>Identical to the issued document</h3><p>Not a single byte has changed${doc.version ? ` (version ${doc.version})` : ''}.</p><div style="margin-top:10px">${tech()}</div></div></div>`;
        else if (H.state === 'mismatch')
          body = `${file}<div class="hres bad" role="alert">${icon('x', 20, 2.4)}<div style="flex:1;min-width:0"><h3>Does not match the issued document</h3><p>It may be edited or another version. Rely on the details above, not this copy.</p><div style="margin-top:10px">${tech()}</div></div></div>`;
        else if (H.state === 'unreadable')
          body = `${file}<div class="hres warn" role="alert">${icon('alert', 20)}<div><h3>Could not read this file</h3><p>Choose a PDF. It may be damaged or still downloading.</p></div></div>`;
        const again = ['identical', 'mismatch', 'unreadable'].includes(H.state)
          ? `<button class="btn btn-secondary btn-sm" data-act="hashReset">${icon('refresh', 15)} Check another file</button>`
          : '';
        return `<div class="stack" style="gap:12px">${H.state === 'idle' ? zone : body}${again ? `<div>${again}</div>` : ''}${never}</div>`;
      }

      /* ---------- shell ---------- */
      function shell(body) {
        return `<div class="vshell">
    <header class="vtop">${logo(22)}<span class="badge" style="height:22px;font-size:11.5px">Verify</span><span class="spacer"></span><button class="btn btn-ghost btn-sm" data-act="toast" data-arg="Kiswahili: strings are slots for now">${icon('globe', 16)} English</button></header>
    <main class="vmain">${body}</main>
    <footer class="vfoot"><div>Verification is recorded (time and coarse location) to protect against abuse.</div><div>Adili Online · <a class="link" style="font-weight:400" data-act="go" data-arg="privacy">What this page shows</a></div></footer>
  </div>`;
      }

      /* ---------- screens ---------- */
      const screens = {};

      screens.home = () =>
        shell(`
  <div style="text-align:center">
    <div class="hero-ico">${icon('qr', 26)}</div>
    <h1 class="page-title" style="text-wrap:balance">Check an Adili Online document</h1>
    <p class="muted" style="margin-top:10px;font-size:15.5px;text-wrap:pretty">Scan the QR code on the document or type the verification code printed under it. Nothing you enter is stored with your identity.</p>
  </div>
  <div class="card card-pad" style="margin-top:26px">
    <form class="stack" data-form="check" novalidate>
      <div class="field">

      /* ---------- actions ---------- */
      let loadT, hashT;
      function openResult(id, source) {
        S.id = id;

        S.menu = null;
        S.hideLink = false;
        S.hash = { state: 'idle', name: '', size: 0, digest: '', showTech: false };

        loadT = setTimeout(() => Kit.go('result'), 850);
      }
      async function runHash(bytes, name) {
        const doc = PATTERN.test(S.id) && DOCS[S.id] ? DOCS[S.id] : DOCS[V2];
        S.hash = { state: 'hashing', name, size: bytes.byteLength, digest: '', showTech: false };
        Kit.render();
        const head = new TextDecoder().decode(new Uint8Array(bytes.slice(0, 5)));
        const started = Date.now();
        let digest = '';
        try {
          digest = hex(await crypto.subtle.digest('SHA-256', bytes));
        } catch (e) {
          digest = '';

            else S.hash.state = digest === doc.sha256 ? 'identical' : 'mismatch';
            S.hash.digest = digest;
            Kit.render();
          },
          Math.max(0, 700 - (Date.now() - started)),
        );

            document.getElementById('f-code')?.focus();
            return;

              'j-down',
              'j-h-hashing',
              'j-h-ok',
              'j-h-bad',
              'j-h-unread',
              'privacy',
            ],
            note: 'Hash check is real: Web Crypto SHA-256 in the browser, no network request. Service-unavailable and confidential-level states are not in the spec table (added from ADR-010 / robustness).',
          },
          {
            ticket: 137,
            title: 'UI primitives round 6: QR code, hash drop zone, reference chip, version badge',
            screens: ['primitives', 'j-ref', 'j-h-ok'],
            note: 'Tests and exports are code work; the visuals and states are here.',
          },
        ],
        afterRender: () => {
          const a = document.querySelector('[data-dl="good"]');
          if (a) a.href = DL.good;
          const b = document.querySelector('[data-dl="bad"]');
          if (b) b.href = DL.bad;
        },
      });

      /* Code input: auto-format groups of 4, uppercase, Crockford look-alikes; Enter submits. Runs before the kit's binding. */
      document.addEventListener(
        'input',
        (e) => {
          if (e.target.id !== 'f-code') return;
          const el = e.target;
          const atEnd = el.selectionStart === el.value.length;
          el.value = grouped(bodyOf(el.value));
          if (atEnd) el.setSelectionRange(el.value.length, el.value.length);
          if (S.codeErr) {
            S.codeErr = null;
            setTimeout(() => Kit.render(), 0);
          }
        },
        true,
      );
      document.addEventListener(
        'submit',
        (e) => {
          if (e.target.dataset.form === 'check') {
            e.preventDefault();
            actions.check();
          }
        },
        true,
      );
      /* Drag and drop onto the hash zone; stop the browser opening files dropped elsewhere. */
      ['dragover', 'drop'].forEach((t) => window.addEventListener(t, (e) => e.preventDefault()));
      document.addEventListener('dragover', (e) => {
        const z = e.target.closest?.('[data-hashdrop]');
        if (z && !S.hash.over) {
          S.hash.over = true;
          z.classList.add('over');
        }
      });
      document.addEventListener('dragleave', (e) => {
        const z = e.target.closest?.('[data-hashdrop]');
        if (z && !z.contains(e.relatedTarget)) {
          S.hash.over = false;
          z.classList.remove('over');
        }
      });
      document.addEventListener('drop', async (e) => {
        const z = e.target.closest?.('[data-hashdrop]');
        S.hash.over = false;
        if (!z) return;
        const f = e.dataTransfer.files?.[0];
        if (f) runHash(await f.arrayBuffer(), f.name);
      });
      /* Rate-limit countdown in place. */
      setInterval(() => {
        if (S.screen !== 'result' || S.sim !== 'rate-now') return;
        const s = rlLeft();
        const el = document.querySelector('[data-rl]');
        if (el) el.textContent = s;
        if (s === 0 && document.querySelector('[data-act="retry"][disabled]')) Kit.render();
      }, 1000);
    </script>
  </body>
</html>
