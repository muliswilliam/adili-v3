<!doctype html>
<!-- PROTOTYPE - throwaway. Question: what does the applicant side of access requests look like, from Get started as an applicant (national ID + IPRS + phone code, passport pending verification) through the Form K wizard, My requests, the decision and the watermarked package download with its countdown? Covers tickets #247 #249 #251 #261 (spec 10). Open by double-clicking. State is in memory. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dials - Access requests, applicant (prototype)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../../packages/ui/prototype/kit.css" />
    <style>
      /* ---------- shared bits (same look as declarant-journey / after-submission) ---------- */
      .proto-note {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 11.5px;
        line-height: 1.45;
        color: #6d5a2a;
        background: #fffaf0;
        border: 1px dashed #e2c98f;
        border-radius: 8px;
        padding: 7px 10px;
      }
      .proto-note b {
        color: #4d3d10;
      }
      .proto-note a {
        color: #4d3d10;
        font-weight: 600;
        cursor: pointer;
      }
      .is-invalid {
        box-shadow: 0 0 0 1.5px var(--danger) !important;
      }
      .cd {
        font-variant-numeric: tabular-nums;
      }
      .linklike {
        background: none;
        border: 0;
        padding: 0;
        color: var(--ink);
        font-weight: 500;
        text-decoration: underline;
        text-decoration-color: var(--line-2);
        text-underline-offset: 3px;
        cursor: pointer;
        font-size: inherit;
      }
      .linklike:hover {
        text-decoration-color: var(--ink);
      }
      .linklike[disabled] {
        color: var(--muted);
        text-decoration: none;
        cursor: default;
      }
      :focus-visible {
        outline: 3px solid rgba(233, 90, 36, 0.45);
        outline-offset: 2px;
      }
      .spinner.sm {
        width: 14px;
        height: 14px;
        border-width: 2px;
      }
      .ferr {
        font-size: 13px;
        color: var(--danger);
        font-weight: 500;
        display: flex;
        gap: 6px;
        align-items: flex-start;
      }
      .ferr svg {
        flex: none;
        margin-top: 2px;
      }

      /* ---------- onboarding (auth layout) ---------- */
      .stepper-wrap {
        margin-bottom: 26px;
      }
      .stepper-wrap .stepper {
        margin-bottom: 8px;
      }
      .stepper-wrap .lbl {
        font-size: 13px;
        color: var(--muted);
        font-weight: 500;
      }
      .gs-foot-help {
        margin-top: 28px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        font-size: 13.5px;
        color: var(--muted);
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .gs-foot-help svg {
        flex: none;
        margin-top: 2px;
      }
      .gs-h1 {
        font-size: 26px;
        line-height: 1.2;
        letter-spacing: -0.02em;
        font-weight: 600;
      }
      .gs-sub {
        color: var(--muted);
        margin-top: 8px;
      }
      .otp {
        flex-wrap: nowrap;
      }
      .otp.err input {
        box-shadow: 0 0 0 1.5px var(--danger);
      }
      .otp.dis input {
        background: var(--sunken);
        color: var(--muted);
        pointer-events: none;
      }
      .otp-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .otp-row {
        font-size: 14px;
      }
      .masked {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        color: var(--ink);
      }
      .vbadge-ok {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 22px;
        padding: 0 8px;
        border-radius: 999px;
        background: var(--ok-soft);
        color: var(--ok);
        font-size: 12px;
        font-weight: 500;
        vertical-align: 1px;
        white-space: nowrap;
      }
      .vbadge-warn {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .grid-2c {
        display: grid;
        gap: 16px;
        grid-template-columns: minmax(0, 1fr);
      }
      @container app (min-width: 520px) {
        .grid-2c {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        }
      }
      .auth-body .callout {
        font-size: 14px;
      }

      /* ---------- combobox (Commission) ---------- */
      .combo .input-group .ico {
        display: flex;
        align-items: center;
        padding-left: 12px;
        color: var(--muted);
      }
      .combo-list {
        margin-top: 8px;
        border-radius: 12px;
        background: var(--surface);
        box-shadow: var(--shadow-pop);
        max-height: 320px;
        overflow-y: auto;
        padding: 6px;
      }
      .combo-opt {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 10px;
        border: 0;
        background: none;
        border-radius: 9px;
        text-align: left;
        cursor: pointer;
        font: inherit;
        color: inherit;
      }
      .combo-opt:hover,
      .combo-opt.act {
        background: var(--sunken);
      }
      .mono-code {
        flex: none;
        min-width: 58px;
        height: 26px;
        padding: 0 6px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        background: var(--brand-soft);
        color: var(--brand-ink);
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .combo-opt .nm {
        flex: 1;
        min-width: 0;
        font-weight: 500;
        font-size: 14.5px;
        line-height: 1.3;
      }
      .combo-empty {
        padding: 16px 12px;
        font-size: 14px;
        color: var(--muted);
      }
      .chosen {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-radius: var(--r);
        background: var(--surface);
        box-shadow: 0 0 0 1.5px var(--ink);
      }

      /* ---------- portal pages (as declarant-after-submission) ---------- */
      .back {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 14px;
        font-weight: 500;
        color: var(--muted);
        text-decoration: none;
        cursor: pointer;
        margin-bottom: 14px;
        background: none;
        border: 0;
        padding: 0;
      }
      .back:hover {
        color: var(--ink);
      }
      .head-row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .head-row .page-title {
        flex: 1 1 260px;
        min-width: 0;
      }
      .meta-line {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
        margin-top: 10px;
        font-size: 14px;
        color: var(--muted);
        align-items: center;
      }
      .meta-line > span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .side-grid {
        display: grid;
        gap: 20px;
        grid-template-columns: minmax(0, 1fr);
        margin-top: 24px;
      }
      @container app (min-width: 960px) {
        .side-grid {
          grid-template-columns: minmax(0, 1fr) 340px;
          align-items: start;
        }
        .side-grid > .side {
          position: sticky;
          top: 84px;
        }
      }
      .side {
        display: flex;
        flex-direction: column;
        gap: 20px;
        min-width: 0;
      }
      .refchip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 9px;
        border-radius: 7px;
        background: var(--sunken);
        border: 0;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--ink);
        cursor: pointer;
        white-space: nowrap;
      }
      .refchip:hover {
        background: #ebe9e5;
      }
      .refchip.lg {
        height: 44px;
        padding: 0 16px;
        font-size: 17px;
        border-radius: 11px;
        background: var(--surface);
        box-shadow: var(--shadow-input);
      }
      .refmenu {
        left: 0;
        right: auto;
        min-width: 260px;
        max-width: 320px;
        padding: 12px;
        gap: 6px;
        font-size: 13px;
      }
      .refmenu .row {
        gap: 8px;
        align-items: baseline;
      }
      .refmenu .seg-k {
        font-family: ui-monospace, Menlo, monospace;
        font-weight: 600;
        min-width: 64px;
      }
      .banner {
        display: flex;
        gap: 12px;
        padding: 16px 18px;
        border-radius: 14px;
        font-size: 14.5px;
        line-height: 1.5;
      }
      .banner > svg {
        flex: none;
        margin-top: 2px;
      }
      .banner b {
        font-weight: 600;
      }
      .banner .btn {
        margin-top: 10px;
      }
      .banner-warn {
        background: var(--warn-soft);
        color: #6b4000;
        box-shadow: 0 0 0 1px #f3dfb5;
      }
      .banner-danger {
        background: var(--danger-soft);
        color: #8a1c14;
        box-shadow: 0 0 0 1px #f5cdc9;
      }
      .banner-ok {
        background: var(--ok-soft);
        color: #0f5a2d;
        box-shadow: 0 0 0 1px #cbe8d5;
      }
      .banner-info {
        background: #eaf1fb;
        color: #1f4f96;
        box-shadow: 0 0 0 1px #d3e2f6;
      }
      .banner-neutral {
        background: var(--sunken);
        color: var(--ink-2);
      }
      .timer .big {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }
      .timer .big.warn {
        color: var(--warn);
      }
      .timer .big.danger {
        color: var(--danger);
      }
      .timer .bar {
        position: relative;
        height: 8px;
        border-radius: 8px;
        background: var(--sunken);
        margin: 14px 0 6px;
      }
      .timer .bar > i {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        border-radius: 8px;
        background: var(--ink);
      }
      .timer .bar.warn > i {
        background: #d98a00;
      }
      .timer .bar.danger > i {
        background: var(--danger);
      }
      .timer .bar.ok > i {
        background: var(--ok);
      }
      .timer .mark {
        position: absolute;
        top: -4px;
        width: 2px;
        height: 16px;
        background: var(--line-2);
        border-radius: 2px;
      }
      .timer .scale {
        position: relative;
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
      }
      .mark-key {
        width: 2px;
        height: 12px;
        border-radius: 2px;
        background: var(--line-2);
        flex: none;
      }
      .timer .scale .mid {
        position: absolute;
        transform: translateX(-50%);
        white-space: nowrap;
      }
      .cardlink {
        display: block;
        text-decoration: none;
        color: inherit;
        cursor: pointer;
      }
      .lc {
        display: flex;
        gap: 14px;
        padding: 18px 20px;
        align-items: flex-start;
      }
      .cardlink + .cardlink .lc {
        border-top: 1px solid var(--line);
      }
      @container app (min-width: 700px) {
        .lc {
          padding: 18px 24px;
        }
      }
      .cardlink:hover .lc {
        background: #fcfbfa;
      }
      .card > .cardlink:first-child .lc {
        border-top-left-radius: var(--r-lg);
        border-top-right-radius: var(--r-lg);
      }
      .lc .ico {
        width: 40px;
        height: 40px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        flex: none;
      }
      .lc .body {
        flex: 1;
        min-width: 0;
      }
      .lc .t {
        font-weight: 600;
        font-size: 15.5px;
        line-height: 1.35;
      }
      .lc .d {
        font-size: 13.5px;
        color: var(--muted);
        margin-top: 3px;
        line-height: 1.45;
      }
      .lc .d .mono {
        font-size: 12.5px;
      }
      .lc .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
        align-items: center;
      }
      .lc .chev {
        color: var(--muted);
        align-self: center;
        flex: none;
      }
      .counter {
        font-size: 12.5px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .counter.over {
        color: var(--danger);
        font-weight: 600;
      }
      .skel-card {
        display: flex;
        gap: 14px;
        padding: 20px 24px;
        border-bottom: 1px solid var(--line);
      }
      .skel-card:last-child {
        border-bottom: 0;
      }
      .skeleton.circle {
        width: 40px;
        height: 40px;
        border-radius: 11px;
        flex: none;
      }
      .sec-label {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .prose {
        font-size: 14.5px;
        line-height: 1.55;
        white-space: pre-wrap;
      }
      .kv-list {
        display: grid;
        gap: 14px;
      }

      /* ---------- DeadlineChip (#249) ---------- */
      .dchip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 24px;
        padding: 0 9px;
        border-radius: 999px;
        background: var(--sunken);
        color: var(--ink-2);
        font-size: 12.5px;
        font-weight: 500;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .dchip.soon {
        background: var(--warn-soft);
        color: #8a5300;
      }
      .dchip.late {
        background: var(--danger-soft);
        color: var(--danger);
        font-weight: 600;
      }
      .dchip.done {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .dchip.off {
        background: var(--sunken);
        color: var(--muted);
      }

      /* ---------- ScopePicker (#249) ---------- */
      .sp {
        display: grid;
        gap: 22px;
      }
      .sp fieldset {
        border: 0;
        margin: 0;
        padding: 0;
        min-width: 0;
      }
      .sp legend {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 10px;
        padding: 0;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .sp-opts {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .sp-grid {
        display: grid;
        gap: 8px;
        grid-template-columns: minmax(0, 1fr);
      }
      @container app (min-width: 520px) {
        .sp-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @container app (min-width: 1000px) {
        .sp-grid.c3 {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
      .sp-opt {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 46px;
        padding: 10px 14px;
        border-radius: 12px;
        background: var(--surface);
        box-shadow: var(--shadow-input);
        cursor: pointer;
        font-size: 14.5px;
        font-weight: 500;
        line-height: 1.3;
      }
      .sp-opt input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .sp-opt .box {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        box-shadow: inset 0 0 0 1.5px var(--line-2);
        display: grid;
        place-items: center;
        color: transparent;
        flex: none;
        background: #fff;
      }
      .sp-opt:has(input:checked) {
        box-shadow: 0 0 0 1.5px var(--ink);
      }
      .sp-opt:has(input:checked) .box {
        background: var(--ink);
        color: #fff;
        box-shadow: none;
      }
      .sp-opt:has(input:focus-visible) {
        outline: 3px solid rgba(233, 90, 36, 0.45);
        outline-offset: 2px;
      }
      .sp-opt:has(input:disabled) {
        cursor: not-allowed;
        background: var(--sunken);
        box-shadow: none;
        color: var(--muted);
      }
      .sp-opt:has(input:disabled:checked) .box {
        background: var(--line-2);
      }
      .sp-opt .sub {
        display: block;
        font-size: 12.5px;
        font-weight: 400;
        color: var(--muted);
      }
      .sp-opt.yr {
        min-width: 104px;
      }
      .sp.err .sp-invalid .sp-opt {
        box-shadow: 0 0 0 1.5px var(--danger);
      }
      /* read-only scope view (requested vs granted) */
      .sv {
        display: grid;
        gap: 12px;
      }
      .sv-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 6px;
      }
      @container app (min-width: 600px) {
        .sv-row {
          grid-template-columns: 120px minmax(0, 1fr);
          gap: 12px;
          align-items: baseline;
        }
      }
      .sv-k {
        font-size: 13px;
        color: var(--muted);
        font-weight: 500;
      }
      .sv-v {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .sv-i {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 28px;
        padding: 0 10px;
        border-radius: 8px;
        background: var(--sunken);
        font-size: 13.5px;
        font-weight: 500;
      }
      .sv-i.yes {
        background: var(--ok-soft);
        color: #0f5a2d;
      }
      .sv-i.no {
        background: transparent;
        box-shadow: inset 0 0 0 1px var(--line);
        color: var(--muted);
        text-decoration: line-through;
        text-decoration-color: var(--line-2);
      }
      .sv-legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 12.5px;
        color: var(--muted);
      }
      .sv-legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .sv-legend i {
        width: 12px;
        height: 12px;
        border-radius: 4px;
        background: var(--ok-soft);
        display: inline-block;
      }
      .sv-legend i.no {
        background: transparent;
        box-shadow: inset 0 0 0 1px var(--line-2);
      }

      /* ---------- grounds (#249, read-only in the portal) ---------- */
      .grounds {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .grounds li {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        font-size: 14.5px;
        line-height: 1.45;
      }
      .reg-tag {
        flex: none;
        display: inline-grid;
        place-items: center;
        min-width: 26px;
        height: 22px;
        padding: 0 6px;
        border-radius: 6px;
        background: var(--sunken);
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-2);
        margin-top: 1px;
      }
      .gsel {
        display: grid;
        gap: 8px;
      }
      .gsel .check {
        align-items: flex-start;
      }

      /* ---------- package ---------- */
      .pkg {
        display: flex;
        gap: 18px;
        align-items: flex-start;
      }
      .wm {
        position: relative;
        flex: none;
        width: 92px;
        height: 120px;
        border-radius: 8px;
        background: #fff;
        box-shadow:
          var(--shadow-input),
          3px 3px 0 -1px #fff,
          3px 3px 0 0 var(--line);
        overflow: hidden;
      }
      .wm .ln {
        position: absolute;
        left: 12px;
        right: 12px;
        height: 4px;
        border-radius: 3px;
        background: #ecebe8;
      }
      .wm .mk {
        position: absolute;
        left: -20px;
        right: -20px;
        top: 42px;
        transform: rotate(-32deg);
        text-align: center;
        font-size: 6.5px;
        font-weight: 600;
        line-height: 1.35;
        color: rgba(201, 41, 30, 0.42);
        letter-spacing: 0.02em;
      }
      .wm .cf {
        position: absolute;
        top: 8px;
        left: 12px;
        font-size: 6.5px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--danger);
      }
      .wm.off {
        opacity: 0.5;
        filter: grayscale(1);
      }
      .pkg-body {
        flex: 1;
        min-width: 0;
      }
      .pkg-acts {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 14px;
        align-items: center;
        margin-top: 14px;
      }
      .exp-line {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13.5px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .exp-line.warn {
        color: #8a5300;
        font-weight: 600;
      }
      @container app (max-width: 519px) {
        .wm {
          display: none;
        }
        .pkg-acts .btn-primary {
          flex: 1;
        }
      }

      /* ---------- progress on request detail ---------- */
      .prog .tl-ico.done {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .prog .tl-ico.cur {
        background: var(--ink);
        color: #fff;
      }
      .prog .tl-ico.todo {
        background: transparent;
        box-shadow: inset 0 0 0 1.5px var(--line-2);
        color: var(--muted);

      /* DeadlineChip (#249): due, due soon, due today, late, done. Accessible time text. */
      function deadlineChip(
        date,
        {
          label = 'Decision due',
          soon = 5,
          done = null,
          doneLabel = 'Decided',
          lateLabel = null,
          expiry = false,
        } = {},
      ) {
        const long = longDate(date);
        const iso = isoDay(date);
        if (done) {
          const onTime = done <= date;
          return `<span class="dchip ${onTime ? 'done' : 'late'}">${icon(onTime ? 'check' : 'clock', 13, 2.2)} <time datetime="${isoDay(done)}">${doneLabel} ${shortDate(done)}</time>${onTime ? '' : `<span class="sr-only">, after the deadline of ${long}</span>`}</span>`;
        }
        const n = dd(TODAY, date);
        const ms = date - now();
        if (expiry && ms > 0 && ms < DAY)
          return `<span class="dchip soon" aria-label="${label} today, ${long}">${icon('clock', 13, 2.2)} <time datetime="${iso}">Expires in ${cdText(date, 'hm')}</time></span>`;
        if (ms <= 0 && expiry)
          return `<span class="dchip off">${icon('lock', 13, 2.2)} <time datetime="${iso}">${lateLabel || 'Expired'} ${shortDate(date)}</time></span>`;
        if (n < 0)
          return `<span class="dchip late" aria-label="${label} ${long}, ${plural(-n, 'day')} late">${icon('alert', 13, 2.2)} <time datetime="${iso}">${lateLabel || plural(-n, 'day') + ' late'}</time></span>`;
        if (n === 0)
          return `<span class="dchip soon" aria-label="${label} today, ${long}">${icon('clock', 13, 2.2)} <time datetime="${iso}">${expiry ? 'Expires today' : 'Due today'}</time></span>`;
        if (n <= soon)
          return `<span class="dchip soon" aria-label="${label} ${long}, in ${plural(n, 'day')}">${icon('clock', 13, 2.2)} <time datetime="${iso}">${expiry ? 'Expires' : 'Due'} in ${plural(n, 'day')}</time></span>`;
        return `<span class="dchip" aria-label="${label} ${long}, in ${plural(n, 'day')}">${icon('calendar', 13, 2.2)} <time datetime="${iso}">${label} ${shortDate(date)}</time></span>`;
      }

          `${notice ? `<div class="callout callout-info" role="alert" style="margin-bottom:20px">${icon('info', 17)}<div>${notice}</div></div>` : ''}
    <h1 class="gs-h1">How will you identify yourself?</h1>
    <div style="margin-top:22px">${Kit.choices(
      'on.kind',
      [
        {
          k: 'national-id',
          label: 'Kenyan national ID',
          sub: 'Checked with the national register',
          icon: 'card',
        },
        { k: 'passport', label: 'Passport', sub: 'Checked by the Commission later', icon: 'globe' },
      ],
      'c1',
      { tiles: true },
    )}</div>
    <button class="btn btn-primary btn-block" style="margin-top:22px" data-act="go" data-arg="ap-details" ${o.kind ? '' : 'disabled'}>Continue</button>`,
          { step: 1, back: 'landing' },
        );
      };

      /* ---- Step 2: details (start: IPRS for national ID) ---- */
      screens['ap-details'] = () => {
        const o = S.on;
        const pp = o.kind === 'passport';
        const busy = o.st === 'checking';
        const rate = o.st === 'rate' && left(o.rateUntil);
        const e = o.err || {};
        const ro = busy ? 'readonly' : '';
        let alert = '';
        if (o.st === 'mismatch')
          alert = `<div class="callout callout-danger" role="alert" tabindex="-1" id="on-alert">${icon('alert', 17)}<div>These details do not match the national register. Enter your names and ID number exactly as they appear on your ID.</div></div>`;
        if (o.st === 'already')
          alert = `<div class="callout callout-info" role="alert" tabindex="-1" id="on-alert">${icon('userCheck', 17)}<div><div style="font-weight:600">You already have an account.</div><div class="row wrap" style="gap:8px;margin-top:10px"><a class="btn btn-primary btn-sm" href="${KC}#login">Sign in</a><a class="btn btn-secondary btn-sm" href="${KC}#reset-password">Recover access</a></div></div></div>`;
        if (o.st === 'rate')
          alert = `<div class="callout callout-warn" role="alert" tabindex="-1" id="on-alert">${icon('clock', 17)}<div>Too many attempts. Try again in ${rate ? cd(o.rateUntil, 'min') : '1 minute'}.</div></div>`;
        if (o.st === 'unavailable')
          alert = `<div class="callout callout-warn" role="alert" tabindex="-1" id="on-alert">${icon('clock', 17)}<div>The national register is not responding. Wait a few minutes and try again.</div></div>`;
        if (o.st === 'error')
          alert = `<div class="callout callout-danger" role="alert" tabindex="-1" id="on-alert">${icon('alert', 17)}<div>Something went wrong. Try again.</div></div>`;
        const f = (label, bind, opts = {}, fo = {}) => {
          const k = bind.split('.').pop();
          return field(
            label,
            input(bind, {
              ...opts,
              cls: e[k] ? 'is-invalid' : '',
              extra: `${opts.extra || ''} aria-invalid="${!!e[k]}" ${ro}`,
            }),
            { id: 'f-' + bind.replace(/\./g, '-'), error: e[k], ...fo },
          );
        };
        return authLayout(
          `<h1 class="gs-h1">Your details</h1>
    ${alert ? `<div style="margin-top:18px">${alert}</div>` : ''}
    <div class="stack" style="margin-top:22px">
      <div class="grid-2c">${f('Surname', 'on.surname', { extra: 'autocomplete="family-name"' })}${f('First name', 'on.first', { extra: 'autocomplete="given-name"' })}</div>
      ${f('Other names', 'on.other', { extra: 'autocomplete="additional-name"' }, { opt: true })}
      ${
        pp
          ? `<div class="grid-2c">${f('Passport number', 'on.number', { extra: 'autocapitalize="characters" autocomplete="off" maxlength="20"' })}${field('Issuing country', select('on.country', COUNTRIES, { ph: 'Choose', cls: e.country ? 'is-invalid' : '', extra: ro ? 'disabled' : '' }), { id: 'f-on-country', error: e.country })}</div>`
          : f('National ID number', 'on.number', {
              extra: 'inputmode="numeric" autocomplete="off" maxlength="10"',
            })
      }
      ${f('Mobile number', 'on.phone', { type: 'tel', ph: pp ? '+233 24 471 8265' : '0712 345 678', extra: 'inputmode="tel" autocomplete="tel"' }, { hint: 'We send a code by SMS.' })}
      ${f('Email address', 'on.email', { type: 'email', ph: 'name@example.com', extra: 'autocomplete="email"' }, { hint: 'Your password link goes here.' })}
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:22px" data-act="startApplicant" ${busy || rate ? 'disabled' : ''}>${busy ? `<span class="spinner"></span> ${pp ? 'Sending code…' : 'Checking the national register…'}` : rate ? `${icon('clock', 16)} <span>Try again in ${cd(o.rateUntil, 'mmss')}</span>` : 'Continue'}</button>
    ${proto(pp ? 'Any passport number works (no register check). Fill: <a data-act="fillOn">sample passport holder</a>.' : 'ID 28841276 + Kamau matches. 30112233 is already registered. Any other ID does not match; the 6th try is rate-limited. Fill: <a data-act="fillOn">Mercy Kamau</a>.')}`,
          { step: 2, back: 'ap-id' },
        );
      };
      actions.fillOn = () => {
        const a = S.on.kind === 'passport' ? APPLICANTS.passport : APPLICANTS.id;
        Object.assign(S.on, {
          surname: a.surname,
          first: a.first,
          other: a.other,
          number: a.number,
          country: S.on.kind === 'passport' ? a.country : '',
          phone: S.on.kind === 'passport' ? '+233 24 471 8265' : '0722 418 903',
          email: a.email,
          err: {},
          st: null,
        });
        Kit.render();
      };
      actions.startApplicant = () => {
        const o = S.on;
        const pp = o.kind === 'passport';
        const e = {};
        if (o.surname.trim().length < 2) e.surname = 'Enter your surname.';
        if (o.first.trim().length < 2) e.first = 'Enter your first name.';
        const n = o.number.replace(/\s/g, '');
        if (pp ? !/^[A-Za-z0-9]{5,20}$/.test(n) : !/^\d{5,10}$/.test(n))
          e.number = pp
            ? 'Enter your passport number (5 to 20 letters or numbers).'
            : 'Enter your national ID number (5 to 10 digits).';
        if (pp && !o.country) e.country = 'Choose the country that issued your passport.';
        const ph = o.phone.replace(/[\s-]/g, '');
        const ke = /^(?:\+?254|0)([17]\d{8})$/.exec(ph);
        if (!(pp ? /^\+[1-9]\d{6,14}$/.test(ph) || ke : ke))
          e.phone = pp
            ? 'Enter your mobile number with the country code, e.g. +233 24 471 8265.'
            : 'Enter a mobile number, e.g. 0712 345 678.';
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(o.email.trim()))
          e.email = 'Enter an email address in the format name@example.com.';
        o.err = e;
        o.st = null;
        if (Object.keys(e).length) {
          Kit.render();
          document.getElementById('f-on-' + Object.keys(e)[0])?.focus();
          return;
        }
        o.st = 'checking';
        Kit.render();
        setTimeout(() => {
          o.attempts++;
          if (o.attempts >= 6) {
            o.st = 'rate';
            o.rateUntil = Date.now() + (14 * 60 + 32) * 1000;
          } else if (pp || (n === '28841276' && o.surname.trim().toLowerCase() === 'kamau')) {
            o.st = null;
            o.masked = ke
              ? '07** *** ' + ke[1].slice(-3)
              : ph.slice(0, 4) + ' ** *** ' + ph.slice(-4);
            o.emailMasked = o.email.trim()[0] + '***@' + o.email.trim().split('@')[1];
            o.otp = {
              code: blank(),
              st: null,
              attemptsLeft: 5,
              resendAt: Date.now() + 60000,
              resendsLeft: 3,
            };
            return Kit.go('ap-phone');
          } else if (n === '30112233') o.st = 'already';
          else o.st = 'mismatch';
          Kit.render();
          document.getElementById('on-alert')?.focus();
        }, 1100);
      };

      /* ---- Step 3: phone code ---- */
      screens['ap-phone'] = () => {
        const o = S.on;
        const c = o.otp;
        const verifying = c.st === 'verifying';
        let otpHtml = Kit.otp('on.otp.code', 'verifyPhone').replace(
          'aria-label="6-digit code"',
          'aria-labelledby="otp-l"',
        );
        if (c.st === 'wrong' || c.st === 'expired')
          otpHtml = otpHtml.replace('class="otp"', 'class="otp err"');
        if (verifying)
          otpHtml = otpHtml
            .replace('class="otp"', 'class="otp dis"')
            .replace(/<input /g, '<input disabled ');
        const err =
          c.st === 'wrong'
            ? `That code is not right. ${plural(c.attemptsLeft, 'attempt')} left.`
            : c.st === 'expired'
              ? 'That code has expired. Resend to get a new one.'
              : c.st === 'sendfail'
                ? 'We could not send the code. Try again in a minute.'
                : '';
        const cool = left(c.resendAt);
        return authLayout(
          `<h1 class="gs-h1">Verify your phone</h1>
    <p class="gs-sub">We sent a 6-digit code by SMS to <span class="masked">${esc(o.masked || ME().phoneMasked)}</span><span class="sr-only"> (partly hidden)</span>.</p>
    <div class="otp-group" style="margin-top:24px">
      <span class="label" id="otp-l">6-digit code</span>
      ${otpHtml}
      ${verifying ? `<div class="row small muted" style="gap:8px" aria-live="polite"><span class="spinner dark sm"></span> Checking the code…</div>` : errLine('otp-err', err)}
      <div class="otp-row">${cool ? `<button class="linklike" disabled aria-disabled="true">Resend in ${cd(c.resendAt, 's')}</button>` : `<button class="linklike" data-act="resendOtp">Resend code</button>`}${c.resendsLeft < 3 ? `<span class="muted small"> · ${c.resendsLeft === 0 ? 'no more resends' : plural(c.resendsLeft, 'resend') + ' left'}</span>` : ''}</div>
    </div>
    <p class="small muted" style="margin-top:18px">Wrong number? <button class="linklike" data-act="go" data-arg="ap-details">Change it</button></p>
    ${proto('Any 6 digits verify. 111111 is wrong (attempts count down), 000000 has expired.')}`,
          { step: 3 },
        );
      };
      actions.verifyPhone = (code) => {
        const c = S.on.otp;
        c.st = 'verifying';
        Kit.render();
        setTimeout(() => {
          if (code === '111111') {
            c.attemptsLeft--;
            if (c.attemptsLeft <= 0) return sessionEnded('toomany');
            c.st = 'wrong';
          } else if (code === '000000') c.st = 'expired';
          else {
            c.st = null;
            return Kit.go('ap-create');
          }
          Kit.render();
          document.querySelector('#view .otp input')?.focus();
        }, 900);
      };
      actions.resendOtp = () => {
        const c = S.on.otp;
        if (c.resendsLeft <= 0) return sessionEnded('toomany');
        c.resendsLeft--;
        c.resendAt = Date.now() + 60000;
        c.st = null;
        c.code.fill('');
        Kit.toast('New code sent');
      };
      function sessionEnded(kind) {
        const kindWas = S.on.kind;
        S.on = freshOn();
        S.on.kind = kindWas;
        S.on.notice = kind;
        Kit.go('ap-id');
      }

      /* ---- Step 4: create account (complete) ---- */
      screens['ap-create'] = () => {
        const o = S.on;
        const pp = o.kind === 'passport';
        const a = pp ? APPLICANTS.passport : APPLICANTS.id;
        const name = [o.first || a.first, o.other || a.other, o.surname || a.surname]
          .filter(Boolean)
          .join(' ');
        const busy = o.create.st === 'busy';
        const alert =
          o.create.st === 'unavailable'
            ? `<div class="callout callout-danger" role="alert" tabindex="-1" id="cr-alert">${icon('alert', 17)}<div>Your account could not be created. Try again.</div></div>`
            : o.create.st === 'expired'
              ? ''
              : '';
        return authLayout(
          `<h1 class="gs-h1">Create your account</h1>
    <div class="card" style="margin-top:20px">
      <dl class="dl" style="padding:4px 18px">
        <div><dt>Name</dt><dd>${esc(name)}</dd></div>
        <div><dt>${pp ? 'Passport' : 'National ID'}</dt><dd><span class="mono">${esc(o.number || a.number)}</span>${pp ? ` · ${esc(countryName(o.country || a.country))}` : ` <span class="vbadge-ok">${icon('check', 12, 2.6)} Matches the register</span>`}</dd></div>
        <div><dt>Phone</dt><dd><span class="masked">${esc(o.masked || a.phoneMasked)}</span> <span class="vbadge-ok">${icon('check', 12, 2.6)} Verified</span></dd></div>
        <div><dt>Email</dt><dd>${esc(o.email || a.email)}</dd></div>
      </dl>
    </div>
    ${pp ? `<div class="callout callout-info" style="margin-top:16px">${icon('info', 17)}<div>Your identity will be verified by the Commission when you submit your first request.</div></div>` : ''}
    ${alert ? `<div style="margin-top:16px">${alert}</div>` : ''}
    <button class="btn btn-primary btn-block" style="margin-top:20px" data-act="createAccount" ${busy ? 'disabled' : ''}>${busy ? '<span class="spinner"></span> Creating your account…' : 'Create account'}</button>
    ${proto(`Outcome on create: <a data-act="setCreate" data-arg="ok" style="${o.create.outcome === 'ok' ? '' : 'opacity:.7;text-decoration:none'}">account created</a> · <a data-act="setCreate" data-arg="unavailable" style="${o.create.outcome === 'unavailable' ? '' : 'opacity:.7;text-decoration:none'}">account error (502)</a> · <a data-act="setCreate" data-arg="expired" style="${o.create.outcome === 'expired' ? '' : 'opacity:.7;text-decoration:none'}">session expired (410)</a>`)}`,
          { step: 4 },
        );
      };
      actions.setCreate = (k) => {
        S.on.create.outcome = k;
        S.on.create.st = null;
        Kit.render();
      };
      actions.createAccount = () => {
        const o = S.on;
        o.create.st = 'busy';
        Kit.render();
        setTimeout(() => {
          if (o.create.outcome === 'unavailable') {
            o.create.st = 'unavailable';
            o.create.outcome = 'ok';
            Kit.render();
            return document.getElementById('cr-alert')?.focus();
          }
          if (o.create.outcome === 'expired') return sessionEnded('ended');
          o.create.st = null;
          o.pwResendAt = Date.now() + 60000;
          Kit.go('ap-email');
        }, 1200);
      };

      /* ---- Step 5: check your email ---- */
      screens['ap-email'] = () => {
        const o = S.on;
        const pp = o.kind === 'passport';
        const cool = left(o.pwResendAt);
        return authLayout(
          `<div class="success-mark" style="background:var(--brand-soft);color:var(--brand-ink)">${icon('mail', 30, 2)}</div>
    <h1 class="gs-h1">Check your email</h1>
    <p class="gs-sub">Your account is ready. Set your password with the link sent to <span class="masked">${esc(o.emailMasked || (pp ? APPLICANTS.passport : APPLICANTS.id).emailMasked)}</span>. It expires in 24 hours.</p>
    ${pp ? `<div class="callout callout-info" style="margin-top:18px">${icon('info', 17)}<div>Your identity will be verified by the Commission when you submit your first request.</div></div>` : ''}
    <div class="stack" style="margin-top:22px;gap:10px">
      <button class="btn btn-secondary btn-block" data-act="resendPw" ${cool ? 'disabled' : ''}>${cool ? `<span>Resend email in ${cd(o.pwResendAt, 's')}</span>` : `${icon('send', 16)} Resend email`}</button>
      <a class="btn btn-ghost btn-block" href="${KC}#login">Sign in</a>
    </div>
    ${proto(`<a href="${KC}#update-password">Open the set-password link</a> (Keycloak page). After saving a password you land on <a data-act="signedIn" data-arg="${pp ? 'passport' : 'id'}">My requests</a>.`)}`,
          { step: 5 },
        );
      };
      actions.resendPw = () => {
        S.on.pwResendAt = Date.now() + 60000;
        Kit.toast('Email sent again');
      };
      actions.signedIn = (world) => {
        setWorld(world || 'id');
        S.reqs = []; // a new account has no requests yet
        Kit.go('requests');
      };
      function setWorld(w) {
        S.world = w;
        S.reqs = w === 'passport' ? passportRequests() : makeRequests();
        S.list = { page: 1, pageSize: 10, load: null };
        S.detail = { load: null, notFound: false, dl: null, force410: false, force409: false };
        S.f = freshForm();
      }

      /* =====================================================================
       * Signed-in portal (applicant shell)
       * ===================================================================== */
      const NAV = [
        ['My requests', 'list', FILE + '#requests'],
        ['New request', 'plus', FILE + '#new'],
      ];
      const shell = (body, active = 'My requests') =>
        portalShell(body, {
          nav: NAV,
          active,
          avatar: { initials: ME().initials, href: '#account' },
        });
      function skeletonList(n = 3) {
        return `<div class="card" aria-busy="true" aria-label="Loading">${Array.from({ length: n }, () => `<div class="skel-card"><span class="skeleton circle"></span><div style="flex:1;display:grid;gap:10px;padding-top:4px"><span class="skeleton" style="width:40%;height:14px"></span><span class="skeleton" style="width:65%"></span><span class="skeleton" style="width:25%"></span></div></div>`).join('')}</div>`;
      }
      function errorCard(what, act) {
        return `<div class="card"><div class="empty" style="padding:48px 20px"><div class="art" style="grid-template-columns:30px"><span style="background:var(--danger-soft);color:var(--danger)">${icon('wifiOff', 16)}</span></div><h4>We could not load ${what}</h4><p>Check your connection and try again.</p><div style="margin-top:14px"><button class="btn btn-secondary" data-act="${act}">${icon('refresh', 16)} Try again</button></div></div></div>`;
      }
      const pendingBanner = () =>
        ME().identityStatus === 'pending-verification'
          ? `<div class="banner banner-warn" style="margin-top:20px">${icon('userCheck', 18)}<div><b>Your passport is not verified yet.</b> The Commission checks it when it receives your first request.</div></div>`
          : '';

      /* ---------- My requests (#251) ---------- */
      function reqChip(r) {
        if (OPEN.includes(r.status)) return deadlineChip(r.deadlineAt);
        if (GRANTED.includes(r.status) && r.pkg) {
          if (r.pkg.expiresAt <= now())
            return `<span class="badge">${icon('lock', 13)} Download expired</span>`;
          return deadlineChip(r.pkg.expiresAt, { label: 'Download by', soon: 3, expiry: true });
        }
        return '';
      }
      function reqCard(r) {
        const st = STATUS[r.status];
        const tone = TONES[st.tone];
        const c = comm(r.comm);
        const when = r.decision
          ? `Decided ${fmtDate(r.decision.decidedAt)}`
          : r.withdrawnAt
            ? `Withdrawn ${fmtDate(r.withdrawnAt)}`
            : r.closedAt
              ? `Closed ${fmtDate(r.closedAt)}`
              : `Submitted ${fmtDate(r.submittedAt)}`;
        return `<a class="cardlink" href="#request" data-act="go" data-arg="request|${r.id}"><div class="lc"><span class="ico" style="background:${tone[0]};color:${tone[1]}">${icon(st.icon, 18)}</span><div class="body">
          <div class="t">${esc(r.officer.name)}</div>
          <div class="d"><span class="mono">${r.ref}</span> · ${c.code}</div>
          <div class="d">${when}</div>
          <div class="tags">${statusBadge(r.status)}${reqChip(r)}</div></div><span class="chev">${icon('right', 20)}</span></div></a>`;
      }
      screens.requests = () => {
        const L = S.list;
        const head = `<div class="head-row"><h1 class="page-title">My requests</h1>${S.reqs.length && !L.load ? `<button class="btn btn-primary" data-act="newRequest">${icon('plus', 16)} New request</button>` : ''}</div>${pendingBanner()}`;
        let body;
        if (L.load === 'loading') body = skeletonList(4);
        else if (L.load === 'error') body = errorCard('your requests', 'retryList');
        else if (!S.reqs.length)
          body = `<div class="card"><div class="empty" style="padding:56px 20px"><div class="art" style="grid-template-columns:30px"><span style="background:var(--brand-soft);color:var(--brand-ink)">${icon('file', 16)}</span></div><h4>No requests yet</h4><p>Ask to see a public officer’s declaration.</p><div style="margin-top:14px"><button class="btn btn-primary" data-act="newRequest">${icon('plus', 16)} New request</button></div></div></div>`;
        else {
          const rows = [...S.reqs].sort((a, b) => b.submittedAt - a.submittedAt);
          const pages = Math.max(1, Math.ceil(rows.length / L.pageSize));
          const page = Math.min(L.page, pages);
          const shown = rows.slice((page - 1) * L.pageSize, page * L.pageSize);
          body = `<div class="card">${shown.map(reqCard).join('')}${rows.length > L.pageSize ? Kit.pager({ page, pageSize: L.pageSize, total: rows.length, act: 'listPage', label: 'requests' }) : ''}</div>`;
        }
        return shell(
          `<div class="page" style="max-width:880px">${head}<div style="margin-top:24px">${body}</div></div>`,
        );
      };
      actions.listPage = (p) => {
        S.list.page = Number(p);
        Kit.render();
        document.getElementById('view').scrollTop = 0;
      };
      actions.retryList = () => {
        S.list.load = 'loading';
        Kit.render();
        setTimeout(() => {
          S.list.load = null;
          Kit.render();
        }, 900);
      };
      actions.newRequest = () => {
        S.f = freshForm();
        Kit.go('new');
      };

      /* ---------- Request detail (#251, #261) ---------- */
      function bannerFor(r) {
        const c = comm(r.comm);
        const b = (kind, ic, html) =>
          `<div class="banner banner-${kind}">${icon(ic, 18)}<div>${html}</div></div>`;
        const late = OPEN.includes(r.status) && dd(TODAY, r.deadlineAt) < 0;
        switch (r.status) {
          case 'submitted':
            return b(
              'info',
              'send',
              `<b>${c.code} received your request on ${fmtDate(r.submittedAt)}.</b> Next, it identifies the officer on its roster.`,
            );
          case 'pending-applicant-verification':
            return b(
              'warn',
              'userCheck',
              `<b>Waiting for ${c.code} to verify your passport.</b> Your request moves on once it is verified.`,
            );
          case 'officer-unresolved':
            return b(
              'info',
              'search',
              `<b>${c.code} is identifying the officer on its roster.</b>`,
            );
          case 'awaiting-representations':
            return b(
              'info',
              'bell',
              `<b>${c.code} has notified the officer.</b> They can respond until ${fmtDate(r.windowEndsAt)}. Then ${c.code} decides.`,
            );
          case 'under-decision':
            return late
              ? b(
                  'danger',
                  'alert',
                  `<b>The decision is ${plural(-dd(TODAY, r.deadlineAt), 'day')} overdue.</b> It was due ${fmtDate(r.deadlineAt)}. Contact ${c.code} to follow up.`,
                )
              : b(
                  'info',
                  'scale',
                  `<b>${c.code} is deciding.</b> It must decide by ${fmtDate(r.deadlineAt)}.`,
                );
          case 'granted':
            return r.pkg && r.pkg.expiresAt <= now()
              ? b(
                  'neutral',
                  'lock',
                  `<b>Access was granted on ${fmtDate(r.decision.decidedAt)}.</b> The download window closed on ${fmtDate(r.pkg.expiresAt)}.`,
                )
              : b(
                  'ok',
                  'check',
                  `<b>Access granted on ${fmtDate(r.decision.decidedAt)}.</b> Download your package ${dd(TODAY, r.pkg.expiresAt) === 0 ? 'today' : 'by ' + fmtDate(r.pkg.expiresAt)}.`,
                );
          case 'partially-granted':
            return r.pkg && r.pkg.expiresAt <= now()
              ? b(
                  'neutral',
                  'lock',
                  `<b>Access was partially granted on ${fmtDate(r.decision.decidedAt)}.</b> The download window closed on ${fmtDate(r.pkg.expiresAt)}.`,

                  'listCheck',

            return b(

              'ban',
              `<b>${c.code} denied your request on ${fmtDate(r.decision.decidedAt)}.</b> This decision is final. You may seek relief from the court.`,
            );
          case 'cannot-identify':
            return b(

              'userX',
              `<b>${c.code} could not identify this officer on its roster, so the request is closed.</b> Check the officer’s details and make a new request.<div><button class="btn btn-secondary btn-sm" data-act="copyToNew" data-arg="${r.id}">${icon('copy', 15)} New request with these details</button></div>`,
            );

            return b(
              'neutral',
              'undo',
              `<b>You withdrew this request on ${fmtDate(r.withdrawnAt)}.</b>`,

      }
      function timerCard(r) {
        if (!OPEN.includes(r.status)) return ''; // decided or closed: the progress card carries the dates
        const total = 30;
        const decided = r.decision;
        const endAt = decided ? decided.decidedAt : TODAY;
        const elapsed = Math.min(total, Math.max(0, dd(r.submittedAt, endAt)));
        const n = dd(TODAY, r.deadlineAt);
        let big, sub, cls;
        if (decided) {
          const late = dd(r.deadlineAt, decided.decidedAt) > 0;
          big = late
            ? `Decided ${plural(dd(r.deadlineAt, decided.decidedAt), 'day')} late`
            : 'Decided on time';
          sub = `${fmtDate(decided.decidedAt)} · due ${fmtDate(r.deadlineAt)}`;
          cls = late ? 'warn' : 'ok';
        } else if (n < 0) {
          big = `Decision ${plural(-n, 'day')} overdue`;
          sub = `Was due ${fmtDate(r.deadlineAt)}`;
          cls = 'danger';
        } else {
          big = n === 0 ? 'Decision due today' : `Decision due in ${plural(n, 'day')}`;
          sub = `Due ${fmtDate(r.deadlineAt)} · day ${elapsed} of ${total}`;
          cls = n <= 5 ? 'warn' : '';
        }
        const w = Math.min(100, Math.round((elapsed / total) * 100));
        const winPct =
          r.status === 'awaiting-representations' && r.windowEndsAt
            ? Math.min(
                96,
                Math.max(4, Math.round((dd(r.submittedAt, r.windowEndsAt) / total) * 100)),
              )
            : null;
        return `<div class="card card-pad"><div class="timer" role="group" aria-label="Decision period">
          <div class="big ${!decided && cls ? cls : ''}">${big}</div>
          <div class="small muted" style="margin-top:2px">${sub}</div>
          <div class="bar ${cls}" role="img" aria-label="${elapsed} of ${total} days used"><i style="width:${w}%"></i>${winPct ? `<span class="mark" style="left:${winPct}%" title="Officer responds by ${fmtDate(r.windowEndsAt)}"></span>` : ''}</div>
          <div class="scale"><span>${shortDate(r.submittedAt)}</span><span>${shortDate(r.deadlineAt)}</span></div>
          ${winPct ? `<div class="small muted row" style="gap:8px;margin-top:10px"><span class="mark-key" aria-hidden="true"></span>Officer can respond until ${shortDate(r.windowEndsAt)}</div>` : ''}
        </div></div>`;
      }
      function progressCard(r) {
        const c = comm(r.comm);
        const li = (state, title, sub = '') =>
          `<li class="${state}"><span class="tl-ico ${state}">${state === 'done' ? icon('check', 14, 2.6) : state === 'fail' ? icon('x', 14, 2.6) : state === 'cur' ? icon('dot', 12) : ''}</span><div><div class="tl-t">${title}</div>${sub ? `<div class="tl-s">${sub}</div>` : ''}</div></li>`;
        const e = [
          li('done', 'Received', `${fmtDateTime(r.submittedAt)} · acknowledged by SMS and email`),
        ];
        if (r.passport || r.verifiedAt)
          e.push(
            r.status === 'pending-applicant-verification'
              ? li('cur', 'Passport verification', `Waiting for ${c.code}`)

          e.push(li('fail', 'Withdrawn by you', fmtDateTime(r.withdrawnAt)));

            r.notifiedAt

          e.push(
            r.decision

      }
      function helpCard(r) {
        const c = comm(r.comm);
        return `<div class="card card-pad"><div class="section-title">Contact ${c.code}</div><div style="display:grid;gap:8px;margin-top:12px;font-size:14px"><div class="row" style="gap:10px">${icon('phone', 16)} ${c.phone}</div><div class="row" style="gap:10px;min-width:0">${icon('mail', 16)} <span class="truncate">${c.email}</span></div></div><p class="small muted" style="margin-top:10px">Quote <span class="mono">${r.ref}</span>.</p></div>`;
      }
      function decisionCard(r) {
        const d = r.decision;

        const partial = d.outcome === 'partial-grant';
        return `<div class="card">
          <div class="card-head"><h3 style="flex:1">Decision</h3>${docLink('access-decision', 'Decision letter')}</div>

      function packageCard(r) {

        const thumb = `<div class="wm ${expired ? 'off' : ''}" aria-hidden="true"><span class="cf">CONFIDENTIAL</span>${[20, 30, 38, 46, 76, 84, 92, 100].map((t, i) => `<span class="ln" style="top:${t}px;${i % 3 === 2 ? 'right:34px' : ''}"></span>`).join('')}<span class="mk">${wmText}</span></div>`;
        const dlText = dls.length
          ? `Downloaded ${plural(dls.length, 'time')} · last ${fmtDateTime(dls[dls.length - 1])}`
          : 'Not downloaded yet';
        let acts;

          acts = `<div class="pkg-acts"><span class="badge">${icon('lock', 13)} Expired ${fmtDate(p.expiresAt)}</span><span class="small muted">${dlText}</span></div><p class="small muted" style="margin-top:10px">Contact ${comm(r.comm).code} if you still need it.</p>`;
        else {
          const busy = S.detail.dl === 'busy';

              : `<span class="exp-line ${days <= 3 ? 'warn' : ''}">${icon('clock', 15)} Expires ${fmtDate(p.expiresAt)} · ${plural(days, 'day')} left</span>`;
          acts = `<div class="pkg-acts"><a class="btn btn-primary" href="${DOCS}#access-package" target="_blank" rel="noopener" data-act="download" data-arg="${r.id}" ${busy ? 'aria-disabled="true"' : ''}>${busy ? '<span class="spinner"></span> Preparing link…' : `${icon('download', 16)} Download`}</a>${expLine}</div>
            ${S.detail.dl === 'error' ? `<div style="margin-top:10px">${errLine('dl-err', 'Could not start the download. Try again.')}</div>` : ''}
            <p class="small muted" style="margin-top:10px">${dlText}</p>`;
        }
        return `<div class="card"><div class="card-head"><h3 style="flex:1">Package</h3><span class="badge badge-danger">${icon('lock', 12, 2.2)} Confidential</span></div>
          <div class="card-pad"><div class="pkg">${thumb}<div class="pkg-body">
            <div style="font-weight:500">Issued to you on ${fmtDate(p.issuedAt)}.</div>

          </div></div></div>
          <div class="card-foot small" style="color:var(--ink-2);gap:8px">${icon('alert', 15)}<span style="flex:1;min-width:0">Publishing or sharing it without ${comm(r.comm).code}’s permission is an offence. ${tip('Act s.36(4): a person who publishes information obtained under section 36 without prior permission of the responsible Commission, or knowingly disseminates it, commits an offence.', 'Legal basis')}</span></div>
        </div>`;
      }
      function requestCard(r) {
        const o = r.officer;
        const showScope = !(r.decision && r.decision.outcome === 'partial-grant');
        const row = (k, v) =>
          v ? `<div><div class="sec-label">${k}</div><div class="prose">${esc(v)}</div></div>` : '';
        return `<div class="card"><div class="card-head"><h3>Your request</h3></div><div class="card-pad kv-list">

      screens.request = () => {
        const D = S.detail;

        if (D.load === 'loading')
          return shell(
            `<div class="page">${back}<span class="skeleton" style="display:block;width:280px;height:30px"></span><span class="skeleton" style="display:block;width:200px;height:14px;margin-top:14px"></span><div class="side-grid"><div class="stack"><div class="card card-pad" aria-busy="true"><span class="skeleton" style="width:70%"></span><span class="skeleton" style="width:40%;margin-top:12px;display:block"></span></div>${skeletonList(1)}</div><div class="side"><div class="card card-pad"><span class="skeleton" style="width:60%;height:20px;display:block"></span><span class="skeleton" style="width:90%;margin-top:14px;display:block"></span></div></div></div></div>`,

        const c = comm(r.comm);

          ${back}
          <div class="head-row"><h1 class="page-title">${esc(r.officer.name)}</h1></div>
          <div class="meta-line"><span>${refChip(r.ref)}</span><span>${statusBadge(r.status)}</span><span>${icon('building', 15)} ${esc(c.name)}</span></div>
          <div class="side-grid">
            <div class="stack" style="min-width:0;gap:20px">

              ${packageCard(r)}
              ${decisionCard(r)}
              ${requestCard(r)}
            </div>
            <div class="side">${timerCard(r)}${progressCard(r)}${helpCard(r)}</div>
          </div>

      };
      actions.retryDetail = () => {
        S.detail.load = 'loading';

        setTimeout(() => {

      actions.download = (id) => {

      actions.copyToNew = (id) => {

      /* =====================================================================

      const FK_STEPS = [

        { t: 'Your particulars', h: 'Your particulars' },
        { t: 'Officer sought', h: 'Officer sought' },
        { t: 'Information sought', h: 'Information sought' },
        { t: 'Scope', h: 'Scope' },
        { t: 'Declare', h: 'Check and declare' },
      ];
      function prefillI() {

            postal: a.postal,
            physical: a.physical,

      function validateStep(n) {

      const stepOk = (n) => !Object.keys(validateStep(n)).length;
      function fkField(

      function fkStepBody(n) {

          const combo = open
            ? `<div class="combo"><div class="input-group ${e.comm ? 'is-invalid' : ''}"><span class="ico">${icon('search', 17)}</span><input id="f-fk-q" class="input" role="combobox" aria-expanded="true" aria-controls="fk-comm-list" aria-autocomplete="list" autocomplete="off" data-bind="f.q" data-live value="${esc(f.q)}" placeholder="Search, e.g. Teachers" ${e.comm ? 'aria-invalid="true"' : ''}/></div>
              <div class="combo-list" id="fk-comm-list" role="listbox" aria-label="Commissions">${list.length ? list.map((x) => `<button class="combo-opt ${x.slug === f.comm ? 'act' : ''}" role="option" aria-selected="${x.slug === f.comm}" data-act="pickComm" data-arg="${x.slug}"><span class="mono-code">${x.code}</span><span class="nm">${esc(x.name)}</span>${x.slug === f.comm ? icon('check', 16, 2.4) : ''}</button>`).join('') : `<div class="combo-empty">No match for "${esc(f.q)}". Try its short name, e.g. TSC.</div>`}</div></div>`
            : `<div class="chosen"><span class="mono-code">${c.code}</span><div style="flex:1;min-width:0;font-weight:600;line-height:1.3">${esc(c.name)}</div><button class="btn btn-ghost btn-sm" data-act="reopenComm">Change</button></div>`;
          return `<div class="field"><label class="label" for="f-fk-q"><span>Responsible Commission</span> ${tip('Each public officer declares to one Responsible Commission, e.g. TSC for teachers and PSC for civil servants.')}</label>${combo}${e.comm ? `<div style="margin-top:8px">${errLine('fk-comm-err', e.comm)}</div>` : ''}</div>
            ${c && !c.years.length ? `<div class="callout callout-warn" style="margin-top:14px">${icon('alert', 17)}<div>No declarations are available from ${esc(c.name)} yet. Try again after its first declaration period.</div></div>` : ''}`;
        }
        if (n === 2) {
          return `<div class="lock-block"><h3>${icon('lock', 15)} From your account</h3><div class="lock-grid">
              <div><div class="k">Name</div><div class="v">${esc(a.full)}</div></div>
              <div><div class="k">${a.kind === 'passport' ? 'Passport' : 'National ID'}</div><div class="v"><span class="mono">${a.number}</span>${a.kind === 'passport' ? ` · ${countryName(a.country)}` : ''} ${a.identityStatus === 'verified' ? `<span class="vbadge-ok">${icon('check', 12, 2.6)} Verified</span>` : `<span class="vbadge-ok vbadge-warn">${icon('clock', 12, 2.4)} Pending</span>`}</div></div>
              <div><div class="k">Telephone</div><div class="v">${fmtPhone(a.phone)}</div></div>
              <div><div class="k">Email</div><div class="v">${esc(a.email)}</div></div>
            </div></div>
            <div class="stack" style="margin-top:20px">
              <div class="grid-2c">${fkField('Postal address', 'f.partI.postal', 'postal', { ph: 'P.O. Box 12345-00100, Nairobi' })}${fkField('Physical address', 'f.partI.physical', 'physical', { ph: 'Road, estate, town' })}</div>
              ${fkField('Occupation', 'f.partI.occupation', 'occupation', { ph: 'e.g. Journalist' })}
            </div>`;
        }
        if (n === 3)
          return `<div class="stack">
            ${fkField('Name', 'f.partII.name', 'name', { ph: 'Full name of the public officer' })}
            <div class="grid-2c">${fkField('Entity', 'f.partII.entity', 'entity', { ph: 'Ministry, county or authority' })}${fkField('Work station', 'f.partII.workStation', 'ws', { ph: 'Office and town', opt: true })}</div>
            ${fkField('Personnel file number', 'f.partII.fileNo', 'fileNo', { opt: true, hint: 'Only if you know it.' })}
          </div>`;
        if (n === 4)
          return `<div class="stack">
            ${fkField('Information you want', 'f.partIII.what', 'what', { area: true, max: 4000, rows: 3, ph: 'e.g. Land and vehicles declared in 2025 and 2026' })}
            ${fkField(`Reason for requiring it ${tip('Show a legitimate interest and good cause in furtherance of the objectives of the Act. The Commission decides on this.')}`, 'f.partIII.reason', 'reason', { area: true, max: 4000, rows: 5, ph: 'Why you need it and how it relates to the officer’s public duties' })}
            ${fkField('Other information', 'f.partIII.other', 'other', { area: true, max: 4000, rows: 3, opt: true, ph: 'Anything else that supports your request' })}
          </div>`;
        if (n === 5) {
          const c = comm(f.comm) || COMMS[0];
          return scopePicker('f.scope', { years: c.years, err: e, idp: 'fk' });
        }
        if (n === 6) {
          const c = comm(f.comm);
          const sc = f.scope;
          const scope = {
            years: c ? c.years.filter((y) => sc.yr[y]) : [],
            spouses: sc.spouses,
            children: sc.children,
            sections: SECTIONS.filter((s) => sc.sec[s.k]).map((s) => s.k),
            clar: sc.clar,
          };
          const sec = (n2, title, body) =>
            `<div class="rev"><div class="rev-h"><h3>${title}</h3><button class="btn btn-ghost btn-sm" data-act="fkGo" data-arg="${n2}">${icon('pencil', 14)} Edit</button></div>${body}</div>`;
          const dl = (rows) =>
            `<dl>${rows
              .filter((x) => x[1])
              .map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`)
              .join('')}</dl>`;
          return `${a.identityStatus !== 'verified' ? `<div class="callout callout-info" style="margin-bottom:18px">${icon('info', 17)}<div>${c ? c.code : 'The Commission'} verifies your passport before it processes this request.</div></div>` : ''}
            <div class="card fk-card">
              ${sec(1, 'Commission', `<div style="font-size:14.5px">${c ? esc(c.name) : ''}</div>`)}

                2,
                'Your particulars',
                dl([
                  ['Name', a.full],
                  [a.kind === 'passport' ? 'Passport' : 'National ID', a.number],
                  ['Postal address', f.partI.postal],
                  ['Physical address', f.partI.physical],
                  ['Telephone', fmtPhone(a.phone)],
                  ['Email', a.email],
                  ['Occupation', f.partI.occupation],
                ]),
              )}
              ${sec(
                3,
                'Officer sought',
                dl([
                  ['Name', f.partII.name],
                  ['Entity', f.partII.entity],
                  ['Work station', f.partII.workStation],
                  ['Personnel file number', f.partII.fileNo],
                ]),
              )}
              ${sec(
                4,
                'Information sought',
                dl([
                  ['Information', f.partIII.what],
                  ['Reason', f.partIII.reason],
                  ['Other information', f.partIII.other],
                ]),
              )}
              <div class="rev" style="border-bottom:0;padding-bottom:0"><div class="rev-h"><h3>Scope</h3><button class="btn btn-ghost btn-sm" data-act="fkGo" data-arg="5">${icon('pencil', 14)} Edit</button></div>${scope.years.length && scope.sections.length ? scopeView(scope) : '<span class="muted small">Not chosen</span>'}</div>
            </div>
            <div class="declare-box ${e.declared ? 'err' : ''}">
              ${checkbox('f.declared', 'I declare that the information I have given above is true, complete and correct to the best of my knowledge.')}
              <div class="small muted" style="margin:8px 0 0 32px">${fmtDate(TODAY)} · ${esc(a.full)}</div>
              ${e.declared ? `<div style="margin:8px 0 0 32px">${errLine('fk-decl-err', e.declared)}</div>` : ''}
            </div>
            ${f.serverErr === 'net' ? `<div class="banner banner-danger" style="margin-top:18px" role="alert">${icon('wifiOff', 18)}<div><b>Your request was not submitted.</b> Check your connection and try again. Your answers are still here.</div></div>` : ''}`;
        }
      }
      screens.new = () => {
        const f = S.f;
        const n = f.step;
        const c = comm(f.comm);
        const errSteps = f.errSteps || [];
        const rail = `<aside class="rail" aria-label="Form K steps">
          <button class="back" data-act="go" data-arg="requests">${icon('left', 16)} My requests</button>
          <div style="font-weight:600;font-size:15px">New request</div>
          <ol>${FK_STEPS.map((s, i) => {
            const k = i + 1;
            const st =
              k === n ? 'on' : errSteps.includes(k) ? 'err' : k < f.max && stepOk(k) ? 'done' : '';
            return `<li class="${st}"><button data-act="fkGo" data-arg="${k}" ${k > f.max ? 'disabled style="opacity:.55;cursor:default"' : ''} ${k === n ? 'aria-current="step"' : ''}><span class="n">${st === 'done' ? icon('check', 13, 2.6) : st === 'err' ? '!' : k}</span><span class="lb">${s.t}</span></button></li>`;
          }).join('')}</ol>
          <div class="meta">${c ? `<div><span class="mono-code">${c.code}</span> ${esc(c.name)}</div>` : ''}<div>${icon('clock', 15)} Decision within 30 days</div></div>
        </aside>`;
        const mprog = `<div class="mprog"><div class="row" style="justify-content:space-between"><span><b>Step ${n} of 6</b> · ${FK_STEPS[n - 1].t}</span><button class="btn btn-ghost btn-xs" data-act="go" data-arg="requests">Cancel</button></div><div class="bar">${FK_STEPS.map((s, i) => `<i class="${i + 1 < n ? 'done' : i + 1 === n ? 'done' : ''}" style="${i + 1 === n ? 'opacity:.45' : ''}"></i>`).join('')}</div></div>`;
        const sub =
          n === 3
            ? 'As precisely as you can. The Commission must identify the officer on its roster.'
            : n === 5
              ? 'Ask only for what your interest requires. The Commission may grant less.'
              : '';
        const serverBanner =
          f.serverErr === '400' && f.serverStep === n
            ? `<div class="banner banner-danger" role="alert" style="margin-bottom:18px">${icon('alert', 18)}<div><b>Your request was not submitted.</b> Fix the highlighted field and submit again.</div></div>`
            : '';
        const body = fkStepBody(n);
        const fill = n >= 2 && n <= 5 ? proto(`<a data-act="fkFill">Fill sample answers</a>`) : '';
        const actionsBar = `<div class="actions">${n > 1 ? `<button class="btn btn-secondary" data-act="fkBack">${icon('left', 16)} Back</button>` : ''}<span class="spacer hide-sm"></span><button class="btn btn-primary" data-act="${n === 6 ? 'fkSubmit' : 'fkNext'}" ${f.busy ? 'disabled' : ''}>${f.busy ? '<span class="spinner"></span> Submitting…' : n === 6 ? `${icon('send', 16)} Submit request` : `Continue ${icon('right', 16)}`}</button></div>`;
        return shell(
          `<div class="wiz">${rail}<main class="wiz-main">${mprog}
            <div class="wiz-head"><h1>${FK_STEPS[n - 1].h}</h1>${sub ? `<p>${sub}</p>` : ''}</div>
            ${serverBanner}
            ${n === 1 || n === 6 ? body : `<div class="card fk-card">${body}</div>`}
            ${fill}
            ${actionsBar}
          </main></div>`,
          'New request',
        );
      };
      actions.pickComm = (slug) => {
        const f = S.f;
        if (f.comm !== slug) f.scope.yr = {};
        f.comm = slug;
        f.comboOpen = false;
        f.q = '';
        f.err = {};
        Kit.render();
      };
      actions.reopenComm = () => {
        S.f.comboOpen = true;
        Kit.render();
        setTimeout(() => document.getElementById('f-fk-q')?.focus(), 0);
      };
      actions.fkGo = (k) => {
        k = Number(k);
        if (k > S.f.max) return;
        S.f.step = k;
        S.f.err = S.f.tried[k] ? validateStep(k) : {};
        if (k === 2) prefillI();
        Kit.render();
        document.getElementById('view').scrollTop = 0;
      };
      actions.fkBack = () => actions.fkGo(S.f.step - 1);
      actions.fkNext = () => {
        const f = S.f;
        const e = validateStep(f.step);
        f.tried[f.step] = true;
        f.err = e;
        if (Object.keys(e).length) {
          Kit.render();
          const first = document.querySelector('#view [aria-invalid="true"], #view .ferr');
          first?.focus?.();
          return;
        }
        if (f.serverErr === '400' && f.serverStep === f.step) f.serverErr = null;
        f.errSteps = (f.errSteps || []).filter((x) => x !== f.step);
        f.step++;
        f.max = Math.max(f.max, f.step);
        f.err = f.tried[f.step] ? validateStep(f.step) : {};
        if (f.step === 2) prefillI();
        Kit.render();
        document.getElementById('view').scrollTop = 0;
      };
      actions.fkFill = () => {
        const f = S.f;
        if (!f.comm) f.comm = 'psc';
        f.comboOpen = false;
        prefillI();
        Object.assign(f.partII, {
          name: 'Peter Mwangi Kamau',
          entity: 'State Department for Housing and Urban Development',
          workStation: 'Ardhi House, Nairobi',
          fileNo: '',
        });
        Object.assign(f.partIII, { ...INFO_ASSETS });
        f.scope.yr = { 2025: true, 2026: true };
        f.scope.sec = { assets: true, liabilities: true, other: true };
        Object.assign(f.scope, { spouses: true, children: false, clar: true });
        f.err = {};
        Kit.render();
      };
      actions.fkSubmit = () => {
        const f = S.f;
        f.tried[6] = true;
        const bad = [1, 2, 3, 4, 5].filter((k) => !stepOk(k));
        if (bad.length) {
          f.errSteps = bad;
          f.tried[bad[0]] = true;
          f.step = bad[0];
          f.err = validateStep(bad[0]);
          Kit.render();
          return;
        }
        f.err = validateStep(6);
        if (f.err.declared) return Kit.render();
        f.busy = true;
        f.serverErr = null;
        Kit.render();
        setTimeout(() => {
          f.busy = false;
          if (f.forceNet) {
            f.forceNet = false;
            f.serverErr = 'net';
            return Kit.render();
          }
          if (f.force400) {
            f.force400 = false;
            f.serverErr = '400';
            f.serverStep = 3;
            f.errSteps = [3];
            f.step = 3;
            f.err = { name: 'Enter the officer’s full name.' };
            return Kit.render();
          }
          const c = comm(f.comm);
          const passport = ME().identityStatus !== 'verified';
          const n = 152 + S.reqs.length;
          const r = R({
            ref: `ARQ-${c.code}-2026-${String(n).padStart(7, '0')}-${'KMPX7'[n % 5]}`,
            comm: f.comm,
            status: passport ? 'pending-applicant-verification' : 'submitted',
            passport,
            submittedAt: TODAY,
            officer: { ...f.partII },
            info: { ...f.partIII },
            scope: {
              years: c.years.filter((y) => f.scope.yr[y]),
              spouses: f.scope.spouses,
              children: f.scope.children,
              sections: SECTIONS.filter((s) => f.scope.sec[s.k]).map((s) => s.k),
              clar: f.scope.clar,
            },
          });
          r.submittedAt = TODAY.getTime();
          r.deadlineAt = addDays(r.submittedAt, 30);
          S.reqs.unshift(r);
          S.lastId = r.id;
          S.list.page = 1;
          Kit.go('submitted');
        }, 1200);
      };

      /* ---------- submission success (#251) ---------- */
      screens.submitted = () => {
        const r = findReq(S.lastId) || S.reqs[0];
        const c = comm(r.comm);
        const pending = r.status === 'pending-applicant-verification';
        return shell(`<div class="page" style="max-width:640px;text-align:center">

          <div style="margin-top:18px">${refChip(r.ref, { lg: true })}</div>

          ${pending ? `<div class="callout callout-info" style="margin-top:18px;text-align:left">${icon('info', 17)}<div>${c.code} verifies your passport first.</div></div>` : ''}
          <div class="row wrap" style="justify-content:center;gap:10px;margin-top:26px"><button class="btn btn-primary" data-act="go" data-arg="request|${r.id}">View request</button><button class="btn btn-ghost" data-act="go" data-arg="requests">My requests</button></div>
        </div>`);
      };

      /* ---------- account (avatar) ---------- */
      screens.account = () => {
        const a = ME();
        return shell(
          `<div class="page" style="max-width:640px"><h1 class="page-title">Account</h1>
          <div class="card" style="margin-top:22px"><dl class="dl" style="padding:4px 24px">
            <div><dt>Name</dt><dd>${esc(a.full)}</dd></div>
            <div><dt>${a.kind === 'passport' ? 'Passport' : 'National ID'}</dt><dd><span class="mono">${a.number}</span>${a.kind === 'passport' ? ` · ${countryName(a.country)}` : ''}</dd></div>
            <div><dt>Identity</dt><dd>${a.identityStatus === 'verified' ? `<span class="badge badge-ok">${icon('check', 12, 2.4)} Verified</span>` : `<span class="badge badge-warn">${icon('clock', 12, 2.4)} Pending verification</span>`}</dd></div>
            <div><dt>Phone</dt><dd>${a.phoneMasked}</dd></div>
            <div><dt>Email</dt><dd>${esc(a.email)}</dd></div>
          </dl><div class="card-foot"><a class="btn btn-secondary btn-sm" href="${KC}#update-password">${icon('key', 15)} Change password</a><a class="btn btn-ghost btn-sm" href="${KC}#logout">${icon('logout', 15)} Sign out</a></div></div>
          ${a.identityStatus !== 'verified' ? `<p class="small muted" style="margin-top:12px">The Commission verifies your passport when it receives your first request.</p>` : ''}
          </div>`,
          '',
        );
      };

      /* =====================================================================
       * Reference: primitives (#249) and copy tables
       * ===================================================================== */
      screens.primitives = () => {
        const d = (n) => addDays(TODAY, n);
        const req = {
          years: [2025, 2026],
          spouses: true,
          children: true,
          sections: ['income', 'assets', 'liabilities'],
          clar: true,
        };
        const gr = {
          years: [2026],
          spouses: true,
          children: false,
          sections: ['assets', 'liabilities'],
          clar: true,
        };
        return shell(
          `<div class="page docpage" style="max-width:960px">
          <h1 class="page-title">UI primitives, round 11</h1>
          <h2>DeadlineChip ${Kit.badge('#249')}</h2>
          <div class="card"><div class="prim"><div class="prim-h">Decision deadline (soon = 5 days)</div><div class="row wrap" style="gap:8px">${deadlineChip(d(26))}${deadlineChip(d(3))}${deadlineChip(d(0))}${deadlineChip(d(-7))}${deadlineChip(d(-6), { done: d(-10) })}${deadlineChip(d(-6), { done: d(-2) })}</div></div>
          <div class="prim"><div class="prim-h">Download window (soon = 3 days)</div><div class="row wrap" style="gap:8px">${deadlineChip(d(13), { label: 'Download by', soon: 3, expiry: true })}${deadlineChip(d(2), { label: 'Download by', soon: 3, expiry: true })}${deadlineChip(now() + 5 * 3600000, { label: 'Download by', soon: 3, expiry: true })}${deadlineChip(d(-3), { label: 'Download by', soon: 3, expiry: true })}</div></div>

          <div class="prim"><div class="prim-h">Validation</div>${scopePicker('prim.b', { years: [2025, 2026], err: { years: 'Choose at least one year.', sections: 'Choose at least one section.' }, idp: 'pb' })}</div>
          <div class="prim"><div class="prim-h">Restricted to the requested scope (partial grant, console)</div>${scopePicker('prim.c', { years: [2025, 2026], restrict: req, idp: 'pc' })}</div>

              checkbox(

      };
      S.prim = {
        a: {
          yr: { 2026: true },
          spouses: true,
          children: false,
          sec: { assets: true, liabilities: true },
          clar: false,

      screens.copy = () => {

          `<div class="table-wrap card" style="overflow:auto"><table class="ctable"><thead><tr>${head.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;

        const stRows = Object.keys(STATUS).map((k) => {

          return `<tr><td><code>${k}</code></td><td>${statusBadge(k)}</td><td>${
            tmp && tmp.status === k
              ? bannerFor(tmp)
                  .replace(/<button[\s\S]*?<\/button>/, '')

                    /class="banner banner-\w+"/,

        });
        return shell(
          `<div class="page docpage" style="max-width:1040px">
