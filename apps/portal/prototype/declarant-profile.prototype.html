<!-- Demo assumption: this file follows the after-submission world (declarant-after-submission.prototype.html): John Kennedy onboarded at TSC on 14 Apr 2026 and his initial declaration DCI-TSC-2026-0003418-P was received on 28 Apr 2026, so the access log has history. -->

      }
      .dl.pad {

      }
      @container app (min-width: 700px) {
        .dl.pad {
          padding: 2px 24px 4px;
        }
      }
      .dl > div {
        align-items: center;
      }
      .dl dd {
        display: flex;
        align-items: center;
        justify-content: flex-end;

        flex-wrap: wrap;
        min-width: 0;
      }
      .v-ok {
        display: inline-flex;

        background: var(--ok-soft);
        color: var(--ok);
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
      }
      .lock-note {
        display: flex;

        align-items: flex-start;
        font-size: 13.5px;
        color: var(--muted);

      .lock-note svg {
        flex: none;
        margin-top: 2px;
      }
      .item .when {
        font-size: 13px;
        color: var(--muted);

        text-align: right;
      }
      .item.click {
        cursor: pointer;
      }
      .item.click:hover {
        background: #fbfaf8;
      }
      .item.gone .t,
      .item.gone .d {
        color: var(--muted);
      }
      .ico.warn {
        background: var(--warn-soft) !important;
        color: var(--warn) !important;
      }
      .ico.info {
        background: #eaf2fd !important;
        color: #1f5fbf !important;
      }
      .ico.brand {
        background: var(--brand-soft) !important;
        color: var(--brand-ink) !important;
      }
      .ico.ok {
        background: var(--ok-soft) !important;
        color: var(--ok) !important;
      }
      .chips {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        scrollbar-width: none;
        padding: 2px;
        margin: 0 -2px 14px;
      }
      .sk-line {
        display: block;
        height: 12px;
        margin: 10px 0;
      }
      .cool {
        font-size: 13.5px;
        color: var(--muted);
      }
      .done-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 8px 0 4px;
      }
      .done-box .success-mark {
        margin-bottom: 14px;
        width: 56px;
        height: 56px;
      }

        display: grid;

      @container app (min-width: 700px) {

      }
      @container app (max-width: 599px) {
        .item .when {
          grid-column: 2;
          grid-row: 3;
          text-align: left;
        }
      }
      .row-actions {
        display: flex;
        gap: 6px;
        align-items: center;
        flex: none;
      }
    </style>
    <script src="../../../packages/ui/prototype/kit.js"></script>

  <body>

      /* Access log (ADR-008 "Who accessed my declaration"). Newest first after sort. */

        const rows = [

            ref: ARQ1,

      function contactCard() {

        const c = S.chg;
        if (!c) return '';

      <div style="margin-top:14px">${note(`<b>Prototype.</b> ${isEmail ? 'taken@example.com' : '700 000 000'} is in use. Real app asks for a sign-in code first.`)}</div>`;
          foot = `<button class="btn btn-ghost" data-act="closeModal">Cancel</button><button class="btn btn-primary" data-act="sendCode" ${c.busy ? 'disabled aria-busy="true"' : ''}>${c.busy ? '<span class="spinner"></span> Sending…' : 'Send code'}</button>`;

      <div class="row" style="margin-top:16px;gap:10px">${c.cool > 0 ? `<span class="cool" aria-live="polite">Resend in ${Math.floor(c.cool / 60)}:${String(c.cool % 60).padStart(2, '0')}</span>` : `<button class="btn btn-ghost btn-sm" data-act="resend">${icon('refresh', 15)} Resend code</button>`}<span class="spacer"></span><button class="btn btn-ghost btn-sm" data-act="chgBack">Change ${isEmail ? 'email' : 'number'}</button></div>
      <div style="margin-top:14px">${note('<b>Prototype.</b> 123456 verifies; anything else is wrong.')}</div>`;

      /* ---------- Security ---------- */

    ${S.sessions
      .map(
        (s) =>
          `<div class="item ${s.revoked ? 'gone' : ''}"><span class="ico">${icon(s.ico, 17)}</span><div class="item-body"><div class="t">${s.dev}</div><div class="d">${s.where} · ${s.revoked ? 'Signed out just now' : s.last}</div></div>${s.current ? '<span class="item-tag"><span class="badge badge-ok">This device</span></span>' : ''}<div class="acts">${s.current ? '' : s.revoked ? `<span class="badge">${icon('logout', 12)}Signed out</span>` : `<button class="btn btn-secondary btn-sm" data-act="revoke" data-arg="${s.id}" aria-label="Sign out of ${s.dev}">Sign out</button>`}</div></div>`,
      )
      .join('')}
    <div class="card-foot small muted">Don't recognise a device? Sign it out and change your password.</div>
  </section>`;
        const ps = 8;
        const rows = S.activity.slice((S.actPage - 1) * ps, S.actPage * ps);
        const activity = `<section class="card" aria-labelledby="h-act">
    <div class="card-head"><h3 id="h-act">Recent activity</h3></div>
    ${rows
      .map((a) => {

        return `<div class="item"><span class="ico ${tone}">${icon(ic, 16)}</span><div class="item-body"><div class="t">${t}</div><div class="d">${[how, a.dev, a.where].filter(Boolean).join(' · ')}</div></div><span class="when">${fmtDateTime(a.at)}</span></div>`;
      })
      .join('')}
    ${Kit.pager({ page: S.actPage, pageSize: ps, total: S.activity.length, act: 'actPage' })}
  </section>`;
        return `<div class="stack-lg">${signin}${devices}${activity}</div>`;
      }

      /* ---------- Notifications ---------- */
      function notificationsBody() {
        const rows = [
          ['calendar', 'Filing reminders', '30, 14 and 7 days before a declaration is due'],
          ['msg', 'Clarifications and decisions', 'When your Commission writes to you'],

        return `<div class="stack-lg">

      <div class="card-head"><h3 id="h-nt">Messages</h3></div>
      ${rows.map(([ic, t, d]) => `<div class="item"><span class="ico">${icon(ic, 17)}</span><div class="item-body"><div class="t">${t}</div><div class="d">${d}</div></div><span class="item-tag"><span class="badge">${icon('lock', 12)}SMS and email</span></span></div>`).join('')}

      /* ---------- Access log ---------- */
      function accessLogBody() {
        const all = logRows();
        if (!all.length)
          return `<div class="card">${Kit.empty('No one has accessed your declarations', 'When someone opens one, it shows here.', { icon: 'eye' })}</div>`;
        const counts = { all: all.length };
        all.forEach((r) => (counts[r.kind] = (counts[r.kind] || 0) + 1));
        const f = S.log.filter;
        const list = f === 'all' ? all : all.filter((r) => r.kind === f);
        const pending = all.find((r) => r.outcome === 'waiting');
        const chips = `<div class="chips" role="group" aria-label="Filter">${[['all', 'All'], ...Object.entries(KIND).map(([k, v]) => [k, v[0]])].map(([k, l]) => `<button class="chip ${f === k ? 'on' : ''}" data-act="logFilter" data-arg="${k}" aria-pressed="${f === k}">${l}<span class="n">${counts[k] || 0}</span></button>`).join('')}</div>`;
        const { page: p, pageSize: ps } = S.log;
        const rows = list.slice((p - 1) * ps, p * ps);
        const items = rows
          .map((r) => {
            const idx = all.indexOf(r);
            const [, ic, tone] = KIND[r.kind];
            const tag =
              r.outcome === 'waiting'
                ? `<span class="item-tag"><span class="badge badge-warn">Waiting for decision</span></span>`
                : '';
            return `<div class="item click" role="button" tabindex="0" data-act="logOpen" data-arg="${idx}"><span class="ico ${tone}">${icon(ic, 16)}</span><div class="item-body"><div class="t">${esc(r.who)} <span class="muted" style="font-weight:400">· ${esc(r.org)}</span></div><div class="d">${esc(r.what)} <span class="mono" style="font-size:12.5px">${r.ref}</span></div></div>${tag}<span class="when">${fmtDate(r.at)}</span></div>`;
          })
          .join('');
        return `${pending ? `<div class="callout callout-warn" style="margin-bottom:16px;align-items:center">${icon('bell', 17)}<div style="flex:1">An access request is waiting for TSC's decision.</div><button class="btn btn-secondary btn-sm" data-act="logOpen" data-arg="${all.indexOf(pending)}">View</button></div>` : ''}
    ${chips}
    <div class="card">${items || Kit.empty('Nothing here', 'No entries of this kind.', { icon: 'filter', action: '<button class="btn btn-secondary btn-sm" data-act="logFilter" data-arg="all">Show all</button>' })}
      ${list.length ? Kit.pager({ page: p, pageSize: ps, total: list.length, act: 'logPage' }) : ''}
    </div>
    <p class="small muted" style="margin-top:12px;display:flex;gap:6px;align-items:center">${icon('lock', 14)}Staff names are hidden. Entries cannot be changed.</p>`;
      }
      function logDrawer() {
        const r = logRows()[S.modal.id];
        if (!r) return '';
        const out = {
          waiting: '<span class="badge badge-warn">Waiting for decision</span>',
          disclosed: '<span class="badge badge-info">Copy disclosed</span>',
          viewed: '<span class="badge">Viewed</span>',
          checked: '<span class="badge">Checked</span>',
        }[r.outcome];
        const steps = r.steps
          ? `<h4 class="section-title" style="font-size:14.5px;margin:22px 0 12px">Timeline</h4><ol class="timeline">${r.steps.map(([at, t, ic]) => `<li><span class="tl-ico">${icon(ic, 14)}</span><div><div class="tl-t">${t}</div>${at ? `<div class="tl-s">${fmtDateTime(at)}</div>` : ''}</div></li>`).join('')}</ol>`
          : '';
        return drawer({
          title: esc(r.what),
          body: `<div class="kv" style="grid-template-columns:1fr">
        <div><div class="k">When</div><div class="v">${fmtDateTime(r.at)}</div></div>
        <div><div class="k">Who</div><div class="v">${esc(r.who)}<div class="small muted" style="font-weight:400">${esc(r.org)}</div></div></div>
        <div><div class="k">Record</div><div class="v mono">${r.ref}</div></div>
        <div><div class="k">Why</div><div class="v">${esc(r.basis)}</div></div>
        ${r.scope ? `<div><div class="k">What was shared</div><div class="v">${esc(r.scope)}</div></div>` : ''}
        <div><div class="k">Outcome</div><div class="v">${out}</div></div>
      </div>${steps}
      ${r.outcome === 'waiting' ? `<div class="callout callout-info" style="margin-top:18px">${icon('info', 17)}<div>To object, reply to TSC's notice before it decides.</div></div>` : ''}`,
        });
      }

      /* ---------- actions ---------- */
      const actions = {
        retry: () => {
          S.st = 'loading';
          Kit.render();
          setTimeout(() => {
            S.st = 'ok';
            Kit.render();
          }, 900);
        },
        openChange: (k) => {
          openChange(k);
          Kit.render();
          setTimeout(() => document.getElementById('f-chg-value')?.focus(), 30);
        },
        chgBack: () => {
          S.chg.step = 'enter';
          S.chg.codeErr = null;
          Kit.render();
        },
        sendCode: () => {
          const c = S.chg;
          const v = String(c.value || '').trim();
          const isEmail = c.kind === 'email';
          c.err = '';
          if (isEmail) {
            if (!v) c.err = 'Enter your new email.';
            else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))
              c.err = 'Enter an email like name@example.com.';
            else if (v.toLowerCase() === S.email) c.err = 'This is already your email.';
            else if (v.toLowerCase() === 'taken@example.com')
              c.err = 'Another Adili account uses this email. Use a different one.';
          } else {
            const d = v.replace(/\D/g, '').replace(/^0/, '');
            if (!d) c.err = 'Enter your new phone number.';
            else if (!/^[17]\d{8}$/.test(d))
              c.err = 'Enter a Kenyan mobile number, like 712 345 678.';
            else if ('+254 ' + d.replace(/(\d{3})(\d{3})(\d{3})/, '$1 $2 $3') === S.phone)
              c.err = 'This is already your phone number.';
            else if (d === '700000000')
              c.err = 'Another Adili account uses this number. Use a different one.';
            else c.value = d.replace(/(\d{3})(\d{3})(\d{3})/, '$1 $2 $3');
          }
          if (c.err) return Kit.render();
          c.busy = true;
          Kit.render();
          setTimeout(() => {
            c.busy = false;
            c.step = 'code';
            c.codeErr = null;
            c.left = 5;
            c.code = blankCode();
            startCool();
            Kit.render();
            document.querySelector('#layer .otp input')?.focus();
          }, 700);
        },
        resend: () => {
          S.chg.codeErr = null;
          S.chg.left = 5;
          startCool();
          Kit.toast('New code sent');
        },
        verifyCode: (code) => {
          const c = S.chg;
          if (!c) return;
          if (c.codeErr === 'expired') return Kit.render();
          if (code === '123456') {
            const isEmail = c.kind === 'email';
            if (isEmail) {
              S.email = c.value.toLowerCase();
              S.emailAt = Kit.TODAY.toISOString();
            } else {
              S.phone = '+254 ' + c.value;
              S.phoneAt = Kit.TODAY.toISOString();
            }
            S.activity.unshift({
              id: 'a' + Date.now(),
              at: '2026-09-26T10:30',
              kind: isEmail ? 'email-changed' : 'phone-changed',
              dev: 'Chrome on Windows',
              where: 'Eldoret',
            });
            c.step = 'done';
          } else {
            c.left--;
            if (c.left <= 0) c.step = 'failed';
            else c.codeErr = 'wrong';
          }
          Kit.render();
          document.querySelector('#layer .otp input')?.focus();
        },
        passkey: () => Kit.toast('Would open passkey setup on this device'),
        revoke: (id) => {
          const s = S.sessions.find((x) => x.id === id);
          s.revoked = true;
          S.activity.unshift({
            id: 'a' + Date.now(),
            at: '2026-09-26T10:30',
            kind: 'signout-remote',
            dev: s.dev,
            where: s.where,
          });
          Kit.toast(`Signed out of ${s.dev}`);
        },
        signoutAll: () => {
          const n = S.sessions.filter((s) => !s.current && !s.revoked).length;
          S.sessions.forEach((s) => {
            if (!s.current) s.revoked = true;
          });
          S.modal = null;
          Kit.toast(`Signed out of ${plural(n, 'other device')}`);
        },
        actPage: (p) => {
          S.actPage = +p;
          Kit.render();
        },
        logFilter: (k) => {
          S.log.filter = k;
          S.log.page = 1;
          Kit.render();
        },
        logPage: (p) => {
          S.log.page = +p;
          Kit.render();
        },
        logOpen: (i) => {
          S.modal = { kind: 'log', id: +i };
          Kit.render();
        },
      };

      const modals = {
        contact: contactModal,
        log: logDrawer,
        signoutAll: () => {
          const n = S.sessions.filter((s) => !s.current && !s.revoked).length;
          return dialog({
            title: `Sign out of ${plural(n, 'other device')}?`,
            icon: 'logout',

        },
      };

          }

        ['j-error', '#74 Profile: error', at('profile', () => (S.st = 'error'))],
        ['j-chg-enter', 'Change email: enter', chgAt('email', 'enter')],
        [
          'j-chg-taken',

            value: 'taken@example.com',

        ['j-chg-sent', 'Change phone: code sent', chgAt('phone', 'code')],

        [
          'j-chg-done',
          'Change email: verified',

            openChange('email');
            S.email = 'jkennedy@tsc.go.ke';

          at('security', () => (S.modal = { kind: 'signoutAll' })),

        [

        ['j-act-p2', 'Security: activity page 2', at('security', () => (S.actPage = 2))],

        [

        ],
        [
