      /* ---------- Who accessed my declaration (#269) and RegisterTimeline (#268) ---------- */
      const MONTHS_LONG = [
        'January',
        'February',
        'March',
        'April',
        'May',
        'June',
        'July',
        'August',
        'September',
        'October',
        'November',
        'December',
      ];
      const monthOf = (d) => {
        const x = new Date(d);

      const obadge = (o) =>
        `<span class="badge badge-${OUTCOME[o].kind}">${icon(OUTCOME[o].icon, 12, 2.4)} ${OUTCOME[o].label}</span>`;
      /* One register entry -> icon, tone, title and actor text. Covers every kind in access.yaml RegisterEntry. */
      function regText(e) {
        const r = e.req;
        const c = e.copy;
        const code = (r ? r.comm : c.v.comm).code;
        const lea = r && r.kind === 'lea';
        const who = r ? (lea ? r.agency : r.applicant) : '';
        const officer = `Access officer, ${code}`;
        const T = (icon, tone, title, actor) => ({ icon, tone, title, actor });
        switch (e.kind) {
          case 'received':
            return T(
              'inbox',
              '',
              lea ? 'Law-enforcement request received' : 'Access request received',
              lea ? who : `Applicant ${who}`,
            );
          case 'verified':
            return T(
              'userCheck',
              '',
              lea ? 'Agency request verified' : 'Applicant identity verified',
              officer,
            );
          case 'notified':
            return T(
              'bell',
              'brand',
              `${who} asked to see your declaration`,
              `Notified by ${code}`,
            );
          case 'representations':
            return T('send', '', STANCE[r.reps.stance], 'You');
          case 'decided': {
            if (lea) return T('shield', 'info', `${who} was granted access`, `Case ${r.caseRef}`);
            const o = r.decision.outcome;
            return T(
              o === 'deny' ? 'ban' : 'stamp',
              o === 'deny' ? 'danger' : o === 'grant' ? 'ok' : 'warn',
              o === 'grant'
                ? `${code} granted access`
                : o === 'partial-grant'
                  ? `${code} partially granted access`
                  : `${code} denied access`,
              officer,
            );
          }
          case 'package-issued':
            return T(
              'box',
              '',
              `Package issued to ${who}`,
              `Watermarked · download until ${fmtDate(r.pkg.expiresAt)}`,
            );
          case 'downloaded':
            return T(
              'download',
              '',
              `${who} downloaded the package`,
              lea ? 'Law-enforcement agency' : 'Applicant',
            );
          case 'expired':
            return T('clock', '', 'Download period ended', '');
          case 'withdrawn':
            return T('undo', '', `${who} withdrew the request`, 'Applicant');
          case 'cannot-identify':
            return T('userX', '', 'Officer could not be identified', officer);
          case 'self-access':
            return c.rep
              ? T(
                  'stamp',
                  '',
                  `${c.rep} obtained a certified copy for you`,
                  `Your representative · ${c.delivery}`,
                )
              : T('stamp', '', 'You obtained a certified copy', `You · version ${c.v.version}`);
        }
      }
      // List density: full-width rows, grouped by month. Accessible list with time text.
      function regRow(e, { arg = null, tag = '' } = {}) {
        const t = regText(e);
        const inner = `<span class="rt-ico ${t.tone}">${icon(t.icon, 16)}</span><span class="rt-b"><span class="rt-t">${esc(t.title)}</span><span class="rt-s">${t.actor ? `${esc(t.actor)}<span class="ms-sep"> · </span>` : ''}<span class="mono ms-br">${e.ref}</span></span>${tag ? `<span class="rt-tag">${tag}</span>` : ''}</span><time datetime="${e.at}"><span class="sr-only">${fmtDateTime(e.at)}</span><span aria-hidden="true">${fmtDate(e.at)}</span></time>`;
        return `<li class="rt-e">${arg != null ? `<button class="rt-row" data-act="regOpen" data-arg="${arg}">${inner}<span class="rt-chev">${icon('right', 16)}</span></button>` : `<div class="rt-row">${inner}</div>`}</li>`;
      }
      function regList(rows, argOf, tagOf) {
        let out = '';
        let month = '';
        let buf = [];
        const flush = () => {
          if (buf.length)
            out += `<h3 class="rt-month">${month}</h3><ol class="rt">${buf.join('')}</ol>`;
          buf = [];
        };
        rows.forEach((e) => {
          const m = monthOf(e.at);
          if (m !== month) {
            flush();
            month = m;
          }
          buf.push(regRow(e, { arg: argOf ? argOf(e) : null, tag: tagOf ? tagOf(e) : '' }));
        });
        flush();
        return out;

      }
      const activeReq = () =>
        reqs().find(
          (r) =>
            r.kind === 'form-k' &&
            !r.decision &&
            !r.withdrawnAt &&
            !r.reps &&
            new Date(r.windowEndsAt) > TODAY,

      const footNote = (text, tip, label) =>
        `<p class="small muted foot-note">${icon('lock', 14)}<span>${text}</span>${Kit.tip(tip, { label })}</p>`;

      function whoAccessedBody() {
        const all = register();
        if (!all.length)
          return `<div class="card">${Kit.empty('No one has accessed your declaration', 'Requests, decisions, downloads and certified copies will show here.', { icon: 'eye' })}</div>`;
        const counts = { all: all.length };
        all.forEach((e) => (counts[group(e)] = (counts[group(e)] || 0) + 1));
        const f = S.wa.filter;
        const list = f === 'all' ? all : all.filter((e) => group(e) === f);
        const act = activeReq();
        const callout = act
          ? `<div class="callout callout-warn wa-callout">${icon('bell', 17)}<div style="flex:1">${esc(act.applicant)} asked to see your declaration. Respond by ${fmtDate(act.windowEndsAt)}.</div><a class="btn btn-secondary btn-sm" href="${AFTER}#access-request">Respond</a></div>`
          : '';
        const chips = `<div class="chips" role="group" aria-label="Filter">${FILTERS.map(([k, l]) => `<button class="chip ${f === k ? 'on' : ''}" data-act="waFilter" data-arg="${k}" aria-pressed="${f === k}">${l}<span class="n">${counts[k] || 0}</span></button>`).join('')}</div>`;
        const { pageSize: ps } = S.wa;
        const p = Math.min(S.wa.page, Math.max(1, Math.ceil(list.length / ps)));
        const rows = list.slice((p - 1) * ps, p * ps);
        return `${callout}${chips}
    <div class="card">${
      rows.length
        ? regList(rows, (e) => all.indexOf(e))
        : Kit.empty('Nothing here', 'No entries of this kind.', {
            icon: 'filter',
            action:
              '<button class="btn btn-secondary btn-sm" data-act="waFilter" data-arg="all">Show all</button>',
          })
    }${list.length ? Kit.pager({ page: p, pageSize: ps, total: list.length, act: 'waPage' }) : ''}</div>
    ${footNote('Entries cannot be changed.', 'Access requests show from when you were notified. Law-enforcement requests show once access is granted. Staff names are not shown.', 'What shows here')}`;
      }

      function reqState(r) {
        if (r.withdrawnAt) return '<span class="badge">Withdrawn</span>';
        if (r.decision) return obadge(r.decision.outcome);
        if (r.reps?.stance !== 'consent' && new Date(r.windowEndsAt) > TODAY)
          return '<span class="badge badge-warn">Waiting for your response</span>';
        return '<span class="badge badge-info">Under decision</span>';
      }
      function regDrawer() {
        const e = register()[S.modal.id];
        if (!e) return '';
        const kv = (k, v) => `<div><div class="k">${k}</div><div class="v">${v}</div></div>`;
        if (e.kind === 'self-access') {
          const c = e.copy;
          return drawer({
            title: 'Certified copy',
            body: `<div class="kv" style="grid-template-columns:1fr">
        ${kv('Declaration', `${c.v.type}, version ${c.v.version}<div class="small muted mono" style="font-weight:400">${c.v.ref}</div>`)}
        ${kv('Issued', fmtDateTime(c.at))}
        ${kv('Obtained by', c.rep ? `${esc(c.rep)}, your representative<div class="small muted" style="font-weight:400">${esc(c.delivery)}</div>` : 'You, on Adili Online')}
        ${kv('Classification', `<span class="badge">${icon('lock', 12)} Restricted</span>`)}
      </div>`,
            foot: `<a class="btn btn-primary" href="${DOCS}#certified-copy" target="_blank" rel="noopener">${icon('download', 16)} Download</a>`,
          });
        }
        const r = e.req;
        const lea = r.kind === 'lea';
        const d = r.decision;
        const rows = lea
          ? [
              kv('Agency', esc(r.agency)),
              kv('Case reference', `<span class="mono">${esc(r.caseRef)}</span>`),
              kv('Scope granted', esc(scopeText(r.scope))),
              kv(
                'Decision',
                `${obadge('grant')} <span class="small muted">${fmtDate(d.at)}</span>`,
              ),
            ]
          : [
              kv('Applicant', esc(r.applicant)),
              kv('Purpose', esc(r.purpose)),
              kv('Scope asked', esc(scopeText(r.scope))),
              kv(
                'Your response',
                r.reps
                  ? `${STANCE[r.reps.stance]} <span class="small muted">${fmtDate(r.reps.at)}</span>`
                  : new Date(r.windowEndsAt) > TODAY
                    ? `Due by ${fmtDate(r.windowEndsAt)}`
                    : 'None',
              ),
              kv(
                'Decision',
                activeReq()?.ref === r.ref
                  ? 'Not yet'
                  : `${reqState(r)}${d ? ` <span class="small muted">${fmtDate(d.at)}</span>` : ''}`,
              ),
              d && d.outcome === 'partial-grant'
                ? kv('Scope granted', esc(scopeText(d.granted)))
                : '',
              d && d.grounds.length
                ? kv('Grounds', d.grounds.map((g) => esc(GROUNDS[g])).join('<br/>'))
                : '',
              d ? kv('Reasons', `<span style="font-weight:400">${esc(d.reasons)}</span>`) : '',
            ];
        const asc = entriesFor(r).sort((a, b) => new Date(a.at) - new Date(b.at));
        const act = activeReq()?.ref === r.ref;
        return drawer({
          title: lea ? 'Law-enforcement request' : 'Access request',
          sub: `<span class="mono">${r.ref}</span> · ${r.comm.code}`,
          body: `<div class="kv" style="grid-template-columns:1fr">${rows.join('')}</div>
      <h4 class="section-title" style="font-size:14.5px;margin:22px 0 10px">Timeline</h4>${regCompact(asc)}`,
          foot: act
            ? `<a class="btn btn-primary" href="${AFTER}#access-request">Respond by ${fmtDate(r.windowEndsAt)}</a>`
            : '',
        });
      }

      /* ---------- Certified copies (#269) ---------- */
      const CC_PAGE = 5;
      function copiesBody() {
        const vs = versionsList();
        const p = Math.min(S.cc.page, Math.max(1, Math.ceil(vs.length / CC_PAGE)));
        const rows = vs
          .slice((p - 1) * CC_PAGE, p * CC_PAGE)
          .map((v) => {
            const st = S.cc.by[v.id];
            const label = `${v.type}, version ${v.version}`;
            const act = !st
              ? `<button class="btn btn-secondary btn-sm" data-act="ccRequest" data-arg="${v.id}" aria-label="Request certified copy of ${label}">Request certified copy</button>`
              : st.status === 'pending'
                ? `<button class="btn btn-secondary btn-sm" disabled aria-live="polite"><span class="spinner dark"></span> Preparing…</button>`
                : st.status === 'failed'
                  ? `<button class="btn btn-secondary btn-sm" data-act="ccRequest" data-arg="${v.id}">${icon('refresh', 15)} Try again</button>`
                  : `<a class="btn btn-secondary btn-sm" href="${DOCS}#certified-copy" target="_blank" rel="noopener" aria-label="Download certified copy of ${label}">${icon('download', 15)} Download</a>`;
            const extra =
              st?.status === 'issued'
                ? `<div class="d cc-ok">${icon('check', 13, 2.4)} Certified ${fmtDate(st.at)}</div>`
                : st?.status === 'failed'
                  ? `<div class="d" style="color:var(--danger);font-weight:500">We could not prepare the copy. Try again.</div>`
                  : '';
            return `<div class="item cc"><span class="ico">${icon('file', 17)}</span><div class="item-body"><div class="t">${v.type} <span class="muted" style="font-weight:400">· version ${v.version}</span>${v.inForce ? '' : ' <span class="badge" style="margin-left:4px">Superseded</span>'}</div><div class="d"><span class="mono ms-br">${v.ref}</span><span class="ms-sep"> · </span><span class="nowrap ms-br">Submitted ${fmtDate(v.submittedAt)}</span></div>${extra}</div><div class="acts">${act}</div></div>`;
          })
          .join('');
        return `<div class="card">${rows}${Kit.pager({ page: p, pageSize: CC_PAGE, total: vs.length, act: 'ccPage' })}</div>
    ${footNote('Restricted, signed PDF. Each copy shows in Who accessed.', 'A certified copy is the version exactly as you submitted it, signed by your Commission. Anyone you give it to can check it with its QR code.', 'About certified copies')}`;
      }

          kind: 'form-k',

        };
        const sample = [
          { kind: 'received', at: '2026-07-18T16:02', req: arq1, hidden: true },
          { kind: 'verified', at: '2026-07-19T09:15', req: arq1, hidden: true },
          { kind: 'notified', at: arq1.notifiedAt, req: arq1 },
          { kind: 'representations', at: arq1.reps.at, req: arq1 },

        ].map((e) => ({ ...e, ref: e.req ? e.req.ref : v.ref }));

    <div class="card"><ol class="rt">${sample.map((e) => regRow(e, { tag: e.hidden ? hid : '' })).join('')}</ol></div>
    <div class="card card-pad" style="margin-top:20px">${regCompact(entriesFor(arq1).sort((a, b) => new Date(a.at) - new Date(b.at)))}</div>`;
      }

      /* ---------- actions ---------- */
      const actions = {
        retry: () => {
          S.st = 'loading';
          Kit.render();
          setTimeout(() => {
            S.st = 'ok';
            Kit.render();
          }, 900);
        },
        openChange: (k) => {
          openChange(k);
          Kit.render();
          setTimeout(() => document.getElementById('f-chg-value')?.focus(), 30);
        },
        chgBack: () => {
          S.chg.step = 'enter';
          S.chg.codeErr = null;
          Kit.render();
        },
        sendCode: () => {
          const c = S.chg;
          const v = String(c.value || '').trim();
          const isEmail = c.kind === 'email';
          c.err = '';
          if (isEmail) {
            if (!v) c.err = 'Enter your new email.';
            else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))
              c.err = 'Enter an email like name@example.com.';
            else if (v.toLowerCase() === S.email) c.err = 'This is already your email.';
            else if (v.toLowerCase() === 'taken@example.com')
              c.err = 'Another Adili account uses this email. Use a different one.';
          } else {
            const d = v.replace(/\D/g, '').replace(/^0/, '');
            if (!d) c.err = 'Enter your new phone number.';
            else if (!/^[17]\d{8}$/.test(d))
              c.err = 'Enter a Kenyan mobile number, like 712 345 678.';
            else if ('+254 ' + d.replace(/(\d{3})(\d{3})(\d{3})/, '$1 $2 $3') === S.phone)
              c.err = 'This is already your phone number.';
            else if (d === '700000000')
              c.err = 'Another Adili account uses this number. Use a different one.';
            else c.value = d.replace(/(\d{3})(\d{3})(\d{3})/, '$1 $2 $3');
          }
          if (c.err) return Kit.render();
          c.busy = true;
          Kit.render();
          setTimeout(() => {
            c.busy = false;
            c.step = 'code';
            c.codeErr = null;
            c.left = 5;
            c.code = blankCode();
            startCool();
            Kit.render();
            document.querySelector('#layer .otp input')?.focus();
          }, 700);
        },
        resend: () => {
          S.chg.codeErr = null;
          S.chg.left = 5;
          startCool();
          Kit.toast('New code sent');
        },
        verifyCode: (code) => {
          const c = S.chg;
          if (!c) return;
          if (c.codeErr === 'expired') return Kit.render();
          if (code === '123456') {
            const isEmail = c.kind === 'email';
            if (isEmail) {
              S.email = c.value.toLowerCase();
              S.emailAt = Kit.TODAY.toISOString();
            } else {
              S.phone = '+254 ' + c.value;
              S.phoneAt = Kit.TODAY.toISOString();
            }
            S.activity.unshift({
              id: 'a' + Date.now(),
              at: '2026-09-26T10:30',
              kind: isEmail ? 'email-changed' : 'phone-changed',
              dev: 'Chrome on Windows',
              where: 'Eldoret',
            });
            c.step = 'done';
          } else {
            c.left--;
            if (c.left <= 0) c.step = 'failed';
            else c.codeErr = 'wrong';
          }
          Kit.render();
          document.querySelector('#layer .otp input')?.focus();
        },
        passkey: () => Kit.toast('Would open passkey setup on this device'),
        revoke: (id) => {
          const s = S.sessions.find((x) => x.id === id);
          s.revoked = true;
          S.activity.unshift({
            id: 'a' + Date.now(),
            at: '2026-09-26T10:30',
            kind: 'signout-remote',
            dev: s.dev,
            where: s.where,
          });
          Kit.toast(`Signed out of ${s.dev}`);
        },
        signoutAll: () => {
          const n = S.sessions.filter((s) => !s.current && !s.revoked).length;
          S.sessions.forEach((s) => {
            if (!s.current) s.revoked = true;
          });
          S.modal = null;
          Kit.toast(`Signed out of ${plural(n, 'other device')}`);
        },
        actPage: (p) => {
          S.actPage = +p;
          Kit.render();
        },
        waFilter: (k) => {
          S.wa.filter = k;
          S.wa.page = 1;
          Kit.render();
        },
        waPage: (p) => {
          S.wa.page = +p;
          Kit.render();
          document.getElementById('view').scrollTop = 0;
        },
        regOpen: (i) => {
          S.modal = { kind: 'reg', id: +i };
          Kit.render();
        },
        ccPage: (p) => {
          S.cc.page = +p;
          Kit.render();
        },
        // POST /v1/me/certified-copies -> 202 pending; poll until issued or failed (S13).
        ccRequest: (id) => {
          S.cc.by[id] = { status: 'pending' };
          Kit.render();
          setTimeout(() => {
            if (S.cc.by[id]?.status !== 'pending') return;
            if (S.cc.fail) {
              S.cc.fail = false;
              S.cc.by[id] = { status: 'failed' };
              Kit.render();
              return;

            S.cc.by[id] = { status: 'issued', at };
            S.self.push({ id: 'sa' + Date.now(), versionId: id, at });
            Kit.toast('Certified copy ready');
          }, 2200);
        },
      };
