  </div>`;
      };

      /* =====================================================================
       * DASHBOARD (specs 03 FE-6, 04 FE-2): account card, obligations, drawer
       * ===================================================================== */
      function visibleObls() {
        return S.home.show
          .map(obl)
          .filter(Boolean)
          .filter((o) => o.status !== 'cancelled');
      }
      function sortObls(list) {
        const rank = (o) => ({ overdue: 0, due: 1, upcoming: 2, filed: 3 })[oblStatus(o)];
        return [...list].sort((a, b) => rank(a) - rank(b) || a.dueDate.localeCompare(b.dueDate));
      }
      function startBtn(o, cls = 'btn-primary') {
        const st = oblStatus(o);
        const d = declFor(o.id);
        if (st === 'filed')
          return `<button class="btn ${cls}" data-act="openSubmitted" data-arg="${d.id}">${icon('file', 16)} View acknowledgement</button>`;
        if (!S.home.startEnabled)
          return `<span class="tip-btn"><button class="btn ${cls}" disabled aria-describedby="sd-${o.id}">Start declaration</button><span class="bubble" role="tooltip" id="sd-${o.id}">Filing opens soon. You will be reminded.</span></span>`;
        if (d && (d.status === 'draft' || d.status === 'amending'))
          return `<button class="btn ${cls}" data-act="openDecl" data-arg="${d.id}">Continue declaration ${icon('right', 16)}</button>`;
        return `<button class="btn ${cls}" data-act="startDecl" data-arg="${o.id}">Start declaration ${icon('right', 16)}</button>`;
      }
      const remindersText = (o) => {
        const n = o.reminders.filter((r) => r.outcome === 'sent').length;
        return n ? `${plural(n, 'reminder')} sent` : 'No reminders sent yet';
      };
      function oblCard(o, grouped) {
        const st = oblStatus(o);
        const d = declFor(o.id);
        const pct = d && d.status !== 'submitted' ? completeness(d).pct : null;
        return `<article class="ob ${st}" data-act="openObl" data-arg="${o.id}" aria-labelledby="obh-${o.id}">
    ${st === 'due' || st === 'overdue' ? '<div class="glow"></div>' : ''}
    <div class="row wrap" style="gap:8px;margin-bottom:10px;position:relative">${statusBadge(st)}${st !== 'filed' ? `<span class="badge rel-badge ${st}">${dateText(o)}</span>` : ''}${d && d.status === 'draft' ? `<span class="badge rel-badge plain">${icon('pencil', 12)} Draft in progress</span>` : ''}${d && d.status === 'amending' ? Kit.badge('Amendment in progress', 'info') : ''}</div>
    <h3 id="obh-${o.id}">${typeLabel(o)}</h3>
    ${st === 'upcoming' ? `<p class="small muted" style="margin-top:4px">Submit from ${fmtDate(o.statementDate)}.</p>` : ''}
    <div class="meta">
      <div><div class="k">${tip('Statement date', TIP_STATEMENT, 'left')}</div><div class="v">${fmtDate(o.statementDate)}</div></div>
      <div><div class="k">Due</div><div class="v">${fmtDate(o.dueDate)}</div></div>
      <div><div class="k">Reminders</div><div class="v">${remindersText(o)}</div></div>
    </div>
    ${st === 'filed' ? `<div class="row wrap" style="gap:8px;margin:-6px 0 16px">${refChip(d.reference, 'sm')}${verBadge(d.versions.length)}${d.versions[d.versions.length - 1].late ? Kit.badge('Filed late', 'warn') : ''}</div>` : ''}
    ${pct !== null ? `<div style="margin:-4px 0 18px"><div class="row small" style="justify-content:space-between;margin-bottom:6px"><span style="font-weight:500">${pct}% complete</span><span class="muted">Saved ${fmtDateTime(d.updatedAt)}</span></div><div class="progress"><i style="width:${pct}%"></i></div></div>` : ''}
    ${st === 'overdue' ? `<div class="overdue-note" style="margin:-6px 0 16px">${icon('alert', 15)}<span><b>Overdue.</b> If you have already declared by other means, contact your Commission.</span></div>` : ''}
    <div class="acts">${startBtn(o)}<button class="btn btn-secondary" data-act="openObl" data-arg="${o.id}">Details</button></div>
  </article>`;
      }
      function obligationsSection() {
        const h = `<h2 class="sr-only" id="ob-h">Your declarations</h2>`;
        if (S.home.st === 'loading')
          return `<section aria-labelledby="ob-h" aria-busy="true">${h}<div class="ob-list">${[1, 2].map(() => `<div class="skel-card"><span class="skeleton" style="width:90px;height:22px;border-radius:12px"></span><span class="skeleton" style="width:55%;height:20px"></span><span class="skeleton" style="width:80%"></span><span class="skeleton" style="width:40%"></span><span class="skeleton" style="width:150px;height:40px;border-radius:10px"></span></div>`).join('')}</div></section>`;
        if (S.home.st === 'error')
          return `<section aria-labelledby="ob-h">${h}<div class="alert alert-danger" role="alert">${icon('alert', 17)}<div><div class="t">Could not load your declarations</div><div>Check your connection.</div><button class="btn btn-secondary btn-sm" data-act="retryHome">${icon('refresh', 15)} Try again</button></div></div></section>`;
        const list = visibleObls();
        if (S.home.st === 'empty' || !list.length)
          return `<section aria-labelledby="ob-h">${h}<div class="card">${Kit.empty('No obligations yet', 'Declarations appear here when one falls due.', { icon: 'calendar' })}</div></section>`;
        const groups = [...new Set(list.map((o) => o.commission))];
        const grouped = groups.length > 1;
        return `<section aria-labelledby="ob-h">${h}${
          grouped
            ? groups
                .map((g) => {
                  const c = comm(g);
                  return `<div style="margin-bottom:18px"><div class="ob-group-h"><span class="mono-code">${c.code}</span>${esc(c.name)}</div><div class="ob-list">${sortObls(
                    list.filter((o) => o.commission === g),
                  )
                    .map((o) => oblCard(o, true))
                    .join('')}</div></div>`;
                })
                .join('')
            : `<div class="ob-list">${sortObls(list)
                .map((o) => oblCard(o, false))
                .join('')}</div>`
        }</section>`;
      }
      function accountCard() {
        const cs = S.home.multi
          ? [
              ['tsc', ME.fileNo, '26 Sep 2026'],
              ['psc', 'PSC/2009/118204', '12 Mar 2026'],
            ]
          : [['tsc', ME.fileNo, '26 Sep 2026']];
        return `<div class="card acct">
    <div class="card-head"><span class="ico" style="background:var(--ok-soft);color:var(--ok)">${icon('userCheck', 17)}</span><div style="flex:1;min-width:0"><h3>Your account</h3><div class="small muted truncate">${ME.full}</div></div></div>
    <dl class="dl" style="padding:2px 20px 6px">
      <div><dt>Responsible Commission</dt><dd style="flex-direction:column;align-items:flex-end;gap:2px">${cs.map(([s]) => `<span>${esc(comm(s).name)}</span>`).join('')}</dd></div>
      <div><dt>Officer reference</dt><dd><span class="mono" style="font-weight:600">${ME.ofr}</span>${copyBtn(ME.ofr, 'Officer reference')}</dd></div>
      <div><dt>Email</dt><dd class="stackv"><span class="truncate" style="max-width:200px">${ME.email}</span>${vOk()}</dd></div>
      <div><dt>Phone</dt><dd class="stackv"><span>${ME.phone}</span>${vOk()}</dd></div>
    </dl>
    <div class="card-foot small muted" style="align-items:flex-start;gap:8px;flex-wrap:nowrap"><span style="display:flex;margin-top:1px">${icon('shield', 15)}</span><span>${cs.map(([s, , d]) => `Onboarded ${S.home.multi ? `at ${comm(s).code} ` : ''}on ${d}`).join('<br/>')}</span></div>
  </div>`;
      }
      screens.home = () => {
        const list = S.home.st === 'ok' ? visibleObls() : [];
        const todo = list.filter((o) => ['due', 'overdue'].includes(oblStatus(o))).length;
        const title =
          S.home.st !== 'ok' || S.home.st === 'notdecl'
            ? 'Welcome back'
            : todo
              ? `You have ${plural(todo, 'declaration')} to make`
              : list.length
                ? 'You are up to date'
                : 'Welcome to Adili';
        return portalShell(
          `<div class="page">
    <h1 class="page-title">${title}</h1>
    <div class="home-grid">
      <div class="stack-lg">${S.home.st === 'notdecl' ? accountCard() : obligationsSection()}${S.home.st === 'ok' || S.home.st === 'notdecl' ? commissionCards() : ''}</div>
      <div class="stack-lg">${S.home.st === 'notdecl' ? '' : accountCard()}
        <div class="card card-pad"><div class="section-title">Need help?</div><p class="small muted" style="margin-top:4px">Quote your officer reference. Never share your ID number or codes.</p></div>
      </div>
    </div>
  </div>`,
          { active: 'Home' },
        );
      };
      actions.retryHome = () => {
        S.home.st = 'loading';
        Kit.render();
        setTimeout(() => {
          S.home.st = 'ok';
          Kit.render();
        }, 900);
      };
      actions.openObl = (id) => {
        S.modal = { kind: 'obligation', id };
        Kit.render();
      };

      function reminderTable(o) {
        if (!o.reminders.length) return `<p class="small muted">None sent yet.</p>`;
        const ic = (r) =>
          r.outcome === 'sent'
            ? `<span style="color:var(--ok);display:flex">${icon('check', 14, 2.6)}</span>`
            : r.outcome === 'failed'
              ? `<span style="color:var(--danger);display:flex">${icon('alert', 14)}</span>`
              : `<span style="color:var(--muted);display:flex">${icon('minus', 14)}</span>`;
        return `<div class="table-wrap"><table class="rtable"><caption class="sr-only">Reminder history</caption>
    <thead><tr><th scope="col">When</th><th scope="col">Scheduled</th><th scope="col">Sent</th><th scope="col">Channels</th><th scope="col">Outcome</th></tr></thead>
    <tbody>${o.reminders.map((r) => `<tr><td style="font-weight:500" class="dt">${r.offsetDays} days before</td><td class="dt" data-l="Scheduled">${fmtDateTime(r.scheduledAt)}</td><td class="dt" data-l="Sent">${r.sentAt ? fmtDateTime(r.sentAt) : '-'}</td><td class="dt" data-l="Channels">${r.channels.length ? r.channels.map((x) => (x === 'sms' ? 'SMS' : 'Email')).join(', ') : '-'}</td><td class="oc"><span class="outcome">${ic(r)}${OUTCOME_COPY[r.outcome](r.channels)}</span></td></tr>`).join('')}</tbody></table></div>`;
      }
      modals.obligation = () => {
        const o = obl(S.modal.id);
        const c = comm(o.commission);
        const st = oblStatus(o);
        const cycle =
          o.type === 'initial'
            ? `Appointment on ${fmtDate(o.statementDate)}`
            : o.type === 'final'
              ? `Exit on ${fmtDate(o.statementDate)}`
              : `Biennial ${o.statementDate.slice(0, 4)}`;
        return drawer({
          title: typeLabel(o),
          sub: `${esc(c.name)} · <span class="mono">${c.code}</span>`,
          wide: true,
          body: `<div class="row wrap" style="gap:8px">${statusBadge(st)}${st !== 'filed' ? `<span class="badge">${relText(o)}</span>` : ''}</div>
      ${st === 'overdue' ? `<div class="alert alert-warn">${icon('alert', 16)}<div><b>Overdue.</b> If you have already declared by other means, contact your Commission.</div></div>` : ''}
      <div class="kv k3">
        <div><div class="k">Cycle</div><div class="v">${cycle}</div></div>
        <div><div class="k">${tip('Statement date', TIP_STATEMENT, 'left')}</div><div class="v">${fmtDate(o.statementDate)}</div></div>
        <div><div class="k">Due date</div><div class="v">${fmtDate(o.dueDate)}</div></div>
      </div>
      <div><div class="row wrap" style="justify-content:space-between;gap:4px 12px;margin-bottom:6px"><h4 style="font-weight:600;font-size:14.5px">Reminders</h4><span class="small muted row" style="gap:6px">${o.offsets.join(', ').replace(/, (\d+)$/, ' and $1')} days before, SMS and email ${Kit.tip(`Reminder schedule set by ${esc(c.name)}. Policy version ${o.policyVersion}.`, { label: 'Reminder schedule' })}</span></div>
      ${reminderTable(o)}</div>`,
          foot: `<button class="btn btn-secondary" data-act="closeModal">Close</button>${startBtn(o)}`,
        });
      };

      /* =====================================================================
       * DECLARATION WORKSPACE (spec 05)
       * ===================================================================== */
      const ci = () => S.decls.indexOf(cur());
      const P = (path) => `decls.${ci()}.${path}`;
      const nm = (p) => [p.first, p.other, p.surname].filter(Boolean).join(' ') || 'New person';
      const initials = (p) =>
        (((p.first || p.other || '')[0] || '') + ((p.surname || '')[0] || '')).toUpperCase() || '?';
      const childIncluded = (D, c) => {
        const a = ageOn(c.dob, D.statementDate);
        return a !== null && a < 18;
      };
      function persons(D) {
        const ps = [
          {
            key: 'officer',
            name: ME.full,
            short: 'You',
            rel: 'You',
            kind: 'self',
            initials: ME.initials,
          },
        ];
        D.hh.spouses
          .filter((s) => !s.archived)
          .forEach((s) =>
            ps.push({
              key: 'spouse:' + s.id,
              name: nm(s),
              short: s.first || 'Spouse',
              rel: s.separated ? 'Spouse, separated' : 'Spouse',
              kind: 'spouse',
              initials: initials(s),
            }),
          );
        D.hh.children
          .filter((c) => !c.archived && childIncluded(D, c))
          .forEach((c) =>
            ps.push({
              key: 'child:' + c.id,
              name: nm(c),
              short: c.first || 'Child',
              rel: 'Child',
              kind: 'child',
              initials: initials(c),
            }),
          );
        ps.forEach((p) => {
          if (!D.st[p.key]) D.st[p.key] = emptyStatement();
        });
        return ps;
      }
      const CAT = {
        income: { label: 'Income', one: 'income item', nilKey: 'incomeNil' },
        assets: { label: 'Assets', one: 'asset', nilKey: 'assetsNil' },
        liabilities: { label: 'Liabilities', one: 'liability', nilKey: 'liabilitiesNil' },
      };

      /* issues: { key: section key, field, text, go: [screen, person, tab, itemId] } */
      function bioIssues(D) {
        const b = D.bio;
        const out = [];
        const add = (field, text) => out.push({ key: 'bio', field, text, go: ['decl-bio'] });
        const dob = parseDMY(b.dob);
        const age = dob ? ageOn(b.dob, D.statementDate) : null;
        if (!dob)
          add('dob', b.dob ? 'Enter a real date as DD/MM/YYYY.' : 'Enter your date of birth.');
        else if (age < 18 || age > 100)
          add(
            'dob',
            'Check your date of birth. You must be 18 to 100 years old on the statement date.',
          );
        if (b.place.trim().length < 2) add('place', 'Enter your place of birth.');
        if (!b.marital) add('marital', 'Choose your marital status.');
        if (b.postal.trim().length < 3) add('postal', 'Enter your postal address.');
        if (b.physical.trim().length < 3) add('physical', 'Enter your physical address.');
        if (!b.nature) add('nature', 'Choose the nature of your employment.');
        else if (b.nature === 'other' && !b.natureOther.trim())
          add('natureOther', 'Describe the nature of your employment.');
        if (b.msChanged && !b.msExplain.trim())
          add('msExplain', 'Explain the change in marital status.');
        return out;
      }
      function hhIssues(D) {
        const h = D.hh;
        const out = [];
        const m = D.bio.marital;
        const add = (field, text, id) =>
          out.push({ key: 'household', field, text, go: ['decl-household', null, null, id] });
        const spouses = h.spouses.filter((s) => !s.archived);
        const kids = h.children.filter((c) => !c.archived);
        if (['single', 'divorced', 'widowed'].includes(m) && spouses.length)
          add(
            'spouses',
            `You said you are ${m}, but you added a spouse. Change your marital status in Your details, or remove the spouse.`,
          );
        if (['married', 'separated'].includes(m) && !spouses.length && !h.noSpouse)
          add('spouses', 'Add your spouse, or confirm you have none.');
        if (!m && !spouses.length && !h.noSpouse)
          add(
            'spouses',
            'Choose your marital status in Your details, then add your spouse if you have one.',
          );
        spouses.forEach((s, i) => {
          const who = s.first ? nm(s) : `Spouse ${i + 1}`;
          if (!s.surname.trim() || !s.first.trim())
            add('sp-name-' + s.id, `Enter ${who}'s surname and first name.`, s.id);
          if (s.nid && !/^\d{5,10}$/.test(s.nid))
            add('sp-nid-' + s.id, `Check ${who}'s national ID: 5 to 10 digits.`, s.id);
          if (s.kra && !/^[AP]\d{9}[A-Z]$/i.test(s.kra))
            add('sp-kra-' + s.id, `Check ${who}'s KRA PIN, e.g. A000000000Z.`, s.id);
          if (s.separated && !parseDMY(s.sepDate))
            add('sp-sep-' + s.id, `Enter the date you separated from ${who}.`, s.id);
        });
        if (!kids.length && !h.noChildren)
          add('children', 'Add your dependent children, or confirm you have none under 18.');
        kids.forEach((c, i) => {
          const who = c.first ? nm(c) : `Child ${i + 1}`;
          if (!c.surname.trim() || !c.first.trim())
            add('ch-name-' + c.id, `Enter ${who}'s surname and first name.`, c.id);
          if (!parseDMY(c.dob)) add('ch-dob-' + c.id, `Enter ${who}'s date of birth.`, c.id);
          if (c.nid && !/^\d{5,10}$/.test(c.nid))
            add('ch-nid-' + c.id, `Check ${who}'s national ID: 5 to 10 digits.`, c.id);
        });
        return out;
      }
      function itemIssues(cat, it) {
        const e = {};
        if (!it.type) e.type = 'Choose a type.';
        if (!String(it.desc).trim()) e.desc = 'Enter a short description.';
        const amt = toCents(cat === 'assets' ? it.value : it.amount);
        if (amt === null)
          e.amount =
            cat === 'income'
              ? 'Enter the approximate amount for the period.'
              : cat === 'assets'
                ? 'Enter the approximate value.'
                : 'Enter the amount outstanding.';
        else if (isNaN(amt))
          e.amount =
            'Enter an amount in shillings, e.g. 1,250,000 or 1,250,000.50. No minus signs.';
        if (cat === 'liabilities' && !String(it.creditor).trim()) e.creditor = 'Enter who you owe.';
        const abroad = cat === 'assets' ? it.loc === 'abroad' : it.abroad;
        if (cat === 'assets' && it.loc === 'kenya' && !it.county) e.county = 'Choose the county.';
        if (abroad && !it.country) e.country = 'Choose the country.';
        if (abroad && it.orig && isNaN(toCents(it.orig)))
          e.orig = 'Enter the original amount as a number.';
        if (abroad && it.orig && !it.cur) e.cur = 'Choose the original currency.';
        if (cat === 'assets' && it.joint) {
          const s = Number(it.share);
          if (!it.share || isNaN(s) || s <= 0 || s > 100)
            e.share = 'Enter your share as a percentage from 1 to 100.';
        }
        if (it.changed && !it.kind) e.kind = 'Choose what changed.';
        if (it.changed && !String(it.explain).trim()) e.explain = 'Explain the change.';
        return e;
      }
      function stIssues(D, p) {
        const st = D.st[p.key];
        const out = [];
        Object.keys(CAT).forEach((cat) => {
          const items = st[cat];
          const nil = st[CAT[cat].nilKey];
          if (!items.length && !nil)
            out.push({
              key: p.key,
              field: cat,
              text: `${p.kind === 'self' ? 'Your' : p.short + "'s"} ${CAT[cat].label.toLowerCase()}: add at least one, or tick "Nothing to declare".`,
              go: ['decl-statement', p.key, cat],
            });
          items.forEach((it, i) => {
            const e = itemIssues(cat, it);
            const ks = Object.keys(e);
            if (ks.length)
              out.push({
                key: p.key,
                field: it.id,
                text: `${p.kind === 'self' ? 'Your' : p.short + "'s"} ${CAT[cat].label.toLowerCase()}, ${it.desc ? '"' + it.desc + '"' : 'item ' + (i + 1)}: ${e[ks[0]].charAt(0).toLowerCase() + e[ks[0]].slice(1)}`,
                go: ['decl-statement', p.key, cat, it.id],
              });
          });
        });
        return out;
      }
      function otherIssues(D) {
        const o = D.other;
        const out = [];
        const add = (field, text) => out.push({ key: 'other', field, text, go: ['decl-other'] });
        o.directorships.forEach((d, i) => {
          if (!d.company.trim() || !d.role.trim() || !d.rem)
            add(
              'dir-' + d.id,
              `Directorship ${i + 1}: enter the company, your role and whether it is paid.`,
            );
        });
        o.memberships.forEach((m, i) => {
          if (!m.entity.trim() || !m.kind)
            add('mem-' + m.id, `Membership ${i + 1}: enter the name and the kind of body.`);
        });
        if (!o.dual.holds) add('dual-holds', 'Say whether you hold another citizenship.');
        else if (o.dual.holds === 'yes' && !o.dual.country)
          add('dual-country', 'Choose the other country of citizenship.');
        if (!o.dual.pending)
          add('dual-pending', 'Say whether you have a pending citizenship application.');
        o.cases.forEach((c, i) => {
          if (!c.forum.trim() || !c.ref.trim() || !c.nature.trim())
            add(
              'case-' + c.id,
              `Pending case ${i + 1}: enter the court or body, case reference and nature.`,
            );
        });
        return out;
      }
      function completeness(D) {
        const ps = persons(D);
        const secs = [];
        const st = (key, issues, has) => ({
          key,
          issues,
          state:
            !D.touched[key] && !has ? 'not-started' : issues.length ? 'incomplete' : 'complete',
        });
        const b = bioIssues(D);
        secs.push(
          st(
            'bio',
            b,
            Object.values(D.bio).some((v) => v && v !== false),
          ),
        );
        const h = hhIssues(D);
        secs.push(
          st(
            'household',
            h,
            D.hh.spouses.length || D.hh.children.length || D.hh.noSpouse || D.hh.noChildren,
          ),
        );
        ps.forEach((p) => {
          const s = D.st[p.key];
          secs.push(
            st(
              p.key,
              stIssues(D, p),
              s.income.length ||
                s.assets.length ||
                s.liabilities.length ||
                s.incomeNil ||
                s.assetsNil ||
                s.liabilitiesNil,
            ),
          );
        });
        const o = otherIssues(D);
        secs.push(
          st(
            'other',
            o,
            D.other.directorships.length ||
              D.other.memberships.length ||
              D.other.cases.length ||
              D.other.dual.holds ||
              D.other.free,
          ),
        );
        const issues = secs.flatMap((s) => s.issues);
        const pct = Math.round(
          (secs.filter((s) => s.state === 'complete').length / secs.length) * 100,
        );
        return { secs, issues, pct, persons: ps, sec: (k) => secs.find((s) => s.key === k) };
      }
      const stateWord = {
        complete: 'Complete',
        incomplete: 'Incomplete',
        'not-started': 'Not started',
        archived: 'Archived',
      };
      const stateBadge = (s) =>
        s === 'complete'
          ? Kit.badge(`${icon('check', 12, 2.8)} Complete`, 'ok')
          : s === 'incomplete'
            ? Kit.badge(`${icon('alert', 12)} Incomplete`, 'warn')
            : s === 'archived'
              ? Kit.badge('Archived')
              : Kit.badge('Not started');
      function fieldErr(D, key, fieldName) {
        const cmp = completeness(D);
        const s = cmp.sec(key);
        if (!s) return '';
        const i = s.issues.find((x) => x.field === fieldName);
        if (!i) return '';
        if (!S.ui.showErrors) {
          // format errors show straight away; missing values only after "show errors"
          const fmt = /Enter a real date|Check |No minus|as a number|from 1 to 100/.test(i.text);
          if (!fmt) return '';
        }
        return i.text;
      }

      /* autosave (debounced 1.5 s, If-Match) */
      let saveT = null,
        saveT2 = null;
      function paintSave() {
        document.querySelectorAll('[data-save]').forEach((el) => {
          el.outerHTML = saveInd();
        });
      }
      function markDirty() {
        if (S.save === 'conflict') return;
        const D = cur();
        if (!D) return;
        S.save = 'saving';
        paintSave();
        clearTimeout(saveT);
        clearTimeout(saveT2);
        saveT = setTimeout(() => {
          saveT2 = setTimeout(() => {
            if (S.saveFail) {
              S.save = 'retry';
              paintSave();
              saveT = setTimeout(() => {
                S.saveFail = false;
                markDirty();
              }, 6000);
              return;
            }
            S.save = 'saved';
            D.updatedAt = new Date().toISOString();
            Kit.render();
          }, 450);
        }, 1500);
      }
      function saveInd() {
        const s = S.save;
        const inner =
          s === 'saving'
            ? '<span class="spinner dark sm"></span> Saving…'
            : s === 'retry'
              ? `${icon('wifiOff', 14)} Could not save, retrying`
              : s === 'conflict'
                ? `${icon('alert', 14)} Edited elsewhere: reload to continue`
                : `${icon('cloud', 15)} Saved`;
        return `<span class="save-ind ${s}" data-save role="status" aria-live="${s === 'conflict' ? 'assertive' : 'polite'}">${inner}</span>`;
      }

      /* shared field helpers for the workspace */
      const toggle = (bind, label, { sub = '', disabled = false } = {}) =>
        `<label class="switch"><input type="checkbox" data-bind="${bind}" data-rerender ${Kit.getPath(S, bind) ? 'checked' : ''} ${disabled ? 'disabled' : ''}/><span class="tr"></span><span>${label}${sub ? `<div class="hint" style="margin-top:2px">${sub}</div>` : ''}</span></label>`;
      function segc(bind, options, { err = false, label = '' } = {}) {
        const v = Kit.getPath(S, bind);
        return `<div class="segc ${err ? 'is-invalid-group' : ''}" role="radiogroup" ${label ? `aria-label="${esc(label)}"` : ''}>${options.map(([k, l]) => `<label><input type="radio" name="${bind}" value="${esc(k)}" data-bind="${bind}" ${String(v) === String(k) ? 'checked' : ''}/>${esc(l)}</label>`).join('')}</div>`;
      }
      const moneyInput = (bind, { err = '', cur = 'KES', ph = '0' } = {}) =>
        `<div class="input-group ${err ? 'is-invalid' : ''}"><span class="addon">${cur}</span><input id="${fid(bind)}" class="input tabular" data-bind="${bind}" data-kes inputmode="decimal" autocomplete="off" value="${esc(Kit.getPath(S, bind))}" placeholder="${ph}" aria-invalid="${!!err}"/></div>`;
      const countySelect = (bind, err) =>
        select(bind, COUNTIES, { ph: 'Choose a county', cls: err ? 'is-invalid' : '' });
      const countrySelect = (bind, err) =>
        select(
          bind,
          COUNTRIES.map(([v, l]) => ({ v, l })),
          { ph: 'Choose a country', cls: err ? 'is-invalid' : '' },
        );
      const currencySelect = (bind, err) =>
        select(
          bind,
          CURRENCIES.map(([v, l]) => ({ v, l: `${v} · ${l}` })),
          { ph: 'Currency', cls: err ? 'is-invalid' : '' },
        );
      function dateInput(bind, { err = '' } = {}) {
        const open = S.ui.picker === bind;
        return `<div class="date-in"><div class="input-group ${err ? 'is-invalid' : ''}"><input id="${fid(bind)}" class="input tabular" data-bind="${bind}" data-date value="${esc(Kit.getPath(S, bind))}" placeholder="DD/MM/YYYY" inputmode="numeric" autocomplete="off" maxlength="10" aria-invalid="${!!err}"/><button type="button" class="btn btn-ghost" data-act="picker" data-arg="${bind}" aria-label="Choose a date from the calendar" aria-expanded="${open}">${icon('calendar', 17)}</button></div>${open ? pickerHtml(bind) : ''}</div>`;
      }
      function pickerHtml(bind) {
        const sel = parseDMY(Kit.getPath(S, bind));
        const pm = S.ui.pickerMonth || {
          y: (sel || TODAY_D).getFullYear(),
          m: (sel || TODAY_D).getMonth(),
        };
        const first = new Date(pm.y, pm.m, 1);
        const startDow = (first.getDay() + 6) % 7;
        const days = new Date(pm.y, pm.m + 1, 0).getDate();
        const years = [];
        for (let y = TODAY_D.getFullYear(); y >= 1920; y--) years.push(y);
        let cells = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su']
          .map((d) => `<span class="dow">${d}</span>`)
          .join('');
        for (let i = 0; i < startDow; i++) cells += '<span></span>';
        for (let d = 1; d <= days; d++) {
          const isSel =
            sel && sel.getFullYear() === pm.y && sel.getMonth() === pm.m && sel.getDate() === d;
          const isT =
            pm.y === TODAY_D.getFullYear() &&
            pm.m === TODAY_D.getMonth() &&
            d === TODAY_D.getDate();
          cells += `<button type="button" class="${isSel ? 'sel' : ''} ${isT ? 'today' : ''}" data-act="pickDay" data-arg="${bind}|${pm.y}|${pm.m}|${d}" aria-label="${d} ${MONTHS_LONG[pm.m]} ${pm.y}">${d}</button>`;
        }
        return `<div class="picker" role="dialog" aria-label="Choose a date"><div class="ph"><button type="button" class="btn btn-ghost icon-btn" data-act="pickerStep" data-arg="-1" aria-label="Previous month">${icon('left', 16)}</button><select aria-label="Month" data-act-change="pickerMonth">${MONTHS_LONG.map((m, i) => `<option value="${i}" ${i === pm.m ? 'selected' : ''}>${m}</option>`).join('')}</select><select aria-label="Year" data-act-change="pickerYear">${years.map((y) => `<option ${y === pm.y ? 'selected' : ''}>${y}</option>`).join('')}</select><button type="button" class="btn btn-ghost icon-btn" data-act="pickerStep" data-arg="1" aria-label="Next month">${icon('right', 16)}</button></div><div class="grid">${cells}</div></div>`;
      }
      actions.picker = (bind) => {
        S.ui.picker = S.ui.picker === bind ? null : bind;
        const sel = parseDMY(Kit.getPath(S, bind));
        S.ui.pickerMonth = sel ? { y: sel.getFullYear(), m: sel.getMonth() } : { y: 2000, m: 0 };
        if (bind.startsWith('demo.')) S.ui.pickerMonth = { y: 2026, m: 8 };
        Kit.render();
      };
      actions.pickerStep = (d) => {
        const pm = S.ui.pickerMonth;
        pm.m += +d;
        if (pm.m < 0) {
          pm.m = 11;
          pm.y--;
        }
        if (pm.m > 11) {
          pm.m = 0;
          pm.y++;
        }
        Kit.render();
      };
      actions.pickerMonth = (el) => {
        S.ui.pickerMonth.m = +el.value;
        Kit.render();
      };
      actions.pickerYear = (el) => {
        S.ui.pickerMonth.y = +el.value;
        Kit.render();
      };
      actions.pickDay = (a) => {
        const [bind, y, m, d] = a.split('|');
        Kit.setPath(
          S,
          bind,
          `${String(d).padStart(2, '0')}/${String(+m + 1).padStart(2, '0')}/${y}`,
        );
        S.ui.picker = null;
        if (bind.startsWith('decls.')) markDirty();
        Kit.render();
        document.getElementById(fid(bind))?.focus();
      };

      /* section navigation */
      const SECS = [
        ['bio', 'Your details', '', 'decl-bio'],
        ['household', 'Spouses and children', '', 'decl-household'],
        ['statements', 'Financial statements', '', 'decl-statement'],
        ['other', 'Other information', '', 'decl-other'],
        ['summary', 'Summary', 'Check and submit', 'decl-summary'],
      ];
      function curSec() {
        const m = {
          'decl-bio': 'bio',
          'decl-household': 'household',
          'decl-statement': 'statements',
          'decl-other': 'other',
          'decl-summary': 'summary',
          'decl-overview': 'overview',
        };
        return m[S.screen];
      }
      function sectionNav() {
        const D = cur();
        const c = comm(D.commission);
        const cmp = completeness(D);
        const on = curSec();
        const stOf = (k) =>
          k === 'statements'
            ? cmp.persons.every((p) => cmp.sec(p.key).state === 'complete')
              ? 'complete'
              : cmp.persons.some((p) => cmp.sec(p.key).state !== 'not-started')
                ? 'incomplete'
                : 'not-started'
            : k === 'summary'
              ? ''
              : cmp.sec(k).state;
        return `<nav class="snav" aria-label="Declaration sections">
    <button class="btn btn-ghost btn-sm" style="margin-left:-10px" data-act="go" data-arg="declarations">${icon('left', 16)} My declarations</button>
    <button class="linklike" style="display:block;margin-top:14px;text-decoration:none;text-align:left" data-act="go" data-arg="decl-overview"><div style="font-weight:600;font-size:15.5px">${TYPE_LABEL[D.type]}</div><div class="small muted" style="font-weight:400">To ${esc(c.name)}</div></button>
    <ol>${SECS.map(([k, l, p, scr], i) => {
      const s = stOf(k);
      const isOn = on === k;
      const sub =
        k === 'statements'
          ? `<ol class="sub">${cmp.persons
              .map((pp) => {
                const ps = cmp.sec(pp.key).state;
                const pOn = isOn && S.ui.person === pp.key;
                return `<li class="${pOn ? 'on' : ''}"><button data-act="openPerson" data-arg="${pp.key}" ${pOn ? 'aria-current="page"' : ''}><span class="st ${ps}">${ps === 'complete' ? icon('check', 10, 3) : ''}</span><span class="truncate" style="flex:1">${esc(pp.kind === 'self' ? 'You' : pp.name)}</span><span class="sr-only">${stateWord[ps]}</span></button></li>`;
              })
              .join('')}</ol>`
          : '';
      return `<li class="${s} ${isOn ? 'on' : ''}"><button data-act="navSec" data-arg="${scr}" ${isOn ? 'aria-current="page"' : ''}><span class="n">${s === 'complete' && !isOn ? icon('check', 12, 3) : k === 'summary' ? icon('listCheck', 13) : i + 1}</span><span class="lb">${l}<small>${[p, s && stateWord[s]].filter(Boolean).join(' · ')}</small></span></button>${sub}</li>`;
    }).join('')}</ol>
    <div class="foot">${saveInd()}<div>${icon('calendar', 15)} ${relText(obl(D.obligationId), obl(D.obligationId).status)} · ${fmtDate(D.dueDate)}</div></div>
  </nav>`;
      }
      function mobileBar() {
        const D = cur();
        const label = `${TYPE_LABEL[D.type]} · ${comm(D.commission).code}`;
        return `<div class="mbar"><button class="btn btn-ghost icon-btn" style="margin-left:-8px;width:32px;height:32px" data-act="go" data-arg="decl-overview" aria-label="Declaration overview">${icon('left', 18)}</button><div style="flex:1;min-width:0"><div class="truncate" style="font-weight:600">${label}</div><div>${saveInd()}</div></div><button class="btn btn-secondary btn-sm" data-act="modal" data-arg="sections">${icon('list', 15)} Sections</button></div>`;
      }
      modals.sections = () => {
        const D = cur();
        const cmp = completeness(D);
        const row = (label, sub, s, act, arg) =>
          `<button class="item srow" style="width:100%;border:0;background:none;text-align:left;cursor:pointer;font:inherit" data-act="${act}" data-arg="${arg}"><div class="item-body"><div class="t">${label}</div>${sub ? `<div class="d">${sub}</div>` : ''}</div>${s ? stateBadge(s) : ''}</button>`;
        return dialog({
          title: 'Sections',
          sub: `${TYPE_LABEL[D.type]} · ${comm(D.commission).code}`,
          body: `<div class="card" style="box-shadow:none;margin:0 -20px">${[
            row('Overview', '', '', 'navSec', 'decl-overview'),
            row('Your details', '', cmp.sec('bio').state, 'navSec', 'decl-bio'),
            row('Spouses and children', '', cmp.sec('household').state, 'navSec', 'decl-household'),
            ...cmp.persons.map((p) =>
              row(
                `Statement: ${esc(p.kind === 'self' ? 'You' : p.name)}`,
                p.kind === 'self' ? '' : p.rel,
                cmp.sec(p.key).state,
                'openPerson',
                p.key,
              ),
            ),
            row('Other information', '', cmp.sec('other').state, 'navSec', 'decl-other'),
            row('Summary', '', '', 'navSec', 'decl-summary'),
          ].join('')}</div>`,
        });
      };
      actions.navSec = (scr) => {
        S.ui.open = null;
        S.ui.picker = null;
        if (scr === 'decl-statement') S.ui.person = S.ui.person || 'officer';
        flushThen(() => Kit.go(scr));
      };
      actions.openPerson = (k) => {
        S.ui.person = k;
        S.ui.open = null;
        S.ui.picker = null;
        flushThen(() => Kit.go('decl-statement'));
      };
      function flushThen(fn) {
        if (S.save === 'saving') {
          clearTimeout(saveT);
          clearTimeout(saveT2);
          S.save = 'saved';
          const D = cur();
          if (D) D.updatedAt = new Date().toISOString();
        }
        fn();
      }

      function declHead(title) {
        const D = cur();
        return `<div class="dhead"><h1>${title}</h1>
    <div class="meta"><span>${tip('Statement date', TIP_STATEMENT, 'left')} ${fmtDate(D.statementDate)}</span><span>${tip('Income', TIP_INCOME)} ${fmtDate(D.incomeFrom)} to ${fmtDate(D.incomeTo)}${D.fromSource === 'assumed' ? ` (${tip('start assumed', TIP_ASSUMED)})` : ''}</span>${D.status === 'amending' ? Kit.badge(`Amending version ${D.amendingFrom}`, 'info') : ''}</div></div>`;
      }
      function amendBanner(D) {
        const n = D.amendingFrom;
        return `<div class="amend-banner" role="note">${icon('info', 17)}<div class="txt">You are amending version ${n}. Submit again to file version ${n + 1}, or discard the amendment to keep version ${n}.</div><button class="btn btn-secondary btn-sm" data-act="askDiscardAmend" data-arg="${D.id}">Discard amendment</button></div>`;
      }
      function ws(content, { title, prev = null, next = null }) {
        const D = cur();
        const foot =
          prev || next
            ? `<div class="dnav-foot">${prev ? `<button class="btn btn-secondary" data-act="${prev[2] || 'navSec'}" data-arg="${prev[0]}" aria-label="Back: ${esc(String(prev[1]).replace(/<[^>]+>/g, ''))}">${icon('left', 16)}<span class="pl">${prev[1]}</span></button>` : ''}<span class="spacer"></span>${next ? `<button class="btn btn-primary" data-act="${next[2] || 'navSec'}" data-arg="${next[0]}">${next[1]} ${icon('right', 16)}</button>` : ''}</div>`
            : '';
        return portalShell(
          `<div class="dws">${sectionNav()}<section class="dmain">
    ${mobileBar()}
    ${D.status === 'amending' ? amendBanner(D) : ''}
    ${S.save === 'conflict' ? `<div class="conflict-bar" role="alert">${icon('alert', 17)}<span>This declaration was changed on another device or tab. Reload to continue; your last saved work is kept.</span><span class="spacer"></span><button class="btn btn-secondary btn-sm" data-act="reloadConflict">${icon('refresh', 15)} Reload</button></div>` : ''}
    ${declHead(title)}
    <fieldset class="plain" ${S.save === 'conflict' ? 'disabled' : ''}>${content}</fieldset>
    ${foot}
  </section></div>`,
          { active: 'Declarations', tabbar: false },
        );
      }
      actions.reloadConflict = () => {
        S.save = 'saved';
        Kit.toast('Reloaded the latest saved version');
      };

      /* ---- Overview ---- */
      screens['decl-overview'] = () => {
        const D = cur();
        const cmp = completeness(D);
        const arch = [...D.hh.spouses, ...D.hh.children].filter((p) => p.archived);
        const line = (n, label, sub, s, act, arg) =>
          `<div class="item" data-act="${act}" data-arg="${arg}"><span class="ico" style="${s === 'complete' ? 'background:var(--ok-soft);color:var(--ok)' : ''}">${s === 'complete' ? icon('check', 16, 2.6) : n}</span><div class="item-body"><div class="t"><button class="linklike" style="text-decoration:none;font-weight:500;text-align:left" data-act="${act}" data-arg="${arg}">${label}</button></div>${sub ? `<div class="d">${sub}</div>` : ''}</div>${stateBadge(s)}${icon('right', 17)}</div>`;
        const firstOpen = cmp.secs.find((s) => s.state !== 'complete');
        const target = !firstOpen
          ? ['navSec', 'decl-summary']
          : firstOpen.key === 'bio'
            ? ['navSec', 'decl-bio']
            : firstOpen.key === 'household'
              ? ['navSec', 'decl-household']
              : firstOpen.key === 'other'
                ? ['navSec', 'decl-other']
                : ['openPerson', firstOpen.key];
        return ws(
          `<div class="stack-lg">
    <div class="card card-pad"><div class="row" style="justify-content:space-between;flex-wrap:wrap"><div><div class="section-title">${cmp.pct}% complete</div><div class="small muted">${cmp.pct === 100 ? 'Check the summary, then submit.' : `${plural(cmp.secs.filter((s) => s.state !== 'complete').length, 'section')} left`}</div></div><button class="btn btn-primary" data-act="${target[0]}" data-arg="${target[1]}">${cmp.pct === 0 ? 'Start' : cmp.pct === 100 ? 'Go to summary' : 'Continue'} ${icon('right', 16)}</button></div><div class="progress" style="margin-top:14px"><i style="width:${cmp.pct}%"></i></div></div>
    <div class="card ov-list">
      ${line('1', 'Your details', '', cmp.sec('bio').state, 'navSec', 'decl-bio')}
      ${line('2', 'Spouses and children', '', cmp.sec('household').state, 'navSec', 'decl-household')}
      ${cmp.persons.map((p) => line('3', `Financial statement: ${esc(p.kind === 'self' ? 'you' : p.name)}`, p.kind === 'self' ? '' : p.rel, cmp.sec(p.key).state, 'openPerson', p.key)).join('')}
      ${arch.map((p) => `<div class="item" style="opacity:.7"><span class="ico">${icon('archive', 16)}</span><div class="item-body"><div class="t">Financial statement: ${esc(nm(p))}</div><div class="d">Removed. Kept until you discard.</div></div>${stateBadge('archived')}</div>`).join('')}
      ${line('4', 'Other information', '', cmp.sec('other').state, 'navSec', 'decl-other')}
      ${line(icon('listCheck', 16), 'Summary', 'Check and submit', '', 'navSec', 'decl-summary').replace(Kit.badge('Not started'), '')}
    </div>
    <div class="row wrap" style="justify-content:space-between"><span class="small muted">${icon('lock', 14)} Only you can see your draft.</span>${D.status === 'draft' ? `<button class="btn btn-danger-ghost btn-sm" data-act="askDiscard" data-arg="${D.id}">${icon('trash', 15)} Discard draft</button>` : ''}</div>
    <div class="proto-note"><b>Prototype.</b> <a data-act="demoFill" data-arg="complete">Fill every section with demo answers</a> · <a data-act="demoFill" data-arg="partial">Half-way draft</a> · <a data-act="demoFill" data-arg="fresh">Empty draft</a></div>
  </div>`,
          {
            title: 'Your declaration',
          },
        );
      };
      actions.demoFill = (lvl) => {
        const D = cur();
        const keep = {
          id: D.id,
          versions: D.versions,
          status: D.status,
          amendingFrom: D.amendingFrom,
          reference: D.reference,
        };
        const n = newDeclaration(obl(D.obligationId));
        Object.assign(D, n, keep);
        if (lvl !== 'fresh') demoFill(D, lvl);
        Kit.render();
        Kit.toast(
          lvl === 'fresh' ? 'Draft emptied (prototype)' : 'Demo answers filled in (prototype)',
        );
      };

      /* roster details differ per Commission (John exited PSC before joining TSC) */
      const roster = (D) =>
        D.commission === 'psc'
          ? {

    <div class="callout callout-info">${icon('file', 16)}<span><b>Statements needed:</b> ${ps.map((p) => esc(p.kind === 'self' ? 'you' : p.name)).join(', ')}.</span></div>
  </div>`,

      actions.openEditor = (id) => {

      const itemAmt = (cat, it) => toCents(cat === 'assets' ? it.value : it.amount);
      function itemSummary(cat, it) {
        const bits = [it.desc];
        if (cat === 'assets') {
          if (it.parcel) bits.push(it.parcel);
          if (it.reg) bits.push(it.reg);
          if (it.makeModel) bits.push(it.makeModel);
          if (it.issuer) bits.push(it.issuer + (it.qty ? ', ' + it.qty : ''));
          if (it.institution) bits.push(it.institution + (it.accType ? ', ' + it.accType : ''));

            it.loc === 'abroad'
              ? it.country
                ? countryName(it.country)
                : 'Abroad'
              : it.county
                ? it.county + ' County'
                : '',
          );
        }
        if (cat === 'liabilities' && it.creditor) bits.splice(1, 0, it.creditor);

        const menuId = 'm-' + it.id;
        const sum = `<div class="rep-sum"><span class="ico">${icon(t ? t[2] : 'plus', 18)}</span><div class="body"><div class="t"><h3 style="font:inherit;display:inline">${title}</h3></div><div class="d">${esc(itemSummary(cat, it)) || '<span class="muted">No description yet</span>'}</div>${tags.length ? `<div class="tags">${tags.join('')}</div>` : ''}</div>
    <div class="amt">${amt != null && !isNaN(amt) ? fmtCents(amt) : '<span class="muted" style="font-weight:400">-</span>'}${cat === 'assets' && it.joint && amt ? `<small>whole value</small>` : ''}</div>
    <div class="acts">${open ? '' : `<button class="btn btn-ghost icon-btn" data-act="openEditor" data-arg="${it.id}" aria-label="Edit ${esc(title)}${it.desc ? ': ' + esc(it.desc) : ''}" ${nil ? 'disabled' : ''}>${icon('pencil', 16)}</button>`}

      /* ---- Attachments (#125) ---- */
      const ATT_COPY = {

      function attachmentList(cat, pk, it) {
        const row = (a) => {
          const bad = ['infected', 'rejected-type', 'rejected-size', 'failed'].includes(a.st);
          const status =
            a.st === 'uploading'
              ? `Uploading… ${a.pct || 0}%<div class="bar" role="progressbar" aria-valuenow="${a.pct || 0}" aria-valuemin="0" aria-valuemax="100" aria-label="Upload progress"><i style="width:${a.pct || 0}%"></i></div>`
              : a.st === 'scanning'
                ? 'Checking the file for viruses…'
                : a.st === 'linked'
                  ? `${fmtSize(a.size)} · Attached`
                  : ATT_COPY[a.st];
          const ic =
            a.st === 'uploading'
              ? icon('upload', 16)
              : a.st === 'scanning'
                ? '<span class="spinner dark sm"></span>'
                : bad

                  : icon('file', 16);

  </div>`;

      const findItem = (cat, pk, id) => cur().st[pk][cat].find((x) => x.id === id);
      function runUpload(it, a) {
        a.st = 'uploading';
        a.pct = 0;
        Kit.render();
        const t = setInterval(() => {
          if (!it.atts.includes(a)) return clearInterval(t);
          a.pct = Math.min(100, a.pct + 18 + Math.round(Math.random() * 10));
          if (/fail/i.test(a.name) && a.pct >= 54 && !a.retried) {
            clearInterval(t);
            a.st = 'failed';
            Kit.render();
            return;
          }
          if (a.pct >= 100) {
            clearInterval(t);
            a.st = 'scanning';

            setTimeout(() => {
              a.st = /virus|eicar/i.test(a.name) ? 'infected' : 'linked';

              Kit.render();

      function sumCard(num, title, state, editAct, editArg, body) {

      function itemRowsTable(cat, items) {
        if (!items.length) return '';

            if (cat === 'assets' && it.joint) flags.push(`Joint, share ${it.share}%`);
            if ((cat === 'assets' ? it.loc === 'abroad' : it.abroad) && it.cur && it.orig)
              flags.push(`Original ${it.cur} ${it.orig}`);
            if (it.changed) flags.push(`Changed: ${KIND_WORDS[it.kind] || '-'}`);
            const docs = (it.atts || [])
              .filter((a) => a.st === 'linked')
              .map((a) => `${icon('clip', 12)} ${esc(a.name)}`);
            return `<tr><td class="nowrap">${lab(typeList(cat), it.type)}</td><td>${esc(itemSummary(cat, it))}${flags.length ? `<div class="small muted">${flags.join(' · ')}</div>` : ''}${docs.length ? `<div class="small" style="color:var(--ink-2);margin-top:2px">${docs.join('<br/>')}</div>` : ''}</td><td class="n">${fmtCents(itemAmt(cat, it))}</td></tr>`;
          })
          .join('')}</tbody></table>`;
      }
      function submitState(D, cmp) {
        const o = obl(D.obligationId);

      };

        S.modal = {

          title:
            D.status === 'amending'
              ? `Submit version ${D.versions.length + 1}`
              : 'Submit your declaration',

      const REFS = {

      function createVersion(D) {

      /* restore state after the Keycloak step-up round trip */
      (function restore() {
        const h = location.hash.slice(1);
        if (h.startsWith('stepup')) {
          try {
            const snap = JSON.parse(sessionStorage.getItem(SNAP_KEY) || 'null');
            if (snap) Object.assign(S, snap, { modal: null });
          } catch (e) {}
          if (!cur()) setupDraft('complete');
        } else if (/^decl-/.test(h))
          setupDraft(h === 'decl-bio' || h === 'decl-overview' ? 'fresh' : 'complete');
        else if (h === 'submitted') {
          setupSubmitted('o-tsc-initial');
        }
      })();

      Kit.mount({
        app: 'portal',
        start: 'landing',
        home: 'home',
        screens,
        modals,
        actions,
        jumps,
        coverage,
        onBind: (bind) => {
          if (!bind.startsWith('decls.')) return;
          const parts = bind.split('.');
          const D = S.decls[+parts[1]];
          if (D) {
            const sec = { bio: 'bio', hh: 'household', other: 'other', st: parts[3] }[parts[2]];
            if (sec) D.touched[sec] = 1;
          }
          if (bind.endsWith('other.free')) {
            const el = document.querySelector('[data-counter-for]');
            if (el) el.textContent = `${num(Kit.getPath(S, bind).length)} / 4,000 characters`;
          }
          markDirty();
        },
        reset: () => {
          sessionStorage.removeItem(SNAP_KEY);
          location.hash = '';
          location.reload();
        },

      document.body.insertAdjacentHTML(

      /* input shaping that must run before the kit's two-way binding (capture phase) */
      document.getElementById('app').addEventListener(
        'input',
        (e) => {
          const el = e.target;
          if (el.dataset && el.dataset.kes !== undefined) {
            const raw = el.value;
            const pos = el.selectionStart;
            const before = raw.slice(0, pos).replace(/[^\d.]/g, '').length;
            let v = raw.replace(/[^\d.]/g, '');
            const parts = v.split('.');
            const int = parts[0].replace(/^0+(?=\d)/, '');
            const dec = parts.length > 1 ? '.' + parts.slice(1).join('').slice(0, 2) : '';
            const out = (int ? Number(int).toLocaleString('en-KE') : dec ? '0' : '') + dec;
            el.value = out;
            let n = 0,
              p = 0;
            while (p < out.length && n < before) {
              if (/[\d.]/.test(out[p])) n++;
              p++;
            }
            try {
              el.setSelectionRange(p, p);
            } catch (x) {}
          }
          if (el.dataset && el.dataset.date !== undefined) {
            let v = el.value.replace(/[^\d/]/g, '');
            if (
              e.inputType &&
              e.inputType.startsWith('insert') &&
              (/^\d{2}$/.test(v) || /^\d{2}\/\d{2}$/.test(v))
            )
              v += '/';
            el.value = v.slice(0, 10);
          }
        },
        true,
      );

      /* countdown ticker: text every second, live region every 10 seconds, re-render when one reaches zero */
      setInterval(() => {
        let rerender = false;
        const now = Date.now();
        document.querySelectorAll('[data-cd]').forEach((el) => {
          const u = +el.dataset.cd;
          el.textContent = cdText(u, el.dataset.fmt);
          if (u <= now && !el.dataset.done) {
            el.dataset.done = '1';
            rerender = true;
          }
        });
        document.querySelectorAll('[data-cd-sr]').forEach((el) => {
          const s = Math.ceil((+el.dataset.cdSr - now) / 1000);
          if (s > 0 && s % 10 === 0)
            el.textContent = `${s >= 60 ? cdText(+el.dataset.cdSr, 'min') : s + ' seconds'} left`;
        });
        if (rerender) Kit.render();
      }, 1000);
      if (S.screen === 'submitted' && cur()?.versions.slice(-1)[0]?.ack.status === 'pending')
        startPolling();
    </script>
  </body>
</html>
