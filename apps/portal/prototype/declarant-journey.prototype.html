<!doctype html>
<!-- PROTOTYPE - throwaway. Question: what does the declarant portal look like end to end, from Get started (spec 03) through obligations (04), declaration capture (05) to step-up, submission, slip and amendments (06)? Covers tickets #64 #66 #69 #72 #75 #87 #89 #93 #114 #116 #119 #122 #125 #128 #137 #139 #142 #148. Open by double-clicking. State is in memory (a snapshot survives the Keycloak step-up round trip via sessionStorage). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dials - Declarant journey (prototype)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../../packages/ui/prototype/kit.css" />
    <style>
      /* ---------- generic helpers ---------- */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .proto-note {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 11.5px;
        line-height: 1.45;
        color: #6d5a2a;
        background: #fffaf0;
        border: 1px dashed #e2c98f;
        border-radius: 8px;
        padding: 7px 10px;
      }
      .proto-note b {
        color: #4d3d10;
      }
      .proto-note a {
        color: #4d3d10;
        font-weight: 600;
        cursor: pointer;
      }
      .err-text {
        color: var(--danger);
        font-weight: 500;
        font-size: 13px;
        display: flex;
        gap: 6px;
        align-items: flex-start;
      }
      .err-text svg {
        flex: none;
        margin-top: 2px;
      }
      .is-invalid {
        box-shadow: 0 0 0 1.5px var(--danger) !important;
      }
      .alert {
        display: flex;
        gap: 12px;
        padding: 14px 16px;
        border-radius: var(--r);
        font-size: 14px;
        line-height: 1.5;
      }
      .alert > svg {
        flex: none;
        margin-top: 2px;
      }
      .alert .t {
        font-weight: 600;
      }
      .alert-danger {
        background: var(--danger-soft);
        color: #8a1c14;
      }
      .alert-warn {
        background: var(--warn-soft);
        color: #6b4000;
      }
      .alert-info {
        background: #eaf1fb;
        color: #1f4f96;
      }
      .alert-ok {
        background: var(--ok-soft);
        color: #0f5a2d;
      }
      .alert .btn {
        margin-top: 10px;
      }
      .alert .btn-secondary {
        color: var(--ink);
      }
      .cd {
        font-variant-numeric: tabular-nums;
      }
      .linklike {
        background: none;
        border: 0;
        padding: 0;
        color: var(--ink);
        font-weight: 500;
        text-decoration: underline;
        text-decoration-color: var(--line-2);
        text-underline-offset: 3px;
        cursor: pointer;
        font-size: inherit;
      }
      .linklike:hover {
        text-decoration-color: var(--ink);
      }
      .linklike[disabled] {
        color: var(--muted);
        text-decoration: none;
        cursor: default;
      }
      :focus-visible {
        outline: 3px solid rgba(233, 90, 36, 0.45);
        outline-offset: 2px;
      }
      .btn:focus-visible,
      .linklike:focus-visible,
      a:focus-visible {
        outline: 3px solid rgba(233, 90, 36, 0.45);
        outline-offset: 2px;
      }
      /* the group draws the focus ring; no second ring on the inner field */
      .input-group .input:focus-visible,
      .ask-compose textarea:focus-visible {
        outline: none;
      }
      .spinner.sm {
        width: 14px;
        height: 14px;
        border-width: 2px;
      }
      .kbd-hint {
        font-size: 12px;
        color: var(--muted);
      }

      /* ---------- auth / onboarding ---------- */
      .stepper-wrap {
        margin-bottom: 26px;
      }
      .stepper-wrap .stepper {
        margin-bottom: 8px;
      }
      .stepper-wrap .lbl {
        font-size: 13px;
        color: var(--muted);
        font-weight: 500;
      }
      .stepper-wrap .lbl b {
        color: var(--ink);
        font-weight: 600;
      }
      .gs-foot-help {
        margin-top: 28px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        font-size: 13.5px;
        color: var(--muted);
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .gs-foot-help svg {
        flex: none;
        margin-top: 2px;
      }
      .gs-h1 {
        font-size: 26px;
        line-height: 1.2;
        letter-spacing: -0.02em;
        font-weight: 600;
      }
      .gs-sub {
        color: var(--muted);
        margin-top: 8px;
      }
      .combo {
        position: relative;
      }
      .combo .input-group .ico {
        display: flex;
        align-items: center;
        padding-left: 12px;
        color: var(--muted);
      }
      .combo-list {
        margin-top: 8px;
        border-radius: 12px;
        background: var(--surface);
        box-shadow: var(--shadow-pop);
        max-height: 320px;
        overflow-y: auto;
        padding: 6px;
      }
      .combo-opt {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 10px 10px;
        border: 0;
        background: none;
        border-radius: 9px;
        text-align: left;
        cursor: pointer;
        font: inherit;
        color: inherit;
      }
      .combo-opt:hover,
      .combo-opt.act {
        background: var(--sunken);
      }
      .combo-opt .mono-code {
        flex: none;
        min-width: 58px;
        height: 26px;
        padding: 0 6px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        background: var(--brand-soft);
        color: var(--brand-ink);
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .combo-opt .nm {
        flex: 1;
        min-width: 0;
        font-weight: 500;
        font-size: 14.5px;
        line-height: 1.3;
      }
      .combo-empty {
        padding: 16px 12px;
        font-size: 14px;
        color: var(--muted);
      }
      .chosen {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-radius: var(--r);
        background: var(--surface);
        box-shadow: 0 0 0 1.5px var(--ink);
      }
      .chosen .mono-code {
        flex: none;
        min-width: 58px;
        height: 30px;
        padding: 0 6px;
        border-radius: 7px;
        display: grid;
        place-items: center;
        background: var(--brand-soft);
        color: var(--brand-ink);
        font-family: ui-monospace, Menlo, monospace;
        font-size: 12px;
        font-weight: 600;
      }
      .comm-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px 6px 6px;
        border-radius: 999px;
        background: var(--surface);
        box-shadow: var(--shadow-input);
        font-size: 13.5px;
        font-weight: 500;
        max-width: 100%;
      }
      .comm-chip .mono-code {
        height: 22px;
        padding: 0 7px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: var(--brand-soft);
        color: var(--brand-ink);
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11px;
        font-weight: 600;
      }
      .otp {
        flex-wrap: nowrap;
      }
      .otp.err input {
        box-shadow: 0 0 0 1.5px var(--danger);
      }
      .otp.dis input {
        background: var(--sunken);
        color: var(--muted);
        pointer-events: none;
      }
      .otp-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .otp-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 14px;
      }
      .masked {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .vbadge-ok {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 22px;
        padding: 0 8px;
        border-radius: 999px;
        background: var(--ok-soft);
        color: var(--ok);
        font-size: 12px;
        font-weight: 500;
        vertical-align: 1px;
        white-space: nowrap;
      }
      .ofr-card {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border-radius: var(--r-lg);
        background: var(--brand-softer);
        box-shadow: 0 0 0 1px #f3dccd;
      }
      .ofr-card .v {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .landing-feats {
        display: grid;
        gap: 10px;
        margin-top: 28px;
      }
      .landing-feats div {
        display: flex;
        gap: 12px;
        align-items: center;
        font-size: 14.5px;
        color: var(--ink-2);
      }
      .landing-feats .ico {
        width: 32px;
        height: 32px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        background: var(--brand-soft);
        color: var(--brand-ink);
        flex: none;
      }

      /* ---------- tooltips ---------- */
      .tip {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 3px;
        border-bottom: 1px dotted currentColor;
        cursor: help;
      }
      .tip .tip-ico {
        display: inline-flex;
        color: var(--muted);
      }
      .tip .bubble {
        position: absolute;
        left: 50%;
        bottom: calc(100% + 8px);
        transform: translateX(-50%);
        width: max-content;
        max-width: 260px;
        padding: 9px 11px;
        border-radius: 9px;
        background: #1c1c1c;
        color: #fff;
        font-size: 12.5px;
        font-weight: 400;
        line-height: 1.45;
        box-shadow: var(--shadow-pop);
        z-index: 40;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.12s;
        white-space: normal;
        text-align: left;
        letter-spacing: 0;
      }
      .tip:hover .bubble,
      .tip:focus .bubble,
      .tip:focus-within .bubble {
        opacity: 1;
      }
      .tip.left .bubble {
        left: 0;
        transform: none;
      }
      .tip.right .bubble {
        left: auto;
        right: 0;
        transform: none;
      }
      .tip:not(:hover):not(:focus-within) .bubble {
        display: none;
      }
      .tip-btn {
        position: relative;
        display: inline-flex;
      }
      .tip-btn .bubble {
        position: absolute;
        right: 0;
        bottom: calc(100% + 8px);
        width: max-content;
        max-width: 240px;
        padding: 9px 11px;
        border-radius: 9px;
        background: #1c1c1c;
        color: #fff;
        font-size: 12.5px;
        line-height: 1.45;
        box-shadow: var(--shadow-pop);
        z-index: 40;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.12s;
        white-space: normal;
        font-weight: 400;
      }
      .tip-btn:hover .bubble,
      .tip-btn:focus-within .bubble {
        opacity: 1;
      }

      /* ---------- dashboard ---------- */
      .ob-group-h {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 6px 0 10px;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--ink-2);
      }
      .ob-group-h .mono-code {
        height: 22px;
        padding: 0 7px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        background: var(--sunken);
        color: var(--ink-2);
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11px;
        font-weight: 600;
      }
      .ob {
        position: relative;
        overflow: visible;
        border-radius: 20px;
        padding: 22px;
        cursor: pointer;
      }
      @container app (min-width: 700px) {
        .ob {
          padding: 26px 28px;
        }
      }
      .ob.due {
        background: linear-gradient(135deg, #fff5ee 0%, #fde6d7 100%);
        box-shadow: 0 0 0 1px #f6d9c6;
      }
      .ob.overdue {
        background: linear-gradient(135deg, #fff8ec 0%, #fdebc8 100%);
        box-shadow: 0 0 0 1px #f0d49a;
      }
      .ob.upcoming,
      .ob.filed {
        background: var(--surface);
        box-shadow: var(--shadow-card);
      }
      .ob.filed {
        background: linear-gradient(135deg, #f5fbf7, #e7f5ec);
        box-shadow: 0 0 0 1px #cfe9d8;
      }
      .ob:hover {
        filter: brightness(0.995);
        box-shadow:
          0 0 0 1px var(--line-2),
          0 6px 20px -10px rgba(0, 0, 0, 0.18);
      }
      .ob .glow {
        position: absolute;
        right: 0;
        top: 0;
        width: 240px;
        height: 200px;
        border-radius: 0 20px 0 0;
        background: radial-gradient(circle at 100% 0, rgba(233, 90, 36, 0.18), transparent 65%);
        pointer-events: none;
      }
      .ob.overdue .glow {
        background: radial-gradient(circle at 100% 0, rgba(217, 138, 0, 0.2), transparent 65%);
      }
      .ob h3 {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.25;
      }
      @container app (min-width: 700px) {
        .ob h3 {
          font-size: 22px;
        }
      }
      .ob .meta {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px 20px;
        margin: 18px 0 20px;
      }
      @container app (min-width: 700px) {
        .ob .meta {
          grid-template-columns: repeat(4, auto);
          justify-content: start;
          gap: 12px 40px;
        }
      }
      .ob .meta .k {
        font-size: 12.5px;
        color: #8a5a3e;
        font-weight: 500;
      }
      .ob.upcoming .meta .k,
      .ob.filed .meta .k {
        color: var(--muted);
      }
      .ob .meta .v {
        font-size: 15px;
        font-weight: 600;
      }
      .ob .acts {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .ob .overdue-note {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        font-size: 13.5px;
        color: #7a3a00;
        margin-top: 8px;
      }
      .ob .overdue-note b {
        color: var(--danger);
      }
      .ob-list {
        display: grid;
        gap: 14px;
      }
      .rel-badge.due {
        background: rgba(255, 255, 255, 0.8);
        color: var(--brand-ink);
        box-shadow: 0 0 0 1px #f3d2bd;
      }
      .rel-badge.plain {
        background: rgba(255, 255, 255, 0.8);
        color: var(--ink-2);
        box-shadow: 0 0 0 1px var(--line);
      }
      .rel-badge.overdue {
        background: rgba(255, 255, 255, 0.8);
        color: var(--danger);
        box-shadow: 0 0 0 1px #efd3a0;
      }
      .acct .dl dd.stackv {
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
      }
      .fromc .item {
        padding: 14px 20px;
      }
      .fromc .item .t {
        font-size: 14.5px;
      }
      .acct .dl dd {
        display: flex;
        align-items: center;
        gap: 6px;
        justify-content: flex-end;
        flex-wrap: wrap;
      }
      .skel-card {
        border-radius: 20px;
        padding: 24px;
        background: var(--surface);
        box-shadow: var(--shadow-card);
        display: grid;
        gap: 12px;
      }

      /* reminders table */
      .rtable {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
      }
      .rtable caption {
        text-align: left;
        font-weight: 600;
        font-size: 14.5px;
        padding-bottom: 8px;
        color: var(--ink);
      }
      .rtable th {
        text-align: left;
        font-weight: 500;
        font-size: 12px;
        color: var(--muted);
        padding: 8px 10px 8px 0;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      .rtable td {
        padding: 10px 10px 10px 0;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      .rtable tr:last-child td {
        border-bottom: 0;
      }
      .rtable td.dt {
        white-space: nowrap;
      }
      .outcome {
        display: inline-flex;
        gap: 6px;
        align-items: flex-start;
      }
      .outcome svg {
        flex: none;
        margin-top: 2px;
      }
      @container app (max-width: 599px) {
        .rtable thead {
          display: none;
        }
        .rtable tr {
          display: grid;
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
          gap: 2px 10px;
          padding: 10px 0;
          border-bottom: 1px solid var(--line);
        }
        .rtable td {
          border: 0;
          padding: 0;
        }
        .rtable td.dt {
          white-space: normal;
        }
        .rtable td[data-l]::before {
          content: attr(data-l) ': ';
          color: var(--muted);
        }
        .rtable td.oc {
          grid-column: 1 / -1;
          margin-top: 4px;
        }
      }

      /* ---------- declaration workspace ---------- */
      .dws {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 0;
        max-width: 1180px;
        margin: 0 auto;
        padding: 0 16px 40px;
      }
      @container app (min-width: 960px) {
        .dws {
          grid-template-columns: 272px minmax(0, 1fr);
          gap: 44px;
          padding: 32px 28px 72px;
        }
      }
      .snav {
        display: none;
      }
      @container app (min-width: 960px) {
        .snav {
          display: block;
          position: sticky;
          top: 92px;
          align-self: start;
        }
      }
      .snav ol {
        list-style: none;
        margin: 14px 0 0;
        padding: 0;
        display: grid;
        gap: 2px;
      }
      .snav li > button {
        display: flex;
        align-items: center;
        gap: 11px;
        width: 100%;
        padding: 8px 10px;
        border: 0;
        background: none;
        border-radius: var(--r-sm);
        cursor: pointer;
        text-align: left;
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        color: var(--ink-2);
      }
      .snav li > button:hover {
        background: var(--sunken);
      }
      .snav li.on > button {
        background: var(--surface);
        color: var(--ink);
        box-shadow: var(--shadow-card);
      }
      .snav .n {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 11.5px;
        font-weight: 600;
        box-shadow: inset 0 0 0 1.5px var(--line-2);
        color: var(--muted);
        flex: none;
      }
      .snav li.complete .n {
        box-shadow: none;
        background: var(--ok-soft);
        color: var(--ok);
      }
      .snav li.incomplete .n {
        box-shadow: inset 0 0 0 1.5px #e0b35c;
        color: var(--warn);
      }
      .snav li.on .n {
        box-shadow: none;
        background: var(--ink);
        color: #fff;
      }
      .snav .lb {
        flex: 1;
        min-width: 0;
        line-height: 1.3;
      }
      .snav .lb small {
        display: block;
        font-size: 12px;
        font-weight: 400;
        color: var(--muted);
      }
      /* Sections sheet rows have no icon, so opt out of the kit's mobile item grid. */
      .item.srow {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .snav .sub {
        list-style: none;
        margin: 8px 0 10px 22px;
        padding: 2px 0 2px 12px;
        border-left: 1.5px solid var(--line);
        display: grid;
        gap: 4px;
      }
      .snav .sub button {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 6px 8px;
        border: 0;
        background: none;
        border-radius: 7px;
        cursor: pointer;
        text-align: left;
        font: inherit;
        font-size: 13.5px;
        color: var(--ink-2);
      }
      .snav .sub button:hover {
        background: var(--sunken);
      }
      .snav .sub li.on button {
        background: var(--surface);
        color: var(--ink);
        box-shadow: var(--shadow-card);
        font-weight: 500;
      }
      .snav .sub .st {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        flex: none;
        box-shadow: inset 0 0 0 1.5px var(--line-2);
      }
      .snav .sub .st.complete {
        box-shadow: none;
        background: var(--ok-soft);
        color: var(--ok);
      }
      .snav .sub .st.incomplete {
        box-shadow: inset 0 0 0 1.5px #e0b35c;
      }
      .snav .foot {
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        display: grid;
        gap: 9px;
        font-size: 13px;
        color: var(--muted);
      }
      .snav .foot div {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .dmain {
        min-width: 0;
        max-width: 780px;
        padding-top: 14px;
      }
      @container app (min-width: 960px) {
        .dmain {
          padding-top: 0;
        }
      }
      .dhead {
        margin-bottom: 22px;
      }

      function toCents(s) {
        if (s === '' || s == null) return null;
        const clean = String(s).replace(/,/g, '');
        if (!/^\d+(\.\d{0,2})?$/.test(clean)) return NaN;
        const [a, b = ''] = clean.split('.');
        return Number(a) * 100 + Number((b + '00').slice(0, 2));
      }
      function fmtCents(c, cur = 'KES') {
        if (c == null || isNaN(c)) return '-';
        const whole = Math.floor(c / 100);
        const frac = c % 100;
        return `${cur} ${whole.toLocaleString('en-KE')}${frac ? '.' + String(frac).padStart(2, '0') : ''}`;
      }
      function parseDMY(s) {
        const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(s || '').trim());
        if (!m) return null;
        const d = new Date(+m[3], +m[2] - 1, +m[1]);
        if (d.getFullYear() !== +m[3] || d.getMonth() !== +m[2] - 1 || d.getDate() !== +m[1])
          return null;
        return d;

        let a = at.getFullYear() - d.getFullYear();
        const m = at.getMonth() - d.getMonth();
        if (m < 0 || (m === 0 && at.getDate() < d.getDate())) a--;
        return a;

        return `<div class="docpage">
    <button class="btn btn-ghost btn-sm" style="margin-left:-10px" data-act="go" data-arg="gs-commission">${icon('left', 16)} Get started</button>
    <h1 style="margin-top:10px">Copy tables</h1>

    <h2>Onboarding problem codes ${Kit.badge('#66 #69 #72')}</h2>

          'already-onboarded',
          '409',
          'Identify',
          'Alert (info): "You already have an Adili account." Buttons "Sign in", "Recover access" (from <span class="mono">links</span>).',

        row(
          'no-roster',
          '409',
          'Identify (and Commission list)',
          'Alert (warning): "{Name} has not yet imported its roster. You cannot onboard until it does. Ask your Commission\'s reporting officer when it will be ready." Continue disabled.',

        row(
          'rate-limited',
          '429',
          'Identify',
          'Alert (warning): "Too many attempts. Try again in {minutes} minutes." Continue disabled with a countdown from <span class="mono">RateLimit-Reset</span>.',
          'Spec 03 BE-4 code registry omits rate-limited; the contract has it.',

    )}
    <h2>Reminder outcomes ${Kit.badge('#93')}</h2>
    <p class="sp"><span class="mono">ReminderOutcome</span> in <span class="mono">declarations.yaml</span>, every value.</p>
    ${t(
      ['Outcome', 'Copy in the drawer', 'Note'],
      [
        `<tr><td><code>sent</code></td><td>${OUTCOME_COPY.sent(['sms', 'email'])} / ${OUTCOME_COPY.sent(['sms'])} / ${OUTCOME_COPY.sent(['email'])}</td><td>from <span class="mono">channels</span></td></tr>`,

        `<tr><td><code>skipped-past-due-at-creation</code></td><td>${OUTCOME_COPY['skipped-past-due-at-creation']()}</td><td class="small" style="color:var(--warn)">${icon('alert', 12)} Not in the spec 04 copy table; prototype wording.</td></tr>`,
        `<tr><td><code>failed</code></td><td>${OUTCOME_COPY.failed()}</td><td></td></tr>`,

    )}
    <h2>Submit problem codes ${Kit.badge('#139')}</h2>
    ${t(
      ['Code', 'HTTP', 'Copy and behaviour'],
      [
        `<tr><td><code>step-up-required</code></td><td>403</td><td>Alert "We could not confirm your identity. Try again." + "Confirm identity" (restarts step-up)</td></tr>`,
        `<tr><td><code>incomplete</code></td><td>400</td><td>Close the dialog, show the blocking panel on the summary</td></tr>`,

      };

      /* =====================================================================
       * DASHBOARD (specs 03 FE-6, 04 FE-2): account card, obligations, drawer
       * ===================================================================== */
      function visibleObls() {
        return S.home.show
          .map(obl)
          .filter(Boolean)
          .filter((o) => o.status !== 'cancelled');
      }
      function sortObls(list) {
        const rank = (o) => ({ overdue: 0, due: 1, upcoming: 2, filed: 3 })[oblStatus(o)];
        return [...list].sort((a, b) => rank(a) - rank(b) || a.dueDate.localeCompare(b.dueDate));
      }
      function startBtn(o, cls = 'btn-primary') {
        const st = oblStatus(o);
        const d = declFor(o.id);
        if (st === 'filed')
          return `<button class="btn ${cls}" data-act="openSubmitted" data-arg="${d.id}">${icon('file', 16)} View acknowledgement</button>`;
        if (!S.home.startEnabled)
          return `<span class="tip-btn"><button class="btn ${cls}" disabled aria-describedby="sd-${o.id}">Start declaration</button><span class="bubble" role="tooltip" id="sd-${o.id}">Filing opens soon. You will be reminded.</span></span>`;
        if (d && (d.status === 'draft' || d.status === 'amending'))
          return `<button class="btn ${cls}" data-act="openDecl" data-arg="${d.id}">Continue declaration ${icon('right', 16)}</button>`;
        return `<button class="btn ${cls}" data-act="startDecl" data-arg="${o.id}">Start declaration ${icon('right', 16)}</button>`;
      }
      const remindersText = (o) => {
        const n = o.reminders.filter((r) => r.outcome === 'sent').length;
        return n ? `${plural(n, 'reminder')} sent` : 'No reminders sent yet';
      };
      function oblCard(o, grouped) {
        const st = oblStatus(o);
        const d = declFor(o.id);
        const pct = d && d.status !== 'submitted' ? completeness(d).pct : null;
        return `<article class="ob ${st}" data-act="openObl" data-arg="${o.id}" aria-labelledby="obh-${o.id}">
    ${st === 'due' || st === 'overdue' ? '<div class="glow"></div>' : ''}
    <div class="row wrap" style="gap:8px;margin-bottom:10px;position:relative">${statusBadge(st)}${st !== 'filed' ? `<span class="badge rel-badge ${st}">${dateText(o)}</span>` : ''}${d && d.status === 'draft' ? `<span class="badge rel-badge plain">${icon('pencil', 12)} Draft in progress</span>` : ''}${d && d.status === 'amending' ? Kit.badge('Amendment in progress', 'info') : ''}</div>
    <h3 id="obh-${o.id}">${typeLabel(o)}</h3>
    ${st === 'upcoming' ? `<p class="small muted" style="margin-top:4px">Submit from ${fmtDate(o.statementDate)}.</p>` : ''}
    <div class="meta">
      <div><div class="k">${tip('Statement date', TIP_STATEMENT, 'left')}</div><div class="v">${fmtDate(o.statementDate)}</div></div>
      <div><div class="k">Due</div><div class="v">${fmtDate(o.dueDate)}</div></div>
      <div><div class="k">Reminders</div><div class="v">${remindersText(o)}</div></div>
    </div>
    ${st === 'filed' ? `<div class="row wrap" style="gap:8px;margin:-6px 0 16px">${refChip(d.reference, 'sm')}${verBadge(d.versions.length)}${d.versions[d.versions.length - 1].late ? Kit.badge('Filed late', 'warn') : ''}</div>` : ''}
    ${pct !== null ? `<div style="margin:-4px 0 18px"><div class="row small" style="justify-content:space-between;margin-bottom:6px"><span style="font-weight:500">${pct}% complete</span><span class="muted">Saved ${fmtDateTime(d.updatedAt)}</span></div><div class="progress"><i style="width:${pct}%"></i></div></div>` : ''}
    ${st === 'overdue' ? `<div class="overdue-note" style="margin:-6px 0 16px">${icon('alert', 15)}<span><b>Overdue.</b> If you have already declared by other means, contact your Commission.</span></div>` : ''}
    <div class="acts">${startBtn(o)}<button class="btn btn-secondary" data-act="openObl" data-arg="${o.id}">Details</button></div>
  </article>`;
      }
      function obligationsSection() {
        const h = `<h2 class="sr-only" id="ob-h">Your declarations</h2>`;
        if (S.home.st === 'loading')
          return `<section aria-labelledby="ob-h" aria-busy="true">${h}<div class="ob-list">${[1, 2].map(() => `<div class="skel-card"><span class="skeleton" style="width:90px;height:22px;border-radius:12px"></span><span class="skeleton" style="width:55%;height:20px"></span><span class="skeleton" style="width:80%"></span><span class="skeleton" style="width:40%"></span><span class="skeleton" style="width:150px;height:40px;border-radius:10px"></span></div>`).join('')}</div></section>`;
        if (S.home.st === 'error')
          return `<section aria-labelledby="ob-h">${h}<div class="alert alert-danger" role="alert">${icon('alert', 17)}<div><div class="t">Could not load your declarations</div><div>Check your connection.</div><button class="btn btn-secondary btn-sm" data-act="retryHome">${icon('refresh', 15)} Try again</button></div></div></section>`;

        if (S.home.st === 'empty' || !list.length)
          return `<section aria-labelledby="ob-h">${h}<div class="card">${Kit.empty('No obligations yet', 'Declarations appear here when one falls due.', { icon: 'calendar' })}</div></section>`;
        const groups = [...new Set(list.map((o) => o.commission))];
        const grouped = groups.length > 1;
        return `<section aria-labelledby="ob-h">${h}${
          grouped
            ? groups
                .map((g) => {
                  const c = comm(g);
                  return `<div style="margin-bottom:18px"><div class="ob-group-h"><span class="mono-code">${c.code}</span>${esc(c.name)}</div><div class="ob-list">${sortObls(
                    list.filter((o) => o.commission === g),
                  )
                    .map((o) => oblCard(o, true))
                    .join('')}</div></div>`;
                })
                .join('')
            : `<div class="ob-list">${sortObls(list)
                .map((o) => oblCard(o, false))
                .join('')}</div>`
        }</section>`;
      }
      function accountCard() {
        const cs = S.home.multi
          ? [
              ['tsc', ME.fileNo, '26 Sep 2026'],

        return `<div class="card acct">
    <div class="card-head"><span class="ico" style="background:var(--ok-soft);color:var(--ok)">${icon('userCheck', 17)}</span><div style="flex:1;min-width:0"><h3>Your account</h3><div class="small muted truncate">${ME.full}</div></div></div>
    <dl class="dl" style="padding:2px 20px 6px">
      <div><dt>Responsible Commission</dt><dd style="flex-direction:column;align-items:flex-end;gap:2px">${cs.map(([s]) => `<span>${esc(comm(s).name)}</span>`).join('')}</dd></div>
      <div><dt>Officer reference</dt><dd><span class="mono" style="font-weight:600">${ME.ofr}</span>${copyBtn(ME.ofr, 'Officer reference')}</dd></div>
      <div><dt>Email</dt><dd class="stackv"><span class="truncate" style="max-width:200px">${ME.email}</span>${vOk()}</dd></div>
      <div><dt>Phone</dt><dd class="stackv"><span>${ME.phone}</span>${vOk()}</dd></div>
    </dl>
    <div class="card-foot small muted" style="align-items:flex-start;gap:8px;flex-wrap:nowrap"><span style="display:flex;margin-top:1px">${icon('shield', 15)}</span><span>${cs.map(([s, , d]) => `Onboarded ${S.home.multi ? `at ${comm(s).code} ` : ''}on ${d}`).join('<br/>')}</span></div>
  </div>`;
      }
      screens.home = () => {
        const list = S.home.st === 'ok' ? visibleObls() : [];
        const todo = list.filter((o) => ['due', 'overdue'].includes(oblStatus(o))).length;
        const title =
          S.home.st !== 'ok' || S.home.st === 'notdecl'

              ? `You have ${plural(todo, 'declaration')} to make`

                ? 'You are up to date'
                : 'Welcome to Adili';
        return portalShell(
          `<div class="page">
    <h1 class="page-title">${title}</h1>
    <div class="home-grid">
      <div class="stack-lg">${S.home.st === 'notdecl' ? accountCard() : obligationsSection()}${S.home.st === 'ok' && S.home.access ? accessHomeCard() : ''}${S.home.st === 'ok' || S.home.st === 'notdecl' ? commissionCards() : ''}</div>
      <div class="stack-lg">${S.home.st === 'notdecl' ? '' : accountCard()}
        <div class="card card-pad"><div class="section-title">Need help?</div><p class="small muted" style="margin-top:4px">Quote your officer reference. Never share your ID number or codes.</p><div class="row wrap" style="gap:8px;margin-top:14px"><button class="btn btn-secondary btn-sm" data-act="askOpen">${icon('sparkles', 15)} Ask Adili</button><button class="btn btn-ghost btn-sm" data-act="go" data-arg="help">${icon('help', 15)} Help articles</button></div></div>
      </div>
    </div>
  </div>${S.home.st === 'notdecl' ? '' : askUi()}`,
          { active: 'Home' },
        );
      };
      actions.retryHome = () => {
        S.home.st = 'loading';
        Kit.render();
        setTimeout(() => {
          S.home.st = 'ok';
          Kit.render();
        }, 900);
      };
      actions.openObl = (id) => {
        S.modal = { kind: 'obligation', id };
        Kit.render();
      };

      function reminderTable(o) {
        if (!o.reminders.length) return `<p class="small muted">None sent yet.</p>`;
        const ic = (r) =>
          r.outcome === 'sent'
            ? `<span style="color:var(--ok);display:flex">${icon('check', 14, 2.6)}</span>`
            : r.outcome === 'failed'
              ? `<span style="color:var(--danger);display:flex">${icon('alert', 14)}</span>`
              : `<span style="color:var(--muted);display:flex">${icon('minus', 14)}</span>`;
        return `<div class="table-wrap"><table class="rtable"><caption class="sr-only">Reminder history</caption>
    <thead><tr><th scope="col">When</th><th scope="col">Scheduled</th><th scope="col">Sent</th><th scope="col">Channels</th><th scope="col">Outcome</th></tr></thead>
    <tbody>${o.reminders.map((r) => `<tr><td style="font-weight:500" class="dt">${r.offsetDays} days before</td><td class="dt" data-l="Scheduled">${fmtDateTime(r.scheduledAt)}</td><td class="dt" data-l="Sent">${r.sentAt ? fmtDateTime(r.sentAt) : '-'}</td><td class="dt" data-l="Channels">${r.channels.length ? r.channels.map((x) => (x === 'sms' ? 'SMS' : 'Email')).join(', ') : '-'}</td><td class="oc"><span class="outcome">${ic(r)}${OUTCOME_COPY[r.outcome](r.channels)}</span></td></tr>`).join('')}</tbody></table></div>`;

        const st = oblStatus(o);
        const cycle =
          o.type === 'initial'
            ? `Appointment on ${fmtDate(o.statementDate)}`
            : o.type === 'final'
              ? `Exit on ${fmtDate(o.statementDate)}`
              : `Biennial ${o.statementDate.slice(0, 4)}`;
        return drawer({
          title: typeLabel(o),
          sub: `${esc(c.name)} · <span class="mono">${c.code}</span>`,
          wide: true,
          body: `<div class="row wrap" style="gap:8px">${statusBadge(st)}${st !== 'filed' ? `<span class="badge">${relText(o)}</span>` : ''}</div>
      ${st === 'overdue' ? `<div class="alert alert-warn">${icon('alert', 16)}<div><b>Overdue.</b> If you have already declared by other means, contact your Commission.</div></div>` : ''}

      ${reminderTable(o)}</div>`,
          foot: `<button class="btn btn-secondary" data-act="closeModal">Close</button>${startBtn(o)}`,
        });
      };

      /* =====================================================================
       * DECLARATION WORKSPACE (spec 05)
       * ===================================================================== */
      const ci = () => S.decls.indexOf(cur());
      const P = (path) => `decls.${ci()}.${path}`;
      const nm = (p) => [p.first, p.other, p.surname].filter(Boolean).join(' ') || 'New person';
      const initials = (p) =>
        (((p.first || p.other || '')[0] || '') + ((p.surname || '')[0] || '')).toUpperCase() || '?';
      const childIncluded = (D, c) => {
        const a = ageOn(c.dob, D.statementDate);
        return a !== null && a < 18;
      };
      function persons(D) {
        const ps = [
          {
            key: 'officer',
            name: ME.full,
            short: 'You',
            rel: 'You',
            kind: 'self',
            initials: ME.initials,
          },
        ];
        D.hh.spouses
          .filter((s) => !s.archived)
          .forEach((s) =>
            ps.push({
              key: 'spouse:' + s.id,
              name: nm(s),
              short: s.first || 'Spouse',
              rel: s.separated ? 'Spouse, separated' : 'Spouse',
              kind: 'spouse',
              initials: initials(s),
            }),
          );
        D.hh.children
          .filter((c) => !c.archived && childIncluded(D, c))
          .forEach((c) =>
            ps.push({
              key: 'child:' + c.id,
              name: nm(c),
              short: c.first || 'Child',
              rel: 'Child',
              kind: 'child',
              initials: initials(c),
            }),
          );
        ps.forEach((p) => {
          if (!D.st[p.key]) D.st[p.key] = emptyStatement();
        });
        return ps;
      }
      const CAT = {
        income: { label: 'Income', one: 'income item', nilKey: 'incomeNil' },
        assets: { label: 'Assets', one: 'asset', nilKey: 'assetsNil' },
        liabilities: { label: 'Liabilities', one: 'liability', nilKey: 'liabilitiesNil' },
      };

      /* issues: { key: section key, field, text, go: [screen, person, tab, itemId] } */
      function bioIssues(D) {
        const b = D.bio;
        const out = [];
        const add = (field, text) => out.push({ key: 'bio', field, text, go: ['decl-bio'] });
        const dob = parseDMY(b.dob);
        const age = dob ? ageOn(b.dob, D.statementDate) : null;
        if (!dob)
          add('dob', b.dob ? 'Enter a real date as DD/MM/YYYY.' : 'Enter your date of birth.');
        else if (age < 18 || age > 100)
          add(
            'dob',
            'Check your date of birth. You must be 18 to 100 years old on the statement date.',
          );
        if (b.place.trim().length < 2) add('place', 'Enter your place of birth.');
        if (!b.marital) add('marital', 'Choose your marital status.');
        if (b.postal.trim().length < 3) add('postal', 'Enter your postal address.');
        if (b.physical.trim().length < 3) add('physical', 'Enter your physical address.');
        if (!b.nature) add('nature', 'Choose the nature of your employment.');
        else if (b.nature === 'other' && !b.natureOther.trim())
          add('natureOther', 'Describe the nature of your employment.');
        if (b.msChanged && !b.msExplain.trim())
          add('msExplain', 'Explain the change in marital status.');
        if (b.appointed && !parseDMY(b.appointed))
          add('appointed', 'Enter a real date as DD/MM/YYYY.');
        if (b.kra && !/^[AP]\d{9}[A-Z]$/i.test(b.kra))
          add('kra', 'Check your KRA PIN, e.g. A000000000Z.');
        return out;
      }
      function hhIssues(D) {
        const h = D.hh;
        const out = [];
        const m = D.bio.marital;
        const add = (field, text, id) =>
          out.push({ key: 'household', field, text, go: ['decl-household', null, null, id] });
        const spouses = h.spouses.filter((s) => !s.archived);
        const kids = h.children.filter((c) => !c.archived);
        if (['single', 'divorced', 'widowed'].includes(m) && spouses.length)
          add(
            'spouses',
            `You said you are ${m}, but you added a spouse. Change your marital status in Your details, or remove the spouse.`,
          );
        if (['married', 'separated'].includes(m) && !spouses.length && !h.noSpouse)
          add('spouses', 'Add your spouse, or confirm you have none.');
        if (!m && !spouses.length && !h.noSpouse)
          add(
            'spouses',
            'Choose your marital status in Your details, then add your spouse if you have one.',
          );
        spouses.forEach((s, i) => {
          const who = s.first ? nm(s) : `Spouse ${i + 1}`;
          if (!s.surname.trim() || !s.first.trim())
            add('sp-name-' + s.id, `Enter ${who}'s surname and first name.`, s.id);
          if (s.nid && !/^\d{5,10}$/.test(s.nid))
            add('sp-nid-' + s.id, `Check ${who}'s national ID: 5 to 10 digits.`, s.id);
          if (s.kra && !/^[AP]\d{9}[A-Z]$/i.test(s.kra))
            add('sp-kra-' + s.id, `Check ${who}'s KRA PIN, e.g. A000000000Z.`, s.id);
          if (s.separated && !parseDMY(s.sepDate))
            add('sp-sep-' + s.id, `Enter the date you separated from ${who}.`, s.id);
        });
        if (!kids.length && !h.noChildren)
          add('children', 'Add your dependent children, or confirm you have none under 18.');
        kids.forEach((c, i) => {
          const who = c.first ? nm(c) : `Child ${i + 1}`;
          if (!c.surname.trim() || !c.first.trim())
            add('ch-name-' + c.id, `Enter ${who}'s surname and first name.`, c.id);
          if (!parseDMY(c.dob)) add('ch-dob-' + c.id, `Enter ${who}'s date of birth.`, c.id);
          if (c.nid && !/^\d{5,10}$/.test(c.nid))
            add('ch-nid-' + c.id, `Check ${who}'s national ID: 5 to 10 digits.`, c.id);
        });
        return out;
      }
      function itemIssues(cat, it) {
        const e = {};
        if (!it.type) e.type = 'Choose a type.';
        if (!String(it.desc).trim()) e.desc = 'Enter a short description.';
        const amt = toCents(cat === 'assets' ? it.value : it.amount);
        if (amt === null)
          e.amount =
            cat === 'income'
              ? 'Enter the approximate amount for the period.'
              : cat === 'assets'
                ? 'Enter the approximate value.'
                : 'Enter the amount outstanding.';
        else if (isNaN(amt))
          e.amount =
            'Enter an amount in shillings, e.g. 1,250,000 or 1,250,000.50. No minus signs.';
        if (cat === 'liabilities' && !String(it.creditor).trim()) e.creditor = 'Enter who you owe.';
        const abroad = cat === 'assets' ? it.loc === 'abroad' : it.abroad;
        if (cat === 'assets' && it.loc === 'kenya' && !it.county) e.county = 'Choose the county.';
        if (abroad && !it.country) e.country = 'Choose the country.';
        if (abroad && it.orig && isNaN(toCents(it.orig)))
          e.orig = 'Enter the original amount as a number.';
        if (abroad && it.orig && !it.cur) e.cur = 'Choose the original currency.';
        if (cat === 'assets' && it.joint) {
          const s = Number(it.share);
          if (!it.share || isNaN(s) || s <= 0 || s > 100)
            e.share = 'Enter your share as a percentage from 1 to 100.';
        }
        if (it.changed && !it.kind) e.kind = 'Choose what changed.';
        if (it.changed && !String(it.explain).trim()) e.explain = 'Explain the change.';
        return e;
      }
      function stIssues(D, p) {
        const st = D.st[p.key];
        const out = [];
        Object.keys(CAT).forEach((cat) => {
          const items = st[cat];
          const nil = st[CAT[cat].nilKey];
          if (!items.length && !nil)
            out.push({
              key: p.key,
              field: cat,
              text: `${p.kind === 'self' ? 'Your' : p.short + "'s"} ${CAT[cat].label.toLowerCase()}: add at least one, or tick "Nothing to declare".`,
              go: ['decl-statement', p.key, cat],
            });
          items.forEach((it, i) => {
            const e = itemIssues(cat, it);
            const ks = Object.keys(e);
            if (ks.length)
              out.push({
                key: p.key,
                field: it.id,
                text: `${p.kind === 'self' ? 'Your' : p.short + "'s"} ${CAT[cat].label.toLowerCase()}, ${it.desc ? '"' + it.desc + '"' : 'item ' + (i + 1)}: ${e[ks[0]].charAt(0).toLowerCase() + e[ks[0]].slice(1)}`,
                go: ['decl-statement', p.key, cat, it.id],
              });
          });
        });
        return out;
      }
      function otherIssues(D) {
        const o = D.other;
        const out = [];
        const add = (field, text) => out.push({ key: 'other', field, text, go: ['decl-other'] });
        o.directorships.forEach((d, i) => {

        o.memberships.forEach((m, i) => {

        if (!o.dual.holds) add('dual-holds', 'Say whether you hold another citizenship.');

          add('dual-country', 'Choose the other country of citizenship.');
        if (!o.dual.pending)
          add('dual-pending', 'Say whether you have a pending citizenship application.');
        o.cases.forEach((c, i) => {
          if (!c.forum.trim() || !c.ref.trim() || !c.nature.trim())
            add(
              'case-' + c.id,
              `Pending case ${i + 1}: enter the court or body, case reference and nature.`,
            );

        return out;
      }
      function completeness(D) {
        const ps = persons(D);
        const secs = [];
        const st = (key, issues, has) => ({
          key,
          issues,
          state:
            !D.touched[key] && !has ? 'not-started' : issues.length ? 'incomplete' : 'complete',
        });
        const b = bioIssues(D);
        secs.push(
          st(
            'bio',
            b,
            Object.entries(D.bio).some(([k, v]) => v && v !== false && D.hr?.[k] !== v),

        const h = hhIssues(D);
        secs.push(
          st(
            'household',
            h,
            D.hh.spouses.length || D.hh.children.length || D.hh.noSpouse || D.hh.noChildren,
          ),

        ps.forEach((p) => {
          const s = D.st[p.key];
          secs.push(
            st(
              p.key,
              stIssues(D, p),
              s.income.length ||
                s.assets.length ||
                s.liabilities.length ||
                s.incomeNil ||
                s.assetsNil ||
                s.liabilitiesNil,
            ),
          );
        });
        const o = otherIssues(D);
        secs.push(
          st(
            'other',
            o,
            D.other.directorships.length ||
              D.other.memberships.length ||
              D.other.cases.length ||
              D.other.dual.holds ||
              D.other.free,
          ),
        );
        const issues = secs.flatMap((s) => s.issues);
        const pct = Math.round(
          (secs.filter((s) => s.state === 'complete').length / secs.length) * 100,
        );
        return { secs, issues, pct, persons: ps, sec: (k) => secs.find((s) => s.key === k) };
      }
      const stateWord = {
        complete: 'Complete',
        incomplete: 'Incomplete',
        'not-started': 'Not started',
        archived: 'Archived',
      };
      const stateBadge = (s) =>
        s === 'complete'
          ? Kit.badge(`${icon('check', 12, 2.8)} Complete`, 'ok')

            ? Kit.badge(`${icon('alert', 12)} Incomplete`, 'warn')
            : s === 'archived'
              ? Kit.badge('Archived')
              : Kit.badge('Not started');
      function fieldErr(D, key, fieldName) {
        const cmp = completeness(D);
        const s = cmp.sec(key);
        if (!s) return '';
        const i = s.issues.find((x) => x.field === fieldName);
        if (!i) return '';
        if (!S.ui.showErrors) {

          const fmt = /Enter a real date|Check |No minus|as a number|from 1 to 100/.test(i.text);
          if (!fmt) return '';

      }

      /* autosave (debounced 1.5 s, If-Match) */
      let saveT = null,
        saveT2 = null;
      function paintSave() {
        document.querySelectorAll('[data-save]').forEach((el) => {
          el.outerHTML = saveInd();
        });
      }
      function markDirty() {
        if (S.save === 'conflict') return;
        const D = cur();
        if (!D) return;
        S.save = 'saving';
        paintSave();
        clearTimeout(saveT);
        clearTimeout(saveT2);
        saveT = setTimeout(() => {
          saveT2 = setTimeout(() => {
            if (S.saveFail) {
              S.save = 'retry';
              paintSave();
              saveT = setTimeout(() => {
                S.saveFail = false;
                markDirty();
              }, 6000);
              return;
            }
            S.save = 'saved';
            D.updatedAt = new Date().toISOString();
            Kit.render();
          }, 450);
        }, 1500);
      }
      function saveInd() {
        const s = S.save;
        const inner =
          s === 'saving'
            ? '<span class="spinner dark sm"></span> Saving…'
            : s === 'retry'
              ? `${icon('wifiOff', 14)} Could not save, retrying`
              : s === 'conflict'
                ? `${icon('alert', 14)} Edited elsewhere: reload to continue`
                : `${icon('cloud', 15)} Saved`;
        return `<span class="save-ind ${s}" data-save role="status" aria-live="${s === 'conflict' ? 'assertive' : 'polite'}">${inner}</span>`;
      }

      /* shared field helpers for the workspace */
      const toggle = (bind, label, { sub = '', disabled = false } = {}) =>
        `<label class="switch"><input type="checkbox" data-bind="${bind}" data-rerender ${Kit.getPath(S, bind) ? 'checked' : ''} ${disabled ? 'disabled' : ''}/><span class="tr"></span><span>${label}${sub ? `<div class="hint" style="margin-top:2px">${sub}</div>` : ''}</span></label>`;
      function segc(bind, options, { err = false, label = '' } = {}) {
        const v = Kit.getPath(S, bind);
        return `<div class="segc ${err ? 'is-invalid-group' : ''}" role="radiogroup" ${label ? `aria-label="${esc(label)}"` : ''}>${options.map(([k, l]) => `<label><input type="radio" name="${bind}" value="${esc(k)}" data-bind="${bind}" ${String(v) === String(k) ? 'checked' : ''}/>${esc(l)}</label>`).join('')}</div>`;
      }
      const moneyInput = (bind, { err = '', cur = 'KES', ph = '0' } = {}) =>
        `<div class="input-group ${err ? 'is-invalid' : ''}"><span class="addon">${cur}</span><input id="${fid(bind)}" class="input tabular" data-bind="${bind}" data-kes inputmode="decimal" autocomplete="off" value="${esc(Kit.getPath(S, bind))}" placeholder="${ph}" aria-invalid="${!!err}"/></div>`;
      const countySelect = (bind, err) =>
        select(bind, COUNTIES, { ph: 'Choose a county', cls: err ? 'is-invalid' : '' });
      const countrySelect = (bind, err) =>
        select(
          bind,
          COUNTRIES.map(([v, l]) => ({ v, l })),
          { ph: 'Choose a country', cls: err ? 'is-invalid' : '' },
        );
      const currencySelect = (bind, err) =>
        select(
          bind,
          CURRENCIES.map(([v, l]) => ({ v, l: `${v} · ${l}` })),
          { ph: 'Currency', cls: err ? 'is-invalid' : '' },
        );
      function dateInput(bind, { err = '' } = {}) {
        const open = S.ui.picker === bind;
        return `<div class="date-in"><div class="input-group ${err ? 'is-invalid' : ''}"><input id="${fid(bind)}" class="input tabular" data-bind="${bind}" data-date value="${esc(Kit.getPath(S, bind))}" placeholder="DD/MM/YYYY" inputmode="numeric" autocomplete="off" maxlength="10" aria-invalid="${!!err}"/><button type="button" class="btn btn-ghost" data-act="picker" data-arg="${bind}" aria-label="Choose a date from the calendar" aria-expanded="${open}">${icon('calendar', 17)}</button></div>${open ? pickerHtml(bind) : ''}</div>`;
      }
      function pickerHtml(bind) {
        const sel = parseDMY(Kit.getPath(S, bind));
        const pm = S.ui.pickerMonth || {
          y: (sel || TODAY_D).getFullYear(),
          m: (sel || TODAY_D).getMonth(),
        };
        const first = new Date(pm.y, pm.m, 1);
        const startDow = (first.getDay() + 6) % 7;
        const days = new Date(pm.y, pm.m + 1, 0).getDate();
        const years = [];
        for (let y = TODAY_D.getFullYear(); y >= 1920; y--) years.push(y);
        let cells = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su']
          .map((d) => `<span class="dow">${d}</span>`)
          .join('');

      }
      actions.picker = (bind) => {

      function mobileBar() {

                p.key,

        flushThen(() => Kit.go('decl-statement'));
      };
      function flushThen(fn) {
        if (S.save === 'saving') {
          clearTimeout(saveT);
          clearTimeout(saveT2);
          S.save = 'saved';
          const D = cur();
          if (D) D.updatedAt = new Date().toISOString();

        fn();
      }

      function declHead(title) {
        const D = cur();
        return `<div class="dhead"><h1>${title}</h1>
    <div class="meta"><span>${tip('Statement date', TIP_STATEMENT, 'left')} ${fmtDate(D.statementDate)}</span><span>${tip('Income', TIP_INCOME)} ${fmtDate(D.incomeFrom)} to ${fmtDate(D.incomeTo)}${D.fromSource === 'assumed' ? ` (${tip('start assumed', TIP_ASSUMED, 'right')})` : ''}</span>${D.status === 'amending' ? Kit.badge(`Amending version ${D.amendingFrom}`, 'info') : ''}</div></div>`;
      }
      function amendBanner(D) {
        const n = D.amendingFrom;
        return `<div class="amend-banner" role="note">${icon('info', 17)}<div class="txt">You are amending version ${n}. Submit again to file version ${n + 1}, or discard the amendment to keep version ${n}.</div><button class="btn btn-secondary btn-sm" data-act="askDiscardAmend" data-arg="${D.id}">Discard amendment</button></div>`;

      function ws(content, { title, prev = null, next = null }) {
        const D = cur();
        const foot =
          prev || next
            ? `<div class="dnav-foot">${prev ? `<button class="btn btn-secondary" data-act="${prev[2] || 'navSec'}" data-arg="${prev[0]}" aria-label="Back: ${esc(String(prev[1]).replace(/<[^>]+>/g, ''))}">${icon('left', 16)}<span class="pl">${prev[1]}</span></button>` : ''}<span class="spacer"></span>${next ? `<button class="btn btn-primary" data-act="${next[2] || 'navSec'}" data-arg="${next[0]}">${next[1]} ${icon('right', 16)}</button>` : ''}</div>`
            : '';

          `<div class="dws">${sectionNav()}<section class="dmain">
    ${mobileBar()}
    ${D.status === 'amending' ? amendBanner(D) : ''}
    ${S.save === 'conflict' ? `<div class="conflict-bar" role="alert">${icon('alert', 17)}<span>This declaration was changed on another device or tab. Reload to continue; your last saved work is kept.</span><span class="spacer"></span><button class="btn btn-secondary btn-sm" data-act="reloadConflict">${icon('refresh', 15)} Reload</button></div>` : ''}

    <fieldset class="plain" ${S.save === 'conflict' ? 'disabled' : ''}>${content}</fieldset>
    ${foot}
  </section></div>${askUi()}`,
          { active: 'Declarations', tabbar: false },

      }
      actions.reloadConflict = () => {
        S.save = 'saved';
        Kit.toast('Reloaded the latest saved version');
      };

      /* ---- Overview ---- */
      screens['decl-overview'] = () => {
        const D = cur();
        const cmp = completeness(D);
        const arch = [...D.hh.spouses, ...D.hh.children].filter((p) => p.archived);
        const line = (n, label, sub, s, act, arg) =>
          `<div class="item" data-act="${act}" data-arg="${arg}"><span class="ico" style="${s === 'complete' ? 'background:var(--ok-soft);color:var(--ok)' : ''}">${s === 'complete' ? icon('check', 16, 2.6) : n}</span><div class="item-body"><div class="t"><button class="linklike" style="text-decoration:none;font-weight:500;text-align:left" data-act="${act}" data-arg="${arg}">${label}</button></div>${sub ? `<div class="d">${sub}</div>` : ''}</div>${stateBadge(s)}${icon('right', 17)}</div>`;
        const firstOpen = cmp.secs.find((s) => s.state !== 'complete');
        const target = !firstOpen
          ? ['navSec', 'decl-summary']
          : firstOpen.key === 'bio'
            ? ['navSec', 'decl-bio']

              ? ['navSec', 'decl-household']

          `<div class="stack-lg">

      ${cmp.persons.map((p) => line('3', `Financial statement: ${esc(p.kind === 'self' ? 'you' : p.name)}`, p.kind === 'self' ? '' : p.rel, cmp.sec(p.key).state, 'openPerson', p.key)).join('')}
      ${arch.map((p) => `<div class="item" style="opacity:.7"><span class="ico">${icon('archive', 16)}</span><div class="item-body"><div class="t">Financial statement: ${esc(nm(p))}</div><div class="d">Removed. Kept until you discard.</div></div>${stateBadge('archived')}</div>`).join('')}
      ${line('4', 'Other information', '', cmp.sec('other').state, 'navSec', 'decl-other')}

    <div class="proto-note"><b>Prototype.</b> <a data-act="demoFill" data-arg="complete">Fill every section with demo answers</a> · <a data-act="demoFill" data-arg="partial">Half-way draft</a> · <a data-act="demoFill" data-arg="fresh">Empty draft</a></div>
  </div>`,
          {
            title: 'Your declaration',
          },

      };
      actions.demoFill = (lvl) => {
        const D = cur();
        const keep = {
          id: D.id,
          versions: D.versions,
          status: D.status,
          amendingFrom: D.amendingFrom,
          reference: D.reference,
        };

      };

        D.commission === 'psc'
          ? {
              fileNo: 'PSC/2009/118204',

      /* ---- Bio (paragraphs 1-5) ---- */
      screens['decl-bio'] = () => {

        const E = (f) => fieldErr(D, 'bio', f);
        const b = D.bio;
        return ws(
          `<div class="stack-lg">
    <div class="lock-block">

        <div><div class="k">Designation</div><div class="v">${roster(D).designation}</div></div>

      </div>
    </div>
    <div class="card card-pad stack-lg">
      <div class="grid-2">

      </div>
      <div class="field"><span class="label" id="ms-l">Marital status</span>${segc(P('bio.marital'), MARITAL, { err: !!E('marital'), label: 'Marital status' })}${errText(E('marital')) || rosterNote(D, 'marital')}</div>
      <div class="grid-2">
        ${field('Postal address', textarea(P('bio.postal'), { rows: 3, ph: 'P.O. Box 3100-30100, Eldoret', cls: E('postal') ? 'is-invalid' : '', extra: 'maxlength="200" style="min-height:84px"' }), { id: fid(P('bio.postal')), error: E('postal') })}
        ${field('Physical address', textarea(P('bio.physical'), { rows: 3, ph: 'House, estate or road, town', cls: E('physical') ? 'is-invalid' : '', extra: 'maxlength="200" style="min-height:84px"' }), { id: fid(P('bio.physical')), error: E('physical') })}
      </div>
      <div class="stack" style="gap:12px">
        ${toggle(P('bio.msChanged'), 'My marital status changed since my last declaration')}
        ${b.msChanged ? `<div class="subpanel">${field('Explain the change', textarea(P('bio.msExplain'), { rows: 3, ph: 'e.g. Married Mary Wanjiru Kennedy in April 2025.', cls: E('msExplain') ? 'is-invalid' : '', extra: 'style="min-height:80px" maxlength="1000"' }), { id: fid(P('bio.msExplain')), error: E('msExplain') })}</div>` : ''}
      </div>
    </div>
    <section class="card card-pad stack-lg" aria-labelledby="emp-h">
      <h2 id="emp-h" style="font-size:16px;font-weight:600">Employment and tax</h2>
      <div class="grid-2">
        ${field('Job group', input(P('bio.jobGroup'), { ph: 'e.g. D3 (T-Scale 13)', extra: 'maxlength="40"' }), { id: fid(P('bio.jobGroup')), opt: true, hint: rosterNote(D, 'jobGroup') })}
        ${field('Date of appointment', dateInput(P('bio.appointed'), { err: E('appointed') }), { id: fid(P('bio.appointed')), opt: true, error: E('appointed'), hint: rosterNote(D, 'appointed') })}
        ${field('Work station', input(P('bio.station'), { ph: 'e.g. Eldoret, Uasin Gishu', extra: 'maxlength="100"' }), { id: fid(P('bio.station')), opt: true, hint: rosterNote(D, 'station') })}
        ${field(
          'Nature of employment',
          select(
            P('bio.nature'),
            NATURE.map(([v, l]) => ({ v, l })),
            { ph: 'Choose one', rerender: true, cls: E('nature') ? 'is-invalid' : '' },
          ),
          { id: fid(P('bio.nature')), error: E('nature') },
        )}
        ${b.nature === 'other' ? field('Describe it', input(P('bio.natureOther'), { ph: 'e.g. Secondment from a county', cls: E('natureOther') ? 'is-invalid' : '', extra: 'maxlength="100"' }), { id: fid(P('bio.natureOther')), error: E('natureOther') }) : ''}
      </div>
      <div class="grid-2">
        ${field('KRA PIN', input(P('bio.kra'), { ph: 'A000000000Z', cls: E('kra') ? 'is-invalid' : '', extra: 'maxlength="11" autocapitalize="characters" autocomplete="off"' }), { id: fid(P('bio.kra')), opt: true, error: E('kra'), hint: b.kraStatus ? `${srcBadge({ kind: 'kra', at: b.kraAt, ref: 'PIN ' + maskPin(b.kra) })} Compliance: ${esc(b.kraStatus)}` : '' })}
      </div>
      ${kraLine(D)}
    </section>
  </div>`,
          {
            title: 'Your details',
            prev: ['decl-overview', 'Overview'],
            next: ['decl-household', 'Next: spouses and children'],
          },
        );
      };

      /* ---- Household (paragraphs 6-7) ---- */
      function personEditorCard(kind, p, i) {
        const D = cur();
        const open = S.ui.open === p.id;
        const base = P(
          `hh.${kind === 'spouse' ? 'spouses' : 'children'}.${D.hh[kind === 'spouse' ? 'spouses' : 'children'].indexOf(p)}`,
        );
        const E = (f) => fieldErr(D, 'household', f);
        const who =
          p.first || p.surname ? nm(p) : kind === 'spouse' ? `Spouse ${i + 1}` : `Child ${i + 1}`;
        let meta = '';
        let tag = '';
        if (kind === 'spouse') {
          meta = [
            p.nid ? `ID ${p.nid}` : 'No ID given',
            p.sector
              ? lab(SECTOR, p.sector) + (['public', 'private'].includes(p.sector) ? ' sector' : '')
              : '',
            p.separated ? `Separated${p.sepDate ? ' since ' + p.sepDate : ''}` : '',
          ]
            .filter(Boolean)
            .join(' · ');
        } else {
          const age = ageOn(p.dob, D.statementDate);
          meta = p.dob ? `Born ${p.dob}` : 'Date of birth not entered';
          tag =
            age === null
              ? `<div class="small muted" style="margin-top:4px">Add a date of birth</div>`
              : age < 18
                ? `<div class="small" style="margin-top:4px;color:var(--ok);font-weight:500">${icon('check', 13, 2.6)} Included: under 18 on ${fmtDate(D.statementDate)}</div>`
                : `<div class="small muted" style="margin-top:4px">${icon('minus', 13)} Not included: ${age} on the statement date</div>`;
        }
        const errs = hhIssues(D).filter((x) => x.go[3] === p.id);
        const sum = `<div class="rep-sum"><span class="avatar ${kind === 'spouse' ? 'spouse' : 'child'}" style="${kind === 'child' && !childIncluded(D, p) ? 'filter:grayscale(1);opacity:.55' : ''}">${esc(initials(p))}</span><div class="body"><div class="t"><h3 style="font:inherit;display:inline">${esc(who)}</h3></div><div class="d">${esc(meta)}</div>${tag}${!open && errs.length ? `<div class="small" style="color:var(--warn);margin-top:4px">${icon('alert', 12)} ${errs[0].text}</div>` : ''}</div>
    <div class="acts">${open ? '' : `<button class="btn btn-ghost icon-btn" data-act="openEditor" data-arg="${p.id}" aria-label="Edit ${esc(who)}">${icon('pencil', 16)}</button>`}<button class="btn btn-ghost icon-btn" data-act="askRemovePerson" data-arg="${kind}|${p.id}" aria-label="Remove ${esc(who)}">${icon('trash', 16)}</button></div></div>`;
        if (!open) return `<div class="rep-card" id="card-${p.id}">${sum}</div>`;
        const nameErr = E(`${kind === 'spouse' ? 'sp' : 'ch'}-name-${p.id}`);
        const edit = `<div class="rep-edit">
    <div class="grid-2">${field('Surname', input(`${base}.surname`, { cls: nameErr && !p.surname ? 'is-invalid' : '', extra: 'autocomplete="off"' }), { id: fid(`${base}.surname`) })}${field('First name', input(`${base}.first`, { cls: nameErr && !p.first ? 'is-invalid' : '', extra: 'autocomplete="off"' }), { id: fid(`${base}.first`) })}</div>
    ${errText(nameErr)}

         <div class="field"><span class="label">Occupation sector <span class="opt">Optional</span></span>${segc(`${base}.sector`, SECTOR, { label: 'Occupation sector' })}</div>
         ${toggle(`${base}.separated`, 'We are separated')}
         ${p.separated ? `<div class="subpanel">${field('Date of separation', dateInput(`${base}.sepDate`, { err: E('sp-sep-' + p.id) }), { id: fid(`${base}.sepDate`), error: E('sp-sep-' + p.id) })}<div class="callout callout-info" style="padding:10px 12px">${icon('info', 15)}<span>Declare what you know. Say so if you do not know.</span></div></div>` : ''}`
        : `<div class="grid-2">${field('Date of birth', dateInput(`${base}.dob`, { err: E('ch-dob-' + p.id) }), { id: fid(`${base}.dob`), error: E('ch-dob-' + p.id) })}${field('National ID', input(`${base}.nid`, { extra: 'inputmode="numeric" maxlength="10"' }), { id: fid(`${base}.nid`), opt: true, error: E('ch-nid-' + p.id) })}</div>`
    }
    <div class="foot"><button class="btn btn-primary btn-sm" data-act="closeEditor">Done</button></div>
  </div>`;
        return `<div class="rep-card open" id="card-${p.id}">${sum}${edit}</div>`;

          (x) => x.field === 'spouses' && x.text.startsWith('You said'),
        );
        const spEmpty = !spouses.length
          ? noSpouseStatus
            ? Kit.empty(
                'No spouse to declare.',
                `You said you are ${m}. Change it in Your details if needed.`,
                { icon: 'heart' },
              )
            : ['married', 'separated'].includes(m)
              ? h.noSpouse
                ? `<div class="nil-row">${checkbox(P('hh.noSpouse'), 'I have no spouse to declare')}</div>`
                : `<div class="alert alert-warn" role="${S.ui.showErrors ? 'alert' : 'note'}">${icon('alert', 17)}<div><div class="t">Add your spouse, or confirm you have none</div><div style="margin-top:10px">${checkbox(P('hh.noSpouse'), 'I have no spouse to declare')}</div></div></div>`
              : `<div class="callout callout-info">${icon('info', 16)}<span>Choose your marital status in <button class="linklike" data-act="navSec" data-arg="decl-bio">Your details</button> first. Then add your spouse if you have one.</span></div>`

      <div class="sec-b rep">

      <div class="sec-b rep">
        ${!kids.length ? `<div class="${E('children') ? 'alert alert-warn' : 'nil-row'}" ${E('children') ? 'role="alert"' : ''}>${E('children') ? icon('alert', 17) : ''}<div>${E('children') ? `<div class="t" style="margin-bottom:8px">${E('children')}</div>` : ''}${checkbox(P('hh.noChildren'), 'I have no dependent children under 18')}</div></div>` : ''}
        ${kids.map((c, i) => personEditorCard('child', c, i)).join('')}
        ${h.noChildren && !kids.length ? '' : `<button class="rep-add" data-act="addPerson" data-arg="child">${icon('plus', 17)} Add ${kids.length ? 'another child' : 'a child'}</button>`}
      </div>
    </section>
    ${archived.length ? `<div class="card card-pad"><div class="section-title" style="font-size:14.5px">Removed</div><div class="stack" style="gap:8px;margin-top:8px">${archived.map((p) => `<div class="row wrap" style="gap:10px;font-size:14px"><span style="display:flex;color:var(--muted)">${icon('archive', 16)}</span><span style="flex:1">${esc(nm(p))}: statement kept until you discard.</span><button class="btn btn-ghost btn-sm" data-act="restorePerson" data-arg="${p.id}">${icon('undo', 15)} Restore</button></div>`).join('')}</div></div>` : ''}
    <div class="callout callout-info">${icon('file', 16)}<span><b>Statements needed:</b> ${ps.map((p) => esc(p.kind === 'self' ? 'you' : p.name)).join(', ')}.</span></div>
  </div>`,
          {
            title: 'Spouses and children',
            prev: ['decl-bio', 'Your details'],
            next: ['officer', 'Next: financial statements', 'openPerson'],
          },
        );
      };
      actions.openEditor = (id) => {
        S.ui.open = id;
        S.ui.picker = null;
        Kit.render();
      };
      actions.closeEditor = () => {
        S.ui.open = null;
        S.ui.picker = null;
        Kit.render();
      };
      actions.addPerson = (kind) => {
        const D = cur();
        const p =
          kind === 'spouse'
            ? {
                id: uid('sp'),
                surname: '',
                first: '',

      actions.copyAsset = () => {

      /* ---- Attachments (#125) ---- */
      const ATT_COPY = {
        infected: 'This file failed the security scan and was not attached.',
        'rejected-type': 'This file type cannot be attached. Use a PDF, JPEG, PNG or HEIC file.',
        'rejected-size':
          'This file is larger than 20 MB. Use a smaller file or a lower-resolution photo.',
        failed: 'The upload did not finish. Check your connection and try again.',
      };
      function attachmentList(cat, pk, it) {
        const row = (a) => {
          const bad = ['infected', 'rejected-type', 'rejected-size', 'failed'].includes(a.st);
          const status =
            a.st === 'uploading'
              ? `Uploading… ${a.pct || 0}%<div class="bar" role="progressbar" aria-valuenow="${a.pct || 0}" aria-valuemin="0" aria-valuemax="100" aria-label="Upload progress"><i style="width:${a.pct || 0}%"></i></div>`
              : a.st === 'scanning'
                ? 'Checking the file for viruses…'
                : a.st === 'linked'
                  ? `${fmtSize(a.size)} · ${a.read ? 'Read into the form' : 'Attached'}`
                  : ATT_COPY[a.st];
          const ic =
            a.st === 'uploading'
              ? icon('upload', 16)
              : a.st === 'scanning'
                ? '<span class="spinner dark sm"></span>'
                : bad
                  ? icon('alert', 16)
                  : icon('file', 16);
          const mid = 'am-' + a.id;
          const act =
            a.st === 'linked'
              ? `<div class="menu-wrap"><button class="btn btn-ghost icon-btn" data-act="menu" data-arg="${mid}" aria-label="Actions for ${esc(a.name)}" aria-haspopup="menu" aria-expanded="${S.menu === mid}">${icon('moreV', 16)}</button>${S.menu === mid ? `<div class="menu" role="menu">${S.ai.extract === 'enabled' ? `<button role="menuitem" data-act="exStart" data-arg="${cat}|${pk}|${it.id}|${a.id}"><span style="color:var(--ai);display:flex">${icon('sparkles', 16)}</span> Read into the form</button>` : `<div class="menu-note">${icon('sparkles', 15)}<span>Read into the form: not enabled for your Commission</span></div>`}<button role="menuitem" class="danger" data-act="askRemoveAtt" data-arg="${cat}|${pk}|${it.id}|${a.id}">${icon('trash', 16)} Remove</button></div>` : ''}</div>`
              : a.st === 'failed'
                ? `<button class="btn btn-secondary btn-sm" data-act="retryAtt" data-arg="${cat}|${pk}|${it.id}|${a.id}">Try again</button><button class="btn btn-ghost icon-btn" data-act="dismissAtt" data-arg="${cat}|${pk}|${it.id}|${a.id}" aria-label="Dismiss">${icon('x', 16)}</button>`
                : bad
                  ? `<button class="btn btn-ghost icon-btn" data-act="dismissAtt" data-arg="${cat}|${pk}|${it.id}|${a.id}" aria-label="Dismiss message about ${esc(a.name)}">${icon('x', 16)}</button>`
                  : '';
          return `<div class="att ${bad ? 'bad' : ''}" ${bad ? 'role="alert"' : ''}><span class="fi">${ic}</span><div style="flex:1;min-width:0"><div class="nm">${esc(a.name)}</div><div class="st" aria-live="polite">${status}</div></div>${act}</div>`;
        };
        return `<div class="field"><span class="label"><span>Documents</span><span class="opt">Optional</span></span>
    <div class="hint" style="margin-top:-2px">A title deed, logbook or statement helps verification.</div>
    ${it.atts.length ? `<div class="att-list">${it.atts.map(row).join('')}</div>` : ''}
    <div class="row wrap" style="gap:10px"><label class="att-add">${icon('clip', 16)} Add document<input type="file" accept=".pdf,.jpg,.jpeg,.png,.heic,application/pdf,image/jpeg,image/png,image/heic" data-act-change="attach" data-item="${cat}|${pk}|${it.id}" aria-label="Add a document to this ${CAT[cat].one}"/></label><span class="hint">PDF, JPEG, PNG or HEIC, up to 20 MB.</span></div>
  </div>`;
      }
      const findItem = (cat, pk, id) => cur().st[pk][cat].find((x) => x.id === id);
      function runUpload(it, a) {
        a.st = 'uploading';
        a.pct = 0;
        Kit.render();
        const t = setInterval(() => {
          if (!it.atts.includes(a)) return clearInterval(t);
          a.pct = Math.min(100, a.pct + 18 + Math.round(Math.random() * 10));
          if (/fail/i.test(a.name) && a.pct >= 54 && !a.retried) {
            clearInterval(t);
            a.st = 'failed';
            Kit.render();
            return;
          }
          if (a.pct >= 100) {
            clearInterval(t);
            a.st = 'scanning';
            Kit.render();
            setTimeout(() => {
              a.st = /virus|eicar/i.test(a.name) ? 'infected' : 'linked';
              if (a.st === 'linked') markDirty();
              Kit.render();
              announce(a.st === 'linked' ? `${a.name} attached` : ATT_COPY.infected);
            }, 1400);
            return;
          }
          Kit.render();
        }, 260);
      }
      actions.attach = (el) => {
        const [cat, pk, id] = el.dataset.item.split('|');

        [...el.files].forEach((f) => {
          const a = { id: uid('a'), name: f.name, size: f.size, st: 'uploading', pct: 0 };
          it.atts.push(a);
          if (!/\.(pdf|jpe?g|png|heic)$/i.test(f.name)) {
            a.st = 'rejected-type';
            return;
          }
          if (f.size > 20 * 1048576) {
            a.st = 'rejected-size';
            return;
          }
          runUpload(it, a);
        });
        el.value = '';
        Kit.render();
      };
      actions.retryAtt = (a) => {
        const [cat, pk, id, aid] = a.split('|');
        const it = findItem(cat, pk, id);
        const x = it.atts.find((y) => y.id === aid);
        x.retried = true;
        runUpload(it, x);
      };
      actions.dismissAtt = (a) => {
        const [cat, pk, id, aid] = a.split('|');

      ${mc.length ? mc.map((c) => `<div class="item"><div class="item-body"><div class="t">${esc(c.who)} · ${esc(c.what)}: ${KIND_WORDS[c.kind] || 'kind not chosen'}</div><div class="d">${c.explain ? esc(c.explain) : '<span style="color:var(--warn)">No explanation yet</span>'}</div></div><button class="btn btn-ghost btn-sm" data-act="goIssue" data-arg="${esc(JSON.stringify(c.go))}">Edit</button></div>`).join('') : `<div class="empty" style="padding:22px 20px"><h4>No changes flagged</h4><p>Mark an item "Changed since my last declaration" to list it here.</p></div>`}

      <div class="counter" data-counter-for aria-live="off">${num(o.free.length)} / 4,000 characters</div>

      function submitState(D, cmp) {

          `<div class="stack-lg">
    ${S.ui.stepUpFailed ? `<div class="alert alert-danger" role="alert" tabindex="-1" id="su-alert">${icon('alert', 17)}<div><div class="t">We could not confirm your identity. Try again.</div><button class="btn btn-primary btn-sm" data-act="submitStart">${icon('shield', 15)} Confirm identity</button></div></div>` : ''}

          const self = p.kind === 'self';
          if (CAT[i.field]) {

            return `${self ? 'Your' : p.short + "'s"} statement has no ${CAT[i.field].label.toLowerCase()}. If ${pr} had none, tick "Nothing to declare".`;

          if (/explain/i.test(i.text))
            return 'Say briefly what changed, for example what was bought and how it was paid for.';
          if (/value|amount/i.test(i.text))
