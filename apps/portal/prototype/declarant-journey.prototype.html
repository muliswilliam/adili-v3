<!doctype html>
<!-- PROTOTYPE - throwaway. Question: what does the declarant portal look like end to end, from Get started (spec 03) through obligations (04), declaration capture (05) to step-up, submission, slip and amendments (06)? Covers tickets #64 #66 #69 #72 #75 #87 #89 #93 #114 #116 #119 #122 #125 #128 #137 #139 #142 #148. Open by double-clicking. State is in memory (a snapshot survives the Keycloak step-up round trip via sessionStorage). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dials - Declarant journey (prototype)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../../packages/ui/prototype/kit.css" />
    <style>
      /* ---------- generic helpers ---------- */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .proto-note {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 11.5px;
        line-height: 1.45;
        color: #6d5a2a;
        background: #fffaf0;
        border: 1px dashed #e2c98f;
        border-radius: 8px;
        padding: 7px 10px;
      }
      .proto-note b {
        color: #4d3d10;
      }
      .proto-note a {
        color: #4d3d10;
        font-weight: 600;
        cursor: pointer;
      }
      .err-text {
        color: var(--danger);
        font-weight: 500;
        font-size: 13px;
        display: flex;
        gap: 6px;
        align-items: flex-start;
      }
      .err-text svg {
        flex: none;
        margin-top: 2px;
      }
      .is-invalid {
        box-shadow: 0 0 0 1.5px var(--danger) !important;
      }
      .alert {
        display: flex;
        gap: 12px;
        padding: 14px 16px;
        border-radius: var(--r);
        font-size: 14px;
        line-height: 1.5;
      }
      .alert > svg {
        flex: none;
        margin-top: 2px;
      }
      .alert .t {
        font-weight: 600;
      }
      .alert-danger {
        background: var(--danger-soft);
        color: #8a1c14;
      }
      .alert-warn {
        background: var(--warn-soft);
        color: #6b4000;
      }
      .alert-info {
        background: #eaf1fb;
        color: #1f4f96;
      }
      .alert-ok {
        background: var(--ok-soft);
        color: #0f5a2d;
      }
      .alert .btn {
        margin-top: 10px;
      }
      .alert .btn-secondary {
        color: var(--ink);
      }
      .cd {
        font-variant-numeric: tabular-nums;
      }
      .linklike {
        background: none;
        border: 0;
        padding: 0;
        color: var(--ink);
        font-weight: 500;
        text-decoration: underline;
        text-decoration-color: var(--line-2);
        text-underline-offset: 3px;
        cursor: pointer;
        font-size: inherit;
      }
      .linklike:hover {
        text-decoration-color: var(--ink);
      }
      .linklike[disabled] {
        color: var(--muted);
        text-decoration: none;
        cursor: default;
      }
      :focus-visible {
        outline: 3px solid rgba(233, 90, 36, 0.45);
        outline-offset: 2px;
      }
      .btn:focus-visible,
      .linklike:focus-visible,
      a:focus-visible {
        outline: 3px solid rgba(233, 90, 36, 0.45);
        outline-offset: 2px;
      }
      .spinner.sm {
        width: 14px;
        height: 14px;
        border-width: 2px;
      }
      .kbd-hint {
        font-size: 12px;
        color: var(--muted);
      }

      /* ---------- auth / onboarding ---------- */
      .stepper-wrap {
        margin-bottom: 26px;
      }
      .stepper-wrap .stepper {
        margin-bottom: 8px;
      }
      .stepper-wrap .lbl {
        font-size: 13px;
        color: var(--muted);
        font-weight: 500;
      }
      .stepper-wrap .lbl b {
        color: var(--ink);
        font-weight: 600;
      }
      .gs-foot-help {
        margin-top: 28px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        font-size: 13.5px;
        color: var(--muted);
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .gs-foot-help svg {
        flex: none;
        margin-top: 2px;
      }
      .gs-h1 {
        font-size: 26px;
        line-height: 1.2;
        letter-spacing: -0.02em;
        font-weight: 600;
      }
      .gs-sub {
        color: var(--muted);
        margin-top: 8px;
      }
      .combo {
        position: relative;
      }
      .combo .input-group .ico {
        display: flex;
        align-items: center;
        padding-left: 12px;
        color: var(--muted);
      }
      .combo-list {
        margin-top: 8px;
        border-radius: 12px;
        background: var(--surface);
        box-shadow: var(--shadow-pop);
        max-height: 320px;
        overflow-y: auto;
        padding: 6px;
      }
      .combo-opt {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 10px 10px;
        border: 0;
        background: none;
        border-radius: 9px;
        text-align: left;
        cursor: pointer;
        font: inherit;
        color: inherit;
      }
      .combo-opt:hover,
      .combo-opt.act {
        background: var(--sunken);
      }
      .combo-opt .mono-code {
        flex: none;
        min-width: 58px;
        height: 26px;
        padding: 0 6px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        background: var(--brand-soft);
        color: var(--brand-ink);
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .combo-opt .nm {
        flex: 1;
        min-width: 0;
        font-weight: 500;
        font-size: 14.5px;
        line-height: 1.3;
      }
      .combo-empty {
        padding: 16px 12px;
        font-size: 14px;
        color: var(--muted);
      }
      .chosen {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-radius: var(--r);
        background: var(--surface);
        box-shadow: 0 0 0 1.5px var(--ink);
      }
      .chosen .mono-code {
        flex: none;
        min-width: 58px;
        height: 30px;
        padding: 0 6px;
        border-radius: 7px;
        display: grid;
        place-items: center;
        background: var(--brand-soft);
        color: var(--brand-ink);
        font-family: ui-monospace, Menlo, monospace;
        font-size: 12px;
        font-weight: 600;
      }
      .comm-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px 6px 6px;
        border-radius: 999px;
        background: var(--surface);
        box-shadow: var(--shadow-input);
        font-size: 13.5px;
        font-weight: 500;
        max-width: 100%;
      }
      .comm-chip .mono-code {
        height: 22px;
        padding: 0 7px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: var(--brand-soft);
        color: var(--brand-ink);
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11px;
        font-weight: 600;
      }
      .otp {
        flex-wrap: nowrap;
      }
      .otp.err input {
        box-shadow: 0 0 0 1.5px var(--danger);
      }
      .otp.dis input {
        background: var(--sunken);
        color: var(--muted);
        pointer-events: none;
      }
      .otp-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .otp-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 14px;
      }
      .masked {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .vbadge-ok {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 22px;
        padding: 0 8px;
        border-radius: 999px;
        background: var(--ok-soft);
        color: var(--ok);
        font-size: 12px;
        font-weight: 500;
        vertical-align: 1px;
        white-space: nowrap;
      }
      .ofr-card {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border-radius: var(--r-lg);
        background: var(--brand-softer);
        box-shadow: 0 0 0 1px #f3dccd;
      }
      .ofr-card .v {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .landing-feats {
        display: grid;
        gap: 10px;
        margin-top: 28px;
      }
      .landing-feats div {
        display: flex;
        gap: 12px;
        align-items: center;
        font-size: 14.5px;
        color: var(--ink-2);
      }
      .landing-feats .ico {
        width: 32px;
        height: 32px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        background: var(--brand-soft);
        color: var(--brand-ink);
        flex: none;
      }

      /* ---------- tooltips ---------- */
      .tip {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 3px;
        border-bottom: 1px dotted currentColor;
        cursor: help;
      }
      .tip .tip-ico {
        display: inline-flex;
        color: var(--muted);
      }
      .tip .bubble {
        position: absolute;
        left: 50%;
        bottom: calc(100% + 8px);
        transform: translateX(-50%);
        width: max-content;
        max-width: 260px;
        padding: 9px 11px;
        border-radius: 9px;
        background: #1c1c1c;
        color: #fff;
        font-size: 12.5px;
        font-weight: 400;
        line-height: 1.45;
        box-shadow: var(--shadow-pop);
        z-index: 40;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.12s;
        white-space: normal;
        text-align: left;
        letter-spacing: 0;
      }
      .tip:hover .bubble,
      .tip:focus .bubble,
      .tip:focus-within .bubble {
        opacity: 1;
      }
      .tip.left .bubble {
        left: 0;
        transform: none;
      }
      .tip-btn {
        position: relative;
        display: inline-flex;
      }
      .tip-btn .bubble {
        position: absolute;
        right: 0;
        bottom: calc(100% + 8px);
        width: max-content;
        max-width: 240px;
        padding: 9px 11px;
        border-radius: 9px;
        background: #1c1c1c;
        color: #fff;
        font-size: 12.5px;
        line-height: 1.45;
        box-shadow: var(--shadow-pop);
        z-index: 40;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.12s;
        white-space: normal;
        font-weight: 400;
      }
      .tip-btn:hover .bubble,
      .tip-btn:focus-within .bubble {
        opacity: 1;
      }

      /* ---------- dashboard ---------- */
      .ob-group-h {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 6px 0 10px;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--ink-2);
      }
      .ob-group-h .mono-code {
        height: 22px;
        padding: 0 7px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        background: var(--sunken);
        color: var(--ink-2);
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11px;
        font-weight: 600;
      }
      .ob {
        position: relative;
        overflow: visible;
        border-radius: 20px;
        padding: 22px;
        cursor: pointer;
      }
      @container app (min-width: 700px) {
        .ob {
          padding: 26px 28px;
        }
      }
      .ob.due {
        background: linear-gradient(135deg, #fff5ee 0%, #fde6d7 100%);
        box-shadow: 0 0 0 1px #f6d9c6;
      }
      .ob.overdue {
        background: linear-gradient(135deg, #fff8ec 0%, #fdebc8 100%);
        box-shadow: 0 0 0 1px #f0d49a;
      }
      .ob.upcoming,
      .ob.filed {
        background: var(--surface);
        box-shadow: var(--shadow-card);
      }
      .ob.filed {
        background: linear-gradient(135deg, #f5fbf7, #e7f5ec);
        box-shadow: 0 0 0 1px #cfe9d8;
      }
      .ob:hover {
        filter: brightness(0.995);
        box-shadow:
          0 0 0 1px var(--line-2),
          0 6px 20px -10px rgba(0, 0, 0, 0.18);
      }
      .ob .glow {
        position: absolute;
        right: 0;
        top: 0;
        width: 240px;
        height: 200px;
        border-radius: 0 20px 0 0;
        background: radial-gradient(circle at 100% 0, rgba(233, 90, 36, 0.18), transparent 65%);
        pointer-events: none;
      }
      .ob.overdue .glow {
        background: radial-gradient(circle at 100% 0, rgba(217, 138, 0, 0.2), transparent 65%);
      }
      .ob h3 {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.25;
      }
      @container app (min-width: 700px) {
        .ob h3 {
          font-size: 22px;
        }
      }
      .ob .meta {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px 20px;
        margin: 18px 0 20px;
      }
      @container app (min-width: 700px) {
        .ob .meta {
          grid-template-columns: repeat(4, auto);
          justify-content: start;
          gap: 12px 40px;
        }
      }
      .ob .meta .k {
        font-size: 12.5px;
        color: #8a5a3e;
        font-weight: 500;
      }
      .ob.upcoming .meta .k,
      .ob.filed .meta .k {
        color: var(--muted);
      }
      .ob .meta .v {
        font-size: 15px;
        font-weight: 600;
      }
      .ob .acts {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .ob .overdue-note {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        font-size: 13.5px;
        color: #7a3a00;
        margin-top: 8px;
      }
      .ob .overdue-note b {
        color: var(--danger);
      }
      .ob-list {
        display: grid;
        gap: 14px;
      }
      .rel-badge.due {
        background: rgba(255, 255, 255, 0.8);
        color: var(--brand-ink);
        box-shadow: 0 0 0 1px #f3d2bd;
      }
      .rel-badge.plain {
        background: rgba(255, 255, 255, 0.8);
        color: var(--ink-2);
        box-shadow: 0 0 0 1px var(--line);
      }
      .rel-badge.overdue {
        background: rgba(255, 255, 255, 0.8);
        color: var(--danger);
        box-shadow: 0 0 0 1px #efd3a0;
      }
      .acct .dl dd.stackv {
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
      }
      .fromc .item {
        padding: 14px 20px;
      }
      .fromc .item .t {
        font-size: 14.5px;
      }
      .acct .dl dd {
        display: flex;
        align-items: center;
        gap: 6px;
        justify-content: flex-end;
        flex-wrap: wrap;
      }
      .skel-card {
        border-radius: 20px;
        padding: 24px;
        background: var(--surface);
        box-shadow: var(--shadow-card);
        display: grid;
        gap: 12px;
      }

      /* reminders table */
      .rtable {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
      }
      .rtable caption {
        text-align: left;
        font-weight: 600;
        font-size: 14.5px;
        padding-bottom: 8px;
        color: var(--ink);
      }
      .rtable th {
        text-align: left;
        font-weight: 500;
        font-size: 12px;
        color: var(--muted);
        padding: 8px 10px 8px 0;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      .rtable td {
        padding: 10px 10px 10px 0;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      .rtable tr:last-child td {
        border-bottom: 0;
      }
      .rtable td.dt {
        white-space: nowrap;
      }
      .outcome {
        display: inline-flex;
        gap: 6px;
        align-items: flex-start;
      }
      .outcome svg {
        flex: none;
        margin-top: 2px;
      }
      @container app (max-width: 599px) {
        .rtable thead {
          display: none;
        }
        .rtable tr {
          display: grid;
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
          gap: 2px 10px;
          padding: 10px 0;
          border-bottom: 1px solid var(--line);
        }
        .rtable td {
          border: 0;
          padding: 0;
        }
        .rtable td.dt {
          white-space: normal;
        }
        .rtable td[data-l]::before {
          content: attr(data-l) ': ';
          color: var(--muted);
        }
        .rtable td.oc {
          grid-column: 1 / -1;
          margin-top: 4px;
        }
      }

      /* ---------- declaration workspace ---------- */
      .dws {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 0;
        max-width: 1180px;
        margin: 0 auto;
        padding: 0 16px 40px;
      }
      @container app (min-width: 960px) {
        .dws {
          grid-template-columns: 272px minmax(0, 1fr);
          gap: 44px;
          padding: 32px 28px 72px;
        }
      }
      .snav {
        display: none;
      }
      @container app (min-width: 960px) {
        .snav {
          display: block;
          position: sticky;
          top: 92px;
          align-self: start;
        }
      }
      .snav ol {
        list-style: none;
        margin: 14px 0 0;
        padding: 0;
        display: grid;
        gap: 2px;
      }
      .snav li > button {
        display: flex;
        align-items: center;
        gap: 11px;
        width: 100%;
        padding: 8px 10px;
        border: 0;
        background: none;
        border-radius: var(--r-sm);
        cursor: pointer;
        text-align: left;
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        color: var(--ink-2);
      }
      .snav li > button:hover {
        background: var(--sunken);
      }
      .snav li.on > button {
        background: var(--surface);
        color: var(--ink);
        box-shadow: var(--shadow-card);
      }
      .snav .n {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 11.5px;
        font-weight: 600;
        box-shadow: inset 0 0 0 1.5px var(--line-2);
        color: var(--muted);
        flex: none;
      }
      .snav li.complete .n {
        box-shadow: none;
        background: var(--ok-soft);
        color: var(--ok);
      }
      .snav li.incomplete .n {
        box-shadow: inset 0 0 0 1.5px #e0b35c;
        color: var(--warn);
      }
      .snav li.on .n {
        box-shadow: none;
        background: var(--ink);
        color: #fff;
      }
      .snav .lb {
        flex: 1;
        min-width: 0;
        line-height: 1.3;
      }
      .snav .lb small {
        display: block;
        font-size: 12px;
        font-weight: 400;
        color: var(--muted);
      }
      /* Sections sheet rows have no icon, so opt out of the kit's mobile item grid. */
      .item.srow {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .snav .sub {
        list-style: none;
        margin: 8px 0 10px 22px;
        padding: 2px 0 2px 12px;
        border-left: 1.5px solid var(--line);
        display: grid;
        gap: 4px;
      }
      .snav .sub button {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 6px 8px;
        border: 0;
        background: none;
        border-radius: 7px;
        cursor: pointer;
        text-align: left;
        font: inherit;
        font-size: 13.5px;
        color: var(--ink-2);
      }
      .snav .sub button:hover {
        background: var(--sunken);
      }
      .snav .sub li.on button {
        background: var(--surface);
        color: var(--ink);
        box-shadow: var(--shadow-card);
        font-weight: 500;
      }
      .snav .sub .st {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        flex: none;
        box-shadow: inset 0 0 0 1.5px var(--line-2);
      }
      .snav .sub .st.complete {
        box-shadow: none;
        background: var(--ok-soft);
        color: var(--ok);
      }
      .snav .sub .st.incomplete {
        box-shadow: inset 0 0 0 1.5px #e0b35c;
      }
      .snav .foot {
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        display: grid;
        gap: 9px;
        font-size: 13px;
        color: var(--muted);
      }
      .snav .foot div {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .dmain {
        min-width: 0;
        max-width: 780px;
        padding-top: 14px;
      }
      @container app (min-width: 960px) {
        .dmain {
          padding-top: 0;
        }
      }
      .dhead {
        margin-bottom: 22px;
      }
      .decl-pager {
        margin-top: 12px;
      }
      .decl-pager .pager {
        border-top: 0;
      }
      .dhead .meta {
        font-size: 13.5px;
        color: var(--muted);
        margin-top: 6px;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        align-items: center;
      }
      .dhead h1 {
        font-size: 24px;

      /* money: formatted string <-> integer cents */
      function toCents(s) {
        if (s === '' || s == null) return null;
        const clean = String(s).replace(/,/g, '');
        if (!/^\d+(\.\d{0,2})?$/.test(clean)) return NaN;
        const [a, b = ''] = clean.split('.');
        return Number(a) * 100 + Number((b + '00').slice(0, 2));
      }
      function fmtCents(c, cur = 'KES') {
        if (c == null || isNaN(c)) return '-';
        const whole = Math.floor(c / 100);
        const frac = c % 100;
        return `${cur} ${whole.toLocaleString('en-KE')}${frac ? '.' + String(frac).padStart(2, '0') : ''}`;
      }
      function parseDMY(s) {
        const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(s || '').trim());
        if (!m) return null;
        const d = new Date(+m[3], +m[2] - 1, +m[1]);
        if (d.getFullYear() !== +m[3] || d.getMonth() !== +m[2] - 1 || d.getDate() !== +m[1])
          return null;
        return d;

        const m = at.getMonth() - d.getMonth();
        if (m < 0 || (m === 0 && at.getDate() < d.getDate())) a--;
        return a;

        return `${s}s`;

      actions.startOnboarding = () => {
        S.gs = freshState().gs;
        Kit.go('gs-commission');
      };
      actions.goLanding = () => Kit.go('landing');
      actions.pickCommission = (slug) => {
        S.gs.commission = slug;
        S.gs.comboOpen = false;
        S.gs.q = '';
        S.gs.notice = null;
        S.gs.idState = null;
        Kit.render();
      };
      actions.reopenCombo = () => {
        S.gs.comboOpen = true;
        Kit.render();
        setTimeout(() => document.getElementById('f-gs-q')?.focus(), 0);
      };

      /* ---- Step 2: Identify ---- */
      screens['gs-identify'] = () => {
        const g = S.gs;
        const c = comm(g.commission) || comm('tsc');
        const rate = g.idState === 'rate' && left(g.rateUntil);
        const busy = g.idState === 'submitting';
        let alert = '';
        if (g.idState === 'no-match')
          alert = `<div class="alert alert-danger" role="alert" tabindex="-1" id="id-alert">${icon('alert', 17)}<div>We could not match these details to ${esc(c.name)}'s roster. Check both numbers and try again. If they are correct, contact your Commission's reporting officer to have your record added or corrected.</div></div>`;
        if (g.idState === 'already')
          alert = `<div class="alert alert-info" role="alert" tabindex="-1" id="id-alert">${icon('userCheck', 17)}<div><div class="t">You already have an Adili account.</div><div class="row wrap" style="gap:8px;margin-top:10px"><a class="btn btn-primary btn-sm" href="${KC}">Sign in</a><a class="btn btn-secondary btn-sm" href="${KC}#reset-password">Recover access</a></div></div></div>`;
        if (g.idState === 'rate')
          alert = `<div class="alert alert-warn" role="alert" tabindex="-1" id="id-alert">${icon('clock', 17)}<div>Too many attempts. Try again in ${rate ? cd(g.rateUntil, 'min') : '1 minute'}.</div></div>`;
        if (g.idState === 'error')
          alert = `<div class="alert alert-danger" role="alert" tabindex="-1" id="id-alert">${icon('alert', 17)}<div>Something went wrong. Try again.</div></div>`;
        if (g.idState === 'no-roster')
          alert = `<div class="alert alert-warn" role="alert" tabindex="-1" id="id-alert">${icon('alert', 17)}<div>${esc(c.name)} has not yet imported its roster. You cannot onboard until it does. Ask your Commission's reporting officer when it will be ready.</div></div>`;
        const e = g.err || {};
        return gsLayout(
          `
    <h1 class="gs-h1">Identify yourself</h1>
    <div style="margin-top:12px"><span class="comm-chip"><span class="mono-code">${c.code}</span><span class="truncate">${esc(c.name)}</span></span></div>
    ${alert ? `<div style="margin-top:18px">${alert}</div>` : ''}
    <div class="stack" style="margin-top:22px">
      ${field('Personnel file number', input('gs.file', { cls: e.file ? 'is-invalid' : '', extra: `autocapitalize="off" autocomplete="off" spellcheck="false" maxlength="30" aria-invalid="${!!e.file}" ${busy ? 'readonly' : ''}` }), { id: 'f-gs-file', error: e.file, hint: 'As it appears on your payslip.' })}
      ${field('National ID number', input('gs.nid', { cls: e.nid ? 'is-invalid' : '', extra: `inputmode="numeric" autocomplete="off" maxlength="12" aria-invalid="${!!e.nid}" ${busy ? 'readonly' : ''}` }), { id: 'f-gs-nid', error: e.nid })}
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:22px" data-act="identify" ${busy || rate ? 'disabled' : ''}>${busy ? '<span class="spinner"></span> Checking…' : rate ? `${icon('clock', 16)} <span>Try again in ${cd(g.rateUntil, 'mmss')}</span>` : 'Continue'}</button>
    ${rate ? `<span class="sr-only" aria-live="polite" data-cd-sr="${g.rateUntil}"></span>` : ''}
    <div class="proto-note" style="margin-top:16px"><b>Prototype.</b> ${ME.fileNo} + ${ME.nid} matches John Kennedy. 552190 + 30112233 is already onboarded. Anything else is no match; the 6th attempt is rate-limited.</div>`,
          { step: 2, back: 'gs-commission' },
        );
      };
      actions.identify = () => {
        const g = S.gs;
        const e = {};
        const file = g.file.trim();
        const nid = g.nid.replace(/\s/g, '');
        if (!file || file.length > 30 || !/^[A-Za-z0-9/.\-]+$/.test(file))
          e.file = 'Enter your personnel file number as it appears on your payslip.';
        if (!/^\d{5,10}$/.test(nid)) e.nid = 'Enter your national ID number (5 to 10 digits).';
        g.err = e;
        g.idState = null;
        if (e.file || e.nid) {
          Kit.render();
          document.getElementById(e.file ? 'f-gs-file' : 'f-gs-nid')?.focus();
          return;
        }
        g.idState = 'submitting';
        Kit.render();
        setTimeout(() => {
          g.attempts++;
          if (g.attempts >= 6) {
            g.idState = 'rate';
            g.rateUntil = Date.now() + (14 * 60 + 32) * 1000;
          } else if (file.toLowerCase().replace(/^tsc\//, '') === ME.fileNo && nid === ME.nid) {
            g.idState = null;
            startSession();
            return Kit.go('gs-email');
          } else if (file === '552190' && nid === '30112233') g.idState = 'already';
          else g.idState = 'no-match';
          Kit.render();
          document.getElementById('id-alert')?.focus();
        }, 1100);
      };
      function startSession() {
        const f = freshState().gs;
        Object.assign(S.gs.email, f.email, { resendAt: Date.now() + 60000 });
        Object.assign(S.gs.phone, f.phone);
        S.gs.confirmed = false;
        S.gs.cfState = null;
        S.gs.outcome = S.gs.outcome || 'account-created';
      }

      /* ---- Steps 3-4: Verify email / phone ---- */
      function otpBlock(ch) {
        const c = S.gs[ch];
        const verifying = c.st === 'verifying';
        let otpHtml = Kit.otp(`gs.${ch}.code`, `verify_${ch}`).replace(
          'aria-label="6-digit code"',
          `aria-labelledby="otp-l-${ch}"`,
        );
        if (c.st === 'wrong' || c.st === 'expired')
          otpHtml = otpHtml.replace('class="otp"', 'class="otp err"');
        if (verifying)
          otpHtml = otpHtml
            .replace('class="otp"', 'class="otp dis"')
            .replace(/<input /g, '<input disabled ');
        const err =
          c.st === 'wrong'
            ? `That code is not right. ${plural(c.attemptsLeft, 'attempt')} left.`
            : c.st === 'expired'
              ? 'That code has expired. Resend to get a new one.'
              : '';
        const cool = left(c.resendAt);
        return `<div class="otp-group">
      <span class="label" id="otp-l-${ch}">6-digit code</span>
      ${otpHtml}
      ${verifying ? `<div class="row small muted" style="gap:8px" aria-live="polite"><span class="spinner dark sm"></span> Checking the code…</div>` : errText(err)}
      <div class="otp-row">
        <span>${cool ? `<button class="linklike" disabled aria-disabled="true">Resend in ${cd(c.resendAt, 's')}</button><span class="sr-only" aria-live="polite" data-cd-sr="${c.resendAt}"></span>` : `<button class="linklike" data-act="resend" data-arg="${ch}">Resend code</button>`}${c.resendsLeft < 3 ? `<span class="muted small"> · ${c.resendsLeft === 0 ? 'no more resends' : plural(c.resendsLeft, 'resend') + ' left'}</span>` : ''}</span>
      </div>
    </div>`;
      }
      function verifyScreen(ch) {
        const c = S.gs[ch];
        const isEmail = ch === 'email';
        const body =
          c.variant === 'contact'
            ? `<h1 class="gs-h1">Verify your ${isEmail ? 'email' : 'phone'}</h1>
       <p class="gs-sub">${isEmail ? 'No email on file. Enter one to get your code.' : 'No mobile number on file. Enter one to get your code.'}</p>
       <div class="stack" style="margin-top:22px">
         ${field(isEmail ? 'Email address' : 'Mobile number', input(`gs.${ch}.value`, { type: isEmail ? 'email' : 'tel', cls: c.contactErr ? 'is-invalid' : '', ph: isEmail ? 'name@example.com' : '0712 345 678', extra: `autocomplete="${isEmail ? 'email' : 'tel'}" ${isEmail ? '' : 'inputmode="tel"'} aria-invalid="${!!c.contactErr}"` }), { id: fid(`gs.${ch}.value`), error: c.contactErr })}
       </div>
       <button class="btn btn-primary btn-block" style="margin-top:22px" data-act="provideContact" data-arg="${ch}" ${c.sending ? 'disabled' : ''}>${c.sending ? '<span class="spinner"></span> Sending…' : 'Send code'}</button>`
            : `<h1 class="gs-h1">Verify your ${isEmail ? 'email' : 'phone'}</h1>
       <p class="gs-sub">${isEmail ? 'We sent a 6-digit code to ' : 'We sent a 6-digit code by SMS to '}${masked(c.masked)}.</p>
       <div style="margin-top:24px">${otpBlock(ch)}</div>
       <p class="small muted" style="margin-top:18px">${c.source === 'roster' ? `Not your ${isEmail ? 'email' : 'phone'}? Ask your reporting officer.` : `Typed it wrong? Start again.`}</p>
       <div class="proto-note" style="margin-top:16px"><b>Prototype.</b> Any 6 digits verify. 111111 is wrong (attempts count down), 000000 has expired.</div>`;
        return gsLayout(body, { step: isEmail ? 3 : 4 });
      }
      screens['gs-email'] = () => verifyScreen('email');
      screens['gs-phone'] = () => verifyScreen('phone');
      function verifyCode(ch, code) {
        const c = S.gs[ch];
        c.st = 'verifying';
        Kit.render();
        setTimeout(() => {
          if (code === '111111') {
            c.attemptsLeft--;
            if (c.attemptsLeft <= 0) return sessionEnded('toomany');
            c.st = 'wrong';
            Kit.render();
            document.querySelector('#view .otp input')?.focus();
            announce(`That code is not right. ${plural(c.attemptsLeft, 'attempt')} left.`);
          } else if (code === '000000') {
            c.st = 'expired';
            Kit.render();
            announce('That code has expired. Resend to get a new one.');
          } else {
            c.st = null;
            if (ch === 'email') {
              S.gs.phone.resendAt = Date.now() + 60000;
              Kit.go('gs-phone');
            } else Kit.go('gs-confirm');
          }
        }, 900);
      }
      actions.verify_email = (code) => verifyCode('email', code);
      actions.verify_phone = (code) => verifyCode('phone', code);
      actions.resend = (ch) => {
        const c = S.gs[ch];
        if (c.resendsLeft <= 0) return sessionEnded('toomany');
        c.resendsLeft--;
        c.resendAt = Date.now() + 60000;
        c.st = null;
        c.code.fill('');
        Kit.toast('New code sent');
      };
      function sessionEnded(kind) {
        const slug = S.gs.commission;
        S.gs = freshState().gs;
        S.gs.commission = slug;
        S.gs.notice = kind;
        Kit.go('gs-commission');
      }
      actions.provideContact = (ch) => {
        const c = S.gs[ch];
        const v = c.value.trim();
        if (ch === 'email') {
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) {
            c.contactErr = 'Enter an email address in the format name@example.com.';
            return Kit.render();
          }
          c.masked = v[0] + '***@' + v.split('@')[1];
        } else {
          const d = v.replace(/[\s-]/g, '');
          const m = /^(?:\+?254|0)?([17]\d{8})$/.exec(d);
          if (!m) {
            c.contactErr = 'Enter a Kenyan mobile number, e.g. 0712 345 678.';
            return Kit.render();
          }
          c.e164 = '+254' + m[1];
          c.masked = '0' + m[1][0] + '* *** ' + m[1].slice(-3);
        }
        c.contactErr = '';
        c.sending = true;
        Kit.render();
        setTimeout(() => {
          c.sending = false;
          c.variant = 'otp';
          c.source = 'declarant';
          c.resendAt = Date.now() + 60000;
          Kit.render();
          setTimeout(() => document.querySelector('#view .otp input')?.focus(), 0);
        }, 800);
      };

      /* ---- Step 5: Confirm ---- */
      screens['gs-confirm'] = () => {
        const g = S.gs;
        const c = comm(g.commission) || comm('tsc');
        const busy = g.cfState === 'submitting';
        const alert =
          g.cfState === 'unavailable'
            ? `<div class="alert alert-warn" role="alert" tabindex="-1" id="cf-alert">${icon('clock', 17)}<div>The national register is not responding. Wait a few minutes and try again.<div><button class="btn btn-secondary btn-sm" data-act="confirmAccount">Try again</button></div></div></div>`
            : g.cfState === 'adapter'
              ? `<div class="alert alert-danger" role="alert" tabindex="-1" id="cf-alert">${icon('alert', 17)}<div>Your account could not be created. Try again.</div></div>`
              : '';
        return gsLayout(
          `
    <h1 class="gs-h1">Confirm your details</h1>
    <p class="gs-sub">From your Commission's roster. You cannot change them here.</p>
    <div class="card" style="margin-top:18px">
      <dl class="dl" style="padding:4px 18px">
        <div><dt>Full name</dt><dd>${ME.full}</dd></div>
        <div><dt>Personnel file number</dt><dd class="mono">${ME.fileNo}</dd></div>
        <div><dt>Designation</dt><dd>${ME.designation}</dd></div>
        <div><dt>Reporting entity</dt><dd>${ME.entity}</dd></div>
        <div><dt>Responsible Commission</dt><dd>${esc(c.name)}</dd></div>
        <div><dt>Email</dt><dd>${masked(g.email.masked, true)}</dd></div>
        <div><dt>Phone</dt><dd>${masked(g.phone.masked, true)}</dd></div>
      </dl>
    </div>
    ${alert ? `<div style="margin-top:16px">${alert}</div>` : ''}
    <div style="margin-top:18px">${checkbox('gs.confirmed', 'I confirm these are my details.', { disabled: busy })}</div>
    <button class="btn btn-primary btn-block" style="margin-top:18px" data-act="confirmAccount" ${g.confirmed && !busy ? '' : 'disabled'}>${busy ? '<span class="spinner"></span> Checking the national register…' : 'Confirm and create my account'}</button>
    <p class="small muted" style="margin-top:10px;text-align:center">Checked against the national register.</p>
    <div class="proto-note" style="margin-top:16px"><b>Prototype.</b> Outcome on confirm: ${[
      ['account-created', 'account created'],
      ['linked-existing-account', 'linked to existing account'],
      ['identity-mismatch', 'identity mismatch'],
      ['iprs-unavailable', 'register down (503)'],
      ['identity-unavailable', 'account error (502)'],
    ]
      .map(
        ([k, l]) =>
          `<a data-act="setOutcome" data-arg="${k}" style="${g.outcome === k ? 'text-decoration:underline' : 'text-decoration:none;opacity:.75'}">${l}</a>`,
      )
      .join(' · ')}</div>`,
          { step: 5 },
        );
      };
      actions.setOutcome = (k) => {
        S.gs.outcome = k;
        S.gs.cfState = null;
        Kit.render();
      };
      actions.confirmAccount = () => {
        const g = S.gs;
        g.cfState = 'submitting';
        Kit.render();
        setTimeout(() => {
          const o = g.outcome || 'account-created';
          if (o === 'iprs-unavailable') {
            g.cfState = 'unavailable';
            g.outcome = 'account-created';
          } else if (o === 'identity-unavailable') {
            g.cfState = 'adapter';
            g.outcome = 'account-created';
          } else {
            g.cfState = null;
            g.pwResendAt = Date.now() + 60000;
            return Kit.go(
              o === 'account-created'
                ? 'gs-check-email'
                : o === 'linked-existing-account'
                  ? 'gs-done'
                  : 'gs-not-verified',
            );
          }
          Kit.render();
          document.getElementById('cf-alert')?.focus();
        }, 1300);
      };

      /* ---- Step 6: Check your email / Done / Not verified ---- */
      screens['gs-check-email'] = () => {
        const g = S.gs;
        const cool = left(g.pwResendAt);
        return gsLayout(
          `
    <div class="success-mark" style="background:var(--brand-soft);color:var(--brand-ink)">${icon('mail', 30, 2)}</div>
    <h1 class="gs-h1">Check your email</h1>
    <p class="gs-sub">Your account is ready. Set your password with the link sent to ${masked(g.email.masked)}. It expires in 24 hours.</p>
    <div class="ofr-card" style="margin-top:22px"><div style="flex:1;min-width:0"><div class="small muted" style="font-weight:500">Officer reference</div><div class="v">${ME.ofr}</div></div>${copyBtn(ME.ofr, 'Officer reference', 'btn-sm')}</div>
    <p class="small muted" style="margin-top:8px">Quote it when you contact the helpdesk.</p>
    <div class="stack" style="margin-top:22px;gap:10px">
      <button class="btn btn-secondary btn-block" data-act="resendPw" ${cool ? 'disabled' : ''}>${cool ? `<span>Resend email in ${cd(g.pwResendAt, 's')}</span>` : `${icon('send', 16)} Resend email`}</button>
      ${cool ? `<span class="sr-only" aria-live="polite" data-cd-sr="${g.pwResendAt}"></span>` : ''}
      <a class="btn btn-ghost btn-block" href="${KC}">Sign in</a>
    </div>
    <div class="proto-note" style="margin-top:16px"><b>Prototype.</b> <a href="${KC}#update-password">Open the set-password link from the email</a> (Keycloak page, other prototype). After saving a password you land on the <a data-act="go" data-arg="home">dashboard</a>.</div>`,
          { step: 6 },
        );
      };
      actions.resendPw = () => {
        S.gs.pwResendAt = Date.now() + 60000;
        Kit.toast('Email sent again');
      };
      screens['gs-done'] = () => {
        const c = comm(S.gs.commission) || comm('tsc');
        return gsLayout(
          `
    <div class="success-mark">${icon('check', 30, 2.4)}</div>
    <h1 class="gs-h1">${esc(c.name)} added to your account</h1>
    <p class="gs-sub">Sign in to <span class="mono">${ME.ofr}</span> with your usual password.</p>
    <a class="btn btn-primary btn-block" style="margin-top:24px" href="${KC}">Sign in</a>`,
          { step: 6 },
        );
      };
      screens['gs-not-verified'] = () => {
        const c = comm(S.gs.commission) || comm('tsc');
        return gsLayout(
          `
    <div class="alert alert-danger" role="alert" style="padding:18px">${icon('alert', 19)}<div><h1 style="font-size:18px;font-weight:600;line-height:1.3">We could not verify your identity</h1><p style="margin-top:6px">The name or ID number on ${esc(c.name)}'s roster does not match the national register. Your reporting officer has been notified on the roster. Contact them to have your record corrected, then start again.</p></div></div>
    <button class="btn btn-primary btn-block" style="margin-top:22px" data-act="startOnboarding">Back to start</button>`,
          {},
        );
      };

      /* ---- Reference: copy tables (problem codes, outcomes) ---- */
      screens['gs-copy'] = () => {
        const row = (code, http, where, copy, gap = '') =>
          `<tr><td>${code ? `<code>${code}</code>` : '<span class="muted">none</span>'}</td><td class="nowrap">${http}</td><td>${where}</td><td>${copy}${gap ? `<div class="small" style="color:var(--warn);margin-top:4px">${icon('alert', 12)} ${gap}</div>` : ''}</td></tr>`;
        const t = (head, rows) =>
          `<div class="table-wrap"><table class="ctable"><thead><tr>${head.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
        return `<div class="docpage">
    <button class="btn btn-ghost btn-sm" style="margin-left:-10px" data-act="go" data-arg="gs-commission">${icon('left', 16)} Get started</button>
    <h1 style="margin-top:10px">Copy tables</h1>
    <p class="lead">One table per contract enumeration, so the backend never sends user-facing text (spec 03 i18n, spec 04 i18n, spec 06). English keys with empty Swahili slots. Items marked in amber are gaps in the contract or the spec copy.</p>
    <h2>Onboarding problem codes ${Kit.badge('#66 #69 #72')}</h2>
    <p class="sp"><span class="mono">OnboardingProblem.code</span> in <span class="mono">directory.yaml</span>, every value, plus the two uncoded failures.</p>
    ${t(
      ['Code', 'HTTP', 'Step', 'Copy and behaviour'],
      [
        row(
          'no-match',
          '404',
          'Identify',
          'Alert (destructive): "We could not match these details to {Commission}\'s roster. Check both numbers and try again. If they are correct, contact your Commission\'s reporting officer to have your record added or corrected." Fields stay filled.',
        ),
        row(
          'already-onboarded',
          '409',
          'Identify',
          'Alert (info): "You already have an Adili account." Buttons "Sign in", "Recover access" (from <span class="mono">links</span>).',
        ),
        row(
          'no-roster',
          '409',
          'Identify (and Commission list)',
          'Alert (warning): "{Name} has not yet imported its roster. You cannot onboard until it does. Ask your Commission\'s reporting officer when it will be ready." Continue disabled.',
        ),
        row(
          'rate-limited',
          '429',
          'Identify',
          'Alert (warning): "Too many attempts. Try again in {minutes} minutes." Continue disabled with a countdown from <span class="mono">RateLimit-Reset</span>.',
          'Spec 03 BE-4 code registry omits rate-limited; the contract has it.',
        ),
        row(
          'otp-invalid',
          '400',
          'Verify email / phone',
          'Boxes cleared, error "That code is not right. {n} attempts left." (from <span class="mono">attemptsLeft</span>).',
        ),
        row(
          'otp-expired',
          '400',
          'Verify email / phone',
          'Error "That code has expired. Resend to get a new one."',
        ),
        row(
          'resend-cooldown',
          '429',
          'Verify, Check your email',
          'No alert: link or button disabled with "Resend in {s}s" from <span class="mono">retryAfterSeconds</span>.',
        ),
        row(
          'session-expired',
          '410',
          'Any session step',
          'Redirect to Get started with notice "Your session ended. Start again." When attempts or resends ran out: "Too many attempts. Start again."',
          'The 410 body cannot tell the two apart; add a reason (expired | attempts-exhausted | resends-exhausted).',
        ),
        row(
          'iprs-unavailable',
          '503',
          'Confirm',
          'Alert: "The national register is not responding. Wait a few minutes and try again." Button "Try again". Session kept.',
        ),
        row(
          'identity-unavailable',
          '502',
          'Confirm',
          'Alert: "Your account could not be created. Try again."',
        ),
        row(
          '',
          '400',
          'Identify, enter contact',
          'Field errors: "Enter your personnel file number as it appears on your payslip." / "Enter your national ID number (5 to 10 digits)." / email and phone format.',
          'Spec gives no copy for an invalid email or phone on the enter-contact variants; prototype uses "Enter an email address in the format name@example.com." and "Enter a Kenyan mobile number, e.g. 0712 345 678."',
        ),
        row(
          '',
          '502',
          'Verify (send failed)',
          'Prototype copy: "We could not send the code. Try again in a minute."',
          'Backend returns 502 when notifications fails to send, but the contract has no code for it.',
        ),
        row('', '5xx', 'Any', '"Something went wrong. Try again."'),
      ],
    )}
    <h2>Obligation status and dates ${Kit.badge('#89')}</h2>
    ${t(
      ['Value', 'Badge', 'Relative text'],
      [
        `<tr><td><code>upcoming</code></td><td>${statusBadge('upcoming')}</td><td>"Opens 1 November 2027"</td></tr>`,
        `<tr><td><code>due</code></td><td>${statusBadge('due')}</td><td>"Due in 12 days", "Due today"</td></tr>`,
        `<tr><td><code>overdue</code></td><td>${statusBadge('overdue')}</td><td>"3 days overdue" plus "If you have already declared by other means, contact your Commission."</td></tr>`,
        `<tr><td><code>filed</code></td><td>${statusBadge('filed')}</td><td>Reference number and slip</td></tr>`,
        `<tr><td><code>cancelled</code></td><td class="muted">not shown</td><td class="muted">not shown</td></tr>`,

    )}
    <h2>Reminder outcomes ${Kit.badge('#93')}</h2>
    <p class="sp"><span class="mono">ReminderOutcome</span> in <span class="mono">declarations.yaml</span>, every value.</p>
    ${t(
      ['Outcome', 'Copy in the drawer', 'Note'],
      [
        `<tr><td><code>sent</code></td><td>${OUTCOME_COPY.sent(['sms', 'email'])} / ${OUTCOME_COPY.sent(['sms'])} / ${OUTCOME_COPY.sent(['email'])}</td><td>from <span class="mono">channels</span></td></tr>`,
        `<tr><td><code>skipped-not-onboarded</code></td><td>${OUTCOME_COPY['skipped-not-onboarded']()}</td><td></td></tr>`,
        `<tr><td><code>skipped-no-contact</code></td><td>${OUTCOME_COPY['skipped-no-contact']()}</td><td></td></tr>`,
        `<tr><td><code>skipped-past-due-at-creation</code></td><td>${OUTCOME_COPY['skipped-past-due-at-creation']()}</td><td class="small" style="color:var(--warn)">${icon('alert', 12)} Not in the spec 04 copy table; prototype wording.</td></tr>`,
        `<tr><td><code>failed</code></td><td>${OUTCOME_COPY.failed()}</td><td></td></tr>`,
      ],
    )}
    <h2>Submit problem codes ${Kit.badge('#139')}</h2>
    ${t(
      ['Code', 'HTTP', 'Copy and behaviour'],
      [
        `<tr><td><code>step-up-required</code></td><td>403</td><td>Alert "We could not confirm your identity. Try again." + "Confirm identity" (restarts step-up)</td></tr>`,
        `<tr><td><code>incomplete</code></td><td>400</td><td>Close the dialog, show the blocking panel on the summary</td></tr>`,
        `<tr><td><code>before-statement-date</code></td><td>409</td><td>"You can submit from {statement date}."</td></tr>`,
        `<tr><td><code>amendment-window-closed</code></td><td>409</td><td>"Amendments closed on {due date}. Contact your Commission."</td></tr>`,
        `<tr><td><code>not-a-draft</code></td><td>409</td><td>Reload: "This declaration changed in another window. Reload to see its current state." + Reload</td></tr>`,
        `<tr><td><code>not-submitted</code></td><td>409 (amend)</td><td>"Only a submitted declaration can be amended." + Reload <div class="small" style="color:var(--warn);margin-top:4px">${icon('alert', 12)} No spec copy; prototype wording.</div></td></tr>`,
        `<tr><td><code>obligation-cancelled</code></td><td>409</td><td>"This declaration is no longer required, so it cannot be submitted. Contact your Commission if you think this is wrong." <div class="small" style="color:var(--warn);margin-top:4px">${icon('alert', 12)} In the contract, missing from the spec 06 copy table; prototype wording.</div></td></tr>`,
        `<tr><td><span class="muted">none</span></td><td>5xx</td><td>"Your declaration was not submitted. Try again." (same Idempotency-Key kept)</td></tr>`,
      ],
