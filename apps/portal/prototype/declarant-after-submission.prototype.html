          JA('awaiting', 'access-request', { id: 'a1' }),
        ],
        [
          'acc-object',
          '#255 Respond: objection with attachment',
          JA('awaiting', 'access-request', { id: 'a1' }, () => fillRep('object')),
        ],
        [
          'acc-validation',
          '#255 Respond: validation errors',
          JA('awaiting', 'access-request', { id: 'a1' }, () =>
            fillRep('object', { text: '', files: [], tried: true }),
          ),
        ],
        [
          'acc-files',
          '#255 Respond: files checking and rejected',
          JA('awaiting', 'access-request', { id: 'a1' }, () => {
            fillRep('object');
            S.aform.a1.files.push(
              { id: 'fa1', name: 'Title deed Kapsaret.pdf', size: 910000, status: 'scanning' },
              {
                id: 'fa2',
                name: 'Court order scan.tiff',
                size: 1600000,
                status: 'rejected',
                reason: 'Use a PDF, JPEG, PNG or HEIC file.',
              },
            );
            setTimeout(() => {
              const f = S.aform.a1?.files.find((x) => x.id === 'fa1');
              if (f) {
                f.status = 'clean';
                Kit.render();
              }
            }, 4000);
          }),
        ],
        [
          'acc-consent',
          '#255 Respond: consent confirm',
          JA('awaiting', 'access-request', { id: 'a1' }, () => {
            fillRep('consent');
            S.modal = { kind: 'confirmConsent', id: 'a1' };
          }),
        ],
        [
          'acc-neterr',
          '#255 Respond: network error on save',
          JA('awaiting', 'access-request', { id: 'a1' }, () => {
            fillRep('object');
            S.submitErr = 'a1';
          }),
        ],
        [
          'acc-saved',
          '#255 Response saved, editable until 29 Sep',
          JA('saved', 'access-request', { id: 'a1' }),
        ],
        [
          'acc-editing',
          '#255 Editing a saved response',
          JA('saved', 'access-request', { id: 'a1' }, () => {
            const x = S.access[0].reps;
            S.aform.a1 = { ...x, files: x.files.map((y) => ({ ...y })), tried: false };
            S.aEdit = 'a1';
          }),
        ],
        [
          'acc-409',
          '#255 Window closed while saving (409): form disabled',
          JA('closing', 'access-request', { id: 'a1' }, () => {
            fillRep('object');
            S.accConflict = 'a1';
          }),
        ],
        [
          'acc-closed-none',
          '#255 Window closed, no response: under decision',
          JA('closed-none', 'access-request', { id: 'a1' }),
        ],
        [
          'acc-closed-reps',
          '#255 Window closed with response: under decision',
          JA('closed-reps', 'access-request', { id: 'a1' }),
        ],
        [
          'acc-consented',
          '#255 Consented: under decision',
          JA('consented', 'access-request', { id: 'a1' }),
        ],
        [
          'acc-partial',
          '#255 Outcome: partially granted',
          JA('awaiting', 'access-request', { id: 'a3' }),
        ],
        ['acc-granted', '#255 Outcome: granted', JA('history', 'access-request', { id: 'a6' })],
        ['acc-denied', '#255 Outcome: denied', JA('awaiting', 'access-request', { id: 'a4' })],
        [
          'acc-withdrawn',
          '#255 Withdrawn by the applicant',
          JA('awaiting', 'access-request', { id: 'a5' }),
        ],
        [
          'acc-lea',
          '#255 Law-enforcement agency granted access',
          JA('awaiting', 'access-request', { id: 'a2' }),
        ],
        [
          'acc-404',
          '#255 Access request: not found (404)',
          JA('awaiting', 'access-request', { id: 'zz' }, () => (S.notFound = true)),
        ],
      ];

      Kit.mount({
        app: 'portal',
        start: 'clarifications',
        home: 'clarifications',
        screens,
        modals,
        actions,
        jumps,
        onBind: (bind, v) => {
          const el = document.querySelector(`[data-count="${bind}"]`);
          if (el) {
            const max = bind.startsWith('aform') ? REP_MAX : bind.startsWith('nform') ? 4000 : 2000;
            el.textContent = `${num(v.length)} / ${num(max)}`;
            el.classList.toggle('over', v.length > max);
            const ta = el.closest('.field')?.querySelector('textarea');
            const fe = el.closest('.field')?.querySelector('.ferr');
            if (ta && v.trim() && v.length <= max) {
              ta.classList.remove('err');
              ta.removeAttribute('aria-invalid');
              if (fe) fe.remove();
            }
          }
          const m = bind.match(/^form\.(\w+)\.items/);
          if (m) {
            const f = S.form[m[1]];
            const a = document.querySelector(`[data-answered="${m[1]}"]`);
            if (a)
              a.innerHTML = `<b>${f.items.filter((x) => x.text.trim()).length} of ${f.items.length}</b> ${f.items.length === 1 ? 'point' : 'points'} answered`;
          }
        },
        coverage: [
          {
            ticket: 170,
            title:
              'Portal clarification read view (card, page, letter, reference, deadline countdown, attachments)',
            screens: [
              'clarifications',
              'clar-none',
              'clar-page2',

              'clarification',

            note: 'Console composer and list are in apps/console/prototype/07a-review.prototype.html.',
          },
          {
            ticket: 173,
            title:
              'Portal response form (per-item text and attachments, submit once, late notice, overdue copy, reminder, further clarification, resolved, withdrawn)',
            screens: [
              'clarification',
              'clar-validation',
              'clar-files',
              'clar-confirm',
              'clar-late-confirm',
              'clar-neterr',
              'clar-conflict',
              'clar-reminder',
              'clar-overdue',

              'clar-late',
              'clar-followup',
              'clar-followup-new',
              'clar-resolved',
              'clar-withdrawn',
              'clar-escalated',
            ],
            note: 'Name a file with "virus" to see the failed security check. Console detail actions are in 07a.',
          },
          {
            ticket: 199,
            title: 'Portal Decisions (on Home card and declaration detail; on-demand letter)',
            screens: [
              'declaration',
              'dec-compliant',
              'dec-no-issues',
              'dec-preparing',
              'dec-letter-error',
              'dec-noncompliant',
              'dec-further',
              'dec-letter',
              'dash-decided',
            ],
            note: 'No separate nav item: decisions live on the declaration detail and the Home card, per spec 08 FE-7.',
          },
          {
            ticket: 205,
            title: 'Portal Notices and respond (notice to comply, warning, response, compliance)',
            screens: [
              'notices',
              'notices-loading',
              'notices-error',
              'notice-list',

              'notice',

              'notice-responded',

              'notice-warning-list',

              'clar-escalated',
            ],
            note: 'Referrals to EACC are never shown to the declarant (Regs r.20(2)).',
          },
          {
            ticket: 208,
            title:
              'Portal stoppage notices (salary stoppage scheduled and effective, disciplinary referral, reinstatement)',
            screens: [
              'stop-scheduled',
              'stop-effective',
              'stop-list',
              'disciplinary',
              'reinstating',
              'reinstated',
              'stop-letter',
              'dash-mixed',
            ],
            note: 'Try it: on "Salary stopped", respond to the clarification. The ladder completes and reinstatement is sent, then confirmed by payroll after a few seconds.',
          },
          {
            ticket: 255,
            title: 'Portal: Access requests card and representations form',
            screens: [
              'dash-access',
              'dash-access-saved',
              'acc-list',
              'acc-list-p2',

          },
          {

            title: 'UI primitives round 12: RegisterTimeline (compact, declarant view)',
            screens: ['acc-partial', 'acc-lea', 'acc-saved'],
            note: 'History card on each request. Every kind in list and compact density: declarant-profile.prototype.html#register-kinds.',

    </script>
