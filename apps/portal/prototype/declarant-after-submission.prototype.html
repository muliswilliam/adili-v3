          );
        if (isOpen(c) && !overdueNow && c.reminderSentAt)
          tags.push(
            `<span class="badge">${icon('bell', 13)} Reminder sent ${shortDate(c.reminderSentAt)}</span>`,
          );
        if (c.late && c.respondedAt)
          tags.push(
            `<span class="badge badge-warn">${icon('clock', 13)} Responded ${plural(lateDays(c), 'day')} late</span>`,
          );
        if (c.followUpOf)
          tags.push(`<span class="badge">${icon('link', 13)} Further clarification</span>`);
        if (c.followUpRef)
          tags.push(
            `<span class="badge badge-brand">${icon('msg', 13)} Further clarification sent</span>`,
          );
        if (c.noticeRef && isOpen(c))
          tags.push(`<span class="badge badge-danger">${icon('bell', 13)} Notice issued</span>`);
        return `<a class="cardlink" href="#clarification" data-act="go" data-arg="clarification|${c.id}"><div class="lc"><span class="ico" style="background:${tone[0]};color:${tone[1]}">${icon(st.icon, 18)}</span><div class="body">
          <div class="t">${c.items.length === 1 ? '1 point' : c.items.length + ' points'} on your ${DECL.type.toLowerCase()}</div>
          <div class="d"><span class="mono">${c.ref}</span> · ${COMM.name}</div>
          <div class="d">Issued ${fmtDate(c.issuedAt)} · ${c.status === 'withdrawn' ? `withdrawn ${fmtDate(c.withdrawnAt)}` : c.status === 'resolved' ? `resolved ${fmtDate(c.resolvedAt)}` : c.respondedAt ? `responded ${fmtDate(c.respondedAt)}` : `due ${fmtDate(c.dueAt)}`}</div>
          <div class="tags">${tags.join('')}</div></div><span class="chev">${icon('right', 20)}</span></div></a>`;
      }

      screens.clarification = () => {
        const c = findClar(S.params.id) || S.clars[0];
        if (S.notFound || !c)
          return shell(
            `<div class="page" style="max-width:720px"><button class="back" data-act="go" data-arg="clarifications">${icon('left', 16)} Clarifications</button><div class="card"><div class="empty" style="padding:56px 20px"><div class="art" style="grid-template-columns:30px"><span style="background:var(--sunken);color:var(--muted)">${icon('search', 16)}</span></div><h4>Clarification not found</h4><p>The link may be wrong, or it belongs to someone else.</p><div style="margin-top:14px"><button class="btn btn-secondary" data-act="go" data-arg="clarifications">All clarifications</button></div></div></div></div>`,
            'Clarifications',
          );
        const st = clarStatus(c);
        const f = formFor(c);
        const canRespond = isOpen(c);
        const banners = [];
        if (c.status === 'overdue' && !c.noticeRef)
          banners.push(
            `<div class="banner banner-danger">${icon('alert', 18)}<div><b>The deadline has passed.</b> You can still respond; your response will be recorded as late.</div></div>`,
          );
        if (c.noticeRef && isOpen(c)) {
          const n = S.notices.find((x) => x.ref === c.noticeRef);
          banners.push(
            `<div class="banner banner-danger">${icon('bell', 18)}<div><b>The deadline has passed. ${COMM.code} has issued a ${n ? STEP[n.step].title.toLowerCase() : 'notice'}.</b> Responding now ends it${n && n.salaryStoppedAt ? ' and reinstates your salary' : ''}; your response will be recorded as late.<div><button class="btn btn-secondary btn-sm" data-act="go" data-arg="notice|${n ? n.id : ''}">View ${n ? STEP[n.step].short.toLowerCase() : 'notice'} ${icon('right', 15)}</button></div></div></div>`,
          );
        }
        if (c.status === 'issued' && c.reminderSentAt)
          banners.push(
            `<div class="banner banner-warn">${icon('bell', 18)}<div><b>Reminder: ${countdown(c).text.toLowerCase()}.</b> Due ${fmtDate(c.dueAt)}.</div></div>`,
          );
        if (c.status === 'responded' && !c.followUpRef)
          banners.push(
            `<div class="banner banner-info">${icon('send', 18)}<div><b>Response submitted ${fmtDateTime(c.respondedAt)}.</b> ${c.late ? `Responded ${plural(lateDays(c), 'day')} late. ` : ''}We will SMS and email you when ${COMM.code} has reviewed it.</div></div>`,
          );
        if (c.followUpRef) {
          const fu = S.clars.find((x) => x.ref === c.followUpRef);
          banners.push(
            `<div class="banner banner-warn">${icon('msg', 18)}<div><b>${COMM.code} sent a further clarification.</b> It has its own 30 days.<div><button class="btn btn-secondary btn-sm" data-act="go" data-arg="clarification|${fu ? fu.id : ''}">Open ${c.followUpRef} ${icon('right', 15)}</button></div></div></div>`,
          );
        }
        if (c.followUpOf)
          banners.push(
            `<div class="banner banner-neutral">${icon('link', 18)}<div>Follows up on your response to <b class="mono">${c.followUpOf}</b>. ${S.clars.some((x) => x.ref === c.followUpOf) ? `<button class="link" data-act="go" data-arg="clarification|${S.clars.find((x) => x.ref === c.followUpOf).id}">See what you said before</button>` : ''}</div></div>`,
          );
        if (c.status === 'resolved')
          banners.push(
            `<div class="banner banner-ok">${icon('check', 18)}<div><b>Resolved on ${fmtDate(c.resolvedAt)}.</b> ${COMM.code} accepted your response.</div></div>`,
          );
        if (c.status === 'withdrawn')
          banners.push(
            `<div class="banner banner-neutral">${icon('ban', 18)}<div><b>Withdrawn on ${fmtDate(c.withdrawnAt)}: issued in error.</b> You do not need to respond.</div></div>`,
          );
        if (S.conflict === c.id)
          banners.push(
            `<div class="banner banner-warn">${icon('info', 18)}<div><b>A response was already submitted</b>, possibly from another device. You can respond only once. <button class="link" data-act="reloadResponded">Show it</button></div></div>`,
          );

        const items = c.items
          .map((it, i) => {
            const r = REQ[it.requirement];
            const ans = c.response?.items[i];
            const fi = f?.items[i];
            const err = f?.tried && fi && !fi.text.trim();
            const over = fi && fi.text.length > 2000;
            const bind = `form.${c.id}.items.${i}`;
            return `<div class="qa" id="point-${i + 1}">
            <div class="qa-top"><span class="qa-n ${ans || (fi && fi.text.trim()) ? 'done' : !canRespond ? 'muted' : ''}">${ans ? icon('check', 13, 2.6) : i + 1}</span><span class="small muted" style="font-weight:500">Point ${i + 1} of ${c.items.length}</span></div>
            <div class="qa-ask">${r.ask}</div>
            <div class="qa-target">${esc(it.label)}</div>
            <div class="qa-text"><span class="who">${COMM.code}</span>${esc(it.text)}</div>
            ${it.requirement === 'correct' && canRespond ? `<button class="qa-link" data-act="toast" data-arg="Opens the amendment flow in declarant-journey (spec 06)">${icon('pencil', 14)} Amend declaration</button>` : ''}
            ${ans ? `<div class="qa-answer"><div class="label" style="margin-bottom:6px"><span>Your response</span></div><div class="ans">${esc(ans.text)}</div>${ans.files.length ? `<div class="docs" style="margin-top:10px">${ans.files.map((x) => docRow(x)).join('')}</div>` : ''}</div>` : ''}
            ${
              canRespond && fi
                ? `<div class="qa-answer stack" style="gap:10px">
              <div class="field"><div class="label"><label for="f-${bind.replace(/\./g, '-')}-text">Your response<span class="sr-only"> to point ${i + 1}</span></label><span class="counter ${over ? 'over' : ''}" data-count="${bind}.text">${num(fi.text.length)} / 2,000</span></div>
              <textarea id="f-${bind.replace(/\./g, '-')}-text" class="textarea ${err || over ? 'err' : ''}" rows="4" data-bind="${bind}.text" placeholder="${esc(r.ph)}" ${err ? 'aria-invalid="true"' : ''} aria-describedby="h-${c.id}-${i}">${esc(fi.text)}</textarea>
              ${err ? `<div class="ferr" id="h-${c.id}-${i}">${icon('alert', 14)} Write your response to this point.</div>` : over ? `<div class="ferr" id="h-${c.id}-${i}">${icon('alert', 14)} Keep your response to 2,000 characters or fewer.</div>` : `<span id="h-${c.id}-${i}" hidden></span>`}</div>
              ${fi.files.length ? `<div class="docs">${fi.files.map((x, k) => docRow(x, { removable: true, bind, i: k })).join('')}</div>` : ''}
              <label class="attach"><input type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.heic,application/pdf,image/*" data-act-change="attach" data-arg="${bind}" aria-label="Attach documents for point ${i + 1}"/>${icon('clip', 16)} ${fi.files.length ? 'Attach another document' : 'Attach a document'} <span class="muted" style="font-weight:400">(optional)</span></label>
            </div>`
                : ''
            }
          </div>`;
          })
          .join('');

        const answered = f ? f.items.filter((x) => x.text.trim()).length : 0;
        const scanning = f
          ? f.items.some((x) => x.files.some((y) => y.status === 'scanning'))
          : false;
        const submit =
          canRespond && f
            ? `<div class="submitbar"><div class="answered" aria-live="polite" data-answered="${c.id}"><b>${answered} of ${c.items.length}</b> ${c.items.length === 1 ? 'point' : 'points'} answered</div><span class="spacer"></span>${S.submitErr === c.id ? `<div class="ferr" style="flex-basis:100%;order:3">${icon('wifiOff', 14)} We could not send your response. Check your connection and try again. Your answers are still here.</div>` : ''}<button class="btn btn-primary" data-act="submitClar" data-arg="${c.id}" ${scanning ? 'disabled' : ''}>${scanning ? '<span class="spinner"></span> Checking files…' : `${icon('send', 16)} Submit response`}</button></div>`
            : '';

        return shell(
          `<div class="page">
          <button class="back" data-act="go" data-arg="clarifications">${icon('left', 16)} Clarifications</button>
          <div class="head-row"><h1 class="page-title">${c.followUpOf ? 'Further clarification' : 'Clarification'} on your ${DECL.type.toLowerCase()}</h1></div>
          <div class="meta-line"><span>${refChip(c.ref)}</span><span>${badge(st)}</span><span>${icon('file', 15)} <a class="link mono" style="font-weight:400;color:inherit" data-act="go" data-arg="declaration">${DECL.ref}</a></span></div>
          <div class="side-grid">
            <div class="stack" style="min-width:0">
              ${banners.join('')}
              ${canRespond && !c.noticeRef && c.status !== 'overdue' && !c.reminderSentAt ? `<div class="callout callout-info">${icon('info', 16)}<span>Answer every point. You can respond <b>once</b>.</span></div>` : ''}
              <div class="card">
                <div class="card-head"><h3>${canRespond ? `What ${COMM.code} asks` : c.response ? 'Questions and your response' : 'What was asked'}</h3></div>
                ${items}
                ${submit}
              </div>
            </div>
            <div class="side">
              <div class="card card-pad">${timer(c, { compact: c.status === 'withdrawn' })}</div>
              ${letterCard('Letter', c.ref, c.verification, `letter|clr:${c.id}`, c.status === 'withdrawn', 'clarification-letter')}
              <div class="card card-pad"><div class="section-title">History</div><ul class="timeline" style="margin-top:14px">${clarHistory(c)}</ul></div>
              ${helpCard()}
            </div>
          </div>
        </div>`,
          'Clarifications',
        );
      };
      function letterCard(title, ref, ver, arg, revoked, docId, extra = '') {
        return `<div class="card"><div class="card-head"><h3>${title}</h3></div>
          <div class="sec-b" style="display:flex;gap:14px;align-items:center"><span class="qr-thumb">${qr(ref.length * 7, 54)}</span><div style="min-width:0"><div class="small muted">Verification code</div><div class="mono small" style="font-weight:600;word-break:break-all">${ver}</div>${revoked ? `<span class="badge badge-danger" style="margin-top:6px">${icon('ban', 12)} Revoked</span>` : `<span class="badge badge-ok" style="margin-top:6px">${icon('shield', 12)} Digitally signed</span>`}</div></div>
          <div class="card-foot"><button class="btn btn-secondary btn-sm" data-act="modal" data-arg="${arg}">${icon('eye', 16)} View letter</button>${docLink(docId, 'Download PDF')}${extra}</div></div>`;
      }
      function clarHistory(c) {
        const e = [];
        e.push(['send', `Issued by ${COMM.code}`, fmtDateTime(c.issuedAt)]);
        if (c.reminderSentAt) e.push(['bell', 'Reminder sent', fmtDate(c.reminderSentAt)]);
        if (c.status === 'overdue' || (c.late && c.respondedAt))
          e.push(['alert', 'Due date passed', fmtDate(c.dueAt)]);
        if (c.noticeRef) {
          const n = S.notices.find((x) => x.ref === c.noticeRef);
          if (n)
            e.push([
              STEP[n.step].icon,
              `${STEP[n.step].title} issued`,
              `${fmtDate(n.issuedAt)} · <span class="nowrap">${n.ref}</span>`,
            ]);
        }
        if (c.respondedAt)
          e.push([
            'check',
            c.late ? `You responded (${plural(lateDays(c), 'day')} late)` : 'You responded',
            fmtDateTime(c.respondedAt),
          ]);
        if (c.followUpRef)
          e.push([
            'msg',
            'Further clarification sent',
            `<span class="nowrap">${c.followUpRef}</span>`,
          ]);
        if (c.resolvedAt) e.push(['shield', 'Resolved', fmtDate(c.resolvedAt)]);
        if (c.withdrawnAt) e.push(['ban', 'Withdrawn: issued in error', fmtDate(c.withdrawnAt)]);
        if (isOpen(c)) e.push(['clock', `Response due`, fmtDate(c.dueAt)]);
        return e
          .map(
            ([ic, t, s]) =>
              `<li><span class="tl-ico">${icon(ic, 14)}</span><div><div class="tl-t">${t}</div><div class="tl-s">${s}</div></div></li>`,
          )
          .join('');
      }
      function formFor(c) {
        if (!isOpen(c)) return null;
        if (!S.form[c.id])
          S.form[c.id] = { tried: false, items: c.items.map(() => ({ text: '', files: [] })) };
        return S.form[c.id];
      }

      /* ---------- screen: declaration detail (Decisions live here and on Home) ---------- */
      screens.declaration = () => {
        const dec = S.decisions[0];
        const clars = S.clars;
        const anyOpen = clars.some(isOpen);
        const steps = [
          ['check', 'Received', fmtDateTime(DECL.receivedAt), 'done'],
          [
            'search',
            'Review by ' + COMM.code,
            dec ? 'Done' : clars.length ? 'Started' : 'In progress',
            dec || clars.length ? 'done' : 'cur',
          ],
        ];
        if (clars.length)
          steps.push([
            'msg',
            'Clarification',
            anyOpen
              ? 'Waiting for your response'
              : clars.every((c) => c.status === 'withdrawn')
                ? 'Withdrawn'
                : 'Answered',
            anyOpen ? 'warnc' : 'done',
          ]);
        steps.push([
          'stamp',
          'Decision',
          dec ? fmtDate(dec.decidedAt) : 'Pending',
          dec ? 'done' : '',
        ]);
        return shell(
          `<div class="page">
          <a class="back" href="${JOURNEY}#declarations">${icon('left', 16)} Declarations</a>
          <div class="head-row"><h1 class="page-title">${DECL.type}</h1></div>
          <div class="meta-line"><span>${refChip(DECL.ref)}</span><span>${dec ? outcomeBadge(dec.outcome) : anyOpen ? `<span class="badge badge-brand">${icon('msg', 13)} Clarification open</span>` : `<span class="badge badge-info">${icon('search', 13)} Under review</span>`}</span><span>${icon('calendar', 15)} Statement date ${fmtDate(DECL.statementDate)}</span></div>
          <div class="side-grid">
            <div class="stack-lg" style="min-width:0">
              ${S.loadFor === 'declaration' ? skeletonList(2) : dec ? decisionCard(dec, { full: true }) : `<div class="card card-pad"><div class="outcome"><span class="big-ico" style="background:#dff2fe;color:#0069a8">${icon('search', 22)}</span><div><div class="section-title">No decision yet</div><p class="small muted" style="margin-top:4px;max-width:520px">${anyOpen ? 'Respond to the open clarification first. ' : ''}We will SMS and email you when ${COMM.code} decides.</p></div></div></div>`}
              <div class="card"><div class="card-head"><h3>Clarifications</h3><span class="spacer"></span><button class="btn btn-ghost btn-sm" data-act="go" data-arg="clarifications">All ${icon('right', 15)}</button></div>${clars.length ? clars.slice(0, 3).map(clarCard).join('') : `<div class="sec-b small muted">No clarification requests.</div>`}</div>
              ${S.notices.length ? `<div class="card"><div class="card-head"><h3>Notices</h3><span class="spacer"></span><button class="btn btn-ghost btn-sm" data-act="go" data-arg="notices">All ${icon('right', 15)}</button></div>${byDate(S.notices).slice(0, 3).map(noticeCard).join('')}</div>` : ''}
            </div>
            <div class="side">
              <div class="card card-pad"><div class="section-title">Progress</div><div class="track" style="margin-top:14px">${steps.map(([ic, t, d, cls]) => `<div class="ts ${cls}"><span class="dotc">${icon(cls === 'done' ? 'check' : ic, 14, 2.2)}</span><div><div class="tt">${t}</div><div class="td">${d}</div></div></div>`).join('')}</div></div>
              <div class="card"><div class="card-head"><h3>Documents</h3></div>
                <div class="item"><span class="ico">${icon('file', 16)}</span><div class="item-body"><div class="t">Acknowledgement slip</div><div class="d">${fmtDate(DECL.receivedAt)}</div></div><a class="btn btn-ghost icon-btn" href="${DOCS}#slip" target="_blank" rel="noopener" aria-label="Download slip">${icon('download', 17)}</a></div>
                ${clars.map((c) => `<div class="item"><span class="ico">${icon('msg', 16)}</span><div class="item-body"><div class="t">Clarification letter</div><div class="d mono">${c.ref}</div></div><button class="btn btn-ghost icon-btn" data-act="modal" data-arg="letter|clr:${c.id}" aria-label="View letter ${c.ref}">${icon('eye', 17)}</button><a class="btn btn-ghost icon-btn" href="${DOCS}#clarification-letter" target="_blank" rel="noopener" aria-label="Download letter ${c.ref}">${icon('download', 17)}</a></div>`).join('')}
                <div class="item"><span class="ico">${icon('shield', 16)}</span><div class="item-body"><div class="t">Certified copy</div></div><a class="btn btn-ghost icon-btn" href="${PROFILE}#certified-copies" aria-label="Certified copies">${icon('right', 17)}</a></div>
                ${dec && dec.letter === 'ready' ? `<div class="item"><span class="ico">${icon('stamp', 16)}</span><div class="item-body"><div class="t">Decision letter</div><div class="d mono">${dec.ref}</div></div><button class="btn btn-ghost icon-btn" data-act="modal" data-arg="letter|cmp:${dec.id}" aria-label="View decision letter">${icon('eye', 17)}</button><a class="btn btn-ghost icon-btn" href="${DOCS}#${DEC_DOC(dec.outcome)}" target="_blank" rel="noopener" aria-label="Download decision letter">${icon('download', 17)}</a></div>` : ''}
              </div>
              ${helpCard()}
            </div>
          </div>
        </div>`,
          'Declarations',
        );
      };
      const OUTCOME = {
        compliant: {
          label: 'Compliant',
          kind: 'ok',
          icon: 'shield',
          title: 'Your declaration is compliant',
          text: 'Your declaration meets the requirements. You do not need to do anything.',
        },
        'compliant-no-issues': {
          label: 'Compliant: no issues identified',
          kind: 'ok',
          icon: 'shield',
          title: 'Your declaration is compliant',
          text: 'No issues were found. You do not need to do anything.',
        },
        'non-compliant': {
          label: 'Non-compliant',
          kind: 'danger',
          icon: 'alert',
          title: 'Your declaration is non-compliant',
          text: 'Your Commission may take administrative action. Check Notices.',
        },
        'further-action': {
          label: 'Further action',
          kind: 'warn',
          icon: 'info',
          title: 'Your Commission is taking further action',
          text: 'If you need to act, we will SMS and email you and it will appear under Notices.',
        },
      };
      const outcomeBadge = (o) => badge(OUTCOME[o]);
      function decisionCard(dec, { full = false } = {}) {
        const o = OUTCOME[dec.outcome];
        const tint = {
          ok: ['var(--ok-soft)', 'var(--ok)'],
          danger: ['var(--danger-soft)', 'var(--danger)'],
          warn: ['var(--warn-soft)', 'var(--warn)'],
        }[o.kind];
        const btn =
          dec.letter === 'preparing'
            ? `<button class="btn btn-secondary btn-sm" disabled aria-live="polite"><span class="spinner dark"></span> Preparing…</button>`
            : dec.letter === 'ready'
              ? docLink(
                  DEC_DOC(dec.outcome),
                  'Download decision letter',
                  `btn ${full ? 'btn-primary' : 'btn-secondary'} btn-sm`,
                ) +
                `<button class="btn btn-ghost btn-sm" data-act="decLetter" data-arg="${dec.id}">${icon('eye', 16)} Preview</button>`
              : `<button class="btn ${full ? 'btn-primary' : 'btn-secondary'} btn-sm" data-act="decLetter" data-arg="${dec.id}">${icon('download', 16)} Download decision letter</button>`;
        return `<div class="card"><div class="${full ? 'card-pad' : 'sec-b'}"><div class="outcome"><span class="big-ico" style="background:${tint[0]};color:${tint[1]}">${icon(o.icon, 22)}</span><div style="min-width:0;flex:1">
            <div class="row wrap" style="gap:8px">${full ? '' : outcomeBadge(dec.outcome)}${refChip(dec.ref, 'dec-' + dec.id + (full ? '' : '-s'))}</div>
            <p class="small ${dec.outcome === 'non-compliant' ? '' : 'muted'}" style="margin-top:10px;max-width:560px;${dec.outcome === 'non-compliant' ? 'color:#9f0712;font-weight:500' : ''}">${o.text}</p>
            <div class="small muted" style="margin-top:6px">Decided ${fmtDate(dec.decidedAt)}${full ? '' : ` · ${DECL.type}`}</div>
            ${dec.letter === 'error' ? `<div class="ferr" style="margin-top:10px">${icon('alert', 14)} We could not prepare your letter. Try again in a few minutes.</div>` : ''}
          </div></div></div>
          <div class="card-foot">${btn}${dec.outcome === 'non-compliant' ? `<button class="btn btn-ghost btn-sm" data-act="go" data-arg="notices">${icon('bell', 16)} Notices</button>` : ''}</div></div>`;
      }

      /* ---------- screens: notices ---------- */
      function noticeCard(n) {
        const b = noticeBadge(n),
          s = STEP[n.step];
        const tone = {
          warn: ['var(--warn-soft)', 'var(--warn)'],
          danger: ['var(--danger-soft)', 'var(--danger)'],
          ok: ['var(--ok-soft)', 'var(--ok)'],
          info: ['#dff2fe', '#0069a8'],
        }[b.kind];
        const left = n.actBy ? dd(TODAY, n.actBy) : null;
        const actLine =
          noticeOpen(n) && n.actBy
            ? `<span class="countdown ${left <= 3 ? 'danger' : 'warn'} small">${icon('clock', 14)} Act by ${fmtDate(n.actBy)} · ${left < 0 ? 'passed' : left === 0 ? 'today' : plural(left, 'day') + ' left'}</span>`
            : n.status === 'issued' && laterStep(n)
              ? `<span class="small muted">Followed by a ${STEP[STEPS[STEPS.indexOf(n.step) + 1]].title.toLowerCase()}</span>`
              : '';
        return `<a class="cardlink" href="#notice" data-act="go" data-arg="notice|${n.id}"><div class="lc"><span class="ico" style="background:${tone[0]};color:${tone[1]}">${icon(s.icon, 18)}</span><div class="body">
          <div class="t">${s.title}</div>
          <div class="d"><span class="mono">${n.ref}</span> · Issued ${fmtDate(n.issuedAt)}</div>
          <div class="tags">${badge(b)}${actLine}${n.response && n.status === 'responded' ? '' : n.response ? `<span class="badge">${icon('send', 13)} You responded</span>` : ''}${n.reinstatement && !n.reinstatement.ackAt ? `<span class="badge badge-info">${icon('refresh', 13)} Reinstatement sent</span>` : ''}</div></div><span class="chev">${icon('right', 20)}</span></div></a>`;
      }
      function ladderBar(cur, compact) {
        const list = chain(cur),
          active = cur.step;
        const has = (st) => list.find((n) => n.step === st);
        const allOk = ladderComplied(list);
        return `<div class="ladder" role="list" aria-label="Administrative action steps">${STEPS.map(
          (st) => {
            const n = has(st);
            const cls = allOk && n ? 'ok' : n ? (n.step === active ? 'cur' : 'done') : '';
            const stt = n
              ? allOk
                ? 'Complied'
                : n.step === active
                  ? 'Current'
                  : (compact ? '' : 'Issued ') + shortDate(n.issuedAt)
              : compact
                ? '-'
                : 'Not issued';
            const lab =
              { 'salary-stoppage': 'Stoppage', 'disciplinary-referral': 'Disciplinary' }[st] ||
              STEP[st].short;
            return `<div class="lstep ${cls}" role="listitem" aria-label="${STEP[st].title}: ${stt === '-' ? 'not issued' : stt}"><i></i><span>${lab}</span><span class="st">${stt}</span></div>`;
          },
        ).join('')}</div>`;
      }
      screens.notices = () => {
        const intro = `<h1 class="page-title">Notices</h1>`;
        let body;
        if (S.loadFor === 'notices') body = `<div style="margin-top:24px">${skeletonList(3)}</div>`;
        else if (S.errorFor === 'notices')
          body = `<div style="margin-top:24px">${errorCard('notices', 'retry')}</div>`;
        else if (!S.notices.length)
          body = `<div class="card" style="margin-top:24px"><div class="empty" style="padding:56px 20px"><div class="art" style="grid-template-columns:30px"><span style="background:var(--ok-soft);color:var(--ok)">${icon('shield', 16)}</span></div><h4>No notices</h4><p>Notices are sent only when a declaration or a clarification response is overdue.</p></div></div>`;
        else {
          const all = byDate(S.notices);
          const cur = all[0];
          const list = chain(cur);
          const stopped = list.find((n) => n.step === 'salary-stoppage');
          const wtd = whatToDo(cur);
          const cta = wtd.href
            ? `<a class="btn btn-primary btn-sm" href="${wtd.href}">${wtd.cta} ${icon('right', 15)}</a>`
            : `<button class="btn btn-primary btn-sm" data-act="${wtd.act}" data-arg="${wtd.arg}">${wtd.cta} ${icon('right', 15)}</button>`;
          let top;
          if (ladderComplied(list)) {
            const r = stopped?.reinstatement;
            top = `<div class="banner banner-ok" style="margin-top:20px">${icon('check', 18)}<div><b>You have complied. No further action will be taken.</b>${r ? (r.ackAt ? ` Your salary reinstatement was sent to payroll on ${fmtDate(r.sentAt)} (reference <span class="mono">${r.ref}</span>).` : ` Your salary reinstatement is being sent to payroll (reference <span class="mono">${r.ref}</span>).`) : ''}</div></div>`;
          } else if (stopped && ['disciplinary-referral', 'salary-stoppage'].includes(cur.step)) {
            const eff = stopped.salaryStoppedAt && dOnly(stopped.salaryStoppedAt) <= dOnly(TODAY);
            top = `<div class="banner banner-danger" style="margin-top:20px">${icon('banknote', 18)}<div><b>${eff ? 'Your salary has been stopped pending compliance. It will be reinstated automatically when you comply.' : `Your salary will be stopped from ${fmtDate(stopped.salaryEffective)} unless you comply before then.`}</b> To comply: ${wtd.text.charAt(0).toLowerCase() + wtd.text.slice(1)}<div>${cta}</div></div></div>`;
          } else {
            top = `<div class="banner ${cur.step === 'warning' ? 'banner-danger' : 'banner-warn'}" style="margin-top:20px">${icon(STEP[cur.step].icon, 18)}<div><b>Act by ${fmtDate(cur.actBy)}.</b> ${wtd.text}<div>${cta}</div></div></div>`;
          }
          const page = Math.min(S.noticePage || 1, Math.max(1, Math.ceil(all.length / PAGE)));
          body = `${top}<div class="card" style="margin-top:16px"><div class="sec-b">${ladderBar(cur)}</div></div>
            <div class="card" style="margin-top:16px">${all
              .slice((page - 1) * PAGE, page * PAGE)
              .map(noticeCard)
              .join(
                '',
              )}${all.length > PAGE ? Kit.pager({ page, pageSize: PAGE, total: all.length, act: 'noticePage' }) : ''}</div>`;
        }
        return shell(`<div class="page" style="max-width:880px">${intro}${body}</div>`, 'Notices');
      };

      screens.notice = () => {
        const n = findNotice(S.params.id) || S.notices[0];
        if (!n) return screens.notices();
        const s = STEP[n.step],
          b = noticeBadge(n),
          wtd = whatToDo(n);
        const f = S.nform[n.id] || (S.nform[n.id] = { text: '', files: [], tried: false });
        const canRespond = noticeOpen(n) && !n.response;
        const left = n.actBy ? dd(TODAY, n.actBy) : null;
        const cta = wtd.href
          ? `<a class="btn btn-primary btn-sm" href="${wtd.href}">${wtd.cta} ${icon('right', 15)}</a>`
          : `<button class="btn btn-primary btn-sm" data-act="${wtd.act}" data-arg="${wtd.arg}">${wtd.cta} ${icon('right', 15)}</button>`;
        let main = '';
        // status banner per step and status
        if (n.status === 'complied' || n.status === 'reinstated') {
          const r = n.reinstatement;
          main += `<div class="banner banner-ok">${icon('check', 18)}<div><b>Complied on ${fmtDate(n.compliedAt)}. This ${s.short.toLowerCase()} is closed.</b>${r ? (r.ackAt ? ` Your salary reinstatement was sent to payroll on ${fmtDate(r.sentAt)} (reference <span class="mono">${r.ref}</span>). Salary resumes from the ${fmtDate(r.effective)} payroll.` : ` Your salary reinstatement is being sent to payroll (reference <span class="mono">${r.ref}</span>). We will SMS you when payroll confirms it.`) : ''}</div></div>`;
        } else if (n.step === 'salary-stoppage') {
          const eff = n.salaryStoppedAt && dOnly(n.salaryStoppedAt) <= dOnly(TODAY);
          main += `<div class="banner banner-danger">${icon('banknote', 18)}<div><b>${eff ? 'Your salary has been stopped pending compliance. It will be reinstated automatically when you comply.' : `Your salary will be stopped from ${fmtDate(n.salaryEffective)} unless you comply before then.`}</b> To comply: ${wtd.text.charAt(0).toLowerCase() + wtd.text.slice(1)}<div>${cta}</div></div></div>`;
        } else if (n.step === 'disciplinary-referral') {
          main += `<div class="banner banner-danger">${icon('gavel', 18)}<div><b>${COMM.code} has asked for disciplinary proceedings to start.</b> Your salary remains stopped. You can still comply: ${wtd.text.charAt(0).toLowerCase() + wtd.text.slice(1)}<div>${cta}</div></div></div>`;
        } else if (n.status === 'responded') {
          main += `<div class="banner banner-info">${icon('send', 18)}<div><b>Your response is on record.</b> It does not stop this notice. To comply: ${wtd.text.charAt(0).toLowerCase() + wtd.text.slice(1)}<div>${cta}</div></div></div>`;
        } else {
          main += `<div class="banner ${n.step === 'warning' ? 'banner-danger' : 'banner-warn'}">${icon(s.icon, 18)}<div><b>Act by ${fmtDate(n.actBy)}${left != null && left >= 0 ? ` (${left === 0 ? 'today' : plural(left, 'day') + ' left'})` : left < 0 ? ' (passed)' : ''}.</b> ${wtd.text} ${n.step === 'warning' ? `If you do not, ${COMM.code} may stop your salary.` : `If you do not, ${COMM.code} may issue a warning.`}<div>${cta}</div></div></div>`;
        }
        // what happened
        const why =
          n.whatToDo === 'file-declaration'
            ? `You did not file your ${esc(n.subjectRef.charAt(0).toLowerCase() + n.subjectRef.slice(1))}.`
            : `You did not respond to clarification <span class="mono nowrap">${n.subjectRef}</span> within 30 days.`;
        main += `<div class="card"><div class="card-head"><h3>What happened</h3></div><div class="sec-b stack" style="gap:14px">
          <p>${why}</p>
          ${n.step === 'salary-stoppage' ? `<div class="kvs"><div><div class="k">Stoppage effective</div><div class="v">${fmtDate(n.salaryEffective)}</div></div><div><div class="k">Payroll instruction</div><div class="v mono">${n.ref}</div></div>${n.reinstatement ? `<div><div class="k">Reinstatement instruction</div><div class="v mono">${n.reinstatement.ref}</div></div><div><div class="k">Payroll confirmed</div><div class="v">${n.reinstatement.ackAt ? fmtDate(n.reinstatement.ackAt) : 'Waiting for payroll'}</div></div>` : ''}</div>` : ''}
        </div></div>`;
        // response
        if (n.response) {
          main += `<div class="card"><div class="card-head"><h3>Your response</h3><span class="spacer"></span><span class="small muted">${fmtDateTime(n.response.at)}</span></div><div class="sec-b stack" style="gap:10px"><div class="qa-answer" style="margin:0"><div class="ans">${esc(n.response.text)}</div></div>${n.response.files.length ? `<div class="docs">${n.response.files.map((x) => docRow(x)).join('')}</div>` : ''}</div></div>`;
        } else if (canRespond) {
          const err = f.tried && !f.text.trim();
          const over = f.text.length > 4000;
          const scanning = f.files.some((y) => y.status === 'scanning');
          main += `<div class="card"><div class="card-head"><h3>Respond <span class="muted" style="font-weight:400">(optional)</span></h3></div>
            <div class="sec-b stack" style="gap:12px">
              <div class="callout callout-info">${icon('info', 16)}<span>Tell ${COMM.code} why you could not act in time. <b>This does not stop the ${s.short.toLowerCase()}</b>; only ${n.whatToDo === 'file-declaration' ? 'filing your declaration' : 'responding to the clarification'} does. You can respond once.</span></div>
              <div class="field"><div class="label"><label for="f-nresp">Your response</label><span class="counter ${over ? 'over' : ''}" data-count="nform.${n.id}.text">${num(f.text.length)} / 4,000</span></div>
                <textarea id="f-nresp" class="textarea ${err || over ? 'err' : ''}" rows="5" data-bind="nform.${n.id}.text" placeholder="For example, why you could not act in time">${esc(f.text)}</textarea>
                ${err ? `<div class="ferr">${icon('alert', 14)} Write your response before you submit.</div>` : over ? `<div class="ferr">${icon('alert', 14)} Keep your response to 4,000 characters or fewer.</div>` : ''}</div>
              ${f.files.length ? `<div class="docs">${f.files.map((x, k) => docRow(x, { removable: true, bind: `nform.${n.id}`, i: k })).join('')}</div>` : ''}
              <label class="attach"><input type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.heic,application/pdf,image/*" data-act-change="attach" data-arg="nform.${n.id}" aria-label="Attach documents to your response"/>${icon('clip', 16)} ${f.files.length ? 'Attach another document' : 'Attach a document'} <span class="muted" style="font-weight:400">(optional)</span></label>
            </div>
            <div class="submitbar">${S.submitErr === n.id ? `<div class="ferr" style="flex-basis:100%">${icon('wifiOff', 14)} We could not send your response. Check your connection and try again.</div>` : ''}<span class="spacer"></span><button class="btn btn-primary" data-act="submitNotice" data-arg="${n.id}" ${scanning ? 'disabled' : ''}>${scanning ? '<span class="spinner"></span> Checking files…' : `${icon('send', 16)} Submit response`}</button></div></div>`;
        } else if (n.step === 'notice-to-comply' || n.step === 'warning') {
          main += `<div class="card card-pad small muted">${n.status === 'issued' && laterStep(n) ? `A ${STEP[STEPS[STEPS.indexOf(n.step) + 1]].title.toLowerCase()} has since been issued. This ${s.short.toLowerCase()} is closed for responses.` : `This ${s.short.toLowerCase()} is closed for responses.`}</div>`;
        }
        return shell(
          `<div class="page">
          <button class="back" data-act="go" data-arg="notices">${icon('left', 16)} Notices</button>
          <div class="head-row"><h1 class="page-title">${s.title}</h1></div>
          <div class="meta-line"><span>${refChip(n.ref)}</span><span>${badge(b)}</span><span>${icon('calendar', 15)} Issued ${fmtDate(n.issuedAt)}</span></div>
          <div class="side-grid">
            <div class="stack" style="min-width:0">${main}</div>
            <div class="side">
              ${n.actBy && noticeLive(n) ? `<div class="card card-pad">${noticeTimer(n)}</div>` : ''}
              ${letterCard('Letter', n.ref, n.verification, `letter|adm:${n.id}`, false, STEP_DOC[n.step], n.reinstatement ? docLink('reinstatement', 'Reinstatement') : '')}
              <div class="card card-pad"><div class="section-title">History</div><div style="margin-top:14px">${ladderBar(n, true)}</div><ul class="timeline" style="margin-top:18px">${noticeHistory(n)}</ul></div>
              ${helpCard()}
            </div>
          </div>
        </div>`,
          'Notices',
        );
      };
      function noticeTimer(n) {
        const total = Math.max(1, dd(n.issuedAt, n.actBy)),
          el = Math.min(total, Math.max(0, dd(n.issuedAt, TODAY))),
          left = dd(TODAY, n.actBy);
        return `<div class="timer"><div class="big countdown ${left <= 3 ? 'danger' : 'warn'}">${left < 0 ? 'Period ended' : left === 0 ? 'Act by today' : `${plural(left, 'day')} left`}</div><div class="small muted" style="margin-top:2px">Act by ${fmtDate(n.actBy)} · day ${el} of ${total}</div><div class="bar ${left <= 3 ? 'danger' : 'warn'}" role="img" aria-label="${el} of ${total} days used"><i style="width:${Math.round((el / total) * 100)}%"></i></div><div class="scale"><span>${shortDate(n.issuedAt)}</span><span></span><span>${shortDate(n.actBy)}</span></div></div>`;
      }
      function noticeHistory(cur) {
        const e = [];
        const list = chain(cur);
        const c = S.clars.find((x) => x.ref === cur.subjectRef);
        if (c) {
          e.push([
            'msg',
            'Clarification issued',
            `${fmtDate(c.issuedAt)} · <span class="nowrap">${c.ref}</span>`,
          ]);
          e.push(['alert', 'Clarification response overdue', fmtDate(c.dueAt)]);
        }
        [...list]
          .sort((a, b) => new Date(a.issuedAt) - new Date(b.issuedAt))
          .forEach((n) => {
            e.push([
              STEP[n.step].icon,
              `${STEP[n.step].title} issued`,
              `${fmtDate(n.issuedAt)} · <span class="nowrap">${n.ref}</span>`,
            ]);
            if (n.response)
              e.push([
                'send',
                `You responded to the ${STEP[n.step].short.toLowerCase()}`,
                fmtDate(n.response.at),
              ]);
            if (n.salaryStoppedAt && dOnly(n.salaryStoppedAt) <= dOnly(TODAY))
              e.push(['ban', 'Salary stopped', fmtDate(n.salaryStoppedAt)]);
          });
        const comp = list.find((n) => n.compliedAt);
        if (comp) e.push(['check', 'You complied', fmtDate(comp.compliedAt)]);
        const r = list.find((n) => n.reinstatement)?.reinstatement;
        if (r)
          e.push([
            'refresh',
            r.ackAt ? 'Salary reinstated' : 'Reinstatement sent to payroll',
            r.ackAt
              ? `Confirmed ${fmtDate(r.ackAt)} · <span class="nowrap">${r.ref}</span>`
              : `${fmtDate(r.sentAt)} · <span class="nowrap">${r.ref}</span>`,
          ]);
        return e
          .map(
            ([ic, t, s]) =>
              `<li><span class="tl-ico">${icon(ic, 14)}</span><div><div class="tl-t">${t}</div><div class="tl-s">${s}</div></div></li>`,
          )
          .join('');
      }

      /* ---------- screen: Home dashboard cards (reference for declarant-journey #home) ---------- */
      screens.dashboard = () => {
        const open = S.clars.filter(isOpen);
        const clarCardHome = S.clars.length
          ? `<div class="card"><div class="card-head"><h3>Clarifications</h3><span class="spacer"></span><button class="btn btn-ghost btn-sm" data-act="go" data-arg="clarifications">View all</button></div>${S.clars.slice(0, 2).map(clarCard).join('')}</div>`
          : '';
        const decCardHome = S.decisions.length
          ? `<div><div class="section-title" style="margin-bottom:10px">Decisions</div>${decisionCard(S.decisions[0])}</div>`
          : '';
        const noticeCardHome = S.notices.length
          ? `<div class="card"><div class="card-head"><h3>Notices</h3><span class="spacer"></span><button class="btn btn-ghost btn-sm" data-act="go" data-arg="notices">View all</button></div>${byDate(
              S.notices,
            )
              .slice(0, 2)
              .map(noticeCard)
              .join('')}</div>`
          : '';
        const accList = accSorted();
        const accCardHome = accList.length
          ? `<div class="card"><div class="card-head"><h3>Access requests</h3><span class="spacer"></span><button class="btn btn-ghost btn-sm" data-act="go" data-arg="access-requests">View all</button></div>${accList.slice(0, 2).map(accCard).join('')}</div>`
          : '';
        const accFirst = accList.some(accNeedsYou);
        const any = clarCardHome || decCardHome || noticeCardHome || accCardHome;
        return shell(
          `<div class="page">
          <div class="proto-note">${icon('info', 16)}<span>Prototype: Home cards after submission (<a href="${JOURNEY}#home">declarant-journey</a>). Each card shows only when it has content.</span></div>
          <h1 class="page-title">${S.notices.some((n) => n.step !== 'notice-to-comply' && n.step !== 'warning' && n.salaryStoppedAt && !['complied', 'reinstated'].includes(n.status)) ? 'Your salary has been stopped' : noticeActionCount() ? 'Your Commission needs you to act' : open.length ? `You have ${plural(open.length, 'clarification')} to respond to` : accFirst ? 'Respond to an access request' : 'You are up to date'}</h1>
          ${any ? `<div class="dash-grid" ${decCardHome ? '' : 'style="grid-template-columns:minmax(0,760px)"'}><div class="stack-lg">${accFirst ? accCardHome : ''}${noticeCardHome}${clarCardHome}${accFirst ? '' : accCardHome}</div>${decCardHome ? `<div class="stack-lg">${decCardHome}</div>` : ''}</div>` : `<div class="card" style="margin-top:20px"><div class="empty" style="padding:40px 20px"><h4>No cards to show</h4><p>Nothing after submission in this state.</p></div></div>`}
        </div>`,
          'Home',
        );
      };

      /* ---------- Access requests (#255): card, list, detail with representations form ---------- */
      const findAcc = (id) => S.access.find((r) => r.id === id);
      const windowOpen = (r) =>
        r.kind === 'form-k' &&
        !r.decision &&
        !r.withdrawnAt &&
        r.reps?.stance !== 'consent' &&
        new Date(r.windowEndsAt) > TODAY;
      const accNeedsYou = (r) => windowOpen(r) && !r.reps;
      function accStatus(r) {
        if (r.kind === 'lea') return { label: 'Law enforcement', kind: 'info', icon: 'shield' };
        if (r.withdrawnAt) return { label: 'Withdrawn', kind: '', icon: 'undo' };
        if (r.decision) return ACC_OUT[r.decision.outcome];
        if (windowOpen(r))
          return r.reps
            ? { label: 'Response saved', kind: 'ok', icon: 'check' }
            : { label: 'Waiting for your response', kind: 'warn', icon: 'clock' };
        return { label: 'Under decision', kind: 'info', icon: 'search' };
      }
      const leaCopy = (r) =>
        `A law-enforcement agency was granted access on ${fmtDate(r.decision.at)} (${esc(r.agency)}, case ${esc(r.caseRef)})`;
      function accLeft(r) {
        const d = dd(TODAY, r.windowEndsAt);
        return d <= 0 ? 'closes today' : d === 1 ? '1 day left' : `${d} days left`;
      }
      function accCard(r) {
        const b = accStatus(r);
        const tone = {
          warn: ['var(--warn-soft)', 'var(--warn)'],
          danger: ['var(--danger-soft)', 'var(--danger)'],
          ok: ['var(--ok-soft)', 'var(--ok)'],
          info: ['#dff2fe', '#0069a8'],
          '': ['var(--sunken)', 'var(--ink-2)'],
        }[b.kind];
        const lea = r.kind === 'lea';
        const open = windowOpen(r);
        const title = lea
          ? leaCopy(r)
          : open
            ? 'Someone has requested access to your declaration'
            : `Access request from ${esc(r.applicant)}`;
        const d = lea
          ? `<span class="mono">${r.ref}</span>`
          : open
            ? `<span class="mono">${r.ref}</span> · ${esc(r.applicant)}<br/>${esc(r.purpose)}<br/>${esc(scopeText(r.scope))}`
            : `<span class="mono">${r.ref}</span> · ${r.decision ? `Decided ${fmtDate(r.decision.at)}` : r.withdrawnAt ? `Withdrawn ${fmtDate(r.withdrawnAt)}` : `Notified ${fmtDate(r.notifiedAt)}`}`;
        const left = open ? accLeft(r) : '';
        const tags = open
          ? `${r.reps ? badge(b) : ''}<span class="countdown ${/today|^1 /.test(left) ? 'danger' : 'warn'} small">${icon('clock', 14)} ${r.reps ? 'Edit until' : 'Respond by'} ${shortDate(r.windowEndsAt)} · ${left}</span>`
          : badge(b);
        return `<a class="cardlink" href="#access-request" data-act="go" data-arg="access-request|${r.id}"><div class="lc"><span class="ico" style="background:${tone[0]};color:${tone[1]}">${icon(lea ? 'shield' : 'users', 18)}</span><div class="body">
          <div class="t">${title}</div>
          <div class="d">${d}</div>
          <div class="tags">${tags}</div></div><span class="chev">${icon('right', 20)}</span></div></a>`;
      }
      const accSorted = () =>
        [...S.access].sort(
          (a, b) =>
            accNeedsYou(b) - accNeedsYou(a) ||
            windowOpen(b) - windowOpen(a) ||
            new Date(b.notifiedAt) - new Date(a.notifiedAt),
        );

      screens['access-requests'] = () => {
        let body;
        if (S.loadFor === 'access-requests') body = skeletonList(3);
        else if (S.errorFor === 'access-requests') body = errorCard('access requests', 'retry');
        else if (!S.access.length)
          body = `<div class="card"><div class="empty" style="padding:56px 20px"><div class="art" style="grid-template-columns:30px"><span style="background:var(--ok-soft);color:var(--ok)">${icon('lock', 16)}</span></div><h4>No access requests</h4><p>If someone asks to see your declaration, we will SMS and email you.</p></div></div>`;
        else {
          const all = accSorted();
          const open = all.filter(windowOpen);
          const rest = all.filter((r) => !windowOpen(r));
          const page = Math.min(S.accPage || 1, Math.max(1, Math.ceil(rest.length / PAGE)));
          const grp = (title, list, foot = '') =>
            list.length
              ? `<div class="section-title" style="margin:24px 0 10px">${title}</div><div class="card">${list.map(accCard).join('')}${foot}</div>`
              : '';
          body =
            grp('Open', open) +
            grp(
              open.length ? 'Earlier' : 'All access requests',
              rest.slice((page - 1) * PAGE, page * PAGE),
              Kit.pager({ page, pageSize: PAGE, total: rest.length, act: 'accPage' }),
            );
        }
        const plain = S.loadFor || S.errorFor || !S.access.length;
        return shell(
          `<div class="page" style="max-width:880px"><button class="back" data-act="go" data-arg="dashboard">${icon('left', 16)} Home</button><h1 class="page-title">Access requests</h1>${plain ? `<div style="margin-top:24px">${body}</div>` : body}</div>`,
          'Home',
        );
      };

      /* RegisterTimeline, compact density (#268). Entries the declarant may see (S12). */
      function accEntries(r) {
        const e = [];
        const add = (kind, at) => e.push({ kind, at, r });
        if (r.kind === 'form-k') {
          add('notified', r.notifiedAt);
          if (r.reps) add('representations', r.reps.updatedAt || r.reps.submittedAt);
          if (r.withdrawnAt) add('withdrawn', r.withdrawnAt);
        }
        if (r.decision) add('decided', r.decision.at);
        if (r.pkg) {
          add('package-issued', r.pkg.issuedAt);
          r.pkg.downloads.forEach((d) => add('downloaded', d));
          if (new Date(r.pkg.expiresAt) < TODAY) add('expired', r.pkg.expiresAt);
        }
        return e.sort((a, b) => new Date(a.at) - new Date(b.at));
      }
      function regText(e) {
        const r = e.r;
        const lea = r.kind === 'lea';
        const who = lea ? r.agency : r.applicant;
        const code = r.comm.code;
        switch (e.kind) {
          case 'notified':
            return ['bell', 'brand', `${who} asked to see your declaration`, `Notified by ${code}`];
          case 'representations':
            return [
              'send',
              '',
              STANCE[r.reps.stance].done,
              r.reps.updatedAt && r.reps.updatedAt !== r.reps.submittedAt ? 'You · edited' : 'You',
            ];
          case 'decided':
            if (lea) return ['shield', 'info', `${who} was granted access`, `Case ${r.caseRef}`];
            return [
              r.decision.outcome === 'deny' ? 'ban' : 'stamp',
              { grant: 'ok', 'partial-grant': 'warn', deny: 'danger' }[r.decision.outcome],
              `${code} ${ACC_OUT[r.decision.outcome].verb}`,
              `Access officer, ${code}`,
            ];
          case 'package-issued':
            return ['box', '', `Package issued to ${who}`, 'Watermarked with their name'];
          case 'downloaded':
            return ['download', '', `${who} downloaded the package`, lea ? 'Agency' : 'Applicant'];
          case 'expired':
            return ['clock', '', 'Download period ended', ''];
          case 'withdrawn':
            return ['undo', '', `${who} withdrew the request`, 'Applicant'];
        }
      }
      const regCompact = (list) =>
        `<ol class="timeline" aria-label="Register entries">${list
          .map((e) => {
            const [ic, tone, t, actor] = regText(e);
            return `<li><span class="tl-ico ${tone}">${icon(ic, 14)}</span><div><div class="tl-t">${esc(t)}</div><div class="tl-s">${actor ? esc(actor) + ' · ' : ''}<time datetime="${e.at}">${fmtDateTime(e.at)}</time></div></div></li>`;
          })
          .join('')}</ol>`;

      // Read-only ScopePicker view. With `granted`, parts outside it show as withheld.
      function scopeView(sc, granted) {
        const chip = (label, on, out) =>
          `<span class="sc-chip ${out ? 'out' : on ? '' : 'off'}">${icon(out || !on ? 'x' : 'check', 12, 2.6)}${label}${out ? '<span class="sr-only"> (withheld)</span>' : !on ? '<span class="sr-only"> (not asked)</span>' : ''}</span>`;
        const g = granted;
        const peopleRow = [
          chip('You', true, false),
          chip('Spouse', sc.spouses, g && sc.spouses && !g.spouses),
          chip('Children', sc.children, g && sc.children && !g.children),
        ].join('');
        const secRow = sc.sections
          .map((k) => chip(SECTIONS[k], true, g && !g.sections.includes(k)))
          .join('');
        const yearsRow = sc.years
          .map((y) => chip(String(y), true, g && !g.years.includes(y)))
          .join('');
        return `<dl class="scope">
          <div><dt>Declaration year</dt><dd>${yearsRow}</dd></div>
          <div><dt>People</dt><dd>${peopleRow}</dd></div>
          <div><dt>Sections</dt><dd>${secRow}</dd></div>
        </dl>${g && g !== sc ? `<div class="small muted row" style="gap:6px;margin-top:10px"><span class="sc-chip out" aria-hidden="true">${icon('x', 12, 2.6)}Withheld</span> not released</div>` : ''}`;
      }
      function accWindowCard(r) {
        if (r.kind !== 'form-k' || r.decision || r.withdrawnAt) return '';
        const total = 7;
        const elapsed = Math.min(total, Math.max(0, dd(r.notifiedAt, TODAY)));
        const open = windowOpen(r);
        const consent = r.reps?.stance === 'consent';
        const endT =
          String(new Date(r.windowEndsAt).getHours()).padStart(2, '0') +
          ':' +
          String(new Date(r.windowEndsAt).getMinutes()).padStart(2, '0');
        const left = accLeft(r);
        const cls = !open ? '' : /today|^1 /.test(left) ? 'danger' : 'warn';
        const big = open
          ? left.charAt(0).toUpperCase() + left.slice(1)
          : consent
            ? 'Closed early'
            : 'Window closed';
        const sub = open
          ? `${r.reps ? 'Edit until' : 'Respond by'} ${fmtDate(r.windowEndsAt)}, ${endT} · day ${elapsed} of ${total}`
          : consent
            ? `You consented on ${fmtDate(r.reps.submittedAt)}`
            : `Closed ${fmtDate(r.windowEndsAt)}, ${endT}`;
        const pctW = open ? Math.round((elapsed / total) * 100) : 100;
        return `<div class="card card-pad"><div class="timer" role="group" aria-label="Window for your response"><div class="big ${cls === 'danger' ? 'countdown danger' : ''}">${big}</div><div class="small muted" style="margin-top:2px">${sub}</div><div class="bar ${open ? cls : ''}" role="img" aria-label="${elapsed} of ${total} days used"><i style="width:${pctW}%"></i></div><div class="scale"><span>${shortDate(r.notifiedAt)}</span><span></span><span>${shortDate(r.windowEndsAt)}</span></div></div></div>`;
      }
      function accForm(r) {
        const f = S.aform[r.id];
        const st = f.stance;
        const conflict = S.accConflict === r.id;
        const dis = conflict ? 'disabled' : '';
        const errStance = f.tried && !st;
        const needText = st && st !== 'consent';
        const errText = f.tried && needText && !f.text.trim();
        const over = f.text.length > REP_MAX;
        const scanning = f.files.some((y) => y.status === 'scanning');
        const busy = S.accBusy === r.id;
        const lab =
          st === 'object'
            ? 'Your reasons'
            : st === 'context'
              ? 'Context for ' + r.comm.code
              : 'Comments';
        const ph =
          st === 'object'
            ? 'Why the declaration should not be released'
            : st === 'context'
              ? 'What the Commission should know before deciding'
              : 'Anything you want to add';
        const choice = Kit.choices(
          `aform.${r.id}.stance`,
          Object.entries(STANCE).map(([k, v]) => ({ k, label: v.label, icon: v.icon, sub: v.sub })),
          'c3',
          { tiles: true },
        );
        return `<div class="card"><div class="card-head"><h3>Your response</h3></div>
          <fieldset class="sec-b stack acc-form" style="gap:16px" ${dis}>
            <div class="field"><div class="label" id="lg-${r.id}"><span>Your position</span></div><div aria-labelledby="lg-${r.id}">${choice}</div>${errStance ? `<div class="ferr" role="alert">${icon('alert', 14)} Choose object, consent or add context.</div>` : ''}</div>
            ${
              st
                ? `<div class="field"><div class="label"><label for="f-arep">${lab}${st === 'consent' ? ' <span class="opt">Optional</span>' : ''}</label><span class="counter ${over ? 'over' : ''}" data-count="aform.${r.id}.text">${num(f.text.length)} / ${num(REP_MAX)}</span></div>
              <textarea id="f-arep" class="textarea ${errText || over ? 'err' : ''}" rows="5" data-bind="aform.${r.id}.text" placeholder="${ph}" ${errText ? 'aria-invalid="true"' : ''}>${esc(f.text)}</textarea>
              ${errText ? `<div class="ferr">${icon('alert', 14)} ${st === 'object' ? 'Write your reasons.' : 'Write the context you want the Commission to consider.'}</div>` : over ? `<div class="ferr">${icon('alert', 14)} Keep your response to ${num(REP_MAX)} characters or fewer.</div>` : ''}</div>
              ${f.files.length ? `<div class="docs">${f.files.map((x, k) => docRow(x, { removable: !conflict, bind: `aform.${r.id}`, i: k })).join('')}</div>` : ''}
              ${conflict ? '' : f.files.length >= REP_FILES ? `<div class="hint">Up to ${REP_FILES} documents.</div>` : `<label class="attach"><input type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.heic,application/pdf,image/*" data-act-change="attach" data-arg="aform.${r.id}" aria-label="Attach documents to your response"/>${icon('clip', 16)} ${f.files.length ? 'Attach another document' : 'Attach a document'} <span class="muted" style="font-weight:400">(optional)</span></label>`}`
                : ''
            }
          </fieldset>
          ${
            conflict
              ? ''
              : `<div class="submitbar">${S.submitErr === r.id ? `<div class="ferr" style="flex-basis:100%">${icon('wifiOff', 14)} We could not save your response. Check your connection and try again.</div>` : ''}<span class="small muted">Editable until ${fmtDate(r.windowEndsAt)}</span><span class="spacer"></span>${S.aEdit === r.id ? `<button class="btn btn-ghost" data-act="accCancel" data-arg="${r.id}" ${busy ? 'disabled' : ''}>Cancel</button>` : ''}<button class="btn btn-primary" data-act="accSave" data-arg="${r.id}" ${scanning || busy ? 'disabled' : ''}>${busy ? '<span class="spinner"></span> Saving…' : scanning ? '<span class="spinner"></span> Checking files…' : S.aEdit === r.id ? 'Save changes' : `${icon('send', 16)} Send response`}</button></div>`
          }</div>`;
      }
      function accRepsCard(r) {
        const x = r.reps;
        const edited = x.updatedAt && x.updatedAt !== x.submittedAt;
        return `<div class="card"><div class="card-head"><h3>Your response</h3><span class="spacer"></span>${windowOpen(r) ? `<button class="btn btn-secondary btn-sm" data-act="accEdit" data-arg="${r.id}">${icon('pencil', 15)} Edit</button>` : ''}</div>
          <div class="sec-b stack" style="gap:10px"><div class="row wrap" style="gap:8px"><span class="badge">${icon(STANCE[x.stance].icon, 13, 2.2)} ${STANCE[x.stance].done}</span><span class="small muted">${edited ? `Edited ${fmtDateTime(x.updatedAt)}` : `Sent ${fmtDateTime(x.submittedAt)}`}</span></div>
          ${x.text ? `<div class="qa-answer" style="margin:0"><div class="ans">${esc(x.text)}</div></div>` : ''}
          ${x.files.length ? `<div class="docs">${x.files.map((y) => docRow(y)).join('')}</div>` : ''}</div></div>`;
      }
      screens['access-request'] = () => {
        const r = findAcc(S.params.id) || accSorted()[0];
        if (S.notFound || !r)
          return shell(
            `<div class="page" style="max-width:720px"><button class="back" data-act="go" data-arg="access-requests">${icon('left', 16)} Access requests</button><div class="card"><div class="empty" style="padding:56px 20px"><div class="art" style="grid-template-columns:30px"><span style="background:var(--sunken);color:var(--muted)">${icon('search', 16)}</span></div><h4>Access request not found</h4><p>The link may be wrong, or it is not about your declaration.</p><div style="margin-top:14px"><button class="btn btn-secondary" data-act="go" data-arg="access-requests">All access requests</button></div></div></div></div>`,
            'Home',
          );
        const lea = r.kind === 'lea';
        const b = accStatus(r);
        const d = r.decision;
        const open = windowOpen(r);
        const code = r.comm.code;
        const conflict = S.accConflict === r.id;
        if (open && !r.reps && !S.aform[r.id])
          S.aform[r.id] = { stance: '', text: '', files: [], tried: false };
        const endAt = `${fmtDate(r.windowEndsAt)}, ${String(new Date(r.windowEndsAt).getHours()).padStart(2, '0')}:${String(new Date(r.windowEndsAt).getMinutes()).padStart(2, '0')}`;
        let banner;
        if (lea)
          banner = `<div class="banner banner-info">${icon('shield', 18)}<div><b>${leaCopy(r)}.</b> ${Kit.tip('Law-enforcement requests are shown after access is granted, so investigations are not prejudiced.', { label: 'Why now' })}</div></div>`;
        else if (conflict)
          banner = `<div class="banner banner-warn">${icon('clock', 18)}<div><b>The window closed at ${endAt.split(', ')[1]} today.</b> Your response was not saved. ${code} is deciding.</div></div>`;
        else if (r.withdrawnAt)
          banner = `<div class="banner banner-neutral">${icon('undo', 18)}<div><b>The applicant withdrew the request on ${fmtDate(r.withdrawnAt)}.</b> Nothing was released.</div></div>`;
        else if (d)
          banner = `<div class="banner ${d.outcome === 'grant' ? 'banner-info' : d.outcome === 'deny' ? 'banner-ok' : 'banner-warn'}">${icon(d.outcome === 'deny' ? 'ban' : 'stamp', 18)}<div><b>${code} ${ACC_OUT[d.outcome].verb} on ${fmtDate(d.at)}.</b> ${d.outcome === 'deny' ? 'Nothing was released.' : d.outcome === 'partial-grant' ? 'Only part of what was asked was released.' : 'What was asked was released.'}</div></div>`;
        else if (open && !r.reps)
          banner = `<div class="banner banner-warn">${icon('bell', 18)}<div><b>Someone has requested access to your declaration.</b> Respond by ${endAt}. ${code} decides after that.</div></div>`;
        else if (open)
          banner = `<div class="banner banner-info">${icon('check', 18)}<div><b>Your response is saved.</b> You can edit it until ${endAt}.</div></div>`;
        else if (r.reps?.stance === 'consent')
          banner = `<div class="banner banner-info">${icon('check', 18)}<div><b>You consented.</b> ${code} can now decide. We will SMS and email you the outcome.</div></div>`;
        else
          banner = `<div class="banner banner-neutral">${icon('clock', 18)}<div><b>The window closed on ${fmtDate(r.windowEndsAt)}.</b> ${r.reps ? `${code} has your response and is deciding.` : `You did not respond. ${code} is deciding.`}</div></div>`;
        const kv = (k, v, full) =>
          `<div ${full ? 'style="grid-column:1/-1"' : ''}><div class="k">${k}</div><div class="v">${v}</div></div>`;
        const reqCard = lea
          ? `<div class="card"><div class="card-head"><h3>Scope granted</h3></div><div class="sec-b">${scopeView(r.scope)}</div></div>`
          : `<div class="card"><div class="card-head"><h3>Request</h3></div><div class="sec-b stack" style="gap:18px">
          <div class="kvs">${lea ? `${kv('Agency', esc(r.agency))}${kv('Case reference', `<span class="mono">${esc(r.caseRef)}</span>`)}` : `${kv('Applicant', esc(r.applicant))}${kv('Commission', esc(r.comm.name))}${kv('Purpose', esc(r.purpose), true)}`}</div>
          <div><div class="k-label">${lea ? 'Scope granted' : d && d.outcome === 'partial-grant' ? 'Scope asked and granted' : 'Scope asked'}</div>${scopeView(r.scope, d && d.outcome === 'partial-grant' ? d.granted : null)}</div>
        </div></div>`;
        const decCard =
          d && !lea
            ? `<div class="card"><div class="card-head"><h3>Decision</h3><span class="spacer"></span><span class="small muted">${fmtDate(d.at)}</span></div><div class="sec-b stack" style="gap:14px">
            <div>${badge(ACC_OUT[d.outcome])}</div>
            ${d.grounds.length ? `<div><div class="k-label">Grounds</div><ul class="grounds">${d.grounds.map((g) => `<li>${esc(GROUNDS[g])}</li>`).join('')}</ul></div>` : ''}
            <div><div class="k-label">Reasons</div><p style="font-size:14px">${esc(d.reasons)}</p></div>
            ${r.pkg ? `<div class="small muted row" style="gap:6px">${icon('box', 15)} Package issued to ${esc(r.applicant)}, watermarked with their name. ${r.pkg.downloads.length ? `Downloaded ${plural(r.pkg.downloads.length, 'time')}.` : 'Not downloaded yet.'}</div>` : ''}
          </div></div>`
            : '';
        let resp = '';
        if (!lea) {
          if ((open && (!r.reps || S.aEdit === r.id)) || conflict) resp = accForm(r);
          else if (r.reps) resp = accRepsCard(r);
        }
        return shell(
          `<div class="page">
          <button class="back" data-act="go" data-arg="access-requests">${icon('left', 16)} Access requests</button>
          <div class="head-row"><h1 class="page-title">${lea ? 'Law-enforcement access' : 'Access request'}</h1></div>
          <div class="meta-line"><span>${refChip(r.ref)}</span><span>${badge(b)}</span><span>${icon('calendar', 15)} ${lea ? 'Granted' : 'Notified'} ${fmtDate(lea ? d.at : r.notifiedAt)}</span></div>
          <div class="side-grid">
            <div class="stack" style="min-width:0">${banner}${d && !lea ? decCard + reqCard : reqCard}${resp}</div>
            <div class="side">
              ${accWindowCard(r)}
              <div class="card card-pad"><div class="row" style="justify-content:space-between"><div class="section-title">History</div><a class="link small" href="${PROFILE}#who-accessed">Who accessed</a></div><div style="margin-top:14px">${regCompact(accEntries(r))}</div></div>
              ${helpCard()}
            </div>
          </div>
        </div>`,
          'Home',
        );
      };

      /* ---------- letter modal ---------- */
      function letterBody(kind, obj) {
        const date = fmtDate(obj.issuedAt || obj.decidedAt);
        const to = `<dl class="lmeta"><dt>Our ref</dt><dd class="mono">${obj.ref}</dd><dt>Date</dt><dd>${date}</dd><dt>To</dt><dd>${ME.full}, ${ME.designation}</dd><dt>TSC number</dt><dd>${ME.fileNo}</dd><dt>Station</dt><dd>${ME.entity}</dd></dl>`;
        let subj, body;
        if (kind === 'clr') {
          subj = `Request for clarification: ${DECL.type.toLowerCase()} ${DECL.ref}`;
          body = `<p>Dear ${ME.name.split(' ')[0]},</p><p>Under section 35(2) of the Conflict of Interest Act, 2025, the Commission has analysed your declaration received on ${fmtDate(DECL.receivedAt)} and requests clarification on the following:</p>
            <ol>${obj.items.map((it) => `<li><span class="req">${REQ[it.requirement].label}</span>: ${esc(it.label)}.<br/>${esc(it.text)}</li>`).join('')}</ol>
            <p>Under section 35(3), please respond by <b>${fmtDate(obj.dueAt)}</b>. Respond online at Adili Online: sign in, open Clarifications and select ${obj.ref}. You may attach supporting documents.</p>`;
        } else if (kind === 'cmp') {
          const o = OUTCOME[obj.outcome];
          subj = `Compliance determination: ${DECL.type.toLowerCase()} ${DECL.ref}`;
          body = `<p>Dear ${ME.name.split(' ')[0]},</p><p>The Commission has completed its review of your declaration received on ${fmtDate(DECL.receivedAt)}.</p><p>Determination: <b>${o.label}</b>.</p><p>${o.text}</p><p>Keep this letter for your records. Anyone you share it with can check that it is genuine using the code below.</p>`;
        } else {
          const s = STEP[obj.step],
            w = whatToDo(obj);
          subj = `${s.title}: ${obj.whatToDo === 'file-declaration' ? 'declaration not filed' : `clarification ${obj.subjectRef} not answered`}`;
          const extra =
            obj.step === 'salary-stoppage'
              ? `<p>Following the notice to comply and warning issued to you, the Commission has instructed payroll to stop your salary from <b>${fmtDate(obj.salaryEffective)}</b> (instruction ${obj.ref}). Your salary will be reinstated automatically when you comply.</p>`
              : obj.step === 'disciplinary-referral'
                ? `<p>Following the notice to comply, warning and salary stoppage issued to you, the Commission has asked for disciplinary proceedings to start against you. Your salary remains stopped until you comply.</p>`
                : `<p>You are required to act by <b>${fmtDate(obj.actBy)}</b>. ${obj.step === 'warning' ? 'If you do not, the Commission may stop your salary.' : 'If you do not, the Commission may issue a warning.'}</p>`;
          body = `<p>Dear ${ME.name.split(' ')[0]},</p><p>${obj.whatToDo === 'file-declaration' ? 'You have not filed your declaration as required by the Conflict of Interest Act, 2025.' : `You have not responded to the Commission's request for clarification ${obj.subjectRef} within the 30 days required by section 35(3) of the Conflict of Interest Act, 2025.`}</p><p>What to do: ${w.text}</p>${extra}<p>You may respond to this letter on Adili Online under Notices. A response is recorded for the Commission but does not by itself stop this action.</p>`;
        }
        return `${to}<h4>${subj}</h4>${body}<div class="sig"><div>Yours faithfully,</div><div style="margin-top:14px;font-weight:600">For: Secretary / Chief Executive</div><div>${COMM.name}</div></div>`;
      }
      const modals = {};
      modals.letter = () => {
        const [kind, id] = S.modal.id.split(':');
        const obj =
          kind === 'clr'
            ? findClar(id)
            : kind === 'cmp'
              ? S.decisions.find((d) => d.id === id)
              : findNotice(id);
        if (!obj) return '';
        const revoked = kind === 'clr' && obj.status === 'withdrawn';
        const title =
          kind === 'clr'
            ? 'Clarification letter'
            : kind === 'cmp'
              ? 'Decision letter'
              : `${STEP[obj.step].title} letter`;
        return dialog({
          title,
          sub: `${obj.ref} · Restricted · ${revoked ? 'revoked' : 'digitally signed'}`,
          wide: true,
          body: `${revoked ? `<div class="callout callout-danger">${icon('ban', 16)}<span>Revoked on ${fmtDate(obj.withdrawnAt)}: issued in error. It is no longer valid.</span></div>` : ''}
            <div class="letter-wrap"><article class="letter" aria-label="${title}">
              <span class="restricted">RESTRICTED</span>
              <div class="lh"><span class="seal">${COMM.code}</span><div><div class="org">${COMM.name}</div><div class="addr">${COMM.addr}</div></div></div>
              ${letterBody(kind, obj)}
              ${revoked ? '<div class="stamp">Revoked: issued in error</div>' : ''}
              <div class="lfoot">${qr(obj.ref.length * 7, 72)}<div style="min-width:0"><div>Verification code</div><div class="code">${obj.verification}</div><div style="margin-top:4px">Scan the code or visit verify.adili.go.ke to check this letter. Issued through Adili Online by ${COMM.code} on ${fmtDate(obj.issuedAt || obj.decidedAt)}.</div></div></div>
            </article></div>`,
          foot: `<button class="btn btn-ghost" data-act="copy" data-arg="${obj.verification}">${icon('copy', 16)} Copy code</button>${docLink(kind === 'clr' ? 'clarification-letter' : kind === 'cmp' ? DEC_DOC(obj.outcome) : STEP_DOC[obj.step], 'Download PDF', 'btn btn-primary')}`,
        });
      };
      modals.confirmClar = () => {
        const c = findClar(S.modal.id);
        const late = dd(TODAY, c.dueAt) < 0;
        const files = S.form[c.id].items.reduce(
          (a, x) => a + x.files.filter((y) => y.status === 'clean').length,
          0,
        );
        return dialog({
          title: 'Submit your response?',
          icon: 'send',
          tint: ['var(--sunken)', 'var(--ink)'],
          body: `<p>You can respond once. Make sure every point is answered.</p>
            <dl class="dl"><div><dt>Clarification</dt><dd class="mono">${c.ref}</dd></div><div><dt>Points answered</dt><dd>${c.items.length} of ${c.items.length}</dd></div><div><dt>Documents attached</dt><dd>${files}</dd></div></dl>
            ${late ? `<div class="callout callout-warn">${icon('clock', 16)}<span>The due date was ${fmtDate(c.dueAt)}. Your response will be recorded as ${plural(-dd(TODAY, c.dueAt), 'day')} late.</span></div>` : ''}`,
          foot: `<button class="btn btn-secondary" data-act="closeModal" ${S.modal.busy ? 'disabled' : ''}>Check again</button><button class="btn btn-primary" data-act="confirmClar" data-arg="${c.id}" ${S.modal.busy ? 'disabled' : ''}>${S.modal.busy ? '<span class="spinner"></span> Sending…' : 'Submit response'}</button>`,
        });
      };
      modals.confirmNotice = () => {
        const n = findNotice(S.modal.id);
        return dialog({

      /* ---------- actions ---------- */
      function fileAdd(bind, fileList) {
        const target = Kit.getPath(S, bind);
        const OK = /\.(pdf|jpe?g|png|heic)$/i;
        [...fileList].forEach((file) => {
          const f = {
            id: Kit.id('f'),
            name: file.name,
            size: file.size || 180000,
            status: 'scanning',
          };
          if (!OK.test(file.name)) {
            f.status = 'rejected';
            f.reason = 'Use a PDF, JPEG, PNG or HEIC file.';
          } else if (f.size > 20e6) {
            f.status = 'rejected';
            f.reason = `This file is ${(f.size / 1e6).toFixed(1)} MB. The limit is 20 MB.`;
          }
          target.files.push(f);
          if (f.status === 'scanning')
            setTimeout(() => {
              f.status = /virus|eicar/i.test(f.name) ? 'infected' : 'clean';
              Kit.render();
            }, 1400);
        });
        Kit.render();
      }
      function complyFromClar(c) {
        // clarification.responded.v1 ends the ladder keyed by this clarification (spec 08 S7, S11)
        const affected = S.notices.filter(
          (n) => n.subjectRef === c.ref && !['complied', 'reinstated'].includes(n.status),
        );
        if (!affected.length) return;
        affected.forEach((n) => {
          n.status = 'complied';
          n.compliedAt = c.respondedAt;
        });
        const stop = affected.find(
          (n) =>
            n.step === 'salary-stoppage' &&
            n.salaryStoppedAt &&
            dOnly(n.salaryStoppedAt) <= dOnly(TODAY),
        );
        const disc = affected.find((n) => n.step === 'disciplinary-referral');
        if (disc) disc.status = 'complied';
        if (stop) {
          stop.reinstatement = {
            sentAt: TODAY.toISOString(),
            ref: stop.ref + '-R',
            ackAt: null,
            effective: '2026-09-30T00:00:00',
          };
          setTimeout(() => {
            stop.reinstatement.ackAt = addDays(TODAY, 0).toISOString();
            stop.status = 'reinstated';
            Kit.render();
          }, 4000);
        }
      }

      /* ---------- actions: access requests (#255) ---------- */
      function accPut(id) {
        // PUT /v1/me/access-notices/{id}/representations (200, or 409 when the window has closed)
        const r = findAcc(id);
        const f = S.aform[id];
        S.accBusy = id;

        setTimeout(() => {
          S.accBusy = null;
          S.modal = null;
          if (S.fail === 'network') {
            S.fail = null;
            S.submitErr = id;
            Kit.render();
            return;
          }
          if (S.fail === 'closed') {
            S.fail = null;
            S.accConflict = id;
            r.windowEndsAt = '2026-09-26T10:25:00';
            Kit.render();
            return;
          }
          const now = TODAY.toISOString();
          const first = !r.reps;
          r.reps = {
            stance: f.stance,
            text: f.text.trim(),
            files: f.files.filter((y) => y.status === 'clean'),
            submittedAt: first ? now : r.reps.submittedAt,
