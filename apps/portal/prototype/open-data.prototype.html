      /* ---------- dataset builder: the six tables with suppression ---------- */
      function expectedFor(c, fy, cycle, kind, asAt) {
        if (cycle === 'biennial' && fy % 2 === 0) return 0; // no biennial cycle in even FYs
        const small = c.small?.[fy]?.[cycle];
        let e =
          small != null
            ? small

        if (kind === 'snapshot' && small == null) {
          const f =

              ? { initial: 0.22, biennial: 0, final: 0.24 }
              : { initial: 0.6, biennial: 0.42, final: 0.58 };
          e = Math.round(e * f[cycle]);
        }
        return e;
      }
      function commissionFigures(c, rel) {
        const { fy, kind } = rel;
        const key = `${c.code}-${fy}-${kind}`;
        if (c.notReported?.includes(fy) && kind === 'annual') return null;
        const f = {};
        CYCLES.forEach((cy, i) => {
          const e = expectedFor(c, fy, cy, kind);
          let d;
          if (fy === 2025 && kind === 'annual' && c.decl2025) d = c.decl2025[i];
          else {
            let miss =
              rr(key + cy, 0.012, 0.075) +
              (fy === 2024 ? 0.025 : 0) +
              (kind === 'snapshot' ? 0.05 : 0);
            if (c.code === 'CPSB047' && cy === 'biennial') miss = 0.36;
            d = e - Math.round(e * miss);
            if (e && e < 10) d = e - Math.round(rr(key + cy + 's', 0, 2.4));
          }
          if (rel.id === 'rel-2024-annual-1' && c.code === 'TSC' && cy === 'initial') d += 1204;
          const late = Math.round(d * rr(key + cy + 'l', 0.03, 0.13));
          f[cy] = { e, d, late };
        });
        const E = CYCLES.reduce((a, cy) => a + f[cy].e, 0);
        const D = CYCLES.reduce((a, cy) => a + f[cy].d, 0);
        const nonFilers = Math.max(0, E - D);
        const dets = Math.round(D * rr(key + 'dr', 0.22, 0.5));
        const comp = Math.round(dets * rr(key + 'cr', 0.88, 0.965));
        const nonc = Math.round((dets - comp) * rr(key + 'nc', 0.45, 0.7));
        const further = dets - comp - nonc;
        const clarI =
          fy === 2025 && kind === 'annual' && c.clar2025
            ? c.clar2025
            : Math.round(D * rr(key + 'cl', 0.004, 0.012));
        const clarR = Math.round(clarI * rr(key + 'cz', 0.78, 0.93));
        const notice = Math.round(
          (nonFilers * rr(key + 'an', 0.45, 0.7) + nonc * 0.4) * (kind === 'snapshot' ? 0.45 : 1),
        );
        const warning = Math.round(notice * rr(key + 'aw', 0.18, 0.34));
        const stoppage = Math.round(warning * rr(key + 'as', 0.12, 0.28));
        const disciplinary = Math.round(stoppage * rr(key + 'ad', 0.2, 0.45));
        const referrals = Math.round(
          disciplinary * rr(key + 'rf', 0.3, 0.8) + (c.county ? 0 : rr(key + 'rx', 1, 6)),
        );
        const big = !c.county || ['CPSB047', 'CPSB001', 'CPSB022', 'CPSB032'].includes(c.code);
        const acc = big
          ? Math.round(rr(key + 'ac', 6, c.code === 'TSC' ? 60 : 34))
          : Math.round(rr(key + 'ac', -3, 5));
        const received = Math.max(0, acc);
        const granted = Math.round(received * rr(key + 'ag', 0.4, 0.6));
        const partly = Math.round((received - granted) * rr(key + 'ap', 0.2, 0.5));
        const denied = received - granted - partly;
        const dPurpose = Math.round(denied * 0.55);
        const dInv = Math.round((denied - dPurpose) * 0.6);
        const lea = big
          ? Math.round(rr(key + 'le', 1, c.code === 'TSC' ? 24 : 12))
          : Math.round(rr(key + 'le', -2, 3));
        return {
          f,
          E,
          D,
          late: CYCLES.reduce((a, cy) => a + f[cy].late, 0),
          nonFilers,
          dets,
          comp,
          nonc,
          further,
          clarI,
          clarR,
          notice,
          warning,
          stoppage,
          disciplinary,
          referrals,
          received,
          granted,
          partly,
          dPurpose,
          dInv,
          dOther: denied - dPurpose - dInv,
          lea: Math.max(0, lea),
        };
      }

      // Pure suppression module (spec 09b "Suppression"): cells derived from fewer than 10 officers become
      // null with a marker; complementary suppression hides the next smallest cell wherever a single hidden
      // cell could be recovered from a published total. Markers: 'p' primary, 'c' complementary.
      const SUP_T = 10;
      function suppressCells(rows, cols) {
        rows.forEach((r) => {
          r._sup = r._sup || {};
          if (r._nr) return;
          cols.forEach((c) => {
            if (r[c] > 0 && r[c] < SUP_T) r._sup[c] = 'p';
          });
        });
        complementCols(rows, cols, false);
      }
      function complementCols(rows, cols, wholeRow, rowCols) {
        let changed = true;
        let guard = 0;
        while (changed && guard++ < 20) {
          changed = false;
          cols.forEach((c) => {
            const hidden = rows.filter((r) => r._sup[c]);
            if (hidden.length !== 1) return;
            const cand = rows
              .filter((r) => !r._nr && !r._sup[c] && r[c] > 0)
              .sort((a, b) => a[c] - b[c])[0];
            if (!cand) return;
            (wholeRow ? rowCols : [c]).forEach((cc) => {
              if (!cand._sup[cc]) cand._sup[cc] = 'c';
            });
            changed = true;
          });
        }
      }

      const DS_CACHE = {};
      function dataset(rel) {
        if (DS_CACHE[rel.id]) return DS_CACHE[rel.id];
        const figs = COMMS.map((c) => ({ c, x: commissionFigures(c, rel) }));
        const T = {};

        /* filing-by-commission: Commission x cycle, plus all cycles */
        const fcols = ['expected', 'filed', 'late', 'nonFilers', 'filingRate'];
        const frows = [];
        figs.forEach(({ c, x }) => {
          [...CYCLES, 'all'].forEach((cy) => {
            const base = { commission: c.name, commissionCode: c.code, short: c.short, cycle: cy };
            if (!x) return frows.push({ ...base, _nr: true, _sup: {} });
            const v = cy === 'all' ? { e: x.E, d: x.D, late: x.late } : x.f[cy];
            if (!v.e && !v.d) return; // no obligations in this cycle
            frows.push({
              ...base,
              expected: v.e,
              filed: v.d,
              late: v.late,
              nonFilers: Math.max(0, v.e - v.d),
              filingRate: rateOf(v.d, v.e),
              _sup: {},
            });
          });
        });
        // Primary: a row whose officer denominator (expected) is under 10 is hidden entirely.
        frows.forEach((r) => {
          if (!r._nr && r.expected > 0 && r.expected < SUP_T)
            fcols.forEach((k) => (r._sup[k] = 'p'));
        });
        // Complementary: per cycle (column totals are published in by-cycle) and per Commission (all cycles total).
        for (let pass = 0; pass < 4; pass++) {
          CYCLES.forEach((cy) =>
            complementCols(
              frows.filter((r) => r.cycle === cy),
              ['expected'],
              true,
              fcols,
            ),
          );
          COMMS.forEach((c) => {
            const mine = frows.filter(
              (r) => r.commissionCode === c.code && r.cycle !== 'all' && !r._nr,
            );
            const hidden = mine.filter((r) => r._sup.expected);
            if (hidden.length === 1) {
              const cand = mine
                .filter((r) => !r._sup.expected)
                .sort((a, b) => a.expected - b.expected)[0];
              if (cand) fcols.forEach((k) => (cand._sup[k] = cand._sup[k] || 'c'));
            }
          });
        }
        T['filing-by-commission'] = { rows: frows };

        /* compliance-by-commission */
        const ccols = [
          'determinationsCompliant',
          'determinationsNonCompliant',
          'determinationsFurtherAction',
          'clarificationsIssued',
          'clarificationsResolved',
          'actionsNotice',
          'actionsWarning',
          'actionsSalaryStoppage',
          'actionsDisciplinary',
          'referrals',
        ];
        const crows = figs.map(({ c, x }) => {
          const base = { commission: c.name, commissionCode: c.code, short: c.short, _sup: {} };
          if (!x) return { ...base, _nr: true };
          return {
            ...base,
            determinationsCompliant: x.comp,
            determinationsNonCompliant: x.nonc,
            determinationsFurtherAction: x.further,
            clarificationsIssued: x.clarI,
            clarificationsResolved: x.clarR,
            actionsNotice: x.notice,
            actionsWarning: x.warning,
            actionsSalaryStoppage: x.stoppage,
            actionsDisciplinary: x.disciplinary,
            referrals: x.referrals,
            complianceRate: rateOf(x.comp, x.dets),
            _dets: x.dets,
          };
        });
        suppressCells(crows, ccols);
        crows.forEach((r) => {

        });
        T['compliance-by-commission'] = { rows: crows };

        /* national sums (published rows only use real values; suppression never changes totals) */
        const rep = figs.filter((f) => f.x);
        const sum = (fn) => rep.reduce((a, { x }) => a + fn(x), 0);
        const byCy = CYCLES.map((cy) => {
          const e = sum((x) => x.f[cy].e);

          return {
            cycle: cy,
            expected: e,
            filed: d,

        T['by-cycle'] = { rows: byCy };
        const NT = {
          expected: sum((x) => x.E),
          filed: sum((x) => x.D),
          late: sum((x) => x.late),
          dets: sum((x) => x.dets),

          referrals: sum((x) => x.referrals),

            const e = Math.round(NT.expected * share);
            const d = Math.round(e * (1 - rr(rel.id + t, 0.02, 0.09)));
            const referrals = Math.round(NT.referrals * share * rr(rel.id + t + 'r', 0.6, 1.4));
            return {

              expected: e,
              filed: Math.min(d, e),
              late: Math.round(d * rr(rel.id + t + 'l', 0.04, 0.11)),
              nonFilers: e - Math.min(d, e),
              filingRate: rateOf(Math.min(d, e), e),
              determinations: Math.round(NT.dets * share),
              clarificationsIssued: Math.round(NT.clarI * share),

          'partlyGranted',

          const base = { commission: c.name, commissionCode: c.code, short: c.short, _sup: {} };
          if (!x) return { ...base, _nr: true };
          return {

            granted: x.granted,
            partlyGranted: x.partly,

            lawEnforcementRequests: x.lea,

        });

        T['access-requests'] = { rows: arows };

        /* national-totals */
        T['national-totals'] = {

            ['Responsible Commissions reporting', NT.reporting, `of ${NT.commissions}`],
            ['Declarations expected', NT.expected],
            ['Declarations made', NT.filed],
            ['Declaration rate', NT.filingRate, '%'],
            ['Made late', NT.late],
            ['Not made', NT.nonFilers],
            ['Compliance determinations', NT.dets],
            ['Compliance rate', NT.complianceRate, '%'],
            ['Clarifications issued', NT.clarI],
            ['Clarifications resolved', NT.clarR],
            ['Administrative actions', NT.actions],
            ['Referrals to EACC', NT.referrals],
            ['Access requests received', NT.received],
            ['Access requests granted', NT.granted],
            ['Law enforcement requests', NT.lea],
          ].map(([measure, value, unit]) => ({ measure, value, unit, _sup: {} })),
        };

        const hiddenCount = (rows) =>
          rows.reduce((a, r) => a + Object.keys(r._sup || {}).length, 0);
        Object.entries(T).forEach(([k, t]) => {
          const rowsForFile = k === 'filing-by-commission' ? t.rows : t.rows;
          t.hidden = hiddenCount(rowsForFile);

      /* ---------- table definitions (columns: key, English label, Kiswahili label, format) ---------- */

      /* ---------- SuppressionMarker (#349) ---------- */

      /* ---------- Chart wrapper (#356): bar and line, hand-built SVG, table fallback, null-safe ---------- */

      // barChart: horizontal bars (long Commission names read best this way). rows: [{label, full, value|null, marker, tip}]
      function barChart({

      // lineChart: x categories, 1-4 series with legend and direct end labels; null values break the line.
      function lineChart({
        id,
        title,
        desc,
        cats,
        series,
        yLabel,
        xLabel,
        showTable = false,
        sw = false,
        valueFmt = pctS,
      }) {
        const W = VIZ_W[id] || 640;
        const narrow = W < 520;
        const H = narrow ? 230 : 260;
        const L = 52;
        const R = narrow ? 64 : 160;
        const T = 16;
        const B = 52;
        const all = series.flatMap((s) => s.values).filter((v) => v != null);
        let lo = Math.floor((Math.min(...all, 100) - 4) / 5) * 5;
        lo = Math.max(0, Math.min(lo, 80));
        const hi = 100;
        const pw = W - L - R;
        const ph = H - T - B;
        const px = (i) =>
          cats.length === 1 ? L + pw / 2 : L + 28 + (i / (cats.length - 1)) * (pw - 56);
        const py = (v) => T + ph - ((v - lo) / (hi - lo)) * ph;
        const step = (hi - lo) / 4;
        let g = '';
        for (let k = 0; k <= 4; k++) {
          const v = lo + k * step;
          g += `<line x1="${L}" x2="${L + pw}" y1="${py(v)}" y2="${py(v)}" stroke="${k === 0 ? VIZ.axis : VIZ.grid}" stroke-width="1"/><text x="${L - 8}" y="${py(v) + 4}" text-anchor="end" class="tk">${Math.round(v)}%</text>`;
        }
        cats.forEach((c, i) => {
          g += `<text x="${px(i)}" y="${T + ph + 18}" text-anchor="middle" class="tk">${xmlEsc(narrow && cats.length > 3 ? c.replace(/^20/, '') : c)}</text>`;
        });
        const colors = [VIZ.s1, VIZ.s2];
        const endLabels = [];
        series.forEach((s, si) => {
          const col = colors[si];
          let d = '';
          let pen = false;
          s.values.forEach((v, i) => {
            if (v == null) {
              pen = false;
              return;
            }
            d += `${pen ? 'L' : 'M'}${px(i)},${py(v)} `;
            pen = true;
          });
          g += `<path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
          s.values.forEach((v, i) => {
            if (v == null) return;
            g += `<circle cx="${px(i)}" cy="${py(v)}" r="5" fill="${col}" stroke="#fff" stroke-width="2"/>`;
            g += `<circle cx="${px(i)}" cy="${py(v)}" r="14" fill="transparent" data-tt="${esc(`${s.name}, ${cats[i]}: ${valueFmt(v)}`)}"/>`;
          });
          const li = s.values
            .map((v, i) => (v == null ? -1 : i))
            .filter((i) => i >= 0)
            .pop();
          if (li != null)
            endLabels.push({
              y: py(s.values[li]),
              x: px(li),
              t: narrow ? valueFmt(s.values[li]) : `${s.name} ${valueFmt(s.values[li])}`,
              col,
            });
        });
        endLabels.sort((a, b) => a.y - b.y);
        for (let i = 1; i < endLabels.length; i++)
          if (endLabels[i].y - endLabels[i - 1].y < 15) endLabels[i].y = endLabels[i - 1].y + 15;
        endLabels.forEach(
          (e) => (g += `<text x="${e.x + 10}" y="${e.y + 4}" class="val">${xmlEsc(e.t)}</text>`),
        );
        g += `<text x="${L + pw / 2}" y="${H - 8}" text-anchor="middle" class="axt">${xmlEsc(xLabel)}</text>`;
        g += `<text transform="translate(14 ${T + ph / 2}) rotate(-90)" text-anchor="middle" class="axt">${xmlEsc(yLabel)}</text>`;
        const svg = `<svg class="viz-svg" width="100%" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="${id}-t ${id}-d"><title id="${id}-t">${xmlEsc(title)}</title><desc id="${id}-d">${xmlEsc(desc || '')}</desc>${g}</svg>`;
        const legend = `<div class="viz-legend" aria-hidden="true">${series.map((s, i) => `<span><i style="background:${colors[i]}"></i>${xmlEsc(s.name)}</span>`).join('')}</div>`;
        const table = `<table class="table viz-table ${showTable ? '' : 'sr-only'}"><caption class="sr-only">${xmlEsc(title)}</caption><thead><tr><th scope="col">${xmlEsc(xLabel)}</th>${series.map((s) => `<th scope="col" class="num">${xmlEsc(s.name)}</th>`).join('')}</tr></thead><tbody>${cats.map((c, i) => `<tr><th scope="row" style="font-weight:500;text-align:left">${xmlEsc(c)}</th>${series.map((s) => `<td class="num">${s.values[i] == null ? supMark('p', { sw }) : valueFmt(s.values[i])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
        return `<figure class="viz" data-vid="${id}">${showTable ? '' : `${legend}<div class="viz-plot">${svg}</div>`}${table}</figure>`;
      }

      /* ---------- files: CSV and JSON exactly as the public API serves them ---------- */
      function tableCsv(rel, key) {
        const { T } = dataset(rel);
        const t = T[key];
        const cols =
          key === 'filing-by-commission'
            ? [
                'commission',
                'commissionCode',
                'cycle',
                'expected',
                'filed',
                'late',
                'nonFilers',
                'filingRate',
              ]
            : key === 'national-totals'
              ? ['measure', 'value']
              : Object.keys(t.rows.find((r) => !r._nr) || {}).filter(
                  (k) => !k.startsWith('_') && k !== 'short',
                );
        const q = (v) =>
          /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
        const lines = [[...cols, '_suppressed'].join(',')];
        t.rows.forEach((r) => {
          const sup = Object.keys(r._sup || {});
          lines.push(
            [
              ...cols.map((c) =>
                r._sup?.[c] || (r._nr && !['commission', 'commissionCode', 'cycle'].includes(c))
                  ? ''
                  : q(r[c] ?? ''),
              ),
              q(r._nr ? 'not-reported' : sup.join(' ')),
            ].join(','),
          );
        });
        return lines.join('\n');
      }

      function tableRows(rel, key, { cycle = 'all', only = null } = {}) {

      function dataTable(
        rel,

        {
          sw = false,
          cycle = 'all',

          sortAct = '',
          page = 1,
          pageSize = 15,
          pageAct = '',

      ) {
        const cols = COLS[key];
        let rows = given || tableRows(rel, key, { cycle, only });
        if (sort && sort.k) {
          const k = sort.k;
          const val = (r) => (r._nr || r._sup?.[k] ? null : r[k]);
          rows = [...rows].sort((a, b) => {
            const va = val(a);
            const vb = val(b);
            if (va == null && vb == null) return 0;
            if (va == null) return 1;
            if (vb == null) return -1;
            const c = typeof va === 'string' ? va.localeCompare(vb) : va - vb;
            return sort.dir === 'desc' ? -c : c;
          });
        }
        const paged = pageAct && rows.length > pageSize;
        const pg = paged ? Math.min(page, Math.ceil(rows.length / pageSize)) : 1;
        const view = paged ? rows.slice((pg - 1) * pageSize, pg * pageSize) : rows;
        const L = (c) => (sw ? c[2] : c[1]);
        const th = (c, extra = '') => {
          const numc = c[3] !== 'name' && c[3] !== 'cycle';
          const on = sort?.k === c[0];
          const lab = sortAct
            ? `<button class="th-sort ${on ? 'on' : ''}" data-act="${sortAct}" data-arg="${c[0]}" aria-label="${esc(L(c))}, sort">${esc(L(c))}${icon(on ? (sort.dir === 'desc' ? 'arrowDown' : 'arrowUp') : 'sort', 13)}</button>`
            : esc(L(c));
          return `<th scope="col" class="${numc ? 'num' : ''}" ${on ? `aria-sort="${sort.dir === 'desc' ? 'descending' : 'ascending'}"` : ''} ${extra}>${lab}</th>`;
        };
        const grouped = cols.some((c) => c[4]);
        let head;
        if (grouped) {
          let r1 = '';
          let r2 = '';
          for (let i = 0; i < cols.length; i++) {
            const c = cols[i];
            if (!c[4]) {
              r1 += th(c, 'rowspan="2"');
              continue;
            }
            let n = 0;
            while (cols[i + n] && cols[i + n][4] === c[4]) n++;
            r1 += `<th scope="colgroup" colspan="${n}" class="grp">${esc(sw ? GROUP_SW[c[4]] || c[4] : c[4])}</th>`;
            for (let k = 0; k < n; k++) r2 += th(cols[i + k]);

              .join('')}</tr>`;
          })

        const table = `<div class="table-wrap"><table class="table dtable ${grouped ? 'grouped' : ''}">${caption ? `<caption class="sr-only">${esc(caption)}</caption>` : ''}<thead>${head}</thead><tbody>${body}</tbody></table></div>`;
        const pager = paged
          ? Kit.pager({ page: pg, pageSize, total: rows.length, act: pageAct })
          : '';
        return table + pager;

        portalShell(body, { nav: PUB_NAV(), avatar: null, lang: false, active });
      const langSeg = () =>
        `<div class="seg" role="group" aria-label="Language"><button class="${!sw() ? 'on' : ''}" data-act="lang" data-arg="en" aria-pressed="${!sw()}" lang="en">English</button><button class="${sw() ? 'on' : ''}" data-act="lang" data-arg="sw" aria-pressed="${sw()}" lang="sw">Kiswahili</button></div>`;

      /* ---------- main page ---------- */
      function releaseBar(r) {
        const vs = versionsOf(S.relKey);
        const verSel =
          vs.length > 1
            ? `<div class="field rb-f"><label class="label" for="f-ver">${t('version')}</label>${select(
                'ver',
                vs.map((v) => ({
                  v: String(v.version),
                  l: `${t('version')} ${v.version}${v.status === 'withdrawn' ? ` (${sw() ? 'imeondolewa' : 'withdrawn'})` : ` (${t('current')})`}`,
                })),
                { ph: '', rerender: true, extra: `id="f-ver"` },
              )}</div>`
            : '';
        if (!S.ver) S.ver = String(r.version);
        return `<div class="card rbar"><div class="field rb-f rb-main"><label class="label" for="f-relKey">${t('release')}</label>${select(
          'relKey',
          keys().map((k) => ({ v: k, l: relLabel(k) })),
          { ph: '', rerender: true },
        )}</div>${verSel}<div class="rb-meta">${relBadge(r.status, { sw: sw() })}<span>${d8(r.publishedAt)}</span>${r.kind === 'snapshot' ? `<span class="dot-sep">·</span><span>${t('asAt')} ${d8(r.asAt)}</span>` : ''}</div><div class="rb-acts"><a class="btn btn-secondary btn-sm" href="${VERIFY}" target="_blank" rel="noopener">${icon('shield', 15)} ${t('verify')}</a><button class="btn btn-ghost btn-sm icon-btn" data-act="toDownloads" aria-label="${t('downloads')}" title="${t('downloads')}">${icon('download', 16)}</button></div></div>`;
      }
      function withdrawnBanner(r) {
        if (r.status !== 'withdrawn') return '';
        const next = versionsOf(S.relKey).find(
          (v) => v.version > r.version && v.status === 'published',
        );
        return `<div class="callout callout-danger wd-banner" role="alert">${icon('ban', 18)}<div><b>${t('withdrawnT', { d: d8(r.withdrawnAt) })}</b> ${t('reason')}: ${esc(r.withdrawnReason)}</div>${next ? `<button class="btn btn-secondary btn-sm" data-act="ver" data-arg="${next.version}">${t('seeCorrected', { v: next.version })}</button>` : ''}</div>`;
      }
      function tiles(NT) {
        return `<div class="tiles od-tiles"><div class="tile"><div class="k">${t('decRate')}</div><div class="v">${pctS(NT.filingRate)}</div><div class="s">${t('reporting', { a: NT.reporting, b: NT.commissions })}</div></div><div class="tile"><div class="k">${t('decMade')}</div><div class="v">${num(NT.filed)}</div><div class="s">${t('ofExpected', { n: num(NT.expected) })}</div></div><div class="tile"><div class="k">${t('compRate')}</div><div class="v">${pctS(NT.complianceRate)}</div><div class="s">${num(NT.dets)} ${sw() ? 'maamuzi' : 'determinations'}</div></div><div class="tile"><div class="k">${t('referrals')}</div><div class="v">${num(NT.referrals)}</div><div class="s">${num(NT.actions)} ${sw() ? 'hatua za kiutawala' : 'administrative actions'}</div></div></div>`;
      }
      const toggleBtn = (id) => {
        const on = !!S.vizTable[id];
        return `<button class="btn btn-ghost btn-sm" data-act="vizToggle" data-arg="${id}" aria-pressed="${on}">${icon(on ? 'chart' : 'table', 15)} ${on ? t('showChart') : t('showTable')}</button>`;
      };
      function commissionChart(r, NT) {
        const filing = S.metric === 'filing';
        const src = filing
          ? tableRows(r, 'filing-by-commission', { cycle: 'all' })
          : tableRows(r, 'compliance-by-commission');
        const k = filing ? 'filingRate' : 'complianceRate';
        let rows = src.map((x) => ({
          label: x.short,
          full: x.commission,
          value: x._nr || x._sup?.[k] ? null : x[k],
          marker: x._nr ? 'nr' : x._sup?.[k] || 'p',
        }));
        rows.sort((a, b) =>
          a.value == null
            ? 1
            : b.value == null
              ? -1
              : S.chartSort === 'desc'
                ? b.value - a.value
                : a.value - b.value,
        );
        const total = rows.length;
        const LIM = 8;
        if (!S.showAll) rows = rows.slice(0, LIM);
        const ref = filing ? NT.filingRate : NT.complianceRate;
        const title = `${filing ? t('decRate') : t('compRate')}, ${t('byComm').toLowerCase()}, ${FYL(r.fy)}`;
        const seg = `<div class="seg" role="group" aria-label="${sw() ? 'Kipimo' : 'Measure'}"><button class="${filing ? 'on' : ''}" data-act="metric" data-arg="filing" aria-pressed="${filing}">${t('decRate')}</button><button class="${!filing ? 'on' : ''}" data-act="metric" data-arg="compliance" aria-pressed="${!filing}">${t('compRate')}</button></div>`;
        const sortSel = `<button class="btn btn-ghost btn-sm" data-act="chartSort" aria-label="${S.chartSort === 'desc' ? t('sortedHigh') : t('sortedLow')}">${icon(S.chartSort === 'desc' ? 'arrowDown' : 'arrowUp', 15)} ${S.chartSort === 'desc' ? t('sortedHigh') : t('sortedLow')}</button>`;
        return `<section class="card"><div class="sec-h wrap-h"><h2 class="h3">${t('byComm')}</h2><span class="spacer"></span>${seg}</div><div class="sec-b"><div class="viz-head">${sortSel}<span class="spacer"></span>${toggleBtn('bc')}</div>${barChart({ id: 'bc', title, desc: sw() ? 'Tume zisizoripoti au zenye maafisa chini ya 10 zimeorodheshwa bila kuchorwa.' : 'Commissions that did not report or are based on fewer than 10 officers are listed but not plotted.', rows, xLabel: filing ? t('decAxis') : t('compAxis'), catLabel: t('commission'), ref, refLabel: t('national', { v: pctS(ref) }), showTable: !!S.vizTable.bc, sw: sw(), tableCols: [t('commission'), filing ? t('decRate') : t('compRate')] })}${total > LIM ? `<div class="viz-more"><button class="btn btn-secondary btn-sm" data-act="showAll">${S.showAll ? t('showFewer') : t('showAll', { n: total })}</button></div>` : ''}</div></section>`;
      }
      function trendChart(r) {
        const annual = RELS.filter(
          (x) => x.kind === 'annual' && x.status === 'published' && x.fy <= r.fy,
        ).sort((a, b) => a.fy - b.fy);
        const body =
          annual.length < 2
            ? `<div class="viz-empty">${icon('trend', 20)}<b>${t('trendEmptyT')}</b><span>${t('trendEmpty')}</span></div>`
            : lineChart({
                id: 'tr',
                title: `${t('trend')}: ${t('decRate').toLowerCase()}, ${t('compRate').toLowerCase()}`,
                desc: '',
                cats: annual.map((x) => FYS(x.fy)),
                series: [
                  { name: t('decRate'), values: annual.map((x) => dataset(x).NT.filingRate) },
                  { name: t('compRate'), values: annual.map((x) => dataset(x).NT.complianceRate) },
                ],
                yLabel: t('rateAxis'),
                xLabel: t('fy'),
                showTable: !!S.vizTable.tr,
                sw: sw(),
              });
        return `<section class="card"><div class="sec-h"><h2 class="h3">${t('trend')}</h2><span class="spacer"></span>${annual.length >= 2 ? toggleBtn('tr') : ''}</div><div class="sec-b">${body}</div></section>`;
      }
      function tablesCard(r) {
        const { T } = dataset(r);
        const tabs = `<div class="tabs od-tabs" role="tablist">${TABLES.map((tb) => `<button role="tab" aria-selected="${S.tab === tb.key}" class="${S.tab === tb.key ? 'on' : ''}" data-act="tab" data-arg="${tb.key}">${sw() ? tb.sw : tb.l}</button>`).join('')}</div>`;
        const cyc =
          S.tab === 'filing-by-commission'
            ? `<div class="seg" role="group" aria-label="${sw() ? 'Mzunguko' : 'Cycle'}">${['all', ...CYCLES.filter((c) => T['by-cycle'].rows.some((x) => x.cycle === c))].map((c) => `<button class="${S.cycle === c ? 'on' : ''}" data-act="cycle" data-arg="${c}" aria-pressed="${S.cycle === c}">${sw() ? CYCLE_SW[c] : CYCLE_L[c]}</button>`).join('')}</div>`
            : '';
        const tb = TABLES.find((x) => x.key === S.tab);
        return `<section class="card"><div class="sec-h"><h2 class="h3">${t('tables')}</h2></div>${tabs}<div class="tbar">${supLegend({ sw: sw() })}<span class="spacer"></span>${cyc}<button class="btn btn-secondary btn-sm" data-act="dlCsv" data-arg="${S.tab}" aria-label="${t('download')} CSV">${icon('download', 15)}<span class="lg-only">CSV</span></button></div>${dataTable(r, S.tab, { sw: sw(), cycle: S.cycle, sort: S.sort, sortAct: 'sortT', page: S.tpage, pageSize: 15, pageAct: 'tpage', caption: sw() ? tb.sw : tb.l })}</section>`;
      }
      function downloadsCard(r) {
        const { T } = dataset(r);
        const rj = releaseJson(r);
        return `<section class="card" id="downloads"><div class="sec-h"><h2 class="h3">${t('downloads')}</h2><span class="spacer"></span><button class="btn btn-secondary btn-sm" data-act="dlJson">${icon('download', 15)} ${t('jsonRelease')}</button></div><div class="dl-grid"><ul class="dl-list">${TABLES.map(
          (tb) => {
            const csv = tableCsv(r, tb.key);
            return `<li><span class="dl-ico">${icon('table', 16)}</span><div style="min-width:0;flex:1"><div class="truncate" style="font-weight:500">${sw() ? tb.sw : tb.l}</div><div class="sub"><span class="mono">${tb.key}.csv</span><span class="nowrap">${t('rows', { n: num(T[tb.key].count) })} · ${fileSize(csv)} ${Kit.tip(`SHA-256 ${T[tb.key].sha256Csv}`, { label: 'SHA-256' })}</span></div></div><button class="btn btn-ghost btn-sm" data-act="dlCsv" data-arg="${tb.key}" aria-label="${t('download')} ${tb.key}.csv">${icon('download', 15)}<span class="lg-only">CSV</span></button></li>`;
          },
        ).join(
          '',
        )}</ul><div class="verify-box"><div class="vb-top"><div class="qrw">${Kit.qr(r.manifestVerificationId, 76, 'QR code to verify this release')}</div><div style="min-width:0"><div class="small muted">${t('code')}</div><div class="mono vcode">${r.manifestVerificationId}</div></div></div><p class="small muted">${t('verifyHint')}</p><a class="btn btn-secondary btn-sm" href="${VERIFY}" target="_blank" rel="noopener">${icon('shield', 15)} ${t('verify')}</a></div></div><div class="dl-foot small muted"><span class="mono">release.json</span> · ${fileSize(rj)} · <a class="link" data-act="go" data-arg="about">${t('aboutLink')}</a></div></section>`;
      }
      function scrOpenData() {
        const head = `<div class="od-head"><h1 class="page-title">${t('title')}</h1><span class="spacer"></span>${langSeg()}</div>`;
        let body;
        if (S.view === 'loading')
          body = `<div class="card rbar" aria-busy="true"><span class="skeleton" style="width:260px;height:40px"></span><span class="skeleton" style="width:200px"></span></div><div class="tiles od-tiles">${Array.from({ length: 4 }, () => `<div class="tile"><span class="skeleton" style="width:60%"></span><span class="skeleton" style="width:40%;height:26px"></span></div>`).join('')}</div><div class="card card-pad" style="height:320px"><span class="skeleton" style="width:30%"></span></div>`;
        else if (S.view === 'error' || S.view === 'rate')
          body = `<div class="card"><div class="empty" style="padding:56px 20px" role="alert"><div class="art" style="grid-template-columns:30px"><span style="background:var(--danger-soft);color:var(--danger)">${icon(S.view === 'rate' ? 'clock' : 'wifiOff', 16)}</span></div><h4>${S.view === 'rate' ? t('rateT') : t('errT')}</h4><p>${S.view === 'rate' ? t('rate') : t('err')}</p><div style="margin-top:14px"><button class="btn btn-secondary" data-act="retry">${icon('refresh', 16)} ${t('retry')}</button></div></div></div>`;
        else if (S.view === 'empty')
          body = `<div class="card">${empty(t('noneT'), t('none'), { icon: 'chart' })}</div>`;
        else {
          const r = cur();
          const { NT } = dataset(r);
          body = `${withdrawnBanner(r)}${releaseBar(r)}${tiles(NT)}<div class="od-charts">${commissionChart(r, NT)}${trendChart(r)}</div>${tablesCard(r)}${downloadsCard(r)}`;
        }
        return shell(
          `<div class="page od-page" lang="${S.lang}">${head}<div class="stack-lg">${body}</div></div>`,
          t('nav_open'),
        );
      }

      /* ---------- About this data ---------- */
      const GLOSSARY = [
        [
          'Declaration rate',
          'Kiwango cha matamko',
          'Declarations made as a share of declarations expected.',
          'Matamko yaliyofanywa kama sehemu ya yaliyotarajiwa.',
        ],
        [
          'Compliance rate',
          'Kiwango cha utiifu',
          'Compliant determinations as a share of all compliance determinations.',
          'Maamuzi ya utiifu kama sehemu ya maamuzi yote.',
        ],
        [
          'Responsible Commission',
          'Tume Husika',
          'The body that receives and reviews declarations.',
          'Chombo kinachopokea na kukagua matamko.',
        ],
        [
          'Reporting entity',
          'Shirika la kuripoti',
          'The public body a declarant works for.',
          'Shirika la umma ambalo mtoa tamko hufanyia kazi.',
        ],
        [
          'Compliance determination',
          'Uamuzi wa utiifu',
          'The decision that a declaration is compliant, non-compliant or needs further action.',
          'Uamuzi kwamba tamko limetii, halijatii au linahitaji hatua zaidi.',
        ],
        [
          'Administrative action',
          'Hatua ya kiutawala',
          'A sanction for non-compliance, from notice to comply up to disciplinary proceedings.',
          'Adhabu ya kutotii, kuanzia notisi hadi hatua za kinidhamu.',
        ],
        [
          'Referral',
          'Rufaa',
          'A matter sent to EACC for investigation.',
          'Suala lililopelekwa EACC kwa uchunguzi.',
        ],
        [
          'Access request',
          'Ombi la kuona',
          'A request to see a declaration under Form K.',
          'Ombi la kuona tamko kupitia Fomu K.',
        ],
        [
          'Suppressed cell',
          'Kisanduku kilichofichwa',
          'A figure based on fewer than 10 officers. Shown as ‹10; empty in CSV.',
          'Takwimu inayotokana na maafisa chini ya 10. Huonyeshwa kama ‹10; tupu kwenye CSV.',
        ],
        [
          'Complementary suppression',
          'Kuficha kwa kinga',
          'A second figure hidden so the first cannot be worked out from a total.',
          'Takwimu ya pili iliyofichwa ili ya kwanza isipatikane kwa kutoa jumla.',
        ],
        [
          'Snapshot',
          'Muhtasari',
          'Figures published during the year, before the annual release.',
          'Takwimu zinazochapishwa katikati ya mwaka.',
        ],
        [
          'Version',
          'Toleo',
          'A corrected release gets the next version. Withdrawn versions stay online.',
          'Chapisho lililosahihishwa hupata toleo linalofuata.',
        ],
      ];
      function scrAbout() {
        const L = sw();
        const sec = (id, title, inner) =>
          `<section class="card" id="${id}"><div class="sec-h"><h2 class="h3">${title}</h2></div>${inner}</section>`;
        const glossary = `<dl class="gloss">${GLOSSARY.map((g) => `<div><dt>${g[0]} <span lang="sw">${g[1]}</span></dt><dd>${L ? g[3] : g[2]}</dd></div>`).join('')}</dl>`;
        const cols = `<div class="cols">${TABLES.map(
          (tb) =>
            `<details class="coldet"><summary><span class="mono">${tb.key}</span><span class="muted">${L ? tb.sw : tb.l}</span>${icon('down', 16)}</summary><div class="table-wrap"><table class="table dtable"><thead><tr><th>${L ? 'Safu' : 'Column'}</th><th>English</th><th lang="sw">Kiswahili</th></tr></thead><tbody>${(tb.key ===
            'filing-by-commission'
              ? [
                  ['commission', 'Commission', 'Tume'],
                  ['commissionCode', 'Commission code', 'Nambari ya Tume'],
                  ['cycle', 'Cycle', 'Mzunguko'],
                  ...COLS[tb.key].slice(1),
                ]
              : COLS[tb.key]
            )
              .concat([
                [
                  '_suppressed',
                  'Suppressed columns in this row',
                  'Safu zilizofichwa kwenye mstari huu',
                ],
              ])
              .map(
                (c) =>
                  `<tr><td class="mono">${c[0]}</td><td>${c[4] ? `${c[4]}: ${c[1].toLowerCase()}` : c[1]}</td><td lang="sw">${c[2]}</td></tr>`,
              )
              .join('')}</tbody></table></div></details>`,
        ).join('')}</div>`;
        const api = `<div class="sec-b stack"><div class="api">${[
          [
            'GET',
            '/releases',
            L
              ? 'Machapisho yote yaliyochapishwa na yaliyoondolewa'
              : 'Published and withdrawn releases',
          ],
          [
            'GET',
            '/releases/{fy}/{version}',

          ['GET', '/releases/{fy}/{version}/tables/{table}', 'JSON'],

          .map(
            (a) =>
              `<div class="api-row"><span class="meth">${a[0]}</span><code>${a[1]}</code><span class="small muted">${a[2]}</span></div>`,
          )
          .join(
            '',
          )}</div><div class="small muted">${L ? 'Hakuna kuingia. Majibu huhifadhiwa kwa saa moja. Maombi mengi mno hupata 429.' : 'No sign-in. Responses are cached for an hour. Too many requests get a 429.'}</div><pre class="code">curl ${API}/releases/2025/1/tables/filing-by-commission.csv</pre></div>`;
        const privacy = `<div class="sec-b stack">${supLegend({ sw: L })}<p class="small" style="color:var(--ink-2)">${L ? 'Takwimu ni za jumla tu, kwa Tume, aina ya shirika na mzunguko. Hakuna jina wala tamko la mtu binafsi.' : 'Figures are totals only, by Commission, reporting entity type and cycle. No names and no individual declarations.'}</p></div>`;
        return shell(
          `<div class="page od-page" style="max-width:880px" lang="${S.lang}"><div class="od-head"><div><a class="link small back" data-act="go" data-arg="open-data">${icon('left', 15)} ${t('back')}</a><h1 class="page-title" style="margin-top:6px">${t('about')}</h1></div><span class="spacer"></span>${langSeg()}</div><div class="stack-lg">${sec('privacy', L ? 'Faragha' : 'Privacy', privacy)}${sec('glossary', L ? 'Maana' : 'Definitions', glossary)}${sec('columns', L ? 'Majedwali na safu' : 'Tables and columns', cols)}${sec('api', 'API', api)}</div></div>`,
          t('nav_about'),

      }

      /* ---------- actions ---------- */
      const actions = {
        lang: (l) => {
          S.lang = l;
          document.documentElement.lang = l;
          Kit.render();
        },
        ver: (v) => {
          S.ver = String(v);
          S.tpage = 1;
          Kit.render();
        },
        metric: (m) => {
          S.metric = m;
          Kit.render();
        },
        chartSort: () => {
          S.chartSort = S.chartSort === 'desc' ? 'asc' : 'desc';
          Kit.render();
        },
        showAll: () => {
          S.showAll = !S.showAll;
          Kit.render();
        },
        vizToggle: (id) => {
          S.vizTable[id] = !S.vizTable[id];
          Kit.render();
        },
        tab: (k) => {
          S.tab = k;
          S.tpage = 1;
          S.sort = null;
          Kit.render();
        },
        cycle: (c) => {
          S.cycle = c;
          S.tpage = 1;
          Kit.render();
        },
        tpage: (p) => {
          S.tpage = +p;
          Kit.render();
        },
        sortT: (k) => {
          S.sort =
            S.sort?.k === k
              ? S.sort.dir === 'asc'
                ? { k, dir: 'desc' }
                : null
              : { k, dir: 'asc' };
          S.tpage = 1;
          Kit.render();
        },
        dlCsv: (key) => {
          const r = cur();
          downloadText(`${key}-fy${r.fy}-v${r.version}.csv`, tableCsv(r, key), 'text/csv');
          Kit.toast(`${key}.csv`);
        },
        dlJson: () => {
          const r = cur();
          downloadText(
            `release-fy${r.fy}-${r.kind}-v${r.version}.json`,
            releaseJson(r),
            'application/json',
          );
          Kit.toast('release.json');
        },
        toDownloads: () =>
          document
            .getElementById('downloads')
            ?.scrollIntoView({ behavior: 'smooth', block: 'start' }),
        retry: () => {
          S.view = 'loading';
          Kit.render();
          setTimeout(() => {
            S.view = 'ok';
            Kit.render();
          }, 800);
        },
      };
      const reset = () =>
        Object.assign(S, {
          lang: 'en',
          view: 'ok',
          relKey: '2025|annual',
          ver: '',
          metric: 'filing',
          chartSort: 'desc',
          showAll: false,
          vizTable: {},
          tab: 'filing-by-commission',
          cycle: 'all',
          tpage: 1,
          sort: null,
        });
      const J = (id, label, setup) => [
        id,
        label,
        () => {
          reset();
          setup();
        },
      ];
      Kit.mount({
        app: 'portal',
        start: 'open-data',
        home: 'open-data',
        screens: { 'open-data': scrOpenData, about: scrAbout },
        actions,
        afterRender: vizMeasure,
        onBind: (b) => {
          if (b === 'relKey') {
            S.ver = '';
            S.tpage = 1;
            S.showAll = false;
          }
          if (b === 'ver') S.tpage = 1;
        },
        jumps: [
          J('open-data', '#357 Open data: latest annual release', () => Kit.go('open-data')),
          J('j-compliance', '#357 Chart: compliance rate, all Commissions', () => {
            S.metric = 'compliance';
            S.showAll = true;
            Kit.go('open-data');
          }),
          J('j-low', '#357 Chart: lowest first', () => {
            S.chartSort = 'asc';
            Kit.go('open-data');
          }),
          J('j-tables', '#357 #356 Charts shown as tables', () => {
            S.vizTable = { bc: true, tr: true };
            Kit.go('open-data');
          }),
          J('j-final', '#357 Table: Final cycle, ‹10 markers, sorted', () => {
            S.cycle = 'final';
            Kit.go('open-data');
            setTimeout(
              () => document.querySelector('.od-tabs')?.scrollIntoView({ block: 'start' }),
              60,
            );
          }),
          J('j-access', '#357 Table: access requests, page 2', () => {
            S.tab = 'access-requests';
            S.tpage = 2;
            Kit.go('open-data');
            setTimeout(
              () => document.querySelector('.od-tabs')?.scrollIntoView({ block: 'start' }),
              60,
            );
          }),
          J('j-snapshot', '#357 Mid-year snapshot', () => {
            S.relKey = '2025|snapshot';
            Kit.go('open-data');
          }),
