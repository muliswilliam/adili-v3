    ${rows.map((r) => `<tr><td class="num tabular" data-l="Row">${num(r.row)}</td><td data-l="File number"><span class="mono" style="word-break:break-all">${esc(r.fileNo)}</span></td><td data-l="Field" class="err-list"><div>${r.errors.map(([f]) => `<div><code class="c">${f}</code></div>`).join('')}</div></td><td data-l="Reason" class="err-list"><div>${r.errors.map(([, m]) => `<div>${esc(m)}</div>`).join('')}</div></td></tr>`).join('')}
    </tbody></table></div>
    ${pages > 1 ? cursorPager({ page, pageSize: 50, act: 'repPage', label: 'rows', hasNext: page < pages }, rows.length) : ''}
  </div>`;
        return out;
      }

      /* ---------------- screen: import history (#43, #55) ---------------- */
      function historyScreen() {
        if (!(isCommissionRole() || isPA() || isEACC()))
          return shell(head('Import history') + denied('roster imports'), {
            crumbs: roCrumbs(['Import history']),
          });
        const ctx = isPA() || isEACC() ? nationalContext() : '';
        const actions = isRO() && S.hist.load === 'ok' ? importBtn() : '';
        let body;
        if (S.hist.load === 'loading')
          body = `<div class="card"><div class="table-wrap"><table class="table"><tbody>${Kit.skeletonRows(6, 6)}</tbody></table></div></div>`;
        else if (S.hist.load === 'empty')
          body = `<div class="card">${Kit.empty('No imports yet.', isRO() ? 'File and HR system imports appear here.' : 'Imports appear here once the roster is imported.', { icon: 'clock', action: isRO() ? importBtn() : '' })}</div>`;
        else {
          const HPAGE = 10;
          const hp = S.hist.page;
          const pageRows = S.imports.slice((hp - 1) * HPAGE, hp * HPAGE);
          body = `<div class="card"><div class="table-wrap"><table class="table cards"><caption class="sr-only">Imports, newest first</caption><thead><tr><th scope="col">Started</th><th scope="col">Channel</th><th scope="col">Complete?</th><th scope="col">State</th><th scope="col" class="num">Created</th><th scope="col" class="num">Updated</th><th scope="col" class="num">Rejected</th><th scope="col" class="num">Flagged</th><th scope="col">Started by</th></tr></thead><tbody>
      ${pageRows
        .map((i) => {
          const c = i.counts;
          const dash = '<span class="muted">-</span>';
          return `<tr class="click" tabindex="0" data-act="go" data-arg="import-report|${i.id}" aria-label="Open report for import of ${fmtDateTime(i.startedAt)}"><td class="primary"><div style="font-weight:500">${fmtDateTime(i.startedAt)}</div><div class="sub truncate" style="max-width:240px">${esc(i.channel === 'api' ? `Batch of ${num(i.total)} rows` : i.fileName)}</div></td><td data-l="Channel">${channelBadge(i)}</td><td data-l="Complete?">${i.complete ? 'Yes' : 'Partial'}</td><td data-l="State">${impStateBadge(i)}${i.state === 'processing' && i.total ? `<div class="sub tabular">${pctOf(i.processed, i.total)}%</div>` : ''}</td><td class="num" data-l="Created">${c && i.state !== 'processing' ? num(c.created) : dash}</td><td class="num" data-l="Updated">${c && i.state !== 'processing' ? num(c.updated) : dash}</td><td class="num" data-l="Rejected">${c && i.state !== 'processing' ? (c.rejected ? `<span style="color:var(--danger);font-weight:600">${num(c.rejected)}</span>` : '0') : dash}</td><td class="num" data-l="Flagged">${c && i.state !== 'processing' ? (c.flaggedAbsent ? `<span style="color:var(--warn);font-weight:600">${num(c.flaggedAbsent)}</span>` : '0') : dash}</td><td data-l="Started by">${i.by.kind === 'client' ? `<div><div class="row" style="gap:6px;display:inline-flex"><span class="muted">${icon('server', 15)}</span><span>HR system</span></div><div class="sub mono">${esc(i.by.id)}</div></div>` : esc(i.by.id)}</td></tr>`;
        })
        .join('')}
    </tbody></table></div>${cursorPager({ page: hp, pageSize: HPAGE, act: 'histPage', label: 'imports', hasNext: hp * HPAGE < S.imports.length }, pageRows.length)}</div>`;
        }
        return shell(ctx + head('Import history', '', actions) + body, {
          crumbs: roCrumbs(['Import history']),
        });
      }

      /* ---------------- screen: import report (#43, #55) ---------------- */
      function reportScreen() {
        if (!(isCommissionRole() || isPA() || isEACC()))
          return shell(head('Import report') + denied('roster imports'), {
            crumbs: roCrumbs(['Imports', 'imports'], ['Report']),
          });
        const i = imp(S.params.id) || S.imports[0];
        const ctx = isPA() || isEACC() ? nationalContext() : '';
        const meta = `<div class="card card-pad"><div class="kv k3 k5">
    <div><div class="k">Started</div><div class="v">${fmtDateTime(i.startedAt)}</div></div>
    <div><div class="k">Completed</div><div class="v">${i.completedAt ? fmtDateTime(i.completedAt) : '<span class="none">Still running</span>'}</div></div>
    <div><div class="k">Started by</div><div class="v">${i.by.kind === 'client' ? `HR system <span class="mono muted">${esc(i.by.id)}</span>` : esc(i.by.id)}</div></div>
    <div><div class="k">Source</div><div class="v">${i.channel === 'api' ? 'API batch' : `${(i.format || '').toUpperCase()}, ${fileSize(i.size || 0)}`}</div></div>
    <div><div class="k">Rows</div><div class="v">${i.total != null ? num(i.total) : '<span class="none">Not read</span>'}</div></div>
  </div></div>`;
        let body = '';
        if (i.state === 'processing' || i.state === 'pending')
          body = `<div class="card card-pad" style="margin-top:20px">${progressBlock(i)}<div class="callout callout-info" style="margin-top:14px">${icon('info', 17)}<div>You can leave this page; the import continues.</div></div></div>`;
        if (i.state === 'failed')
          body =
            `<div style="margin-top:20px">${failAlert(i, false)}</div>` +
            (i.counts
              ? `<p class="small muted" style="margin:18px 0 10px">Counts up to the stop.</p>`
              : '');
        if (i.state !== 'processing' && i.state !== 'pending')
          body += `<div style="margin-top:${i.state === 'failed' ? 0 : 20}px">${reportBody(i)}</div>`;
        return shell(
          ctx +
            `<div class="page-head"><div style="min-width:0"><h1 class="truncate">${esc(impTitle(i))}</h1><div class="row wrap" style="gap:8px;margin-top:8px">${channelBadge(i)}${i.complete ? badge('Complete roster') : badge('Partial update')}${impStateBadge(i)}</div></div>${isRO() && i.state === 'failed' ? `<div class="actions-r">${importBtn('Import a corrected file')}</div>` : ''}</div>` +
            meta +
            body,
          { crumbs: roCrumbs(['Imports', 'imports'], [fmtDate(i.startedAt)]) },
        );
      }

      /* ---------------- screen: records (#46, #75) ---------------- */
      function filterRecords() {
        const f = S.rec;
        const q = f.q.trim().toLowerCase();
        return S.records.filter((r) => {
          if (f.state && r.state !== f.state) return false;
          if (f.flagged && !r.flagged) return false;
          if (f.mismatch && !r.mismatchAt) return false;
          if (!q) return true;
          const digits = q.replace(/\s/g, '');
          if (/^\d{5,10}$/.test(digits) && r.nid === digits) return true;
          return r.fileNo.toLowerCase().startsWith(q) || r.name.toLowerCase().includes(q);
        });
      }
      const recordsGate = (title, crumbs) => {
        if (isEACC())
          return shell(nationalContext() + head(title) + denied('roster records'), { crumbs });
        if (!(isCommissionRole() || isPA()))
          return shell(head(title) + denied('roster records'), { crumbs });
        return null;
      };
      function recordsScreen() {
        const g = recordsGate('Roster records', roCrumbs(['Records']));
        if (g) return g;
        const f = S.rec;
        const ctx = isPA() ? nationalContext() : '';
        const anyFilter = f.q || f.state || f.flagged || f.mismatch;
        const toolbar = `<div class="toolbar" role="search">
    <div class="input-group"><span class="addon">${icon('search', 16)}</span><input id="rec-q" class="input" type="search" data-bind="rec.q" data-live value="${esc(f.q)}" placeholder="File number, name, or a full national ID" aria-label="Search the roster" /></div>
    <label class="sr-only" for="f-rec-state">State</label>${select(
      'rec.state',
      [
        { v: '', l: 'All states' },
        { v: 'not_onboarded', l: 'Not onboarded' },
        { v: 'onboarded', l: 'Onboarded' },
        { v: 'exited', l: 'Exited' },
      ],
      { ph: '', rerender: true },
    )}
    <button class="chip ${f.flagged ? 'on' : ''}" data-act="toggleRec" data-arg="flagged" aria-pressed="${f.flagged}">${icon('flag', 14)} Flagged only <span class="n">${flaggedRecs().length}</span></button>
    <button class="chip ${f.mismatch ? 'on' : ''}" data-act="toggleRec" data-arg="mismatch" aria-pressed="${f.mismatch}">${icon('userX', 14)} Identity check failed <span class="n">${mismatchCount()}</span></button>
    ${anyFilter ? `<button class="btn btn-ghost btn-sm" data-act="clearRec">Clear</button>` : ''}
  </div>`;
        let content;
        if (f.load === 'loading')
          content = `<div class="table-wrap"><table class="table"><tbody>${Kit.skeletonRows(8, 7)}</tbody></table></div>`;
        else if (f.load === 'error')
          content = `<div class="card-pad"><div class="callout callout-danger" role="alert">${icon('alert', 18)}<div><b>Roster records could not be loaded.</b><div>Check your connection and try again.</div><button class="btn btn-secondary btn-sm" data-act="recRetry">${icon('refresh', 15)} Retry</button></div></div></div>`;
        else if (f.load === 'empty' || !S.records.length)
          content = Kit.empty(
            'No roster records',
            'Import your roster to see the officers on it here.',
            { icon: 'users', action: isRO() ? importBtn() : '' },
          );
        else {
          const list = filterRecords();
          if (!list.length)
            content = Kit.empty(
              'No matches',
              /^\d{1,4}$/.test(f.q.trim()) ||
                (/^\d+$/.test(f.q.trim()) && !S.records.some((r) => r.nid === f.q.trim()))
                ? 'National IDs only match in full.'
                : 'Try another search or clear the filters.',
              {
                icon: 'search',
                action: `<button class="btn btn-secondary btn-sm" data-act="clearRec">Clear filters</button>`,
              },
            );
          else {
            const RPAGE = 25;
            const shown = list.slice((f.page - 1) * RPAGE, f.page * RPAGE);
            content = `<div class="table-wrap"><table class="table cards"><caption class="sr-only">Roster records ordered by name</caption><thead><tr><th scope="col">File number</th><th scope="col">Full name</th><th scope="col">National ID</th><th scope="col">Designation</th><th scope="col">Job group</th><th scope="col">Reporting entity</th><th scope="col">State</th></tr></thead><tbody>
        ${shown.map((r) => `<tr class="click" tabindex="0" data-act="go" data-arg="record|${r.id}" aria-label="Open ${esc(r.name)}"><td data-l="File number"><span class="mono">${esc(r.fileNo)}</span></td><td class="primary" style="font-weight:500">${esc(r.name)}</td><td data-l="National ID"><span class="mono" aria-hidden="true">${maskId(r.nid)}</span><span class="sr-only">masked, ends in ${r.nid.slice(-3).split('').join(' ')}</span></td><td data-l="Designation" class="hide-card">${esc(r.desig)}</td><td data-l="Job group">${esc(r.jg)}</td><td data-l="Reporting entity" class="hide-card"><span class="truncate" style="display:inline-block;max-width:220px;vertical-align:bottom">${esc(r.entity)}</span></td><td data-l="State"><div class="row wrap" style="gap:6px;justify-content:inherit">${stateBadge(r.state)}${r.flagged ? flagBadge() : ''}${r.mismatchAt ? mismatchBadge() : ''}</div></td></tr>`).join('')}
      </tbody></table></div>
      ${cursorPager({ page: f.page, pageSize: RPAGE, act: 'recPage', label: 'records', hasNext: f.page * RPAGE < list.length }, shown.length)}`;
          }
        }
        return shell(
          ctx +
            head(
              'Roster records',
              `${num(S.roster.expected)} expected declarants${isCA() ? ' · read-only' : ''}`,
              isRO() ? importBtn() : '',
            ) +
            `<div class="card">${toolbar}${content}</div>`,
          { crumbs: roCrumbs(['Records']) },
        );
      }

      /* ---------------- screen: record detail (#46, #49, #75) ---------------- */
      function recordScreen() {
        const r = S.records.find((x) => x.id === S.params.id);
        const g = recordsGate(
          r ? r.name : 'Roster record',
          roCrumbs(['Records', 'records'], ['Record']),
        );
        if (g) return g;
        if (!r)
          return shell(
            head('Roster record') +
              `<div class="card">${Kit.empty('Record not found', 'It may belong to another Commission, or the link is wrong.', { icon: 'search', action: '<button class="btn btn-secondary btn-sm" data-act="go" data-arg="records">Back to records</button>' })}</div>`,
            { crumbs: roCrumbs(['Records', 'records'], ['Not found']) },
          );
        const ctx = isPA() ? nationalContext() : '';
        const locked = r.state === 'onboarded';
        const lock = locked
          ? `<span class="lockchip" title="Locked because the officer has onboarded">${icon('lock', 12, 2)} Locked</span>`
          : '';
        const none = (t = 'Not provided') => `<span class="none">${t}</span>`;
        const impLink = (id) => {
          const i = imp(id);
          return i
            ? `<a class="link" data-act="go" data-arg="import-report|${i.id}">${fmtDate(i.startedAt)}</a> <span class="muted small">${i.channel === 'api' ? 'API' : 'file'}</span>`
            : none('-');
        };
        const verified = (src) =>
          src === 'declarant'
            ? ` ${badge(`${icon('check', 12, 2.4)} Added by officer`, 'ok')}`
            : '';
        const actions =
          isRO() && r.state !== 'exited'
            ? `${r.flagged ? `<button class="btn btn-secondary" data-act="keepOne" data-arg="${r.id}">${icon('userCheck', 17)} Mark as still employed</button>` : ''}<button class="btn btn-secondary" data-act="openExitOne" data-arg="${r.id}">${icon('logout', 17)} Confirm exit</button>`
            : '';
        const callouts = [
          r.mismatchAt
            ? `<div class="callout callout-danger" role="status">${icon('userX', 18)}<div><b>Identity check failed on ${fmtDateTime(r.mismatchAt)}.</b><div>Name or national ID does not match the national register. Correct it in your next import.</div></div></div>`
            : '',
          r.flagged
            ? `<div class="callout callout-warn" role="status">${icon('flag', 18)}<div><b>Not in the complete import of ${fmtDate(imp(r.flaggedBy).startedAt)}.</b>${isRO() ? '' : '<div>The reporting officer decides whether they have left.</div>'}</div></div>`
            : '',
          r.state === 'exited'
            ? `<div class="callout callout-info" role="status">${icon('logout', 18)}<div><b>Exited on ${fmtDate(r.exitDate)}.</b>${r.exitBy ? ` Confirmed by ${esc(r.exitBy)}.` : ''}</div></div>`
            : '',
          r.kept
            ? `<div class="callout callout-ok" role="status">${icon('userCheck', 18)}<div>Marked as still employed by ${esc(r.kept.by)} on ${fmtDate(r.kept.at)}.</div></div>`
            : '',
        ].join('');
        const details = `<div class="card"><div class="sec-b"><div class="kv">
    <div><div class="k">Personnel file number</div><div class="v mono">${esc(r.fileNo)}</div></div>
    <div><div class="k">Full name</div><div class="v">${esc(r.name)}${lock}</div></div>
    <div><div class="k">National ID</div><div class="v"><span class="mono">${esc(r.nid)}</span>${lock}</div></div>
    <div><div class="k">Designation</div><div class="v">${esc(r.desig)}</div></div>
    <div><div class="k">Job group</div><div class="v">${esc(r.jg)}</div></div>
    <div><div class="k">Reporting entity</div><div class="v">${esc(r.entity)}</div></div>
    <div><div class="k">Appointment date</div><div class="v">${fmtDate(r.appt)}</div></div>
    <div><div class="k">Email</div><div class="v">${r.email ? esc(r.email) + verified(r.emailSrc) : none()}</div></div>
    <div><div class="k">Phone</div><div class="v">${r.phone ? `<span class="mono">${esc(fmtPhone(r.phone))}</span>` + verified(r.phoneSrc) : none()}</div></div>
  </div></div><div class="card-foot"><span class="small muted">${icon('info', 14)} To change these details, correct them in the next import. Identity fields are locked once the officer has onboarded.</span></div></div>`;
        const status = `<div class="card"><div class="sec-h"><h3>Status</h3></div><div class="sec-b"><dl class="dl" style="margin:0">
    <div><dt>State</dt><dd>${stateBadge(r.state)}</dd></div>
    <div><dt>Absent from latest import</dt><dd>${r.flagged ? flagBadge() : 'No'}</dd></div>
    ${r.state === 'onboarded' ? `<div><dt>Officer reference</dt><dd><span class="row" style="gap:4px;justify-content:flex-end"><span class="ref" style="font-size:14px">${r.ofr}</span><button class="btn btn-ghost icon-btn" style="width:30px;height:30px" data-act="copyOfr" data-arg="${r.ofr}" aria-label="Copy officer reference">${icon('copy', 15)}</button></span></dd></div><div><dt>Onboarded on</dt><dd>${fmtDateTime(r.onboardedAt)}</dd></div>` : ''}
    ${r.mismatchAt ? `<div><dt>Identity check</dt><dd>${mismatchBadge()}</dd></div>` : ''}
    <div><dt>Exit date</dt><dd>${r.exitDate ? fmtDate(r.exitDate) : '<span class="muted" style="font-weight:400">-</span>'}</dd></div>
    <div><dt>Source of last change</dt><dd>${r.source === 'api' ? 'HR system (API)' : 'File import'}</dd></div>
    <div><dt>First seen</dt><dd>${impLink(r.firstSeen)}</dd></div>
    <div><dt>Last seen</dt><dd>${impLink(r.lastSeen)}</dd></div>
    <div><dt>Last updated</dt><dd>${fmtDateTime(r.updatedAt)}</dd></div>
  </dl></div></div>`;
        const outcomeBadge = (o) =>
          ({
            created: badge('Created', 'ok'),
            updated: badge('Updated', 'info'),
            unchanged: badge('Unchanged'),
          })[o];
        const history = `<div class="card"><div class="sec-h"><h3>Import history</h3></div><div class="sec-b"><ol class="timeline">${r.history
          .map((h) => {
            const i = imp(h.imp);
            return `<li><span class="tl-ico">${icon(i.channel === 'api' ? 'plug' : 'file', 14)}</span><div><div class="tl-t row wrap" style="gap:8px"><a class="link" data-act="go" data-arg="import-report|${i.id}">${esc(i.channel === 'api' ? 'HR system batch' : i.fileName)}</a>${outcomeBadge(h.outcome)}</div><div class="tl-s">${fmtDateTime(i.startedAt)} · ${esc(byLabel(i))}</div></div></li>`;
          })
          .join('')}</ol></div></div>`;
        const hsub = `<div class="row wrap" style="gap:8px;margin-top:8px"><span class="mono muted">${esc(r.fileNo)}</span>${stateBadge(r.state)}${r.flagged ? flagBadge() : ''}${r.mismatchAt ? mismatchBadge() : ''}</div>`;
        return shell(
          ctx +
            `<div class="page-head"><div style="min-width:0"><h1>${esc(r.name)}</h1>${hsub}</div>${actions ? `<div class="actions-r">${actions}</div>` : ''}</div>` +
            (callouts ? `<div class="stack" style="margin-bottom:20px">${callouts}</div>` : '') +
            `<div class="split"><div class="stack-lg">${details}${history}</div><div class="sticky-side">${status}</div></div>`,
          { crumbs: roCrumbs(['Records', 'records'], [r.name]) },
        );
      }

      /* ---------------- screen: flagged (#49) ---------------- */
      const FPAGE = 10;
      function flaggedScreen() {
        const g = recordsGate('Flagged officers', roCrumbs(['Flagged officers']));
        if (g) return g;
        const ctx = isPA() ? nationalContext() : '';
        const list = flaggedRecs();
        if (!list.length)
          return shell(
            ctx +
              head('Flagged officers') +
              `<div class="card">${Kit.empty('Nobody is flagged.', 'Officers missing from a complete import appear here.', { icon: 'userCheck', action: `<button class="btn btn-secondary btn-sm" data-act="go" data-arg="overview">Roster overview</button>` })}</div>`,
            { crumbs: roCrumbs(['Flagged officers']) },
          );
        const lc = lastComplete();
        const sub = `These officers were on the roster but not in the latest complete import (${fmtDate(lc.startedAt)}). Confirm who has left, or mark who is still employed.`;
        const pages = Math.ceil(list.length / FPAGE);
        const page = Math.min(Math.max(1, S.flag.page), pages);
        const rows = list.slice((page - 1) * FPAGE, page * FPAGE);
        const sel = S.flag.sel;
        const canAct = isRO();
        const allOn = rows.every((r) => sel.includes(r.id));
        const someOn = rows.some((r) => sel.includes(r.id));
        const bulk =
          canAct && sel.length
            ? `<div class="bulkbar" role="region" aria-label="Bulk actions"><b style="font-weight:600">${plural(sel.length, 'officer', 'officers')} selected</b><span class="spacer"></span><button class="btn btn-light btn-sm" data-act="openExits">${icon('logout', 15)} Confirm exits</button><button class="btn btn-secondary btn-sm" data-act="keepSel">${icon('userCheck', 15)} Still employed</button><button class="btn btn-ghost btn-sm" data-act="clearSel">Clear</button></div>`

      }

      <div class="callout callout-warn" role="alert">${icon('alert', 18)}<div><b>Copy the secret now. It will not be shown again.</b><div>Share it with your IT team securely.</div></div></div>
      ${copyRow('Client ID', a.clientId)}

    </div><div class="wiz-foot"><span class="spacer"></span><button class="btn btn-primary" data-act="doneSecret">Done</button></div></div>`;
        } else if (a.state === 'active') {
          body = `<div class="split"><div class="card"><div class="sec-h"><h3>HR system credentials</h3><span class="spacer"></span>${badge(`${icon('dot', 10)} Active`, 'ok')}</div><div class="sec-b"><dl class="dl" style="margin:0">
        <div><dt>Client ID</dt><dd><span class="row" style="gap:4px;justify-content:flex-end"><span class="mono">${esc(a.clientId)}</span><button class="btn btn-ghost icon-btn" style="width:30px;height:30px" data-act="copyVal" data-arg="Client ID|${a.clientId}" aria-label="Copy client ID">${icon('copy', 15)}</button></span></dd></div>

        <div><dt>Scope</dt><dd><code class="c">roster:write</code></dd></div>
      </dl></div>
      ${isRO() ? `<div class="card-foot"><button class="btn btn-secondary" data-act="modal" data-arg="rotate">${icon('refresh', 16)} Rotate secret</button><button class="btn btn-danger-ghost" data-act="modal" data-arg="revoke">${icon('ban', 16)} Revoke access</button></div>` : `<div class="card-foot"><span class="small muted">${icon('lock', 14)} Only the reporting officer can change credentials.</span></div>`}
      </div>
      <div class="sticky-side stack"><div class="card card-pad stack" style="gap:10px"><p class="small" style="color:var(--ink-2)">Your HR system sends batches of up to 1,000 rows. Each batch appears in the import history.</p><div><button class="btn btn-secondary btn-sm" data-act="go" data-arg="imports">${icon('clock', 15)} Import history</button></div></div>
      ${a.lastUsedAt ? '' : `<div class="callout callout-info">${icon('info', 17)}<div>Not used yet.</div></div>`}</div></div>`;
        } else if (a.state === 'revoked') {

            const on = (e) => {
              e.preventDefault();
              dz.classList.add('over');
            };
            const off = () => dz.classList.remove('over');
            dz.addEventListener('dragenter', on);
            dz.addEventListener('dragover', on);
            dz.addEventListener('dragleave', off);
            dz.addEventListener('drop', (e) => {
              e.preventDefault();
              off();
              const f = e.dataTransfer.files[0];

            });
