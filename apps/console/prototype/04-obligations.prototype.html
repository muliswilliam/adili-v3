      /* ================= helpers ================= */
      const D = (s) => new Date(s && s.length === 10 ? s + 'T00:00:00' : s);
      const fd = (s) => (s ? fmtDate(D(s)) : '-');
      const fdt = (s) => (s ? fmtDateTime(D(s)) : '-');
      const mid = (d) => {
        const x = new Date(d);
        x.setHours(0, 0, 0, 0);
        return x;
      };
      const calDays = (a, b) => Math.round((mid(D(b)) - mid(a)) / 86400000);
      const addDays = (s, n) => {
        const x = D(s);
        x.setDate(x.getDate() + n);
        return iso(x);
      };
      const iso = (x) =>
        `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
      const TODAY = Kit.TODAY;
      const TODAY_ISO = iso(TODAY);
      const nowIso = () =>
        `${iso(TODAY)}T${String(TODAY.getHours()).padStart(2, '0')}:${String(TODAY.getMinutes()).padStart(2, '0')}:00`;
      const P = () => Kit.persona();
      const COMMISSION_ROLES = ['reporting-officer', 'commission-admin', 'reviewer', 'supervisor'];
      const isAdmin = () => P() === 'platform-admin';
      const isEacc = () => P() === 'eacc-analyst' || P() === 'eacc-supervisor';
      const plural = (n, one, many) => `${num(n)} ${n === 1 ? one : many || one + 's'}`;
      function uuid() {
        return 'xxxxxxxx-xxxx-7xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
          const r = (Math.random() * 16) | 0;
          return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
        });
      }
      const spinner = (dark) =>
        `<span class="spinner ${dark ? 'dark' : ''}" aria-hidden="true"></span>`;
      const errLine = (id, msg) =>
        `<div class="ferr" id="${id}" role="alert">${icon('alert', 14, 2.2)}<span>${msg}</span></div>`;
      function alertBox(
        kind,
        title,
        text = '',
        acts = '',
        { role = kind === 'danger' ? 'alert' : 'status' } = {},
      ) {
        const ic =
          { danger: 'alert', warn: 'alert', info: 'info', neutral: 'lock' }[kind] || 'info';
        return `<div class="alert alert-${kind}" role="${role}">${icon(ic, 18)}<div style="min-width:0;flex:1"><b>${title}</b>${text ? `<div>${text}</div>` : ''}${acts ? `<div class="acts">${acts}</div>` : ''}</div></div>`;

        'skipped-not-onboarded': ['Skipped: not yet onboarded', 'skip', 'minus'],
        'skipped-no-contact': ['Skipped: no contact details', 'skip', 'minus'],

      /* DateText: absolute date plus a relative phrase that is safe across month and year boundaries (calendar days). */
      function relPhrase(o) {
        if (o.status === 'upcoming') return `Opens ${fd(o.statementDate)}`;
        const n = calDays(TODAY, o.dueDate);
        if (o.status === 'overdue') {
          const m = -n;
          return `${m} day${m === 1 ? '' : 's'} overdue`;
        }
        return n === 0 ? 'Due today' : `Due in ${n} day${n === 1 ? '' : 's'}`;
      }

      function buildOb(seed, i, policy) {
        const [name, file, type, date, ofr, created, special = {}] = seed;
        const due = addDays(
          date,
          type === 'initial' ? policy.initialDueAfterAppointmentDays : policy.finalDueAfterExitDays,
        );
        const status = calDays(TODAY, due) < 0 ? 'overdue' : 'due';
        return finish({
          id: 'ob-' + i,
          type,
          cycleKey: `${type}:${date}`,
          statementDate: date,
          dueDate: due,
          status,
          createdAt: created,
          officer: { personnelFileNumber: file, fullName: name, onboarded: !!ofr, ofr },
          special,
          policyVersion: 1,
        });
      }
      function buildBiennial(seed, i) {
        const [name, file, ofr] = seed;
        return finish({
          id: 'ob-b' + i,
          type: 'biennial',
          cycleKey: 'biennial:2027',
          statementDate: '2027-11-01',
          dueDate: '2027-12-31',
          status: 'upcoming',
          createdAt: '2027-07-04',
          officer: { personnelFileNumber: file, fullName: name, onboarded: !!ofr, ofr },
          special: {},
          policyVersion: 1,
        });
      }
      function finish(o) {
        o.reminders = [30, 14, 7].map((off, k) => {
          const sched = addDays(o.dueDate, -off);
          const r = {
            offsetDays: off,
            scheduledAt: sched,
            sentAt: null,
            channels: [],
            outcome: 'scheduled',
          };
          if (calDays(D(o.createdAt), sched) < 0) r.outcome = 'skipped-past-due-at-creation';
          else if (calDays(TODAY, sched) > 0) r.outcome = 'scheduled';
          else if (!o.officer.onboarded) r.outcome = 'skipped-not-onboarded';
          else if (o.special[k]) r.outcome = o.special[k];
          else {
            r.outcome = 'sent';
            r.sentAt = sched + 'T' + ['08:41', '11:17', '15:02'][k] + ':00';
            r.channels = ['sms', 'email'];
          }
          return r;
        });
        o.remindersSent = o.reminders.filter((r) => r.outcome === 'sent').length;
        return o;
      }

      function allObligations() {
        if (tenantSlug() !== 'psc' || S.rosterNone) {
          if (!NATIONAL[tenantSlug()] || S.rosterNone) return [];

        const pol = policyOf('psc');
        const rows = SEEDS.map((s, i) => buildOb(s, i, pol));
        if (S.cycleOpened) BIENNIAL_SEEDS.forEach((s, i) => rows.push(buildBiennial(s, i)));

          return rows.slice(0, 5).map((r, i) => ({

      function summary() {

          if (S.cycleOpened) s.biennial.upcoming = NATIONAL.psc.biennial;
          return s;

        const n = NATIONAL[slug];
        const iDue = Math.round(n.due * 0.8),
          iOver = Math.round(n.overdue * 0.8);
        return {
          initial: { upcoming: 0, due: iDue, overdue: iOver },
          biennial: { upcoming: S.cycleOpened ? n.biennial : 0, due: 0, overdue: 0 },
          final: { upcoming: 0, due: n.due - iDue, overdue: n.overdue - iOver },
          notOnboarded: {
            due: Math.round(n.notOnboarded * 0.6),
            overdue: n.notOnboarded - Math.round(n.notOnboarded * 0.6),

        if (S.f.cycle) rows = rows.filter((o) => o.cycleKey === S.f.cycle);

        return rows.sort(

      /* ================= Obligations workspace ================= */

        const on = S.f.status === key;
        const clickable = ['upcoming', 'due', 'overdue'].includes(key);

          ? `<button class="otile ${on ? 'on' : ''}" data-act="tile" data-arg="${key}" aria-pressed="${on}" title="${esc(label)}: ${bd.map(([k, v]) => `${k} ${v}`).join(', ')}">${inner}</button>`

      }
      function tiles(s) {
        if (!s) return '';
        const byT = (k) => [
          ['Initial', s.initial[k]],

      'nob',

      /* ================= Policy (card + change dialog) ================= */

      function scrPolicy() {
        if (isEacc())
          return consoleShell(
            `<main class="cpage narrow"><div class="page-head"><div><h1>Policy</h1></div></div>${alertBox('neutral', 'You do not have access to Commission policies.')}</main>`,

        return consoleShell(

    <div class="wlayout">${policyCard(c.slug)}

      function mPolicy() {
        const f = S.pf;
        const c = tenant();
        const busy = f.state === 'submitting';
        const dis = busy ? 'disabled' : '';
        const v = policyOf(c.slug);
        const body = `${f.alert || ''}
    <div class="preview">${icon('calendar', 16)}<span>Current start date: <b style="color:var(--ink)">${fd(v.obligationsStartDate)}</b> (version ${v.version})</span></div>
    <div class="field"><label class="label" for="f-pf-date">Obligations start date</label><input id="f-pf-date" class="input" type="date" data-bind="pf.date" value="${esc(f.date)}" aria-describedby="f-pf-date-hint ${f.error ? 'f-pf-date-err' : ''}" ${f.error ? 'aria-invalid="true"' : ''} ${dis}/>${f.error ? errLine('f-pf-date-err', f.error) : ''}<div class="hint" id="f-pf-date-hint">Initial declarations are created only for appointments on or after this date. Earlier appointments are assumed to have declared outside Adili.</div></div>
    <div class="note">${icon('info', 15)}<span>Saves as version ${v.version + 1}, effective now.</span></div>`;
        const foot = `<button class="btn btn-ghost" data-act="closeModal" ${dis}>Cancel</button><button class="btn btn-primary" data-act="submitPolicy" ${dis} ${busy ? 'aria-busy="true"' : ''} style="min-width:220px">${busy ? spinner() + ' Saving…' : 'Save as new policy version'}</button>`;
        return dialog({
          title: 'Change obligations start date',
          icon: 'calendar',

      function submitPolicy(forceSim) {
        const f = S.pf;
        const c = tenant();
        const pv = S.policies[c.slug];
        const v = pv[pv.length - 1];
        f.alert = null;
        f.error = '';
        if (!f.date || !/^\d{4}-\d{2}-\d{2}$/.test(f.date)) f.error = 'Enter a valid date.';
        else if (f.date === v.obligationsStartDate)
          f.error = 'This is already the start date in force. Choose a different date.';
        if (f.error) {
          Kit.render();
          setTimeout(() => document.getElementById('f-pf-date')?.focus(), 0);
          return;
        }
        f.state = 'submitting';
        S.modal.busy = true;
        Kit.render();
        if (forceSim === 'hold') return;
        setTimeout(() => {
          if (S.pf !== f || !S.modal) return;
          f.state = 'editing';
          S.modal.busy = false;
          if (forceSim === 'error') {
            f.alert = alertBox(
              'danger',
              'The policy was not changed. Try again.',
              `Version ${v.version} is still in force.`,
            );
            Kit.render();
            return;
          }
          pv.push({
            ...v,
            id: 'pv-' + c.slug + '-' + (v.version + 1),
            version: v.version + 1,
            effectiveFrom: nowIso(),
            obligationsStartDate: f.date,
            createdBy: Kit.PERSONAS[P()].name,
            createdAt: nowIso(),
          });
          S.modal = null;
          Kit.render();
          Kit.toast(`Policy version ${v.version + 1} in force`, false);
        }, 900);

      /* ================= National summary ================= */
      function natRows() {
        if (S.nat.empty) return [];
        return COMMISSIONS.map((c) => {
          const n = NATIONAL[c.slug] || {
            upcoming: 0,
            due: 0,
            overdue: 0,
            notOnboarded: 0,
            biennial: 0,

          return {
            c,
            upcoming: S.cycleOpened ? n.biennial : 0,

      function scrNational() {
        const crumbs = [['National obligations', 'national']];
        if (!isAdmin() && !isEacc())
          return consoleShell(
            `<main class="cpage narrow"><div class="page-head"><div><h1>National obligations</h1></div></div>${alertBox('neutral', 'You do not have access to national obligations.', '', `<a class="btn btn-secondary btn-sm" href="04-obligations.prototype.html#obligations">Open your Commission’s obligations</a>`)}</main>`,

        const cols = [

          ['upcoming', 'Upcoming', true],
          ['due', 'Due', true],
          ['overdue', 'Overdue', true],
          [
            'notOnboarded',
            'Not onboarded',
            true,
            'Officers with a due or overdue declaration who have no Adili account yet',
          ],
          ['last', 'Last roster import', false],
        ];
        const sortBtn = ([k, l, n, tip]) => {
          const on = S.nat.sort === k;
          const ar = on ? (S.nat.dir === 'desc' ? 'arrowDown' : 'arrowUp') : 'sort';
          return `<th scope="col" class="${n ? 'num' : ''}" aria-sort="${on ? (S.nat.dir === 'desc' ? 'descending' : 'ascending') : 'none'}"><button class="th-btn ${on ? 'on' : ''}" data-act="natSort" data-arg="${k}">${l} ${icon(ar, 13)}</button>${tip ? ` ${Kit.tip(tip)}` : ''}</th>`;
        };
        let body;
        if (st === 'loading')
          body = `<div class="table-wrap"><table class="table" aria-busy="true"><caption class="vh">Obligations per Commission (loading)</caption><thead><tr>${cols.map(([, l]) => `<th scope="col">${l}</th>`).join('')}</tr></thead><tbody>${Kit.skeletonRows(6, 6)}</tbody></table></div>`;
        else if (st === 'error')
          body = `<div style="padding:20px">${alertBox('danger', 'National obligations could not be loaded', 'The declarations service did not respond.', `<button class="btn btn-secondary btn-sm" data-act="natRetry">${icon('refresh', 15)} Try again</button>`)}</div>`;
        else {
          const rows = natRows();
          if (!rows.length || rows.every((r) => !r.due && !r.overdue && !r.upcoming))
            body = Kit.empty(
              'No Commission has obligations yet.',
              'Counts appear as rosters are imported.',
              { icon: 'chart' },
            );
          else {
            const k = S.nat.sort;
            const dir = S.nat.dir === 'desc' ? -1 : 1;
            rows.sort((a, b) =>
              k === 'name'
                ? a.c.name.localeCompare(b.c.name) * dir
                : k === 'last'
                  ? ((a.lastRosterImportAt || '') > (b.lastRosterImportAt || '') ? 1 : -1) * dir
                  : (a[k] - b[k]) * dir || a.c.name.localeCompare(b.c.name),
            );
            const T = rows.reduce(
              (t, r) => ({
                upcoming: t.upcoming + r.upcoming,
                due: t.due + r.due,
                overdue: t.overdue + r.overdue,
                notOnboarded: t.notOnboarded + r.notOnboarded,
              }),
              { upcoming: 0, due: 0, overdue: 0, notOnboarded: 0 },
            );
            const size = Number(S.nat.pageSize) || 10;
            const page = Math.min(S.nat.page, Math.ceil(rows.length / size));
            const shown = rows.slice((page - 1) * size, page * size);
            const cell = (v) =>
              `<td class="num">${v ? num(v) : '<span class="zero">0</span>'}</td>`;
            body = `<div class="table-wrap"><table class="table rounded"><caption class="vh">Obligations per Commission, ${S.nat.cycle}</caption><thead><tr>${cols.map(sortBtn).join('')}</tr></thead>
        <tbody>${shown.map((r) => `<tr class="click" data-act="natOpen" data-arg="${r.c.slug}"><td><a class="rowlink" href="01-commissions.prototype.html?slug=${r.c.slug}#detail">${esc(r.c.name)}</a><div class="issuer">${r.c.issuerCode}</div></td>${cell(r.upcoming)}${cell(r.due)}<td class="num">${r.overdue ? `<span style="color:#7a4a00;font-weight:600">${num(r.overdue)}</span>` : '<span class="zero">0</span>'}</td>${cell(r.notOnboarded)}<td class="nowrap">${r.lastRosterImportAt ? `<span title="${esc(fdt(r.lastRosterImportAt))}">${fd(r.lastRosterImportAt)}</span>` : '<span class="muted">No roster yet</span>'}</td></tr>`).join('')}</tbody>
        <tfoot><tr><td>Total, ${plural(rows.length, 'Commission')}</td><td class="num">${num(T.upcoming)}</td><td class="num">${num(T.due)}</td><td class="num">${num(T.overdue)}</td><td class="num">${num(T.notOnboarded)}</td><td></td></tr></tfoot></table></div>${Kit.pager({ page, pageSize: size, total: rows.length, act: 'natPage', sizes: [10, 25, 50], sizeBind: 'nat.pageSize' })}`;
          }
        }
        return consoleShell(
          `<main class="cpage">
    <div class="page-head"><div><h1>National obligations</h1></div>
      <div class="actions-r"><label class="vh" for="f-nat-cycle">Cycle</label><select id="f-nat-cycle" class="select" style="height:38px;font-size:14px" data-bind="nat.cycle" data-rerender><option value="biennial:2027" selected>Biennial 2027 · due 31 Dec 2027</option></select></div></div>
    ${S.cycleOpened ? '' : `<div class="alert alert-info" role="status" style="margin-bottom:16px">${icon('info', 18)}<div>Biennial 2027 opens on 4 Jul 2027. Until then, counts cover initial and final declarations.</div></div>`}
    <div class="card" style="overflow:visible">${body}</div>
  </main>`,
          { crumbs },
        );

      /* ================= actions ================= */
      let searchT = null;
      const reload = () => {
        S.page = 1;
        syncUrl();
        fakeLoad((v) => (S.state = v), 450);
      };
      const actions = {
        tile: (k) => {

          reload();

        onb: (v) => {

          reload();

          S.f.onb = 'no';

          reload();
        },
        clearFilters: () => {
          S.f = { type: '', status: '', onb: '', cycle: '', search: '' };
          reload();

        page: (p) => {
          S.page = Number(p);
          fakeLoad((v) => (S.state = v), 350);

          syncUrl();
          Kit.render();
        },
        natOpen: (slug, el, e) => {
          if (e.target.closest('a')) return;
          location.href = `01-commissions.prototype.html?slug=${slug}#detail`;
        },
        natRetry: () => fakeLoad((v) => (S.nat.state = v)),
        leave404: () => {
          S.notFound = false;
          Kit.go('obligations');
        },
      };
      const soon = () => {
        clearTimeout(soon.t);
        soon.t = setTimeout(() => Kit.render(), 0);
      };
      function onBind(path) {
        if (path === 'f.search') {
          clearTimeout(searchT);
          searchT = setTimeout(reload, 300);
        }
        if (path === 'f.type' || path === 'f.status' || path === 'f.cycle') reload();
        if (path === 'slug') {
          S.f = { type: '', status: '', onb: '', cycle: '', search: '' };
          reload();
        }
        if (path === 'nat.pageSize') S.nat.page = 1;
        if (path === 'pf.date' && S.pf.error) {
          S.pf.error = '';
          soon();
        }
      }
      document.addEventListener('keydown', (e) => {

          clearTimeout(searchT);
          reload();
        }
      });

      /* focus into dialogs/drawers, trap, return */
      let prevModal = null;
      function afterRender() {
        const m = S.modal?.kind || null;
        if (m && m !== prevModal)
          setTimeout(() => {
            const el =
              document.querySelector('#layer .dialog input:not([disabled])') ||
              document.querySelector('#layer .drawer-head button, #layer .dialog-foot button');
            el?.focus();
          }, 30);
        if (!m && prevModal && S._ret) {
          const sel = S._ret;
          setTimeout(() => document.querySelector(sel)?.focus(), 0);
          S._ret = null;
        }
        prevModal = m;
        syncUrl();
      }
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Tab') return;
        const box = document.querySelector('#layer .dialog, #layer .drawer');
        if (!box) return;
        const els = [
          ...box.querySelectorAll(
            'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])',
          ),
        ].filter((x) => !x.disabled && x.offsetParent !== null);
        if (!els.length) return;
        const first = els[0],
          last = els[els.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        } else if (!box.contains(document.activeElement)) {
          e.preventDefault();
          first.focus();
        }
      });

      /* ================= jumps ================= */
