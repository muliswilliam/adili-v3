        if (!ed || S.notFound)
          return consoleShell(
            `<main class="cpage narrow"><div class="card">${Kit.empty('Article not found', 'It may have been removed, or it belongs to another Commission.', { icon: 'search', action: `<button class="btn btn-secondary btn-sm" data-act="go" data-arg="articles">Back to articles</button>` })}</div></main>`,
            { crumbs, active: 'Help articles' },
          );
        const d = ed.d;
        const orig = S.arts.find((a) => a.id === d.id);
        const ro = !canEdit();
        const e = ed.errors || {};
        const errList = ERR_ORDER.filter(([k]) => e[k]);
        const errSum =
          errList.length || ed.apiErr
            ? `<div class="callout callout-danger errsum" role="alert" tabindex="-1" id="errsum">${icon('alert', 18)}<div><b>${ed.apiErr ? esc(ed.apiErr.title) : `Fix ${errList.length === 1 ? 'this' : `these ${errList.length}`} before saving`}</b>${ed.apiErr?.detail ? `<div>${esc(ed.apiErr.detail)}</div>` : ''}${errList.length ? `<ul>${errList.map(([k, id]) => `<li><a data-act="focusField" data-arg="${id}">${esc(e[k])}</a></li>`).join('')}</ul>` : ''}</div></div>`
            : '';
        const meta = orig
          ? `<div class="head-meta">${statusBadge(orig)}<span>Version ${orig.version} · updated ${fmtDateTime(orig.updatedAt)} by ${esc(orig.updatedBy)}</span></div>`
          : `<div class="head-meta">${badge(`${icon('pencil', 12, 2.2)} Not saved`)}</div>`;
        const actions = ro
          ? badge(`${icon('eye', 12)} Read only`)
          : `<button class="btn btn-secondary" data-act="go" data-arg="articles" ${ed.saving ? 'disabled' : ''}>Cancel</button><button class="btn btn-primary" data-act="saveArticle" ${ed.saving ? 'disabled aria-busy="true"' : ''}>${ed.saving ? '<span class="spinner" style="width:14px;height:14px"></span> Saving…' : `${icon('save', 16)} Save`}</button>`;
        const head = `<div class="page-head"><div style="min-width:0"><h1>${d.id ? esc(orig?.title || d.title) : 'New article'}</h1>${meta}</div><div class="actions-r">${actions}</div></div>`;
        const lang = ed.lang;
        const bodyKey = lang === 'en' ? 'bodyEn' : 'bodySw';
        const bodyVal = d[bodyKey] || '';
        const bodyErr = lang === 'en' ? e.bodyEn : '';
        const seg = (bind, cur, opts, act) =>
          `<div class="seg sm" role="radiogroup" aria-label="${bind}">${opts.map(([k, l]) => `<button role="radio" aria-checked="${cur === k}" class="${cur === k ? 'on' : ''}" data-act="${act}" data-arg="${k}">${l}</button>`).join('')}</div>`;
        const titleF = ro
          ? ''
          : field(
              'Title',
              input('ed.d.title', {
                extra: `maxlength="220" ${e.title ? 'aria-invalid="true"' : ''}`,
              }),
              {
                id: 'f-ed-d-title',
                error: e.title,
              },
            );
        const bodyControl =
          ro || ed.mode === 'preview'
            ? `<div class="prose" ${ro ? '' : 'aria-live="polite"'}>${ro && lang === 'sw' && !d.bodySw ? '<p class="muted">No Kiswahili text. Kiswahili users see the English.</p>' : md(bodyVal)}</div>`
            : textarea(`ed.d.${bodyKey}`, {
                rows: 12,
                ph:
                  lang === 'en'
                    ? 'Write in plain English. Short paragraphs; start lines with "- " for a list.'
                    : 'Andika kwa Kiswahili rahisi.',
                extra: `${bodyErr ? 'aria-invalid="true" aria-describedby="f-body-hint"' : ''} aria-label="${lang === 'en' ? 'Body in English' : 'Body in Kiswahili'}"`,
              });
        const body = `<div class="ed-body"><div class="body-h"><span class="label"><span>${ro ? 'Text' : 'Body'}</span></span>${seg(
          'Language',
          lang,
          [
            ['en', 'English'],
            ['sw', 'Kiswahili'],
          ],
          'edLang',
        )}<div class="right">${
          ro
            ? ''
            : seg(
                'View',
                ed.mode,
                [
                  ['write', 'Write'],
                  ['preview', 'Preview'],
                ],
                'edMode',
              )
        }</div></div>${bodyControl}<div class="row" style="margin-top:6px;gap:10px">${bodyErr ? `<div class="hint" id="f-body-hint" role="alert" style="color:var(--danger);font-weight:500">${bodyErr}</div>` : lang === 'sw' && !ro ? '<div class="hint">Optional. Without it, Kiswahili users see the English.</div>' : ''}<span class="spacer"></span>${ro ? '' : `<span class="cc">${num(bodyVal.length)} / 20,000</span>`}</div></div>`;
        const main = `<div class="card card-pad stack">${titleF}${body}</div>`;
        const tagsSel = d.tags;
        const tagChips = (list) =>
          `<div class="tagset" role="group">${list
            .map(([k, l]) => {
              const on = tagsSel.includes(k);
              return ro
                ? on
                  ? `<span class="chip on" style="cursor:default">${esc(l)}</span>`
                  : ''
                : `<button class="chip ${on ? 'on' : ''}" data-act="toggleTag" data-arg="${k}" aria-pressed="${on}">${on ? icon('check', 13, 2.6) : ''}${esc(l)}</button>`;
            })
            .join('')}</div>`;
        const pub = ro
          ? `<div class="kv"><div><div class="k">Status</div><div class="v">${statusBadge(orig)}</div></div><div><div class="k">In effect</div><div class="v">${effLine(orig)}</div></div></div>`
          : `<label class="switch"><input type="checkbox" data-bind="ed.d.published" data-rerender ${d.published ? 'checked' : ''}/><span class="track" aria-hidden="true"></span><span><span class="t">${d.published ? 'Published' : 'Not published'}</span><div class="hint" style="margin-top:2px">${d.published ? (scope() === 'platform' ? 'Every declarant can find it.' : 'PSC declarants can find it.') : 'Only staff can see it.'}</div></span></label>
            <div class="dates">${field('In effect from', input('ed.d.effectiveFrom', { type: 'date', extra: e.effectiveFrom ? 'aria-invalid="true"' : '' }), { id: 'f-ed-d-effectiveFrom', error: e.effectiveFrom })}${field('Until', input('ed.d.effectiveTo', { type: 'date', extra: e.effectiveTo ? 'aria-invalid="true"' : '' }), { id: 'f-ed-d-effectiveTo', error: e.effectiveTo, opt: true })}</div>`;
        const side = `<div class="stack"><section class="card"><div class="sec-h"><h3>Publishing</h3></div><div class="sec-b stack">${pub}</div></section><section class="card"><div class="sec-h"><h3>Tags</h3>${ro ? '' : `<span class="badge">${tagsSel.length}</span>`}${Kit.tip('Search ranks this article higher for declarants on these sections and items.')}</div><div class="sec-b">${
          ro && !tagsSel.length
            ? '<span class="muted small">No tags</span>'
            : [
                ['Sections', SECTION_TAGS],
                ['Item types', ITEM_TAGS],
              ]
                .filter(([, l]) => !ro || l.some(([k]) => tagsSel.includes(k)))
                .map(([g, l]) => `<div class="tag-g">${g}</div>${tagChips(l)}`)
                .join('')
        }</div></section></div>`;
        return consoleShell(
          `<main class="cpage">${head}${errSum}<div class="ed-grid">${main}${side}</div></main>`,
          {
            crumbs,
            active: 'Help articles',
          },
        );
      }

      /* ============================== screen: legal corpus (platform-admin) ============================== */
      function filteredCorpus() {
        const q = S.cor.q.trim().toLowerCase();
        return S.corpus
          .filter((c) => S.cor.old || !c.superseded)
          .filter((c) => !S.cor.source || c.source === S.cor.source)
          .filter((c) => !q || `${c.citation} ${c.title} ${c.textEn}`.toLowerCase().includes(q));
      }
      function screenCorpus() {
        const crumbs = [
          ['Help articles', 'articles'],
          ['Legal corpus', 'corpus'],
        ];
        const g = gate('corpus');
        if (g) return stateScreen(g, crumbs);
        const cv = S.corpusVersion;
        const live = S.corpus.filter((c) => !c.superseded).length;
        const head = `<div class="page-head"><div style="min-width:0"><h1>Help articles</h1></div><div class="actions-r"><button class="btn btn-secondary" data-act="openSearch">${icon('search', 16)} Test help search</button><button class="btn btn-secondary" data-act="modal" data-arg="reimport" ${S.cor.importing ? 'disabled' : ''}>${S.cor.importing ? '<span class="spinner dark" style="width:14px;height:14px"></span> Importing…' : `${icon('refresh', 16)} Re-import`}</button></div></div>`;
        const metaRow = `<div class="toolbar" style="justify-content:space-between"><div class="ro-note">${icon('lock', 14)} Version <b style="color:var(--ink)">${esc(cv.v)}</b> · ${num(live)} passages in force · imported ${fmtDateTime(cv.at)}${Kit.tip('Statutory text is imported from the repository at deploy time. It cannot be edited here.')}</div></div>`;
        const opt = (v, l) =>
          `<option value="${v}" ${S.cor.source === v ? 'selected' : ''}>${l}</option>`;
        const toolbar = `<div class="toolbar" role="search"><div class="input-group"><span class="addon">${icon('search', 16)}</span><label class="sr-only" for="f-cor-q">Search passages</label><input id="f-cor-q" class="input" type="search" data-bind="cor.q" data-live value="${esc(S.cor.q)}" placeholder="Citation, title or text"/></div><label class="sr-only" for="f-cor-source">Source</label><select id="f-cor-source" class="select" data-bind="cor.source" data-rerender>${opt('', 'All sources')}${opt('act', 'Act')}${opt('regs', 'Regulations')}${opt('am', 'Administrative Mechanisms')}</select><label class="check" style="font-size:14px"><input type="checkbox" data-bind="cor.old" data-rerender ${S.cor.old ? 'checked' : ''}/><span class="box">${icon('check', 14, 3)}</span><span>Show superseded</span></label></div>`;
        let content;
        if (S.cor.load === 'loading')
          content = `<div class="table-wrap"><table class="table" aria-busy="true"><caption class="sr-only">Legal corpus (loading)</caption><thead><tr><th>Citation</th><th>Title</th><th>Languages</th><th>In effect</th><th>Version</th></tr></thead><tbody>${Kit.skeletonRows(6, 5)}</tbody></table></div>`;
        else if (S.cor.load === 'error') content = loadErr('The legal corpus', 'retryCorpus');
        else {
          const rows = filteredCorpus();
          if (!rows.length)
            content = Kit.empty(
              'No passages match',
              'Try a citation like "s.31" or clear the filters.',
              {
                icon: 'search',
                action: `<button class="btn btn-secondary btn-sm" data-act="clearCorpus">Clear filters</button>`,
              },
            );
          else {
            const pages = Math.ceil(rows.length / PAGE);
            const page = Math.min(S.cor.page, pages);
            const items = rows.slice((page - 1) * PAGE, page * PAGE);
            const eff = (c) =>
              c.effectiveTo
                ? `${fmtDate(c.effectiveFrom)} - ${fmtDate(c.effectiveTo)}`
                : `From ${fmtDate(c.effectiveFrom)}`;
            const lg = (c) =>
              `<span class="lang"><span>EN</span><span class="${c.textSw ? '' : 'off'}">SW</span></span>`;
            const tr = items
              .map(
                (c) =>
                  `<tr class="click" data-act="openPassage" data-arg="${c.id}"><td class="nowrap">${cite(c.citation)}</td><td style="min-width:240px;white-space:normal"><a class="rowlink" href="#corpus" data-act="openPassage" data-arg="${c.id}">${esc(c.title)}</a><div class="sub">${SOURCE_L[c.source]}</div></td><td>${lg(c)}</td><td class="nowrap">${eff(c)}${c.superseded ? `<div class="sub">${badge('Superseded')}</div>` : ''}</td><td class="num">${c.version}</td></tr>`,
              )
              .join('');
            const m = items
              .map(
                (c) =>
                  `<div class="mitem" data-act="openPassage" data-arg="${c.id}"><div class="top"><a class="rowlink" href="#corpus" data-act="openPassage" data-arg="${c.id}">${esc(c.title)}</a>${c.superseded ? badge('Superseded') : ''}</div><div class="meta">${cite(c.citation)} ${lg(c)} · v${c.version}</div></div>`,
              )
              .join('');
            content = `<div class="table-wrap dtable"><table class="table"><caption class="sr-only">Legal corpus passages</caption><thead><tr><th scope="col">Citation</th><th scope="col">Title</th><th scope="col">Languages</th><th scope="col">In effect</th><th scope="col" class="num">Version</th></tr></thead><tbody>${tr}</tbody></table></div><div class="mlist">${m}</div>${Kit.pager({ page, pageSize: PAGE, total: rows.length, act: 'corPage' })}`;
          }
        }
        return consoleShell(
          `<main class="cpage">${head}${tabs('corpus')}<div class="card">${metaRow}${toolbar}${content}</div></main>`,
          {
            crumbs,
            active: 'Help articles',
          },
        );
      }

      /* ============================== screen: question themes ============================== */
      function screenThemes() {
        const crumbs = [
          ['Help articles', 'articles'],
          ['Question themes', 'themes'],
        ];
        const g = gate('themes');
        if (g) return stateScreen(g, crumbs);
        const mo = MONTHS.find((m) => m[0] === S.th.month);
        const monthSel = `<label class="sr-only" for="f-th-month">Month</label><select id="f-th-month" class="select" data-bind="th.month" data-rerender style="width:auto">${MONTHS.map(([k, l, s]) => `<option value="${k}" ${S.th.month === k ? 'selected' : ''}>${l}${s ? ` (${s})` : ''}</option>`).join('')}</select>`;
        const head = `<div class="page-head"><div style="min-width:0"><h1>Help articles</h1></div><div class="actions-r">${monthSel}</div></div>`;
        let content;
        if (S.th.load === 'loading')
          content = `<div class="tiles t3">${[1, 2, 3].map(() => `<div class="tile"><span class="skeleton" style="width:45%"></span><span class="skeleton" style="width:30%;height:26px;margin-top:6px"></span></div>`).join('')}</div><div class="card"><div class="table-wrap"><table class="table" aria-busy="true"><caption class="sr-only">Question themes (loading)</caption><thead><tr><th>Theme</th><th class="num">Questions</th><th class="num">Unanswered</th><th>Share</th></tr></thead><tbody>${Kit.skeletonRows(6, 4)}</tbody></table></div></div>`;
        else if (S.th.load === 'error')
          content = `<div class="card">${loadErr('Question themes', 'retryThemes')}</div>`;
        else {
          const rows = themeCounts(S.th.month);
          if (!rows.length)
            content = `<div class="card">${Kit.empty(`No questions in ${mo[1]}`, 'Ask Adili opened to PSC declarants on 1 Jul 2026.', { icon: 'chart' })}</div>`;
          else {
            const total = rows.reduce((a, r) => a + r.count, 0);
            const un = rows.reduce((a, r) => a + r.unanswered, 0);
            const max = rows[0].count;
            const top = [...rows].sort((a, b) => b.unanswered - a.unanswered)[0];
            const tiles = `<div class="tiles t3"><div class="tile"><span class="k">${icon('msg', 15)} Questions</span><span class="v">${num(total)}</span></div><div class="tile"><span class="k">${icon('help', 15)} Unanswered</span><span class="v">${num(un)} <small style="font-size:14px;color:var(--muted);font-weight:500">${Kit.pct(un, total)}%</small></span></div><div class="tile"><span class="k">${icon('alert', 15)} Most unanswered</span><span class="v" style="font-size:18px;line-height:1.3;margin-top:4px">${esc(top.theme)}</span><span class="s">${num(top.unanswered)} of ${num(top.count)}</span></div></div>`;
            const tr = rows
              .map(
                (r) =>
                  `<tr><td style="font-weight:500;min-width:200px">${esc(r.theme)}</td><td class="num">${num(r.count)}</td><td class="num">${num(r.unanswered)}</td><td style="min-width:140px"><div class="bar" role="img" aria-label="${Kit.pct(r.count, total)}% of questions"><i style="width:${Math.round((r.count / max) * 100)}%"></i></div></td>${isCA() ? `<td class="nowrap" style="text-align:right"><button class="btn btn-ghost btn-sm" data-act="articleForTheme" data-arg="${esc(r.tag)}|${esc(r.theme)}">${icon('plus', 15)} Article</button></td>` : ''}</tr>`,
              )
              .join('');
            content = `${tiles}<div class="card" style="margin-top:16px"><div class="table-wrap"><table class="table"><caption class="sr-only">Question themes for ${mo[1]}, most asked first. Counts only.</caption><thead><tr><th scope="col">Theme</th><th scope="col" class="num">Questions</th><th scope="col" class="num">Unanswered</th><th scope="col">Share</th>${isCA() ? '<th scope="col"><span class="sr-only">Actions</span></th>' : ''}</tr></thead><tbody>${tr}</tbody><tfoot><tr><td>All themes</td><td class="num">${num(total)}</td><td class="num">${num(un)}</td><td></td>${isCA() ? '<td></td>' : ''}</tr><tr class="un"><td>${icon('help', 14)} Unanswered</td><td class="num">${num(un)}</td><td class="num">${Kit.pct(un, total)}%</td><td style="min-width:140px"><div class="bar warn" role="img" aria-label="${Kit.pct(un, total)}% unanswered"><i style="width:${Math.round((un / max) * 100)}%"></i></div></td>${isCA() ? '<td></td>' : ''}</tr></tfoot></table></div></div>`;
          }
        }
        const note = `<div class="ro-note" style="margin-bottom:14px">${icon('lock', 14)} Counts only, per month. Question text never leaves the declarations service.</div>`;
        return consoleShell(
          `<main class="cpage">${head}${tabs('themes')}${note}${content}</main>`,
          {
            crumbs,
            active: 'Help articles',
          },
        );
      }

      /* ============================== modals ============================== */
      function searchResults(q, lang) {
        const words = q
          .toLowerCase()
          .split(/\s+/)
          .filter((w) => w.length > 2);
        if (!words.length) return [];
        const score = (txt, title, tags) =>
          words.reduce(
            (s, w) =>
              s +
              (title.toLowerCase().includes(w) ? 3 : 0) +
              (tags.join(' ').includes(w) ? 2 : 0) +
              (txt.toLowerCase().includes(w) ? 1 : 0),
            0,
          );
        const tenant = scope() === 'platform' ? null : 'psc';
        const arts = S.arts
          .filter((a) => inForce(a) && (a.tenant === null || a.tenant === tenant))
          .map((a) => {
            const txt = lang === 'sw' && a.bodySw ? a.bodySw : a.bodyEn;
            return { kind: 'help', a, title: a.title, txt, s: score(txt, a.title, a.tags) };
          });
        const cor = S.corpus
          .filter((c) => !c.superseded)
          .map((c) => {
            const txt = lang === 'sw' && c.textSw ? c.textSw : c.textEn;
            return { kind: 'law', c, title: c.title, txt, s: score(txt, c.title, c.tags) };
          });
        return [...arts, ...cor]
          .filter((x) => x.s > 0)
          .sort((a, b) => b.s - a.s)
          .slice(0, 8);
      }
      const mark = (t, q) => {
        let h = esc(t.length > 180 ? t.slice(0, 180) + '…' : t);
        q.toLowerCase()
          .split(/\s+/)
          .filter((w) => w.length > 2)
          .forEach((w) => {
            h = h.replace(
              new RegExp(`(${w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'ig'),
              '<mark>$1</mark>',
            );
          });
        return h;
      };
      const modals = {
        search: () => {
          const s = S.search;
          const res = s.last ? searchResults(s.last, s.lang) : [];
          const who = scope() === 'platform' ? 'any declarant' : 'a PSC declarant';
          const list = !s.last
            ? `<p class="muted small">Search the way ${who} would in Ask Adili's help. Results include the law and published articles in force.</p>`
            : !res.length
              ? Kit.empty('No results', 'Declarants would see "Ask your reporting officer".', {
                  icon: 'search',
                })
              : `<div class="results" aria-live="polite">${res
                  .map(
                    (r) =>
                      `<div class="result ${r.kind === 'help' && r.a.id === S.justPublished ? 'new' : ''}"><div class="row wrap" style="gap:6px">${r.kind === 'help' ? citeHelp(r.a) : cite(r.c.citation)}${r.kind === 'help' && r.a.id === S.justPublished ? badge(`${icon('check', 12, 2.4)} Just published`, 'ok') : ''}</div><div class="t">${esc(r.title)}</div><div class="s">${mark(r.txt, s.last)}</div></div>`,
                  )
                  .join('')}</div>`;
          return drawer({
            title: 'Test help search',
            body: `<form class="row" style="gap:8px;align-items:flex-end;margin-bottom:6px" onsubmit="event.preventDefault();Kit.cfg.actions.runSearch()"><div style="flex:1;min-width:0">${field('Search', input('search.q', { type: 'search', ph: 'e.g. file number' }), { id: 'f-search-q' })}</div><div>${field('Language', `<select id="f-search-lang" class="select" data-bind="search.lang" style="width:auto"><option value="en" ${s.lang === 'en' ? 'selected' : ''}>English</option><option value="sw" ${s.lang === 'sw' ? 'selected' : ''}>Kiswahili</option></select>`, { id: 'f-search-lang' })}</div><button class="btn btn-primary" type="submit" style="height:44px">${icon('search', 16)}<span class="sr-only">Search</span></button></form>${list}`,
          });
        },
        passage: () => {
          const c = S.corpus.find((x) => x.id === S.modal.id);
          return drawer({
            title: esc(c.title),
            head: `<div class="row wrap" style="gap:6px;margin-top:8px">${cite(c.citation)}${badge(SOURCE_L[c.source])}${c.superseded ? badge('Superseded') : ''}</div>`,
            body: `<div class="stack"><div class="kv"><div><div class="k">In effect</div><div class="v">${c.effectiveTo ? `${fmtDate(c.effectiveFrom)} - ${fmtDate(c.effectiveTo)}` : `From ${fmtDate(c.effectiveFrom)}`}</div></div><div><div class="k">Version</div><div class="v">${c.version}</div></div></div><div><div class="label" style="margin-bottom:6px"><span>English</span></div><div class="passage">${esc(c.textEn)}</div></div><div><div class="label" style="margin-bottom:6px"><span>Kiswahili</span></div>${c.textSw ? `<div class="passage">${esc(c.textSw)}</div>` : '<div class="muted small">No Kiswahili text. Answers in Kiswahili cite the English.</div>'}</div><div><div class="label" style="margin-bottom:6px"><span>Tags</span></div>${c.tags.length ? `<div class="tagset">${c.tags.map((t) => `<span class="chip on" style="cursor:default">${esc(TAG_L[t] || t)}</span>`).join('')}</div>` : '<span class="muted small">No tags</span>'}</div><div class="ro-note">${icon('lock', 14)} Read only. Imported from the repository.</div></div>`,
          });
        },
        reimport: () =>
          dialog({
            title: 'Re-import the legal corpus?',
            icon: 'refresh',
            body: `<p>Adili loads the corpus checked into the repository. Changed passages get a new version; replaced ones keep an end date. Answers cite the new version from now on.</p><div class="kv" style="margin-top:14px"><div><div class="k">Current version</div><div class="v">${esc(S.corpusVersion.v)}</div></div><div><div class="k">In the repository</div><div class="v">2026.3</div></div></div>`,
            foot: `<button class="btn btn-secondary" data-act="closeModal">Cancel</button><button class="btn btn-primary" data-act="doReimport">${icon('refresh', 16)} Re-import</button>`,
          }),
        leave: () =>
          dialog({
            title: 'Discard changes?',
            icon: 'alert',
            body: '<p>Your changes to this article are not saved.</p>',
            foot: `<button class="btn btn-secondary" data-act="closeModal">Keep editing</button><button class="btn btn-danger" data-act="confirmLeave">Discard</button>`,
          }),
      };

      /* ============================== actions ============================== */
      function openEditor(a, extra = {}) {
        S.ed = {
          d: a
            ? JSON.parse(
                JSON.stringify({ ...a, bodySw: a.bodySw || '', effectiveTo: a.effectiveTo || '' }),
              )
            : { ...blank(), ...extra },
          lang: 'en',
          mode: 'write',
          errors: {},
          apiErr: null,
          saving: false,
          dirty: false,
          failNext: null,
        };
        S.notFound = false;
        Kit.go('article');
      }
      function applyFail(kind) {
        const ed = S.ed;
        ed.saving = false;
        if (kind === 'validation') {
          ed.errors = { title: 'Another PSC article already uses this title.' };
          ed.apiErr = { title: 'The article was not saved', detail: '' };
        } else {
          ed.apiErr = {
            title: 'Could not save',
            detail: 'Check your connection and try again. Your changes are still here.',
          };
        }
        Kit.render();
        document.getElementById('errsum')?.focus();
      }
      const actions = {
        go: (a) => {
          if (S.screen === 'article' && S.ed?.dirty && a !== 'article') {
            S.modal = { kind: 'leave', to: a };
            Kit.render();
            return;
          }
          const [scr, p] = String(a).split('|');
          Kit.go(scr, p ? { id: p } : {});
        },
        confirmLeave: () => {
          const to = S.modal.to;
          S.ed.dirty = false;
          S.modal = null;
          Kit.go(to);
        },
        listStatus: (k) => {
          S.list.status = S.list.status === k ? '' : k;
          S.list.page = 1;
          Kit.render();
        },
        listPage: (p) => {
          S.list.page = +p;
          Kit.render();
        },
        clearList: () => {
          S.list = { ...S.list, q: '', status: '', page: 1 };
          Kit.render();
        },
        retryList: () => {
          S.list.load = 'loading';
          Kit.render();
          setTimeout(() => {
            S.list.load = 'ok';
            Kit.render();
          }, 800);
        },
        newArticle: () => openEditor(null),
        openArticle: (id) => openEditor(S.arts.find((a) => a.id === id)),
        articleForTheme: (a) => {
          const [tag, theme] = a.split('|');
          openEditor(null, { title: theme, tags: [tag] });
        },
        edLang: (k) => {
          S.ed.lang = k;
          Kit.render();
        },
        edMode: (k) => {
          S.ed.mode = k;
          Kit.render();
        },
        toggleTag: (k) => {
          const t = S.ed.d.tags;
          S.ed.d.tags = t.includes(k) ? t.filter((x) => x !== k) : [...t, k];
          S.ed.dirty = true;
          Kit.render();
        },
        focusField: (id) => {
          if (id === 'f-ed-d-bodyEn') {
            S.ed.lang = 'en';
            S.ed.mode = 'write';
            Kit.render();
          }
          document.getElementById(id)?.focus();
        },
        saveArticle: () => {
          const ed = S.ed;
          ed.errors = validate(ed.d);
          ed.apiErr = null;
          if (Object.keys(ed.errors).length) {
            if (ed.errors.bodyEn) ed.lang = 'en';
            ed.mode = 'write';
            Kit.render();
            document.getElementById('errsum')?.focus();
            return;
          }
          ed.saving = true;
          Kit.render();
          setTimeout(() => {
            ed.saving = false;
            const fail = ed.failNext;
            ed.failNext = null;
            if (fail) {
              applyFail(fail);
              return;
            }
            const d = ed.d;
            const now = '2026-09-26T10:30:00';
            const by = Kit.PERSONAS[P()].name;
            const clean = {
              ...d,
              bodySw: d.bodySw.trim() ? d.bodySw : null,
              effectiveTo: d.effectiveTo || null,
            };
            let a = S.arts.find((x) => x.id === d.id);
            const wasPublished = a?.published;
            if (a)
              Object.assign(a, clean, { version: a.version + 1, updatedAt: now, updatedBy: by });
            else {
              a = {
                ...clean,
                id: `n${Date.now() % 100000}`,
                version: 1,
                updatedAt: now,
                updatedBy: by,
              };
              S.arts.unshift(a);
            }
            ed.d = JSON.parse(
              JSON.stringify({ ...a, bodySw: a.bodySw || '', effectiveTo: a.effectiveTo || '' }),
            );
            ed.dirty = false;
            ed.errors = {};
            if (a.published && inForce(a) && !wasPublished) {
              S.justPublished = a.id;
              Kit.render();
              Kit.toast(
                `Published. ${scope() === 'platform' ? 'Every declarant' : 'PSC declarants'} can find it now.`,
              );
            } else {
              Kit.render();
              Kit.toast(`Saved. Version ${a.version}.`);
            }
          }, 900);
        },
        openSearch: () => {
          S.modal = { kind: 'search' };
          Kit.render();
          document.getElementById('f-search-q')?.focus();
        },
        runSearch: () => {
          S.search.last = S.search.q.trim();
          Kit.render();
        },
        openPassage: (id) => {
          S.modal = { kind: 'passage', id };
          Kit.render();
        },
        corPage: (p) => {
          S.cor.page = +p;
          Kit.render();
        },
        clearCorpus: () => {
          S.cor = { ...S.cor, q: '', source: '', old: false, page: 1 };
          Kit.render();
        },
        retryCorpus: () => {
          S.cor.load = 'loading';
          Kit.render();
          setTimeout(() => {
            S.cor.load = 'ok';
            Kit.render();
          }, 800);
        },
        doReimport: () => {
          S.modal = null;
          S.cor.importing = true;
          Kit.render();
          setTimeout(() => {
            S.cor.importing = false;
            S.corpusVersion = { v: '2026.3', at: '2026-09-26T10:30:00', by: 'Amina Wanjiru' };
            Kit.render();
            Kit.toast('Imported version 2026.3: 3 passages changed, 1 superseded.');
          }, 1500);
        },
        retryThemes: () => {
          S.th.load = 'loading';
          Kit.render();
          setTimeout(() => {
            S.th.load = 'ok';
            Kit.render();
          }, 800);
        },
      };

      /* ============================== jumps ============================== */
      const setP = (p) => localStorage.setItem('dials-proto-persona', p);
      const reset = () => {
        Object.assign(S, initialState(), { modal: null, menu: null });
      };
      const J = (id, label, persona, fn) => [
        id,
        label,
        () => {
          reset();
          setP(persona);
          fn();
        },
      ];
      const jumps = [
        J('articles', '#344 Help articles (commission admin)', 'commission-admin', () =>
          Kit.go('articles'),
        ),
        J('a-page2', '#344 Articles: page 2', 'commission-admin', () => {
          S.list.page = 2;
          Kit.go('articles');
        }),
        J('a-drafts', '#344 Articles: drafts filter', 'commission-admin', () => {
          S.list.status = 'draft';
          Kit.go('articles');
        }),
        J('a-nomatch', '#344 Articles: no matches', 'commission-admin', () => {
          S.list.q = 'pension scheme abroad';
          Kit.go('articles');
        }),
        J('a-empty', '#344 Articles: none yet', 'commission-admin', () => {
          S.arts = S.arts.filter((a) => a.tenant !== 'psc');
          Kit.go('articles');
        }),
        J('a-loading', '#344 Articles: loading', 'commission-admin', () => {
          S.list.load = 'loading';
          Kit.go('articles');
        }),
        J('a-error', '#344 Articles: error', 'commission-admin', () => {
          S.list.load = 'error';
          Kit.go('articles');
        }),
        J('a-ro', '#344 Articles: reporting officer (read only)', 'reporting-officer', () =>
          Kit.go('articles'),
        ),
        J('article', '#344 Edit article (published, EN and SW)', 'commission-admin', () =>
          openEditor(S.arts.find((a) => a.id === 'a01')),
        ),
        J('ed-sw', '#344 Edit article: Kiswahili body', 'commission-admin', () => {
          openEditor(S.arts.find((a) => a.id === 'a01'));
          S.ed.lang = 'sw';
          Kit.render();
        }),
        J('ed-preview', '#344 Edit article: preview', 'commission-admin', () => {
          openEditor(S.arts.find((a) => a.id === 'a01'));
          S.ed.mode = 'preview';
          Kit.render();
        }),
        J('ed-new', '#344 New article', 'commission-admin', () => openEditor(null)),
        J('ed-invalid', '#344 New article: validation errors', 'commission-admin', () => {
          openEditor(null);
          S.ed.d.effectiveTo = '2026-01-01';
          Kit.cfg.actions.saveArticle();
        }),
        J('ed-api', '#344 Save refused by the API (duplicate title)', 'commission-admin', () => {
          openEditor(null, {
            title: 'File numbers: where to find yours',
            bodyEn: 'Draft text.',
            tags: ['bio'],
          });
          applyFail('validation');
        }),
        J('ed-network', '#344 Save failed (network)', 'commission-admin', () => {
          openEditor(S.arts.find((a) => a.id === 'a02'));
          S.ed.d.bodySw =
            'Mikopo kutoka Hazina ya Mpango wa Nyumba za Watumishi wa Umma ni madeni.';
          S.ed.dirty = true;
          applyFail('network');
        }),
        J('ed-saving', '#344 Saving', 'commission-admin', () => {
          openEditor(S.arts.find((a) => a.id === 'a08'));
          S.ed.d.published = true;
          S.ed.saving = true;
          Kit.render();
        }),
        J('ed-draft', '#344 Draft article, ready to publish', 'commission-admin', () =>
          openEditor(S.arts.find((a) => a.id === 'a08')),
        ),
        J('ed-leave', '#344 Leave with unsaved changes', 'commission-admin', () => {
          openEditor(S.arts.find((a) => a.id === 'a08'));
          S.ed.d.title = 'Acting appointments and confirmation';
          S.ed.dirty = true;
          S.modal = { kind: 'leave', to: 'articles' };
          Kit.render();
        }),
        J(
          'published-search',
          '#344 Published, then found in help search',
          'commission-admin',
          () => {
            const a = S.arts.find((x) => x.id === 'a08');
            a.published = true;
            a.version = 2;
            a.updatedAt = '2026-09-26T10:30:00';
            S.justPublished = 'a08';
            S.search = { q: 'acting appointment', lang: 'en', last: 'acting appointment' };
            Kit.go('articles');
            S.modal = { kind: 'search' };
            Kit.render();
          },
        ),
        J('search-sw', '#344 Help search in Kiswahili', 'commission-admin', () => {
          S.search = { q: 'nambari faili', lang: 'sw', last: 'nambari faili' };
          Kit.go('articles');
          S.modal = { kind: 'search' };
          Kit.render();
        }),
        J('search-none', '#344 Help search: no results', 'commission-admin', () => {
          S.search = { q: 'helicopter', lang: 'en', last: 'helicopter' };
          Kit.go('articles');
          S.modal = { kind: 'search' };
          Kit.render();
        }),
        J('article-ro', '#344 Article read view (reporting officer)', 'reporting-officer', () =>
          openEditor(S.arts.find((a) => a.id === 'a01')),
        ),
        J('pa-articles', '#344 Platform articles (platform admin)', 'platform-admin', () =>
          Kit.go('articles'),
        ),
        J('pa-article', '#344 Edit a platform article', 'platform-admin', () =>
          openEditor(S.arts.find((a) => a.id === 'b01')),
        ),
        J('corpus', '#344 Legal corpus (read only)', 'platform-admin', () => Kit.go('corpus')),
        J('c-page2', '#344 Corpus: page 2', 'platform-admin', () => {
          S.cor.page = 2;
          Kit.go('corpus');
        }),
        J('c-old', '#344 Corpus: superseded passages shown', 'platform-admin', () => {
          S.cor.old = true;
          S.cor.q = 'material change';
          Kit.go('corpus');
        }),
        J('c-passage', '#344 Corpus passage (EN and SW)', 'platform-admin', () => {
          Kit.go('corpus');
          S.modal = { kind: 'passage', id: 'c4' };
          Kit.render();
        }),
        J('c-nomatch', '#344 Corpus: no matches', 'platform-admin', () => {
          S.cor.q = 'helicopter';
          Kit.go('corpus');
        }),
        J('c-loading', '#344 Corpus: loading', 'platform-admin', () => {
          S.cor.load = 'loading';
          Kit.go('corpus');
        }),
        J('c-error', '#344 Corpus: error', 'platform-admin', () => {
          S.cor.load = 'error';
          Kit.go('corpus');
        }),
        J('c-reimport', '#344 Re-import confirmation', 'platform-admin', () => {
          Kit.go('corpus');
          S.modal = { kind: 'reimport' };
          Kit.render();
        }),
        J('c-importing', '#344 Re-importing', 'platform-admin', () => {
          S.cor.importing = true;
          Kit.go('corpus');
        }),
        J('themes', '#344 Question themes (commission admin)', 'commission-admin', () =>
          Kit.go('themes'),
        ),
        J('t-ro', '#344 Question themes (reporting officer)', 'reporting-officer', () =>
          Kit.go('themes'),
        ),
        J('t-aug', '#344 Question themes: August 2026', 'reporting-officer', () => {
          S.th.month = '2026-08';
          Kit.go('themes');
        }),
        J('t-empty', '#344 Question themes: month with none', 'reporting-officer', () => {
          S.th.month = '2026-06';
          Kit.go('themes');
        }),
        J('t-loading', '#344 Question themes: loading', 'reporting-officer', () => {
          S.th.load = 'loading';
          Kit.go('themes');
        }),
        J('t-error', '#344 Question themes: error', 'reporting-officer', () => {
          S.th.load = 'error';
          Kit.go('themes');
        }),
        J('x-404', '#344 Help articles as reviewer (404)', 'reviewer', () => Kit.go('articles')),
        J('x-403', '#344 Legal corpus as commission admin (403)', 'commission-admin', () =>
          Kit.go('corpus'),
        ),
        J('x-t404', '#344 Question themes as platform admin (404)', 'platform-admin', () =>
          Kit.go('themes'),
        ),
      ];

      Kit.mount({
        app: 'console',
        start: 'articles',
        home: 'articles',
        defaultPersona: 'commission-admin',
        screens: {
          articles: screenArticles,
          article: screenArticle,
          corpus: screenCorpus,
          themes: screenThemes,
        },
        modals,
        actions,
        jumps,
        onBind: (path) => {
          if (path === 'list.q') S.list.page = 1;
          if (path.startsWith('cor.')) S.cor.page = 1;
          if (path.startsWith('ed.d.')) {
            S.ed.dirty = true;
            if (S.ed.errors?.[path.slice(5)]) {
              delete S.ed.errors[path.slice(5)];
            }
            if (path === 'ed.d.bodyEn' || path === 'ed.d.bodySw') {
              const cc = document.querySelector('.ed-body .cc');
              if (cc) cc.textContent = `${num((Kit.getPath(S, path) || '').length)} / 20,000`;
            }
          }
        },
        onPersona: () => {
          S.modal = null;
          if (S.screen === 'article' && !S.ed) Kit.go('articles');
        },
        reset: () => {
          reset();
          Kit.go(S.screen === 'article' ? 'articles' : S.screen || 'articles');
        },
        afterRender: () => {
          document.querySelectorAll('tr.click, .mitem').forEach((el) => {
            el.onkeydown = (e) => {
              if (e.key === 'Enter') el.click();
            };
          });
        },
        coverage: [
          {
            ticket: 344,
            title: 'Console: help articles authoring, corpus view and question themes',
            screens: [
              'articles',
              'a-page2',
              'a-drafts',
              'a-nomatch',
              'a-empty',
              'a-loading',
              'a-error',
              'a-ro',
              'article',
              'ed-sw',
              'ed-preview',
              'ed-new',
              'ed-invalid',
              'ed-api',
              'ed-network',
              'ed-saving',
              'ed-draft',
              'ed-leave',
              'published-search',
              'search-sw',
              'search-none',
              'article-ro',
              'pa-articles',
              'pa-article',
              'corpus',
              'c-page2',
              'c-old',
              'c-passage',
              'c-nomatch',
              'c-loading',
              'c-error',
              'c-reimport',
              'c-importing',
              'themes',
              't-ro',
              't-aug',
              't-empty',
              't-loading',
              't-error',
              'x-404',
              'x-403',
              'x-t404',
            ],
            note: 'Commission-admin edits PSC articles; reporting-officer reads them and sees themes; platform-admin edits platform articles and sees the corpus read only. "Test help search" runs the declarant help search (published articles in force + law) so a just-published article is findable in the same session. Kit nav only lists Help articles for platform-admin; Commission roles reach it from this file.',
          },
        ],
      });
    </script>
  </body>
</html>
