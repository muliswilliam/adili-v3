                confirmedBy: { name: doc.partIII.confirmedBy.name },
              };
        const late = row.status === 'submitted-late';
        const side = `<aside class="fm-side stack">
          <div class="card card-pad"><h3 style="font-size:14px;font-weight:600;margin-bottom:12px">Rates</h3><div class="stack" style="gap:12px">${['initial', 'biennial', 'final'].map((k) => `<div><div class="small" style="font-weight:500;margin-bottom:4px">${SEC_L[k]} declarations</div>${rateBar(row.rates[k].declared, row.rates[k].expected, { lg: true })}</div>`).join('')}</div></div>
          <div class="card card-pad"><h3 style="font-size:14px;font-weight:600;margin-bottom:10px">Outliers</h3>${row.outliers.length ? `<div class="stack" style="gap:10px">${row.outliers.map((o) => `<div><span class="ochip">${icon('flag', 11)} ${OUTLIER_L[o]}</span><div class="small muted" style="margin-top:2px">${OUTLIER_HELP[o]}</div></div>`).join('')}</div>` : '<p class="small muted">No outliers for this report.</p>'}</div>
          ${row.chases.count ? `<div class="card card-pad"><h3 style="font-size:14px;font-weight:600;margin-bottom:10px">Chasing</h3><p class="small muted">Chased ${row.chases.count} time${row.chases.count === 1 ? '' : 's'}, last ${fmtDate(row.chases.lastAt)}</p></div>` : ''}
        </aside>`;
        const body = `${back}<div class="page-head" style="margin-bottom:14px"><div><h1>${esc(c.name)}</h1><div class="row wrap" style="gap:8px;margin-top:10px">${intakeBadge(row.status)}${sourceBadge(row.source)}<span class="restricted">${icon('lock', 11)} Restricted</span></div></div><div class="actions-r"><a class="btn btn-primary" href="../../../services/documents/prototype/documents.prototype.html#form-m" target="_blank" rel="noopener">${icon('download', 17)} Download Form M (PDF)</a><a class="btn btn-secondary" href="../../../services/documents/prototype/documents.prototype.html#form-m-receipt" target="_blank" rel="noopener">${icon('download', 17)} Receipt</a></div></div>
          <div class="card card-pad" style="margin-bottom:16px"><div class="kv k3"><div><div class="k">Reference number</div><div class="v ref">${esc(row.reference)}</div></div><div><div class="k">Submitted</div><div class="v">${fmtDateTime(row.submittedAt)}${late ? ` <span class="small" style="color:var(--warn);font-weight:500">(${daysBetweenDates(dueOf(2025), row.submittedAt)} days late)</span>` : ''}</div></div><div><div class="k">Period</div><div class="v">${FYL(2025)}, due ${fmtDate(dueOf(2025))}</div></div><div><div class="k">Compiled by</div><div class="v">${esc(doc.partIII.compiledBy.name || '-')}</div></div><div><div class="k">Confirmed by</div><div class="v">${esc(doc.partIII.confirmedBy.name || '-')}</div></div><div><div class="k">Fingerprint (SHA-256)</div><div class="v hash">${esc(r.hash.slice(0, 24))}…</div></div></div></div>
          <div class="fm-split"><div class="fm-doc">${formMDoc(doc, { edit: false, pages: S.viewer.pages, pageKey: `v${slug}` })}</div>${side}</div>`;
        return consoleShell(`<main class="cpage">${body}</main>`, {
          crumbs,
          active: 'Compliance reports',
        });
      }
      const daysBetweenDates = (a, b) => Math.ceil((d0(b) - d0(a)) / 86400000);

      /* ============================== EACC: NCR builder (#233) ============================== */
      function ncrAggregates(rows) {
        const sub = rows.filter((r) => r.rates);
        const tot = {};
        ['initial', 'biennial', 'final'].forEach((k) => {
          tot[k] = { expected: 0, declared: 0 };
          sub.forEach((r) => {
            tot[k].expected += r.rates[k].expected;
            tot[k].declared += r.rates[k].declared;
          });
        });
        return {
          tot,
          per: sub.map((r) => ({ slug: r.slug, name: r.name, status: r.status, rates: r.rates })),
        };
      }
      /* ---------- spec 09b: pattern candidates, figure citations, AI narrative (#329 #331 #341) ---------- */
      // Prior-year figures the candidates module compares against (FY 2023/24 and 2024/25). Demo values.
      const PRIOR = {
        nonFiler: { cpsb047: { 2024: 16.8 } },
        lateDays: { cpsb009: { 2023: 9, 2024: 14 } },
      };
      const SIZE_BAND = [2000, 5000];
      const fyShort = (y) => `${y}/${String(y + 1).slice(2)}`;
      const pct1 = (v) => (v == null ? '-' : `${Number(v).toFixed(1)}%`);
      const shortName = (slug) =>
        cname(slug)
          .replace(' County Public Service Board', ' CPSB')
          .replace('Parliamentary Service Commission', 'Parliamentary SC');
      const median = (xs) => {
        const a = [...xs].sort((x, y) => x - y);
        const m = Math.floor(a.length / 2);
        return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
      };
      const sumRates = (r) =>
        ['initial', 'biennial', 'final'].reduce(
          (a, k) => ({ e: a.e + r.rates[k].expected, d: a.d + r.rates[k].declared }),
          { e: 0, d: 0 },
        );
      const nonFilerRate = (r) => {
        const t = sumRates(r);
        return t.e ? Math.round(((t.e - t.d) / t.e) * 1000) / 10 : null;
      };
      const clarPer1000 = (r) => {
        const t = sumRates(r);
        return t.d && r.clar != null ? Math.round((r.clar / t.d) * 10000) / 10 : null;
      };
      const lateDaysOf = (r, fy) =>
        r.submittedAt ? Math.max(0, daysBetweenDates(dueOf(fy), r.submittedAt)) : null;

      /* Figure formatter: aggregate key -> { label, value, anchor }. The citation chip (#329) renders it. */
      function figure(key) {
        const p = key.split('.');
        const fy = +S.ncr.fy;
        const rows = intakeRows(fy);
        const sub = rows.filter((r) => r.rates);
        const y = +p[p.length - 1];
        if (p[0] === 'national') {
          const tot = { e: 0, d: 0 };
          sub.forEach((r) => {
            const t = sumRates(r);
            tot.e += t.e;
            tot.d += t.d;
          });
          const secT = (k) =>
            sub.reduce((a, r) => ({ e: a.e + r.rates[k].expected, d: a.d + r.rates[k].declared }), {
              e: 0,
              d: 0,
            });
          const m = {
            'rate.all': ['National filing rate', pct1(pc(tot.d, tot.e))],
            'rate.initial': [
              'National initial rate',
              pct1(pc(secT('initial').d, secT('initial').e)),
            ],
            'rate.biennial': [
              'National biennial rate',
              pct1(pc(secT('biennial').d, secT('biennial').e)),
            ],
            'rate.final': ['National final rate', pct1(pc(secT('final').d, secT('final').e))],
            expected: ['Declarations expected', num(tot.e)],
            declared: ['Declarations made', num(tot.d)],
            reported: ['Commissions reported', num(sub.length)],
            commissions: ['Commissions', num(rows.length)],
            late: ['Reported late', num(sub.filter((r) => r.status === 'submitted-late').length)],
            'not-reported': ['Did not report', num(rows.length - sub.length)],
          };
          const hit = m[p.slice(1, -1).join('.')];
          if (hit && y === fy)
            return { label: `${hit[0]} ${fyShort(y)}`, value: hit[1], anchor: 'ncr-totals' };
        }
        if (p[0] === 'threshold') return { label: 'Rate threshold', value: `${THRESHOLD}%` };
        if (p[0] === 'band' && p[1] === 'median-rate') {
          const band = sub.filter(
            (r) =>
              r.rates.biennial.expected >= SIZE_BAND[0] &&
              r.rates.biennial.expected <= SIZE_BAND[1],
          );
          return {
            label: `Median biennial rate, ${num(SIZE_BAND[0])}-${num(SIZE_BAND[1])} officers ${fyShort(y)}`,
            value: pct1(median(band.map((r) => r.rates.biennial.rate))),
            anchor: 'ncr-per',
          };
        }
        if (p[0] === 'median' && p[1] === 'clar-per-1000') {
          const xs = sub.map(clarPer1000).filter((x) => x != null);
          return {
            label: `Median clarifications per 1,000 ${fyShort(y)}`,
            value: median(xs).toFixed(1),
            anchor: 'ncr-per',
          };
        }
        if (p[0] === 'commission') {
          const slug = p[1];
          const r = rows.find((x) => x.slug === slug);
          if (!r) return null;
          const nm = shortName(slug);
          const metric = p.slice(2, -1).join('.');
          const cur = y === fy && r.rates;
          if (metric.startsWith('rate.') && cur) {
            const k = metric.split('.')[1];
            return {
              label: `${nm} ${SEC_L[k].toLowerCase()} rate ${fyShort(y)}`,
              value: pct1(r.rates[k].rate),
              anchor: `ncr-row-${slug}`,
              slug,
            };
          }
          if (metric === 'nonfiler-rate') {
            const v = cur ? nonFilerRate(r) : PRIOR.nonFiler[slug]?.[y];
            if (v == null) return null;
            return {
              label: `${nm} non-filer rate ${fyShort(y)}`,
              value: pct1(v),
              anchor: `ncr-row-${slug}`,
              slug,
            };
          }
          if (metric === 'late-days') {
            const v = cur ? lateDaysOf(r, fy) : PRIOR.lateDays[slug]?.[y];
            if (v == null) return null;
            return {
              label: `${nm} days late ${fyShort(y)}`,
              value: num(v),
              anchor: `ncr-row-${slug}`,
              slug,
            };
          }
          if (metric === 'clar-per-1000' && cur)
            return {
              label: `${nm} clarifications per 1,000 ${fyShort(y)}`,
              value: clarPer1000(r).toFixed(1),
              anchor: `ncr-row-${slug}`,
              slug,
            };
        }
        return null;
      }
      function figChip(key, { static: st = false } = {}) {
        const f = figure(key);
        if (!f)
          return `<span class="fig bad" title="${esc(key)}">${icon('alert', 13, 2)}<span>Figure not found</span></span>`;
        const inner = `${icon('hash', 12, 2)}<span class="truncate">${esc(f.label)}: <b>${esc(f.value)}</b></span>`;
        return st
          ? `<span class="fig">${inner}</span>`
          : `<button class="fig" data-act="figGo" data-arg="${esc(key)}" title="${esc(key)}" aria-label="Figure ${esc(f.label)}: ${esc(f.value)}. Show in table">${inner}</button>`;
      }

      /* Pattern candidates, as the reporting module would compute them (deterministic; AI only narrates). */
      const KIND = {
        'rate-change': ['Rate change', 'trend', 'Largest year-on-year change in a rate'],
        'threshold-breach': ['Below threshold', 'gauge', `A section rate below ${THRESHOLD}%`],
        'chronic-late-reporting': [
          'Late three years',
          'clock',
          'Reported late in each of the last three years',
        ],
        'clarification-ratio-outlier': [
          'High clarifications',
          'msg',
          'Clarifications per 1,000 declarations far above the median',
        ],
        'size-band-outlier': [
          'Size-band outlier',
          'scale',
          'Rate far below Commissions of a similar size',
        ],
        'non-reporting': ['Did not report', 'ban', 'No Form M received by the due date'],
      };
      function candidates() {
        const fy = +S.ncr.fy;
        const rows = intakeRows(fy);
        const sub = rows.filter((r) => r.rates);
        const K = (s, m) => `commission.${s}.${m}.${fy}`;
        const out = [];
        const nrb = sub.find((r) => r.slug === 'cpsb047');
        if (nrb)
          out.push({
            id: 'cand-rate-cpsb047',
            kind: 'rate-change',
            subject: 'cpsb047',
            main: [pct1(nonFilerRate(nrb)), 'non-filer rate'],
            cmp: `from ${pct1(PRIOR.nonFiler.cpsb047[fy - 1])} in ${fyShort(fy - 1)}`,
            keys: [`commission.cpsb047.nonfiler-rate.${fy - 1}`, K('cpsb047', 'nonfiler-rate')],
          });
        sub
          .flatMap((r) =>
            ['initial', 'biennial', 'final']
              .filter((k) => r.rates[k].rate != null && r.rates[k].rate < THRESHOLD)
              .map((k) => ({ r, k })),
          )
          .sort((a, b) => a.r.rates[a.k].rate - b.r.rates[b.k].rate)
          .forEach(({ r, k }) =>
            out.push({
              id: `cand-thr-${r.slug}-${k}`,
              kind: 'threshold-breach',
              subject: r.slug,
              main: [pct1(r.rates[k].rate), `${SEC_L[k].toLowerCase()} rate`],
              cmp: `${num(r.rates[k].declared)} of ${num(r.rates[k].expected)} · threshold ${THRESHOLD}%`,
              keys: [K(r.slug, `rate.${k}`), 'threshold.rate'],
            }),
          );
        const man = sub.find((r) => r.slug === 'cpsb009');
        if (man && man.status === 'submitted-late')
          out.push({
            id: 'cand-late-cpsb009',
            kind: 'chronic-late-reporting',
            subject: 'cpsb009',
            main: [`${lateDaysOf(man, fy)} days`, `late in ${fyShort(fy)}`],
            cmp: `${PRIOR.lateDays.cpsb009[fy - 2]} days in ${fyShort(fy - 2)} · ${PRIOR.lateDays.cpsb009[fy - 1]} days in ${fyShort(fy - 1)}`,
            keys: [
              `commission.cpsb009.late-days.${fy - 2}`,
              `commission.cpsb009.late-days.${fy - 1}`,
              K('cpsb009', 'late-days'),
            ],
          });
        const clar = sub
          .map((r) => ({ r, v: clarPer1000(r) }))
          .filter((x) => x.v != null)
          .sort((a, b) => b.v - a.v)[0];
        if (clar)
          out.push({
            id: `cand-clar-${clar.r.slug}`,
            kind: 'clarification-ratio-outlier',
            subject: clar.r.slug,
            main: [clar.v.toFixed(1), 'clarifications per 1,000 declarations'],
            cmp: `median ${median(sub.map(clarPer1000).filter((x) => x != null)).toFixed(1)}`,
            keys: [K(clar.r.slug, 'clar-per-1000'), `median.clar-per-1000.${fy}`],
          });
        const band = sub
          .filter(
            (r) =>
              r.rates.biennial.expected >= SIZE_BAND[0] &&
              r.rates.biennial.expected <= SIZE_BAND[1],
          )
          .sort((a, b) => a.rates.biennial.rate - b.rates.biennial.rate);
        if (band.length > 3)
          out.push({
            id: `cand-band-${band[0].slug}`,
            kind: 'size-band-outlier',
            subject: band[0].slug,
            main: [pct1(band[0].rates.biennial.rate), 'biennial rate'],
            cmp: `median ${pct1(median(band.map((r) => r.rates.biennial.rate)))} for ${num(SIZE_BAND[0])}-${num(SIZE_BAND[1])} officers`,
            keys: [K(band[0].slug, 'rate.biennial'), `band.median-rate.biennial.${fy}`],
          });
        const notRep = rows.filter((r) => !r.rates);
        if (notRep.length)
          out.push({
            id: 'cand-nonrep',
            kind: 'non-reporting',
            subject: 'national',
            main: [`${notRep.length} of ${rows.length}`, 'Commissions'],
            cmp: `${notRep
              .slice(0, 2)
              .map((r) => shortName(r.slug))
              .join(', ')}${notRep.length > 2 ? ` and ${notRep.length - 2} more` : ''}`,
            keys: [`national.not-reported.${fy}`, `national.commissions.${fy}`],
          });
        return out;
      }
      const candSubject = (id) => {
        const c = candidates().find((x) => x.id === id);
        return !c
          ? 'this pattern'
          : c.subject === 'national'
            ? 'national figures'
            : shortName(c.subject);
      };
      const citedIds = () =>
        Object.values(S.ncr.paras || {})
          .flat()
          .flatMap((p) => p.cands || []);

      function patternCard(c, { canCite = false, cited = false } = {}) {
        const [kl, ki, kt] = KIND[c.kind];
        const subj = c.subject === 'national' ? 'National' : shortName(c.subject);
        return `<article class="pat ${cited ? 'cited' : ''}" aria-label="${esc(kl)}: ${esc(subj)}"><div><span class="badge" title="${esc(kt)}">${icon(ki, 13)} ${kl}</span></div><div class="subj">${esc(subj)}</div><div class="val"><b>${esc(c.main[0])}</b><span>${esc(c.main[1])}</span></div><div class="cmp">${esc(c.cmp)}</div>${
          cited
            ? `<div class="act"><span class="done">${icon('check', 14, 2.4)} Cited in findings</span></div>`
            : canCite
              ? `<div class="act"><button class="btn btn-secondary btn-sm" data-act="citeCand" data-arg="${c.id}" aria-label="Cite in findings: ${esc(kl)}, ${esc(subj)}">${icon('plus', 15)} Cite in findings</button></div>`
              : ''
        }</article>`;
      }
      function patternsPanel(canEdit) {
        const n = S.ncr;
        const tipTxt =
          'Computed from this and prior years’ figures. AI narrates these; it does not find them.';
        const headTitle = `<div class="sec-h"><h3>Notable patterns</h3>${n.pat === 'ok' ? `<span class="badge">${candidates().length}</span>` : ''}${Kit.tip(tipTxt)}</div>`;
        if (n.pat === 'loading')
          return `<section class="card" id="ncr-patterns" aria-busy="true">${headTitle}<div class="pat-grid">${[
            1, 2, 3,
          ]
            .map(
              () =>
                `<div class="pat skel"><span class="skeleton" style="width:40%;height:20px"></span><span class="skeleton" style="width:70%;margin-top:8px"></span><span class="skeleton" style="width:35%;height:22px;margin-top:6px"></span><span class="skeleton" style="width:80%"></span></div>`,
            )
            .join('')}</div></section>`;
        if (n.pat === 'error')
          return `<section class="card" id="ncr-patterns">${headTitle}<div class="sec-b"><div class="callout callout-danger" role="alert" style="align-items:center">${icon('alert', 18)}<div style="flex:1">Patterns could not be loaded.</div><button class="btn btn-secondary btn-sm" data-act="retryPat">${icon('refresh', 15)} Retry</button></div></div></section>`;
        const list = n.pat === 'empty' ? [] : candidates();
        if (!list.length)
          return `<section class="card" id="ncr-patterns">${headTitle}${empty('No notable patterns', `Nothing crossed the thresholds for ${FYL(+n.fy)}.`, { icon: 'chart' })}</section>`;
        const PP = 6;
        const pg = Math.min(n.patPage || 1, Math.ceil(list.length / PP));
        const cited = citedIds();
        return `<section class="card" id="ncr-patterns">${headTitle}<div class="pat-grid">${list
          .slice((pg - 1) * PP, pg * PP)
          .map((c) => patternCard(c, { canCite: canEdit, cited: cited.includes(c.id) }))
          .join(
            '',
          )}</div>${list.length > PP ? Kit.pager({ page: pg, pageSize: PP, total: list.length, act: 'patPage' }) : ''}</section>`;
      }

      /* Narrative paragraphs (per-paragraph structure from spec 09b). ai: 'draft' | 'edited' | null */
      const NSECS = [
        ['overview', 'Overview'],
        ['findings', 'Findings'],
        ['recommendations', 'Recommendations'],
      ];
      let pid = 1;
      const para = (text, ai = null, refs = [], cands = []) => ({
        id: `p${pid++}`,
        text,
        ai,
        refs,
        cands,
      });
      const parasFrom = (narr) =>
        Object.fromEntries(
          NSECS.map(([k]) => [
            k,
            (narr[k] || '')
              .split(/\n\s*\n/)
              .map((t) => t.trim())
              .filter(Boolean)
              .map((t) => para(t)),
          ]),
        );
      function ensureParas(editable) {
        const n = S.ncr;
        if (!n.paras) n.paras = parasFrom(n.narrative);
        if (editable)
          NSECS.forEach(([k]) => {
            if (!n.paras[k].length) n.paras[k].push(para(''));
          });
      }
      /* What the narrate-compliance-report task returns for the demo aggregates. Numbers come from the figures. */
      function aiDraft(sec) {
        const fy = +S.ncr.fy;
        const F = (k) => figure(k)?.value;
        const cs = candidates();
        const byKind = (k) => cs.filter((c) => c.kind === k);
        if (sec === 'overview')
          return [
            para(
              `${F(`national.reported.${fy}`)} of ${F(`national.commissions.${fy}`)} Commissions submitted Form M for ${FYL(fy)}; ${F(`national.late.${fy}`)} of them reported after the due date.`,
              'draft',
              [`national.reported.${fy}`, `national.commissions.${fy}`, `national.late.${fy}`],
            ),
            para(
              `Across the reporting Commissions, ${F(`national.declared.${fy}`)} of ${F(`national.expected.${fy}`)} expected declarations were made, a national filing rate of ${F(`national.rate.all.${fy}`)}.`,
              'draft',
              [`national.declared.${fy}`, `national.expected.${fy}`, `national.rate.all.${fy}`],
            ),
          ];
        if (sec === 'findings') {
          const out = [];
          const rc = byKind('rate-change')[0];
          if (rc)
            out.push(
              para(
                `The ${cname(rc.subject)} recorded the largest change of any Commission: its non-filer rate rose from ${F(rc.keys[0])} in ${FYL(fy - 1)} to ${F(rc.keys[1])} in ${FYL(fy)}.`,
                'draft',
                rc.keys,
                [rc.id],
              ),
            );
          const th = byKind('threshold-breach');
          if (th.length)
            out.push(
              para(
                `Section rates fell below the ${THRESHOLD}% threshold in ${th.length} cases. The lowest is the ${cname(th[0].subject)} at ${F(th[0].keys[0])}.`,
                'draft',
                [th[0].keys[0], 'threshold.rate'],
                th.map((c) => c.id),
              ),
            );
          const cl = byKind('chronic-late-reporting')[0];
          if (cl)
            out.push(
              para(
                `The ${cname(cl.subject)} reported late for the third year running, ${F(cl.keys[2])} days after the due date this year.`,
                'draft',
                cl.keys,
                [cl.id],
              ),
            );
          const cr = byKind('clarification-ratio-outlier')[0];
          if (cr)
            out.push(
              para(
                `The ${cname(cr.subject)} issued ${F(cr.keys[0])} clarifications per 1,000 declarations, against a median of ${F(cr.keys[1])}.`,
                'draft',
                cr.keys,
                [cr.id],
              ),
            );
          return out;
        }
        const nr = byKind('non-reporting')[0];
        return [
          para(
            `EACC should follow up with each of the ${F(`national.not-reported.${fy}`)} Commissions that did not report, and publish their names with this report.`,
            'draft',
            [`national.not-reported.${fy}`],
            nr ? [nr.id] : [],
          ),
          para(
            `Commissions below the ${THRESHOLD}% threshold should agree an improvement plan with EACC before the next biennial cycle.`,
            'draft',
            ['threshold.rate'],
          ),
        ];
      }
      const aiLabel = (p) =>
        p.ai === 'draft'
          ? `<span class="badge badge-ai">${icon('sparkles', 12)} AI draft</span>`
          : p.ai === 'edited'
            ? `<span class="badge" title="AI draft, edited by the analyst">${icon('pencil', 12)} Edited</span>`
            : '';
      const secChars = (k) => (S.ncr.paras[k] || []).reduce((a, p) => a + p.text.length, 0);
      function narrSection(k, label, { canEdit }) {
        const n = S.ncr;
        const ps = n.paras[k] || [];
        const drafting = n.drafting && (n.drafting === 'all' || n.drafting === k);
        const top = `<div class="top"><label ${canEdit && ps[0] ? `for="f-ncr-paras-${k}-0-text"` : ''}>${label}</label><span class="cc" id="cc-${k}">${num(secChars(k))} characters</span></div>`;
        if (drafting)
          return `<div class="narr">${top}<div class="drafting" role="status" aria-live="polite"><div class="t"><span class="spinner" style="width:14px;height:14px;border-color:rgba(109,74,224,.25);border-top-color:var(--ai)"></span> Drafting ${label.toLowerCase()}…</div><span class="skeleton" style="width:96%"></span><span class="skeleton" style="width:88%"></span><span class="skeleton" style="width:64%"></span></div></div>`;
        const meta = (p, i) => {
          const chips = (p.refs || []).map((r) => figChip(r)).join('');
          const lab = `<span id="lab-${p.id}">${aiLabel(p)}</span>`;
          return p.ai || chips ? `<div class="para-meta">${lab}${chips}</div>` : lab;
        };
        const body = canEdit
          ? ps
              .map(
                (p, i) =>
                  `<div class="para" id="para-${p.id}">${textarea(`ncr.paras.${k}.${i}.text`, {
                    rows: Math.max(2, Math.ceil(p.text.length / 120) + 1),
                    ph: p.cands?.length
                      ? `Write the finding on ${candSubject(p.cands[0])}…`
                      : i
                        ? 'Write a paragraph…'
                        : `Write the ${label.toLowerCase()}…`,
                    cls: p.ai === 'draft' ? 'ai-filled' : '',
                    extra: `aria-label="${label}, paragraph ${i + 1}"`,
                  })}${
                    p.text || ps.length > 1 || p.refs.length
                      ? `<button class="btn btn-ghost icon-btn para-del" data-act="delPara" data-arg="${k}|${p.id}" aria-label="Remove ${label.toLowerCase()} paragraph ${i + 1}" title="Remove paragraph">${icon('trash', 15)}</button>`
                      : ''
                  }${meta(p, i)}</div>`,
              )
              .join('') +
            `<div><button class="btn btn-ghost btn-sm" data-act="addPara" data-arg="${k}">${icon('plus', 15)} Add paragraph</button></div>`
          : ps.filter((p) => p.text).length
            ? ps
                .filter((p) => p.text)
                .map(
                  (p, i) =>
                    `<div class="para"><div class="ro ${p.ai === 'draft' ? 'ai' : ''}">${esc(p.text)}</div>${meta(p, i)}</div>`,
                )
                .join('')
            : `<div class="ro"><span class="muted">Not written yet.</span></div>`;
        return `<div class="narr">${top}<div class="paras">${body}</div></div>`;
      }
      function draftMenu() {
        const n = S.ncr;
        if (n.drafting)
          return `<button class="btn btn-secondary btn-sm" disabled aria-busy="true"><span class="spinner dark" style="width:13px;height:13px"></span> Drafting…</button>`;
        const open = S.menu === 'draft';
        return `<div class="menu-wrap"><button class="btn btn-secondary btn-sm" data-act="menu" data-arg="draft" aria-haspopup="menu" aria-expanded="${open}">${icon('sparkles', 15)} Draft narrative ${icon('down', 14)}</button>${
          open
            ? `<div class="menu" role="menu">${[['all', 'All sections'], ...NSECS]
                .map(
                  ([k, l]) =>
                    `<button role="menuitem" data-act="askDraft" data-arg="${k}">${l}</button>`,
                )
                .join('')}</div>`
            : ''
        }</div>`;
      }
      function draftError() {
        const e = S.ncr.draftErr;
        if (!e) return '';
        return `<div class="callout callout-danger" role="alert" style="flex-wrap:wrap">${icon('alert', 18)}<div style="flex:1;min-width:200px">${esc(e.msg)}</div><div class="row" style="gap:6px"><button class="btn btn-secondary btn-sm" data-act="retryDraft">${icon('refresh', 15)} Try again</button><button class="btn btn-ghost icon-btn" data-act="dismissDraftErr" aria-label="Dismiss">${icon('x', 16)}</button></div></div>`;
      }

      function screenNcr() {
        const crumbs = [
          ['Compliance reports', 'intake'],
          ['National report', 'ncr'],
        ];
        if (!isEacc()) return stateScreen(403, crumbs);
        const fy = +S.ncr.fy;
        const n = S.ncr;
        const rows = intakeRows(fy);
        const submitted = rows.filter((r) => r.rates).length;
        const notRep = rows.length - submitted;
        const asSup = isEaccSup();
        const who = asSup
          ? { name: SUP_EACC.name, role: 'EACC supervisor' }
          : { name: 'Brian Otieno', role: 'EACC analyst' };
        const isAuthor = who.name === n.author;
        const head = `<div class="page-head"><div><h1>Compliance reports</h1></div><div class="actions-r">${fySelect('ncr.fy')}</div></div>`;
        let body;
        if (fy === 2026 || !submitted)
          body = `<div class="card">${empty(`No reports for ${FYL(fy)} yet`, `Form M reports are due ${fmtDate(dueOf(fy))}.`, { icon: 'inbox' })}</div>`;
        else if (n.status === 'none')
          body = `<div class="card">${empty(`National report not built yet`, `${submitted} Commissions reported${notRep ? `, ${notRep} have not` : ''}. You can rebuild later.`, { icon: 'file', action: asSup ? '' : `<button class="btn btn-primary" data-act="ncrBuild">${icon('refresh', 17)} Build from ${submitted} submitted reports</button>` })}</div>`;
        else if (n.status === 'building')

        else {

          const staleB = stale
            ? `<div class="banner callout-warn">${icon('info', 18)}<div><b>${submitted - n.included} new report${submitted - n.included === 1 ? '' : 's'} since this build.</b> Rebuilding keeps the narrative.</div>${!asSup ? `<div class="acts"><button class="btn btn-secondary btn-sm" data-act="ncrBuild">Rebuild</button></div>` : ''}</div>`
            : '';
          const tot = ag.tot;
          const grand = Object.values(tot).reduce(
            (a, x) => ({ e: a.e + x.expected, d: a.d + x.declared }),
            { e: 0, d: 0 },
          );
          const totals = `<section class="card" id="ncr-totals"><div class="sec-h"><h3>National totals</h3></div><div class="table-wrap"><table class="table"><caption style="position:absolute;left:-9999px">National totals per Form M section</caption><thead><tr><th>Section</th><th class="num">Expected</th><th class="num">Declared</th><th class="num">Did not declare</th><th style="min-width:180px">Rate</th></tr></thead><tbody>${['initial', 'biennial', 'final'].map((k, i) => `<tr><td style="font-weight:500">${i + 1}. ${SEC_L[k]} declarations</td><td class="num">${num(tot[k].expected)}</td><td class="num">${num(tot[k].declared)}</td><td class="num">${num(tot[k].expected - tot[k].declared)}</td><td>${rateBar(tot[k].declared, tot[k].expected, { sub: false })}</td></tr>`).join('')}<tr><td style="font-weight:600">All sections</td><td class="num" style="font-weight:600">${num(grand.e)}</td><td class="num" style="font-weight:600">${num(grand.d)}</td><td class="num" style="font-weight:600">${num(grand.e - grand.d)}</td><td>${rateBar(grand.d, grand.e, { sub: false })}</td></tr></tbody></table></div></section>`;
          const perPg = Math.min(n.page || 1, Math.max(1, Math.ceil(ag.per.length / PAGE)));
          const per = `<section class="card" id="ncr-per"><div class="sec-h"><h3>By Commission</h3></div><div class="table-wrap"><table class="table"><caption style="position:absolute;left:-9999px">Rates per Commission</caption><thead><tr><th>Commission</th><th>Status</th><th>Initial</th><th>Biennial</th><th>Final</th></tr></thead><tbody>${ag.per
            .slice((perPg - 1) * PAGE, perPg * PAGE)
            .map(
              (r) =>
                `<tr id="ncr-row-${r.slug}"><td style="font-weight:500;white-space:normal;min-width:200px">${esc(r.name)}</td><td>${intakeBadge(r.status)}</td>${['initial', 'biennial', 'final'].map((k) => `<td style="min-width:130px">${rateBar(r.rates[k].declared, r.rates[k].expected)}</td>`).join('')}</tr>`,
            )
            .join(
              '',
            )}</tbody></table></div>${Kit.pager({ page: perPg, pageSize: PAGE, total: ag.per.length, act: 'ncrPage' })}</section>`;
          const status = canEdit
            ? `<span class="autosave" id="ncr-save" aria-live="polite">${n.saved ? `${icon('check', 13, 2.4)} Saved ${n.saved}` : 'Autosaves'}</span>${draftMenu()}`

              : '<span class="small muted">Written by the analyst</span>';
          const narrative = `<section class="card" id="ncr-narrative"><div class="sec-h narr-h"><h3>Narrative</h3><div class="right">${status}</div></div><div class="sec-b stack-lg">${draftError()}${NSECS.map(([k, l]) => narrSection(k, l, { canEdit })).join('')}</div></section>`;
          body = `${sb}${staleB}<div class="stack" style="margin-top:16px">${totals}${per}${patternsPanel(canEdit)}${narrative}</div>`;
        }
        if (n.view === 'error') body = loadError('the national report', 'retryNcr');
        return consoleShell(`<main class="cpage">${head}${eaccTabs('ncr')}${body}</main>`, {
          crumbs,
          active: 'Compliance reports',
        });
      }

      const cname = (slug) => COMMISSIONS.find((c) => c.slug === slug)?.name || slug;

        const crumbs = [

          all: items.length,

        const head = `<div class="page-head"><div><h1>Referrals received</h1></div></div>`;
        let list;
        if (S.ref.view === 'loading')
          list = `<div class="table-wrap"><table class="table"><tbody>${skeletonRows(6, 6)}</tbody></table></div>`;

          list = `<div style="padding:8px">${loadError('referrals', 'retryRef').replace('class="card"', '')}</div>`;
        else if (S.ref.view === 'empty' || !items.length)
          list = empty('No referrals received yet', 'Approved Commission referrals appear here.', {
            icon: 'flag',

        else if (!rows.length)
          list = empty('No referrals with this status', 'Choose another filter to see more.', {
            icon: 'filter',
            action:
              '<button class="btn btn-secondary btn-sm" data-act="refFilter" data-arg="all">Show all</button>',

        else {

                ? `<button class="btn btn-secondary btn-sm" data-act="askPush" data-arg="${r.id}">${icon('refresh', 14)} Retry</button>`
                : `<button class="btn btn-ghost btn-sm" data-act="openRef" data-arg="${r.id}">View</button>`;
          const statusCell = (r) =>
            `${icmsBadge(r)}${r.icmsStatus === 'registered' ? `<div class="sub mono" style="margin-top:4px">${esc(r.icmsCaseNumber)}</div>` : r.icmsStatus === 'pushed' ? '<div class="sub">Waiting for case number</div>' : r.icmsStatus === 'push-failed' ? `<div class="err-line">${esc(r.error)}</div>` : ''}`;

            ${shown.map((r) => `<tr class="click" data-act="openRef" data-arg="${r.id}"><td class="mono nowrap" style="font-weight:600">${esc(r.reference)}</td><td style="white-space:normal;min-width:160px">${esc(cname(r.slug))}</td><td style="min-width:150px">${GROUNDS_L[r.grounds]}</td><td class="nowrap">${fmtDate(r.sentAt)}</td><td><a class="btn btn-ghost btn-xs" href="../../../services/documents/prototype/documents.prototype.html#referral-package" target="_blank" rel="noopener" data-act="dlPackage" data-arg="${r.id}">${icon('download', 14)} Package</a><div><span class="conf">${icon('lock', 10)} Confidential</span></div></td><td style="min-width:160px">${statusCell(r)}</td><td class="right nowrap">${actionFor(r)}</td></tr>`).join('')}

        return consoleShell(
          `<main class="cpage">${head}<div class="card">${S.ref.view === 'ok' && items.length ? chips : ''}${list}</div></main>`,

          dialog({
