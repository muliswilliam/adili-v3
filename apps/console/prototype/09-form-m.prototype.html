<!doctype html>
<!-- PROTOTYPE - throwaway. Question: how do Commission officers compile, review, sign off and submit Form M, and how does EACC take in reports, consolidate them and hand referrals to ICMS? Covers tickets #221, #223, #226, #230 (plus #233 NCR builder and #236 referrals intake from spec 09). Open by double-clicking. State is in memory. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dials - Form M and EACC intake (prototype)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../../packages/ui/prototype/kit.css" />
    <style>
      /* ---------- periods ---------- */
      .periods {
        display: grid;
        gap: 10px;
        grid-template-columns: minmax(0, 1fr);
        margin-bottom: 18px;
      }
      @container app (min-width: 700px) {
        .periods {
          grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        }
      }
      .period {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 14px 16px;
        border-radius: 14px;
        background: var(--surface);
        box-shadow: var(--shadow-card);
        border: 0;
        font: inherit;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }
      .period:hover {
        box-shadow:
          0 0 0 1px var(--line-2),
          0 4px 14px -6px rgba(0, 0, 0, 0.12);
      }
      .period.on {
        box-shadow: var(--shadow-selected);
      }
      .period .t {
        font-weight: 600;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .period .s {
        font-size: 13px;
        color: var(--muted);
      }

      /* ---------- banners ---------- */
      .banner {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 14px 16px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.5;
        margin-bottom: 14px;
      }
      .banner svg {
        flex: none;
        margin-top: 2px;
      }
      .banner b {
        font-weight: 600;
      }
      .banner .acts {
        margin-left: auto;
        display: flex;
        gap: 8px;
        flex: none;
        align-self: center;
      }
      .banner > div:not(.acts) {
        flex: 1;
        min-width: 0;
      }
      @container app (max-width: 699px) {
        .banner {
          flex-wrap: wrap;
        }
        .banner .acts {
          margin-left: 30px;
          width: calc(100% - 30px);
        }
      }

      /* ---------- workspace layout ---------- */
      .fm-split {
        display: grid;
        gap: 20px;
        grid-template-columns: minmax(0, 1fr);
      }
      @container app (min-width: 1200px) {
        .fm-split {
          grid-template-columns: minmax(0, 1fr) 300px;
          align-items: start;
        }
        .fm-side {
          position: sticky;
          top: 80px;
        }
      }
      .fm-doc {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .statusbar {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        padding: 16px 20px;
      }
      .statusbar h2 {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .statusbar .meta {
        font-size: 13px;
        color: var(--muted);
      }
      .statusbar .meta.reviewed {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 2px;
        color: var(--ok);
        font-weight: 500;
      }
      .statusbar .acts {
        margin-left: auto;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      @container app (max-width: 699px) {
        .statusbar .acts {
          margin-left: 0;
          width: 100%;
        }
        .statusbar .acts .btn {
          flex: 1;
        }
      }

      .part-h {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 6px 2px 0;
      }
      .part-h h2 {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .part-h .line {
        flex: 1;
        height: 1px;
        background: var(--line);
        align-self: center;
      }

      /* ---------- FormMSection primitive ---------- */
      .fms-h {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 18px 20px 14px;
      }
      .fms-n {
        flex: none;
        width: 28px;
        height: 28px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: var(--sunken);
        font-weight: 600;
        font-size: 14px;
      }
      .fms-h h3 {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.35;
      }
      .info-tip {
        display: inline-grid;
        place-items: center;
        width: 20px;
        height: 20px;
        margin-left: 4px;
        border-radius: 50%;
        color: var(--muted);
        vertical-align: -4px;
        cursor: help;
      }
      .info-tip:hover,
      .info-tip:focus-visible {
        color: var(--ink);
        background: var(--sunken);
      }
      .fms-h .save {
        margin-left: auto;
        flex: none;
        font-size: 13px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      .counts {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 0;
        margin: 0 20px;
        border-radius: 12px;
        box-shadow: 0 0 0 1px var(--line);
        overflow: hidden;
      }
      @container app (min-width: 700px) {
        .counts {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
      .counts > div {
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        border-bottom: 1px solid var(--line);
        background: #fafafa;
      }
      .counts > div:last-child {
        border-bottom: 0;
      }
      @container app (min-width: 700px) {
        .counts > div {
          border-bottom: 0;
          border-right: 1px solid var(--line);
        }
        .counts > div:last-child {
          border-right: 0;
        }
      }
      .counts .k {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.35;
      }
      .counts .k b {
        color: var(--ink-2);
        font-weight: 600;
      }
      .counts .v {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }
      .fms-rate {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 20px 4px;
        font-size: 13px;
        color: var(--muted);
        flex-wrap: wrap;
      }
      .fms-list {
        margin-top: 14px;
        border-top: 1px solid var(--line);
      }
      .fms-list caption {
        caption-side: top;
        text-align: left;
        padding: 12px 16px 10px;
        font-size: 14px;
        font-weight: 600;
        color: var(--ink);
      }
      .fms-list .table td {
        vertical-align: top;
      }
      .fms-list .table td.no {
        color: var(--muted);
        width: 36px;
        font-variant-numeric: tabular-nums;
      }
      .remark {
        min-height: 0;
        height: auto;
        padding: 7px 10px;
        font-size: 14px;
        line-height: 1.4;
        min-width: 220px;
      }
      .remark.edited {
        box-shadow:
          0 0 0 1px #d4d4d4,
          0 0 0 3px #f5f5f5;
      }
      .tag-edited {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
      .fms-none {
        margin: 14px 20px 20px;
      }
      .fms-foot {
        padding: 14px 20px 18px;
      }

      /* ---------- RateBar primitive ---------- */
      .rate {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-width: 104px;
      }
      .rate .bar {
        position: relative;
        flex: 1;
        min-width: 48px;
        height: 6px;
        border-radius: 6px;
        background: var(--sunken);
        overflow: hidden;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.03);
      }
      .rate .bar i {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        border-radius: 6px;
        background: var(--ink);
      }
      .rate.low .bar i {
        background: #d98a00;
      }
      .rate.bad .bar i {
        background: var(--danger);
      }
      .rate .pc {
        font-size: 13px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        min-width: 44px;
        text-align: right;
      }
      .rate.low .pc {
        color: var(--warn);
      }
      .rate.bad .pc {
        color: var(--danger);
      }
      .rate-sub {
        white-space: nowrap;
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        margin-top: 2px;
      }
      .rate.lg {
        width: 100%;
        max-width: 360px;
      }
      .rate.lg .bar {
        height: 8px;
      }

      /* ---------- Part I / III ---------- */
      .roman {
        font-size: 13px;
        color: var(--muted);
        font-weight: 500;
      }
      .sig {
        display: grid;
        gap: 14px;
        grid-template-columns: minmax(0, 1fr);
      }
      @container app (min-width: 700px) {
        .sig {
          grid-template-columns: 1fr 1fr;
        }
      }
      .sig > div {
        padding: 14px 16px;
        border-radius: 12px;
        box-shadow: 0 0 0 1px var(--line);
        background: #fafafa;
      }
      .sig h4 {
        font-size: 13px;
        font-weight: 600;
        color: var(--ink-2);
        margin-bottom: 8px;
      }
      .sig .line {
        display: flex;
        gap: 10px;
        font-size: 14px;
        padding: 4px 0;
      }
      .sig .line .k {
        color: var(--muted);
        width: 96px;
        flex: none;
      }
      .sig .pend {
        color: var(--muted);
        font-style: italic;
      }

      /* ---------- side ---------- */
      .vstep {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
      }
      .vstep li {
        position: relative;
        display: grid;
        grid-template-columns: 24px 1fr;
        gap: 10px;
        padding-bottom: 14px;
      }
      .vstep li::before {
        content: '';
        position: absolute;
        left: 11px;
        top: 26px;
        bottom: 2px;
        width: 1.5px;
        background: var(--line);
      }
      .vstep li:last-child {
        padding-bottom: 0;
      }
      .vstep li:last-child::before {
        display: none;
      }
      .vstep .n {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 600;
        box-shadow: inset 0 0 0 1.5px var(--line-2);
        background: var(--surface);
        color: var(--muted);
      }
      .vstep li.done .n {
        background: var(--ok-soft);
        color: var(--ok);
        box-shadow: none;
      }
      .vstep li.cur .n {
        background: var(--ink);
        color: #fff;
        box-shadow: none;
      }
      .vstep .t {
        font-size: 14px;
        font-weight: 500;
        line-height: 1.35;
        padding-top: 2px;
      }
      .vstep .s {
        font-size: 13px;
        color: var(--muted);
        margin-top: 1px;
      }
      .toc {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .toc a {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-radius: 8px;
        font-size: 14px;
        color: var(--ink-2);
        text-decoration: none;
        cursor: pointer;
      }
      .toc a:hover {
        background: var(--sunken);
        color: var(--ink);
      }
      .toc a .c {
        margin-left: auto;
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      /* ---------- sticky footer ---------- */
      /* bottom offset keeps the bar clear of the PROTOTYPE toolbar */
      .fm-foot {
        position: sticky;
        bottom: 64px;
        z-index: 15;
        margin-top: 18px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        padding: 12px 16px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(10px);
        box-shadow: var(--shadow-pop);
      }
      .fm-foot .due {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 500;
      }
      .fm-foot .why {
        font-size: 13px;
        color: var(--muted);
      }
      .fm-foot .acts {
        margin-left: auto;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      @container app (max-width: 699px) {
        .fm-foot {
          gap: 8px;
          padding: 10px 12px;
        }
        .fm-foot .why {
          display: none;
        }
        .fm-foot .acts {
          margin-left: 0;
          width: 100%;
        }
        .fm-foot .acts .btn {
          flex: 1;
        }
      }
      body.mobile .fm-foot {
        bottom: 8px;
      }

      /* ---------- compiling ---------- */
      .compile-steps {
        display: grid;
        gap: 10px;
        max-width: 420px;
        margin: 18px auto 0;
        text-align: left;
      }
      .compile-steps div {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        color: var(--muted);
      }
      .compile-steps div.done {
        color: var(--ink-2);
      }
      .compile-steps div.cur {
        color: var(--ink);
        font-weight: 500;
      }
      .compile-steps .ic {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        flex: none;
        box-shadow: inset 0 0 0 1.5px var(--line-2);
      }
      .compile-steps div.done .ic {
        background: var(--ok-soft);
        color: var(--ok);
        box-shadow: none;
      }

      /* ---------- submitted ---------- */
      .sub-hero {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        padding: 22px 22px 18px;
        flex-wrap: wrap;
      }
      .sub-hero .mark {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: var(--ok-soft);
        color: var(--ok);
        flex: none;
      }
      .sub-hero.late .mark {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .sub-hero h2 {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.015em;
      }
      .refchip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        padding: 0 6px 0 12px;
        border-radius: 10px;
        background: var(--sunken);
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .refchip .ref {
        font-size: 14px;
      }
      .hash {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 12px;
        word-break: break-all;
        color: var(--ink-2);
        line-height: 1.5;
      }
      .dl-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        padding: 0 22px 20px;
      }

      /* ---------- intake ---------- */
      .cmark {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        font-size: 10px;
        font-weight: 700;
        background: var(--sunken);
        color: var(--ink-2);
        flex: none;
        letter-spacing: 0.02em;
      }
      .ochip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 22px;
        padding: 0 8px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        background: var(--warn-soft);
        color: var(--warn);
        white-space: nowrap;
        margin: 2px 4px 2px 0;
      }
      .intake-cards {
        display: none;
      }
      @container app (max-width: 799px) {
        .intake-table {
          display: none;
        }
        .intake-cards {
          display: grid;
        }
      }
      .icard {
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        display: grid;
        gap: 10px;
        cursor: pointer;
      }
      .icard:last-child {
        border-bottom: 0;
      }
      .icard .rates {
        display: grid;
        gap: 6px;
      }
      .icard .rates > div {
        display: grid;
        grid-template-columns: 70px 1fr;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--muted);
      }
      .intake-table .chase-line {
        white-space: normal;
        align-items: flex-start;
        max-width: 200px;
      }
      .intake-table .chase-line svg {
        margin-top: 3px;
        flex: none;
      }
      .chase-line {
        font-size: 13px;
        color: var(--muted);
        display: inline-flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }

      /* ---------- NCR ---------- */
      .narr {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .narr .top {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .narr .top label {
        font-size: 14px;
        font-weight: 600;
      }
      .narr .top .cc {
        margin-left: auto;
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .narr .textarea {
        min-height: 130px;
      }
      .narr .ro {
        padding: 12px 14px;
        border-radius: 10px;
        background: #fafafa;
        box-shadow: 0 0 0 1px var(--line);
        font-size: 14px;
        white-space: pre-wrap;
        line-height: 1.6;
      }
      /* ---------- NCR: patterns, figure citations, AI narrative (spec 09b) ---------- */
      .pat-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
        padding: 16px 20px 20px;
      }
      @container app (min-width: 760px) {
        .pat-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @container app (min-width: 1180px) {
        .pat-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
      .pat {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 14px 16px;
        border-radius: 12px;
        background: #fafafa;
        box-shadow: 0 0 0 1px var(--line);
        min-width: 0;
      }
      .pat.cited {
        background: var(--surface);
        box-shadow: 0 0 0 1px var(--line-2);
      }
      .pat .subj {
        font-weight: 600;
        font-size: 14px;
        line-height: 1.35;
        margin-top: 4px;
      }
      .pat .val {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
      }
      .pat .val b {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
        font-variant-numeric: tabular-nums;
      }
      .pat .val span,
      .pat .cmp {
        font-size: 13px;
        color: var(--muted);
      }
      .pat .cmp {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        font-variant-numeric: tabular-nums;
      }
      .pat .act {
        margin-top: auto;
        padding-top: 8px;
      }
      .pat .done {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 500;
        color: var(--ok);
        height: 30px;
      }
      .pat.skel {
        min-height: 150px;
      }
      .fig {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        max-width: 100%;
        height: 24px;
        padding: 0 9px 0 7px;
        border: 0;
        border-radius: 7px;
        background: var(--sunken);
        color: var(--ink-2);
        font-size: 13px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .fig > span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .fig b {
        font-weight: 600;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      .fig svg {
        flex: none;
        color: var(--muted);
      }
      .fig:hover {
        background: #e5e5e5;
      }
      .fig.bad {
        background: var(--warn-soft);
        color: #973c00;
        cursor: default;
      }
      .fig.bad svg {
        color: var(--warn);
      }
      .narr-h {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .narr-h .right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      @container app (max-width: 520px) {
        .narr-h .right {
          margin-left: 0;
        }
      }
      .paras {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      #ncr-totals,
      #ncr-per,
      #ncr-patterns,
      #ncr-narrative,
      .para {
        scroll-margin-top: 80px;
      }
      .para {
        position: relative;
      }

              return `<tr><td class="no">${idx + 1}.</td><td style="min-width:170px"><div style="font-weight:500">${esc(r.name)}</div><div class="sub">${esc(r.designation)}</div><div class="sub mono">${esc(r.identifier)}</div></td><td class="nowrap">${fmtDate(r.date)}</td><td style="min-width:150px"><div>${r.actionTaken === 'none' ? '<span class="muted">No action</span>' : esc(ACTION_L[r.actionTaken])}</div><div style="margin-top:5px">${r.complied === 'yes' ? badge(icon('check', 12, 2.6) + ' Complied', 'ok') : r.complied === 'pending' ? badge(icon('clock', 12, 2.2) + ' Pending', 'warn') : badge(icon('x', 12, 2.4) + ' Not complied', 'danger')}</div></td>
              <td>${editable ? `<textarea id="rm-${k}-${idx}" class="textarea remark ${edited ? 'edited' : ''}" rows="${(r.remarks || '').length > 58 ? 3 : 2}" data-bind="${bind}" maxlength="500" aria-label="Remarks for ${esc(r.name)}">${esc(r.remarks || '')}</textarea>${edited ? `<div class="tag-edited">${icon('pencil', 11)} Edited by Samuel Njoroge</div>` : ''}` : `<span style="font-size:14px">${esc(r.remarks || '-')}</span>`}</td></tr>`;
            })
            .join(
              '',
            )}</tbody></table></div>${total > PAGE ? keyedPager(pageKey + k, { page: p, pageSize: PAGE, total }) : ''}</div>`;
        return `<section class="card anchor" id="sec-${k}" aria-labelledby="h-${k}">
          <div class="fms-h"><span class="fms-n">${m.n}</span><div style="min-width:0"><h3 id="h-${k}">${m.title}${tip(m.legal)}</h3></div>${editable ? `<span class="save" id="save-${saveKey}">${st === 'saving' ? '<span class="spinner dark" style="width:12px;height:12px"></span> Saving…' : st === 'saved' ? `${icon('check', 13, 2.4)} Remarks saved` : ''}</span>` : ''}</div>
          ${
            sec.noCycleInPeriod
              ? `<div class="callout callout-info fms-none">${icon('info', 16)}<span>No biennial cycle in this period.</span></div>`
              : `
          <div class="counts"><div><span class="k"><b>(a)</b> ${m.a}</span><span class="v">${num(sec.expected)}</span></div><div><span class="k"><b>(b)</b> ${m.b}</span><span class="v">${num(sec.declared)}</span></div><div><span class="k"><b>(c)</b> ${m.c}</span><span class="v">${num(sec.notDeclared)}</span></div></div>
          <div class="fms-rate">${rateBar(sec.declared, sec.expected, { lg: true, sub: false })}</div>
          ${total ? table : `<div class="callout callout-ok fms-none">${icon('check', 16)}<span><b>(d)</b> No officers to list.</span></div>`}`
          }
          ${sec.noCycleInPeriod || total ? '<div style="height:6px"></div>' : ''}
        </section>`;
      }

      // Full Form M document. mode: 'edit' (workspace) or 'read' (viewer / submitted).
      function formMDoc(doc, { edit = false, r = null, pages = {}, pageKey = '' } = {}) {
        const canRemarks = edit && role() === 'supervisor';
        const canManual = edit && role() === 'commission-admin';
        const p1 = doc.partI;
        const p2 = doc.partII;
        const p3 = doc.partIII;
        const fyBase = r ? `fm.reports.${r.fy}.doc` : '';
        const piErr = S.fm.piErrors || {};
        const partI = `<section class="card anchor" id="sec-p1" aria-labelledby="h-p1"><div class="sec-h"><h3 id="h-p1">Part I: Description of the Responsible Commission</h3>${canManual ? `<span class="spacer"></span><span class="badge badge-brand">${icon('pencil', 12)} You fill this</span>` : ''}</div><div class="sec-b">
          ${
            canManual
              ? `<div class="stack">
            <div class="kv"><div><div class="k"><span class="roman">(i)</span> Name of the Responsible Commission</div><div class="v">${esc(p1.commissionName)}</div></div><div><div class="k"><span class="roman">(v)</span> Period for which the compliance report is made</div><div class="v">1st July ${p1.period.financialYearStart} to 30th June ${p1.period.financialYearStart + 1}</div></div></div>
            <div class="grid-2">${field('(ii) Contact details', input(`${fyBase}.partI.contactDetails`, { ph: 'e.g. +254 20 222 3901', extra: 'maxlength="200"' }), { id: `f-${fyBase.replace(/\./g, '-')}-partI-contactDetails`, error: piErr.contactDetails })}${field('(iv) Email address', input(`${fyBase}.partI.emailAddress`, { type: 'email', ph: 'e.g. compliance@publicservice.go.ke', extra: 'maxlength="200"' }), { id: `f-${fyBase.replace(/\./g, '-')}-partI-emailAddress`, error: piErr.emailAddress })}</div>
            ${field('(iii) Physical address', input(`${fyBase}.partI.physicalAddress`, { extra: 'maxlength="200"' }), { id: `f-${fyBase.replace(/\./g, '-')}-partI-physicalAddress`, error: piErr.physicalAddress })}
            <div class="row"><span class="spacer"></span><span class="autosave" id="save-p1">${S.fm.saveState.p1 === 'saving' ? '<span class="spinner dark" style="width:12px;height:12px"></span> Saving…' : S.fm.saveState.p1 === 'saved' ? `${icon('check', 13, 2.4)} Saved` : 'Autosaves'}</span></div>
          </div>`
              : `<div class="kv">
            <div><div class="k"><span class="roman">(i)</span> Name of the Responsible Commission</div><div class="v">${esc(p1.commissionName)}</div></div>
            <div><div class="k"><span class="roman">(ii)</span> Contact details</div><div class="v">${p1.contactDetails ? esc(p1.contactDetails) : '<span class="muted" style="font-weight:400">Not filled yet</span>'}</div></div>
            <div><div class="k"><span class="roman">(iii)</span> Physical address</div><div class="v">${p1.physicalAddress ? esc(p1.physicalAddress) : '<span class="muted" style="font-weight:400">Not filled yet</span>'}</div></div>
            <div><div class="k"><span class="roman">(iv)</span> Email address</div><div class="v">${p1.emailAddress ? esc(p1.emailAddress) : '<span class="muted" style="font-weight:400">Not filled yet</span>'}</div></div>
            <div><div class="k"><span class="roman">(v)</span> Period for which the compliance report is made</div><div class="v">1st July ${p1.period.financialYearStart} to 30th June ${p1.period.financialYearStart + 1}</div></div>
          </div>`
          }
        </div></section>`;

        const clarTotal = p2.clarifications.total ?? p2.clarifications.items.length;
        const cp = pages[pageKey + 'clar'] || 1;
        const clarRows = pageRows(p2.clarifications, clarTotal, cp);
        const sec4 = `<section class="card anchor" id="sec-clar" aria-labelledby="h-clar"><div class="fms-h"><span class="fms-n">4</span><div><h3 id="h-clar">Clarifications sought from public officers who made an initial, biennial or final declaration (s. 33)${tip('Nature is stated in general terms only. The content of a clarification never appears in this report.')}</h3></div></div>
          ${
            clarTotal
              ? `<div class="fms-list" style="margin-top:0"><div class="table-wrap"><table class="table"><caption>Section 4: List of public officers from whom clarification was sought and status of compliance</caption>
            <thead><tr><th>No.</th><th>Name</th><th>Designation</th><th>Nature of clarification sought</th><th>Status of compliance</th></tr></thead>
            <tbody>${clarRows.map((c, i) => `<tr><td class="no">${(cp - 1) * PAGE + i + 1}.</td><td><div style="font-weight:500">${esc(c.name)}</div><div class="sub mono">${esc(c.identifier)}</div></td><td>${esc(c.designation)}</td><td>${esc(c.natureInGeneralTerms)}${c.clarificationReference ? `<div class="sub mono">${esc(c.clarificationReference)}</div>` : ''}</td><td>${badge(CLAR_L[c.statusOfCompliance], CLAR_K[c.statusOfCompliance])}</td></tr>`).join('')}</tbody></table></div>
            ${clarTotal > PAGE ? keyedPager(pageKey + 'clar', { page: cp, pageSize: PAGE, total: clarTotal }) : ''}</div>`
              : `<div class="callout callout-info fms-none">${icon('info', 16)}<span>No clarifications sought.</span></div>`
          }
        </section>`;

        const ar = p2.accessRequests;
        const sec5 = `<section class="card anchor" id="sec-access" aria-labelledby="h-access"><div class="fms-h"><span class="fms-n">5</span><div><h3 id="h-access">Access to information in a declaration of income, assets and liabilities or a clarification${tip('A person may, for purposes of section 36 of the Act, apply to the Responsible Commission to access information contained in a declaration or clarification made under the Act.')}</h3></div></div>
          ${ar.dataUnavailable ? `<div class="callout callout-info" style="margin:0 20px 14px">${icon('info', 16)}<span>Access request data is not yet captured on Adili.</span></div>` : ''}
          <div class="counts"><div><span class="k"><b>(a)</b> Number of requests for access to information received</span><span class="v">${num(ar.received)}</span></div><div><span class="k"><b>(b)</b> Number of requests for access to information granted</span><span class="v">${num(ar.granted)}</span></div><div><span class="k"><b>(c)</b> Number of requests for access to information declined</span><span class="v">${num(ar.declined)}</span></div></div>
          <div class="fms-foot"><div class="small" style="font-weight:500;color:var(--ink-2)">(d) Reasons for declining requests for access to information</div><div class="small muted" style="margin-top:4px">${ar.declineReasons.length ? ar.declineReasons.map((x) => `${esc(x.reason)}: ${x.count}`).join(', ') : 'None declined.'}</div></div>
        </section>`;

        const cm = p2.complaints;
        const partB = `<section class="card anchor" id="sec-b" aria-labelledby="h-b"><div class="sec-h"><h3 id="h-b">B. Complaints and investigations</h3>${canManual ? `<span class="spacer"></span><span class="badge badge-brand">${icon('pencil', 12)} You fill this</span>` : ''}</div>
          <div class="sec-b stack">
            <div><div style="font-weight:500;font-size:14px"><span class="roman" style="margin-right:6px">6.</span>Does the Responsible Commission maintain a register of complaints on allegations of violation of the provisions of the Act?</div>
              <div style="margin-top:10px">${
                canManual
                  ? `<div style="max-width:320px">${choices(
                      `${fyBase}.partII.complaints.registerMaintained`,
                      [
                        { k: true, label: 'Yes' },
                        { k: false, label: 'No' },
                      ].map((o) => ({ ...o, k: String(o.k) })),
                      'c2',
                    )}</div>`
                  : `<span class="v" style="font-weight:500">${cm.registerMaintained === true || cm.registerMaintained === 'true' ? 'Yes' : cm.registerMaintained === false || cm.registerMaintained === 'false' ? 'No' : '<span class="muted" style="font-weight:400">Not answered yet</span>'}</span>`
              }</div></div>
            <div><div style="font-weight:500;font-size:14px"><span class="roman" style="margin-right:6px">7.</span>Number of complaints received within the reporting period, and action taken: <span class="tabular">${num(cm.items.length)}</span></div></div>
          </div>
          ${
            cm.items.length
              ? `<div class="fms-list" style="margin-top:0"><div class="table-wrap"><table class="table"><caption>Section 7: Complaints received and action taken</caption><thead><tr><th>No.</th><th>Name</th><th>Designation</th><th>Nature of complaint</th><th>Status</th>${canManual ? '<th><span style="position:absolute;left:-9999px">Row actions</span></th>' : ''}</tr></thead>
            <tbody>${cm.items.map((c, i) => `<tr><td class="no">${i + 1}.</td><td><div style="font-weight:500">${esc(c.name)}</div><div class="sub mono">${esc(c.identifier)}</div></td><td>${esc(c.designation)}</td><td>${esc(c.nature)}</td><td>${esc(c.status)}</td>${canManual ? `<td class="right nowrap"><button class="btn btn-ghost btn-xs" data-act="editComplaint" data-arg="${i}">Edit</button><button class="btn btn-danger-ghost btn-xs" data-act="removeComplaint" data-arg="${i}" aria-label="Remove complaint ${i + 1}">${icon('trash', 14)}</button></td>` : ''}</tr>`).join('')}</tbody></table></div></div>`
              : `<div class="callout callout-info fms-none" style="margin-top:0">${icon('info', 16)}<span>No complaints recorded.</span></div>`
          }
          ${canManual ? `<div class="fms-foot" style="padding-top:${cm.items.length ? 14 : 0}px"><button class="btn btn-secondary btn-sm" data-act="addComplaint">${icon('plus', 15)} Add complaint</button></div>` : ''}
        </section>`;

        const sigLine = (k, v, pend) =>
          `<div class="line"><span class="k">${k}</span><span class="${v ? '' : 'pend'}">${v ? esc(v) : pend}</span></div>`;
        const partIII = `<section class="card anchor" id="sec-p3" aria-labelledby="h-p3"><div class="sec-h"><h3 id="h-p3">Part III: Authentication of information</h3></div><div class="sec-b"><div class="sig">
          <div><h4>Compiled by</h4>${sigLine('Name', p3.compiledBy.name, 'On review')}${sigLine('Designation', p3.compiledBy.designation, '-')}${sigLine('Date', p3.compiledBy.date && fmtDate(p3.compiledBy.date), '-')}</div>
          <div><h4>Confirmed by</h4>${sigLine('Name', p3.confirmedBy.name, 'On confirmation')}${sigLine('Date', p3.confirmedBy.date && fmtDate(p3.confirmedBy.date), '-')}<div class="small muted" style="margin-top:6px">Authorized Officer of the Responsible Commission</div></div>
        </div></div></section>`;

        return `${partI}
          <div class="part-h"><h2>Part II: Declaration of income, assets and liabilities</h2><span class="line"></span></div>
          ${['initial', 'biennial', 'final'].map((k) => formMSection(k, p2[k], { editable: canRemarks, pages, pageKey, fyBase })).join('')}
          ${sec4}${sec5}${partB}${partIII}`;
      }

      /* ============================== shared screens ============================== */
      const protoDate = () =>
        S.today !== REAL_TODAY
          ? `<span class="proto-date" title="Prototype only: the demo date is simulated">${icon('calendar', 13)} Prototype date: ${fmtDate(S.today)}</span>`
          : '';
      function stateScreen(kind, crumbs) {
        const k = {
          403: [
            'ban',
            'You do not have access to this page',
            'This page is for EACC analysts and supervisors.',
          ],
          404: [
            'search',
            'Page not found',
            'This page does not exist or you do not have access to it.',
          ],
        }[kind];
        return consoleShell(
          `<main class="cpage"><div class="state-page"><div class="ico">${icon(k[0], 24)}</div><h1>${k[1]}</h1><p>${k[2]}</p><div style="margin-top:20px"><a class="btn btn-secondary" href="01-commissions.prototype.html#${isCommissionRole() || role() === 'reviewer' ? 'my-commission' : 'commissions'}">Go to overview</a></div></div></main>`,
          { crumbs },
        );
      }
      function loadError(what, act) {
        return `<div class="card"><div class="empty" style="padding:48px 20px"><div class="art" style="grid-template-columns:30px"><span style="background:var(--danger-soft);color:var(--danger)">${icon('wifiOff', 16)}</span></div><h4>We could not load ${what}</h4><p>Check your connection and try again.</p><div style="margin-top:14px"><button class="btn btn-secondary" data-act="${act}">${icon('refresh', 16)} Try again</button></div></div></div>`;
      }

      /* ============================== Commission: Form M workspace (#223, #226) ============================== */
      function periodCard(r) {
        const y = r.fy;
        const cur = daysTo(`${y}-07-01`) <= 0 && daysTo(`${y + 1}-06-30`) >= 0;
        let s;
        if (r.status === 'submitted')
          s = `Submitted ${fmtDate(r.submittedAt)}${r.late ? ' (late)' : ''}`;
        else if (r.status === 'not-started')
          s =
            daysTo(previewFrom(y)) > 0
              ? `Preview from ${fmtDate(previewFrom(y))} · Due ${fmtDate(dueOf(y))}`
              : `Preview available · Due ${fmtDate(dueOf(y))}`;
        else {
          const n = daysTo(dueOf(y));
          s =
            n >= 0
              ? `Due ${fmtDate(dueOf(y))} · ${n} day${n === 1 ? '' : 's'} left`
              : `Was due ${fmtDate(dueOf(y))} · ${-n} days overdue`;
        }
        return `<button class="period ${S.fm.sel === y ? 'on' : ''}" data-act="selPeriod" data-arg="${y}" aria-pressed="${S.fm.sel === y}"><span class="t">${FYL(y)} ${cur ? badge('Current', 'brand') : ''} ${reportStatusBadge(r)}</span><span class="s">${s}</span></button>`;
      }
      function workspaceBanners(r) {
        const out = [];
        if (S.fm.stepUpFailed)
          out.push(
            `<div class="banner callout-danger" role="alert">${icon('alert', 18)}<div><b>We could not confirm your identity. Try again.</b><div>Form M has not been submitted.</div></div><div class="acts"><button class="btn btn-primary btn-sm" data-act="startConfirm">${icon('shield', 15)} Confirm identity</button></div></div>`,
          );
        if (S.fm.banner === 'already')
          out.push(
            `<div class="banner callout-warn" role="alert">${icon('alert', 18)}<div><b>This report was already submitted.</b> Someone else confirmed it first.</div></div>`,
          );
        if (S.fm.banner === 'incomplete')
          out.push(
            `<div class="banner callout-danger" role="alert">${icon('alert', 18)}<div><b>Form M is not complete.</b> Fill contact details and email address in Part I.</div><div class="acts"><button class="btn btn-secondary btn-sm" data-act="scrollTo" data-arg="sec-p1">Go to Part I</button></div></div>`,
          );
        if (!['draft', 'reviewed'].includes(r.status) || r.preview) return out.join('');
        const n = daysTo(dueOf(r.fy));
        if (n < 0) {
          const cd = chaseDates();
          out.push(
            `<div class="banner callout-danger">${icon('alert', 18)}<div><b>${-n} days overdue.</b> Late reports are accepted and marked late.${cd.length ? ` ${cd.length} EACC reminder${cd.length === 1 ? '' : 's'} sent.` : ''}</div></div>`,
          );
        } else if (n <= 14) {
          out.push(
            `<div class="banner callout-warn">${icon('bell', 18)}<div><b>${n === 1 ? 'Form M due tomorrow.' : `Form M due in ${n} days.`}</b> Submit by ${fmtDate(dueOf(r.fy))}.</div></div>`,
          );
        }
        return out.join('');
      }
      function partIMissing(doc) {
        const p = doc.partI;
        const m = [];
        if (!p.contactDetails.trim()) m.push('contact details');
        if (!p.physicalAddress.trim()) m.push('physical address');
        if (!p.emailAddress.trim()) m.push('email address');
        else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(p.emailAddress))
          m.push('a valid email address');
        return m;
      }
      function sideCard(r) {
        const doc = r.doc;
        const missing = partIMissing(doc);
        const reviewed = r.reviewedBy;
        const submitted = r.status === 'submitted';
        const steps = [
          {
            t: r.preview ? 'Preview compiled' : 'Draft compiled',
            s: fmtDateTime(r.compiledAt),
            done: true,
          },
          {
            t: 'Reviewed by supervisor',
            s: reviewed ? `${reviewed.name}, ${fmtDate(reviewed.at)}` : '',
            done: !!reviewed,
            cur: !reviewed,
          },
          {
            t: 'Part I and Part B filled',
            s: missing.length ? `Missing ${missing.join(', ')}` : '',
            done: !missing.length,
            cur: reviewed && missing.length,
          },
          {
            t: 'Confirmed and submitted',
            s: submitted
              ? `${r.confirmedBy?.name || 'Your system'}, ${fmtDateTime(r.submittedAt)}`
              : '',
            done: submitted,
            cur: reviewed && !missing.length && !submitted,
          },
        ];
        const p2 = doc.partII;
        const toc = [
          ['sec-p1', 'Part I: Description', ''],
          ['sec-initial', '1. Initial declarations', p2.initial.notDeclared],
          [
            'sec-biennial',
            '2. Biennial declarations',
            p2.biennial.noCycleInPeriod ? '-' : p2.biennial.notDeclared,
          ],
          ['sec-final', '3. Final declarations', p2.final.notDeclared],
          ['sec-clar', '4. Clarifications', p2.clarifications.items.length],
          ['sec-access', '5. Access to information', ''],
          ['sec-b', 'B. Complaints', p2.complaints.items.length],
          ['sec-p3', 'Part III: Authentication', ''],
        ];
        const log = [
          ...(submitted
            ? [
                [
                  `Submitted to EACC${r.late ? ' (late)' : ''}`,
                  `${r.confirmedBy?.name || 'Federated system'} · ${fmtDateTime(r.submittedAt)}`,
                  'send',
                ],
              ]
            : []),
          ...(reviewed
            ? [['Marked reviewed', `${reviewed.name} · ${fmtDateTime(reviewed.at)}`, 'userCheck']]
            : []),
          ...(r.recompiledBy && !r.preview
            ? [['Recompiled', `${r.recompiledBy} · ${fmtDateTime(r.compiledAt)}`, 'refresh']]
            : []),
          ...(r.firstCompiledAt
            ? [
                [
                  'Draft compiled, officers notified',
                  `System · ${fmtDateTime(r.firstCompiledAt)}`,
                  'file',
                ],
              ]
            : []),
        ];
        return `<aside class="fm-side stack">
          <div class="card card-pad"><h3 style="font-size:14px;font-weight:600;margin-bottom:14px">Sign-off</h3><ol class="vstep">${steps.map((s, i) => `<li class="${s.done ? 'done' : s.cur ? 'cur' : ''}"><span class="n">${s.done ? icon('check', 13, 2.6) : i + 1}</span><div><div class="t">${s.t}</div>${s.s ? `<div class="s">${esc(s.s)}</div>` : ''}</div></li>`).join('')}</ol></div>
          <div class="card card-pad hide-m"><h3 style="font-size:14px;font-weight:600;margin-bottom:8px">Sections</h3><nav class="toc" aria-label="Form M sections">${toc.map(([id, l, c]) => `<a data-act="scrollTo" data-arg="${id}">${l}<span class="c" ${c === '' ? '' : `title="${c} listed"`}>${c}</span></a>`).join('')}</nav></div>
          <div class="card card-pad"><h3 style="font-size:14px;font-weight:600;margin-bottom:12px">Activity</h3><ul class="timeline">${log.map(([t, s, ic]) => `<li><span class="tl-ico">${icon(ic, 14)}</span><div><div class="tl-t">${t}</div><div class="tl-s">${esc(s)}</div></div></li>`).join('')}</ul></div>
        </aside>`;
      }
      function workspaceFooter(r) {
        const n = daysTo(dueOf(r.fy));
        const due = `${icon('calendar', 16)} Due 31 July ${r.fy + 1} · ${n >= 0 ? `${n} day${n === 1 ? '' : 's'} left` : `${-n} days overdue`}`;
        let acts = '',
          why = '';
        const missing = partIMissing(r.doc);
        if (r.preview) {
          why = `Preview. Submit after 30 Jun ${r.fy + 1}.`;
        } else if (role() === 'supervisor') {
          if (r.status === 'draft') {
            acts = `<button class="btn btn-primary" data-act="openReviewed">${icon('userCheck', 17)} Mark reviewed</button>`;
          } else {
            why = 'Awaiting confirmation by the commission administrator';
          }
        } else if (role() === 'commission-admin') {
          const ready = r.status === 'reviewed' && !missing.length;
          acts = `<button class="btn btn-primary" data-act="startConfirm" ${ready ? '' : 'disabled'}>${icon('shield', 17)} Confirm and submit</button>`;
          why =
            r.status !== 'reviewed'
              ? 'Awaiting supervisor review'
              : missing.length
                ? `Fill Part I: ${missing.join(', ')}`
                : '';
        } else {
          why = 'Read only';
        }
        return `<div class="fm-foot"><span class="due" style="color:${n < 0 ? 'var(--danger)' : n <= 14 ? 'var(--warn)' : 'var(--ink)'}">${due}</span><span class="why">${why}</span><span class="acts">${acts}</span></div>`;
      }

      function screenFormM() {
        const crumbs = [
          ['Reporting', 'form-m'],
          ['Form M', 'form-m'],
        ];
        if (!isCommissionRole()) return stateScreen(404, crumbs);
        const r = rep();
        const periods = [S.fm.reports[2026], S.fm.reports[2025]];

            body += `<div class="card">${empty('No draft yet', `Form M for FY ${y}/${y + 1} compiles automatically on 1 July. Preview available from 1 April.`, { icon: 'calendar' })}</div>`;

            body += `<div class="card">${empty(`Preview Form M for ${FYL(y)}`, "A preview uses today's data. The final draft is compiled on 1 July.", { icon: 'eye', action: role() === 'supervisor' ? `<button class="btn btn-primary" data-act="compile" data-arg="preview">${icon('refresh', 17)} Compile preview</button>` : '<span class="small muted">Your supervisor can compile a preview.</span>' })}</div>`;

            <div class="compile-steps">${steps.map((s, i) => `<div class="${i < st ? 'done' : i === st ? 'cur' : ''}"><span class="ic">${i < st ? icon('check', 12, 2.6) : i === st ? '<span class="spinner dark" style="width:12px;height:12px"></span>' : ''}</span>${s}</div>`).join('')}</div></div></div>`;
          return consoleShell(`<main class="cpage">${head}${body}</main>`, { crumbs });
        }
        if (r.status === 'submitted')
          return consoleShell(`<main class="cpage">${head}${body}${submittedView(r)}</main>`, {
            crumbs,
          });

        // draft / reviewed
        const sup = role() === 'supervisor';
        const statusbar = `<div class="card statusbar"><div><h2>As at ${fmtDateTime(r.compiledAt)}</h2>${r.status === 'reviewed' ? `<div class="meta reviewed">${icon('userCheck', 14)} Reviewed by ${esc(r.reviewedBy.name)} on ${fmtDate(r.reviewedBy.at)}</div>` : ''}</div><div class="acts">${sup ? `<button class="btn btn-secondary" data-act="recompile">${icon('refresh', 16)} Recompile</button>` : ''}<a class="btn btn-ghost" href="../../../services/documents/prototype/documents.prototype.html#form-m" target="_blank" rel="noopener">${icon('printer', 16)} Print draft</a></div></div>`;

          ? `<div class="banner callout-info">${icon('eye', 18)}<div><b>Preview from today's data.</b> The final draft compiles on ${fmtDate(compileOn(y))}.</div></div>`
          : '';
        body += previewBanner;
        body += `<div class="fm-split"><div class="fm-doc">${statusbar}${formMDoc(r.doc, { edit: true, r, pages: S.fm.pages, pageKey: `fm${y}` })}</div>${sideCard(r)}</div>${workspaceFooter(r)}`;
        return consoleShell(`<main class="cpage">${head}${body}</main>`, { crumbs });

      /* ============================== EACC: intake (#230) ============================== */

      function screenIntake() {

        let list;

        else if (!rows.length)
          list = empty(

        else {

          </tbody></table></div>
          <div class="intake-cards">${shown.map((r) => `<div class="icard" data-act="${r.status === 'not-reported' ? 'openChases' : 'openReport'}" data-arg="${r.slug}"><div class="row" style="gap:10px;align-items:flex-start"><span class="cmark">${esc(r.code.replace('CPSB', 'CB'))}</span><div style="flex:1;min-width:0"><div style="font-weight:600">${esc(r.name)}</div><div class="small muted">${r.submittedAt ? `Submitted ${fmtDate(r.submittedAt)}` : chase(r)}</div></div>${icon('right', 16)}</div><div>${intakeBadge(r.status)}</div>${r.rates ? `<div class="rates">${['initial', 'biennial', 'final'].map((k) => `<div><span>${SEC_L[k]}</span>${rateBar(r.rates[k].declared, r.rates[k].expected, { sub: false })}</div>`).join('')}</div>` : ''}${r.outliers.length ? `<div>${outl(r)}</div>` : ''}</div>`).join('')}</div>
          ${Kit.pager({ page: pg, pageSize: S.intake.pageSize, total: rows.length, act: 'intakePage', sizes: [10, 25, 50], sizeBind: 'intake.pageSize' })}`;
        }
        const toolbar =
          fy === 2026
            ? ''
            : `<div class="toolbar"><div class="input-group"><span class="addon">${icon('search', 16)}</span><input class="input" aria-label="Search Commissions" placeholder="Search Commissions" data-bind="intake.q" data-live value="${esc(S.intake.q)}" id="f-intake-q"/></div>
          ${[
            ['all', 'All', all.length],
            ['submitted-on-time', 'On time', onTime],
            ['submitted-late', 'Late', late],
            ['not-reported', 'Not reported', notRep],
          ]
            .map(
              ([k, l, n]) =>
                `<button class="chip ${S.intake.status === k ? 'on' : ''}" data-act="intakeStatus" data-arg="${k}" aria-pressed="${S.intake.status === k}">${l} <span class="n">${n}</span></button>`,
            )
            .join('')}
          <span class="spacer"></span><button class="chip ${S.intake.outliers ? 'on' : ''}" data-act="toggleOutliers" aria-pressed="${S.intake.outliers}">${icon('flag', 14)} Outliers only <span class="n">${outCount}</span></button></div>`;
        return consoleShell(
          `<main class="cpage">${head}${eaccTabs('intake')}${tiles}<div class="card" style="margin-top:16px">${toolbar}${list}</div></main>`,
          { crumbs },

      /* ============================== EACC: report viewer (#230) ============================== */
      function screenReport() {
        const slug = S.params.id || 'tsc';
        const c = COMMISSIONS.find((x) => x.slug === slug);
        const row = c && commissionRow(c, 2025);
        const crumbs = [
          ['Compliance reports', 'intake'],

        if (row.status === 'not-reported') {
          return consoleShell(
            `<main class="cpage narrow">${back}<div class="card">${empty(`${esc(c.name)} has not reported`, `Form M for ${FYL(2025)} was due ${fmtDate(dueOf(2025))}.`, { icon: 'inbox', action: `<button class="btn btn-secondary" data-act="openChases" data-arg="${slug}">Chase history</button>` })}</div></main>`,
