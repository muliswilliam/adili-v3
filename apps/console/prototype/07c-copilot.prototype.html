  <body>
    <script>
      const {
        icon,
        esc,
        dialog,
        drawer,
        consoleShell,
        fmtDate,
        fmtDateTime,
        num,
        badge,
        empty,
        skeletonRows,
      } = Kit;
      const P = () => Kit.persona();
      const NOW = '2026-09-26T10:30';
      const D = (s) => new Date(s);
      const plural = (n, w, pl) => `${num(n)} ${n === 1 ? w : pl || w + 's'}`;
      const ME = () => Kit.PERSONAS[P()];

      /* ============================== AI primitives (#282) ============================== */
      Kit.I.thumbUp =
        '<path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/>';
      Kit.I.thumbDown =
        '<path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/>';
      const AI_TASK = {
        'summarize-declaration': 'Summary',
        'explain-flags': 'Flag explanations',
        'draft-clarification': 'Clarification draft',
      };
      const aiLab = (task, promptVersion, generatedAt) => ({
        aiAssisted: true,
        task,
        promptVersion,
        provider: 'Anthropic',
        model: 'claude-opus-5',
        generatedAt,
      });
      function aiLabel(lab, { text = 'AI-assisted', sm = false, edited = false } = {}) {
        const tip = `${AI_TASK[lab.task] || lab.task} · ${lab.provider} ${lab.model} · prompt v${lab.promptVersion} · generated ${fmtDateTime(lab.generatedAt)}`;
        const t = edited ? 'AI draft, edited' : text;
        return `<span class="ailabel kit-tip ${sm ? 'sm' : ''} ${edited ? 'edited' : ''}" tabindex="0" role="note" aria-label="${esc(t)}. ${esc(tip)}" data-tip="${esc(tip)}">${icon(edited ? 'pencil' : 'sparkles', sm ? 11 : 13, 2)}<span>${esc(t)}</span></span>`;
      }
      const srcLink = (label, ic, aria) =>
        `<button class="srcref" data-act="toast" data-arg="Opens ${esc(aria)} in the declaration pane and highlights it" aria-label="Open in the declaration: ${esc(aria)}">${icon(ic, 13)}<span class="tx">${esc(label)}</span></button>`;
      const FB_REASONS = [
        ['inaccurate', 'Inaccurate'],
        ['missed-something', 'Missed something'],
        ['unclear', 'Unclear'],
        ['too-long', 'Too long'],
        ['other', 'Other'],
      ];
      const fbOf = (k) => (S.fb[k] ||= { rating: null, reason: '', note: '', open: false });
      function feedbackCtl(key, mode = 'edit') {
        const f = fbOf(key);
        if (mode === 'ro')
          return f.rating
            ? `<span class="fb-ro">${icon(f.rating === 'helpful' ? 'thumbUp' : 'thumbDown', 13)} Faith Achieng: ${f.rating === 'helpful' ? 'helpful' : 'not helpful'}${f.reason ? ', ' + FB_REASONS.find((x) => x[0] === f.reason)[1].toLowerCase() : ''}</span>`
            : '';
        return `<span class="fb" role="group" aria-label="Rate this output"><button class="fbb kit-tip" data-act="fbUp" data-arg="${key}" aria-pressed="${f.rating === 'helpful'}" aria-label="Helpful" data-tip="Helpful">${icon('thumbUp', 15)}</button><button class="fbb kit-tip" data-act="fbDown" data-arg="${key}" aria-pressed="${f.rating === 'not-helpful' || f.open}" aria-label="Not helpful" data-tip="Not helpful">${icon('thumbDown', 15)}</button></span>`;
      }
      function feedbackForm(key) {
        const f = fbOf(key);
        if (!f.open) return '';
        return `<div class="fb-form" role="group" aria-label="Why was this not helpful?"><div class="field"><label class="label" for="fbr-${key}">What was wrong?</label><select id="fbr-${key}" class="select" data-bind="fb.${key}.reason"><option value="" ${f.reason ? '' : 'selected'} disabled>Choose a reason</option>${FB_REASONS.map(([k, l]) => `<option value="${k}" ${f.reason === k ? 'selected' : ''}>${l}</option>`).join('')}</select>${f.err ? `<div class="ferr">${icon('alert', 14)} ${f.err}</div>` : ''}</div><div class="field"><label class="label" for="fbn-${key}"><span>Note</span><span class="opt">Optional</span></label><textarea id="fbn-${key}" class="textarea" rows="2" maxlength="1000" data-bind="fb.${key}.note" placeholder="What should it have said?">${esc(f.note)}</textarea></div><div class="row" style="gap:8px;justify-content:flex-end"><button class="btn btn-ghost btn-sm" data-act="fbCancel" data-arg="${key}">Cancel</button><button class="btn btn-primary btn-sm" data-act="fbSubmit" data-arg="${key}">Send rating</button></div></div>`;
      }
      const tok = (n) =>
        n >= 1e6
          ? `${(n / 1e6).toFixed(2).replace(/\.?0+$/, '')}M`
          : n >= 1e3
            ? `${Math.round(n / 1e3)}k`
            : String(n);
      // UsageMeter: tokens used against the monthly budget; amber from 80%, red at 100%.
      function usageMeter(u, { lg = false } = {}) {
        const p = u.monthlyTokens ? (u.tokensUsed / u.monthlyTokens) * 100 : u.tokensUsed ? 100 : 0;
        const cls = p >= 100 ? 'over' : p >= 80 ? 'warn' : '';
        const st =
          p >= 100
            ? `${icon('alert', 13, 2.2)} Used up`
            : p >= 80
              ? `${icon('alert', 13, 2.2)} ${Math.floor(p)}%`
              : `${Math.floor(p)}%`;
        return `<div class="meter ${cls} ${lg ? 'lg' : ''}" role="meter" aria-valuemin="0" aria-valuemax="${u.monthlyTokens}" aria-valuenow="${Math.min(u.tokensUsed, u.monthlyTokens)}" aria-label="Tokens this month: ${num(u.tokensUsed)} of ${num(u.monthlyTokens)}${p >= 100 ? '. Budget used up' : p >= 80 ? '. Over 80%' : ''}"><div class="lab"><span><b>${tok(u.tokensUsed)}</b> <span class="muted">of ${tok(u.monthlyTokens)} tokens</span></span><span class="st">${st}</span></div><div class="bar"><span class="fill" style="width:${Math.min(100, p)}%"></span><span class="tick" style="left:80%"></span></div></div>`;
      }

      /* ============================== demo data ============================== */
      const CLS = ['synthetic', 'restricted', 'highly-confidential'];
      const CLS_L = {
        synthetic: 'Synthetic',
        restricted: 'Restricted',
        'highly-confidential': 'Highly confidential',
      };
      const PC = ['external', 'self-hosted'];
      const PC_L = { external: 'External', 'self-hosted': 'Self-hosted' };
      const CLS_TIP =
        'Synthetic: generated demo declarations. Restricted: aggregates and non-personal data. Highly confidential: real declarations.';
      const COUNTIES =
        'Nairobi City,Mombasa,Kisumu,Nakuru,Kiambu,Machakos,Uasin Gishu,Kakamega,Kilifi,Nyeri,Meru,Kajiado,Kericho,Bungoma,Kisii,Embu,Garissa,Turkana,Laikipia,Narok,Homa Bay,Migori,Siaya,Vihiga,Busia,Nandi,Bomet,Kirinyaga,Murang’a,Nyandarua,Makueni,Kitui,Tharaka-Nithi,Isiolo,Marsabit,Wajir,Mandera,Lamu,Taita-Taveta,Kwale,Tana River,Samburu,West Pokot,Elgeyo-Marakwet,Trans Nzoia,Baringo,Nyamira'.split(
          ',',
        );
      function seedTenants() {
        const base = [
          ['demo', 'Demo Commission', 'Synthetic declarations for demonstrations'],
          ['psc', 'Public Service Commission', ''],
          ['tsc', 'Teachers Service Commission', ''],
          ['jsc', 'Judicial Service Commission', ''],
          ['parlsc', 'Parliamentary Service Commission', ''],
          ['npsc', 'National Police Service Commission', ''],
          ['cra', 'Commission on Revenue Allocation', ''],
          ['src', 'Salaries and Remuneration Commission', ''],
          ['iebc', 'Independent Electoral and Boundaries Commission', ''],
          ['knchr', 'Kenya National Commission on Human Rights', ''],
          ['nlc', 'National Land Commission', ''],
          ['caj', 'Commission on Administrative Justice', ''],
          ['ngec', 'National Gender and Equality Commission', ''],
        ].map(([slug, name, sub]) => ({ slug, name, sub }));
        COUNTIES.forEach((c) =>
          base.push({
            slug:
              'cpsb' +
              c
                .toLowerCase()
                .replace(/[^a-z]/g, '')
                .slice(0, 16),
            name: `${c} County Public Service Board`,
            sub: '',
          }),
        );
        const rule = (dc, pc, ref, by, at) => ({
          dataClass: dc,
          providerClass: pc,
          allowed: true,
          approvalRef: ref,
          changedBy: by,
          changedAt: at,
        });
        const P0 = {
          demo: [
            rule('synthetic', 'external', 'EACC/AI/2026/001', 'Amina Wanjiru', '2026-08-04T09:12'),
          ],
          psc: [
            rule('synthetic', 'external', 'EACC/AI/2026/014', 'Amina Wanjiru', '2026-09-01T11:40'),
          ],
          jsc: [
            rule('synthetic', 'external', 'EACC/AI/2026/019', 'Amina Wanjiru', '2026-09-08T15:05'),
          ],
          cpsbnairobicity: [
            rule('synthetic', 'external', 'EACC/AI/2026/021', 'Amina Wanjiru', '2026-09-10T10:20'),
          ],
        };
        const U0 = {
          demo: [2000000, 60, 412800, 5210000, 318, 0, 2],
          psc: [3000000, 120, 1926400, 24180000, 1482, 0, 11],
          jsc: [1000000, 60, 862300, 10940000, 604, 0, 3],
          cpsbnairobicity: [1500000, 60, 1500000, 18820000, 1120, 37, 5],
        };
        return base.map((t, i) => {
          const u = U0[t.slug] || [1000000, 60, 0, 0, 0, t.slug === 'tsc' ? 214 : (i * 37) % 90, 0];
          return {
            ...t,
            rules: P0[t.slug] || [],
            usage: {
              month: '2026-09',
              monthlyTokens: u[0],
              perMinute: u[1],
              tokensUsed: u[2],
              costMicros: u[3],
              jobs: u[4],
              blocked: u[5],
              failed: u[6],
            },
            audit: (P0[t.slug] || []).map((r) => ({
              at: r.changedAt,
              by: r.changedBy,
              text: `Allowed ${PC_L[r.providerClass].toLowerCase()} providers for ${CLS_L[r.dataClass].toLowerCase()} data`,
              ref: r.approvalRef,
              ic: 'check',
            })),
          };
        });
      }
      const ROUTES = [
        {
          tenant: null,
          task: 'summarize-declaration',
          provider: 'anthropic',
          model: 'claude-opus-5',
          params: { temperature: 0, maxTokens: 4000, timeout: '60 s' },
        },
        {
          tenant: null,
          task: 'explain-flags',
          provider: 'anthropic',
          model: 'claude-opus-5',
          params: { temperature: 0, maxTokens: 3000, timeout: '45 s' },
        },
        {
          tenant: null,
          task: 'draft-clarification',
          provider: 'anthropic',
          model: 'claude-opus-5',
          params: { temperature: 0.2, maxTokens: 2000, timeout: '10 s' },
        },

            Kit.render();
          }, 900);
        },
        openTenant: (slug) => {
          S.tenantId = slug;
          S.modal = { kind: 'tenant' };
          Kit.render();
        },
        editDlg: () => {
          const t = tenantOf(S.tenantId);
          const m = {};
          CLS.forEach((dc) => PC.forEach((pc) => (m[dc + '|' + pc] = allowed(t, dc, pc))));
          S.edit = { m, ref: '', err: '', busy: false };
          S.modal = { kind: 'edit' };
          Kit.render();
        },
        reviewEdit: () => {
          S.modal = { kind: 'confirm' };
          Kit.render();
          setTimeout(() => document.getElementById('aref')?.focus(), 30);
        },
        backEdit: () => {
          S.edit.err = '';
          S.modal = { kind: 'edit' };
          Kit.render();
        },
        saveEdit: () => {
          const e = S.edit;
          if (!e.ref.trim()) {
            e.err = 'Enter the approval reference.';
            Kit.render();
            document.getElementById('aref')?.focus();
            return;
          }
          e.busy = true;
          S.modal.busy = true;
          Kit.render();
          setTimeout(() => {
            const t = tenantOf(S.tenantId);
            changesOf(t).forEach((c) => {
              t.rules = t.rules.filter((r) => !(r.dataClass === c.dc && r.providerClass === c.pc));
              if (c.allow)
                t.rules.push({
                  dataClass: c.dc,
                  providerClass: c.pc,
                  allowed: true,
                  approvalRef: e.ref.trim(),
                  changedBy: ME().name,
                  changedAt: NOW,
                });
              t.audit.push({
                at: NOW,
                by: ME().name,
                ref: e.ref.trim(),
                ic: c.allow ? 'check' : 'ban',
                text: `${c.allow ? 'Allowed' : 'Blocked'} ${PC_L[c.pc].toLowerCase()} providers for ${CLS_L[c.dc].toLowerCase()} data`,
              });
            });
            S.edit = null;
            S.modal = { kind: 'tenant' };
            Kit.toast('Policy saved and recorded in the audit trail');
          }, 900);
        },
        budgetDlg: () => {
          const t = tenantOf(S.tenantId);
          S.budget = {
            tokens: num(t.usage.monthlyTokens),
            perMinute: String(t.usage.perMinute),
            errT: '',
            errM: '',
          };
          S.modal = { kind: 'budget' };
          Kit.render();
        },
        saveBudget: () => {
          const b = S.budget;
          const n = Number(String(b.tokens).replace(/,/g, ''));
          const m = Number(b.perMinute);
          b.errT =
            b.tokens === '' || !Number.isInteger(n) || n < 0
              ? 'Enter a whole number of tokens, 0 or more.'
              : '';
          b.errM = !Number.isInteger(m) || m < 1 ? 'Enter at least 1 request a minute.' : '';
          if (b.errT || b.errM) {
            Kit.render();
            return;
          }
          const t = tenantOf(S.tenantId);
          t.usage.monthlyTokens = n;
          t.usage.perMinute = m;
          t.audit.push({
            at: NOW,
            by: ME().name,
            ref: '',
            ic: 'gauge',
            text: `Budget set to ${num(n)} tokens a month, ${num(m)} requests a minute`,
          });
          S.budget = null;
          S.modal = { kind: 'tenant' };
          Kit.toast('Budget saved');
        },
        fbUp: (k) => {
          const f = fbOf(k);
          Object.assign(f, {
            rating: f.rating === 'helpful' ? null : 'helpful',
            open: false,
            reason: '',
            err: '',
          });
          Kit.render();
        },
        fbDown: (k) => {
          const f = fbOf(k);
          if (f.rating === 'not-helpful' && !f.open) Object.assign(f, { rating: null, reason: '' });
          else f.open = true;
          Kit.render();
        },
        fbCancel: (k) => {
          fbOf(k).open = false;
          fbOf(k).err = '';
          Kit.render();
        },
        fbSubmit: (k) => {
          const f = fbOf(k);
          if (!f.reason) {
            f.err = 'Choose a reason.';
            Kit.render();
            return;
          }
          Object.assign(f, { rating: 'not-helpful', open: false, err: '' });
          Kit.render();
          Kit.toast('Thanks. Rating saved.');
        },
      };

      /* ============================== jumps ============================== */
      const setPersona = (p) => localStorage.setItem('dials-proto-persona', p);
      const reset = () => {
        S.tenants = seedTenants();
        Object.assign(S, {
          tab: 'tenants',
          q: '',
          filt: 'all',
          page: 1,
          size: 20,
          view: 'ok',
          edit: null,
          budget: null,
          modal: null,
        });
      };
      const J = (key, label, p, fn) => [
        key,
        label,
        () => {
          setPersona(p);
          reset();
          fn();
        },
      ];
      const openT = (slug) => {
        Kit.go('ai-policy');
        actions.openTenant(slug);
      };
      const jumps = [
        J('ai-policy', '#291 AI policy: Commissions (platform admin)', 'platform-admin', () =>
          Kit.go('ai-policy'),
        ),
        J('ai-policy-p2', '#291 AI policy: page 2', 'platform-admin', () => {
          S.page = 2;
          Kit.go('ai-policy');
        }),
        J('ai-policy-on', '#291 AI policy: enabled only', 'platform-admin', () => {
          S.filt = 'on';
          Kit.go('ai-policy');
        }),
        J('ai-policy-none', '#291 AI policy: no matches', 'platform-admin', () => {
          S.q = 'zzz';
          Kit.go('ai-policy');
        }),
        J('ai-policy-loading', '#291 AI policy: loading', 'platform-admin', () => {
          S.view = 'loading';
          Kit.go('ai-policy');
        }),
        J('ai-policy-error', '#291 AI policy: could not load', 'platform-admin', () => {
          S.view = 'error';
          Kit.go('ai-policy');
        }),
        J('ai-tenant', '#291 Commission: policy, budget and usage (PSC)', 'platform-admin', () =>
          openT('psc'),
        ),
        J('ai-tenant-warn', '#291 Commission: 86% of budget (JSC)', 'platform-admin', () =>
          openT('jsc'),
        ),
        J(
          'ai-tenant-over',
          '#291 Commission: budget used up (Nairobi City CPSB)',
          'platform-admin',
          () => openT('cpsbnairobicity'),
        ),
        J('ai-tenant-off', '#291 Commission: not enabled (TSC)', 'platform-admin', () =>
          openT('tsc'),
        ),
        J(
          'ai-edit',
          '#291 Edit policy: allow external on synthetic (TSC)',
          'platform-admin',
          () => {
            openT('tsc');
            actions.editDlg();
            S.edit.m['synthetic|external'] = true;
            Kit.render();
          },
        ),
        J('ai-confirm', '#291 Confirm: approval reference', 'platform-admin', () => {
          openT('tsc');
          actions.editDlg();
          S.edit.m['synthetic|external'] = true;
          S.modal = { kind: 'confirm' };
          Kit.render();
        }),
        J(
          'ai-confirm-invalid',
          '#291 Confirm: approval reference missing',
          'platform-admin',
          () => {
            openT('tsc');
            actions.editDlg();
            S.edit.m['synthetic|external'] = true;
            S.edit.err = 'Enter the approval reference.';
            S.modal = { kind: 'confirm' };
            Kit.render();
          },
        ),
        J('ai-confirm-block', '#291 Confirm: block external (PSC)', 'platform-admin', () => {
          openT('psc');
          actions.editDlg();
          S.edit.m['synthetic|external'] = false;
          S.modal = { kind: 'confirm' };
          Kit.render();
        }),
        J('ai-budget', '#291 Edit budget', 'platform-admin', () => {
          openT('psc');
          actions.budgetDlg();
        }),
        J(
          'ai-budget-invalid',
          '#291 Edit budget: validation, below usage',
          'platform-admin',
          () => {
            openT('psc');
            actions.budgetDlg();
            Object.assign(S.budget, {
              tokens: '1,500,000',
              perMinute: '0',
              errM: 'Enter at least 1 request a minute.',
            });
            Kit.render();
          },
        ),
        J('ai-routing', '#291 Routing (read-only)', 'platform-admin', () => {
          S.tab = 'routing';
          Kit.go('ai-policy');
        }),
        J('ai-403', '#291 AI policy as EACC analyst: 403', 'eacc-analyst', () =>
          Kit.go('ai-policy'),
        ),
        J(
          'commission-ai',
          '#291 Commission AI status: enabled (commission admin)',
          'commission-admin',
          () => Kit.go('commission-ai'),
        ),
        J('commission-ai-off', '#291 Commission AI status: not enabled', 'commission-admin', () => {
          tenantOf('psc').rules = [];
          Kit.go('commission-ai');
        }),
        J('commission-ai-sup', '#291 Commission AI status as supervisor', 'supervisor', () =>
          Kit.go('commission-ai'),
        ),
        J('commission-ai-404', '#291 Commission AI status as reviewer: 404', 'reviewer', () =>
          Kit.go('commission-ai'),
        ),
        J('primitives', '#282 AI primitives gallery', 'platform-admin', () => Kit.go('primitives')),
      ];

      Kit.mount({
        app: 'console',
        start: 'ai-policy',
        home: 'ai-policy',
        defaultPersona: 'platform-admin',
        screens: {
          'ai-policy': scrPolicy,
          'commission-ai': scrCommission,
          primitives: scrPrimitives,
        },
        modals,
        actions,
        jumps,
        coverage: [
          {
            ticket: 282,
            title:
              'UI primitives round 13: AI label, source ref link, feedback control, usage meter',
            screens: ['primitives', 'ai-tenant'],
            note: 'AiLabel, SourceRefLink and FeedbackControl in use in 07a-review.prototype.html (Copilot jumps). Stories and tests are engineering work.',
          },
          {
            ticket: 291,
            title: 'Console: AI policy page and Commission AI status line',
            screens: [
              'ai-policy',
              'ai-policy-p2',
              'ai-policy-on',
              'ai-policy-none',
              'ai-policy-loading',
              'ai-policy-error',
              'ai-tenant',
              'ai-tenant-warn',
              'ai-tenant-over',
              'ai-tenant-off',
              'ai-edit',
              'ai-confirm',
              'ai-confirm-invalid',
              'ai-confirm-block',
              'ai-budget',
              'ai-budget-invalid',
              'ai-routing',
              'ai-403',
              'commission-ai',
              'commission-ai-off',
              'commission-ai-sup',
              'commission-ai-404',
            ],
            note: 'The status line belongs in the Policy card on 01-commissions #my-commission; shown here in context. Routing is read-only (configuration).',
          },
        ],
        onBind: (bind) => {
          if (bind === 'q' || bind === 'size') S.page = 1;
        },
        reset: () => {
          reset();
          Kit.go('ai-policy');
        },
      });
    </script>
  </body>
</html>
