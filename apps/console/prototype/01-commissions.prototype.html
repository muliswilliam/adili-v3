      const fdt = (s) => (s ? fmtDateTime(D(s)) : '-');
      const mid = (d) => {
        const x = new Date(d);
        x.setHours(0, 0, 0, 0);
        return x;
      };
      const calDays = (a, b) => Math.round((mid(D(b)) - mid(a)) / 86400000);
      const ago = (s) => {
        const n = calDays(D(s), Kit.TODAY);
        if (n <= 0) return 'today';
        if (n === 1) return 'yesterday';
        if (n < 31) return `${n} days ago`;
        const m = Math.round(n / 30);
        return m <= 1 ? '1 month ago' : `${m} months ago`;
      };
      const relT = (s) => {
        const h = Math.round((Kit.TODAY - D(s)) / 3600000);

        return ago(s);

          : e;
      const plural = (n, one, many) => `${num(n)} ${n === 1 ? one : many || one + 's'}`;
      function normPhone(raw) {
        let s = String(raw || '').replace(/[\s\-().]/g, '');
        if (!s) return null;
        if (s.startsWith('00')) s = '+' + s.slice(2);
        if (!s.startsWith('+')) {
          if (/^0[17]\d{8}$/.test(s)) s = '+254' + s.slice(1);
          else if (/^254[17]\d{8}$/.test(s)) s = '+' + s;
          else if (/^[17]\d{8}$/.test(s)) s = '+254' + s;
          else return null;
        }
        return /^\+[1-9][0-9]{6,14}$/.test(s) ? s : null;

            text: 'Configuration and reference data.',
            icon: 'settings',
            off: true,
          });
        return consoleShell(
          `<main class="cpage">
    <div class="page-head"><div><h1>Good morning, ${esc(p.name.split(' ')[0])}</h1></div></div>
    <div class="wscards">${cards.map(wsCard).join('')}</div>
  </main>`,
          { crumbs: [['Home', 'home']] },
        );
      }

      /* ---------- Commissions list ---------- */
      const PAGE = 10;
      function filtered() {
        if (S.listEmptyPlatform) return [];
        const q = S.list.search.trim().toLowerCase();
        let items = S.commissions.slice().sort((a, b) => a.name.localeCompare(b.name));
        if (!seesAll()) items = items.filter((c) => c.slug === staffTenant());
        if (q) items = items.filter((c) => c.name.toLowerCase().includes(q) || c.slug.includes(q));
        if (S.list.type) items = items.filter((c) => c.type === S.list.type);
        if (S.list.ro)
          items = items.filter((c) =>
            S.list.ro === 'none' ? !c.reportingOfficer : c.reportingOfficer?.state === S.list.ro,
          );
        return items;
      }
      const hasFilters = () => !!(S.list.search || S.list.type || S.list.ro);
      function listToolbar() {
        const dis = S.list.state === 'forbidden' ? 'disabled' : '';
        return `<div class="toolbar" role="search">
    <div class="input-group"><span class="addon">${icon('search', 16)}</span><label class="vh" for="f-list-search">Search Commissions</label><input id="f-list-search" class="input" type="search" data-bind="list.search" value="${esc(S.list.search)}" placeholder="Search by name or key" ${dis}/></div>
    <label class="vh" for="f-list-type">Type</label>
    <select id="f-list-type" class="select" data-bind="list.type" data-rerender ${dis}><option value="" ${!S.list.type ? 'selected' : ''}>All types</option><option value="hosted" ${S.list.type === 'hosted' ? 'selected' : ''}>Hosted</option><option value="federated" ${S.list.type === 'federated' ? 'selected' : ''}>Federated</option></select>
    <label class="vh" for="f-list-ro">Reporting officer</label>
    <select id="f-list-ro" class="select" data-bind="list.ro" data-rerender ${dis}><option value="" ${!S.list.ro ? 'selected' : ''}>Any reporting officer</option><option value="none" ${S.list.ro === 'none' ? 'selected' : ''}>Not assigned</option><option value="invited" ${S.list.ro === 'invited' ? 'selected' : ''}>Invited</option><option value="activated" ${S.list.ro === 'activated' ? 'selected' : ''}>Activated</option></select>
    ${hasFilters() ? `<button class="btn btn-ghost btn-sm" data-act="clearFilters">${icon('x', 15)} Clear</button>` : ''}
  </div>`;
      }
      function listBody() {
        const st = S.list.state;
        const head = `<thead><tr><th scope="col">Commission</th><th scope="col">Type</th><th scope="col">Categories</th><th scope="col">Reporting officer</th><th scope="col">Roster</th><th scope="col">Created</th></tr></thead>`;
        if (st === 'loading')
          return `<div class="table-wrap"><table class="table" aria-busy="true"><caption class="vh">Responsible Commissions (loading)</caption>${head}<tbody>${Kit.skeletonRows(5, 6)}</tbody></table></div>`;
        if (st === 'error')
          return `<div style="padding:20px">${alertBox('danger', 'Commissions could not be loaded', 'The directory service did not respond.', `<button class="btn btn-secondary btn-sm" data-act="retryList">${icon('refresh', 15)} Try again</button>`)}</div>`;
        if (st === 'forbidden')
          return `<div style="padding:20px">${alertBox('neutral', 'You do not have access to Commissions.')}</div>`;
        const all = filtered();
        if (!all.length) {
          if (hasFilters())
            return Kit.empty('No matches', 'Try a different search or clear the filters.', {
              icon: 'search',
              action: `<button class="btn btn-secondary btn-sm" data-act="clearFilters">Clear filters</button>`,
            });
          return Kit.empty(
            'No Commissions yet',
            'Create the first Responsible Commission to start onboarding.',
            {
              icon: 'building',
              action: isAdmin()
                ? `<button class="btn btn-primary btn-sm" data-act="go" data-arg="commission-new">${icon('plus', 16)} New Commission</button>`
                : '',
            },
          );
        }
        const page = Math.min(S.list.page, Math.ceil(all.length / PAGE));
        const items = all.slice((page - 1) * PAGE, page * PAGE);
        const more = all.length > page * PAGE;
        const rows = items
          .map(
            (c) => `<tr class="click" data-act="openDetail" data-arg="${c.slug}">
      <td><a class="rowlink" href="?slug=${c.slug}#detail" data-act="openDetail" data-arg="${c.slug}">${esc(c.name)}</a><div class="issuer" style="margin-top:2px">${c.issuerCode}</div></td>
      <td>${typeBadge(c.type)}</td>
      <td>${catsCell(c.categories)}</td>
      <td>${c.reportingOfficer ? `<div class="ro-cell"><span class="nowrap">${esc(c.reportingOfficer.name)}</span>${roBadge(c.reportingOfficer)}</div>` : '<span class="muted-i">Not assigned</span>'}</td>
      <td>${rosterCell(c.roster)}</td>
      <td>${createdCell(c)}</td></tr>`,
          )
          .join('');
        const mrows = items
          .map(
            (c) => `<div class="mitem" data-act="openDetail" data-arg="${c.slug}">
      <div class="top"><div style="flex:1;min-width:0"><a class="rowlink nm" href="?slug=${c.slug}#detail" data-act="openDetail" data-arg="${c.slug}" style="text-decoration:none">${esc(c.name)}</a><div class="issuer">${c.issuerCode}</div></div>${typeBadge(c.type)}</div>
      <div class="meta">${c.reportingOfficer ? `${esc(c.reportingOfficer.name)} ${roBadge(c.reportingOfficer)}` : '<span>Reporting officer not assigned</span>'}</div>
      <div class="meta">${c.roster.status === 'none' ? 'No roster yet' : `${num(c.roster.onboardedDeclarants)} of ${num(c.roster.expectedDeclarants)} onboarded`}</div>
    </div>`,
          )
          .join('');
        return `<div class="table-wrap dtable"><table class="table"><caption class="vh">Responsible Commissions</caption>${head}<tbody>${rows}</tbody></table></div>
    <div class="mlist">${mrows}</div>
    ${Kit.pager({ page, pageSize: PAGE, count: items.length, hasNext: more, act: 'listPage', label: 'Commissions' })}`;
      }
      function scrCommissions() {
        if (!seesAll())
          return noAccessPage(
            'Commissions',
            'You do not have access to Commissions.',
            `<button class="btn btn-secondary btn-sm" data-act="go" data-arg="my-commission">Open your Commission</button>`,
          );
        const n = S.list.state === 'ready' ? filtered().length : null;
        const total = S.listEmptyPlatform ? 0 : S.commissions.length;
        return consoleShell(
          `<main class="cpage">
    <div class="page-head"><div><h1>Commissions</h1><p class="count-line">${S.list.state === 'ready' ? (hasFilters() ? `${plural(n, 'match', 'matches')} of ${plural(total, 'Commission')}` : plural(total, 'Commission')) : S.list.state === 'loading' ? '<span class="skeleton" style="width:110px;display:inline-block"></span>' : '&nbsp;'}</p></div>
      <div class="actions-r">${isAdmin() && S.list.state !== 'forbidden' ? `<button class="btn btn-primary" data-act="go" data-arg="commission-new">${icon('plus', 17)} New Commission</button>` : isEacc() ? `<span class="badge">${icon('eye', 13)} Read only</span>` : ''}</div></div>
    <div class="card" style="overflow:visible">${listToolbar()}${listBody()}</div>
  </main>`,
          { crumbs: [['Commissions', 'commissions']] },
        );
      }

      /* ---------- create ---------- */
      function validateCreate(f) {
        const e = {};
        const name = f.name.trim();
        if (name.length < 3 || name.length > 120)
          e.name = 'Enter the Commission’s name (3 to 120 characters).';
        if (f.slug === 'platform') e.slug = 'This key is reserved.';
        else if (!/^[a-z][a-z0-9]{1,19}$/.test(f.slug))
          e.slug = 'Use 2 to 20 lowercase letters or digits, starting with a letter.';
        if (!['hosted', 'federated'].includes(f.type))
          e.type = 'Choose how the Commission will use the platform.';
        return e;
      }
      function slugPreview(slug) {
        if (!slug || slug === 'platform' || !/^[a-z][a-z0-9]{1,19}$/.test(slug))
          return `<div class="hint" id="f-create-slug-hint">Cannot be changed later.</div>`;
        const code = slug.toUpperCase();
        return `<div class="preview" id="f-create-slug-hint" aria-live="polite">${icon('hash', 16)}<span>Issuer code: <span class="code">${esc(code)}</span>. Appears in reference numbers, e.g. <span class="mono" style="font-weight:600;color:var(--ink)">DCB-${esc(code)}-2027-0012345-K</span>. Cannot be changed later.</span></div>`;
      }
      function scrCreate() {
        if (!isAdmin())
          return noAccessPage(
            'New Commission',
            isEacc()
              ? 'Only platform administrators can create Commissions.'
              : 'You do not have access to Commissions.',
            isEacc()
              ? `<button class="btn btn-secondary btn-sm" data-act="go" data-arg="commissions">Back to Commissions</button>`
              : '',
          );
        const f = S.create;
        const e = f.errors;
        const busy = f.state === 'submitting';
        const dis = busy ? 'disabled' : '';
        const nErr = Object.keys(e).length;
        const selected = Object.values(f.cats).filter(Boolean).length;
        const catRow = (c) =>
          `<label class="crow"><input type="checkbox" data-bind="create.cats.${c.code}" data-rerender ${f.cats[c.code] ? 'checked' : ''} ${dis}/><span class="box">${icon('check', 14, 3)}</span><span class="cite">${c.citation}</span><span class="cdesc">${esc(c.description)}</span></label>`;
        const summary = f.summary
          ? alertBox('danger', f.summary.title, f.summary.text || '', '', { role: 'alert' })
          : '';
        return consoleShell(
          `<main class="cpage narrow">
    <div class="page-head"><div><h1>New Commission</h1></div></div>
    <form class="card" novalidate data-form="create" onsubmit="return false">
      <div class="formcard">
        ${summary}
        ${f.alert ? f.alert : ''}
        ${ff('Name', `<input id="f-create-name" class="input" data-bind="create.name" value="${esc(f.name)}" autocomplete="off" maxlength="140" ${described('f-create-name', e.name)} ${dis}/>`, { id: 'f-create-name', hint: 'Official name as gazetted.', error: e.name })}
        <div class="field"><label class="label" for="f-create-slug"><span>Commission key</span></label>
          <input id="f-create-slug" class="input mono" data-bind="create.slug" data-live value="${esc(f.slug)}" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="24" placeholder="e.g. tsc" ${described('f-create-slug', e.slug)} ${dis}/>
          ${e.slug ? errLine('f-create-slug-err', e.slug) : ''}
          ${slugPreview(f.slug)}
        </div>
        <fieldset class="field" style="border:0;padding:0;margin:0" ${e.type ? 'aria-invalid="true"' : ''} >
          <legend class="label" style="margin-bottom:6px">Type</legend>
          <div class="choices" role="radiogroup" style="grid-template-columns:1fr">
            ${[
              ['hosted', 'Hosted on Adili', 'Staff use this console.', 'server'],
              [
                'federated',
                'Federated (runs its own system)',
                'The Commission exchanges data through the API.',
                'link',
              ],
            ]
              .map(
                ([k, l, sub, ic]) =>
                  `<label class="choice ${busy ? 'disabled' : ''}" style="align-items:flex-start"><input type="radio" name="create.type" value="${k}" data-bind="create.type" ${f.type === k ? 'checked' : ''} ${dis}/><span class="dot" style="margin-top:2px"></span><span style="flex:1">${l}<div class="hint" style="font-weight:400;margin-top:2px">${sub}</div></span><span class="muted" style="display:flex">${icon(ic, 17)}</span></label>`,
              )
              .join('')}
          </div>
          ${e.type ? errLine('f-create-type-err', e.type) : ''}
        </fieldset>
        <fieldset class="field" style="border:0;padding:0;margin:0" aria-describedby="f-create-cats-hint">
          <legend class="label" style="margin-bottom:4px;width:100%;display:flex;justify-content:space-between"><span>Categories of officers</span><span class="opt">${selected ? `${selected} selected` : 'Optional'}</span></legend>
          <div class="hint" id="f-create-cats-hint" style="margin-bottom:8px">Which public officers this Commission is responsible for (Act s.32, Regs r.5).</div>
          ${e.categories ? errLine('f-create-cats-err', e.categories) : ''}
          <div class="cgroup" role="group" aria-label="Conflict of Interest Act 2025, section 32"><div class="cgroup-h">Act, section 32</div>${CATS.filter(
            (c) => c.code.startsWith('act'),
          )
            .map(catRow)
            .join('')}</div>
          <div class="cgroup" role="group" aria-label="Conflict of Interest Regulations 2026, regulation 5"><div class="cgroup-h">Regulations, regulation 5</div>${CATS.filter(
            (c) => c.code.startsWith('regs'),
          )
            .map(catRow)
            .join('')}</div>
        </fieldset>
      </div>
      <div class="form-foot">
        <button type="submit" class="btn btn-primary" data-act="submitCreate" ${dis} ${busy ? 'aria-busy="true"' : ''} style="min-width:190px">${busy ? spinner() + ' Creating…' : 'Create Commission'}</button>
        <a class="btn btn-ghost ${busy ? 'is-disabled' : ''}" href="#commissions" data-act="cancelCreate">Cancel</a>
      </div>
    </form>
  </main>`,
          {
            crumbs: [
              ['Commissions', 'commissions'],
              ['New Commission', 'commission-new'],
            ],
          },
        );
      }

      /* ---------- detail ---------- */
      function detailsCard(c, { compact = false } = {}) {
        const pv = S.policies[c.slug];
        const curV = pv[pv.length - 1];
        return `<section class="cardx" aria-labelledby="h-details"><div class="sec-h"><span class="ico">${icon('building', 16)}</span><h3 id="h-details">Details</h3></div><div class="sec-b" style="padding-top:6px;padding-bottom:6px">
    <dl class="dlx">
      <div><dt>Commission key</dt><dd class="mono">${c.slug}</dd></div>
      <div><dt>Issuer code</dt><dd><span class="mono" title="e.g. DCB-${c.issuerCode}-2027-0012345-K">${c.issuerCode}</span></dd></div>
      <div><dt>Type</dt><dd>${c.type === 'hosted' ? 'Hosted on Adili' : 'Federated (runs its own system)'}</dd></div>
      <div><dt>Categories</dt><dd>${c.categories.length ? `<ul class="catlist">${c.categories.map((x) => `<li><span class="cite">${CAT[x].citation}</span><span>${esc(CAT[x].description)}</span></li>`).join('')}</ul>` : '<span class="muted" style="font-weight:400">None recorded</span>'}</dd></div>
      <div><dt>Policy version</dt><dd>${curV.version === 1 ? 'Version 1, platform defaults' : `Version ${curV.version}, obligations start date changed`}</dd></div>
      <div><dt>Created</dt><dd>${fdt(c.createdAt)}</dd></div>
    </dl></div></section>`;
      }
      function roCard(c, { readOnly = false } = {}) {
        const o = c.reportingOfficer;
        const canWrite = isAdmin() && !readOnly;
        let body,
          head = '';
        if (S.roLoading)
          body = `<div class="skel-card"><span class="skeleton" style="width:50%"></span><span class="skeleton" style="width:70%"></span><span class="skeleton" style="width:40%"></span><span class="skeleton" style="width:60%"></span></div>`;
        else if (!o)
          body = `<div class="ro-empty"><span class="ico">${icon('userPlus', 19)}</span><h4>No reporting officer</h4><p>Assign the officer responsible for this Commission’s roster. They receive one activation email.</p>${canWrite ? `<div style="margin-top:16px"><button class="btn btn-primary btn-sm" data-act="openAssign" data-arg="assign">${icon('userPlus', 16)} Assign reporting officer</button></div>` : ''}</div>`;
        else {
          head = roBadge(o);
          const inv = o.state === 'invited';
          body = `<div class="sec-b" style="padding-top:6px;padding-bottom:${canWrite ? 6 : 14}px">
      <dl class="dlx">
        <div><dt>Name</dt><dd>${esc(o.name)}</dd></div>
        <div><dt>Email</dt><dd>${esc(o.email)}</dd></div>
        <div><dt>Phone</dt><dd class="tabular">${esc(fmtPhone(o.phone))}</dd></div>
        <div><dt>State</dt><dd>${roBadge(o)}</dd></div>
        ${inv ? `<div><dt>Invited on</dt><dd>${fd(o.invitedAt)} <span class="muted small" style="font-weight:400">(${ago(o.invitedAt)})</span></dd></div>` : `<div><dt>Activated on</dt><dd>${fd(o.activatedAt)}</dd></div>`}
      </dl>
      ${inv ? `<div class="note" style="margin:6px 0 10px">${icon('clock', 15)}<span>The activation link is valid for 72 hours.</span></div>` : ''}
    </div>
    ${canWrite ? `<div class="card-foot" style="justify-content:flex-end">${inv ? `<button class="btn btn-secondary btn-sm" data-act="resend" ${S.resendBusy ? 'disabled aria-busy="true"' : ''}>${S.resendBusy ? spinner(true) + ' Resending…' : icon('send', 15) + ' Resend invitation'}</button>` : ''}<button class="btn btn-secondary btn-sm" data-act="openAssign" data-arg="replace" ${S.resendBusy ? 'disabled' : ''}>${icon('swap', 15)} Replace</button></div>` : ''}`;
        }
        return `<section class="cardx" aria-labelledby="h-ro" aria-busy="${S.roLoading}"><div class="sec-h"><span class="ico">${icon('userCheck', 16)}</span><h3 id="h-ro" tabindex="-1">Reporting officer</h3></div>${body}</section>`;
      }
      function importsFor(c) {
        if (c.imports) return c.imports;
        const r = c.roster;
        return [
          [
            r.lastImportAt,
            'file',
            true,
            'completed',
            [r.expectedDeclarants, 0, Math.round(r.expectedDeclarants * 0.004), r.flagged],
          ],
        ];
      }
      const chBadge = (ch) =>
        ch === 'api'
          ? `<span class="badge badge-ai">${icon('plug', 12)}API</span>`
          : `<span class="badge">${icon('file', 12)}File</span>`;
      const impState = (st) =>
        st === 'completed'
          ? `<span class="badge badge-ok">${icon('check', 12, 2.4)}Completed</span>`
          : `<span class="badge badge-danger">${icon('alert', 12, 2.2)}Failed</span>`;
      function rosterCard(c) {
        const r = c.roster;
        if (r.status === 'none')
          return `<section class="cardx" aria-labelledby="h-roster"><div class="sec-h"><span class="ico">${icon('users', 16)}</span><h3 id="h-roster">Roster</h3></div>${Kit.empty('No roster yet', 'The reporting officer imports the roster after activating their account.', { icon: 'users' })}</section>`;
        const hist = importsFor(c).slice(0, 5);
        const pctv = Math.round(Kit.pct(r.onboardedDeclarants, r.expectedDeclarants));
        return `<section class="cardx" aria-labelledby="h-roster"><div class="sec-h"><span class="ico">${icon('users', 16)}</span><h3 id="h-roster">Roster</h3>${isAdmin() ? `<span class="r"><a class="btn btn-secondary btn-sm" href="02-roster.prototype.html#records" title="Opening roster records is recorded in the audit trail">${icon('eye', 15)} Roster records</a></span>` : ''}</div><div class="sec-b">
    <div class="counts4 wide">
      <div class="cnt"><div class="k">Expected declarants</div><div class="v">${num(r.expectedDeclarants)}</div></div>
      <div class="cnt"><div class="k">Onboarded</div><div class="v">${num(r.onboardedDeclarants)} <small class="muted" style="font-size:13px;font-weight:500">${pctv}%</small></div></div>
      <div class="cnt"><div class="k">Flagged</div><div class="v">${num(r.flagged)}</div></div>
      <div class="cnt"><div class="k">Last import</div><div class="v" style="font-size:16px;margin-top:6px" title="${esc(fdt(r.lastImportAt))}">${fd(r.lastImportAt)}</div></div></div></div>
    ${
      seesAll()
        ? `<div class="table-wrap" style="border-top:1px solid var(--line)"><table class="table"><caption class="vh">Recent imports</caption><thead><tr><th scope="col">Started</th><th scope="col">Channel</th><th scope="col">Complete?</th><th scope="col">State</th><th scope="col" class="num">Created</th><th scope="col" class="num">Updated</th><th scope="col" class="num">Rejected</th><th scope="col" class="num">Flagged</th></tr></thead><tbody>
      ${hist.map(([at, ch, full, st, n]) => `<tr><td class="nowrap">${fdt(at)}</td><td>${chBadge(ch)}</td><td>${full ? 'Yes' : 'Partial'}</td><td>${impState(st)}</td>${(n || [null, null, null, null]).map((x) => `<td class="num">${x == null ? '-' : num(x)}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div><div class="card-foot" style="justify-content:flex-end"><a class="link small" href="02-roster.prototype.html#imports">All imports</a></div>`
        : ''
    }</section>`;
      }
      /* spec 04 FE-4: obligations card for EACC and platform-admin */
      function obligationsCard(c) {
        const o = c.obligations;
        const link = isAdmin() && o;
        return `<section class="cardx" aria-labelledby="h-obl"><div class="sec-h"><span class="ico">${icon('calendar', 16)}</span><div><h3 id="h-obl">Obligations</h3><div class="small muted">Biennial 2027 · due 31 Dec 2027</div></div></div>
    ${
      o
        ? `<div class="sec-b"><div class="counts4">
      <div class="cnt"><div class="k">Upcoming</div><div class="v">${num(o.upcoming)}</div></div>
      <div class="cnt"><div class="k">Due</div><div class="v">${num(o.due)}</div></div>
      <div class="cnt ${o.overdue ? 'warn' : ''}"><div class="k">Overdue</div><div class="v">${num(o.overdue)}</div></div>
      <div class="cnt" title="Due or overdue, not onboarded"><div class="k">Not onboarded</div><div class="v">${num(o.notOnboarded)}</div></div></div></div>${link ? `<div class="card-foot" style="justify-content:flex-end"><a class="btn btn-secondary btn-sm" href="04-obligations.prototype.html?slug=${c.slug}#obligations">Obligations ${icon('arrowRight', 15)}</a></div>` : ''}`
        : Kit.empty(
            'No obligations yet',
            'Obligations appear when the roster is imported and a cycle opens.',
            { icon: 'calendar' },
          )
    }</section>`;
      }
      /* spec 04 FE-4: policy card (commission-admin of the tenant, platform-admin); read only for other staff of the tenant */
      function policyCard(c, { canChange }) {
        const pv = S.policies[c.slug];
        const v = pv[pv.length - 1];
        const hist = pv.slice().reverse();
        return `<section class="cardx" aria-labelledby="h-policy"><div class="sec-h"><span class="ico">${icon('settings', 16)}</span><div><h3 id="h-policy">Policy</h3><div class="small muted">Version ${v.version} in force since ${fd(v.effectiveFrom)}</div></div></div>
    <div class="sec-b" style="padding-top:4px;padding-bottom:8px"><div class="pgrid">
      <div class="prow"><div class="k">Statutory periods</div><div class="v">Initial: ${v.initialDueAfterAppointmentDays} days after appointment<br/>Biennial: statement 1 Nov, due 31 Dec<br/>Final: ${v.finalDueAfterExitDays} days after leaving office</div><div></div></div>
      <div class="prow"><div class="k">Reminders</div><div class="v">${v.reminderOffsetsDays.join(', ').replace(/, (\d+)$/, ' and $1')} days before due</div><div></div></div>

      /* ================= modals ================= */

        const foot = `<div class="once">${icon('mail', 15)}<span>One activation email will be sent to this address. No one else is contacted.</span></div>
    <div class="foot-btns"><button class="btn btn-ghost" data-act="closeModal" ${dis}>Cancel</button><button class="btn btn-primary" data-act="submitAssign" ${dis} ${busy ? 'aria-busy="true"' : ''} style="min-width:170px">${busy ? spinner() + ' Sending…' : `${icon('send', 16)} Send invitation`}</button></div>`;

      function mPolicy() {

    <div class="preview">${icon('calendar', 16)}<span>Current start date: <b style="color:var(--ink)">${fd(v.obligationsStartDate)}</b> (version ${v.version})</span></div>
    ${ff('Obligations start date', `<input id="f-pf-date" class="input" type="date" data-bind="pf.date" value="${esc(f.date)}" ${described('f-pf-date', f.error)} ${dis}/>`, { id: 'f-pf-date', error: f.error, hint: 'Initial declarations are created only for appointments on or after this date. Earlier appointments are assumed to have declared outside Adili.' })}
    <div class="note">${icon('info', 15)}<span>Saves as version ${v.version + 1}, effective now.</span></div>`;
        const foot = `<button class="btn btn-ghost" data-act="closeModal" ${dis}>Cancel</button><button class="btn btn-primary" data-act="submitPolicy" ${dis} ${busy ? 'aria-busy="true"' : ''} style="min-width:220px">${busy ? spinner() + ' Saving…' : 'Save as new policy version'}</button>`;

      /* ================= actions ================= */
      let searchT = null;

        openDetail: (slug, el, e) => {

      function focusFirstInvalid() {
        setTimeout(() => {
          const el = document.querySelector(
            '#view [aria-invalid="true"], #layer [aria-invalid="true"]',
          );
          if (el) (el.tagName === 'FIELDSET' ? el.querySelector('input') : el).focus();
        }, 0);

      function submitCreate(forceSim) {
        const f = S.create;
        if (f.state === 'submitting') return;
        f.tried = true;
        f.alert = null;
        f.summary = null;
        f.errors = validateCreate(f);
        const n = Object.keys(f.errors).length;
        if (n) {
          f.summary = { title: `Fix ${n} field${n > 1 ? 's' : ''} to continue` };
          Kit.render();
          focusFirstInvalid();
          return;
        }
        f.state = 'submitting';
        Kit.render();
        const sim = forceSim || f.sim;
        setTimeout(
          () => {
            if (S.create !== f) return;
            f.state = 'editing';
            const name = f.name.trim();
            const dupSlug = byslug(f.slug);
            const dupName = S.commissions.find((c) => c.name.toLowerCase() === name.toLowerCase());
            if (sim === 'error') {
              f.alert = alertBox(
                'danger',
                'The Commission was not created. Try again.',
                'Your details are kept. Retrying is safe.',
                '',
                { role: 'alert' },
              );
            } else if (sim === '422') {
              f.alert = alertBox(
                'danger',
                'This form changed after an earlier attempt',
                'The first attempt may have created the Commission. Check the Commissions list before creating it again.',
                `<button class="btn btn-secondary btn-sm" data-act="go" data-arg="commissions">Check the list</button>`,
                { role: 'alert' },
              );
            } else if (sim === 'conflict-nopath') {
              f.alert = alertBox(
                'danger',
                'A Commission with this key or name already exists.',
                '',
                '',
                { role: 'alert' },
              );
            } else if (sim === '400') {
              f.errors = {
                categories:
                  'One of the selected categories is not in the statutory list. Reload the page and choose again.',
              };
              f.summary = {
                title: 'Fix 1 field to continue',
                text: 'Also: the request had a field the directory does not accept (issuerCode).',
              };
              setTimeout(() => document.querySelector('#view .crow input')?.focus(), 0);
            } else if (dupSlug) {
              f.errors = {
                slug: `The key ${esc(f.slug)} is already used by ${esc(dupSlug.name)}.`,
              };
              focusFirstInvalid();
            } else if (dupName) {
              f.errors = { name: 'A Commission with this name already exists.' };
              focusFirstInvalid();
            } else {
              const c = C(
                f.slug,
                name,
                f.type,
                CATS.map((x) => x.code).filter((k) => f.cats[k]),
                nowIso(),
                null,
                roster(),
              );
              S.commissions.push(c);
              S.policies[c.slug] = [
                {
                  id: 'pv-' + c.slug + '-1',
                  version: 1,
                  effectiveFrom: c.createdAt,
                  obligationsStartDate: c.createdAt.slice(0, 10),
                  ...DEFAULT_POLICY,
                  createdBy: Kit.PERSONAS[P()].name,
                  createdAt: c.createdAt,
                },
              ];
              S.create = newCreate();
              S.sel = c.slug;
              S.detailState = 'ready';
              Kit.go('detail');
              syncUrl();
              Kit.toast(`${name} created`, false);
              return;
            }
            Kit.render();
          },
          forceSim === 'hold' ? 1e9 : 1000,
        );
      }

      function validateAssign(f) {
        const e = {};
        const n = f.name.trim();
        if (n.length < 2 || n.length > 120) e.name = 'Enter the officer’s full name.';
        if (!validEmail(f.email.trim())) e.email = 'Enter a valid official email address.';
        if (!normPhone(f.phone))
          e.phone = 'Enter a valid phone number, e.g. 0712 345 678 or +254 712 345 678.';
        return e;
      }
      function submitAssign(forceSim) {
        const f = S.af;
        const c = cur();
        if (f.state === 'submitting') return;
        f.tried = true;
        f.alert = null;
        f.errors = validateAssign(f);
        if (Object.keys(f.errors).length) {
          Kit.render();
          focusFirstInvalid();
          return;
        }
        f.state = 'submitting';
        S.modal.busy = true;
        Kit.render();
        const sim = forceSim || f.sim;
        if (sim === 'hold') return;
        setTimeout(() => {
          if (S.af !== f || !S.modal) return;
          f.state = 'editing';
          S.modal.busy = false;
          const email = f.email.trim().toLowerCase();
          const owner = KNOWN_ACCOUNTS[email];
          if (sim === 'error') {
            f.alert = alertBox('danger', 'The invitation was not sent. Try again.', '', '', {
              role: 'alert',
            });
          } else if (sim === '400') {
            f.errors = {
              phone: 'Enter a valid phone number, e.g. 0712 345 678 or +254 712 345 678.',
            };
            f.alert = alertBox(
              'danger',
              'Some details were not accepted',
              'Check the highlighted field.',
              '',
              { role: 'alert' },
            );
            focusFirstInvalid();
          } else if (owner && owner !== c.slug) {
            f.errors = { email: 'This email already belongs to an account in another Commission.' };
            focusFirstInvalid();
          } else {
            KNOWN_ACCOUNTS[email] = c.slug;
            c.reportingOfficer = ro(f.name.trim(), email, normPhone(f.phone), 'invited', nowIso());
            S.modal = null;
            S.roLoading = true;
            Kit.render();
            Kit.toast(`Invitation sent to ${email}`, false);
            setTimeout(() => {
              S.roLoading = false;
              Kit.render();
              document.getElementById('h-ro')?.focus();
            }, 500);
            return;
          }
          Kit.render();
        }, 1000);
      }
      function resend(forceSim) {
        const c = cur();
        if (S.resendBusy) return;
        S.resendBusy = true;
        Kit.render();
        const sim = forceSim || S.resendSim;
        if (sim === 'hold') return;
        setTimeout(() => {
          if (cur() !== c || !S.resendBusy) return;
          S.resendBusy = false;
          if (sim === '409' || c.reportingOfficer._activatedOnServer) {
            S.resendSim = null;
            c.reportingOfficer.state = 'activated';
            c.reportingOfficer.activatedAt =
              c.reportingOfficer.activatedAt || '2026-09-26T09:52:00';
            S.roLoading = true;
            Kit.toast('This officer has already activated.', true);
            setTimeout(() => {
              S.roLoading = false;
              Kit.render();
            }, 500);
          } else Kit.toast(`Invitation sent again to ${c.reportingOfficer.email}`, false);
        }, 900);
      }
      function submitPolicy(forceSim) {
        const f = S.pf;
        const c = cur();
        const pv = S.policies[c.slug];
        const v = pv[pv.length - 1];
        f.alert = null;
        f.error = '';
        if (!f.date || !/^\d{4}-\d{2}-\d{2}$/.test(f.date)) f.error = 'Enter a valid date.';
        else if (f.date === v.obligationsStartDate)
          f.error = 'This is already the start date in force. Choose a different date.';
        if (f.error) {
          Kit.render();
          focusFirstInvalid();
          return;
        }
        f.state = 'submitting';
        S.modal.busy = true;
        Kit.render();
        const sim = forceSim || f.sim;
        if (sim === 'hold') return;
        setTimeout(() => {
          if (S.pf !== f || !S.modal) return;
          f.state = 'editing';
          S.modal.busy = false;
          if (sim === 'error') {
            f.alert = alertBox(
              'danger',
              'The policy was not changed. Try again.',
              'Version ' + v.version + ' is still in force.',
              '',
              { role: 'alert' },
            );
            Kit.render();
            return;
          }
          const nv = {
            ...v,
            id: 'pv-' + c.slug + '-' + (v.version + 1),
            version: v.version + 1,
            effectiveFrom: nowIso(),
            obligationsStartDate: f.date,
            createdBy: Kit.PERSONAS[P()].name,
            createdAt: nowIso(),
          };
          pv.push(nv);
          c.policyVersion = nv.version;
          S.modal = null;
          Kit.render();
          Kit.toast(`Policy version ${nv.version} in force`, false);
        }, 900);
      }

      /* ================= a11y helpers: focus into dialogs, trap, and return ================= */
      let prevModal = null;
      function afterRender() {
        const m = S.modal?.kind || null;
        if (m && m !== prevModal)
          setTimeout(() => {
            const el =
              document.querySelector('#layer .dialog input:not([disabled])') ||
              document.querySelector('#layer .dialog .dialog-foot button:not([disabled])');
            el?.focus();
          }, 30);
        if (!m && prevModal && S._ret) {
          const r = S._ret;
          setTimeout(() => {
            const t =
              document.querySelector(
                `#view [data-act="${r.act}"]${r.arg ? `[data-arg="${r.arg}"]` : ''}`,
              ) || document.querySelector('#view #h-ro');
            t?.focus();
          }, 0);
          S._ret = null;
        }
        prevModal = m;
        if (S.screen !== 'landing') syncUrl();
      }
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Tab') return;
        const box = document.querySelector('#layer .dialog, #layer .drawer');
        if (!box) return;
        const els = [
          ...box.querySelectorAll(
            'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])',
          ),
        ].filter((x) => !x.disabled && x.offsetParent !== null);
        if (!els.length) return;
        const first = els[0],
          last = els[els.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        } else if (!box.contains(document.activeElement)) {
          e.preventDefault();
          first.focus();
        }
      });

      /* ================= binding side effects ================= */
      const soon = () => {
        clearTimeout(soon.t);
        soon.t = setTimeout(() => Kit.render(), 0);
      };
      function onBind(path, v) {
        if (path === 'create.slug') {
          S.create.slug = String(v).toLowerCase().replace(/\s+/g, '');
          if (S.create.tried) {
