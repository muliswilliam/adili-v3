          : `<div class="td-strong">${esc(r.applicant.name)}</div><div class="sub">${esc(r.applicant.occupation)}</div>`;
        const offCell = off
          ? `<div class="td-strong">${esc(off.name)}</div><div class="sub">File ${off.file}</div>`
          : `<div class="td-strong">${esc(sought)}</div><div class="sub">Not identified${r.status === 'cannot-identify' ? '' : ' yet'}</div>`;
        const st = isLea ? leaBadge(r.status) : fkBadge(r.status);
        let dl;
        if (x.open) {
          const soon = isLea ? SOON.lea : x.window ? SOON.window : SOON.decision;
          const lab = x.window ? 'Representations close' : 'Decision due';
          dl = `${deadlineChip(x.due, { soon, label: lab })}<div class="sub nowrap">${x.window ? 'Closes' : 'Due'} ${fmtShort(x.due)}</div>`;
        } else if (x.decided) dl = `<span class="small muted">Decided ${fmtDate(x.doneAt)}</span>`;
        else dl = `<span class="small muted">Closed ${x.doneAt ? fmtDate(x.doneAt) : ''}</span>`;
        return `<tr class="click" data-act="open" data-arg="${r.id}"><td><span class="mono ref">${r.ref}</span><div class="sub nowrap">${isLea ? 'Law enforcement' : 'Form K'} · ${fmtShort(x.at)}</div></td><td>${who}</td><td>${offCell}</td><td>${st}</td><td>${dl}</td></tr>`;
      }
      function scrRequests() {
        const g = guard('requests');
        if (g) return g;
        const all = rowsAll();
        const openN = (k) => all.filter((x) => (k === 'all' || x.kind === k) && x.open).length;
        const copyOpen = S.apps.filter(
          (a) => !['collected', 'dispatched'].includes(a.status),
        ).length;
        const tabs = [
          ['all', 'All', openN('all')],
          ['form-k', 'Form K', openN('form-k')],
          ['lea', 'Law enforcement', openN('lea')],
          ['copies', 'Certified copies', copyOpen],
        ];
        const tabBar = `<div class="tabs tabs-wrap" role="tablist" aria-label="Request types">${tabs
          .map(
            ([k, l, n]) =>
              `<button role="tab" aria-selected="${S.tab === k}" class="${S.tab === k ? 'on' : ''}" data-act="tab" data-arg="${k}">${l}${n ? `<span class="count">${n}</span>` : ''}</button>`,
          )
          .join('')}</div>`;
        const head = `<div class="page-head"><div><h1>Access requests</h1></div><div class="actions-r">${roBadge()}${S.tab === 'copies' && !readOnly() ? `<button class="btn btn-primary btn-sm" data-act="newCopy">${icon('plus', 15)} Record application</button>` : ''}</div></div>`;
        if (S.tab === 'copies')
          return shell(`<main class="cpage">${head}${tabBar}${copiesCard()}</main>`, {
            crumbs: [['Access requests']],
          });
        const q = S.q;
        const s = q.search.trim().toLowerCase();
        const base = all.filter((x) => S.tab === 'all' || x.kind === S.tab);
        const rows = base
          .filter((x) => fpass(x, q.filter))
          .filter((x) => {
            if (!s) return true;
            const r = x.r;
            const hay = [
              r.ref,
              x.kind === 'lea'
                ? r.officer.name +
                  ' ' +
                  agencyName(r.officer.agency) +
                  ' ' +
                  r.officerSought.name +
                  ' ' +
                  r.caseRef
                : r.applicant.name + ' ' + r.partII.name,
              r.resolved ? rr(r.resolved).name + ' ' + rr(r.resolved).file : '',
            ]
              .join(' ')
              .toLowerCase();
            return hay.includes(s);
          })
          .sort((a, b) =>
            a.open !== b.open
              ? a.open
                ? -1
                : 1
              : a.open
                ? new Date(a.due) - new Date(b.due)
                : new Date(b.doneAt || b.at) - new Date(a.doneAt || a.at),
          );
        const key = `${S.tab}|${q.filter}|${s}|${q.pageSize}`;
        if (q.key !== key) {
          q.key = key;
          q.page = 1;
        }
        const size = Number(q.pageSize) || 10;
        const page = rows.slice((q.page - 1) * size, q.page * size);
        const n = (f) => base.filter((x) => fpass(x, f)).length;
        const chips = FILTERS.map(
          ([k, l]) =>
            `<button class="chip ${q.filter === k ? 'on' : ''}" data-act="qFilter" data-arg="${k}" aria-pressed="${q.filter === k}">${k === 'late' && n('late') ? `<span class="dot danger"></span>` : ''}${l} <span class="n">${n(k)}</span></button>`,
        ).join('');
        const thead = `<thead><tr><th>Reference</th><th>${S.tab === 'lea' ? 'Agency' : S.tab === 'form-k' ? 'Applicant' : 'Applicant or agency'}</th><th>Officer</th><th>Status</th><th>Deadline</th></tr></thead>`;
        let body;
        if (q.loading)
          body = `<div class="table-wrap"><table class="table">${thead}<tbody>${Kit.skeletonRows(6, 5)}</tbody></table></div>`;
        else if (q.error)
          body = `<div class="sec-b"><div class="callout callout-danger">${icon('alert', 16)}<div style="flex:1">Could not load the queue. Check your connection.</div><button class="btn btn-secondary btn-sm" data-act="retryQ">Retry</button></div></div>`;
        else if (q.empty)
          body = Kit.empty(
            'No requests yet',
            'Form K and law enforcement requests to PSC appear here.',
            { icon: 'lock' },
          );
        else if (!rows.length)
          body = Kit.empty('No matches', 'No requests match these filters.', {
            icon: 'search',
            action: `<button class="btn btn-secondary btn-sm" data-act="clearQ">Clear filters</button>`,
          });
        else
          body = `<div class="table-wrap"><table class="table">${thead}<tbody>${page.map(queueRow).join('')}</tbody></table></div>${Kit.pager(
            {
              page: q.page,
              pageSize: size,
              act: 'qPage',
              label: 'requests',
              hasNext: q.page * size < rows.length,
              count: page.length,
              sizes: [10, 25, 50],
              sizeBind: 'q.pageSize',
            },
          )}`;
        return shell(
          `<main class="cpage">${head}${tabBar}
          <div class="card">
            <div class="toolbar"><div class="input-group"><span class="addon">${icon('search', 16)}</span><input class="input" id="f-q-search" aria-label="Search requests" placeholder="Reference, name or file number" data-bind="q.search" data-live value="${esc(q.search)}"/></div>
              <div class="row wrap" style="gap:6px">${chips}</div></div>
            ${body}
          </div>
        </main>`,
          { crumbs: [['Access requests']] },
        );
      }

      /* ---------- certified copies tab (#304) ---------- */
      const APP_ST = {
        recorded: ['To issue', 'warn'],
        issuing: ['Preparing', ''],
        failed: ['Issue failed', 'danger'],
        issued: ['Ready', 'brand'],
        collected: ['Collected', 'ok'],
        dispatched: ['Dispatched', 'info'],
      };
      const appBadge = (st) => badge(APP_ST[st][0], APP_ST[st][1]);
      function copiesCard() {
        const list = S.apps.slice().sort((a, b) => {
          const oa = !['collected', 'dispatched'].includes(a.status);
          const ob = !['collected', 'dispatched'].includes(b.status);
          return oa !== ob
            ? oa
              ? -1
              : 1
            : oa
              ? new Date(a.deadlineAt) - new Date(b.deadlineAt)
              : new Date(b.receivedAt) - new Date(a.receivedAt);
        });
        const size = Number(S.copies.pageSize) || 10;
        const page = list.slice((S.copies.page - 1) * size, S.copies.page * size);
        return `<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Declarant</th><th>Applied by</th><th>Version</th><th>Status</th><th>Deadline</th></tr></thead><tbody>${page
          .map((a) => {
            const o = rr(a.rr);
            const open = !['collected', 'dispatched'].includes(a.status);
            return `<tr class="click" data-act="openApp" data-arg="${a.id}"><td><div class="td-strong">${esc(o.name)}</div><div class="sub">File ${o.file}</div></td><td>${a.who === 'rep' ? `<div class="td-strong">${esc(a.rep.name)}</div><div class="sub">Representative</div>` : '<div class="td-strong">In person</div><div class="sub">The declarant</div>'}</td><td><span class="mono small">${a.version[0]}</span><div class="sub">Version ${a.version[1]} · ${a.delivery === 'collect' ? 'Collect' : 'Dispatch'}</div></td><td>${appBadge(a.status)}</td><td>${!open ? `<span class="small muted">${a.status === 'collected' ? 'Collected' : 'Dispatched'} ${fmtDate(a.doneAt)}</span>` : a.issuedAt ? deadlineChip(a.deadlineAt, { done: `Issued ${fmtShort(a.issuedAt)}` }) : `${deadlineChip(a.deadlineAt, { soon: SOON.copy, label: 'Issue by' })}<div class="sub">Issue by ${fmtShort(a.deadlineAt)}</div>`}</td></tr>`;
          })
          .join(
            '',
          )}</tbody></table></div>${Kit.pager({ page: S.copies.page, pageSize: size, total: list.length, act: 'copyPage' })}</div>`;
      }

      /* =====================================================================
       * Form K request detail (#254) and decision (#260)
       * ===================================================================== */
      function formKCard(r) {
        const a = r.applicant;
        const idTxt =
          a.idKind === 'passport'
            ? `Passport ${esc(a.idNumber)} (${esc(a.country)})`
            : `National ID ${esc(a.idNumber)}`;
        const idB =
          r.idStatus === 'verified'
            ? badge(
                `${icon('check', 12, 2.4)} ${a.idKind === 'passport' ? 'Verified by officer' : 'IPRS match'}`,
                'ok',
              )
            : badge('Pending verification', 'warn');
        return `<div class="card"><div class="sec-h"><h3>Form K</h3><span class="spacer"></span><span class="small muted">Declared ${fmtDateTime(r.declaredAt)}</span></div>
          <div class="fk-part"><div class="fk-lab">Part I · Applicant</div><div class="kv k3">
            <div><div class="k">Name</div><div class="v">${esc(a.name)}</div></div>
            <div><div class="k">Identity</div><div class="v">${idTxt}<div style="margin-top:4px">${idB}</div></div></div>
            <div><div class="k">Occupation</div><div class="v">${esc(a.occupation)}</div></div>
            <div><div class="k">Telephone</div><div class="v">${esc(a.phone)}</div></div>
            <div><div class="k">Email</div><div class="v">${esc(a.email)}</div></div>
            <div><div class="k">Postal address</div><div class="v">${esc(a.postal)}</div></div>
            <div><div class="k">Physical address</div><div class="v">${esc(a.physical)}</div></div>
          </div></div>
          <div class="fk-part"><div class="fk-lab">Part II · Officer sought</div><div class="kv k3">
            <div><div class="k">Name</div><div class="v">${esc(r.partII.name)}</div></div>
            <div><div class="k">Entity</div><div class="v">${esc(r.partII.entity)}</div></div>
            <div><div class="k">Work station</div><div class="v">${esc(r.partII.workStation) || '-'}</div></div>
            <div><div class="k">Personnel file number</div><div class="v">${esc(r.partII.file) || '<span class="muted" style="font-weight:400">Not given</span>'}</div></div>
          </div></div>
          <div class="fk-part"><div class="fk-lab">Part III · Information sought</div>
            <div><div class="small muted">Information</div><div class="para">${esc(r.partIII.informationSought)}</div></div>
            <div><div class="small muted">Reason</div><div class="para">${esc(r.partIII.reason)}</div></div>
            ${r.partIII.otherInformation ? `<div><div class="small muted">Other information</div><div class="para">${esc(r.partIII.otherInformation)}</div></div>` : ''}
          </div>
          <div class="fk-part"><div class="fk-lab">Scope requested</div>${scopeKv(r.scope, { cols: '' })}</div>
          <div class="fk-part"><div class="fk-lab">Part IV · Declaration</div><div class="fk-quote">I declare that the information I have given above is true, complete and correct to the best of my knowledge.</div></div>
        </div>`;
      }
      function repsPanel(r) {
        if (!r.notifiedAt) return '';
        const open = !past(r.windowEndsAt) && r.status === 'awaiting-representations';
        let body;
        if (!r.reps)
          body = open
            ? `<div class="muted-card">No representations yet. The window closes ${fmtDate(r.windowEndsAt)}.</div>`
            : `<div class="muted-card">None received. The window closed ${fmtDate(r.windowEndsAt)}.</div>`;
        else
          body = `<div class="row wrap" style="gap:8px">${stanceBadge(r.reps.stance)}<span class="small muted">${r.reps.updatedAt !== r.reps.submittedAt ? `Edited ${fmtDateTime(r.reps.updatedAt)}` : fmtDateTime(r.reps.submittedAt)}</span></div>
            <div class="para" style="font-size:14px">${esc(r.reps.text)}</div>
            ${r.reps.attachments.length ? `<div class="docs">${r.reps.attachments.map(([n, sz]) => `<div class="doc-row"><span class="di">${icon('clip', 15)}</span><div style="flex:1;min-width:0"><div class="dn truncate">${esc(n)}</div><div class="ds">${sz} · Scanned clean</div></div><button class="btn btn-ghost btn-sm" data-act="toast" data-arg="The attachment would open in a new tab">${icon('eye', 15)}<span class="sr-only">Open ${esc(n)}</span></button></div>`).join('')}</div>` : ''}
            ${r.reps.stance === 'consent' ? `<div class="small muted">Consent closed the window early.</div>` : ''}`;
        return `<div class="card"><div class="sec-h"><h3>Representations</h3></div><div class="sec-b" style="display:grid;gap:12px">${body}</div></div>`;
      }
      function officerCard(r) {
        if (!r.resolved) return '';
        const o = rr(r.resolved);
        return `<div class="card"><div class="sec-b kv1"><div><div class="k">Officer identified</div><div class="v">${esc(o.name)}</div><div class="small muted">File ${o.file} · ${esc(o.designation)}</div><div class="small muted">${esc(o.entity)}</div></div>${r.notifiedAt ? `<div><div class="k">Notified</div><div class="v">${fmtDateTime(r.notifiedAt)}</div></div>` : ''}</div></div>`;
      }
      function rosterHits(q) {
        const t = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
        if (!t.length) return null;
        return ROSTER.filter((x) =>
          t.every((w) => `${x.name} ${x.file}`.toLowerCase().includes(w)),
        );
      }
      function identifyCard(r) {
        const hits = rosterHits(S.idq);
        const list =
          hits === null
            ? ''
            : !hits.length
              ? `<div class="muted-card">No roster record matches. Try the personnel file number.</div>`
              : `<div class="hits">${hits
                  .slice(0, 6)
                  .map(
                    (x) =>
                      `<div class="hit"><div style="flex:1;min-width:0"><div class="hn">${esc(x.name)}</div><div class="hs">File ${x.file} · ${esc(x.designation)}</div><div class="hs truncate">${esc(x.entity)}</div></div><button class="btn btn-secondary btn-xs" data-act="modal" data-arg="resolve|${x.id}">Select</button></div>`,
                  )
                  .join('')}</div>`;
        return `<div class="card"><div class="sec-h"><h3>Identify officer</h3></div><div class="sec-b">
          <div class="muted-card small">Form K names <b>${esc(r.partII.name)}</b>, ${esc(r.partII.entity)}${r.partII.workStation ? ', ' + esc(r.partII.workStation) : ''}.</div>
          <div class="input-group"><span class="addon">${icon('search', 16)}</span><input class="input" id="f-idq" aria-label="Search the roster by name or file number" placeholder="Name or file number" data-bind="idq" data-live value="${esc(S.idq)}"/></div>
          ${list}
          <div class="row" style="justify-content:space-between;gap:8px"><span class="small muted">Not on the roster?</span><button class="btn btn-danger-ghost btn-sm" data-act="modal" data-arg="cannot">${icon('userX', 15)} Cannot identify</button></div>
        </div></div>`;
      }
      function verifyCard(r) {
        const a = r.applicant;
        return `<div class="card"><div class="sec-h"><h3>Verify applicant</h3></div><div class="sec-b">
          <div class="kv1"><div><div class="k">Passport</div><div class="v">${esc(a.idNumber)} · ${esc(a.country)}</div></div><div><div class="k">Phone</div><div class="v">${esc(a.phone)} <span class="small muted">confirmed by code</span></div></div></div>
          ${checkbox('verify.checked', 'Particulars checked against the passport')}
          ${field('Note', textarea('verify.note', { rows: 3, ph: 'How you checked, e.g. copy seen by email', extra: 'data-live' }), { id: 'f-verify-note' })}
          <button class="btn btn-primary btn-block" data-act="verifyApplicant" ${S.verify.checked && S.verify.note.trim() ? '' : 'disabled'}>${icon('userCheck', 16)} Record verification</button>
        </div></div>`;
      }
      function decisionSummary(r, { lea = false } = {}) {
        const d = r.decision;
        const o = d.outcome;
        const lbl = o === 'grant' ? 'Granted' : o === 'deny' ? 'Denied' : 'Partially granted';
        // Letter variants in documents.prototype.html: partial = ARQ-...118-3, grant = ARQ-...097-M, deny = ARQ-...088-4.
        const letter = lea
          ? o === 'deny'
            ? 'lea-response-deny'
            : 'lea-response'
          : o === 'deny'
            ? 'access-decision-deny'
            : o === 'grant'
              ? 'access-decision-grant'
              : 'access-decision';
        return `<div class="card"><div class="sec-h"><h3>Decision</h3><span class="spacer"></span><span class="small muted">Final</span></div><div class="sec-b">
          <div class="outcome-v"><span class="oi ${o === 'deny' ? 'danger' : 'ok'}">${icon(o === 'deny' ? 'x' : 'check', 16, 2.6)}</span>${lbl}</div>
          <div class="kv1">
            ${o === 'partial-grant' ? `<div><div class="k">Granted scope</div><div class="v">${scopeText(d.scope)}</div></div>` : ''}
            ${d.grounds.length ? `<div><div class="k">Regulation 24 grounds</div><div class="v">${d.grounds.map((g) => esc(GROUNDS[g][0])).join('<br/>')}</div></div>` : ''}
            <div><div class="k">Reasons</div><div class="v" style="font-weight:400">${esc(d.reasons)}</div></div>
            <div><div class="k">Decided by</div><div class="v">${esc(d.by)} · ${fmtDateTime(d.at)}</div></div>
          </div>
          ${docLink(letter, lea ? 'Response letter' : 'Decision letter')}
        </div></div>`;
      }
      function packageCard(r, { lea = false } = {}) {
        if (!r.pkg) return '';
        const p = r.pkg;
        const who = lea ? r.officer.name : r.applicant.name;
        if (p.state === 'preparing')
          return `<div class="card"><div class="sec-h"><h3>Package</h3><span class="spacer"></span><span class="cls confidential">${icon('lock', 11)} Confidential</span></div><div class="sec-b"><div class="row" style="gap:10px"><span class="spinner dark"></span><div class="small">Preparing: rendering the granted scope, watermarking and signing.</div></div></div></div>`;
        const exp = past(p.expiresAt);
        return `<div class="card"><div class="sec-h"><h3>Package</h3><span class="spacer"></span><span class="cls confidential">${icon('lock', 11)} Confidential</span></div><div class="sec-b">
          <div class="kv1">
            <div><div class="k">Issued</div><div class="v">${fmtDateTime(p.issuedAt)}</div></div>
            <div><div class="k">${exp ? 'Window closed' : 'Download until'}</div><div class="v row wrap" style="gap:8px">${fmtDate(p.expiresAt)} ${exp ? badge('Closed', 'warn') : deadlineChip(p.expiresAt, { soon: SOON.download, label: 'Download until', today: 'Ends today' })}</div></div>
            <div><div class="k">Downloads</div><div class="v">${num(p.downloads.length)}${p.downloads.length ? ` <span class="small muted">· last ${fmtDateTime(p.downloads[p.downloads.length - 1])}</span>` : ''}</div></div>
            <div><div class="k">Watermark ${tip('On every page. A leaked copy traces back to its recipient.')}</div><div class="v" style="font-weight:400">${esc(who)} · <span class="mono nowrap">${r.ref}</span> · ${fmtDate(p.issuedAt)}</div></div>
            <div><div class="k">Verification code</div><div class="v mono" style="font-size:13px">${esc(p.code)}</div></div>
          </div>
          <div class="small muted">${icon('lock', 13)} Only ${esc(who)} can download it.</div>
        </div></div>`;
      }
      function scrRequest() {
        const g = guard('requests');
        if (g) return g;
        const r = reqById(S.sel) || reqById('r-hero');
        const ro = readOnly();
        let side = '';
        const st = r.status;
        if (!ro) {
          if (st === 'pending-applicant-verification') side = verifyCard(r);
          else if (st === 'submitted' || st === 'officer-unresolved') side = identifyCard(r);
        }
        if (st === 'pending-applicant-verification' && ro)
          side = `<div class="card"><div class="sec-b"><div class="muted-card">Waiting for the access officer to verify the passport particulars.</div></div></div>`;
        if ((st === 'submitted' || st === 'officer-unresolved') && ro)
          side = `<div class="card"><div class="sec-b"><div class="muted-card">Waiting for the access officer to identify the officer.</div></div></div>`;
        if (st === 'awaiting-representations')
          side = `<div class="card"><div class="sec-h"><h3>Decision</h3><span class="spacer"></span>${deadlineChip(r.decisionDeadlineAt, { soon: SOON.decision, label: 'Decision due' })}</div><div class="sec-b"><div class="small muted">Opens when representations close on ${fmtDate(r.windowEndsAt)}, or earlier if the declarant consents.</div><button class="btn btn-secondary btn-block" disabled>${icon('lock', 15)} Decide</button></div></div>`;
        if (st === 'under-decision')
          side = `<div class="card"><div class="sec-h"><h3>Decision</h3><span class="spacer"></span>${deadlineChip(r.decisionDeadlineAt, { soon: SOON.decision, label: 'Decision due' })}</div><div class="sec-b">${ro ? `<div class="muted-card">Only the access officer decides.</div>` : `<button class="btn btn-primary btn-block" data-act="decide">${icon('scale', 16)} Decide</button>`}</div></div>`;
        if (r.decision) side = decisionSummary(r) + packageCard(r);
        if (st === 'cannot-identify')
          side = `<div class="card"><div class="sec-h"><h3>Closed</h3></div><div class="sec-b"><div class="outcome-v"><span class="oi muted">${icon('userX', 15, 2.4)}</span>Cannot identify officer</div><div class="small" style="color:var(--ink-2)">${esc(r.closeNote)}</div><div class="small muted">${ME} · ${fmtDateTime(r.closedAt)}. Applicant notified.</div>${docLink('access-decision-cannot-identify', 'Letter to applicant')}</div></div>`;
        if (st === 'withdrawn')
          side = `<div class="card"><div class="sec-h"><h3>Closed</h3></div><div class="sec-b"><div class="outcome-v"><span class="oi muted">${icon('undo', 15, 2.4)}</span>Withdrawn</div><div class="small muted">By the applicant · ${fmtDateTime(r.closedAt)}</div></div></div>`;
        const open = FK_OPEN.includes(st);
        const dueHead =
          open && st !== 'awaiting-representations' && st !== 'under-decision'
            ? `<div class="actions-r" style="align-items:center">${deadlineChip(r.decisionDeadlineAt, { soon: SOON.decision, label: 'Decision due' })}<span class="small muted">Decision due ${fmtDate(r.decisionDeadlineAt)}</span></div>`
            : '';
        return shell(
          `<main class="cpage">
          <div class="page-head"><div style="min-width:0"><div class="row wrap" style="gap:8px;margin-bottom:6px">${fkBadge(st)}${badge('Form K')}${roBadge()}</div><h1 class="h-ref">${r.ref}</h1><p>${esc(r.applicant.name)} · received ${fmtDate(r.submittedAt)}</p></div>${dueHead}</div>
          <div class="split">
            <div class="stack">${formKCard(r)}<div class="card"><div class="sec-h"><h3>Register</h3></div><div class="sec-b">${registerTimeline(fkTimeline(r))}</div></div></div>
            <div class="side">${side}${officerCard(r)}${repsPanel(r)}</div>
          </div>
        </main>`,
          { crumbs: [['Access requests', 'requests'], [r.ref]], active: 'Access requests' },
        );
      }

      function scrDecide() {
        const g = guard('requests');
        if (g) return g;
        const r = selReq();
        const isLea = r.kind === 'lea';
        const back = isLea ? 'lea-request' : 'request';
        const crumbs = [['Access requests', 'requests'], [r.ref, back], ['Decide']];
        if (readOnly())
          return shell(
            `<main class="cpage narrow"><div class="card">${Kit.empty('Only the access officer decides', 'Supervisors can read requests and decisions.', { icon: 'eye', action: `<button class="btn btn-secondary btn-sm" data-act="go" data-arg="${back}">Back to request</button>` })}</div></main>`,
            { crumbs, active: 'Access requests' },
          );
        const ready = isLea ? r.status === 'verified' : r.status === 'under-decision';
        if (!ready && !S.decide.problem)
          return shell(
            `<main class="cpage narrow"><div class="card">${Kit.empty(r.decision ? 'Already decided' : 'Not ready to decide', r.decision ? `Decided by ${esc(r.decision.by)} on ${fmtDate(r.decision.at)}. Decisions are final.` : 'The request must be under decision first.', { icon: 'lock', action: `<button class="btn btn-secondary btn-sm" data-act="go" data-arg="${back}">Back to request</button>` })}</div></main>`,
            { crumbs, active: 'Access requests' },
          );
        const d = S.decide;
        const e = d.errors;
        const opts = isLea
          ? [
              { k: 'grant', label: 'Grant' },
              { k: 'deny', label: 'Deny' },
            ]
          : [
              { k: 'grant', label: 'Grant' },
              { k: 'partial-grant', label: 'Partial grant' },
              { k: 'deny', label: 'Deny' },
            ];
        const same =
          d.outcome === 'partial-grant' &&
          d.scope.years.length === r.scope.years.length &&
          d.scope.sections.length === r.scope.sections.length &&
          d.scope.includeSpouses === r.scope.includeSpouses &&
          d.scope.includeChildren === r.scope.includeChildren &&
          d.scope.includeClarifications === r.scope.includeClarifications;
        const needGrounds = d.outcome === 'partial-grant' || d.outcome === 'deny';
        const form = `<div class="card"><div class="sec-h"><h3>Decision</h3><span class="spacer"></span>${deadlineChip(isLea ? r.deadlineAt : r.decisionDeadlineAt, { soon: isLea ? SOON.lea : SOON.decision, label: 'Decision due' })}</div><div class="sec-b stack">
          ${problemBox(d.problem)}
          <div class="field"><span class="label">Outcome</span>${choices('decide.outcome', opts, isLea ? 'out' : 'c3 out')}${e.outcome ? `<div class="err-t" role="alert">${e.outcome}</div>` : ''}</div>
          ${d.outcome === 'grant' ? `<div class="muted-card small">Releases the full requested scope: ${scopeText(r.scope)}.</div>` : ''}
          ${d.outcome === 'partial-grant' ? `<div class="field"><span class="label">Granted scope</span><div class="hint" style="margin-top:-2px">Only what was requested can be granted.</div>${scopePicker('decide.scope', { restrictTo: r.scope, errors: e })}${same ? `<div class="callout callout-warn">${icon('alert', 16)}<div>This is the full requested scope. Choose Grant instead.</div></div>` : ''}</div>` : ''}
          ${needGrounds ? groundsSelect('decide.grounds', { error: e.grounds }) : ''}
          ${d.outcome ? field('Reasons', textarea('decide.reasons', { rows: 5, ph: 'Why you decided this, in plain words', extra: 'data-live' }) + counter(d.reasons, 4000), { id: 'f-decide-reasons', error: e.reasons, hint: e.reasons ? '' : isLea ? 'Sent to the agency.' : 'Sent to the applicant and the declarant.' }) : ''}
          <div class="foot-actions"><button class="btn btn-secondary" data-act="go" data-arg="${back}">Cancel</button><button class="btn btn-primary" data-act="submitDecision">${icon('scale', 16)} Record decision</button></div>
        </div></div>`;
        const ctx = isLea
          ? `<div class="card"><div class="sec-h"><h3>Request</h3></div><div class="sec-b kv1"><div><div class="k">Agency</div><div class="v">${esc(agencyName(r.officer.agency))}</div><div class="small muted">${esc(r.officer.name)} · case ${esc(r.caseRef)}</div></div><div><div class="k">Reason</div><div class="v" style="font-weight:400">${esc(r.reason)}</div></div><div><div class="k">Officer</div><div class="v">${esc(rr(r.resolved).name)}</div></div><div><div class="k">Scope requested</div><div class="v" style="font-weight:400">${scopeText(r.scope)}</div></div></div></div>`
          : `<div class="card"><div class="sec-h"><h3>Request</h3></div><div class="sec-b kv1"><div><div class="k">Applicant</div><div class="v">${esc(r.applicant.name)}</div><div class="small muted">${esc(r.applicant.occupation)}</div></div><div><div class="k">Reason</div><div class="v" style="font-weight:400">${esc(r.partIII.reason)}</div></div><div><div class="k">Officer</div><div class="v">${esc(rr(r.resolved).name)}</div></div><div><div class="k">Scope requested</div><div class="v" style="font-weight:400">${scopeText(r.scope)}</div></div></div></div>${repsPanel(r)}`;
        return shell(
          `<main class="cpage">
          <div class="page-head"><div style="min-width:0"><h1>Decide</h1><p><span class="mono">${r.ref}</span></p></div></div>
          <div class="split"><div class="stack">${form}</div><div class="side ctx">${ctx}</div></div>
        </main>`,
          { crumbs, active: 'Access requests' },
        );
      }

      /* =====================================================================
       * Law enforcement request, access officer view (#265)
       * ===================================================================== */
      function leaVerifyCard(r) {
        const hits = rosterHits(S.leaV.q) || [];
        const acct = S.officers.find((o) => o.email === r.officer.email);
        return `<div class="card"><div class="sec-h"><h3>Verify</h3></div><div class="sec-b">
          <div class="facts"><div>${icon('check', 15, 2.4)}<span>Sent from a provisioned ${esc(r.officer.agency)} account: ${esc(r.officer.name)}${acct && acct.activatedAt ? `, activated ${fmtDate(acct.activatedAt)}` : ''}</span></div><div>${icon('check', 15, 2.4)}<span>Signed in with MFA</span></div></div>
          ${checkbox('leaV.account', 'Agency and officer confirmed')}
          ${checkbox('leaV.reason', 'Reason for access stated')}
          <div class="field"><span class="label">Officer on the roster</span><div class="input-group"><span class="addon">${icon('search', 16)}</span><input class="input" id="f-leaV-q" aria-label="Search the roster" placeholder="Name or file number" data-bind="leaV.q" data-live value="${esc(S.leaV.q)}"/></div></div>
          ${
            hits.length
              ? `<div class="hits" role="radiogroup" aria-label="Roster matches">${hits
                  .slice(0, 4)
                  .map(
                    (x) =>
                      `<label class="hit"><input type="radio" name="leaVpick" value="${x.id}" data-bind="leaV.pick" ${S.leaV.pick === x.id ? 'checked' : ''}/><div style="min-width:0"><div class="hn">${esc(x.name)}</div><div class="hs">File ${x.file} · ${esc(x.designation)}</div></div></label>`,
                  )
                  .join('')}</div>`
              : S.leaV.q.trim()
                ? `<div class="muted-card small">No roster record matches.</div>`
                : ''
          }
          ${field('Note', textarea('leaV.note', { rows: 3, ph: 'What you checked', extra: 'data-live' }), { id: 'f-leaV-note' })}
          <button class="btn btn-primary btn-block" data-act="leaVerify" ${S.leaV.account && S.leaV.reason && S.leaV.pick && S.leaV.note.trim() ? '' : 'disabled'}>${icon('userCheck', 16)} Record verification</button>
        </div></div>`;
      }
      function scrLeaRequest() {
        const g = guard('requests');
        if (g) return g;
        const r =
          leaById(S.sel) && leaById(S.sel).commission === 'PSC' ? leaById(S.sel) : leaById('l-new');
        const ro = readOnly();
        const open = ['received', 'verified'].includes(r.status);
        let side = '';
        if (r.status === 'received')
          side = ro
            ? `<div class="card"><div class="sec-b"><div class="muted-card">Waiting for the access officer to verify.</div></div></div>`
            : leaVerifyCard(r);
        if (r.status === 'verified')
          side = `<div class="card"><div class="sec-h"><h3>Decision</h3></div><div class="sec-b">${ro ? '<div class="muted-card">Only the access officer decides.</div>' : `<button class="btn btn-primary btn-block" data-act="decide">${icon('scale', 16)} Decide</button>`}</div></div>`;
        if (r.decision) side = decisionSummary(r, { lea: true }) + packageCard(r, { lea: true });
        const ver = r.verification
          ? `<div class="card"><div class="sec-b kv1"><div><div class="k">Verified</div><div class="v">${esc(r.verification.by)} · ${fmtDateTime(r.verification.at)}</div><div class="small muted" style="margin-top:2px">${esc(r.verification.note)}</div></div>${r.resolved ? `<div><div class="k">Officer identified</div><div class="v">${esc(rr(r.resolved).name)}</div><div class="small muted">File ${rr(r.resolved).file}</div></div>` : ''}</div></div>`
          : '';
        const notice =
          r.status === 'granted'
            ? `<div class="callout callout-ok" style="margin-bottom:16px">${icon('bell', 16)}<div>Declarant notified after grant, on ${fmtDate(r.declarantNotifiedAt)}.</div></div>`
            : r.status === 'denied'
              ? `<div class="callout callout-info" style="margin-bottom:16px">${icon('eyeOff', 16)}<div>The declarant was not told. ${esc(r.officer.agency)} received the reasons.</div></div>`
              : `<div class="callout callout-info" style="margin-bottom:16px">${icon('eyeOff', 16)}<div>The declarant is told only after a grant.</div></div>`;
        const breach = open && daysLeft(r.deadlineAt) < 0;
        return shell(
          `<main class="cpage">
          <div class="page-head"><div style="min-width:0"><div class="row wrap" style="gap:8px;margin-bottom:6px">${leaBadge(r.status)}${badge('Law enforcement')}${breach ? badge(`${icon('alert', 12, 2.4)} 14-day deadline breached`, 'danger') : ''}${roBadge()}</div><h1 class="h-ref">${r.ref}</h1><p>${esc(r.officer.agency)} · received ${fmtDate(r.receivedAt)}</p></div>${open ? `<div class="actions-r" style="align-items:center">${deadlineChip(r.deadlineAt, { soon: SOON.lea, label: 'Decision due' })}<span class="small muted">Decision due ${fmtDate(r.deadlineAt)}</span></div>` : ''}</div>
          ${notice}
          <div class="split">
            <div class="stack">
              <div class="card"><div class="sec-h"><h3>Written request</h3><span class="spacer"></span><span class="small muted">No Form K ${tip('Regulation 23(1): a law enforcement agency writes to the Commission with its reason and does not fill Form K.')}</span></div>
                <div class="fk-part"><div class="kv k3">
                  <div><div class="k">Agency</div><div class="v">${esc(agencyName(r.officer.agency))}</div></div>
                  <div><div class="k">Requesting officer</div><div class="v">${esc(r.officer.name)}</div><div class="small muted">${esc(r.officer.email)}</div></div>
                  <div><div class="k">Case reference</div><div class="v mono" style="font-size:13.5px">${esc(r.caseRef)}</div></div>
                </div></div>
                <div class="fk-part"><div class="fk-lab">Officer sought</div><div class="kv k3"><div><div class="k">Name</div><div class="v">${esc(r.officerSought.name)}</div></div><div><div class="k">Entity</div><div class="v">${esc(r.officerSought.entity)}</div></div><div><div class="k">Personnel file number</div><div class="v">${esc(r.officerSought.file) || '<span class="muted" style="font-weight:400">Not given</span>'}</div></div></div></div>
                <div class="fk-part"><div class="fk-lab">Reason for access</div><div class="para">${esc(r.reason)}</div></div>
                <div class="fk-part"><div class="fk-lab">Scope requested</div>${scopeKv(r.scope, { cols: '', clar: false })}</div>
              </div>
              <div class="card"><div class="sec-h"><h3>Register</h3></div><div class="sec-b">${registerTimeline(leaTimeline(r))}</div></div>
            </div>
            <div class="side">${side}${ver}</div>
          </div>
        </main>`,
          { crumbs: [['Access requests', 'requests'], [r.ref]], active: 'Access requests' },
        );
      }

      /* =====================================================================
       * Law-enforcement workspace (#265, persona law-enforcement)
       * ===================================================================== */
      const mine = () =>
        S.leas
          .filter((r) => r.officer.name === KARIUKI.name)
          .sort((a, b) => new Date(b.receivedAt) - new Date(a.receivedAt));
      function mineAction(r) {
        if (r.status === 'granted' && r.pkg) {
          if (past(r.pkg.expiresAt))
            return `<span class="small muted">Window closed ${fmtDate(r.pkg.expiresAt)}</span>`;
          return `<button class="btn btn-secondary btn-xs" data-act="leaDownload" data-arg="${r.id}">${icon('download', 14)} Download</button><div class="sub">Until ${fmtDate(r.pkg.expiresAt)}</div>`;
        }
        if (['received', 'verified'].includes(r.status))
          return `${deadlineChip(r.deadlineAt, { soon: SOON.lea, label: 'Decision due' })}<div class="sub">Decision due ${fmtDate(r.deadlineAt)}</div>`;
        return `<span class="small muted">Decided ${fmtDate(r.decision.at)}</span>`;
      }
      function scrLea() {
        const g = guard('lea');
        if (g) return g;
        const list = S.mine.empty ? [] : mine();
        const size = Number(S.mine.pageSize) || 10;
        const page = list.slice((S.mine.page - 1) * size, S.mine.page * size);
        const body = !list.length
          ? Kit.empty(
              'No requests yet',
              'Send a written request to a Commission with your reason and case reference.',
              {
                icon: 'shield',
                action: `<button class="btn btn-primary btn-sm" data-act="leaNew">${icon('plus', 15)} New request</button>`,
              },
            )
          : `<div class="table-wrap"><table class="table"><thead><tr><th>Reference</th><th>Commission</th><th>Officer sought</th><th>Case</th><th>Status</th><th></th></tr></thead><tbody>${page
              .map(
                (r) =>
                  `<tr class="click" data-act="openMine" data-arg="${r.id}"><td><span class="mono ref">${r.ref}</span><div class="sub">${fmtDate(r.receivedAt)}</div></td><td>${esc(r.commission)}<div class="sub truncate" style="max-width:190px">${esc(comName(r.commission))}</div></td><td class="td-strong">${esc(r.officerSought.name)}</td><td><span class="mono small">${esc(r.caseRef)}</span></td><td>${leaBadge(r.status, true)}</td><td>${mineAction(r)}</td></tr>`,
              )
              .join(
                '',
              )}</tbody></table></div>${Kit.pager({ page: S.mine.page, pageSize: size, total: list.length, act: 'minePage' })}`;
        return shell(
          `<main class="cpage"><div class="page-head"><div><h1>Requests</h1></div><div class="actions-r">${list.length ? `<button class="btn btn-primary btn-sm" data-act="leaNew">${icon('plus', 15)} New request</button>` : ''}</div></div><div class="card">${body}</div></main>`,
          { crumbs: [['Requests']] },
        );
      }
      function scrLeaNew() {
        const g = guard('lea');
        if (g) return g;
        const f = S.leaNew;
        const e = f.errors;
        return shell(
          `<main class="cpage narrow">
          <div class="page-head"><div><h1>New request</h1></div></div>
          <div class="card">
            <div class="formsec formsec-pad">${problemBox(f.problem)}
              ${field(
                'Commission',
                select(
                  'leaNew.commission',
                  COMMISSIONS.map(([c, n]) => ({ v: c, l: n })),
                  { ph: 'Choose the Responsible Commission' },
                ),
                { id: 'f-leaNew-commission', error: e.commission },
              )}
            </div>
            <div class="formsec formsec-pad"><h3>Officer sought</h3>
              <div class="grid-2">${field('Name', input('leaNew.name', { ph: 'Full name' }), { id: 'f-leaNew-name', error: e.name })}${field('Entity', input('leaNew.entity', { ph: 'Ministry, department or agency' }), { id: 'f-leaNew-entity', opt: true })}${field('Work station', input('leaNew.workStation'), { id: 'f-leaNew-workStation', opt: true })}${field('Personnel file number', input('leaNew.file'), { id: 'f-leaNew-file', opt: true })}</div>
            </div>
            <div class="formsec formsec-pad"><h3>Reason and case</h3>
              ${field('Reason for access', textarea('leaNew.reason', { rows: 5, ph: 'What you are investigating and why you need the declaration', extra: 'data-live' }) + counter(f.reason, 4000), { id: 'f-leaNew-reason', error: e.reason })}
              ${field('Case reference', input('leaNew.caseRef', { ph: 'e.g. DCI/ECU/120/2026' }), { id: 'f-leaNew-caseRef', error: e.caseRef, hint: e.caseRef ? '' : 'One request per case.' })}
            </div>
            <div class="formsec formsec-pad"><h3>Scope</h3>${scopePicker('leaNew.scope', { errors: e, clar: false })}</div>
            <div class="card-foot"><span class="small muted">${icon('eyeOff', 14)} The declarant is told only if access is granted.</span><span class="spacer"></span><button class="btn btn-secondary" data-act="go" data-arg="lea">Cancel</button><button class="btn btn-primary" data-act="leaSubmit">${icon('send', 15)} Send request</button></div>
          </div>
        </main>`,
          { crumbs: [['Requests', 'lea'], ['New request']], active: 'Requests' },
        );
      }
      function scrLeaSent() {
        const g = guard('lea');
        if (g) return g;
        const r = leaById(S.mine.sent) || leaById('l-new');
        return shell(
          `<main class="cpage narrow"><div class="card"><div class="success"><span class="sm">${icon('check', 26, 2.6)}</span><h2>Request sent</h2><span class="refchip">${r.ref}</span><p class="muted" style="max-width:420px">Received ${fmtDate(r.receivedAt)}. ${esc(comName(r.commission))} has 14 days to decide, by ${fmtDate(r.deadlineAt)}.</p><div class="row wrap" style="gap:8px;justify-content:center"><button class="btn btn-secondary btn-sm" data-act="openMine" data-arg="${r.id}">View request</button><button class="btn btn-ghost btn-sm" data-act="go" data-arg="lea">All requests</button></div></div></div></main>`,
          { crumbs: [['Requests', 'lea'], ['Request sent']], active: 'Requests' },
        );
      }
      function scrLeaView() {
        const g = guard('lea');
        if (g) return g;
        const r = leaById(S.mine.sel);
        if (!r || r.officer.name !== KARIUKI.name) return notFound();
        const p = r.pkg;
        let side;
        if (r.status === 'granted' && p) {
          const exp = past(p.expiresAt);
          side = `<div class="card"><div class="sec-h"><h3>Package</h3><span class="spacer"></span><span class="cls confidential">${icon('lock', 11)} Confidential</span></div><div class="sec-b">
            ${exp ? `<div class="callout callout-warn">${icon('timer', 16)}<div>The download window closed on ${fmtDate(p.expiresAt)}.</div></div>` : `<div class="row wrap" style="gap:8px">${deadlineChip(p.expiresAt, { soon: SOON.download, label: 'Download until', today: 'Ends today' })}<span class="small muted">Until ${fmtDate(p.expiresAt)}</span></div><button class="btn btn-primary btn-block" data-act="leaDownload" data-arg="${r.id}">${icon('download', 16)} Download package</button>`}
            <div class="kv1"><div><div class="k">Issued</div><div class="v">${fmtDateTime(p.issuedAt)}</div></div><div><div class="k">Your downloads</div><div class="v">${num(p.downloads.length)}</div></div></div>
            <div class="small muted">Watermarked with your name. Every download is recorded.</div>
          </div></div>`;
        } else if (r.status === 'denied')
          side = `<div class="card"><div class="sec-h"><h3>Decision</h3></div><div class="sec-b"><div class="outcome-v"><span class="oi danger">${icon('x', 16, 2.6)}</span>Denied</div><div class="kv1">${r.decision.grounds.length ? `<div><div class="k">Regulation 24 grounds</div><div class="v">${r.decision.grounds.map((x) => esc(GROUNDS[x][0])).join('<br/>')}</div></div>` : ''}<div><div class="k">Reasons</div><div class="v" style="font-weight:400">${esc(r.decision.reasons)}</div></div><div><div class="k">Decided</div><div class="v">${fmtDate(r.decision.at)}</div></div></div>${r.commission === 'PSC' ? docLink('lea-response-deny', 'Response letter') : ''}</div></div>`;
        else
          side = `<div class="card"><div class="sec-h"><h3>Decision</h3><span class="spacer"></span>${deadlineChip(r.deadlineAt, { soon: SOON.lea, label: 'Decision due' })}</div><div class="sec-b"><div class="small muted">${r.status === 'verified' ? 'Verified by the Commission. ' : ''}Decision due ${fmtDate(r.deadlineAt)}.</div></div></div>`;
        const steps = [
          ['Received', fmtDateTime(r.receivedAt), true],
          [
            'Verified by the Commission',
            r.verification ? fmtDateTime(r.verification.at) : 'Waiting',
            !!r.verification,
          ],
          [
            'Decision',
            r.decision
              ? `${r.decision.outcome === 'deny' ? 'Denied' : 'Granted'} · ${fmtDateTime(r.decision.at)}`
              : `Due ${fmtDate(r.deadlineAt)}`,
            !!r.decision,
          ],
        ];
        return shell(
          `<main class="cpage">
          <div class="page-head"><div style="min-width:0"><div class="row wrap" style="gap:8px;margin-bottom:6px">${leaBadge(r.status, true)}</div><h1 class="h-ref">${r.ref}</h1><p>${esc(comName(r.commission))} · case <span class="mono">${esc(r.caseRef)}</span></p></div>${r.status === 'granted' && r.commission === 'PSC' ? `<div class="actions-r">${docLink('lea-response', 'Response letter')}</div>` : ''}</div>
          <div class="split">
            <div class="stack">
              <div class="card"><div class="sec-h"><h3>Your request</h3></div>
                <div class="fk-part"><div class="kv k3"><div><div class="k">Officer sought</div><div class="v">${esc(r.officerSought.name)}</div></div><div><div class="k">Entity</div><div class="v">${esc(r.officerSought.entity) || '-'}</div></div>${r.officerSought.file ? `<div><div class="k">Personnel file number</div><div class="v">${esc(r.officerSought.file)}</div></div>` : ''}</div></div>
                <div class="fk-part"><div class="fk-lab">Reason for access</div><div class="para">${esc(r.reason)}</div></div>

      /* =====================================================================

        copyPage: (p) => {

        open: (id) => openReq(id),

            sc[f] = el.checked ? [...new Set([...sc[f], v])] : sc[f].filter((x) => x !== v);
          } else sc[f] = el.checked;
          const errs = el.dataset.path.startsWith('decide')
            ? S.decide.errors

              : null;
          if (errs) {
            if (sc.years.length) delete errs.years;
            if (sc.sections.length) delete errs.sections;
          }
          Kit.render();
        },
        ground: (el) => {
          const arr = Kit.getPath(S, el.dataset.path);
          const v = el.dataset.val;
          const next = el.checked ? [...new Set([...arr, v])] : arr.filter((x) => x !== v);
