          ? `<span class="reg-ico" tabindex="0" data-tip="One or more registries could not be checked" aria-label="One or more registries could not be checked">${icon('wifiOff', 15, 2)}</span>`
          : '';
      function rowActions(c) {
        const out = [];
        if (!c.assignee)
          out.push(
            `<button class="btn btn-secondary btn-sm" data-act="claim" data-arg="${c.id}">Claim</button>`,
          );
        else if (mine(c) || sup())
          out.push(
            `<button class="btn btn-secondary btn-sm" data-act="openCase" data-arg="${c.id}">Open</button>`,
          );
        else
          out.push(
            `<button class="btn btn-ghost btn-sm" data-act="openCase" data-arg="${c.id}">View</button>`,
          );
        if (sup()) {
          const k = 'row-' + c.id;
          out.push(
            `<div class="menu-wrap"><button class="btn btn-ghost icon-btn" data-act="menu" data-arg="${k}" aria-label="More actions for ${esc(c.name)}" aria-haspopup="menu" aria-expanded="${S.menu === k}">${icon('moreV', 17)}</button>${S.menu === k ? `<div class="menu fixed" role="menu" data-menu-for="${k}"><button role="menuitem" data-act="reassignDlg" data-arg="${c.id}">${icon('swap', 16)} ${c.assignee ? 'Reassign' : 'Assign to a reviewer'}</button>${c.assignee ? `<button role="menuitem" data-act="unassignDlg" data-arg="${c.id}">${icon('userX', 16)} Unassign</button>` : ''}</div>` : ''}</div>`,
          );
        }
        return `<div class="row-acts">${out.join('')}</div>`;
      }
      function fsel(key, label, opts) {
        const v = S.f[key];
        return `<select class="select fsel ${v !== FDEF[key] ? 'set' : ''}" aria-label="${label}" data-bind="f.${key}" data-rerender>${opts.map(([val, l]) => `<option value="${val}" ${String(val) === String(v) ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
      }
      const fchip = (key, label) =>
        `<button class="chip ${S.f[key] ? 'on' : ''}" data-act="toggleF" data-arg="${key}" aria-pressed="${S.f[key]}"><span class="ck">${S.f[key] ? icon('check', 12, 3) : ''}</span>${label}</button>`;

      function paged(list, pageKey, sizeKey) {
        const size = Number(S[sizeKey]) || 20;
        const pages = Math.max(1, Math.ceil(list.length / size));
        const page = Math.min(Math.max(1, Number(S[pageKey]) || 1), pages);
        S[pageKey] = page;
        return { page, size, rows: list.slice((page - 1) * size, page * size) };
      }
      screens_queue = () => {
        if (!staff())
          return consoleShell(
            `<main class="cpage"><div class="page-head"><div><h1>Review queue</h1></div></div><div class="callout callout-danger" role="alert">${icon('lock', 17)}<div><b>You do not have access to the review queue.</b><div class="small muted" style="margin-top:2px">Prototype: switch persona to Reviewer or Supervisor.</div></div></div></main>`,
            { crumbs: [['Review queue']] },
          );
        const sm = summary();
        const all = filtered();
        const pg = paged(all, 'qPage', 'qSize');
        const rows = pg.rows;
        const tile = (k, label, arr, sub, filt) => {
          const on =
            Object.entries(filt).every(([a, b]) => S.f[a] === b) && Object.keys(filt).length;
          const total = arr[0] + arr[1] + arr[2];
          return `<button class="tile ${on ? 'on' : ''}" data-act="tile" data-arg="${k}" aria-pressed="${!!on}"><span class="k">${label}</span><span class="v">${num(total)}</span><span class="bands"><span>High ${num(arr[0])}</span><span>Medium ${num(arr[1])}</span><span>Low ${num(arr[2])}</span></span></button>`;
        };
        const officers = Object.values(OFF).map((o) => [o.subject, o.name]);
        const loading = S.qState === 'loading';
        const err = S.qState === 'error';
        let body;
        if (err)
          body = `<div style="padding:20px"><div class="callout callout-danger" role="alert">${icon('alert', 17)}<div style="flex:1"><b>The review queue could not be loaded.</b><div style="margin-top:2px">Check your connection and try again.</div></div><button class="btn btn-secondary btn-sm" data-act="retryQueue">${icon('refresh', 15)} Retry</button></div></div>`;
        else if (loading)
          body = `<div class="table-wrap"><table class="table"><thead><tr><th>Reference</th><th>Declarant</th><th>Received</th><th>Priority</th><th class="num">Flags</th><th>Assignee</th><th>Clarification</th><th></th></tr></thead><tbody>${skeletonRows(8, 8)}</tbody></table></div>`;
        else if (!all.length && S.qState === 'empty' && !filtersActive())
          body = empty('No cases yet', 'Cases appear here as declarations are submitted.', {
            icon: 'inbox',
          });
        else if (!all.length)
          body = empty('No matches', 'No cases match these filters or this search.', {
            icon: 'search',
            action: `<button class="btn btn-secondary btn-sm" data-act="clearF">Clear filters</button>`,
          });
        else
          body = `<div class="q-tablewrap table-wrap"><table class="table q-table"><caption class="sr">Review cases, highest priority first, then oldest</caption><thead><tr><th scope="col">Reference</th><th scope="col">Declarant</th><th scope="col">Received</th><th scope="col">Priority <span tabindex="0" data-tip="${IND_TIP} Highest first, then oldest." style="vertical-align:-3px;display:inline-flex">${icon('info', 13)}</span></th><th scope="col" class="num">Flags</th><th scope="col">Assignee</th><th scope="col">Clarification</th><th scope="col"><span class="sr">Actions</span></th></tr></thead><tbody>${rows.map((c) => `<tr class="click ${S.flash === c.id ? 'sel' : ''}" data-act="openCase" data-arg="${c.id}"><td><span class="mono ref">${c.ref}</span>${regIcon(c)}<div class="sub">${TYPE[c.type]} · cycle ${c.cycle}</div></td><td class="nm"><div style="font-weight:500">${esc(c.name)}</div><div class="sub">File no. ${c.pf}</div></td><td class="tabular">${fmtDate(c.received)}${c.late ? `<div style="margin-top:3px">${badge('Late filing', 'warn')}</div>` : ''}</td><td>${pbadge(c.band)}</td><td class="num">${c.openFlags}</td><td>${achip(c.assignee, { compact: true })}</td><td>${clarCell(c)}</td><td>${rowActions(c)}</td></tr>`).join('')}</tbody></table></div>
    <div class="q-cards">${rows.map((c) => `<div class="qcard" data-act="openCase" data-arg="${c.id}"><div class="top"><span class="mono ref" style="font-size:13px;font-weight:600">${c.ref}</span>${regIcon(c)}<span class="spacer"></span>${pbadge(c.band)}</div><div><div style="font-weight:600">${esc(c.name)}</div><div class="meta"><span>File no. ${c.pf}</span><span>${TYPE[c.type]} ${c.cycle}</span><span>Received ${fmtDate(c.received)}</span>${c.late ? badge('Late', 'warn') : ''}</div></div><div class="top">${achip(c.assignee, { compact: true })}<span class="muted small">· ${plural(c.openFlags, 'flag')}</span></div><div class="top"><span class="small muted">Clarification:</span>${clarCell(c)}<span class="spacer"></span>${rowActions(c)}</div></div>`).join('')}</div>`;
        return consoleShell(
          `<main class="cpage">
    <div class="page-head"><div><h1>Review queue</h1></div></div>
    <div class="tiles qtiles" style="margin-bottom:10px">
      ${tile('u', 'Unassigned', sm.u, '', { status: 'unassigned' })}
      ${tile('m', 'Mine', sm.m, '', { assignee: 'mine' })}
      ${tile('a', 'Awaiting clarification', sm.a, '', { status: 'awaiting-clarification' })}
      ${tile('r', 'Ready for determination', sm.r, '', { status: 'ready-for-determination' })}
    </div>
    ${sm.overdue ? `<p class="small" style="margin:0 0 18px;display:flex;align-items:center;gap:8px;color:var(--ink-2)"><span class="dot danger"></span><b>${plural(sm.overdue, 'clarification')} overdue</b> <a class="linkish" data-act="goOverdue">View</a></p>` : '<div style="height:12px"></div>'}
    <div class="card">
      <div class="q-toolbar">
        <div class="row1">
          <div class="input-group"><span class="addon">${icon('search', 16)}</span><input id="q-search" class="input" type="search" aria-label="Search by reference, file number or name" placeholder="Search reference, file number or name" data-bind="f.q" data-live value="${esc(S.f.q)}"/></div>
          ${fsel('status', 'Status', [
            ['', 'All statuses'],
            ['unassigned', 'Unassigned'],
            ['assigned', 'Assigned'],
            ['awaiting-clarification', 'Awaiting clarification'],
            ['clarified', 'Clarified'],
            ['ready-for-determination', 'Ready for determination'],
          ])}
          ${fsel('band', 'Priority', [
            ['', 'All priorities'],
            ['high', 'High'],
            ['medium', 'Medium'],
            ['low', 'Low'],
          ])}
          ${fsel('type', 'Declaration type', [
            ['', 'All types'],
            ['initial', 'Initial'],
            ['biennial', 'Biennial'],
            ['final', 'Final'],
          ])}
          ${fsel('cycle', 'Cycle', [
            ['', 'All cycles'],
            ['2026', '2026'],
            ['2025', '2025'],
          ])}
          ${fsel('assignee', 'Assignee', [['any', 'Anyone'], ['mine', 'Mine'], ['unassigned', 'Unassigned'], ...(sup() ? officers : [])])}
        </div>
        <div class="row2">
          ${fchip('late', 'Late filing')}${fchip('openClar', 'Open clarification')}${fchip('regUnavail', `${icon('wifiOff', 14, 2)} Registry unavailable`)}
          ${filtersActive() ? `<button class="btn btn-ghost btn-sm" data-act="clearF">${icon('x', 14)} Clear filters</button>` : ''}
          <span class="spacer"></span>
          <button class="btn btn-ghost btn-sm" data-act="copy" data-arg="${esc(location.href)}" title="Filters are kept in the link">${icon('link', 14)} Copy link</button>
        </div>
      </div>
      ${body}
      ${!err && !loading && all.length ? Kit.pager({ page: pg.page, pageSize: pg.size, total: all.length, act: 'qPage', sizes: [10, 20, 50], sizeBind: 'qSize' }) : ''}
    </div>
  </main>`,
          { crumbs: [['Review queue']] },
        );
      };

      /* ============================== CASE VIEW (#164, #167, #185, #188) ============================== */
      function caseSkeleton() {
        return `<main class="cpage wide"><div class="case-head"><span class="skeleton" style="width:220px;height:28px"></span><span class="skeleton" style="width:340px;height:26px"></span><span class="skeleton" style="width:520px"></span></div><div class="rsplit" style="--side:${S.sideW}px"><div class="decl-card" style="padding:20px;display:grid;gap:14px">${Array.from({ length: 8 }, (_, i) => `<span class="skeleton" style="width:${[60, 90, 75, 85, 50, 95, 70, 80][i]}%"></span>`).join('')}</div><div></div><div class="side-card" style="padding:20px;display:grid;gap:14px">${Array.from({ length: 6 }, (_, i) => `<span class="skeleton" style="width:${[40, 90, 80, 95, 60, 85][i]}%"></span>`).join('')}</div></div></main>`;
      }
      function caseHeader(c) {
        const wOpen = windowOpen(c);
        const dLeft = dleft(c.windowEnds);
        const acts = [];
        if (!c.assignee)
          acts.push(
            `<button class="btn btn-primary btn-sm" data-act="claim" data-arg="${c.id}">${icon('userCheck', 16)} Claim</button>`,
          );
        if (mine(c))
          acts.push(
            `<button class="btn btn-secondary btn-sm" data-act="releaseDlg" data-arg="${c.id}">${icon('undo', 15)} Release</button>`,
          );
        if (sup() && c.assignee)
          acts.push(
            `<button class="btn btn-secondary btn-sm" data-act="reassignDlg" data-arg="${c.id}">${icon('swap', 15)} Reassign</button><button class="btn btn-ghost btn-sm" data-act="unassignDlg" data-arg="${c.id}">Unassign</button>`,
          );
        if (sup() && !c.assignee)
          acts.push(
            `<button class="btn btn-secondary btn-sm" data-act="reassignDlg" data-arg="${c.id}">${icon('swap', 15)} Assign to a reviewer</button>`,
          );
        if (mine(c))
          acts.push(
            `<a class="btn ${c.status === 'ready-for-determination' ? 'btn-primary' : 'btn-secondary'} btn-sm" href="08-determinations.prototype.html#determine">${icon('scale', 15)} Propose determination</a>`,
          );
        const hist = c.history.map((s) => OFF[s].name);
        const lastV = c.versions[c.versions.length - 1];
        const verTip =
          c.currentVersion > 1
            ? `Amended ${fmtDate(lastV.at)}. Indicators were recomputed against version ${c.currentVersion - 1}; reviewed indicators kept their notes.`
            : '';
        const win = wOpen
          ? `<span class="${dLeft <= 21 ? 'win-warn' : ''}">${icon('clock', 14)} Window closes ${fmtDate(c.windowEnds)} · ${dLeft === 0 ? 'today' : `${plural(dLeft, 'day')} left`}</span>`
          : `<span>${icon('lock', 14)} Window closed ${fmtDate(c.windowEnds)}</span>`;
        return `<div class="case-head">
    <div class="l1">${refchip(c.ref)}${statusBadge(c.status)}${pbadge(c.band)}${c.late ? badge('Late filing', 'warn') : ''}</div>
    <div><h1>${esc(c.name)}</h1><div class="meta-line"><span>File no. ${c.pf}</span><span>${TYPE[c.type]}, cycle ${c.cycle}</span><span>${esc(c.entity)}</span><span>Received ${fmtDate(c.received)}</span>${verTip ? `<span>Version ${c.currentVersion} of ${c.versions.length} ${Kit.tip(verTip, { label: 'About this version' })}</span>` : ''}${win}</div></div>
    <div class="case-bar">
      <div class="who"><span class="small muted">Assigned to</span>${achip(c.assignee)}${hist.length ? `<span class="sod" tabindex="0" data-tip="Reviewers of record: ${esc(hist.join(', '))}. The supervisor who approves the determination must not be one of them.">${icon('users', 14)} ${plural(hist.length, 'reviewer')} of record</span>` : ''}</div>
      <div class="acts">${acts.join('')}</div>
    </div>
    ${sup() && c.history.includes('samuel') ? `<div class="callout callout-warn">${icon('alert', 16)}<span>You are a reviewer of record, so another supervisor must approve the determination.</span></div>` : ''}
    ${!mine(c) && c.assignee && !sup() ? `<div class="callout callout-info">${icon('info', 16)}<span>Read-only. ${esc(OFF[c.assignee].name)} holds this case.</span></div>` : ''}
  </div>`;
      }
      screens_case = () => {
        if (!staff() || S.caseState === '404') return notFound();
        const c = cur();
        if (!c.reg) c.reg = genReg(c);
        if (!c._fl && !c.flags.length) {
          c.flags = genFlags(c);
          c._fl = true;
        }
        const crumbs = crumbsFor([[c.ref]]);
        if (S.caseState === 'loading')
          return consoleShell(caseSkeleton(), { crumbs, active: 'Review queue' });
        const tabs = [
          ['flags', 'Flags', c.flags.filter((f) => !f.reviewed && !f.closed).length],
          ['registry', 'Registry', c.reg && c.reg.persons ? (c.regUnavail ? '!' : '') : ''],
          ['clarifications', 'Clarifications', S.clars.filter((k) => k.caseId === c.id).length],
          ['notes', 'Notes', c.notes.length],
          ['timeline', 'Timeline', ''],
        ];
        const side = `<div class="side-card"><div class="tabs" role="tablist" aria-label="Case review">${tabs.map(([k, l, n]) => `<button role="tab" id="tab-${k}" aria-selected="${S.tab === k}" aria-controls="panel-${k}" class="${S.tab === k ? 'on' : ''}" data-act="tab" data-arg="${k}">${l}${n !== '' && n !== 0 ? `<span class="count" ${n === '!' ? 'style="background:var(--warn-soft);color:var(--warn)" aria-label="a registry could not be checked"' : ''}>${n}</span>` : ''}</button>`).join('')}</div>
    <div class="side-body" role="tabpanel" id="panel-${S.tab}" aria-labelledby="tab-${S.tab}">${{ flags: flagsTab, registry: registryTab, clarifications: clarTab, notes: notesTab, timeline: timelineTab }[S.tab](c)}</div></div>`;
        return consoleShell(
          `<main class="cpage wide">
    ${caseHeader(c)}
    <div class="seg mview" role="tablist" aria-label="Show" style="margin-bottom:12px"><button class="${S.mview === 'decl' ? 'on' : ''}" data-act="mview" data-arg="decl">Declaration</button><button class="${S.mview === 'review' ? 'on' : ''}" data-act="mview" data-arg="review">Flags and review</button></div>
    <div class="rsplit" id="rsplit" data-mview="${S.mview}" style="--side:${S.sideW}px">
      <section class="rs-main" aria-label="Declaration as filed">${S.caseState === '503' ? declUnavailable(c) : S.compare ? compareView(c) : declPane(c)}</section>
      <div class="rs-handle" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize review panel" aria-valuemin="340" aria-valuemax="720" aria-valuenow="${S.sideW}" aria-controls="rsplit" title="Drag or use the arrow keys to resize"></div>
      <aside class="rs-side" aria-label="Review tools">${S.cpOpen ? cpPanel(c) : cpLauncher(c) + side}</aside>
    </div>
    ${auditFoot()}
  </main>`,
          { crumbs, active: 'Review queue' },
        );
      };

      function declUnavailable(c) {
        return `<div class="decl-card"><div class="decl-tools"><b style="font-size:14px">Declaration as filed</b></div><div style="padding:20px"><div class="callout callout-warn" role="alert">${icon('wifiOff', 17)}<div style="flex:1"><b>The declaration could not be loaded.</b><div style="margin-top:2px">Flags, notes and clarifications are still available.</div></div><button class="btn btn-secondary btn-sm" data-act="retryDecl">${icon('refresh', 15)} Try again</button></div></div></div>`;
      }
      function versionTools(c) {
        const vv = S.viewVersion || c.currentVersion;
        const canCompare = c.currentVersion > 1 || c.hasPrevious;
        const prevN = c.currentVersion > 1 ? c.currentVersion - 1 : null;
        const cmp = `<button class="switch" role="switch" aria-checked="${S.compare}" data-act="toggleCompare" ${!canCompare || vv !== c.currentVersion ? 'disabled' : ''}><span class="tr"></span>${prevN ? `Compare with version ${prevN}` : 'Compare with previous version'}</button>`;
        return `<div class="decl-tools">
    <b style="font-size:14px">${S.compare ? 'Version comparison' : 'Declaration as filed'}</b>
    ${
      c.versions.length > 1
        ? `<label class="sr" for="vsel">Version</label><select id="vsel" class="select" data-act-change="pickVersion" ${S.compare ? 'disabled' : ''}>${c.versions
            .slice()
            .reverse()
            .map(
              (v) =>
                `<option value="${v.v}" ${v.v === vv ? 'selected' : ''}>Version ${v.v} of ${c.versions.length}</option>`,
            )
            .join('')}</select>`
        : `<span class="badge">Version 1 of 1</span>`
    }
    <span class="spacer"></span>
    ${canCompare ? cmp : tipBtn(cmp, 'First declaration on Adili: nothing to compare.', true)}
  </div>`;
      }
      function flagsOnItem(c, id) {
        return c.flags.filter((f) => !f.reviewed && !f.closed && f.refs.some((r) => r.item === id));
      }
      function ditem(c, it, cat, ver) {
        const fl = ver === c.currentVersion ? flagsOnItem(c, it.id) : [];
        const top = fl.length
          ? ['high', 'medium', 'low', 'info'].find((s) => fl.some((f) => f.sev === s))
          : null;
        const doc = docFor(c);
        const meta = [
          it.loc,
          cat === 'assets' ? (it.own === 'Joint' ? `Joint, ${it.share}% share` : it.own) : '',
        ]
          .filter(Boolean)
          .join(' · ');
        return `<div class="ditem ${S.hl === it.id ? 'hl' : ''}" id="item-${it.id}">
    <span class="ico">${icon(it.ic || (cat === 'income' ? 'wallet' : cat === 'liabilities' ? 'card' : 'box'), 16)}</span>
    <div style="min-width:0"><div class="t">${esc(cat === 'assets' ? it.type : it.type)}</div><div class="d">${esc(it.desc)}${meta ? ' · ' + esc(meta) : ''}</div>
      <div class="tags">${it.changed ? badge(`${icon('pencil', 11)} Marked as changed`, 'info') : ''}${it.isNew && ver === c.currentVersion ? badge('New in this version') : ''}${(
        it.docs || []
      )
        .map((d) => {
          const a = doc.attachments.find((x) => x.id === d);
          return `<button class="attbtn" data-act="attLink" data-arg="${d}" aria-label="Download ${esc(a.name)}">${S.links[d] === 'busy' ? '<span class="spinner dark" style="width:12px;height:12px"></span>' : icon('clip', 12)} ${esc(a.name)}</button>`;
        })
        .join(
          '',
        )}${fl.length ? `<button class="pinbtn s-${top}" data-act="toFlag" data-arg="${fl[0].id}" aria-label="${fl.length} indicator${fl.length > 1 ? 's' : ''} on this item. Show in flags.">${icon('flag', 12, 2.2)} ${fl.length} indicator${fl.length > 1 ? 's' : ''}</button>` : ''}</div></div>
    <div class="v">${money(it.value)}</div></div>`;
      }
      function declPane(c) {
        const doc = docFor(c);
        const ver = S.viewVersion || c.currentVersion;
        const p = doc.personal;
        const kvs = (pairs) =>
          `<div class="kv k3">${pairs.map(([k, v]) => `<div><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`).join('')}</div>`;
        const totals = doc.persons.map((pp) => {
          const t = {};
          ['income', 'assets', 'liabilities'].forEach(
            (cat) =>
              (t[cat] = itemsOf(doc, pp.key, cat, ver, c.currentVersion).reduce(
                (a, x) => a + x.value,
                0,
              )),
          );
          return { pp, t };
        });
        const grand = ['income', 'assets', 'liabilities'].map((k) =>
          totals.reduce((a, x) => a + x.t[k], 0),
        );
        const sp = doc.persons.filter((x) => x.kind === 'spouse');
        const ch = doc.persons.filter((x) => x.kind === 'child');
        const cat = (pp, k, label, sub) => {
          const list = itemsOf(doc, pp.key, k, ver, c.currentVersion);
          return `<div class="cat-h"><span class="t">${label}</span><span>${sub}</span></div>${list.length ? list.map((it) => ditem(c, it, k, ver)).join('') : `<div class="nil">Nil declared</div>`}`;
        };
        return `<div class="decl-card">${versionTools(c)}
    ${ver !== c.currentVersion ? `<div style="padding:14px 20px 0"><div class="callout callout-warn">${icon('info', 16)}<span>Viewing version ${ver} (${fmtDate(c.versions[ver - 1].at)}). Flags refer to version ${c.currentVersion}.</span></div></div>` : ''}
    <div class="dsec"><div style="overflow-x:auto"><table class="sum-mini"><thead><tr><th>Totals (KES)</th><th>Income</th><th>Assets</th><th>Liabilities</th></tr></thead><tbody>${totals.map(({ pp, t }) => `<tr><td><span class="row" style="gap:8px"><span class="avatar sm ${pp.kind}">${pp.initials}</span>${esc(pp.short)}</span></td><td>${num(t.income)}</td><td>${num(t.assets)}</td><td>${num(t.liabilities)}</td></tr>`).join('')}<tr><td>Total</td><td>${num(grand[0])}</td><td>${num(grand[1])}</td><td>${num(grand[2])}</td></tr></tbody></table></div></div>
    <div class="dsec ${S.hlSec === 'sec-personal' ? 'hl' : ''}" id="sec-personal"><h2><span class="no">1-5</span> Personal and employment details</h2>${kvs(
      [
        ['Surname', p.surname],
        ['First name', p.first],
        ['Other names', p.other || '-'],
        ['Date of birth', fmtDate(p.dob)],
        ['Place of birth', p.pob],
        ['Marital status', p.marital],
        ['Postal address', p.postal],
        ['Physical address', p.physical],
        ['Designation', p.designation],
        ['Reporting entity', p.entity],
        ['Nature of employment', p.nature],
      ],
    )}</div>
    <div class="dsec ${S.hlSec === 'sec-spouses' ? 'hl' : ''}" id="sec-spouses"><h2><span class="no">6</span> Spouses</h2>${sp.length ? sp.map((x) => `<div class="row" style="gap:10px;margin-top:6px"><span class="avatar sm spouse">${x.initials}</span><div><div style="font-weight:500">${esc(x.name)}</div><div class="small muted">National ID ${x.idDeclared ? 'declared' : 'not declared'}</div></div></div>`).join('') : '<p class="small muted">None declared</p>'}</div>
    <div class="dsec ${S.hlSec === 'sec-children' ? 'hl' : ''}" id="sec-children"><h2><span class="no">7</span> Dependent children under 18</h2>${ch.length ? ch.map((x) => `<div class="row" style="gap:10px;margin-top:6px"><span class="avatar sm child">${x.initials}</span><div><div style="font-weight:500">${esc(x.name)}</div><div class="small muted">${x.rel.replace('Child, ', 'Age ')} · no national ID</div></div></div>`).join('') : '<p class="small muted">None declared</p>'}</div>
    <div class="dsec"><h2><span class="no">8</span> Financial statements <span class="small muted" style="font-weight:400">as at ${fmtDate(doc.statementDate)}</span></h2>
      ${doc.persons
        .map(
          (
            pp,
          ) => `<div class="stmt ${S.hlSec === 'stmt-' + pp.key ? 'hl' : ''}" id="stmt-${pp.key}"><div class="stmt-h"><span class="avatar sm ${pp.kind}">${pp.initials}</span><div><div class="n">${esc(pp.name)}</div><div class="small muted">${pp.rel}</div></div></div>
        ${cat(pp, 'income', '(b) Income', `${fmtDate(doc.periodFrom)} to ${fmtDate(doc.statementDate)}`)}
        ${cat(pp, 'assets', '(c) Assets', '')}
        ${cat(pp, 'liabilities', '(d) Liabilities', '')}</div>`,
        )
        .join('')}
    </div>
    <div class="dsec ${S.hlSec === 'sec-other' ? 'hl' : ''}" id="sec-other"><h2><span class="no">9</span> Other information</h2><p style="font-size:14px">${doc.other ? esc(doc.other) : '<span class="muted">None given</span>'}</p></div>
    <div class="dsec"><h2>Attachments <span class="small muted" style="font-weight:400">${doc.attachments.length}</span></h2>${doc.attachments.length ? `<div class="docs">${doc.attachments.map((a) => `<div class="doc"><span class="doc-ico">${icon('file', 16)}</span><div class="doc-body"><div class="doc-name">${esc(a.name)}</div><div class="small muted">${a.size} · ${esc(itemLabel(doc, a.item).split(' · ').slice(1, -1).join(' · '))}</div></div><button class="btn btn-ghost btn-sm" data-act="attLink" data-arg="${a.id}">${S.links[a.id] === 'busy' ? '<span class="spinner dark"></span>' : icon('download', 15)} ${S.links[a.id] === 'done' ? 'Download again' : 'Download'}</button></div>`).join('')}</div>` : '<p class="small muted">No attachments</p>'}</div>
    <div class="dsec"><p class="small muted row" style="gap:8px">${icon('check', 15)} Solemn declaration made online on ${fmtDateTime(c.versions[ver - 1].at)} (version ${ver}).</p></div>
  </div>`;
      }

      /* ---------- DiffTable (#167) ---------- */
      function diffData(c) {
        const doc = docFor(c);
        return doc.persons.map((pp) => {
          const st = doc.st[pp.key] || {};
          const rows = [];
          ['income', 'assets', 'liabilities'].forEach((cat) => {
            const cur = st[cat] || [];
            cur
              .filter((x) => !x.isNew && x.prev !== undefined)
              .forEach((x) => {
                const d = x.value - x.prev;
                rows.push({
                  cat,
                  it: x,
                  kind: 'matched',
                  prev: x.prev,
                  cur: x.value,
                  delta: d,
                  pct: x.prev ? (d / x.prev) * 100 : null,
                });
              });
            cur
              .filter((x) => x.isNew)
              .forEach((x) =>
                rows.push({ cat, it: x, kind: 'onlyCurrent', prev: null, cur: x.value }),
              );
            (st.prevOnly?.[cat] || []).forEach((x) =>
              rows.push({ cat, it: x, kind: 'onlyPrevious', prev: x.value, cur: null }),
            );
          });
          return { pp, rows };
        });
      }
      function diffTable(stmt, prevN, curN, c) {
        const signed = (n) => (n > 0 ? '+' : n < 0 ? '−' : '') + num(Math.abs(n));
        const cats = ['income', 'assets', 'liabilities'];
        const body = cats
          .map((cat) => {
            const rs = stmt.rows.filter((r) => r.cat === cat);
            if (!rs.length) return '';
            return (
              `<tr class="cat"><td colspan="6">${CATL[cat]}</td></tr>` +
              rs
                .map((r) => {
                  const label = `<th scope="row">${esc(cat === 'assets' ? r.it.type : r.it.type)}<div class="d">${esc(r.it.desc)}</div></th>`;
                  if (r.kind === 'matched') {
                    const dir = r.delta > 0 ? 'up' : r.delta < 0 ? 'down' : 'zero';
                    const pctTxt =
                      r.pct === null
                        ? 'n/a'
                        : `${r.pct > 0 ? '+' : ''}${(Math.round(r.pct * 10) / 10).toFixed(1)}%`;
                    const sr =
                      r.delta === 0
                        ? 'No change.'
                        : `${r.delta > 0 ? 'Increase' : 'Decrease'} of KES ${num(Math.abs(r.delta))}${r.pct === null ? ', no percentage because the previous value was zero' : `, ${Math.abs(Math.round(r.pct))} percent`}.`;
                    const big = r.pct !== null && Math.abs(r.pct) >= 25;
                    return `<tr class="${big ? 'big' : ''}">${label}<td>${num(r.prev)}</td><td>${num(r.cur)}</td><td class="${dir}"><span aria-hidden="true">${r.delta === 0 ? '0' : signed(r.delta)}</span><span class="sr">${sr}</span></td><td class="pctc ${dir}" ${r.pct === null ? 'data-tip="No percentage: the previous value was zero" tabindex="0"' : ''}><span aria-hidden="true">${r.delta === 0 ? '0.0%' : pctTxt}</span></td><td class="lab">${badge('Matched', 'ok')}${big ? `<div class="small muted" style="margin-top:3px">${r.it.changed ? 'Marked as changed' : 'Not marked'}</div>` : ''}</td></tr>`;
                  }
                  if (r.kind === 'onlyCurrent')
                    return `<tr class="only">${label}<td class="zero">-</td><td>${num(r.cur)}</td><td class="up"><span aria-hidden="true">${signed(r.cur)}</span><span class="sr">New item worth KES ${num(r.cur)}.</span></td><td class="zero">n/a</td><td class="lab">${badge('Unmatched', 'warn')}<div class="small muted" style="margin-top:3px">Only in version ${curN} · ${r.it.acquired ? 'marked as acquired' : 'not marked'}</div></td></tr>`;
                  return `<tr class="only">${label}<td>${num(r.prev)}</td><td class="zero">-</td><td class="down"><span aria-hidden="true">${signed(-r.prev)}</span><span class="sr">Item no longer declared, previously KES ${num(r.prev)}.</span></td><td class="zero">n/a</td><td class="lab">${badge('Unmatched', 'warn')}<div class="small muted" style="margin-top:3px">Not in current version · not marked</div></td></tr>`;
                })
                .join('')
            );
          })
          .join('');
        return `<table class="diff"><caption class="sr">Changes for ${esc(stmt.pp.name)} between version ${prevN} and version ${curN}</caption><thead><tr><th scope="col">Item</th><th scope="col">Version ${prevN} (KES)</th><th scope="col">Version ${curN} (KES)</th><th scope="col">Change (KES)</th><th scope="col">%</th><th scope="col" style="text-align:left">Match</th></tr></thead><tbody>${body}</tbody></table>`;
      }
      function compareView(c) {
        if (!(c.currentVersion > 1 || c.hasPrevious))
          return `<div class="decl-card">${versionTools(c)}${empty('Nothing to compare', 'This is the first declaration on Adili for this person.', { icon: 'compare' })}</div>`;
        const prevN = c.currentVersion - 1 || 1;
        const data = diffData(c);
        const nMatched = data.reduce(
          (a, s) => a + s.rows.filter((r) => r.kind === 'matched').length,
          0,
        );
        const nBig = data.reduce(
          (a, s) =>
            a +
            s.rows.filter((r) => r.kind === 'matched' && r.pct !== null && Math.abs(r.pct) >= 25)
              .length,
          0,
        );
        const nOnly = data.reduce(
          (a, s) => a + s.rows.filter((r) => r.kind !== 'matched').length,
          0,
        );
        return `<div class="decl-card">${versionTools(c)}
    <div class="dsec"><div class="row wrap" style="gap:8px">${badge(`${nMatched} matched`, 'ok')}${badge(`${nBig} changed 25%+`, 'warn')}${badge(`${nOnly} in one version only`, 'warn')}<span class="spacer"></span><span class="small muted">v${prevN} ${fmtDate(c.versions[prevN - 1]?.at || c.received)} → v${c.currentVersion} ${fmtDate(c.versions[c.currentVersion - 1].at)}</span></div>
    <details class="help" style="margin-top:10px"><summary>${icon('help', 16)} How items are matched<span class="chev">${icon('down', 16)}</span></summary><div class="body">Items are matched by person, category, type and description. "Not marked" means the declarant did not mark the change, acquisition or disposal. Changes of 25% or more are shaded.</div></details></div>
    ${data.map((s) => `<div class="dsec"><h2><span class="avatar sm ${s.pp.kind}">${s.pp.initials}</span>${esc(s.pp.name)} <span class="small muted" style="font-weight:400">${s.pp.rel}</span></h2>${s.rows.length ? `<div style="overflow-x:auto;margin:0 -4px">${diffTable(s, prevN, c.currentVersion, c)}</div>` : '<p class="small muted">Nil declared in both versions</p>'}</div>`).join('')}
  </div>`;
      }

      /* ---------- Flags tab ---------- */
      function flagCard(c, f, { inRegistry = false } = {}) {
        const doc = docFor(c);
        const conc = f.refs
          .map((r) =>
            r.item
              ? itemLabel(doc, r.item)
              : `${r.section} · ${doc.persons.find((p) => p.key === r.person)?.name}`,
          )
          .join('; ');
        const canGo = f.refs.some((r) => r.item) || (f.sys && !inRegistry);
        if (f.closed)
          return `<div class="flag closed s-${f.sev}" id="flag-${f.id}"><div class="row" style="gap:8px">${sevb(f.sev)}<span class="t">${esc(f.title)}</span></div><div class="small muted">Closed by re-check on ${fmtDate(f.closed.at)}: the registry no longer shows this.</div></div>`;
        if (f.reviewed) {
          return `<div class="flag reviewed s-${f.sev}" id="flag-${f.id}"><div class="row" style="gap:8px;flex-wrap:wrap"><span style="color:var(--ok);display:flex">${icon('check', 16, 2.4)}</span><span class="t">${esc(f.title)}</span>${sevb(f.sev)}${f.recomputed ? `<span class="badge" data-tip="Kept after version ${c.currentVersion} was processed. Your note stays with it." tabindex="0">Recomputed</span>` : ''}</div><div class="revnote"><div class="by">Reviewed by ${esc(OFF[f.reviewed.by].name)} on ${fmtDate(f.reviewed.at)}</div>${esc(f.reviewed.note)}</div></div>`;
        }
        const form = S.flagForm === f.id;
        return `<div class="flag s-${f.sev} ${S.pulse === f.id ? 'pulse' : ''}" id="flag-${f.id}">
    <div class="row" style="gap:8px;align-items:flex-start"><div style="flex:1;min-width:0"><div class="t">${esc(f.title)} ${Kit.tip(f.ind, { label: 'About this indicator' })}</div></div>${f.sys ? `<span class="badge">${SYS[f.sys].l}</span>` : ''}${f.recomputed ? badge('Recomputed') : ''}</div>
    <div class="ev">${icon('hash', 14)}<span><span class="sr">Evidence: </span>${esc(f.ev)}</span></div>
    <div class="conc">${esc(conc)}</div>
    ${
      form
        ? `<div class="field" style="margin-top:4px"><label class="label" for="flagnote">What did you conclude?</label><textarea id="flagnote" class="textarea" rows="3" maxlength="1000" data-bind="flagNote" placeholder="For example: valuation report attached explains the increase">${esc(S.flagNote)}</textarea>${S.flagErr ? `<div class="ferr">${icon('alert', 14)} ${S.flagErr}</div>` : ''}<div class="row" style="gap:8px;justify-content:flex-end"><button class="btn btn-ghost btn-sm" data-act="cancelFlag">Cancel</button><button class="btn btn-primary btn-sm" data-act="saveFlag" data-arg="${f.id}">Mark reviewed</button></div></div>`
        : `<div class="foot">${canGo ? `<button class="btn btn-secondary btn-xs" data-act="goItem" data-arg="${f.id}">${icon(f.refs.some((r) => r.item) ? 'arrowRight' : 'shield', 13)} ${f.refs.some((r) => r.item) ? 'Go to item' : 'Show registry record'}</button>` : ''}<button class="btn btn-ghost btn-xs" data-act="openFlag" data-arg="${f.id}">${icon('check', 13)} Mark reviewed</button>${!inRegistry && ['ready', 'stale'].includes(cpStatus(c)) ? `<button class="btn btn-ghost btn-xs" style="color:var(--ai)" data-act="explainFlag" data-arg="${f.id}">${icon('sparkles', 13)} Explain</button>` : ''}</div>`
    }
  </div>`;
      }
      function flagsTab(c) {
        const list = c.flags;
        if (!list.length)
          return `<div class="ind-banner">${icon('info', 16)}<span>Flags are indicators to guide your review. They are not findings.</span></div>${empty('No indicators', 'The checks found nothing to point out.', { icon: 'flag' })}`;
        const open = list.filter((f) => !f.reviewed && !f.closed);
        const rev = list.filter((f) => f.reviewed);
        const closed = list.filter((f) => f.closed);
        const groups = ['high', 'medium', 'low', 'info']
          .map((s) => [s, open.filter((f) => f.sev === s)])
          .filter(([, a]) => a.length);
        return `<div class="ind-banner">${icon('info', 16)}<span>Flags are indicators to guide your review. They are not findings.</span></div>
    <div class="row wrap" style="gap:8px"><span class="small muted">${num(open.length)} open · ${rev.length} reviewed${closed.length ? ` · ${closed.length} closed` : ''}</span><span class="spacer"></span><span class="small muted row" style="gap:5px" tabindex="0" data-tip="Severity points: info 0, low 1, medium 3, high 7. Total below 3 is low priority, 3 to 9 medium, 10 or more high. ${IND_TIP}">${icon('help', 14)} How priority is set</span></div>
    ${groups.map(([s, a]) => `<div class="fgroup-h">${sevb(s)} <span>${a.length}</span></div>${a.map((f) => flagCard(c, f)).join('')}`).join('')}
    ${rev.length ? `<div class="fgroup-h" style="margin-top:8px">${icon('check', 14)} Reviewed ${rev.length}</div>${rev.map((f) => flagCard(c, f)).join('')}` : ''}
    ${closed.length ? `<div class="fgroup-h" style="margin-top:8px">Closed by re-check ${closed.length}</div>${closed.map((f) => flagCard(c, f)).join('')}` : ''}`;
      }

      /* ---------- Registry tab (#185, #188) ---------- */
      const RSTAT = {
        matched: ['Matched', 'ok'],
        mismatched: ['Mismatched', 'warn'],
        unavailable: ['Unavailable', ''],
        'not-checked': ['Not checked', ''],
        'no-id': ['No national ID declared', ''],
      };
      function rowCopy(s, person) {
        if (s.status === 'matched')
          return s.sys === 'kra'
            ? 'PIN on record, compliant, income within 25%'
            : s.rows.length
              ? `${plural(s.rows.length, 'record')}, all declared`
              : 'No records found';
        if (s.status === 'mismatched') return `${plural(s.flags.length, 'indicator')}`;
        if (s.status === 'unavailable')
          return `Could not reach ${SYS[s.sys].l}. Re-checked automatically every hour.`;
        if (s.status === 'not-checked') return 'Checks run after submission.';
        return `Registries cannot be checked for ${person.name.split(' ')[0]} without an ID.`;
      }
      // SystemStatusRow
      function sysRow(c, person, s, { checking = false } = {}) {
        const key = person.key + '-' + s.sys;
        const open = !!S.regOpen[key];
        const expandable = ['matched', 'mismatched'].includes(s.status) && c.reg.state !== 'error';
        const [bl, bk] = RSTAT[s.status];
        const tag = expandable ? 'button' : 'div';
        return `<div class="sysrow"><${tag} class="srow" ${expandable ? `aria-expanded="${open}" aria-controls="exp-${key}" data-act="regToggle" data-arg="${key}"` : ''}>
    <span class="sico">${icon(SYS[s.sys].ic, 15)}</span>
    <span style="min-width:0"><span class="sn" title="${SYS[s.sys].d}">${SYS[s.sys].l}</span><div class="sc">${checking ? '<span class="checking"><span class="spinner dark" style="width:12px;height:12px"></span>Checking…</span>' : `<span style="color:var(--ink-2)">${esc(rowCopy(s, person))}</span>${s.at && s.at !== c.reg?.checkedAt ? `<br/>Checked ${fmtDateTime(s.at)}` : ''}`}</div></span>
    <span>${checking ? '' : badge((s.status === 'mismatched' ? icon('alert', 12, 2.2) + ' ' : s.status === 'matched' ? icon('check', 12, 2.6) + ' ' : '') + bl, bk)}</span>
    <span class="chev">${expandable ? icon('down', 16) : ''}</span></${tag}>
    ${
      expandable && open
        ? `<div class="exp" id="exp-${key}">${matchTable(c, s)}${s.flags
            .map((fid) => {
              const f = c.flags.find((x) => x.id === fid);
              return f ? flagCard(c, f, { inRegistry: true }) : '';
            })
            .join('')}</div>`
        : ''
    }
  </div>`;
      }
      // MatchTable
      function matchTable(c, s) {
        const doc = docFor(c);
        if (s.sys === 'kra')
          return `<table class="mt"><caption class="sr">KRA record compared with the declaration. Income is shown as a percentage only.</caption><thead><tr><th scope="col">KRA record</th><th scope="col">Compared with the declaration</th></tr></thead><tbody>
    <tr><th scope="row">PIN</th><td>${s.kra.pin === 'On record' ? `${badge(icon('check', 12, 2.6) + ' On record', 'ok')}` : badge('No PIN for this ID', 'warn')}</td></tr>
    <tr><th scope="row">Tax compliance</th><td>${s.kra.comp === 'Compliant' ? badge('Compliant', 'ok') : badge(s.kra.comp, 'warn')} ${s.kra.valid ? `<span class="small muted">certificate valid until ${s.kra.valid}</span>` : '<span class="small muted">no valid compliance certificate</span>'}</td></tr>
    <tr><th scope="row">Income declared to KRA</th><td>${s.kra.diff >= 25 ? `<span style="color:var(--warn);font-weight:600">KRA-declared income differs by ${s.kra.diff}% from the income declared here.</span>` : `KRA-declared income differs by ${s.kra.diff}% from the income declared here.`}</td></tr></tbody></table>`;
        if (!s.rows.length)
          return `<p class="small muted">${SYS[s.sys].l} has no records for this person.</p>`;
        const REL = {
          matched: badge('Matched', 'ok'),
          'not-declared': badge('Not declared', 'warn'),
          'not-in-registry': badge('Not in registry', 'warn'),
        };
        return `<table class="mt"><caption class="sr">${SYS[s.sys].l} records beside the declared items</caption><thead><tr><th scope="col">${SYS[s.sys].l} record</th><th scope="col">Declared item</th></tr></thead><tbody>${s.rows
          .map((r) => {
            const it = r.item ? findItem(doc, r.item) : null;
            return `<tr><th scope="row">${r.rel === 'not-in-registry' ? `<span class="muted">No record for ${esc(r.rec)}</span>` : esc(r.rec)}<div class="d">${esc(r.rel === 'not-in-registry' ? 'BRS has no company with this registration number' : r.sub)}</div>${r.supplier ? `<div style="margin-top:4px">${badge(icon('alert', 12, 2.2) + ' On the KEMSA supplier list', 'danger')}</div>` : ''}</th><td>${it ? `<div style="font-weight:500">${esc(it.it.type)}</div><div class="d">${esc(it.it.desc)}</div>` : ''}<div style="margin-top:${it ? 4 : 0}px">${REL[r.rel]}</div>${it ? `<button class="linkish small" style="margin-top:4px" data-act="goItemId" data-arg="${r.item}">Go to item</button>` : ''}</td></tr>`;
          })
          .join('')}</tbody></table>`;
      }
      function registryTab(c) {
        const canRecheck = mine(c) || sup();
        const running = S.recheck === 'running';
        const btn = `<button class="btn btn-secondary btn-sm" data-act="recheckDlg" ${!canRecheck || running || !c.reg || c.reg.state === 'none' ? 'disabled' : ''}>${running ? '<span class="spinner dark"></span> Checking…' : `${icon('refresh', 15)} Re-check`}</button>`;
        const head = `<div class="row wrap" style="gap:10px"><span class="small muted">${c.reg?.checkedAt ? `Last checked ${fmtDateTime(c.reg.checkedAt)}` : 'Not checked yet'}</span><span class="spacer"></span>${tipBtn(btn, 'Only the assigned reviewer or a supervisor can re-check the registries.', !canRecheck)}</div>
    ${S.recheck429 ? `<div class="callout callout-warn" role="alert">${icon('clock', 16)}<span>Re-checked recently. Try again in ${S.recheck429} minutes.</span></div>` : ''}`;
        if (!c.reg)
          return (
            head +
            `<div class="callout callout-info">${icon('info', 16)}<span>Prototype: open Wanjiku Njeri Kamau's case to see registry results.</span></div>`
          );
        if (c.reg.state === 'loading')
          return (
            head +
            `<div class="rperson">${Array.from({ length: 4 }, () => `<div class="sysrow"><div style="display:grid;grid-template-columns:30px 1fr 90px;gap:10px;padding:12px 14px;align-items:center"><span class="skeleton" style="height:30px;border-radius:8px"></span><span class="skeleton" style="width:70%"></span><span class="skeleton"></span></div></div>`).join('')}</div>`
          );
        if (c.reg.state === 'none')
          return (
            head +
            empty(
              'No national IDs declared',
              'Registries are checked by national ID. None was declared for this household.',
              { icon: 'shield' },
            )
          );
        const err =
          c.reg.state === 'error'
            ? `<div class="callout callout-warn" role="alert">${icon('wifiOff', 16)}<div style="flex:1">Registry records could not be loaded. Status is shown from the last check.</div><button class="btn btn-ghost btn-xs" data-act="regRetry">Try again</button></div>`
            : '';
        const people = c.reg.persons
          .map(
            (p) =>
              `<div class="rperson"><div class="rperson-h"><span class="avatar sm ${p.key === 'self' ? '' : p.key.startsWith('sp') ? 'spouse' : 'child'}">${p.name.split(' ')[0][0]}${p.name.split(' ').slice(-1)[0][0]}</span><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">${esc(p.name)}</div><div class="small muted">${p.rel}</div></div>${p.hasId ? '' : badge('No national ID declared')}</div>${p.hasId ? p.systems.map((s) => sysRow(c, p, s, { checking: running })).join('') : `<div class="sysrow"><div class="srow" style="grid-template-columns:1fr"><span class="sc" style="margin:0">${esc(rowCopy({ status: 'no-id' }, p))}</span></div></div>`}</div>`,
          )
          .join('');
        return head + err + people;
      }

      /* ---------- Clarifications tab (#170) ---------- */
      function clarTab(c) {
        const list = S.clars.filter((k) => k.caseId === c.id);
        const my = mine(c);
        const wOpen = windowOpen(c);
        const reason = !my
          ? c.assignee
            ? `Only ${OFF[c.assignee].name}, who holds this case, can issue clarifications.`
            : 'Claim this case to issue a clarification.'
          : !wOpen
            ? `The clarification window closed on ${fmtDate(c.windowEnds)}.`

      /* ============================== ACTIONS ============================== */
      let clrSeq = 452;

      };
      function logTl(c, kind, text, tone = '') {

      }
      function setCaseStatus(c) {
        const open = S.clars.filter(
          (k) => k.caseId === c.id && ['issued', 'responded', 'overdue'].includes(k.status),
        );
        c.clar.open = open.length;
        const last = S.clars.filter((k) => k.caseId === c.id && k.status !== 'draft').slice(-1)[0];
        c.clar.status = open[0]?.status || last?.status || null;
        c.clar.dueAt = open[0]?.dueAt || null;
        if (open.length) c.status = 'awaiting-clarification';
        else if (c.status === 'awaiting-clarification') {
          c.status = 'ready-for-determination';
          logTl(
            c,
            'check',
            'No clarification open · case clarified, then ready for determination',
            'ok',
          );
        }
      }
      function openCaseFn(id, { tab = 'flags' } = {}) {
        S.caseId = id;
        S.tab = tab;
        S.compare = false;
        S.viewVersion = null;
        S.caseState = 'ok';
        S.flagForm = null;
        S.recheck429 = null;
        S.mview = tab === 'flags' ? 'decl' : 'review';
        S.hl = null;
        const c = cur();
        c.views = (c.views || 0) + 1;
        S.flash = null;
        Kit.go('case');
      }
      function scrollToEl(id) {
        S.scrollTo = id;
      }
      const actions = {
        qPage: (n) => {
          S.qPage = +n;
          Kit.render();
          document.querySelector('.q-toolbar')?.scrollIntoView({ block: 'start' });
        },
        clarPage: (n) => {
          S.clarPage = +n;
          Kit.render();
        },
        toggleF: (k) => {
          S.qPage = 1;
          S.f[k] = !S.f[k];
          Kit.render();
        },
        clearF: () => {
          S.qPage = 1;
          S.f = { ...FDEF };
          Kit.render();
        },
        tile: (k) => {
          const m = {
            u: { status: 'unassigned' },
            m: { assignee: 'mine' },
            a: { status: 'awaiting-clarification' },
            r: { status: 'ready-for-determination' },
          }[k];
          const on = Object.entries(m).every(([a, b]) => S.f[a] === b);
          S.f = { ...FDEF, q: S.f.q, ...(on ? {} : m) };
          S.qPage = 1;
          Kit.render();
        },
        retryQueue: () => {
          S.qState = 'loading';
          Kit.render();
          setTimeout(() => {
            S.qState = 'ok';
            Kit.render();
          }, 900);
        },
        goOverdue: () => {

          Kit.go('clarifications');
        },
        openCase: (id) => openCaseFn(id),
        claim: (id) => {
          const c = caseOf(id);

            c.status = 'assigned';
            c.history.push(c.raceClaimBy);
            delete c.raceClaimBy;

            return;
          }

        doClaim: (id) => {

          S.flash = c.id;
          Kit.toast('Case claimed. You hold it now.');
        },
        releaseDlg: (id) => {
          S.modal = { kind: 'release', id };
          Kit.render();
        },
        doRelease: (id) => {

          logTl(c, 'userX', `Released by ${ME().name}`);
          c.assignee = null;
          if (c.status === 'assigned') c.status = 'unassigned';
          S.modal = null;
          Kit.toast('Case released to the queue');

        reassignDlg: (id) => {

            c,
            'swap',

          S.noteErr = '';

        },
        attLink: (id) => {

          }, 800);

        regToggle: (k) => {

          setTimeout(() => {
            c.reg.state = 'ok';
            Kit.render();
          }, 900);
        },
        recheckDlg: () => {
          if (S.recheckAt && Date.now() - S.recheckAt < 600000) {
            S.recheck429 = Math.max(1, 10 - Math.floor((Date.now() - S.recheckAt) / 60000));

            return;
          }
          S.recheck429 = null;
          S.modal = { kind: 'recheck' };
          Kit.render();
        },
        doRecheck: () => {
          const c = cur();
          S.modal = null;
          S.recheck = 'running';
          Kit.render();
          setTimeout(() => {
            const d = c.reg.persons.find((p) => p.key === 'sp1');
            const a = d?.systems.find((s) => s.sys === 'ardhisasa');

              a.status = 'matched';
              a.rows = [];
            }
            c.reg.persons.forEach((p) =>
              p.systems.forEach((s) => {
                if (s.at) s.at = NOW;

            );
            c.reg.checkedAt = NOW;
            c.regUnavail = false;
            logTl(
              c,
              'shield',
              `Registries re-checked by ${ME().name}: ArdhiSasa now reachable for David Mwangi Kamau`,

            S.recheck = 'idle';

            if (S.aiEnabled) {

            Kit.toast('Registry checks updated');
          }, 2200);
        },
        newClar: () => {
          S.comp = {
            caseId: S.caseId,

          S.comp.picker = null;
          Kit.render();
        },

          S.comp.picker = null;
          Kit.render();

            k = {
              id: Kit.id('k'),
              caseId: c.id,

              status: 'draft',
              by: ME().subject,
              createdAt: NOW,
              issuedAt: null,
              dueAt: null,
              respondedAt: null,

              letter: null,
              items: [],

            .filter((x) => x.label || x.text)

          setTimeout(() => {
            const comp = S.comp;

      tipEl.className = 'ftip';
      tipEl.setAttribute('role', 'tooltip');
      tipEl.id = 'ftip';
      document.body.appendChild(tipEl);
      function showTip(t) {
        tipEl.textContent = t.dataset.tip;
        tipEl.style.display = 'block';
        const r = t.getBoundingClientRect();
        const w = tipEl.offsetWidth,
          h = tipEl.offsetHeight;
        let x = r.left + r.width / 2 - w / 2;
        x = Math.max(8, Math.min(x, innerWidth - w - 8));
        let y = r.top - h - 8;
        if (y < 8) y = r.bottom + 8;
        tipEl.style.left = x + 'px';
        tipEl.style.top = y + 'px';
      }
      const hideTip = () => (tipEl.style.display = 'none');
      document.addEventListener('mouseover', (e) => {
        const t = e.target.closest?.('[data-tip]');
        if (t && t.dataset.tip) showTip(t);
        else hideTip();
      });
      document.addEventListener('focusin', (e) => {
        const t = e.target.closest?.('[data-tip]');
        if (t && t.dataset.tip) showTip(t);
        else hideTip();
      });
      document.addEventListener('scroll', hideTip, true);

      document.addEventListener('pointerdown', (e) => {
        const h = e.target.closest('.rs-handle');
        if (!h) return;
        e.preventDefault();
        const grid = h.parentElement;
        drag = { h, grid, demo: !!h.dataset.demo };
        h.classList.add('drag');
        h.setPointerCapture?.(e.pointerId);
      });
      document.addEventListener('pointermove', (e) => {
        if (!drag) return;
        const r = drag.grid.getBoundingClientRect();
        if (drag.demo) {
          const w = Math.max(140, Math.min(400, r.right - e.clientX));
          S.demoSide = Math.round(w);
          drag.grid.style.setProperty('--dside', w + 'px');
          drag.h.setAttribute('aria-valuenow', Math.round(w));
          return;
        }
        const w = Math.max(340, Math.min(720, r.right - e.clientX - 8));
        S.sideW = Math.round(w);
        drag.grid.style.setProperty('--side', w + 'px');
        drag.h.setAttribute('aria-valuenow', Math.round(w));
      });
      document.addEventListener('pointerup', () => {
        if (drag) {
          drag.h.classList.remove('drag');

                const ok = !q || li.textContent.toLowerCase().includes(q);
                li.hidden = !ok;
                any = any || ok;
              }

                vis = false;

                if (!n.hidden) vis = true;
                n = n.nextElementSibling;
              }
              g.hidden = !vis;
            });
